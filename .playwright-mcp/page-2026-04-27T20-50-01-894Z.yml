          - generic [ref=e291]:
            - generic [ref=e292]: 10 a.m. Explore a seaside castle and garden
            - paragraph [ref=e294]:
              - text: If you’ve spent the night in Begur,
              - link "Fitzroy Café" [ref=e295] [cursor=pointer]:
                - /url: https://fitzroycafe.com/
              - text: makes for an excellent breakfast spot to have a bowl of housemade granola (€6) or a stack of banana pancakes (€9) before hitting the road about eight miles south.
              - link "Jardins de Cap Roig" [ref=e296] [cursor=pointer]:
                - /url: https://costabrava.org/en/experiencia/self-guided-visit-to-the-cap-roig-gardens/
              - text: ", a botanic garden with clifftop views and more than 800 different plant species, dates back to 1927, when the Russian colonel Nicolai Woevodsky and his wife, English aristocrat Dorothy Webster, set about creating their dream home on a plot above El Golfet beach. Woevodsky designed the house in the style of a medieval castle, while Webster took charge of the garden. The result is a technicolor spread of roses and oleander bushes shaded by towering palm trees that is today open to visitors for an entry price of €12."
