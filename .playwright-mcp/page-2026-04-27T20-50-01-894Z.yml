          - generic [ref=e174]:
            - generic [ref=e175]: 7 p.m. Drink with Dalí and Duchamp
            - paragraph [ref=e177]:
              - text: On the golden sand of Cadaqués’s central Platja Gran beach stands
              - link "Marítim Bar," [ref=e178] [cursor=pointer]:
                - /url: https://www.instagram.com/maritimbarcadaques/?hl=en
              - text: an institution since 1935. For much of its history, the bar was a magnet for artists and intellectuals — according to local lore Dalí (who lived in neighbouring Port Lligat) would dock his boat directly at the terrace, and Marcel Duchamp played chess there. Gabriel García Márquez even name-checked Bar Marítim in his short story “Tramontana.” Today, it’s run by third-generation owners and its wooden structure is furnished with bentwood furniture and faded photographs documenting some of the famous faces who have dropped in over the years. Outside, its wide wooden deck makes for a perfect spot for an ice-cold Turia beer (3.90 euros, or about $4.50) at golden hour.
