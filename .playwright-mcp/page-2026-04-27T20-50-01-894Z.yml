            - paragraph [ref=e160]:
              - text: The town of Cadaqués sits at the tip of a rugged peninsula called Cap de Creus, toward the northernmost end of the Costa Brava, and is accessible only by a winding road that curves across steep, wind-swept hillsides. It’s a postcard-perfect blend of whitewashed houses and bougainvillea-strung alleyways dotted with stylish boutiques.
              - link "Pepa" [ref=e161] [cursor=pointer]:
                - /url: https://www.pepacadaques.com/en
              - text: ", a chic seafront store, has been styling the town’s best-dressed since the 1970s. Today, it stocks Catalan brands like"
              - link "La Veste" [ref=e162] [cursor=pointer]:
                - /url: https://lavestelaveste.com/
              - text: (Barcelona-based producers of brightly coloured clothing made from terrycloth) and hand-crocheted headwear from
              - link "Pardohats" [ref=e163] [cursor=pointer]:
                - /url: https://pardohats.com/
              - text: — alongside international big-hitters like
              - link "Jacquemus" [ref=e164] [cursor=pointer]:
                - /url: https://www.jacquemus.com/en_gr
              - text: and
              - link "Acne Studios" [ref=e165] [cursor=pointer]:
                - /url: https://lavestelaveste.com/
              - text: . Local brand
              - link "Polonio" [ref=e166] [cursor=pointer]:
                - /url: https://www.thepolonio.com/
              - text: also has two shops in the town, stocking its own range of colorfully printed swimwear as well as a summery selection of floaty dresses and cotton shirts.
          - generic [ref=e168]:
            - img "Mannequins in a shop wearing summery clothes including a printed bandana, a woven hat, a dress and a white linen shirt." [ref=e170]
