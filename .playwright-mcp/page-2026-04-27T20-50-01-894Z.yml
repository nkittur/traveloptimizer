                - text: By Hester Underhill
                - text: Photographs by Jonathan Stokes
            - time [ref=e66]: Sept. 4, 2025
          - paragraph [ref=e67]: The raw beauty of the Costa Brava, the “wild coast” region that runs about 100 miles along Spain’s northeastern corner, has long lured artists and intellectuals. The Surrealist artist Salvador Dalí lived in the small fishing village of Port Lligat, while Truman Capote wrote “In Cold Blood” in the town of Palamós. Today, a new generation of Catalan creatives is trading the bustle of Barcelona, 40 or so miles to the south, for a quieter life by the sea. In its wake, a host of stylish new guesthouses, shops and restaurants have begun springing up across the region, reenergizing its sleepy coastal towns. If you have just a weekend, consider spending a night each in the towns of Cadaqués and Begur and cruise the coast at your leisure.
