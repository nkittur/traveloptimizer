          - heading "Saturday" [level=2] [ref=e207]
          - generic [ref=e208]:
            - generic [ref=e209]: 9:30 a.m. Breakfast by the sea
            - paragraph [ref=e211]:
              - text: Start your day with a leisurely beachfront breakfast at
              - link "Bar Casino" [ref=e212] [cursor=pointer]:
                - /url: https://www.instagram.com/barcasinocadaques/
              - text: ", in a 19th century mansion with a facade adorned with portraits of famous explorers including Magellan and Columbus. The building never actually served as a gambling institution: “Casinos” were social clubs that sprung up across Catalonia in the 1800s, created to host all manner of public meetings and performances. Today, it’s a no-frills bar and cafe where €10 will get you a cup of coffee, a glass of freshly squeezed orange juice and a crusty bread roll (entrepà) stuffed with Ibérico ham. Pull up a chair on the terrace to enjoy your breakfast with a view over the shimmering bay and its gently bobbing wooden fishing boats (known as llauts)."
          - generic [ref=e214]:
            - img "A baguette sandwich with ham and cheese. A coffee and an orange juice sits beside it on a marble-patterned table." [ref=e216]
            - paragraph [ref=e219]: Bar Casino
          - generic [ref=e220]:
            - generic [ref=e221]: 10:30 a.m. Tour the surreal
            - paragraph [ref=e223]:
              - text: In 1930, Salvador Dalí bought a small fisherman’s hut in the small village of Port Lligat, about a 15-minute walk from Cadaqués. He wrote about the Costa Brava’s distinctive beauty and depicted its craggy shorelines in his Surrealist scenes. Over the decades, he bought up various adjoining huts and linked them to create a labyrinthine network of elaborately decorated rooms — complete with taxidermied swans (once Dalí’s pets), a penis-shaped swimming pool and antique curios like ornate bird cages, Japanese paper parasols and an enormous lighthouse lamp. Today, the only way to see inside the property, called
              - link "Salvador Dalí House Museum" [ref=e224] [cursor=pointer]:
                - /url: https://www.salvador-dali.org/en/visit/salvador-dali-house-museum/
              - text: ", is to book a tour. Guides lead small groups, offering insight into the eccentric furnishings in English, Spanish or Catalan. Tickets start at €15; reserve well in advance."
          - generic [ref=e226]:
            - img "A statue of a man in a suit with his legs crossed on display in a beach area." [ref=e228]
            - paragraph [ref=e231]: A statue of Salvador Dalí in Cadaqués.
          - generic [ref=e232]:
            - generic [ref=e233]: 12 p.m. Chill for vermouth hour
            - paragraph [ref=e235]:
              - text: Time to hit the road. Drive about an hour south along the Bay of Roses, along the inland perimeter of
              - link "Aigüamolls de l'Empordà Natural Park" [ref=e236] [cursor=pointer]:
                - /url: https://www.spain.info/en/nature/aiguamolls-emporda-natural-park/
              - text: — an area of protected wetland where you might even spot the odd gaggle of flamingoes — to reach L’Escala, a seaside town famed for producing salt-cured anchovies. Sample these at
              - link "Ultramar" [ref=e237] [cursor=pointer]:
                - /url: https://ultramarclub.com/restaurant/
              - text: ", a waterfront restaurant with panoramic views along the coast, where they’re served with pa amb tomàquet (crisp ciabatta-like bread topped with fresh tomato and olive oil) for €12.50. Between 12 p.m. and 2 p.m. is"
              - link "l’hora del vermut" [ref=e238] [cursor=pointer]:
                - /url: https://www.nytimes.com/2023/07/20/dining/drinks/vermouth.html
              - text: (vermouth hour), when locals gather for a pre-lunch glass of this sweet fortified wine — served over ice and garnished with a slice of orange and an olive. Ultramar has more than 20 varieties of vermouth on the menu.
          - generic [ref=e240]:
            - img "A restaurant table with a bowl of sliced white meat with sauce and caperberries. Behind it are anchovies, clipped onto a line with clothespegs, over some slices of bread." [ref=e242]
            - paragraph [ref=e245]: Ultramar
          - generic [ref=e246]:
            - generic [ref=e247]: 3 p.m. Hike along the beach
            - paragraph [ref=e249]:
              - text: With its wide expanse of golden sand lined with pine-studded promontories, Sa Riera beach, about a 45-minute drive south from L’Escala, is a scenic spot for a refreshing dip. It also makes for a good starting point to pick up the
              - link "Camí de Ronda" [ref=e250] [cursor=pointer]:
                - /url: https://www.camideronda.com/en/home.html
              - text: hiking trail; a system of footpaths once used by local fishermen that have been linked to form a walking route that stretches almost 90 miles along the Costa Brava. The well-maintained path comprises a series of dirt tracks, paved walkways and stone staircases that snake up and down rocky cliffs. The section between Sa Riera and Sa Tuna beach is particularly easy on the eye — it’s an hourlong walk each way, winding past small pebble beaches and secluded coves that make for peaceful swimming spots.
          - generic [ref=e252]:
            - img "A view over rocky cliffs onto a picturesque bay filled with people." [ref=e254]
            - paragraph [ref=e257]: Sa Riera Beach
          - generic [ref=e258]:
            - generic [ref=e259]: 6 p.m. Take in the view atop medieval ruins
            - paragraph [ref=e261]:
              - text: It’s a short (but steep) drive uphill from Sa Riera to the town of Begur — a maze of narrow lanes, dotted with 19th century mansions known as casas indianas. These were built by residents of Begur who left Spain to make their fortunes in Cuba. Upon their return to Catalonia, they commissioned stately villas in the classic colonial styles popular in Havana — with brightly painted facades, grand balconies and lush interior courtyards. The most notable remnant of the town’s medieval past is the hilltop stone fortress (
              - link "Castell de Begur" [ref=e262] [cursor=pointer]:
                - /url: https://www.visitacostabrava.com/en/begur/what-to-visit/retreats/begur-castle
              - text: ), built in the 11th century to protect from marauding pirates. From the center of the town, a signposted path leads up to the ruins (free to visit). At the top are expansive views across the coast, all the way to the Pyrenees in the north.
          - generic [ref=e264]:
            - img "Two people walk up a narrow outdoor staircase, with greenery growing on the walls, between homes." [ref=e266]
            - paragraph [ref=e269]: Begur
          - generic [ref=e270]:
            - generic [ref=e271]: 8 p.m. Share in a home-style, wood-fired meal
            - paragraph [ref=e273]:
              - text: For traditional Catalan cuisine, head to Begur’s
              - link "Casa Juanita" [ref=e274] [cursor=pointer]:
                - /url: https://casajuanita.cat/
              - text: . The beloved local institution’s unassuming interiors, housed inside a 17th-century stone building, are largely unchanged since the restaurant opened in 1978. In those early days, a single oak-fired oven served just three tables, surrounded by wine barrels. Over time, the wine cellars were cleared out to make room for more diners, and the menu expanded beyond simple seafood dishes to include grilled meats, fresh salads, and escalivada (vegetables slow-roasted in the ashes of the fireplace). Second-generation owner Jordi Barreda changes the menu seasonally and according to the local daily catch — still prepared in the oven Mr. Barreda’s father built by hand back in the 1970s. Expect to pay about €80 for dinner for two (including wine).
