            - img "People sit with drinks at an outdoor restaurant table overlooking a bay with boats." [ref=e182]
            - paragraph [ref=e185]: Marítim Bar
          - generic [ref=e186]:
            - generic [ref=e187]: 8 p.m. Eat modern Mediterranean, then hear live music
            - paragraph [ref=e189]:
              - link "Oli Bar" [ref=e190] [cursor=pointer]:
                - /url: https://olibarcadaques.com/oli-bar/
              - text: ", which opened in April, has given a stylish makeover to the cavernous interiors of a centuries-old oil mill on a side street in central Cadaqués. A horseshoe-shaped bar loops around the central open kitchen run by the Catalan chefs Vito Oliva and Monty Aguiló. An inventive array of small plates mixes a wide range of (mostly) Mediterranean influences; think oysters prepared in the French meunière style (pan-fried and soaked in lemon butter), large hunks of rosemary-studded focaccia and Ibérico pork tartare. Expect to pay about €100 for a meal for two, not including drinks. After dinner, it’s a short stroll along the seafront to"
              - link "Cafe de la Habana" [ref=e191] [cursor=pointer]:
                - /url: https://www.instagram.com/cafedelahabana.cadaques/?hl=en
              - text: ; a dimly lit bar popular with young locals that comes alive at the weekends with free live performances of Spanish guitar music.
