            - generic [ref=e179]: 1 p.m. Lunch at a modern institution
            - paragraph [ref=e181]:
              - text: After closing their acclaimed fine-dining restaurant, Trio, in 2011, the chefs Ola Rudin and Sebastian Persson decided to quit the Michelin rat race in favor of a healthy work-life balance. The result was
              - link "Saltimporten," [ref=e182] [cursor=pointer]:
                - /url: https://www.saltimporten.com/
              - text: a now-beloved canteen that is open only for weekday lunches. Located on an industrial pier about a 20-minute walk north from Malmo’s central train station, Saltimporten seats guests — many of whom work in the creative businesses nearby — at long, communal tables, and offers a single dish that changes daily (recently, it was braised ox cheek with beets and currants), as well as a vegetarian alternative, made with ingredients from regional farms. Lunch about 135 sek, or $13, per person.
          - img "Diners sit at benches alongside a long wooden table in a dining hall space." [ref=e186]
          - generic [ref=e187]:
            - generic [ref=e188]: 3 p.m. Tour Malmo’s historic heart
            - paragraph [ref=e190]:
              - text: Malmo’s old town radiates around two lively squares, the imaginatively labeled Stortorget (the Big Square) and Lilla Torg (Little Square). The larger is dominated at one end by a 16th-century town hall, which owes its red-brick facade and ornate gables to an 1860s facelift. A few doors down is the late-19th-century Apoteket Lejonet, Sweden’s oldest pharmacy, with handsome woodwork and antique medicine jars. A half-timbered farmhouse on Lilla Torg houses the
              - link "Form/Design Center" [ref=e191] [cursor=pointer]:
                - /url: https://formdesigncenter.com/en
              - text: ", with eclectic temporary exhibitions that focus on architecture and craft (free general entry; main exhibition ticket, 50 sek). The surrounding cobblestone streets, lined with low, pastel-colored houses and dotted with alluring handicraft shops, like"
              - link "Formargruppen" [ref=e192] [cursor=pointer]:
                - /url: http://formargruppen.se
              - text: ", and the occasional natural wine bar, like the charming"
              - link "Julie" [ref=e193] [cursor=pointer]:
                - /url: https://juliemalmo.se/
              - text: ", show how Malmo residents lived before they went in for blocky postwar housing."
          - generic [ref=e195]:
            - img "The inside of a store with a grand interior — there are ornate wood carvings, ironwork and an old-fashioned clockface." [ref=e197]
            - paragraph [ref=e200]: Apoteket Lejonet
          - generic [ref=e201]:
            - generic [ref=e202]: 8 p.m. Enjoy a harborside meal cooked over an open fire
            - paragraph [ref=e204]:
              - text: Part of what gives Malmo its distinctive feel is the harbor that cuts deep into the city's northern end. Much of the area is still quite industrial, but its western edge is gradually acquiring new residential and commercial life.
              - link "Aster" [ref=e205] [cursor=pointer]:
                - /url: https://www.astermalmo.se/
              - text: ", which opened amid warehouses in the Varvstaden district in 2021, is a big reason to visit. Its inviting outdoor patio is the perfect way to while away a fall evening, sipping natural wines and working through a menu where most dishes, from the juicy grilled peaches atop an oozing plate of burrata, to the meaty tranche of hake with just-foraged chanterelles, to a flavorful hunk of lamb charred with piquillo peppers, has been cooked over open flames. Dinner for two, with wine, about 2,300 sek."
          - img "A plate that holds a piece of charred fish, sauce and some grilled vegetables. Next to the plate is a glass of red wine." [ref=e209]
