            - generic [ref=e220]: 9 a.m. People-watch with an espresso and a flaky croissant
            - paragraph [ref=e222]:
              - text: Caffeinate at
              - link "Solde" [ref=e223] [cursor=pointer]:
                - /url: https://www.solde.se/
              - text: ", just across from the hotels and shops of central Gustav Adolfs Square, a small, bare-bones coffee bar that roasts its own beans, pulls a masterful espresso and has an 80s-inflected playlist that forms the perfect soundtrack for people-watching through the shop’s big windows. It’s nearly as revered — including by some of the area’s best bakers — for its shatteringly flaky croissants, baked in house. Breakfast about 70 sek."
          - img "A tray of croissants on a counter. A person out of focus behind pours what looks like sugar into a metal bowl." [ref=e227]
          - generic [ref=e228]:
            - generic [ref=e229]: 10 a.m. Explore a fortress
            - paragraph [ref=e231]:
              - text: Malmohus Slott, a 17th-century citadel hunkered within a moat in the city center, is worth visiting just for its imposing architecture. But a slew of other diversions adds to its appeal. Inside the castle’s walls, the
              - link "Malmo Konstmuseum" [ref=e232] [cursor=pointer]:
                - /url: https://malmo.se/Uppleva-och-gora/Konst-och-museer/Malmo-Konstmuseum.html
              - text: (60 sek) houses an important collection of Scandinavian art, including a number of wistfully Nordic landscapes by the renowned Swedish artist Carl Frederik Hill, as well as a strong selection of early 20th-century Russian art. The vast surrounding park holds a chubby windmill, a bloom-filled organic garden, and meandering paths through the woods. And just across the street from the castle grounds, fishermen still sell the day's catch from a row of painted wooden huts, a remnant of Malmo's seafaring traditions.
          - generic [ref=e234]:
            - img "A wooden-plank walkway leading to a red brick, fortress-like building with an arched portal." [ref=e236]
            - paragraph [ref=e239]: Malmohus Slott
          - generic [ref=e240]:
            - generic [ref=e241]: 12 p.m. Take your tastebuds outside their comfort zone
            - paragraph [ref=e243]:
              - text: “Most people don’t throw up,” the attendant admitted to me as I entered the
              - link "Disgusting Food Museum" [ref=e244] [cursor=pointer]:
                - /url: https://disgustingfoodmuseum.com/
              - text: with a vomit bag that doubles as an entry ticket (220 sek). “But isn’t it better to be prepared?” The museum, in Malmo’s central old town, has
              - link "generated plenty of reactions" [ref=e245] [cursor=pointer]:
                - /url: https://www.newyorker.com/magazine/2021/05/17/the-gatekeepers-who-get-to-decide-what-food-is-disgusting
              - text: "(beyond just the bodily ones) since opening in 2018. But its displays of global delicacies, from Mongolian sheep eyeball juice to Sweden’s own surstromming, a fermented canned herring that has to be opened under water to control the odor, encourages you to think about your own response, too. The exhibition culminates in a tasting bar (optional, included in ticket) where the daring can sample the products. There is a message to this madness: between the Chinese rice wine with fermented baby mice and the crispy mopane worms from Botswana are Twinkies and root beer, a reminder that the line between disgusting and delicious is in the mouth of the beholder."
          - generic [ref=e246]:
            - generic [ref=e247]: 1 p.m. Snack on an English muffin, Swedish hot dog or falafel
            - paragraph [ref=e249]:
              - text: Continue the culinary odyssey at the nearby
              - link "Marvin" [ref=e250] [cursor=pointer]:
                - /url: https://www.instagram.com/marvinofmalmo/?hl=en
              - text: ", where the British transplant Matt Young serves spicy fried chicken in English muffins in summer, savory pies in winter, and fried mac-and-cheese nuggets and ice-cream sandwiches year-round, all housemade (lunch about 240 sek). For a more classic Malmo meal, head to"
              - link "Korvhuset" [ref=e251] [cursor=pointer]:
                - /url: https://www.korvhuset.com/
              - text: ", a block from the museum. The shop, which looks like a 1950s American diner, sells 101 varieties of sausage to cook at home, and also grills a smaller selection to eat on the spot, preferably accompanied by mashed potatoes. The House Special, a fat pork bratwurst of which Korvhuset’s owner says he sells over 6,000 a year, is a good choice, paired with an elderflower soda (around 100 sek for both). Or stroll 20 minutes east to"
              - link "V" [ref=e252] [cursor=pointer]:
                - /url: https://www.facebook.com/p/V%C3%A4rnhems-falafel-100077054742268/
              - link "a" [ref=e253] [cursor=pointer]:
