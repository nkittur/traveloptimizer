                - text: By Lisa Abend
                - text: Photographs by James Silverman
            - paragraph [ref=e60]: Lisa Abend is a freelance journalist based in Copenhagen.
            - time [ref=e61]: Sept. 19, 2024
          - paragraph [ref=e62]: Sweden’s third-largest city, a 40-minute train ride from Copenhagen across the Oresund Bridge, is used to being defined in relation to its neighbor. With its emphasis on sustainability and design, and abundant bicycles, it shares many attributes with the Danish capital. But its personality is distinctively its own. As a once-important port, Malmo retains a working-class feel. Its sizable immigrant population (a third of residents were born outside Sweden, many in the Middle East) has made it the falafel capital of Europe, and contributes to a burgeoning food scene that also draws inspiration from the Skane region’s fishing traditions and wealth of farms. And the nearly 25-year-old Oresund Bridge has helped, along with a favorable currency exchange, to revitalize the city, making it more accessible to the artists and chefs priced out of Copenhagen.
