            - generic [ref=e282]: 4 p.m. Snack like a Swede
            - paragraph [ref=e284]:
              - text: For many Swedes, fika — taking a break for coffee, cake and a spot of socializing — is practically a mandatory daily ritual. But the exact cakes involved are open to creative interpretation. At
              - link "Bageri Leve" [ref=e285] [cursor=pointer]:
                - /url: https://bagerileve.se/
              - text: ", a five-minute walk south from Davidshall, th"
              - link "e" [ref=e286] [cursor=pointer]:
                - /url: https://bagerileve.se/
              - text: redolent cardamom buns, though vegan, taste as buttery as the traditional version (on Fridays, locals line up for their special doughnut). A bit farther on,
              - link "Farina" [ref=e287] [cursor=pointer]:
                - /url: https://www.farinamalmo.se/
              - text: ", in the neighboring Mollevangen neighborhood, specializes in airy versions of the cream-filled Italian buns called maritozzi. Or stay in Davidshall and forgo the cake altogether in favor of"
              - link "Kold’s" [ref=e288] [cursor=pointer]:
                - /url: https://kold.co/
              - text: ice cream in inventive flavors like Vietnamese coffee and the caramel Dulce de Awesome.
          - generic [ref=e290]:
            - img "A display of baked treats that are topped with frosting and other garnishes." [ref=e292]
            - paragraph [ref=e295]: Bageri Leve
          - generic [ref=e296]:
            - generic [ref=e297]: 7 p.m. Dine where vegetables shine
            - paragraph [ref=e299]:
              - text: One of Malmo’s toughest reservations,
              - link "Lyran" [ref=e300] [cursor=pointer]:
                - /url: https://www.lyranmatbar.se/
              - text: ", in the Mollevangen district, rewards the effort. At both its ground-floor counter and in the cozy dining room below, the tiny bistro offers four different — and ever-changing — tasting menus: mixed, pescatarian, vegetarian and vegan (all 650 sek per person). Across all of them, the kitchen works special magic with its vegetable courses, including a surprisingly refreshing bowl of cabbage broth with impossibly sweet fresh corn, and charred leeks that melt into a pool of earthy puree. The relaxed, friendly service is perfectly gauged."
          - generic [ref=e301]:
            - generic [ref=e302]: 10 p.m. Pull up a stool at a local’s bar
            - paragraph [ref=e304]:
              - text: From Lyran, walk across Jesus Park to
              - link "Bar Kiosko" [ref=e305] [cursor=pointer]:
                - /url: https://barkiosko.se/
              - text: which, despite being only a couple of years old, feels like the long-standing neighborhood bar of your dreams. It boasts well-made Negronis and icy draft beers served from its curving wooden bar, a killer playlist, and a convivial atmosphere that makes you feel like you’re at a party with good friends. After, stroll over to
              - link "Folkets Park" [ref=e306] [cursor=pointer]:
                - /url: https://malmo.se/Folkets-Park.html?num=6
              - text: ", which, founded in 1893, is Sweden’s oldest “people’s park.” A green space intended as a refuge for Malmo’s working families, it today combines whimsical playgrounds, wading pools and a petting zoo, with a Moorish-inspired pavilion for"
              - link "cultural events" [ref=e307] [cursor=pointer]:
                - /url: https://moriskapaviljongen.se/
              - text: and other spaces clearly meant for adults.
              - link "Far i Hatten" [ref=e308] [cursor=pointer]:
                - /url: https://www.farihatten.se/
              - text: "is one of them: a restaurant and bar with occasional live music acts and a wine cellar far better than it needs to be."
          - generic [ref=e310]:
            - img "The exterior of a bar at nighttime. Tables are set up outside, and people can be seen drinking inside through the large windows. A glowing sign reads \"Kiosko.\"" [ref=e312]
            - paragraph [ref=e315]: Bar Kiosko
        - generic [ref=e316]:
          - img "An orange sky glows over a river in a park." [ref=e318]
          - paragraph [ref=e321]: Slottsparken, a historic park near the castle.
        - generic [ref=e322]: Advertisement
        - generic [ref=e323]:
          - heading "Sunday" [level=2] [ref=e324]
          - generic [ref=e325]:
            - generic [ref=e326]: 7:30 a.m. Breakfast between two squares
            - paragraph [ref=e328]: Centrally wedged between Stortorget and Lilla Torg, Ruths is an all-day favorite, serving crisp salads and house-cured charcuterie for lunch and a Mediterranean-inflected menu in the evening. But breakfast is where it really excels. Fuel up for what lies ahead with crunchy housemade granola, a luscious shakshuka, or beautiful scones with plum jam. Breakfast around 200 sek per person.
          - img "A cafe with a blue-tile counter and pastries on display." [ref=e332]
          - generic [ref=e333]:
            - generic [ref=e334]: 9 a.m. Steam, and then plunge into the cold sea
            - paragraph [ref=e336]:
              - text: From Ruths, jump on a shared bicycle using the
              - link "Malmo By Bike app" [ref=e337] [cursor=pointer]:
                - /url: https://www.malmobybike.se/
              - text: and head west to the
              - link "Hundrastplatsen" [ref=e338] [cursor=pointer]:
                - /url: https://www.google.com/maps/place/Ribersborgs+Hundrastplats/@55.6058676,12.9772464,15z/data=!4m2!3m1!1s0x0:0xf6cc93bc26d859b7?sa=X&ved=1t:2428&ictx=111
              - text: (or dog beach) for an excellent view of frolicking puppies to go with that of the
              - link "Turning Torso" [ref=e339] [cursor=pointer]:
                - /url: https://visitskane.com/classic-attractions/turning-torso
              - text: ", the twisted highrise designed by the Spanish starchitect Santiago Calatrava that has become a Malmo landmark. From there, it's a short ride to the long wooden pier that leads to the Wes Anderson-esque Ribersborg Kallbadhus. At this old-fashioned bathhouse, the local practice is to alternate between baking naked in the sauna and plunging — also naked (both sauna and bathing areas are segregated by sex) — into the chilly sea. All this invigoration for only 85 sek ($8), with towel and locker rental extra."
