            - heading "The Asheville Bucket List" [level=1] [ref=e175]
            - generic [ref=e176]:
              - paragraph [ref=e177]: The mountain city known for its art, music, outdoor adventures, and beer provides plenty of opportunities for fun and learning. An Asheville devotee compiled some of the best experiences in her new guidebook.
              - generic [ref=e178]:
                - text: by
                - link "C.A. Carlson" [ref=e179] [cursor=pointer]:
                  - /url: https://www.ourstate.com/author/ccarlson/
          - generic [ref=e183]:
            - generic [ref=e186]:
              - paragraph [ref=e187]:
                - generic [ref=e188]: On your next trip to Asheville, explore the North Carolina Arboretum.
              - paragraph [ref=e189]:
                - generic [ref=e190]: photograph by ExploreAsheville.com
            - generic [ref=e191]:
              - generic [ref=e192]:
                - list [ref=e194]:
                  - listitem [ref=e195]:
                    - link "" [ref=e196] [cursor=pointer]:
                      - /url: http://www.facebook.com/sharer.php?u=https://www.ourstate.com/the-asheville-bucket-list/&[title]=The Asheville Bucket List
