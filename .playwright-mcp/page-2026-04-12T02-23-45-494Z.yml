                  - paragraph [ref=e1250]:
                    - text: When you walk into Everyday, you'll see a lineup of their staff hand-pulling fresh noodles behind a window. We would definitely watch this daily if they set up a livestream, but we're also here all the time—and so is everybody else in Squirrel Hill. There may be a bit of a wait to sit down, but stick it out, because pretty much everything here is delicious. Start with the wood ear mushroom and garlic-marinated tofu skin appetizer, and then tack on some hot spicy wonton noodles that are piled with cilantro and scallions. While the noodles here are excellent, it’s the soup dumplings that keep us coming back, specifically the classic pork and the shrimp and loofah ones. After you eat, explore one of the bookstores on Forbes Avenue, and hit a post-lunch matinee around the corner at the
