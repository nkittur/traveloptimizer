                  - paragraph [ref=e949]: "When we’re talking about why we love Pusadee’s Garden, a Thai restaurant in Upper Lawrenceville, it comes down to two words: lamb shank. When your waiter brings this massive cut of meat to your table, it’s a full-on spectacle, leaving behind a trail of spiced coconut aromatics and turned heads. Pusadee’s Garden is perfect for pulling that fancy outfit from your closet for a birthday or reconnecting with your college friend group, especially if it’s nice out and you can sit on their patio that’s a literal garden. Just know the fall-off-the-bone slab of lamb covered in rich massaman curry almost always sells out well before the restaurant closes, so make a reservation on the earlier side."
