                    - paragraph [ref=e756]: Don’t come to Con Alma hoping to debrief about your latest work or love life drama—they usually have genre-bending live jazz playing, and you’re gonna want to listen. While the music is the main attraction, the food isn’t an afterthought. Try dishes like za’atar-dusted sourdough wheat focaccia, smoky Peruvian red pepper-covered and mushroom-loaded lo mein, and kimchi fried rice with pork belly burnt ends. Check their website if you want to see the full music calendar, but it’s also fun to show up without context and see if tonight is going to be a jam session led by a legendary sax player or a vocalist belting out a lovely rendition of “Fly Me To The Moon.”
