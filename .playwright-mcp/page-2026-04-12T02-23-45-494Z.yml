                - generic [ref=e475]:
                  - paragraph [ref=e477]: "Gi-Jin in downtown Pittsburgh is all about the trifecta of sashimi, handrolls, and gin. They’ve somehow figured out how to make fatty toro even more delicious by serving it with citrusy yuzu salt, scallion, and wasabi. The handrolls are excellent and just unexpected enough (see: either the beef tartare with pickled shiitakes or hamachi with pomegranate jam). And the gin list, which is categorized by style, will teach you about the difference between juniper-forward London pours and modern bottles that mix spice and citrus. The restaurant itself is pretty small, with just a handful of tables below the giant dragon mural and a long bar, making it better for a sexy date than a big group dinner with your intro to pottery class."
