            - generic [ref=e116]:
              - paragraph [ref=e117]: If all you know about Pittsburgh’s food scene is that we put fries and coleslaw on our sandwiches, we’ve got a lot to show you. The city has blue-collar roots and a large Eastern European population, so you’ll find lots of pierogi (the vegan ones are especially good), Italian sausages, and enough delis to warrant another roundup of sandwich spots alone.
              - paragraph [ref=e118]: In recent years, there’s been a wave of restaurants serving cuisines from all over Asia that we’re particularly excited about—we’re talking about Chinese hand-pulled noodles in Squirrel Hill, a.k.a. the neighborhood where Mister Rogers raised his kids, a Thai fall-off-the-bone lamb shank in Upper Lawrenceville, and South Indian bhindi masala you can find on a short drive from downtown.
              - paragraph [ref=e119]: This guide will take you through all the best of Pittsburgh and more, whether you’re looking for a special occasion meal with a panorama view of the city or a smoked brisket lunch 10 minutes from the PA Turnpike.
