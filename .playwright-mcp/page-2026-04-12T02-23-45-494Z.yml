                      - text: The best word to describe Scratch & Co, a cafe and pub in Troy Hill, is eclectic. The people who work here don’t have specific job titles. Rather, they’re cross-trained to work every position, filling in where needed, which makes it feel like everyone’s just hanging out and enjoying each other’s company. Go for brunch when you can get things like bagels from
                      - link "Hellbender" [ref=e1108] [cursor=pointer]:
