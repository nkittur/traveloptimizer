                - generic [ref=e1565]:
                  - paragraph [ref=e1567]: At this casual Vietnamese restaurant in the Strip District, you’ll find punny pop art posters on the walls, including one that says “Pho King Delicious.” We really appreciate their dedication to the puns, almost as much as we appreciate their phở with a rich broth that’s been simmered for days. This family-run establishment has a variety of soupy dishes with just as many proteins like tripe, meatballs, and sliced beef, along with a great chicken phở. Beyond the soup, try some grilled plates, like chicken teriyaki, which are also full of flavor and make for great leftovers to eat throughout the week. Have lunch here before spending the rest of the day exploring all the shops and grocers in the neighborhood.
