                - generic [ref=e1182]:
                  - paragraph [ref=e1184]:
                    - text: "\"A vegan was converted here\" is one of many handwritten messages on the Tastefully Blessed Kitchen & Smokehouse walls. And you'll have time to read them all as you join the line of people waiting for some of the best BBQ in the city. No order here is complete without the smoked brisket, and while first-timers should start with a half pound, you can have it folded in a quesadilla, stuffed in a cheesesteak, or as a topping in one of their smashburgers. Add on some Mississippi pot roast or tender baby back ribs, sides like honey-soaked cornbread, creamy mac and cheese, or candied yams, and the sure-to-sell-out banana pudding. Located less than 10 minutes from the PA Turnpike, it's the perfect lunch spot for kicking off a weekend itinerary or getting out of the city for some fresh air. After your feast, walk up the street to"
