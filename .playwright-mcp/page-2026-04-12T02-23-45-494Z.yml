                  - paragraph [ref=e615]:
                    - text: There's nothing like a Sunday brunch at 40 North in Alphabet City to help delay the Sunday scaries a bit longer. But this isn’t just your regular stop for eggs benedict and mimosas—it’s one of the more unique brunches you can have in Pittsburgh, since the dining room is in the middle of a bookstore called
                    - link "City of Asylum" [ref=e616] [cursor=pointer]:
                      - /url: https://www.cityofasylumbooks.org/
                    - text: . That means you can eat things like spätzle with poached eggs as you listen to readings by authors you might recognize from BookTok, or have a brunch date of huevos rancheros with braised lamb before browsing the shelves for some new fiction to take home. They also do great cocktails like a scotch espresso martini topped with orange and warm spices, plus non-alcoholic drinks—go with the tart Mauve with pink peppercorns and bay syrup.
