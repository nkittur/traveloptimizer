                - generic [ref=e411]:
                  - paragraph [ref=e413]: So yes, Pittsburgh is a total meat town, but one of the recent and refreshing restaurant trends is how many more excellent vegan places have opened. The best of them by far is Apteka, a great sit-down spot in Bloomfield that serves plant-based spins on Central and Eastern European dishes. Start with a bowl of comforting celeriac soup with layers of crispy buckwheat, some tender stuffed cabbage with mushrooms and preserved tomato, and always get one (or more) orders of potato pierogi that are served with a light czarna salsa. They also have a full menu of homemade fruit and herb cordials and tinctures, and there’s no better way to wrap up a meal here than with a shot of their dark tart cherry liqueur.
