                  - generic [ref=e1007]:
                    - paragraph [ref=e1009]: When you come to Pittsburgh for the first time, someone will inevitably tell you to go to the overlook on Mt. Washington for an amazing view of the city. But this panorama is always better over dinner, especially when it’s at Altius. The restaurant itself sits slightly out from the cliff, giving you the illusion that you’re floating above the city’s three rivers. Besides the view, you come here for upscale dishes like creamy crab toast, chicken with perfectly crispy skin, and the rich chocolate medley dessert, all of which have bigger portions than you’d find at other fine dining spots. They also give you a snack of warm popcorn right when you sit down because, sure, this is an elevated spot with a great view, but it doesn’t take itself all that seriously.
