                  - generic [ref=e1389]:
                    - paragraph [ref=e1391]: Butterjoint in Oakland makes incredible sandwiches, pierogi, and baked goods. Primetime here is lunch on the weekends, when the smell of fresh buttery goodness hits you right as you walk in—focus on their rolls with roasted cipollini onion butter or one of their rotating sandwiches like Jamaican pulled goat served on a milk bread bun. The plate of smoked bluefish pate or sauerkraut balls with honey mustard are perfect to share, as are the pierogi, the best of which come with a link of kielbasa and a variety of pickles. There are cute and colorful booths, long tables, and small two-seater high-tops, though we prefer the booths in the bar for an extra intimate setup. Have a slice of their vinegar pie, a Depression-era treat with a crunchy top and a custardy texture, before walking over to the Carnegie Museum of Natural History for the afternoon.
