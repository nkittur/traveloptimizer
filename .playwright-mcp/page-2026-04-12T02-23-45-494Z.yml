                  - paragraph [ref=e169]: "Dish is escapism at its finest, or at least a welcome disassociation from gloomy Pittsburgh in the winter. This osteria and bar has some of the best parts of southern Italy under one roof: plates of wild shrimp coated in Calabrian chilis, heaping portions of gnocchi in duck ragu, and a long list of especially good Sicilian wine. In addition to all that, it’s a date night or special occasion go-to where you can linger with a lambrusco spritz at one of the red mahogany tables that are lit by sultry candlelight. Always make a reservation, because the best seats here are hard to come by."
