                    - paragraph [ref=e236]: Some day, we’d love to write a guide to restaurants named after sausages. When we do, Morcilla is going to be at the top of the list. This Lawrenceville spot is a must if you enjoy housemade charcuterie, wine and sherry from Valencia, and a vibe that’s similar to Spanish tavernas—wooden boards cover the walls and haunches of jamón serrano dangle above the bar. Go heavy on small plates like tender oxtail montaditos with a creamy mahón cheese, some charred octopus with habanada pepper zhug, and a foie gras and chicken liver mousse that’s nicely balanced with some sour cherries and a pistachio crunch. The family-style menu is perfect for a relaxed meal where you can share everything with a group—even though once the plates start dropping, you’ll want to hoard it all for yourself.
