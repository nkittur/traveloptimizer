                    - paragraph [ref=e837]:
                      - text: You know those rare spots that are good for date night, a solo dinner, a weeknight Happy Hour, and everything in between? For the people of Pittsburgh, that’s The Vandal, a small wine bar in Lawrenceville. The space has a simple bistro aesthetic, and they do a constantly rotating menu featuring peak Pennsylvania ingredients. There’s a cheese plate curated by
                      - link "Chantal’s" [ref=e838] [cursor=pointer]:
                        - /url: https://chantalscheese.com/
                      - text: in Bloomfield, pork chops with grilled escarole, thomcord grapes, and mustard vinaigrette, and seared duck breast served with beets, walnuts, and preserved plum. Pair it all with something from their natural wine list, a Le Concorde cocktail made with gin and concord grapes, or a non-alcoholic Stappi spritz doing its best Negroni impersonation.
