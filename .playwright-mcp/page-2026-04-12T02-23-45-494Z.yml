                - generic [ref=e685]:
                  - paragraph [ref=e687]: Whenever we’re in a meeting and hear somebody say, "everyone can have a piece of the pie," we think about Lorelei. That’s because it's one of the best group dinner spots in the city, where you’ll need a crew to take down their menu of wood-fired pizzas. Enjoy thin, crispy, 14-inch Neapolitan-style pies like cacio e pepe, spicy pepperoni with homemade hot honey and pickled jalapeños, and weekly specials like Pennsylvania mushrooms and squash. The space is a giant beer hall where glasses overflow with kölsch, Italian pilsners, and a Franconian-style pale smoke lager, and the long, communal tables serve as runways for the various wine and amaro flights. Walk in, take over a table, and spend the night swapping slices instead of memes with your coworkers for once.
