                    - text: This gastropub brings the heat, literally—at the center of Fire Side Public House is their large wood-fired grill. Grab a spot at the bar or one of their high-top tables that’ll place you right at the perimeter of the grill, where you can watch flat iron steaks, sweet corn on the cob, and avocados get charred to perfection. After sipping a Pennsylvania-brewed pint, kick off your order with the city’s best fried and smoked wings and their crab-infused corn meal hushpuppies topped with bacon, corn, and spicy aioli. This place makes for the perfect lunch stop after your productive morning at nearby
