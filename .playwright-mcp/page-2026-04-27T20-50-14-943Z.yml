              - generic [ref=e248]: 8:30 a.m. Ski on Mars
              - paragraph [ref=e250]:
                - text: Cortina’s surrounding mountains are all dramatic, but to take a ski lift from Bai de Dones to
                - link "Cinque Torri" [ref=e251] [cursor=pointer]:
                  - /url: https://5torri.it/index_en.php
                - text: (“five towers”) is to arrive on an astonishing alternate planet of rugged limestone stacks well above the tree line. The area marks the beginning of one of Ampezzo’s most spectacular skiing landscapes, though the mostly intermediate-level slopes are wide, rolling and mellow. From Bai de Dones, a cable car also brings skiers to the Lagazuoi peak, the starting point of the
                - link "Hidden Valley trail," [ref=e252] [cursor=pointer]:
                  - /url: https://inspireditaly.com/travellers-tales/dolomites-best-ski-runs-hidden-valley/
                - text: which winds past frozen waterfalls and sheer cliffs, and ends with a horse-drawn ski tow (€8). (During the Olympics, check
                - link "Dolomiti Superski" [ref=e253] [cursor=pointer]:
                  - /url: https://www.dolomitisuperski.com/en/areas/cortina-d-ampezzo
                - text: "to see open trails and lifts.) Other adventure options:"
                - link "cross-country skiing" [ref=e254] [cursor=pointer]:
                  - /url: https://www.ciaocortina.com/en/hike-cortina-walk-dolomites-former-railway.html
                - text: ","
                - link "snowshoeing" [ref=e255] [cursor=pointer]:
                  - /url: https://www.ciaocortina.com/en/what-to-do-winter-cortina.html
                - text: and hiking in all seasons, with a comprehensive trail guide available on
                - link "CiaoCortina" [ref=e256] [cursor=pointer]:
                  - /url: https://www.ciaocortina.com/en/best-hikes-in-cortina.html
                - text: ", a locally run website."
            - generic [ref=e258]:
              - img "A large rock formation rises from a snowy mountain." [ref=e260]
              - paragraph [ref=e263]: Cinque Torri
            - generic [ref=e264]:
              - generic [ref=e265]: 1 p.m. Lunch like a squirrel
              - paragraph [ref=e267]:
                - text: Named after Cortina’s first rock-climbers’ club,
                - link "Rifugio Scoiattoli" [ref=e268] [cursor=pointer]:
                  - /url: https://www.rifugioscoiattoli.it/eng/
                - text: (“squirrels”) was founded in 1969 and remains one of Ampezzo’s most loved mountain lodges. Lunch is steadfastly local, with fresh-made casunziei pasta stuffed with beets and poppy seeds, goulash stew with polenta and canederli speck dumplings (dishes from €13). Fashion brand logos are printed on tablecloths and everywhere else — part of an unfortunate sponsorship trend in Cortina — but the old timber floors and booths remain, as do the unbeatable views. After a couple of post-lunch runs, enjoy an après-ski bombardino cocktail of eggnog and brandy, or a glass of bubbly on the sunny terrace facing the Cinque Torri — the storied rock-climbing destination of the Scoiattoli and generations of alpinists.
            - generic [ref=e270]:
              - img "The interior of an empty restaurant with set tables and wooden walls." [ref=e272]
              - paragraph [ref=e275]: Rifugio Scoiattoli
            - generic [ref=e276]:
              - generic [ref=e277]: 3:30 p.m. Shop for special finds
              - paragraph [ref=e279]:
                - text: Cortina’s main drag is lined with luxury boutiques, including brand-new Prada and Loro Piana stores — but niche, local and artisan goods also abound. Drawing on two centuries of wool-making,
                - link "Paoletti di Follina 1795" [ref=e280] [cursor=pointer]:
                  - /url: https://paolettidifollina1795.it/
                - text: sells sophisticated women’s jackets and other Tyrolean and equestrian-inspired, artisan-made clothing.
                - link "Ghedina Zuccaro" [ref=e281] [cursor=pointer]:
                  - /url: https://maps.app.goo.gl/yw9884SkJyv5CAsw6
                - text: has Alpine styles for men, women and children, including wool socks hand-stitched with flowers that make great gifts (€18).
                - link "Magamaison" [ref=e282] [cursor=pointer]:
                  - /url: http://www.magamaison.it/?utm_source=ig&utm_medium=social&utm_content=link_in_bio&fbclid=PAZXh0bgNhZW0CMTEAc3J0YwZhcHBfaWQMMjU2MjgxMDQwNTU4AAGnIAouw1d_8aEzpHPH34FakivVqa3o0mOM4Rh-_WWJ_rp9DxAoFPG1mG2-6Jg_aem_Kop1P8BkaZGaNa5oYuoBrA
                - text: is a wunderkammer of embroidered pillowcases, natural-dyed table linens and other homegoods, while amid the jumbled kitchenwares at
                - link "Sottosopra" [ref=e283] [cursor=pointer]:
                  - /url: https://sottosopracortina.com/shop/it/
                - text: are souvenir-worthy Alpine felted slippers (from €62). Designer sunglasses? Choose a small-production pair at
                - link "Indice" [ref=e284] [cursor=pointer]:
                  - /url: https://www.indice.vision/?srsltid=AfmBOopeH1vJIrGAza44-h8VsvNY3rp6vb9UlU9pE4ShEBDgSCIBh5Tp
                - text: . For gorgeous traditional local crafts like filigree flowers of delicate silver-wire, explore the treasure trove of
                - link "Verocai Antiques" [ref=e285] [cursor=pointer]:
                  - /url: https://www.google.com/maps/place//data=!4m2!3m1!1s0x477834309c6a7ed5:0xcbcd6e5d6062b966?sa=X&ved=1t:8290&ictx=111
                - text: . (Note that stores close for lunch.)
            - generic [ref=e287]:
              - img "The interior of a shop displaying coats in dark red and blue that appear to be made out of velvet." [ref=e289]
              - paragraph [ref=e292]: Paoletti di Follina 1795
            - generic [ref=e293]:
              - generic [ref=e294]: 5 p.m. Eat a sweet
              - paragraph [ref=e296]:
                - text: Merenda, a mid-afternoon snack, is a Tyrolean ritual everyone can appreciate.
                - link "Pasticceria Alverà" [ref=e297] [cursor=pointer]:
                  - /url: https://www.pasticceriaalvera.com/
                - text: ", founded in 1914 when Cortina still belonged to the Austro-Hungarian empire, draws on the Viennese pastry heritage, with specialties such as jewel-like mignon pastries (€1.50 each) of raspberry with pistachio, and other bright, Italian-inspired flavors, as well as the Dolomites’ Schüttelbrot, a rye flatbread with caraway seeds (€1.50 each). At"
                - link "La Fregola" [ref=e298] [cursor=pointer]:
                  - /url: https://www.instagram.com/lafregolacortina/?hl=en
                - text: ", the baker Cecilia Gabrieli prepares her grandmother’s cakes and other home-style Ampezzo recipes, including classic linzer tarts, shortbread cookies and apple strudels (from €3.50 each). Her tiny outpost lacks a seating area, but just across the street are park benches facing the mountains."
            - generic [ref=e300]:
              - img "A person wearing a Christmas-themed apron lifts a glass lid from a display plate of cake in a cafe." [ref=e302]
              - paragraph [ref=e305]: La Fregola
            - generic [ref=e306]:
              - generic [ref=e307]: 5:30 p.m. Explore Cortina’s art, culture and craft
              - paragraph [ref=e309]:
                - text: Cortina’s three municipal museums introduce visitors to different aspects of the area within a short distance of each other, starting with the
                - link "Mario Rimoldi Museum of Modern Art" [ref=e310] [cursor=pointer]:
                  - /url: https://musei.regole.it/Rimoldi/index_en.php
                - text: ", where a local collector’s donation of more than 300 works showcases prominent early 20th-century Italian artists like Giorgio de Chirico and Giorgio Morandi (€8). The"
                - link "Rinaldo Zardini Paleontology Museum" [ref=e311] [cursor=pointer]:
                  - /url: https://musei.regole.it/Zardini/index_en.php#
                - text: houses a remarkable wealth of fossils unearthed in the Dolomites; behind it, the
                - link "Ethnographic Museum" [ref=e312] [cursor=pointer]:
                  - /url: https://musei.regole.it/Etno/index_en.php#
                - text: displays regional folk traditions, including Ampezzo’s filigree
                - link "tremui" [ref=e313] [cursor=pointer]:
                  - /url: https://www.artigianatoartisticoampezzano.it/product/tremui-fiore-con-spillone-in-filigrana-dargento/
                - text: "— floral silver hair ornaments — and customary special occasion outfits (combined ticket €8). Note: Museums are closed for the Olympics; the Ethnographic Museum may be open by reservation. For a hands-on alternative, the glass artist"
                - link "Claudia Alverà" [ref=e314] [cursor=pointer]:
                  - /url: https://glass-art.it/glassworks/
                - text: offers family-friendly group workshops at her studio (one hour, €40 per person).
            - generic [ref=e316]:
              - img "A display of silver ornaments that are shaped like flowers with jewels at the center." [ref=e318]
              - paragraph [ref=e321]: Ethnographic Museum
            - generic [ref=e322]:
              - generic [ref=e323]: 7 p.m. Drink at local haunts
              - paragraph [ref=e325]:
                - text: At aperitivo hour, Cortina’s main drag and side streets fill with evening merrymakers. The coziest spot in town is
                - link "Enoteca Cortina" [ref=e326] [cursor=pointer]:
                  - /url: https://www.enotecacortina.com/
                - text: ", a pocket-size wine bar from 1962, hidden behind a curtained door. Inside, wooden booth seats face out so the whole room can fraternize. There’s a special magic conjured by its cellar of more than 500 wine labels, an easygoing atmosphere, and a mix of Ampezzani and Cortina’s repeat visitors (glasses from €6). Down the street,"
                - link "El Becalen" [ref=e327] [cursor=pointer]:
                  - /url: https://maps.app.goo.gl/25ms5fJTFFYcLzVh8
                - text: is a decades-old, wood-paneled institution where regulars’ drinks appear on the bar before they even order them. Everyone knows almost everyone, and their aperitivo of choice (drinks from €4).
            - generic [ref=e329]:
              - img "People sip glasses of wine in a narrow bar." [ref=e331]
              - paragraph [ref=e334]: Enoteca Cortina
            - generic [ref=e335]:
              - generic [ref=e336]: 8:30 p.m. Taste Ampezzo
              - paragraph [ref=e338]:
                - text: In Cortina, rustic mountain cabins called baitas serve high-flying cuisine to a well-heeled clientele.
                - link "Alajmo Cortina" [ref=e339] [cursor=pointer]:
                  - /url: https://alajmo.it/en/pages/homepage-cortina
                - text: ", one baita-turned-haute-dining destination, is owned by the Alajmo brothers who have earned Michelin stars elsewhere in Veneto, serving paprika tagliatelle with fiolaro broccoli, a local heritage variety, and tiramisù made tableside (two courses, €85; eight-course tasting menu, €165). The owners of another baita, the celebrated Baita"
                - link "Piè Tofana" [ref=e340] [cursor=pointer]:
                  - /url: https://baitapietofana.it/
                - text: (closed for the Olympics) have opened the brand-new
                - link "1224" [ref=e341] [cursor=pointer]:
                  - /url: https://www.1224restaurantcortina.it/en/
                - text: restaurant with elegant versions of casunziei and polenta served with roast eel (two courses, €84; four-course tasting menu €110). For traditional (and cheaper) baita vibes in the middle of town,
                - link "Ristorante Ra Stua" [ref=e342] [cursor=pointer]:
                  - /url: https://www.ristoranterastuacortina.it/
                - text: ", founded in 1937, serves meats raised at the owner’s Padua farm, alongside humble but delicious housemade pastas (pasta from €20; meat dishes from €34)."
            - generic [ref=e344]:
              - img "A terra-cotta dish with tagliatelle and vegetables." [ref=e346]
              - paragraph [ref=e349]: Alajmo
            - generic [ref=e350]:
              - generic [ref=e351]: 10 p.m. Survey the night
              - paragraph [ref=e353]:
                - text: Cortina’s
                - link "Helmut Ullrich Astronomical Observatory" [ref=e354] [cursor=pointer]:
                  - /url: https://www.cortinastelle.it/joomla30/index.php/en/how-to-visit/visits-for-the-public
                - text: sits on the Col Drusciè plateau of the Tofane mountains. Open nights at the station (and some sun observation days) are sporadic, but the chance to observe the clear skies from this high plateau, largely free of light pollution, is not to be missed. See
                - link "Cortina Stelle" [ref=e355] [cursor=pointer]:
                  - /url: https://www.cortinastelle.it/joomla30/index.php/en/how-to-visit/visits-for-the-public
                - text: for dates (tickets €5 to €10).
          - generic [ref=e356]:
            - img "The interior of a low-lit restaurant with hanging dried flowers and lit candlesticks." [ref=e358]
            - paragraph [ref=e361]: Dinner at SanBrite includes heaps of housemade butter from its own dairy and a trip to the cheese-curing cave.
          - generic [ref=e362]: Advertisement
          - generic [ref=e363]:
            - heading "Sunday" [level=2] [ref=e364]
            - generic [ref=e365]:
              - generic [ref=e366]: 8:30 a.m. Ski an icon
              - paragraph [ref=e368]:
                - text: The slopes of the Tofane are synonymous with Cortina, and just steps from the city center, the
                - link "Freccia nel Cielo" [ref=e369] [cursor=pointer]:
                  - /url: https://www.freccianelcielo.com/en/
                - text: cable car whisks riders above its Olympic bobsled track and women’s downhill skiing trails. At Tofane’s two-mile-high peak, the steep black diamond trails are enough to induce vertigo in some, but from the Col Drusciè station farther down, there are trails of all levels, and views of the entire Ampezzo valley. Near the cable car base, the
                - link "Stadio Olimpico del Ghiaccio" [ref=e370] [cursor=pointer]:
                  - /url: https://www.serviziampezzo.it/strutture/stadio-olimpico-del-ghiaccio/
                - text: ", an ice-skating rink built for the 1956 Olympics, is a Modernist landmark of Cortina (ice-skating with skates rental, €10). Both sites will be reserved for the 2026 games, and temporarily unavailable for public use."
            - generic [ref=e372]:
              - img "Two people stand on a wooden viewing platform at look at a snowy mountain." [ref=e374]
              - paragraph [ref=e377]: Tofane mountains
