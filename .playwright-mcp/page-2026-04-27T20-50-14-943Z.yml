            - generic [ref=e196]:
              - generic [ref=e197]: 5 p.m. Stroll in style
              - paragraph [ref=e199]:
                - text: "The early evening passeggiata, or stroll, is a constitutional part of Italian leisure. Along Cortina’s main drag, Corso Italia, it also doubles as a fashion show and anthropological study: Witness the Cortina habitués, whose wearing of fur reaches performative heights. Get acquainted with the Tyrolese town’s historical architecture as well, beginning at the 1769"
                - link "Duomo" [ref=e200] [cursor=pointer]:
                  - /url: https://parrocchiacortina.it/chiesa-parrocchiale/
                - text: with its Dolomite stone bell tower. Steps away stand the
                - link "Ciasa de ra Regoles" [ref=e201] [cursor=pointer]:
                  - /url: https://www.regole.it/IT/pagina111-ciasa-de-ra-regoles
                - text: ", historic seat of Cortina’s communal land ownership; the Comun Vecio (old town hall), covered in heraldic family crests; the ethereally frescoed building Ciàsa de i Pùpe; the 15th-century"
                - link "Casa Corazza" [ref=e202] [cursor=pointer]:
                  - /url: https://cortina.dolomiti.org/it/pagina-altri-servizi/casa-corazza/
                - text: ; and the diminutive
                - link "San Francesco church" [ref=e203] [cursor=pointer]:
                  - /url: https://parrocchiacortina.it/le-chiese-succursali/chiesa-di-san-francesco-in-p-tta-s-francesco/
                - text: with 14th-century frescoes. Nearby is the architect Edoardo Gellner’s modernist 1955
                - link "Palazzo delle Poste" [ref=e204] [cursor=pointer]:
                  - /url: https://maps.app.goo.gl/hrwnx6r1T3ba7BM49
                - text: ", whose facade commemorates Cortina’s previous Olympics."
            - generic [ref=e206]:
              - img "People walk down a street at dusk illuminated with lights. A snowy mountain rises in the background." [ref=e208]
