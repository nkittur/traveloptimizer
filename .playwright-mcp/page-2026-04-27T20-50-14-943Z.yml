                  - text: serve many destinations (from €1.70). A vast ski area covering the entire territory of the Dolomites,
                  - strong [ref=e186]:
                    - link "Dolomiti Superski" [ref=e187] [cursor=pointer]:
                      - /url: https://www.dolomitisuperski.com/en/areas/cortina-d-ampezzo
                  - text: provides ski lift and cable car passes (from €72 per day), alongside information on its website for open slopes and lifts.
                - listitem [ref=e188]:
                  - text: To reach Cortina, the closest airport is in Venice, with a
