                - generic [ref=e168]: +
              - list:
                - listitem [ref=e169]:
                  - text: With the Olympics boosting Cortina’s already considerable clout, investors are converting historic guesthouses into luxury hotels. The symbol of Cortina’s new era is the
                  - strong [ref=e170]:
                    - link "Hotel Ancora Cortina" [ref=e171] [cursor=pointer]:
                      - /url: https://www.ancoracortina.com/
                  - text: ", a previously faded 200-year-old hotel at the very heart of Cortina, revived by the fashion mogul Renzo Rosso with a lavish 1970s-inspired redesign and a lively evening scene, including a restaurant terrace overlooking the main piazza on Corso Italia, the town’s central drag (rooms from 580 euros, or about $683)."
                - listitem [ref=e172]:
                  - text: Also on Corso Italia,
                  - strong [ref=e173]:
                    - link "Hotel Cortina" [ref=e174] [cursor=pointer]:
                      - /url: https://hotelcortina.com/
                  - text: has been run by the same local family since opening in 1870, and maintains traditional Tyrolean flower-painted furnishings, plus suites for parents with children and a popular bar (rooms from €330).
                - listitem [ref=e175]:
                  - text: Elsewhere in the center, the family-owned
                  - strong [ref=e176]:
                    - link "Ciasa Lorenzi" [ref=e177] [cursor=pointer]:
                      - /url: https://ciasalorenzi.it/en/
                  - text: has recently remodeled, lightheartedly kitschy Alpine rooms (from €220).
                - listitem [ref=e178]: In Cortina, prices rise sharply according to demand, so book far ahead and avoid peak periods if possible. For short-term rentals, look for local hosts, rather than agencies with numerous listings, to tread more lightly on this fragile community.
            - generic [ref=e179]:
              - button "Getting around +" [ref=e180] [cursor=pointer]:
