              - list [ref=e182]:
                - listitem [ref=e183]:
                  - text: The tiny city center is entirely walkable. Taxis are available at the central Piazza Roma or by phone (+39 043-686-0888; €15 within 2.5 miles), and local
                  - strong [ref=e184]:
                    - link "buses" [ref=e185] [cursor=pointer]:
