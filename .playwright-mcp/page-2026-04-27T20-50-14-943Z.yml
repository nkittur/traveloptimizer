            - generic [ref=e212]:
              - generic [ref=e213]: 7 p.m. Raise a glass with Hemingway’s ghost
              - paragraph [ref=e215]:
                - text: The most storied bar in Cortina is a snug establishment within the
                - link "Hotel de la Poste" [ref=e216] [cursor=pointer]:
                  - /url: https://www.delaposte.it/en/index
                - text: ", an 1804 post office transformed into a hotel, whose wood-paneled"
                - link "Bar del Posta" [ref=e217] [cursor=pointer]:
                  - /url: https://www.delaposte.it/hotel-con-ristorante-bar-cortina/bar-del-posta
                - text: has served luminaries of every era. Ernest Hemingway’s usual corner remains untouched with its floral-painted grandfather clock and the author’s framed inscription. With damask-covered chairs, embroidered curtains and antique tin tableware lining the walls, it’s the ideal setting for enjoying a signature Puccini cocktail of Champagne and fresh tangerine juice (18 euros, or about $21), and for reminiscing. “This is a place where we don’t believe in changing things,” said a bowtie-wearing bartender. For fans of trashy Italian movies, this was also a frequent location featured in the “
                - link "Cinepanettoni" [ref=e218] [cursor=pointer]:
                  - /url: https://www.nytimes.com/2023/12/30/world/europe/italy-cinema-panettone.html
                - text: ” films, a genre of Christmas comedies launched in 1983.
            - paragraph [ref=e224]: Bar del Posta
            - generic [ref=e225]:
              - generic [ref=e226]: 9 p.m. Dine with a star
              - paragraph [ref=e228]:
                - link "SanBrite" [ref=e229] [cursor=pointer]:
                  - /url: https://www.sanbrite.it/
                - text: — awarded one Michelin star and Michelin’s Green Star for sustainability — is reason enough to visit Cortina, with the chef Riccardo Gaspari and his wife and general manager, Ludovica Rubbini, maintaining their own regenerative farm that supplies their two restaurants with meat, dairy and vegetables. Set within a traditional farmhouse known as a malga, SanBrite’s dinners include heaps of housemade butter, a trip to the cheese-curing cave and creative cooking that transforms Alpine ingredients into new and unforgettable dishes, like spaghetti in mountain pine oil, and dry-aged char bathed in beurre blanc. Dishes from €40; six-course tasting menu from €160. An alternative, and an outstanding Sunday lunch option, is the couple’s more casual
                - link "El Brite de Larieto" [ref=e230] [cursor=pointer]:
                  - /url: https://www.elbritedelarieto.com/
                - text: ", serving rustic Alpine food meted out with Michelin finesse in a 1935-built mountain lodge next to their farm. Dishes from €24."
