                  - heading "Everything you should know about Acadia National Park" [level=1] [ref=e75]
                  - paragraph [ref=e76]: This coastal Maine park delivers stunning scenery with glacier-sculpted mountains, pounding surf, tranquil ponds, spectacular sunrises and sunsets, and seemingly endless outdoor recreation.
