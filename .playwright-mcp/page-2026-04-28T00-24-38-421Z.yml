                - paragraph [ref=e124]:
                  - link "Acadia National Park" [ref=e125] [cursor=pointer]:
                    - /url: file:///Users/hilarynangle/Library/CloudStorage/Dropbox/Writing.10.18.19/NGT/ANP%20Guide%202026/planyourvisit/east-side.%E2%80%A6
                  - text: ’s popularity is rooted in natural grandeur and cultural heritage. Forested mountains, glacier-scraped peaks, crashing surf on granite shores, spruce-fringed islands, and tranquil ponds and lakes drawing more than 4 million visitors in 2025. Complementing this awe-inspiring landscape the Park Loop Road, hiking trails, and carriage trails for bicycling, walking, and horseback riding.
                - paragraph [ref=e126]: The first national park on the East Coast of the U.S., established in 1916 on Mount Desert Island (MDI), now sprawls over approximately 50,000 acres, protecting more than 64 miles (102.9 km) of Maine’s coastline. Unlike most parks, Acadia was created from hodgepodge parcels of donated land, rather than from large government-owned tracts. The park borders private backyards and wraps around towns and villages.
                - generic:
                  - region
                - paragraph [ref=e127]:
                  - text: Somes Sound, a natural fjärd, a long glacier-formed inlet that's shallower than a fjord, splits MDI nearly in half. Most of the park’s starred attractions are on the island’s
                  - link "eastern" [ref=e128] [cursor=pointer]:
                    - /url: https://www.nps.gov/acad/planyourvisit/east-side.htm
                  - text: side and accessible from the Park Loop Road. The
                  - link "western" [ref=e129] [cursor=pointer]:
                    - /url: https://www.nps.gov/acad/planyourvisit/west-side.htm
                  - text: side offers quieter trails and lesser-known sights, including a natural seawall and Bass Harbor Head Lighthouse.
                - paragraph [ref=e132]:
                  - text: Acadia includes a mainland section on the
                  - link "Schoodic" [ref=e133] [cursor=pointer]:
                    - /url: https://www.nps.gov/acad/planyourvisit/schoodic.htm
                  - text: Peninsula and a remote one on
                  - link "Isle au Haut" [ref=e134] [cursor=pointer]:
                    - /url: https://www.nps.gov/acad/planyourvisit/isle-au-haut.htm
                  - text: . The free, seasonal
                  - link "Island Explorer" [ref=e135] [cursor=pointer]:
                    - /url: https://www.exploreacadia.com/
                  - text: bus system serves most areas of the park on MDI and the Schoodic peninsula.
                - paragraph [ref=e136]:
                  - text: (
                  - link "These are the 10 most popular national in the United States" [ref=e137] [cursor=pointer]:
                    - /url: https://www.nationalgeographic.com/travel/national-parks/article/most-visited-parks-photos
                  - text: .)
                - heading "Best times to visit Acadia National Park" [level=2] [ref=e138]
                - paragraph [ref=e139]: Acadia is busiest in July and August, when everything is open. To avoid the peak summer crowds, visit from May through June, but the weather can change rapidly from warm and dry to cold and wet, and not everything is operational. September and October are the golden months, although they’re increasingly popular. From November through March, many park sights are closed, but the hiking trails, carriage roads, and sections of the Park Loop Road remain open, and you’ll likely have them to yourself.
                - heading "Where to find the best views in the park" [level=2] [ref=e140]
                - paragraph [ref=e141]:
                  - text: Enjoy Acadia’s scenic beauty by driving or bicycling the
                  - link "Park Loop Road" [ref=e142] [cursor=pointer]:
                    - /url: https://www.nps.gov/acad/planyourvisit/park-loop-road.htm
                  - text: . This 27-mile (43- kilometer) loop through the park’s eastern section offers visitors views of Sieur de Mont, Sand Beach, Thunder Hole, Otter Cliffs, and Jordan Pond. A
                  - link "vehicle reservation" [ref=e143] [cursor=pointer]:
                    - /url: https://www.recreation.gov/timed-entry/400000
                  - text: is required to drive the section of road that ebbs and flows to Cadillac Mountain’s summit, which offers jaw-dropping views of Frenchman Bay, the Schoodic Peninsula, and, on clear days, a view of mile-high Katahdin. The Island Explorer doesn’t serve Cadillac’s summit, but a
                  - link "commercial shuttle" [ref=e144] [cursor=pointer]:
                    - /url: https://www.cadillacmtnshuttle.com/
                  - text: operates from Bar Harbor.
                - paragraph [ref=e145]:
                  - text: On clear nights, Sand Beach, the Ocean Path, and Otter Cliffs along the Park Loop Road and Seawall, on the western side, are prime
                  - link "stargazing" [ref=e146] [cursor=pointer]:
                    - /url: https://www.nps.gov/acad/planyourvisit/stargazing.htm
                  - text: locations.
                - heading "Where to find the best hiking trails" [level=2] [ref=e149]
                - figure "Adventurous hikers can take the South Ridge Trail in Acadia National Park to summit Cadillac Mountain, and take in panoramic views of Bar Harbor, Frenchman Bay, the Porcupine Islands, and the Schoodic Peninsula. Jerry and Marcy Monkman/EcoPhotography.com, Alamy" [ref=e153]:
                  - img "A man in a red jacket walks across a high, flat rocky plateau, ocean in the distance" [ref=e158] [cursor=pointer]
                  - button "Open image in fullscreen" [ref=e159] [cursor=pointer]:
                    - img [ref=e161]
                  - generic [ref=e164]:
                    - generic [ref=e167]: Adventurous hikers can take the South Ridge Trail in Acadia National Park to summit Cadillac Mountain, and take in panoramic views of Bar Harbor, Frenchman Bay, the Porcupine Islands, and the Schoodic Peninsula.
                    - generic [ref=e168]: Jerry and Marcy Monkman/EcoPhotography.com, Alamy
                - paragraph [ref=e169]:
                  - text: Thanks to the Island Explorer, hikers can start at one trailhead and link
                  - link "trails and peaks" [ref=e170] [cursor=pointer]:
                    - /url: https://www.nps.gov/acad/planyourvisit/hiking.htm
                  - text: before finishing at another. For example, a number of trails converge on Cadillac's summit, allowing hikers to ascend one trail and descend another, using the Island Explorer bus to complete the loop.
                - paragraph [ref=e171]:
                  - text: The easy, 4.4-mile (7.1 km) out-and-back
                  - link "Ocean Path" [ref=e172] [cursor=pointer]:
                    - /url: https://www.nps.gov/thingstodo/hike-ocean-path-trail.htm
                  - text: parallels to Park Loop Road from Sand Beach to Otter Cove, offering ocean views, and passing Thunder Hole and Otter Cliffs.
                - paragraph [ref=e173]:
                  - text: Despite its low elevation,
                  - link "Flying Mountain" [ref=e174] [cursor=pointer]:
                    - /url: https://www.nps.gov/thingstodo/hike-flying-mountain-loop.htm
                  - text: ’s moderate 1.5-mile (2.4-kilometer) loop has spectacular views over the Cranberry Islands and Somes Sound.
                - paragraph [ref=e175]:
                  - text: The
                  - link "Civilian Conservation Corps" [ref=e176] [cursor=pointer]:
                    - /url: https://www.nps.gov/acad/learn/historyculture/ccc.htm
                  - text: cut many trails, lining them with coping stones and cutting massive granite blocks into steps to make the trails easier for hikers of varying skill levels. The moderate, 2-mile (3.2-kilometer) out-and-back
                  - link "Beachcroft Path" [ref=e177] [cursor=pointer]:
                    - /url: https://www.nps.gov/thingstodo/hike-beachcroft-path.htm
                  - text: ", known for its 1,500 pink granite steps, ascends Champlain Mountain. The views from Huguenot Head over a shallow and weedy pond, Dorr Mountain, and Bar Harbor are lovely, but continue to the 1,058-foot summit for vistas with grander views."
                - paragraph [ref=e178]:
                  - text: Avoid driving to Cadillac’s summit by hiking the moderate 7.1-mile (11.4-kilometer) out-and-back
                  - link "Cadillac South Ridge Trail" [ref=e179] [cursor=pointer]:
                    - /url: https://www.nps.gov/thingstodo/hike-cadillac-south-ridge-trail.htm
                  - text: . Hikers may opt to take a more challenging route, but either way, they can retrace their steps and/or use the Island Explorer to return. To see the sunset or sunrise from Cadillac Mountain, consider hiking (with headlamps) the 4.4-mile (7.1-kilometer) out-and-back
                  - link "Cadillac North Ridge Trail" [ref=e180] [cursor=pointer]:
                    - /url: https://www.nps.gov/thingstodo/hike-cadillac-north-ridge-trail.htm
                  - text: .
                - paragraph [ref=e183]:
                  - text: (
                  - link "This is the most scenic route through Acadia National Park" [ref=e184] [cursor=pointer]:
                    - /url: https://www.nationalgeographic.com/travel/article/carriage-roads-acadia-national-park-maine
                  - text: .)
                - heading "The best spots to see wildlife" [level=2] [ref=e185]
                - paragraph [ref=e186]:
                  - text: The best
                  - link "wildlife" [ref=e187] [cursor=pointer]:
                    - /url: https://www.nps.gov/acad/learn/nature/animals.htm
                  - text: viewing is usually at dawn or dusk. Sieur de Mont, often called the heart of Acadia, allows visitors a chance to see white-tailed deer along the Jesup Path. To spot porcupines, look up in the trees, particularly hemlocks. You may spot evidence of beaver activity in the park’s wetlands. Jordan Pond Trail and Witch Pond Carriage Road are good places to view them.
                - paragraph [ref=e188]:
                  - text: Go
                  - link "tide pooling" [ref=e189] [cursor=pointer]:
                    - /url: https://www.nps.gov/acad/planyourvisit/tidepooling.htm
                  - text: to view small sea creatures, such as snails, crabs, periwinkles, urchins, barnacles, and sea stars, in coastal low-tide pools. Explore the areas found along the Wonderland Trail, Ship Harbor Trail, and Ocean Path.
                - paragraph [ref=e190]:
                  - text: Acadia’s boreal forests, coastal cliffs, and location on the Atlantic Flyway—a 3,000-mile (4,823-kilometer) north-south migration route stretching from Greenland to South—attract birdwatchers, who’ve identified more than 300 species in the park. Renowned ornithologist Roger Tory Peterson called MDI the “warbler capital of the world.”
                  - link "Sieur de Mont Springs" [ref=e191] [cursor=pointer]:
                    - /url: https://www.nps.gov/thingstodo/birding-sieur-de-monts-springs.htm
                  - text: ’ diverse landscapes, including wetlands, meadows, a pond, and the Wild Gardens of Acadia, attract songbirds, woodpeckers, and woodland species such as Blue-headed Vario, Barred Owl, Great-crested Flycatcher, and Pine Warbler.
                  - link "Seawall" [ref=e192] [cursor=pointer]:
                    - /url: https://home.nps.gov/thingstodo/birding-seawall.htm
                  - text: is also a hot spot for wildlife watching, with open ocean, a brackish pond, and the nearby Big Heath, a coastal bog system, where visitors might hear various warblers and spy American Goldfinch, Dark-eyed Junco, and, in the bog, carnivorous pitcher plants.
                - paragraph [ref=e193]:
                  - text: From March into summer,
                  - link "peregrine falcons" [ref=e194] [cursor=pointer]:
                    - /url: https://www.nps.gov/acad/learn/nature/peregrine-falcons-in-acadia.htm
                  - text: nest on Jordan Cliffs and the Precipice cliffs. Look skyward to find bald eagles perched in tall trees near waterways. From late August into November, park rangers and volunteers are stationed on Cadillac Mountain’s summit for
                  - link "Hawk Watch" [ref=e195] [cursor=pointer]:
                    - /url: https://www.nps.gov/thingstodo/cadillac-mountain-hawkwatch.htm
                  - text: ", which monitors migrating raptors, including hawks, vultures, eagles, and falcons."
                - paragraph [ref=e198]:
                  - text: On the park’s
                  - link "Islesford Historic and Scenic Cruise" [ref=e199] [cursor=pointer]:
                    - /url: https://www.nps.gov/acad/planyourvisit/ranger_programs_descriptions.htm
                  - text: ", a ranger points out sights, explains the landscape, and identifies birds and sea life, which may include seals, porpoises, and dolphins. The cruise includes a visit to the park’s museum on Islesford, one of the Cranberry Islands."
                - heading "Expert recommendations and tips" [level=2] [ref=e200]
                - paragraph [ref=e201]: "“Advance reservations for your Acadia trip are a must. This beloved but busy park is one of the smallest but among the top 10 in visitation, so expect things to be crowded in high season,” says Carey Kish, an MDI resident and author of Best Day Hikes Along the Maine Coast. “Timing is everything. Do your research ahead of time, make reservations, and always have a plan B or C available: If Sand Beach is too crowded, I’m going to go to Hunter’s Beach. Maybe instead of hiking Cadillac, I’ll hike Penobscot or Cedar Swamp Mountain.” Here’s a hint: The farther you are from Park Loop Road, the less busy a trail will be."
                - figure "Route 102A, also known as Seawall Road, is a scenic route along a natural, but rocky coast on Mount Desert Island in Acadia National Park. Cavan Images, Getty Images" [ref=e205]:
                  - img "A paved road winds along a rocky shoreline, treeline in the distance" [ref=e210] [cursor=pointer]
                  - button "Open image in fullscreen" [ref=e211] [cursor=pointer]:
                    - img [ref=e213]
                  - generic [ref=e216]:
                    - generic [ref=e219]: Route 102A, also known as Seawall Road, is a scenic route along a natural, but rocky coast on Mount Desert Island in Acadia National Park.
                    - generic [ref=e220]: Cavan Images, Getty Images
                - paragraph [ref=e221]: "Rise early and get to a trailhead before most others start breakfast. Or start when morning hikers will likely be having lunch on the summit or heading back down. “I love starting a hike in the late morning. I get to the summit, and nobody’s there: Bingo! It can be done, even in a crowded park like this,” he says. “It’s a way to get more solitude on well-traveled trails, no matter where you are in the park.” Or consider late afternoon: Most hikers are done by 4, and in summer it’s light longer, so go prepared and hike when others are finishing."
                - paragraph [ref=e222]: “Know your abilities. Acadia’s mountains aren’t really high, but you start at sea level and gain a good deal of elevation. Many are steep and rugged. Hikers need to respect that,” Kish says. He advises against following social media recommendations. “Beehive and Precipice aren’t for the faint of heart. They’re tough and can be scary, even hazardous if you’re not careful.”
                - paragraph [ref=e223]: To avoid crowds, Kish suggests visiting in winter. “On weekends, trail heads are crowded with locals, but midweek is always good.” When snow blankets the park, you can snowshoe, ski, or fat-tire bike along the carriage roads. “Some 30 miles of the carriage roads are groomed and tracked by Friends of Acadia volunteers when conditions allow. It’s quiet, snowy, beautiful, and looks and feels different; it’s truly special, and all it costs you is the price of a park pass.”
                - heading "Things to do in Acadia" [level=2] [ref=e226]
                - paragraph [ref=e227]:
                  - text: Drive the
                  - link "Park Loop Road" [ref=e228] [cursor=pointer]:
                    - /url: https://www.nps.gov/acad/planyourvisit/park-loop-road.htm
                  - text: ", which takes visitors to or by most of the park’s highlights. Stop for tea and popovers on the lawn at the"
                  - link "Jordan Pond House" [ref=e229] [cursor=pointer]:
                    - /url: https://www.nps.gov/places/jordan-pond-house.htm
                  - text: ", a tradition since the 1890s."
                - paragraph [ref=e230]:
                  - text: Walk, bike, or go horseback riding along the carriage roads. Kish says, “You can lose people pretty fast on these historic roads, like hiking. The farther you get from the Park Loop Road or a hub like Jordan Pond, the fewer people you’re going to see.” These well-signed rustic roads, created by John D. Rockefeller Jr., are lined with coping stones (nicknamed Rockefeller’s teeth) and accented by two gate lodges and 17 unique stone-faced bridges.
                  - link "Wildwood Stables" [ref=e231] [cursor=pointer]:
                    - /url: https://www.nps.gov/places/wildwood-stables.htm
                  - text: provides carriage rides.
                - paragraph [ref=e232]: Many of Acadia’s lakes and ponds allow boating. Eagle Lake, Long Pond, Echo Lake, and Jordan Pond are good choices for paddling. Freshwater swimming is permitted in Echo Lake and Lake Wood.
                - paragraph [ref=e233]:
                  - text: See Acadia from the water aboard a boat excursion or on a day trip to the Schoodic Peninsula aboard the
                  - link "passenger ferry" [ref=e234] [cursor=pointer]:
                    - /url: https://downeastwindjammer.com/ferries/bar-harbor-schoodic-winter-harbor/
                  - text: connecting Bar Harbor with Winter Harbor.
                - heading "Best things to do for families" [level=2] [ref=e235]
                - paragraph [ref=e236]:
                  - text: Interpretive signs explain the varied habitats along the easy, 1.3-mile (1.2-kilometer)
                  - link "Ship Harbor Nature Trail" [ref=e237] [cursor=pointer]:
                    - /url: https://www.nps.gov/thingstodo/hike-ship-harbor-trail.htm
                  - text: loop. Pack snacks or a picnic basket to enjoy on the granite ledges, explore tidepools, and watch for raptors, sea, and shore birds.
                - paragraph [ref=e240]:
                  - text: Park
                  - link "ranger programs" [ref=e241] [cursor=pointer]:
                    - /url: https://www.nps.gov/acad/planyourvisit/ranger_programs_descriptions.htm
                  - text: include guided hikes, cruises, bike-and-boat tours, stargazing, and campfire talks. Kids can become
                  - link "junior rangers" [ref=e242] [cursor=pointer]:
                    - /url: https://www.nps.gov/acad/planyourvisit/junior-ranger.htm
                  - text: by attending programs and completing activities.
                - paragraph [ref=e243]:
                  - text: Other
                  - link "family-oriented activities" [ref=e244] [cursor=pointer]:
                    - /url: https://www.nps.gov/acad/planyourvisit/for-kids.htm
                  - text: include
                  - link "Cultural Connections" [ref=e245] [cursor=pointer]:
                    - /url: https://www.nps.gov/acad/learn/historyculture/wabanaki.htm
                  - text: "programs highlighting Maine’s Indigenous Wabanaki Nations and Scavenger Hunts, which use a bingo card with activities for specific locations. For example, at Sieur de Monts, activities include: find and take a picture of the Sieur de Monts spring house, find a tree with a hole in it, find a trail with a boardwalk, and most activities require thoughts, answers, or actions."
                - heading "Where to stay" [level=2] [ref=e246]
                - paragraph [ref=e247]: Lodging is not available in the park, but visitors can find several options in surrounding communities. Be forewarned that lodging on MDI can be very pricey during peak season.
                - paragraph [ref=e248]:
                  - text: In Bar Harbor, the island’s hub, the waterfront and full-service
                  - link "Bar Harbor Inn" [ref=e249] [cursor=pointer]:
                    - /url: https://barharborinn.com/
                  - text: has two restaurants, a pool, and a spa; the harbor-view
                  - link "West Street Hotel" [ref=e250] [cursor=pointer]:
                    - /url: https://www.opalcollection.com/west-street/
                  - text: has an adults-only rooftop pool and access to its sister property’s outdoor pools, spa, and tennis courts; the
                  - link "Saltair Inn" [ref=e251] [cursor=pointer]:
                    - /url: https://www.saltairinn.com/
                  - text: bed and breakfast occupies a handsomely restored summer cottage with a lawn rolling down to the sea; the
                  - link "Edenbrook Motel" [ref=e252] [cursor=pointer]:
                    - /url: https://www.edenbrookmotel.com/
                  - text: ", comprises four buildings tiered on a hillside about a mile from downtown; the"
                  - link "Cromwell Harbor Motel" [ref=e253] [cursor=pointer]:
                    - /url: https://cromwellharbor.com/index.htm
                  - text: ", on the southern end of downtown, has an outdoor pool;"
                  - link "Rose Eden Cottages" [ref=e254] [cursor=pointer]:
                    - /url: https://roseeden.com/
                  - text: on Route 3 north of town, offers simple, clean, pet-friendly budget-friendly cottages.
                - paragraph [ref=e255]:
                  - text: In Northeast Harbor, the recently restored and updated
                  - link "Asticou Hotel" [ref=e256] [cursor=pointer]:
                    - /url: https://www.asticoumaine.com/
                  - text: ", located across from the Asticou Garden, offers rooms, suites, and cottages and a restaurant and lounge overlooking the pool to the yacht-filled harbor; at the classic"
                  - link "Harbourside Inn" [ref=e257] [cursor=pointer]:
                    - /url: https://harboursideinn.com/
                  - text: ", dating from 1888 and tucked on a wooded hillside, enjoy a light breakfast on the porch."
                - paragraph [ref=e260]:
                  - text: In Southwest Harbor, the masterfully restored and updated
                  - link "Claremont Hotel" [ref=e261] [cursor=pointer]:
                    - /url: https://www.theclaremonthotel.com/
                  - text: ", a grande dame dating back to 1884, offers rooms and suites in the main inn and adjacent buildings, as well as private cottages, a restaurant, spa, waterfront lounge, dock, and a pool, all overlooking the mouth of Somes Sound."
                - paragraph [ref=e262]:
                  - text: On the Schoodic Peninsula, the frills are few, but the views over Frenchman Bay are fabulous at
                  - link "Bluff House Inn and Cabins" [ref=e263] [cursor=pointer]:
                    - /url: https://www.bluffhouseinn.com/
                  - text: ", located about 5 miles from the park; every room has an ocean view at"
                  - link "Elsa’s Inn on the Harbor" [ref=e264] [cursor=pointer]:
                    - /url: https://www.elsasinnme.com/
                  - text: ", a charming bed-and-breakfast located across from a lobstering wharf, about 3 miles from the park."
                - paragraph [ref=e265]:
                  - text: If day-tripping to Isle au Haut, the closest lodgings to the ferry are in downtown Stonington, a classic fishing village; both are within walking distance of the ferry. The
                  - link "Inn on the Harbor" [ref=e266] [cursor=pointer]:
                    - /url: https://www.innontheharbor.com/
                  - text: delivers on its name with accommodations ranging from small rooms to a two-bedroom apartment and a huge deck hanging over the harbor; just across the street is
                  - link "Boyce’s Motel" [ref=e267] [cursor=pointer]:
                    - /url: https://boycesmotel.com/
                  - text: ", offering simple accommodations ranging from rooms to apartments. For a dreamy stay, reserve at"
                  - link "Aragosta" [ref=e268] [cursor=pointer]:
                    - /url: https://www.aragostamaine.com/
                  - text: ", an oceanfront inn and cottages with a private beach and nationally lauded restaurant, adjacent to a land preserve, and about a 15-minute drive to the ferry."
                - paragraph [ref=e269]:
                  - text: Make reservations
                  - link "online" [ref=e270] [cursor=pointer]:
                    - /url: https://www.recreation.gov/gateways/2554
                  - text: for the park’s
                  - link "campgrounds" [ref=e271] [cursor=pointer]:
                    - /url: https://www.nps.gov/acad/planyourvisit/camping.htm
                  - text: ": Blackwoods is on MDI’s easter side and is a great base for those wanting to hike Cadillac, and Seawall on western side, feels more remote and is a good choice for birdwatching; hiking and biking paths as well as the Park Loop Road connect the Schoodic Woods campground to all the park’s sights on the Schoodic peninsula; and for self-reliant campers who really want to escape and hike in relative solitude, Duck Harbor’s five lean-tos on Isle au Haut await. Backcountry camping isn’t permitted anywhere in Acadia."
                - paragraph [ref=e272]:
                  - text: Commercial campgrounds on MDI include Bar Harbor’s
                  - link "Hadley’s Point Campground" [ref=e273] [cursor=pointer]:
                    - /url: https://www.hadleyspoint.com/
                  - text: ", located 4 miles from the Hull’s Cove Visitor Center, has tenting and RV campsites, a heated pool, playground, and coin-op laundry and is walking distance to a saltwater beach with boat ramp, and for glampers,"
                  - link "Terramore Outdoor Resort" [ref=e274] [cursor=pointer]:
                    - /url: https://terramoroutdoorresort.com/
                  - text: ", about 6 miles from the Visitor Center, has tents with private full baths and beds with bedding, a pool, play area, and lodge with food and beverage service."
                - paragraph [ref=e277]:
                  - text: On MDI-s western side,
                  - link "Mount Desert Campground" [ref=e278] [cursor=pointer]:
                    - /url: https://www.mountdesertcampground.com/
                  - text: at the base of Somes Sound, caters to tenters and small RVs, has a gathering place, dinghy and kayak dock, boat ramp, and saltwater swimming;
                  - link "Smuggler’s Den Campground" [ref=e279] [cursor=pointer]:
                    - /url: https://www.smugglersdencampground.com/
                  - text: in Southwest Harbor has sites for tent, pop-up, and RV sites, rental RVs, rustic and deluxe cabins, and vacation rentals and offers a playground, pools, and laundry.
                - complementary "Travel with National Geographic" [ref=e281]:
                  - generic [ref=e289]:
                    - list [ref=e290]:
                      - listitem [ref=e291]:
                        - generic [ref=e292]: National Geographic Expeditions
                    - generic [ref=e294]: Travel with National Geographic
                    - button "Search Trips - Travel with National Geographic" [ref=e296] [cursor=pointer]:
                      - generic [ref=e299]: Search Trips
                - heading "What else you should know" [level=2] [ref=e300]
                - paragraph [ref=e301]:
                  - text: "Access: Parkgoers can take Route 3 to reach Acadia on MDI. The"
                  - link "Acadia Gateway Center" [ref=e302] [cursor=pointer]:
                    - /url: https://www.nps.gov/places/acadia-gateway-center.htm
                  - text: in Trenton doubles as a welcome center for the park and for Downeast Maine. It’s a stop for the Island Explorer, provides plenty of free parking for daytrippers, and has an information desk staffed by park staff and another staffed by experts in the Downeast region. The
                  - link "Hulls Cove Visitor Center" [ref=e303] [cursor=pointer]:
                    - /url: https://www.nps.gov/places/hulls-cove-visitor-center.htm
                  - text: has exhibits, information desks, and free parking, and is on the Island Explorer bus shuttle service.
                - paragraph [ref=e304]:
                  - text: To reach the Schoodic Peninsula from Route 1, take Route 186, which loops the peninsula and accesses the park at its tip. A passenger ferry operates between Bar Harbor and Winter Harbor, where the Island Explorer meets it and continues on a loop through the park. Parkgoers can reach Isle au Haut via a
                  - link "passenger ferry" [ref=e305] [cursor=pointer]:
                    - /url: https://www.isleauhaut.com/
                  - text: from Stonington, Maine.
                - paragraph [ref=e306]:
                  - text: "Entrance fees cover seven days in the park: $35 per vehicle, $30 per motorcycle, and $20 per pedestrian or bicyclist; an annual pass valid for Acadia only is $70. National pass options include the annual $80 America the Beautiful pass and the free Every Kid Outdoors 4th"
                  - superscript [ref=e307]
                  - text: Grade Pass.
                - paragraph [ref=e308]:
                  - text: "Are pets allowed: Pets are permitted at most places within the park. Dogs must be on a fixed leash not exceeding six feet. They are eligible to become"
                  - link "B.A.R.K. Rangers" [ref=e309] [cursor=pointer]:
                    - /url: https://www.nps.gov/articles/be-an-acadia-bark-ranger.htm
                  - text: .
                - heading "How accessible is the park?" [level=2] [ref=e312]
                - paragraph [ref=e313]:
                  - text: The
                  - link "America the Beautiful Access Pass" [ref=e314] [cursor=pointer]:
                    - /url: https://www.recreation.gov/interagency-pass/types/access
                  - text: ", available for free to U.S. citizens or residents with permanent disabilities, provides free lifetime entry to all national parks."
                - paragraph [ref=e315]: The park brochure and Essential Acadia can be downloaded in Braille-ready format and in four audio-described formats. Assistive devices, interpreters, and other accommodations for park programs are available with advance notice, as are a wheelchair-accessible carriage for horse-drawn tours and a beach wheelchair for summer use at Echo Lake.
                - paragraph [ref=e316]: Island Explorer buses and regular stops are wheelchair accessible. Service animals are permitted in the park, but pets used for emotional support, therapy, comfort, or as companions are not.
