              - paragraph [ref=e425]: One of the few places on the planet where you can surf waves and ski powder on the same day, Türkiye’s Black Sea coast is a scenic and culturally rich alternative to the crowded Aegean and Mediterranean coasts.
            - generic [ref=e430]:
              - paragraph [ref=e431]: Set between the towering Pontic Mountains and the Black Sea, towns and cities like Samsun and Bartin beckon beachgoers with sandy strands on blue coves, while Trabzon’s architectural treasures and labyrinthine old town recall the days when the city was a center of Greco-Turkish culture. Farther east, Rize’s tea terraces, where farmers grow robust black tea, provide an incredible view of the city’s busy waterfront.
              - paragraph [ref=e432]: The cuisine of the Black Sea coast favors fresh-off-the-boat seafood and regional dishes like kuymak, a blend of cornmeal and cheese, and savory Akçaabat köftesi, meatballs typically made with ground veal and lots of garlic.
              - paragraph [ref=e433]: Day trips from the coast take visitors into the valleys of the Pontic Mountains, where medieval castles await, along with the cliff-hanging Sümela Monastery, a remote retreat dating to the fourth century, renowned for its Byzantine-style architecture and multicolored frescoes. Çambaşı has the region’s best ski and snowboarding options. You’ll find pistes for every skill level and plenty of après hangouts.
              - paragraph [ref=e434]: For more adventurous travelers, Ayder village is ground zero for zip-lining and 4x4 safaris, as well as treks through evergreen forest and flower-filled alpine meadows to the jagged peaks of Kaçkar Dağları National Park. – Joe Yogerst
