                - text: and has been sacred to the local Anangu people for
                - link "tens of thousands of years" [ref=e651] [cursor=pointer]:
                  - /url: https://uluru.gov.au/discover/culture/
                - text: . Starting in April, visitors will be able to stay overnight within Uluru-Kata Tjuta National Park for the first time. The Anangu Traditional Owners collaborated with the
                - link "Tasmanian Walking Company" [ref=e652] [cursor=pointer]:
                  - /url: https://www.taswalkingco.com.au/uluru-kata-tjuta/
                - text: to develop five-day, fully guided treks. After long days on the trail between Kata Tjuta and Uluru, hikers will sleep in eco-friendly lodges, stargaze by campfires, and learn from Indigenous guides about how to take care of the land, which connects to the well-being of the people and the environment.
              - paragraph [ref=e653]: Indigenous art in Australia has evolved from cave paintings to acrylics on canvas and now to drones. Uluru’s Gallery of Central Australia focuses on the work of contemporary Indigenous artists. At night, the permanent drone installation Wintjiri Wiru uses Uluru and the surrounding desert as a backdrop to tell ancient Anangu stories using modern tech—lots of it. The show relies on 1,200 drones, six 30-watt lasers, seven 12-kilowatt projectors, and more than 30 bright field lights. – Acacia Gabriel
