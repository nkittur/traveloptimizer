              - paragraph [ref=e383]:
                - text: With its trading history and focus on Indigenous ingredients, the Philippines has always offered an exciting food culture. The 2026 Michelin Guide gives travelers one more reason to visit now. Metro Manila, which includes the capital city, is where Spanish, Chinese, and Malay influences come together in particularly innovative and delicious ways. At bustling markets (Tutuban at night, Salcedo on Saturdays), Manileños tuck into fish balls and halo-halo. Restaurants and cafés dish up comfort foods from the provinces, like crispy pancit palabok (a savory noodle dish) at
                - link "Manam" [ref=e384] [cursor=pointer]:
                  - /url: https://www.instagram.com/manamph/?hl=en
                - text: and lumpia with meat, veggies, peanuts, and seaweed at New Po Heng Lumpia House.
