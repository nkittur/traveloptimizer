              - paragraph [ref=e250]: "Why go: Experience an age-old city now on the rise"
              - generic:
                - region
              - paragraph [ref=e251]: Morocco’s relaxed Atlantic-coast capital is both an ancient imperial city and a cosmopolitan metropolis, where you can wander from the skinny alleyways of its 12th-century citadel, the Casbah of Oudaya, onto the broad boulevards of the 20th-century French-built Ville Nouvelle, where grand colonial-era buildings house stylish boutiques and restaurants.
              - paragraph [ref=e252]: The newest additions to Rabat’s fascinating cityscape are architect Zaha Hadid’s neo-futuristic Royal Theater of Rabat, a sinuous performing arts space inspired by the twists and turns of the Bou Regreg River, and the rocket-shaped Mohammed VI Tower, a sleek and photogenic landmark and Morocco’s tallest building. The beautiful hilltop site of Chellah is a 14th-century Islamic necropolis built on the ruins of a Roman settlement, symbolic of the city’s layered history. It’s recently reopened after an extensive restoration.
            - generic [ref=e257]:
              - paragraph [ref=e258]: "Among the best hotel options: the Four Seasons Hotel Rabat at Kasr Al Bahr—a reimagined 18th-century sultan’s summer palace, opened in 2024—and the Waldorf Astoria Rabat Salé, high within the Mohammed VI Tower, with breathtaking city and ocean views. Don’t miss the flagship Mohammed VI Museum of Modern and Contemporary Art, where a collection of more than 500 works is deeply rooted in modern Moroccan and African art, celebrating artists like buzzy photographer-designer Hassan Hajjaj."
              - paragraph [ref=e259]: Bibliophiles visiting Rabat should expect to find readings and other literary events throughout the year at bookshops and the National Library. The city has been recognized by UNESCO as the 2026 World Book Capital. – Sarah Gilbert
              - paragraph [ref=e260]:
                - text: From places to eat to places to stay, our
                - link "Rabat destination spotlight" [ref=e261] [cursor=pointer]:
                  - /url: https://www.nationalgeographic.com/travel/best-of-the-world-2026/article/rabat-morocco
                - generic [ref=e262]: provides information to help plan a visit to the Mohammed VI Museum of Modern & Contemporary Art, which features the artwork of more than 200 Moroccan artists.
