              - paragraph [ref=e1077]: "Why go: An island paradise is making big strides in sustainable tourism"
              - generic:
                - region
              - paragraph [ref=e1078]: No place encapsulates the South Pacific like Fiji. Its 300-plus islands are surrounded by some of the world’s most incredible coral reefs, its lush peaks and waterfalls make it a day hiker’s paradise, and Fijians are famous for their warm hospitality. Fiji has also become a destination for those looking to give back while they kick back, with more and more resorts developing programs that incentivize guests to spend some of their vacation pitching in on conservation and community projects. (The state tourism agency promotes Loloma Hour—loloma means “to act with generosity, driven by love”—a happy-hour alternative with volunteer shifts instead of cocktails.)
            - generic [ref=e1083]:
              - paragraph [ref=e1084]:
                - text: Guests at the family-friendly
                - link "Plantation Island Resort" [ref=e1085] [cursor=pointer]:
                  - /url: https://www.plantationisland.com/
                - text: on Malolo Lailai Island might choose to plant coral during a snorkeling adventure. On adjacent Malolo Island,
                - link "Likuliku Lagoon Resort" [ref=e1086] [cursor=pointer]:
                  - /url: https://likulikulagoon.com/
                - text: recently opened a conservation center, arranging outings to plant native trees, cull invasive species, and protect the critically endangered Fiji crested iguana.
              - paragraph [ref=e1087]:
                - text: Of course, when you’re not out voluntouring, there are beach blankets to hold down and waves to catch. In August, some of the planet’s best surfers line up at the legendary Cloudbreak, off the little islands of Namotu and Tavarua, a stop on the World Surf League’s 2026 championship tour. Even if you can’t surf it, you can still catch the 20-minute boat ride from
                - link "Namotu Island" [ref=e1088] [cursor=pointer]:
                  - /url: https://www.namotuislandfiji.com/
                - text: resort to the floating bar Cloud 9, in the waters of Vanua Malolo on the Ro Ro Reef, for some cocktails and snorkeling. – Christine Retschlag
              - paragraph [ref=e1089]:
                - text: Our
                - link "Fiji destination spotlight" [ref=e1090] [cursor=pointer]:
