              - paragraph [ref=e733]:
                - text: At the edge of both the forest and the sea, 60 miles south of the Arctic Circle, Oulu is a bastion of Finnish heritage. Some 800 of its 216,000 residents are Indigenous Sami people, and the city’s Giellagas Institute champions their culture and language. From mid-January to early May, the
                - link "Oulu Art Museum" [ref=e734] [cursor=pointer]:
