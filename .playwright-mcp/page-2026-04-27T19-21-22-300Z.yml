              - paragraph [ref=e1117]: Although Medellín grappled with drug cartels, paramilitary groups, and violence in the 1980s and 1990s, it has since transformed dramatically. Today, one of Colombia’s most vibrant and diverse arts destinations is gaining momentum, granting authentic ways to experience the city’s welcoming charm, culture, and art.
            - generic [ref=e1122]:
              - paragraph [ref=e1123]: Enjoy all three in the neighborhood of Comuna 13. Once a notorious barrio, it has evolved into a creative arts district today, full of dance performances, colorful murals, street-art tours, and an energetic vibe that comes from the resilience of the community.
              - paragraph [ref=e1124]: Colombians embraced street art in the 1980s, and it has continued to flourish with hundreds of murals throughout the city. Away from Comuna 13, the Medellín Street Art Festival takes place in February across several neighborhoods—downtown, El Poblado, and El Perpetuo Socorro among them. The festival’s organizer, Panorama Art Studio, aims to encourage artists to paint live murals, host and display works in pop-up art exhibitions, play street concerts, and more.
              - paragraph [ref=e1125]: One city gem, the Jardín Botánico de Medellín, shows off a collection of more than 1,400 plant species. In August, the annual 10-day Feria de Las Flores (Festival of the Flowers) rivals Rio de Janeiro’s Carnival. At its heart is the Silleteros Parade, where hundreds of flower artisans and their families carry elaborate floral displays on their backs, some weighing more than 150 pounds, that depict their life histories, land, and culture. The Museo de Antioquia has more traditional art, including a massive collection of paintings and sculptures by hometown hero and world-famous artist Fernando Botero. – Megan Ulu-Lani Boyanton
              - paragraph [ref=e1126]:
                - text: Take a deeper dive into Medellín’s art scene with our
                - link "destination spotlight" [ref=e1127] [cursor=pointer]:
                  - /url: https://www.nationalgeographic.com/travel/best-of-the-world-2026/article/medellin-colombia
                - text: ", and plan a visit during the Medellín Street Art Festival or to see Fernando Botero’s 23 sculptures at Plaza Botero."
