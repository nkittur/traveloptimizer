                - link "Dominica" [ref=e223] [cursor=pointer]:
                  - /url: https://www.nationalgeographic.com/travel/best-of-the-world-2026/article/dominica
                - text: with our destination spotlight, which has more information about Champagne Reef, Morne Trois Pitons National Park, and Kalinago Territory, home to the largest Indigenous community in the Caribbean.
