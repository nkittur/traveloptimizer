              - paragraph [ref=e534]:
                - text: Grab a place in the stands at BC Place for the world’s most watched sporting event, when Vancouver hosts seven
                - link "FIFA World Cup" [ref=e535] [cursor=pointer]:
                  - /url: https://www.fifa.com/en/tournaments/mens/worldcup/canadamexicousa2026
                - text: games next June and July. The combination of favorable currency conversions, new direct flights from Europe, and simple entry requirements (
                - link "Americans traveling on a valid U.S. passport don’t need a visa" [ref=e536] [cursor=pointer]:
                  - /url: https://www.cbsa-asfc.gc.ca/travel-voyage/td-dv-eng.html
                - text: ) helps make the Canadian city the best of the cup’s 16 North American host cities. No ticket? Head to the FIFA Fan Festival at Hastings Park for bands, food vendors, and live soccer matches broadcast on a huge amphitheater screen.
              - paragraph [ref=e537]: Away from the FIFA festivities, explore Vancouver’s wild side. Roughly a tenth of the coastal city’s 28,170 acres is parkland, and you’ll spot orcas and humpback whales among the marine life in the harbor. Fifteen minutes outside the city, Grouse Mountain has 12 lift-serviced mountain-biking trails through forested terrain. The Grouse Gravity Coaster, a two-person seated ride, careens 298 vertical feet down the mountain. And of course, you can always hike the challenging 1.6-mile trail to the summit, where the vistas take in the surrounding peaks, the city, and the Strait of Georgia.
              - paragraph [ref=e538]:
