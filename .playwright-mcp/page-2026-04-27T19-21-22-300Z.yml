              - paragraph [ref=e699]: "Why go: A South American megacity having a moment"
              - generic:
                - region
              - paragraph [ref=e700]: Many a serenade has been sung about Rio de Janeiro’s alluring beaches, passionate people, and iconic landmarks, enticing visitors to this fun-loving Brazilian city for well over a century. But Rio has revealed a few more reasons to visit in 2026. The National Museum of Brazil (Museu Nacional/UFRJ) is pushing for a second temporary reopening then, and a full reopening in 2028, following the tragic 2018 fire that burned down the 207-year-old institution. The National Museum of Fine Arts (Museu Nacional de Belas Artes), with plans to fully open in late 2026, is now hosting an exhibit by Brazilian photographer Vicente de Mello until mid-January. The iconic Copacabana Palace will unveil a facelift that features expanded suites and a new spa, and there’ll be another Todo Mundo no Rio music show on Copacabana Beach in front of millions, with—rumor has it—Beyoncé or Rihanna headlining.
              - paragraph [ref=e701]: "Classic experiences have new twists too: A fresh hiking trail up to the 98-foot-tall world wonder, Cristo Redentor (Christ the Redeemer), was recently added. And travelers to Pão de Açucár (Sugarloaf Mountain) can take the famous Parque Bondinho cable car. Hop aboard for a sunrise ride with live saxophone music and breakfast at the top."
              - paragraph [ref=e702]: Rio is also rising as a foodie destination, with several Michelin star restaurants. Lasai in Humaitá has two; Mee and Cipriani inside the Copacabana Palace hotel have one each. Other popular spots include Território Aprazível in Santa Teresa for fine dining accompanied by views over the city and Kinjo Nikkei in Copacabana for its Peruvian-Japanese fusion cuisine. – Joel Balsam
              - paragraph [ref=e703]:
