              - paragraph [ref=e572]: As some of Japan’s more popular destinations grapple with overtourism, mostly rural Yamagata Prefecture, roughly 200 miles north of Tokyo, offers moments of otherworldly quiet. Not even one percent of Japan’s visitors experience its sacred mountains, tranquil temples and shrines, and onsen villages.
              - paragraph [ref=e573]: The ski slopes and hot springs of Mount Zao, the photogenic hot-spring town of Ginzan Onsen, and the mountaintop Yamadera temple are all unforgettable destinations. In the mountains of Dewa Sanzan, travelers can join yamabushi mountain monks for waterfall meditations and mindfulness hikes.
              - paragraph [ref=e574]: One of the less visited Dewa Sanzan peaks, Mount Gassan receives so much snowfall that the ski season lasts until early summer. Then there’s Lake Shirakawa in Yamagata’s south, where snowmelt submerges the forests between late March and late May. Guided canoe tours weave right through the willows, with scenes of snowcapped Mount Iide in the distance.
              - paragraph [ref=e575]: In February, more than a thousand lamps and lanterns made of snow decorate the Uesugi Shrine in Yonezawa. In early August, thousands of dancers, wearing colorful kimonos and waving hats adorned with orange safflowers, take to the streets for the Yamagata Hanagasa Festival in Yamagata city. – Rob Goss
