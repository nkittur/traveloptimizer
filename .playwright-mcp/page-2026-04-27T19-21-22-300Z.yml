              - paragraph [ref=e290]:
                - text: A $53 million project to promote Hull’s many-layered maritime heritage wraps up in 2026, transforming this underrated northern England port city. A network of new interpretive sites brings some 800 years of seafaring history to life. Among them are the
                - link "Hull Maritime Museum" [ref=e291] [cursor=pointer]:
                  - /url: https://maritimehull.co.uk/projects/hull-maritime-museum
                - text: ", the North End Shipyard two-story visitors center, and two permanently docked museum ships: the 1960s Arctic Corsair cod trawler and the Spurn lightship, which once guided boats through the treacherous waters of the Humber Estuary near the city of Hull (Kingston upon Hull). The phased openings will be complete by summer 2026, making it the perfect time to discover the city’s laid-back charm."
            - generic [ref=e296]:
              - paragraph [ref=e297]:
                - text: At the edge of the North Sea, Hull was one of the world’s busiest whaling ports in the 19th century and a fishing and shipping hub until the 20th, before falling on hard times. Over the past decade, the city has undergone significant revitalization. Warehouses around Humber Street’s old waterside Fruit Market are now lively independent bars, restaurants, and art galleries. There’s also a spectacular performance amphitheater, called Stage@TheDock, overlooking River Hull where it meets the Humber Estuary; and a former shipyard has for over 20 years been the base for
                - link "The Deep" [ref=e298] [cursor=pointer]:
                  - /url: https://www.thedeep.co.uk/
                - text: ", one of the United Kingdom’s most highly respected aquariums and marine conservation centers."
              - paragraph [ref=e299]: A new Maritime Heritage Trail wends through the city’s Georgian Old Town, showing off new green spaces and public art inspired by the city’s ties to the sea (think illustrations based on scrimshaw engraved into amphitheater steps at the lovely Queen’s Gardens). The trail also draws visitors to Hull’s Museums Quarter, where the 18th-century birthplace of William Wilberforce—one of the U.K.’s most important anti-slavery campaigners—is now an excellent museum exploring the history of slavery and abolition. – Lorna Parkes
              - paragraph [ref=e300]:
                - text: Our
                - link "Hull destination spotlight" [ref=e301] [cursor=pointer]:
