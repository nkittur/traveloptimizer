              - paragraph [ref=e815]:
                - text: The birthplace of Portugal and its first king, Guimarães has one foot in its medieval past and the other in a green-tech future. Named the
                - link "European Green Capital for 2026" [ref=e816] [cursor=pointer]:
                  - /url: https://environment.ec.europa.eu/news/guimaraes-agueda-vaasa-win-2026-european-green-cities-awards-2024-11-27_en
                - text: by the European Commission, the city has been expanding bike lanes, adding green spaces, and cutting pollution as it works toward climate neutrality by 2030.
              - paragraph [ref=e817]:
                - text: Guimarães shows how a medieval town can evolve into a modern urban center without losing its character. With crenellated walls still intact, its 10th-century castle is among Portugal’s best preserved, while the
                - link "Palace of the Dukes of Bragança" [ref=e818] [cursor=pointer]:
                  - /url: https://www.museusemonumentos.pt/en/museus-e-monumentos/palace-of-the-dukes-of-braganca
                - text: impresses with its red-brick chimneys and fortified symmetry. Torre da Alfândega, in the old town center, is the only remaining tower of the defensive walls and looks over Guimarães Castle.
              - paragraph [ref=e819]:
                - link "Pousada Mosteiro Guimarães" [ref=e820] [cursor=pointer]:
                  - /url: https://www.pousadas.pt/br/hotel/pousada-guimaraes
                - text: ", a former 12th-century monastery turned luxury hotel, blends hospitality with history."
                - link "Cor de Tangerina" [ref=e821] [cursor=pointer]:
                  - /url: https://www.cordetangerina.pt/
                - text: ", just outside the dukes’ palace, is a local favorite for creative vegetarian and vegan cuisine, while top-rated"
                - link "A Cozinha" [ref=e822] [cursor=pointer]:
                  - /url: https://restauranteacozinha.pt/
                - text: serves a refined menu rooted in northern Portuguese flavors. Tavernas offer petiscos (small bites) alongside crisp vinho verde, which originated in the Minho region of northern Portugal. The frangipane-filled pastries called jesuítas are a delicious reminder of the city’s rich Catholic tradition. – Renata Haidle
