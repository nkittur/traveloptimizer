              - paragraph [ref=e610]: In time for Route 66’s centennial, Oklahoma is getting an Americana glow-up. Over the past four years, the Oklahoma Department of Transportation has invested more than $82 million in the state’s 400-mile stretch of the historic Mother Road, and it feels like there’s a spectacle of relit neon signs, revived motor courts, and roadside attractions waiting around every bend.
              - paragraph [ref=e611]:
                - text: Tulsa calls itself the Capital of Route 66, as it was the home of Roaring Twenties highway commissioner Cyrus Avery, who all but willed the classic road-trip route into existence. Follow it along 11th Street through the Meadow Gold District, full of indie retail, to admire the campy outdoor statues. A cosmic cowgirl and cowboy stand watch over art galleries and quirky gift shop Buck Atom’s Cosmic Curios. Rosie the Riveter looms near the vinyl shop Josey Records, while Cowboy Bob welcomes shoppers to
                - link "Buck’s Vintage" [ref=e612] [cursor=pointer]:
                  - /url: https://bucksvintage66.com/
                - text: ", which specializes in Western wear."
              - paragraph [ref=e613]:
                - text: If you’re cruising west through Arcadia,
                - link "Pops" [ref=e614] [cursor=pointer]:
                  - /url: https://pops66.com/
                - text: is a sweet detour, a working gas station with more than 700 varieties of bottled sodas—think flavors like beef teriyaki and strawberry jalapeño. In Clinton, the
                - link "Oklahoma Route 66 Museum" [ref=e615] [cursor=pointer]:
                  - /url: https://www.okhistory.org/sites/route66
                - text: dives deep into mid-century nostalgia, with a replica of a 1950s-style diner on-site. A year-long exhibition launching in July traces how the storied highway helped shape the nation. Flyover country? That’s in the rearview mirror. – Zoey Goto
