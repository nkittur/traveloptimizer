              - paragraph [ref=e996]:
                - text: In recent decades, Oaxaca City, the capital of the southern Mexican state of Oaxaca, has become an international destination for street art, exceptional cuisine, and Día de los Muertos (Day of the Dead) celebrations. Over 100 miles southwest of the brightly hued colonial capital, Oaxaca’s coast, known as Costa Chica, has remained a less traveled, quieter destination than Mexico’s more popular and accessible stretches of sand. But the small coast—renowned for its world-class surf—is every bit as enticing. It has spectacular, undeveloped beaches,
                - link "endemic birds" [ref=e997] [cursor=pointer]:
                  - /url: https://discover-oaxaca.com/tour/oaxaca-state-birding/
                - text: ", design-centric hotels, and countercultural enclaves, such as the queer-friendly, clothing-optional community of Zipolite."
