              - paragraph [ref=e856]: "Next August 12, a total solar eclipse will attract crowds to the rugged coastline and historic cities of Spain’s Basque Country—one of the few places on land in the path of the totality. Two prime spots to watch: the port city of Bilbao and the region’s inland capital of Vitoria-Gasteiz, both renowned for their architecture and cuisine."
              - paragraph [ref=e857]: Eclipse chasers in Bilbao can find top viewing areas in the lively, walkable Old City (Casco Viejo), the gentle hills of Parque Etxebarria (great city views anytime), and 823-foot Mount Artxanda, accessible by foot or funicular. The plaza outside Frank Gehry’s architectural masterpiece, the Guggenheim Museum, is also superb for catching the major sky event.
              - paragraph [ref=e858]: Whether you’re visiting for the eclipse or not, Bilbao’s Old Town has plenty to see. The Gothic Cathedral of Santiago de Compostela and the grand neoclassical colonnaded Plaza Nueva are there, as well as narrow streets lined with superb pintxos (the region’s equivalent to tapas) bars. Parque Etxebarria, Bilbao’s largest park, is a wonderful place for a picnic and, like Mount Artxanda, has spectacular panoramas across the city.
            - generic [ref=e863]:
              - paragraph [ref=e864]: In Vitoria-Gasteiz, home to four grand palaces, you can explore the Bendaña Palace, which houses the Bibat Archaeology Museum and the fascinating Fournier de Naipes Museum, dedicated to historic playing cards. Among all the gorgeous medieval and Renaissance architecture are some of Europe’s most beautiful parks. Parque de la Florida, Parque de San Juan de Arriaga, and the Plaza de la Virgen Blanca are all ideal places to watch a rare celestial event.
              - paragraph [ref=e865]: Outside the path of the totality but still well worth a visit, San Sebastián has the best pintxos, plus sweeping sandy bays, romantic seafront promenades, and a lively bar scene, with taverns looking to distinguish themselves by serving great food. – Eddi Fiegel
              - paragraph [ref=e866]:
                - text: Go for the solar eclipse but extend your stay with our
                - link "Basque Country destination spotlight" [ref=e867] [cursor=pointer]:
                  - /url: https://www.nationalgeographic.com/travel/best-of-the-world-2026/article/basque-country-spain
                - text: to visit the Guggenheim Bilbao, sample pintxos in San Sebastián, and explore the fishing village of Hondarribia.
