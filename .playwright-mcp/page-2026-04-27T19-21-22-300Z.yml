              - paragraph [ref=e778]: Koreans are avid day hikers, and the pandemic saw a growing interest in camping, backpacking, and trekking in South Korea, thanks in part to the country’s 23 national parks. The trend continues in 2026 as large sections of the Dongseo Trail, a 527-mile route modeled after Spain’s Camino de Santiago, are set to open.
              - paragraph [ref=e779]: When completed, the route will connect the east and west coasts, but hikers can already plan trips along many of its 55 segments. Each is eight to 12 miles long, ideal for day hiking. Most pass through two or three towns or villages, enabling hikers to refuel easily without having to carry supplies. For those intending to stay overnight and walk the next day, all towns have affordable motels and yeogwan (inns), while many villages have minbakjip (similar to homestays).
              - paragraph [ref=e780]: On the trail’s eastern end, Uljin is an unfussy fishing town with beaches lapped by the waves and restaurants serving fresh seafood. The Dongseo Trail’s western terminus, Anmyeondo, is an island connected to the rest of the country by a road bridge. Both are ideal places to relax legs and mind after a long hiking adventure. – Martin Zatko
