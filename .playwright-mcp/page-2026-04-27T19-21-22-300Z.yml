              - paragraph [ref=e141]: "Why go: A new wilderness park stands out with Indigenous-led experiences"
              - generic:
                - region
              - paragraph [ref=e142]: One of Québec’s newest and most breathtakingly wild national parks is the first to be managed by a First Nation. With the creation of Nibiischii Park, the Cree Nation of Mistissini has protected more than 4,000 square miles of peaceful lake country in the Eeyou Istchee-James Bay region of northern Québec. This vast area encompasses the province’s largest wildlife reserve, Albanel-Mistassini-and-Waconichi Lakes, accessible from Chibougamau, a 90-minute flight from Montréal on Cree-owned airline Air Creebec.
            - generic [ref=e147]:
              - paragraph [ref=e148]: "In the reserve, Waconichi Lake’s waterfront cabins, floating chalets, and sauna provide a summer wilderness retreat for anglers and paddlers, as well as wildlife-watchers, who can take in panoramas of the lake and surrounding boreal forest from a new cliffside walkway and suspension bridge. Last winter, for the first time, the nation opened its lodge year-round and launched Cree-led winter activities: fireside storytelling, crafting workshops, and wilderness survival classes."
              - paragraph [ref=e149]: "On your way north to the park, some new First Nations cultural initiatives present extra reasons to linger in Montréal: an outdoor sculpture trail along Peel Street made as a collaboration between an Indigenous artist and a non-Indigenous one, a new Inuit art gallery at the Montréal Museum of Fine Arts, and, 20 minutes south, the Kahnawà:ke Cultural Arts Center, which opens in the Kanien’kehá:ka (Mohawk) community in 2026. – Karen Gardiner"
              - paragraph [ref=e150]:
                - text: See our
                - link "Québec destination spotlight" [ref=e151] [cursor=pointer]:
                  - /url: https://www.nationalgeographic.com/travel/best-of-the-world-2026/article/quebec-canada
                - text: for more information on how to plan a visit to the Canadian province’s newest national park, Nibiischii National Park.
