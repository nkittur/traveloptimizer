              - paragraph [ref=e329]: "Why go: The Theodore Roosevelt Presidential Library reflects a complex man—and an enigmatic landscape"
              - generic:
                - region
              - paragraph [ref=e330]: Theodore Roosevelt was a native New Yorker, but North Dakota’s Badlands are where he sought refuge, first to hunt bison in 1883, then to grieve the simultaneous deaths of his wife and his mother in 1884. The rugged landscape and its then disappearing wildlife shaped the 26th president’s character and thoughts on conservation. Next summer (July 4, 2026), Teddy’s stomping grounds will welcome the 93,000-square-foot Theodore Roosevelt Presidential Library, perched high on a butte above the wild little frontier-throwback town of Medora.
            - generic [ref=e335]:
              - paragraph [ref=e336]: Interactive exhibits will transport visitors to crucial periods and places in Roosevelt’s life—from his family brownstone in Manhattan to his time in the White House to his expeditions in Africa and the Amazon. The institution aims to “humanize, not lionize” the president, who, for all his political and environmental leadership, held some deeply racist views. Designed by the Norwegian architectural firm Snøhetta, the building disappears into the landscape, built with compressed wood beams and a walkable roof covered in native vegetation. The roof itself is part of a 1.3-mile trail with outlooks toward adjoining Theodore Roosevelt National Park, where visitors can see bison, the ancient ungulate that Roosevelt had the vision to protect after watching them hunted to near extinction.
              - paragraph [ref=e337]: While in the area, consider a visit to the nearby new Three Affiliated Tribes National Park, formerly a 2,100-acre ranch on the traditional homelands of the Mandan, Hidatsa, and Arikara (the tribes had to purchase the ranchland after it was taken from them). Visitors can participate in photography workshops and Indigenous ranger-led hikes that explore the breathtakingly spare Little Missouri Badlands. – Stephanie Pearson
