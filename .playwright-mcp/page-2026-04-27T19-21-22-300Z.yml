              - paragraph [ref=e215]: Approximately 200 sperm whales swim year-round in Dominica’s waters, and the Caribbean nation is currently on the cusp of establishing the world’s first sperm whale reserve, likely by early 2026. The Dominica Sperm Whale Reserve will protect nearly 800 square kilometers of water off the island’s west coast, where the majestic sea creatures roam, underscoring the national commitment to marine conservation. Visitors will have the opportunity to swim with whales or observe them from a boat, but reserve staff will regulate the number to ensure the big mammals aren’t disturbed.
            - generic [ref=e220]:
              - paragraph [ref=e221]: Back on land, the multiple hotels and resorts in development include Sanctuary Rainforest Eco Resort and Spa and Anichi Resort & Spa. Two-thirds of mountainous Dominica is a wild and undeveloped island where dense rainforests, bubbling hot springs, and towering waterfalls await at every turn. Hop aboard one of the world’s longest cable cars for an expansive view of the island that ends at Boiling Lake. This hot spring lake, the planet’s second largest, was previously accessible only after a challenging eight-mile round-trip hike. – Kristin Braswell
              - paragraph [ref=e222]:
