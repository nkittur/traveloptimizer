              - paragraph [ref=e466]: The open-air-museum city of Khiva steps out of the shadows of Uzbekistan’s more famous Silk Road oases, Samarkand and Bukhara, in 2026. High-speed train service, expected to start in the fall, will cut almost in half the travel time from Uzbekistan’s capital, Tashkent. You can breakfast beneath the mosaic domes of Tashkent’s Chorsu Bazaar and still reach Khiva in time for shivit oshi at the foot of the Islam Khodja Minaret. The Italian hospitality company Arsenale, meanwhile, is launching a luxurious sleeper service, the Samarkand Express. And with the opening of Mercure Khiva, which takes its inspiration from the vernacular architecture of the city’s Mevaston neighborhood, Khiva will have its first international five-star hotel in October 2026.
              - paragraph [ref=e467]: You can spend days wandering the Itchan Kala fortress, a UNESCO World Heritage site since 1990, where geometric-patterned tiled monuments, a wooden-pillared mosque, and opulent palaces have all been meticulously restored. But Khiva isn’t just a destination for architecture lovers.
              - paragraph [ref=e468]: The new Silk Road-themed Arda Khiva resort widens the appeal for families with a water park and an amphitheater for live shows. Khiva’s calendar of annual events includes the Lazgi International Dance Festival, a celebration of traditional Khorezmian dance forms; the Pahlavon Mahmud Strongmen Games, which takes its name from a 14th-century poet, wrestling champion, and the patron saint of Khiva; and the Qovun Sayli Melon Festival, a boisterous three-day party honoring Khiva’s favorite fruit. – Sophie Ibbotson
