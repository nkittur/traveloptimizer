                - text: ’s “
                - link "Eanangiella – Voice of the Land" [ref=e735] [cursor=pointer]:
                  - /url: https://ouluntaidemuseo.fi/en/exhibition/eanangiella-voice-of-the-land/
                - text: ” exhibition spotlights Sami art, material culture, and soundscapes.
              - paragraph [ref=e736]:
                - text: In the summer, people kayak to nearby islands, cycle through lush forests, and relax at the café-lined Kauppatori market square. Launching in June, a new public art trail showcases climate-focused work made by artists collaborating with scientists. Come November, the 10-day
                - link "Lumo Art & Tech" [ref=e737] [cursor=pointer]:
                  - /url: https://oulu2026.eu/en/programme/culture-programme/lumo-art-tech/
                - text: festival features “light art” exhibitions, a symphony concert paired with astral photography, and more. Of course, in the winter, the northern lights put on their own dazzling light show.
              - paragraph [ref=e738]:
                - link "Arctic Food Lab" [ref=e739] [cursor=pointer]:
