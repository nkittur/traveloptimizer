              - paragraph [ref=e102]:
                - text: All eyes will be on Milan and the northeastern ski resort of Cortina d’Ampezzo for the
                - link "2026 Winter Olympic and Paralympic Games" [ref=e103] [cursor=pointer]:
                  - /url: https://milanocortina2026.olympics.com/en
                - text: in February and March. It’s the most geographically dispersed Winter Games ever, with ceremonies and competitions happening across 8,500 primarily mountainous square miles of northern Italy. Most will be held in the Dolomites, putting a spotlight on the legendary Alpine range.
            - generic [ref=e108]:
              - paragraph [ref=e109]: Want to follow in Olympians’ footsteps? Cortina d’Ampezzo is part of Dolomiti Superski, the world’s largest ski area, connecting 12 resorts and 29,652 acres of terrain with one pass. The Dolomites are known for their sculptural relief—colossal walls, serrated ridges, and piercing spires—and the sights from the lifts are as exhilarating as the downhill. Many of those lifts keep running in summer, when the meadows bloom with purple snowbells and yellow poppies, and the long sunsets extend the alpenglow.
              - paragraph [ref=e110]:
                - text: Award-winning field-to-table restaurants include
                - link "Atelier Moessmer," [ref=e111] [cursor=pointer]:
                  - /url: https://www.ateliernorbertniederkofler.com/en/
                - text: in the restored manor of a 19th-century textile mill, and high-concept
                - link "Grual" [ref=e112] [cursor=pointer]:
                  - /url: https://grual.lefayresorts.com/it/
                - text: ", where each locavore dish represents a stage in a culinary journey, from the valley floor to an alpine pasture to the summit of a mountain. And a number of hotels are being revamped ahead of the games, especially with a focus on boutique and luxury stays. A highlight is the"
                - link "Aman Rosa Alpina" [ref=e113] [cursor=pointer]:
                  - /url: https://www.aman.com/resorts/aman-rosa-alpina
                - text: ", which has taken over a chalet-style property in San Cassiano. Its newly renovated guest rooms are crafted from timber and natural stone, with floor-to-ceiling views of the panorama beyond. – Angela Locatelli"
              - paragraph [ref=e114]:
                - text: Our destination spotlight for the
                - link "Dolomites" [ref=e115] [cursor=pointer]:
                  - /url: https://www.nationalgeographic.com/travel/best-of-the-world-2026/article/dolomites-milan-italy
                - text: is your guide to planning a visit to explore Ladin culture at the Museum Ladin Ciastel de Torin in the village of San Martino.
