              - paragraph [ref=e906]: "Why go: The island is rebounding from wildfires in spectacular fashion"
              - generic:
                - region
              - paragraph [ref=e907]: In 2023, wildfires on Maui claimed more than a hundred lives, caused $5.5 billion in damage, and devastated the vibrant and historic beach town of Lāhainā. The island rallied to rebuild, and while some fire-affected areas remain closed off, many cherished Lāhainā businesses have reopened, including Old Lāhainā Lū‘au, Lāhainā Cannery Mall, and Maui Ku‘ia Estate Chocolate.
            - generic [ref=e912]:
              - paragraph [ref=e913]: "Visiting Maui right now is an act of kōkua—that is, support—but it’s more than just a feel-good choice. With tourism still down from pre-fire levels, Maui in 2026 grants a rare glimpse of the island in a quieter mode. Once crowded beaches feel intimate, and to help them fill up again, some of the island’s top hotels have made big investments in guest experience: The Grand Wailea just debuted Hawaii’s largest spa, while the newly refreshed Wailea Beach Resort now boasts an adults-only wellness sanctuary with an infinity-edge pool. And many hotels, such as the Four Seasons Resort Maui, foster opportunities to give back, in partnership with Mālama Hawai‘i, a voluntourism initiative that leads guests on beach cleanups, native-plant restoration hikes, and more."
              - paragraph [ref=e914]: As businesses shuttered by the fires continue to reopen, events like the Maui Marathon, the Sentry, and the Hawai’i Food & Wine Festival are also coming back, drawing visitors to one of the world’s most captivating destinations. – Emily Hochberg
