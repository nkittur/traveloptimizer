                    - strong [ref=e380]: What is it?
                    - text: An upscale seaside town for dining, shopping, and gazing out over the Pacific.
                  - paragraph [ref=e381]:
                    - strong [ref=e382]: Why go?
                    - text: Dubbed the “jewel of Southern California,” La Jolla is a curiously quaint Mediterranean-style village just a few minutes’ drive from downtown—
                    - generic [ref=e383]:
                      - text: but feels like you’ve accidentally taken the exit for Greece or Italy. There’s plenty to keep you entertained here, including some of the city’s finest restaurants like
                      - link "George's at the Cove" [ref=e384] [cursor=pointer]:
                        - /url: https://www.georgesatthecove.com/
                      - text: and
                    - link "Nine-Ten" [ref=e385] [cursor=pointer]:
                      - /url: http://www.nine-ten.com
                    - text: in the Grande Colonial Hotel. Don’t miss the nearby
                    - link "Legends Gallery" [ref=e386] [cursor=pointer]:
                      - /url: http://www.legendsgallerylajolla.com
                    - text: ", which boasts a nice collection of artwork by late La Jolla resident Dr. Seuss."
                  - paragraph [ref=e387]:
                    - strong [ref=e388]: "Time Out tip:"
                    - text: Crowds gather around the Instagram-friendly Children’s Pool Beach in
                    - link "La Jolla Cove" [ref=e389] [cursor=pointer]:
                      - /url: http://www.lajollabythesea.com
                    - text: where you’ll almost always find groups of seals and sea lions sunbathing on the rocks and sand. Walk along Coast Boulevard for the best views overlooking the rugged coastal bluffs.
