                - generic [ref=e336]:
                  - paragraph [ref=e337]:
                    - strong [ref=e338]: What is it?
                    - text: A vintage, beachside amusement park in Mission Beach.
                  - paragraph [ref=e339]:
                    - strong [ref=e340]: Why go?
                    - text: Celebrating 100 years in operation,
                    - link "Belmont Park" [ref=e341] [cursor=pointer]:
                      - /url: https://www.belmontpark.com/
                    - text: is not just for kiddos. Mini-golf, laser tag, a climbing wall, arcade and zipline make for a fun night at this approachable park that sits right along the busy boardwalk in the heart of Mission Beach. There are also concessions like funnel cakes, ice cream, fudge, churros, and even Dole Whips to help fuel your time between thrilling rides. Purchase a ticket bundle if you plan to go on multiple rides, or a Ride & Play Pass for unlimited rides and attractions.
                  - paragraph [ref=e342]:
                    - strong [ref=e343]: "Don’t miss:"
                    - text: The thrilling centerpiece of this historic amusement park is called the Giant Dipper—and it’s a historic landmark in its own right. The construction of this incredible wooden roller coaster dates back to 1925, the so-called “golden age” of wooden coasters, but it can still be ridden today thanks to a $2 million restoration. For just $8 per person, you can ride its famous dips and turns (at 48 mph!) while you take in beautiful views of neighboring Mission Bay and the Pacific Ocean—if you keep your eyes open, that is.
                  - paragraph [ref=e344]:
                    - strong [ref=e346]: "Address:"
                    - text: 3146 Mission Blvd, San Diego, CA 92109
                  - paragraph [ref=e347]:
                    - generic [ref=e348]:
                      - strong [ref=e349]: "Opening hours:"
                      - link "Check calendar" [ref=e350] [cursor=pointer]:
                        - /url: https://www.belmontpark.com/park-hours
                      - text: for current park hours.
                  - paragraph [ref=e351]:
                    - generic [ref=e352]:
                      - strong [ref=e353]: "Pricing:"
                      - text: Pay-as-you-go options are available with
                    - text: individual ticket bundles starting at $16, while passes for unlimited rides and attractions start at $54.95. Park admission is free.
