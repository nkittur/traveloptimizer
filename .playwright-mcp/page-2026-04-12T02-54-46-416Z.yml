                - heading "10. Eat Mexican food in Barrio Logan" [level=3] [ref=e566]
                - generic [ref=e568]:
                  - img "Eat Mexican food in Barrio Logan" [ref=e570]
                  - generic [ref=e572]: "Photograph: SeaShanel / Shutterstock.com"
                - generic [ref=e575]:
                  - paragraph [ref=e576]:
                    - strong [ref=e577]: What is it?
                    - text: A historic Mexican-American neighborhood just south of downtown.
                  - paragraph [ref=e578]:
                    - strong [ref=e579]: Why go?
                    - text: You’re tantalizingly close to the border, but you don’t need to cross it for some seriously authentic Mexican food. Beeline for the Barrio Logan neighborhood, the epicenter of San Diego’s Hispanic community, for lunch or dinner. Get some of the city's best tacos from
                    - link "Salud Tacos" [ref=e580] [cursor=pointer]:
                      - /url: https://saludtacos.com/
                    - text: ", which also has great daily specials. For dessert, stroll to nearby"
                    - link "Panchitas Bakery" [ref=e581] [cursor=pointer]:
                      - /url: http://www.panchitasbakery.com/
                    - emphasis [ref=e582]: ","
                    - text: which holds legendary status among San Diegans for its homemade Mexican pastries and steaming hot chocolate.
                  - paragraph [ref=e583]:
                    - strong [ref=e584]: "Time Out tip:"
                    - text: Cruise the main business district along Logan Avenue to peep classic cars and lowriders; shop local boutiques for cool handmade crafts and wares; spend time at Chicano Park to take in powerful and beautiful murals; stop in to Por Vida coffee shop for specialty Mexican-inspired drinks; and say
                    - emphasis [ref=e585]: salud
                    - text: over a craft beer at the female-owned Mujeres Brew House. You’ll leave with a greater appreciation for Mexican culture.
                  - paragraph [ref=e586]:
                    - strong [ref=e587]: "Address:"
                    - text: Map to Logan Avenue to explore on foot.
                - link "Book now" [ref=e590] [cursor=pointer]:
                  - /url: https://activities.timeout.com/barrio-logan-san-diego-l177714/
            - generic [ref=e594]: Advertising
            - article [ref=e597]:
              - generic [ref=e598]:
                - heading "11. Drink local craft beer" [level=3] [ref=e601]
                - generic [ref=e603]:
                  - img "Drink local craft beer" [ref=e605]
                  - generic [ref=e607]: "Photograph: Courtesy of San Diego Brewers Guild/Oveth Martinez"
                - generic [ref=e610]:
                  - paragraph [ref=e611]:
                    - strong [ref=e612]: "What is it:"
                    - text: San Diego is home to more than 150 independent craft breweries, with a local specialty being hoppy IPAs.
                  - paragraph [ref=e613]:
                    - strong [ref=e614]: "Why go:"
                    - text: No matter what style of beer you prefer, there’s likely a brewery, brewpub, or tasting room serving it on tap in San Diego. Nicknamed the “Capital of Craft,” San Diegans are serious about their brew and will swiftly reject big beer brands. There's even a
                    - link "San Diego Beer Week" [ref=e615] [cursor=pointer]:
                      - /url: https://www.sdbeer.com/sdbeerweek.html
                    - text: each November with events taking place at venues across the county. Though if you want to get a sampling of the area's beer, wine, AND food, check out the annual
                    - link "Del Mar Wine + Food Festival" [ref=e616] [cursor=pointer]:
                      - /url: https://delmar.wine/
                    - text: and
                    - link "San Diego Food + Wine Festival" [ref=e617] [cursor=pointer]:
                      - /url: https://www.sandiegowineclassic.com/
                    - text: held in the fall.
                  - paragraph [ref=e618]:
                    - strong [ref=e619]: "Time Out tip:"
                    - text: You can easily visit well-known, long-standing breweries like Stone Brewing, Karl Strauss and Ballast Point, but be sure to sample other well-loved labels like AleSmith, Pizza Port, Coronado Brewing, Harland Brewing, Fall Brewing and Belching Beaver. Most tasting rooms will offer a tasting flight option to sample several pours before deciding on your frontrunner. Plan ahead to see if they have a kitchen or onsite food truck as many don't serve food.
                  - paragraph [ref=e620]:
                    - strong [ref=e621]: "Address:"
                    - text: Visit
                    - link "SDbeer.com" [ref=e622] [cursor=pointer]:
                      - /url: https://web.sdbeer.com/Brewery-Member
                    - text: for a list of local breweries.
            - article [ref=e623]:
              - generic [ref=e624]:
                - heading "12. Browse Little Italy Mercato Farmers’ Market" [level=3] [ref=e627]
                - generic [ref=e629]:
                  - img "Browse Little Italy Mercato Farmers’ Market" [ref=e631]
                  - generic [ref=e633]: "Photograph: Courtesy Joanne DiBona/SanDiego.org"
                - generic [ref=e636]:
                  - paragraph [ref=e637]:
                    - strong [ref=e638]: What is it?
                    - text: San Diego County’s largest farmers’ market, held twice a week, year-round.
                  - paragraph [ref=e639]:
                    - strong [ref=e640]: Why go?
                    - text: "To get a feel for the real San Diego, do as the locals do: Grab your reusable bag and head for the"
                    - link "Little Italy Mercato Farmers’ Market" [ref=e641] [cursor=pointer]:
                      - /url: https://sandiegomarkets.com/
                    - text: . Here, you’ll discover an array of beautiful, fresh, local produce, meat and eggs, flowers and straight-outta-the-ocean seafood. There’s also live music and made-to-order food at this market that covers six city blocks. If you can’t make this one held Saturdays and Wednesdays, other farmers’ markets take place every day of the week in San Diego, with more than 30 held across the city every weekend. For a complete schedule, visit the
                    - link "San Diego Farm Bureau" [ref=e642] [cursor=pointer]:
                      - /url: http://sdfarmbureau.org/BuyLocal/Farmers-Markets.php
                    - text: .
                  - paragraph [ref=e643]:
                    - strong [ref=e644]: "Time Out tip:"
                    - text: Make your way through the market grabbing free samples along the way. Nab citrus and avocados from Heritage Family Farms; veggies from JR Organics Farm; hummus from Baba Foods; cookies from Maya’s Cookies; and bread from Swells Sourdough Bakery. Come hungry to make a meal out of sushi from Vegan Mirai, samosas from Masala Cottage, and boba from Cocobomb.
                  - paragraph [ref=e645]:
                    - strong [ref=e646]: "Address:"
                    - text: 600 W Date St, San Diego, CA 92101
                  - paragraph [ref=e647]:
                    - strong [ref=e648]: "Opening hours:"
                    - text: Sat 8am–2pm; Wed 9:30am–1:30pm
            - generic [ref=e652]: Advertising
            - article [ref=e655]:
              - generic [ref=e656]:
                - heading "13. Smell the flowers at San Diego Botanic Garden" [level=3] [ref=e659]
                - generic [ref=e661]:
                  - img "Smell the flowers at San Diego Botanic Garden" [ref=e663]
                  - generic [ref=e665]: "Photograph: Courtesy San Diego Botanic Garden"
                - generic [ref=e668]:
                  - paragraph [ref=e669]:
                    - strong [ref=e670]: What is it?
                    - text: A botanical garden with North America’s largest public bamboo collection.
                  - paragraph [ref=e671]:
                    - strong [ref=e672]: Why go?
                    - text: Tucked into an Encinitas neighborhood, the
                    - link "San Diego Botanic Garden" [ref=e673] [cursor=pointer]:
                      - /url: https://sdbg.org
                    - text: is a gorgeous 37-acre sanctuary with four miles of walking trails, more than 5,000 plant species, and nearly 30 different types of gardens. Just as much fun for kids as it is for adults, the botanic garden has dedicated children’s areas, plus classes, tours, and special presentations throughout the year. During summer, the garden stays open late on select nights, featuring concerts and other events.
                  - paragraph [ref=e674]:
                    - strong [ref=e675]: "Time Out tip:"
                    - text: The best time of year to visit is during their Lightscape holiday light show extravaganza that starts in November. It makes for a festive night out for adults and kids with lots of Instagrammable displays. Check the garden’s website for current exhibits; previous ones have included things like a corpse flower that only blooms every couple of years, lasting for only two days while releasing a stinky scent. If you’re visiting the garden with kids, be sure to start at Toni’s Tree House in the Hamilton Children’s Garden area, which also includes an edible garden and mountain stream.
                  - paragraph [ref=e676]:
                    - strong [ref=e677]: "Address:"
                    - text: 300 Quail Gardens Dr, Encinitas, CA 92024
                  - paragraph [ref=e678]:
                    - generic [ref=e679]:
                      - strong [ref=e680]: "Opening hours:"
                      - text: Wed–Mon 9am–5pm
                  - paragraph [ref=e681]:
                    - generic [ref=e682]:
                      - strong [ref=e683]: "Pricing:"
                      - text: Adult tickets are $20.
