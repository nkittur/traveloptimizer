                - 'link "Explore cultural institutions at Balboa Park Photograph: Joanne DiBona" [ref=e175] [cursor=pointer]':
                  - /url: /san-diego/attractions/balboa-park
                  - img "Explore cultural institutions at Balboa Park" [ref=e177]
                  - generic [ref=e179]: "Photograph: Joanne DiBona"
                - generic [ref=e182]:
                  - paragraph [ref=e183]:
                    - strong [ref=e184]: What is it?
                    - text: A 1,200-acre urban park in the middle of the city.
                  - paragraph [ref=e185]:
                    - strong [ref=e186]: Why go?
                    - text: San Diego is not short of beautiful parks, but
                    - link "Balboa Park" [ref=e187] [cursor=pointer]:
                      - /url: https://balboapark.org/
                    - text: is the undisputed king of them all. You’re going to want to factor in at least half a day for this, as the park is home to 18 fantastic museums, some international houses, organ pavilion concerts, and the unmissable Old Globe Theatre. You could get lost for hours strolling through gardens and admiring architecture, but if you want to do it properly, book a walking tour of the park.
                  - paragraph [ref=e188]:
                    - strong [ref=e189]: "Time Out tip:"
                    - text: "In addition to museums, be sure to visit these free points of interest: Botanical Building and Lily Pond, Bea Evenson Fountain, Inez Grant Parker Memorial Rose Garden, the Moreton Bay Fig Tree, Spreckels Organ Pavilion, House of Hospitality, and the House of Pacific Relations International Cottages (open on weekends). At mealtime, head to Artifact at Mingei for eclectic international cuisine, the Prado for a Spanish-leaning menu, or the open-air Panama 66 for beers and apps."
                  - paragraph [ref=e190]:
                    - strong [ref=e191]: "Address:"
                    - text: 1549 El Prado, San Diego, CA 92101
                  - paragraph [ref=e192]:
                    - strong [ref=e193]: "Opening hours:"
                    - text: Visitors center daily 9:30am–4:30pm
                  - paragraph [ref=e194]:
                    - strong [ref=e195]: "Pricing:"
                    - text: Park admission is free, but most museums charge $20–$30 per adult. Timken Museum of Art and the Botanical Building are always free.
