                - 'link "See giant pandas at San Diego Zoo Photograph: Courtesy San Diego Zoo/Ken Bohn" [ref=e231] [cursor=pointer]':
                  - /url: /san-diego/attractions/san-diego-zoo
                  - img "See giant pandas at San Diego Zoo" [ref=e233]
                  - generic [ref=e235]: "Photograph: Courtesy San Diego Zoo/Ken Bohn"
                - generic [ref=e238]:
                  - paragraph [ref=e239]:
                    - strong [ref=e240]: What is it?
                    - text: A world-renowned, 100-acre zoo with more than 12,000 animals including some rare and endangered species.
                  - paragraph [ref=e241]:
                    - strong [ref=e242]: Why go?
                    - text: As the first zoo to introduce cageless, open-air exhibits, San Diego Zoo pioneered these natural animal habitats, which are really something to behold. It’s one of the only places outside China where you can spot giant pandas, and the zoo offers everything from strolls at sunrise to overnight camping. And if you can’t get enough, the
                    - link "San Diego Zoo Safari Park" [ref=e243] [cursor=pointer]:
                      - /url: https://sdzsafaripark.org/
                    - text: is located about 30 minutes north of the San Diego Zoo in Escondido and has an exciting new elephant enclosure.
                  - paragraph [ref=e244]:
                    - strong [ref=e245]: "Time Out tip:"
                    - text: It’s all about the giant pandas right now (they returned to China and are now back in San Diego after nearly five years), but the elephants, koalas, polar bears, lions, tigers giraffes, hippos, and grizzly bears are also a big draw. Nighttime Zoo during the summer offers extended operating hours, and Jungle Bells in December brings festive decor and holiday lights to the zoo. Little ones will be thrilled to play at Denny Sanford Wildlife Explorers Basecamp, an interactive play area for kids of all ages.
                  - paragraph [ref=e246]:
                    - strong [ref=e247]: "Address:"
                    - text: 2920 Zoo Dr, San Diego, CA 92101
                  - paragraph [ref=e248]:
                    - strong [ref=e249]: "Opening hours:"
                    - text: Varies by season; Nov–Feb 9am–5pm; Mar–May, Sept–Oct 9am–6pm; June–Aug 9am–9pm
                  - paragraph [ref=e250]:
                    - strong [ref=e251]: "Pricing:"
                    - text: Single day tickets are $73–$78 for adults and $63–$68 for children ages 3-11.
                - generic [ref=e252]:
