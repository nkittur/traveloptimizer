                - 'link "Take flight at Torrey Pines Gliderport Photograph: Courtesy SanDiego.org" [ref=e968] [cursor=pointer]':
                  - /url: /usa/san-diego/sports-and-fitness/torrey-pines-gliderport
                  - img "Take flight at Torrey Pines Gliderport" [ref=e970]
                  - generic [ref=e972]: "Photograph: Courtesy SanDiego.org"
                - generic [ref=e975]:
                  - paragraph [ref=e976]:
                    - strong [ref=e977]: What is it?
                    - text: A private paragliding and hang gliding site plus flight school.
                  - paragraph [ref=e978]:
                    - strong [ref=e979]: Why go?
                    - text: Enjoy a bird’s-eye view of San Diego’s exceptional Torrey Pines State Natural Reserve by swooping serenely overhead in a paraglider.
                    - link "Torrey Pines Gliderport" [ref=e980] [cursor=pointer]:
                      - /url: https://www.flytorrey.com/
                    - text: is home to one of the most successful paragliding schools in North America. You’ll be strapped to a qualified pilot so there’s nothing to worry about except enjoying the sweeping ocean views of the 2,000-acre reserve, its numerous hiking trails, and sandstone cliffs beneath you. Afterward, sandwiches and salads await you at Cliffhanger Cafe and Bar.
                  - paragraph [ref=e981]:
                    - strong [ref=e982]: "Time Out tip:"
                    - text: Optimal flight conditions are usually when winds are blowing from the southwest to the northwest, at least 8mph. If you’re not ready to take the leap or want to see what you’re getting yourself into first, there are plenty of spectators watching from the cliffs above. A flight reservation is not needed to simply hang out or grab lunch there while enjoying gorgeous views above the ocean bluffs. From April to September, you can enjoy live music at the gliderport every Saturday.
                  - paragraph [ref=e983]:
                    - strong [ref=e984]: "Address:"
                    - text: 2800 Torrey Pines Scenic Dr, La Jolla, CA 92037
                  - paragraph [ref=e985]:
                    - strong [ref=e986]: "Opening hours:"
                    - text: Daily 9am–5pm
                  - paragraph [ref=e987]:
                    - strong [ref=e988]: "Pricing:"
                    - text: Flight experiences start at $200.
                - link "Read more" [ref=e991] [cursor=pointer]:
                  - /url: /usa/san-diego/sports-and-fitness/torrey-pines-gliderport
            - article [ref=e992]:
              - generic [ref=e993]:
                - heading "22. Spot marine life at San Diego Whale Watch" [level=3] [ref=e996]
                - generic [ref=e998]:
                  - img "Spot marine life at San Diego Whale Watch" [ref=e1000]
                  - generic [ref=e1002]: "Photograph: Courtesy Joanne DiBona/SanDiego.org"
                - generic [ref=e1005]:
                  - paragraph [ref=e1006]:
                    - strong [ref=e1007]: What is it?
                    - text: Year-round whale watching tours that take off from Mission Bay.
                  - paragraph [ref=e1008]:
                    - strong [ref=e1009]: Why go?
                    - text: Whale-watching trips from the city are both plentiful and fruitful, with blue whales at the center of attention between June and September and their gray cousins taking over from December through April. Humpback whales, dolphins, and sea lions are also known to make an appearance.
                    - link "San Diego Whale Watch" [ref=e1010] [cursor=pointer]:
                      - /url: https://sdwhalewatch.com/
                    - text: offers excursions for $56 per person. Daytime and sunset tours are available, plus private charters. A marine naturalist is onboard for every tour to share fun ocean facts and information about local wildlife. Tours last about around two-and-a-half hours.
                  - paragraph [ref=e1011]:
                    - strong [ref=e1012]: "Time Out tip:"
                    - text: "More than 20,000 gray whales migrate past San Diego annually, and a boat tour is the best way to see them up close. While indoor and outdoor seating is available onboard, posting up outdoors will give you the best view and photo vantage point. Morning tours tend to have smoother conditions for those worried about seasickness. Don’t worry: If you don’t see a whale or dolphin during your tour, your next trip is free!"
                  - paragraph [ref=e1013]:
                    - strong [ref=e1014]: "Address:"
                    - text: 1617 Quivira Rd, San Diego, CA 92109
                  - paragraph [ref=e1015]:
                    - strong [ref=e1016]: "Opening hours:"
                    - text: Mon–Thu 9am–5pm; Fri–Sun 8am–5pm
                  - paragraph [ref=e1017]:
                    - strong [ref=e1018]: "Pricing:"
                    - text: Excursions start at $56 per person.
                - link "Book now" [ref=e1021] [cursor=pointer]:
                  - /url: https://activities.timeout.com/s/?q=San+Diego+whale+watch&searchSource=3
