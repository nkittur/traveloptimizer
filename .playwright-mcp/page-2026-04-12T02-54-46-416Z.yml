                    - text: A destination hotel on the sand that welcomes a ton of day and overnight visitors alike.
                  - paragraph [ref=e498]:
                    - strong [ref=e499]: Why go?
                    - text: You have likely seen this hotel before, whether you’re a local or not. The
                    - link "Hotel del Coronado" [ref=e500] [cursor=pointer]:
                      - /url: https://www.hoteldel.com/
                    - text: was featured in the Marilyn Monroe movie
                    - emphasis [ref=e501]: Some Like It Hot—
                    - text: and that’s not all it’s known for. This is a buzzing, tourist-filled, iconic landmark in Coronado serving up Hollywood history and great food (check out the new Nobu Del Coronado for high-end Japanese cuisine) in a seriously glamorous oceanfront setting.
                  - paragraph [ref=e502]:
                    - generic [ref=e503]:
                      - strong [ref=e504]: "Time Out tip:"
                      - text: "Come during the holidays when “The Del” is decked out in festive decor and has its Skating by the Sea beachfront ice rink constructed. Or visit during summer and book a Beach Roast bonfire to make s’mores treats while overlooking the Pacific. They also host movies on the beach, offer guided property tours, and hold cycling classes on the beach. You can’t go wrong with a meal at one of their signature restaurants: Veranda, Serẽa, and the Sun Deck. Watching the sunset from pretty much anywhere at the resort promises to be a core memory."
