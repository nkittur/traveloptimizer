                - generic [ref=e730]:
                  - img "Snap pretty pics at the Flower Fields" [ref=e732]
                  - generic [ref=e734]: "Photograph: Courtesy The Flower Fields"
                - generic [ref=e737]:
                  - paragraph [ref=e738]:
                    - strong [ref=e739]: "What is it:"
                    - text: Five acres’ worth of colorful giant tecolote ranunculus flower fields that bloom every spring.
                  - paragraph [ref=e740]:
                    - strong [ref=e741]: "Why go:"
                    - text: You don’t have to travel to Denmark to look out over nearly 80 million flowers in 13 vibrant colors.
                    - link "The Flower Fields" [ref=e742] [cursor=pointer]:
                      - /url: https://www.theflowerfields.com
                    - text: in Carlsbad is one of the most photographed floral displays in the country, which also includes family-friendly activities like tractor wagon rides, a butterfly enclosure, sweet pea maze, children’s playground, sluice mining for gemstones, and U-pick blueberries (Mondays and Tuesdays). There’s also pop-up vendors selling lemonade, kettle corn, ice cream and other treats to enjoy in between photo ops.
                  - paragraph [ref=e743]:
                    - strong [ref=e744]: "Time Out tip:"
                    - text: One not-to-miss attraction is the massive American flag made of red, white, and blue petunias along the hillside. Plan your visit around special events including live music, yoga classes, afternoon tea, and painting workshops on the weekends. Be sure to buy admission tickets online ahead of time since they cannot be purchased onsite.
                  - paragraph [ref=e745]:
                    - strong [ref=e746]: "Address:"
                    - text: 5704 Paseo Del Norte, Carlsbad, CA 92008
                  - paragraph [ref=e747]:
                    - strong [ref=e748]: "Opening hours:"
                    - text: Season typically runs from March–May 9am–6pm daily; check
                    - link "their website" [ref=e749] [cursor=pointer]:
                      - /url: https://www.theflowerfields.com/activities/
                    - text: for specific dates.
                  - paragraph [ref=e750]:
                    - strong [ref=e751]: "Pricing:"
                    - text: Adult tickets are $27; children ages 3–10 are $17.
