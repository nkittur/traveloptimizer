                  - paragraph [ref=e447]:
                    - strong [ref=e448]: What is it?
                    - text: A baseball stadium located smack-dab in the middle of downtown San Diego.
                  - paragraph [ref=e449]:
                    - strong [ref=e450]: Why go?
                    - text: Home to the San Diego Padres,
                    - link "Petco Park" [ref=e451] [cursor=pointer]:
                      - /url: https://www.mlb.com/padres/tickets
                    - text: is a great family-friendly destination to watch America’s favorite pastime. Sure, hot dogs and beer are par for the course here, but some of San Diego’s top restaurants also have food stalls within the MLB stadium for a high-end culinary experience. And there’s no shortage of craft beer options, so it’s also a great chance to try different local brews. From certain seats you can even spot the ocean or catch a sunset.
                  - paragraph [ref=e452]:
                    - strong [ref=e453]: "Time Out tip:"
                    - text: After Padres home runs and following certain home games throughout the season, spectators can enjoy a firework show from the stadium. Behind-the-scenes tours are offered daily at Petco Park for any diehard baseball fans or history buffs who want to explore the stadium in depth (lasting about 90 minutes). Some of the best seats in the house are found in the renovated Western Metal Supply Co. building within the ballpark.
                  - paragraph [ref=e454]:
                    - strong [ref=e455]: "Address:"
                    - text: 100 Park Blvd, San Diego, CA 92101
                  - paragraph [ref=e456]:
                    - strong [ref=e457]: "Opening hours:"
                    - text: Gates open 90 minutes before first pitch.
                  - paragraph [ref=e458]:
                    - strong [ref=e459]: "Pricing:"
                    - text: Prices vary by game, but tickets can be found for as low as $20–$30.
                - link "Book now" [ref=e462] [cursor=pointer]:
