            - article [ref=e883]:
              - generic [ref=e884]:
                - link "19. Book a lesson with Surf Diva" [ref=e886] [cursor=pointer]:
                  - /url: /san-diego/things-to-do/surf-diva-surf-school
                  - heading "19. Book a lesson with Surf Diva" [level=3] [ref=e887]
                - list [ref=e890]:
                  - listitem [ref=e891]:
                    - generic [ref=e892]: Things to do
                  - listitem [ref=e893]:
                    - generic [ref=e894]: La Jolla
                - 'link "Book a lesson with Surf Diva Photograph: Brett Shoaf" [ref=e896] [cursor=pointer]':
                  - /url: /san-diego/things-to-do/surf-diva-surf-school
                  - img "Book a lesson with Surf Diva" [ref=e898]
                  - generic [ref=e900]: "Photograph: Brett Shoaf"
                - generic [ref=e903]:
                  - paragraph [ref=e904]:
                    - strong [ref=e905]: What is it?
                    - text: A surf school and surf shop offering lessons, camps, clinics, and rentals.
                  - paragraph [ref=e906]:
                    - strong [ref=e907]: Why go?
                    - text: With an impressively long coastline, San Diego is a surfer’s dream. Turn up the volume and drive down to watch the action—but don’t attempt any waves yourself unless you’re an experienced surfer. If you’re a novice but want to try the sport, visit
                    - link "Surf Diva in La Jolla" [ref=e908] [cursor=pointer]:
                      - /url: https://www.surfdiva.com/
                    - text: ", the world’s first all-woman surf school, for a private or semi-private lesson. They also offer stand-up paddle board lessons and even corporate teambuilding activities. La Jolla Shores is one of the most popular local spots for new surfers because of its long sandbar and optimal surf conditions."
                  - paragraph [ref=e909]:
                    - strong [ref=e910]: "Time Out tip:"
                    - text: Surf Diva’s women’s clinics are the best way to grasp the art of surfing or level up your game. The one or two-day weekend clinics are for all skill levels and offered year-round. Level 1 clinics help you find your feet and learn the fundamentals of surfing including safety, paddling techniques, pop-up practice, and wave etiquette. Level 2 delves deeper into wave selection, turning techniques, stance, and balance.
                  - paragraph [ref=e911]:
                    - strong [ref=e912]: "Address:"
                    - text: 2160 Avenida De La Playa, La Jolla, CA 92037
                  - paragraph [ref=e913]:
                    - strong [ref=e914]: "Opening hours:"
                    - text: Daily 8:30am–5pm
                  - paragraph [ref=e915]:
                    - strong [ref=e916]: "Pricing:"
                    - text: A 1.5-hour private lesson is $160 for one student.
                - generic [ref=e917]:
                  - link "Read more" [ref=e919] [cursor=pointer]:
                    - /url: /san-diego/things-to-do/surf-diva-surf-school
                  - link "Book online" [ref=e921] [cursor=pointer]:
                    - /url: https://surfdiva.com/
            - article [ref=e922]:
              - generic [ref=e923]:
                - heading "20. Watch a show at the Belly Up Tavern" [level=3] [ref=e926]
                - generic [ref=e928]:
                  - img "Watch a show at the Belly Up Tavern" [ref=e930]
                  - generic [ref=e932]: "Photograph: Shutterstock"
                - generic [ref=e935]:
                  - paragraph [ref=e936]:
                    - strong [ref=e937]: What is it?
                    - text: A live music venue showcasing new and up-and-coming artists.
                  - paragraph [ref=e938]:
                    - strong [ref=e939]: Why go?
                    - text: Music fans have flocked to San Diego’s live venues for years to discover local bands like Jason Mraz, Stone Temple Pilots, and Blink-182 before they broke onto the mainstream scene.
                    - link "The Belly Up Tavern" [ref=e940] [cursor=pointer]:
                      - /url: https://bellyup.com/
                    - text: in Solana Beach is renowned for breaking the latest hip-hop, jazz, and reggae acts. Located in the Cedros Design District not far from Fletcher Cove Beach Park, the Belly Up is walking distance from the train station if you plan to drink during a show. There’s also an on-site bistro, Tavern, where you can refuel on a huge range of delicious bites, from short rib truffle fries and herb-crusted salmon to butternut squash tacos and key lime pie.
                  - paragraph [ref=e941]:
                    - strong [ref=e942]: "Time Out tip:"
                    - text: Keep an eye on their show calendar for underplay performances from big-name artists like the Red Hot Chili Peppers, Willie Nelson, Ben Harper, and The Killers. This intimate venue allows artists to create a special connection with fans while performing, which is much harder to pull off in larger venues like stadiums.
                  - paragraph [ref=e943]:
                    - strong [ref=e944]: "Address:"
                    - text: 143 S Cedros Ave, Solana Beach, CA 92075
                  - paragraph [ref=e945]:
                    - strong [ref=e946]: "Opening hours:"
                    - text: Box office Sat–Thu at 4pm and Fri at noon until concert end.
                  - paragraph [ref=e947]:
                    - strong [ref=e948]: "Pricing:"
                    - text: Varies by show, with tickets starting around $20.
            - generic [ref=e952]: Advertising
