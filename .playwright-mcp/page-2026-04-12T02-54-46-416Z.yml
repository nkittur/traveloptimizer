                  - paragraph [ref=e773]:
                    - strong [ref=e774]: What is it?
                    - text: A U.S. national monument that includes the Old Point Loma Lighthouse and incredible bay views.
                  - paragraph [ref=e775]:
                    - strong [ref=e776]: Why go?
                    - generic [ref=e777]:
                      - text: Sitting proudly amongst the astonishing cliffs of Point Loma,
                      - link "Cabrillo National Monument" [ref=e778] [cursor=pointer]:
                        - /url: https://www.nps.gov/cabr/index.htm
                      - text: commemorates the historic moment when
                    - text: Portuguese explorer Juan Rodriguez Cabrillo sailed into San Diego Bay under the Spanish flag in 1542. The monument boasts spectacular 360-degree views of San Diego Bay, downtown, and the surrounding region. On a clear day, you can even see the hills of Tijuana, Mexico. Once you’ve taken in the incredible vista, check out the quaint exhibit hall next to the monument, which is dedicated to Cabrillo’s life.
                  - paragraph [ref=e779]:
                    - strong [ref=e780]: "Time Out tip:"
                    - text: The tide pool area is full of marine life to explore up close, and the half-mile Oceanside Trail is a great way to see panoramic views of the Pacific. The historic lighthouse now operates as a museum that’s open to the public. Take in wildflowers, native birds, and military history while visiting this local landmark.
                  - paragraph [ref=e781]:
                    - strong [ref=e782]: "Address:"
                    - text: 1800 Cabrillo Memorial Dr, San Diego, CA 92106
                  - paragraph [ref=e783]:
                    - strong [ref=e784]: "Opening hours:"
                    - text: Daily 9am–5pm
                  - paragraph [ref=e785]:
                    - strong [ref=e786]: "Pricing:"
                    - text: Vehicles are $20 each (including passengers), but if entering without a vehicle it's $10.
