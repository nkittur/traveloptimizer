                - 'link "Get a taste of Navy life at USS Midway Museum Photograph: Courtesy SanDiego.org" [ref=e534] [cursor=pointer]':
                  - /url: /san-diego/museums/uss-midway-museum
                  - img "Get a taste of Navy life at USS Midway Museum" [ref=e536]
                  - generic [ref=e538]: "Photograph: Courtesy SanDiego.org"
                - generic [ref=e541]:
                  - paragraph [ref=e542]:
                    - strong [ref=e543]: What is it?
                    - text: A decommissioned naval aircraft carrier turned into a
                    - link "public museum" [ref=e544] [cursor=pointer]:
                      - /url: https://www.midway.org/
                    - text: .
                  - paragraph [ref=e545]:
                    - strong [ref=e546]: Why go?
                    - text: The monumental
                    - emphasis [ref=e547]: USS Midway
                    - text: was the longest-serving aircraft carrier in U.S. Navy history when it was decommissioned in 1992. Now the feted ship—the size of a floating city—is a maritime museum open to the public, berthed along San Diego Bay in downtown. Climb aboard for a fascinating insight into what naval life is really like, courtesy of a self-guided audio tour narrated by some (refreshingly honest) former
                    - emphasis [ref=e548]: Midway
                    - text: sailors. Plus, if you’ve got young ones who love being onboard, you can find activities for little skippers.
                  - paragraph [ref=e549]:
                    - strong [ref=e550]: "Time Out tip:"
                    - text: Head to the flight deck to climb inside (and pose in front of) more than 30 fully restored aircraft including bombers, fighters, and helicopters. Be sure to visit the renovated ship’s island/bridge structure that served as the command center for captain and crew. The floating museum even offers overnight adventures for kids and families who want to experience what it's like to sleep onboard. One of their most popular annual events is their spectacular 4th of July fireworks viewing party to celebrate ‘Merica.
                  - paragraph [ref=e551]:
                    - strong [ref=e552]: "Address:"
                    - text: 910 N Harbor Dr, San Diego, CA 92101
                  - paragraph [ref=e553]:
                    - strong [ref=e554]: "Opening hours:"
                    - text: Daily 10am–5pm
                  - paragraph [ref=e555]:
                    - strong [ref=e556]: "Pricing:"
                    - text: Adult tickets are $39–$41; children ages 4–12 cost $29–$31; and veterans are $26. Discounts are offered with online purchasing.
