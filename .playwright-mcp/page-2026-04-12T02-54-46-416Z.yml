                - heading "6. Place your bets at Del Mar Racetrack" [level=3] [ref=e401]
                - generic [ref=e403]:
                  - img "Place your bets at Del Mar Racetrack" [ref=e405]
                  - generic [ref=e407]: "Photograph: Shutterstock"
                - generic [ref=e410]:
                  - paragraph [ref=e411]:
                    - strong [ref=e412]: What is it?
                    - text: A coastal horseracing track that also hosts special events throughout racing season.
                  - paragraph [ref=e413]:
                    - strong [ref=e414]: Why go?
                    - text: Opened in 1937 by singer Bing Crosby,
                    - link "Del Mar Racetrack" [ref=e415] [cursor=pointer]:
                      - /url: https://www.dmtc.com
                    - text: was once a playground to the stars who rode the train down from Hollywood for a day of fun on the turf. Today it still makes for a fun afternoon outing with friends to place exacta and trifecta bets on the horses. Minimum bets start at just $2, so doesn’t cost much to put a little skin in the game by picking your favorite pony to win each race. The summer racing season runs from July through September, and the fall season is typically held through the month of November. There are often upwards of 10 races per day.
                  - paragraph [ref=e416]:
                    - strong [ref=e417]: "Time Out tip:"
                    - text: Special concerts, food festivals, and beer and wine events are frequently held after a day of races, many offering free tickets with paid racetrack admission. Uncorked Wine Festival and Del Mar Beer Fest are two favorites.
                  - paragraph [ref=e418]:
                    - strong [ref=e419]: "Address:"
                    - text: 2260 Jimmy Durante Blvd, Del Mar, CA 92014
                  - paragraph [ref=e420]:
                    - strong [ref=e421]: "Opening hours:"
                    - text: Gates typically open about 11:30am or noon, two hours before the first post.
                  - paragraph [ref=e422]:
                    - strong [ref=e423]: "Pricing:"
                    - text: General admission tickets are $8.
                - link "Book now" [ref=e426] [cursor=pointer]:
