              - generic [ref=e839]:
                - link "18. Meditate at Mission Basilica San Diego de Alcalá" [ref=e841] [cursor=pointer]:
                  - /url: /san-diego/attractions/mission-basilica-san-diego-de-alcala
                  - heading "18. Meditate at Mission Basilica San Diego de Alcalá" [level=3] [ref=e842]
                - list [ref=e845]:
                  - listitem [ref=e846]:
                    - generic [ref=e847]: Attractions
                  - listitem [ref=e848]:
                    - generic [ref=e849]: Grantville
                - 'link "Meditate at Mission Basilica San Diego de Alcalá Photograph: Joanne Dibona" [ref=e851] [cursor=pointer]':
                  - /url: /san-diego/attractions/mission-basilica-san-diego-de-alcala
                  - img "Meditate at Mission Basilica San Diego de Alcalá" [ref=e853]
                  - generic [ref=e855]: "Photograph: Joanne Dibona"
                - generic [ref=e858]:
                  - paragraph [ref=e859]:
                    - strong [ref=e860]: What is it?
                    - text: Established by Franciscan missionaries, this is the first of the 21 California missions, marking the origin of Christianity in the American West.
                  - paragraph [ref=e861]:
                    - strong [ref=e862]: Why go?
                    - text: The original and grandest of the California missions is
                    - link "Mission Basilica San Diego de Alcalá" [ref=e863] [cursor=pointer]:
                      - /url: https://www.missionsandiego.org/
                    - text: ", founded by the Spanish in 1769. The Basilica—nestled in stunning Mission Valley near the San Diego River—is a beautiful and serene place to pay a visit. Today the mission continues to serve as a church with an active parish, welcoming people of all faiths. History buffs can make reservations for a tour, attend daily mass in the original chapel, visit the mission’s museum, and stroll the oldest known cemetery in California."
                  - paragraph [ref=e864]:
                    - strong [ref=e865]: "Time Out tip:"
                    - text: Inside the gift shop, pick up a guide to the church’s historic paintings and statues dating back to the 15th century. Take a peek at the 46-foot tall bell wall with five bronze bells, and stop by the Casa de los Padres for a glimpse into what living quarters looked like when the missionaries were there. The peaceful and picturesque meditation garden is a must-visit when making a trip to California’s first church.
                  - paragraph [ref=e866]:
                    - strong [ref=e867]: "Address:"
                    - text: 10818 San Diego Mission Rd, San Diego, CA 92108
                  - paragraph [ref=e868]:
                    - strong [ref=e869]: "Opening hours:"
                    - text: Visitor center Mon–Fri 9am-4pm
                  - paragraph [ref=e870]:
                    - strong [ref=e871]: "Pricing:"
                    - text: Adult tickets are $8.
                - generic [ref=e872]:
                  - link "Read more" [ref=e874] [cursor=pointer]:
