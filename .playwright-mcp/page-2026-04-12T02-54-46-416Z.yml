                  - img "Attend a concert at the Rady Shell" [ref=e285]
                  - generic [ref=e287]: Courtesy of San Diego Symphony
                - generic [ref=e290]:
                  - paragraph [ref=e291]:
                    - strong [ref=e292]: What is it?
                    - text: A shell-shaped, open-air music venue overlooking San Diego Bay.
                  - paragraph [ref=e293]:
                    - strong [ref=e294]: Why go?
                    - text: There’s something about listening to live music while perched on the waterfront. This San Diego skyline icon has been compared to the Sydney Opera House because of its unique architecture, top-notch acoustics, and oceanfront locale. One of the best parts of seeing a show here is enjoying the San Diego Symphony accompany big-name artists, resulting in a beautiful harmony. The 2026 summer season will bring the likes of Paul Simon, the Beach Boys, Kool & The Gang, Wynonna Judd and Melissa Etheridge, St. Vincent, Sara McLachlan and Gipsy Kings to the Rady Shell stage.
                  - paragraph [ref=e295]:
                    - strong [ref=e296]: "Time Out tip:"
                    - text: "There’s no need to eat dinner before catching a show:"
                    - link "The Rady Shell" [ref=e297] [cursor=pointer]:
                      - /url: https://www.theshell.org/
                    - text: has lots of great food and drink offerings from local restaurants available. There’s even an option to have a meal curated by
                    - emphasis [ref=e298]: Top Chef
                    - text: contestant Richard Blais. Although you’ll be hard-pressed to find a bad seat in the house, the best experience comes with booking seats in a section that offers table service for food and drinks so you don’t have to put effort into purchasing meals, wine, beer or soda.
                  - paragraph [ref=e299]:
                    - strong [ref=e300]: "Address:"
                    - text: 222 Marina Park Way, San Diego, CA 92101
                  - paragraph [ref=e301]:
                    - strong [ref=e302]: "Opening hours:"
                    - text: Ticket Office Mon–Fri 10am–6pm; Sat, Sun closed except concert days when opening is noon
                  - paragraph [ref=e303]:
                    - strong [ref=e304]: "Pricing:"
                    - text: Varies by artist, but the cheapest tickets start at about $60.
