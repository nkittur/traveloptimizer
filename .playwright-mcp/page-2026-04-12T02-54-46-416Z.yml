                    - strong [ref=e822]: Why go?
                    - generic [ref=e823]:
                      - text: The region’s oldest, largest, and most-visited art museum,
                      - link "San Diego Museum of Art" [ref=e824] [cursor=pointer]:
                        - /url: https://www.sdmart.org/
                      - text: has a nationally renowned permanent collection that includes Spanish and Italian old masters, as well as 19th-century American paintings and sculptures. They also throw some of the best after-hours parties in the city, including Culture & Cocktails events with live performances, food, and drinks. Be sure to s
                    - text: top by the outdoor sculpture garden.
                  - paragraph [ref=e825]:
                    - strong [ref=e826]: "Time Out tip:"
                    - text: Every spring, the museum hosts an Art Alive exhibit with more than 80 floral arrangements inspired by pieces of artwork. Local artists and floral designers vie for a spot to participate in the show, making up the museum’s most colorful and aromatic exhibit of the year. To coincide with the exhibit, they host a splashy gala called Bloom Bash that kicks the floral theme into high gear with themed cocktails and attire, food from more than 35 local restaurants, entertainment and live music to dance the night away. It’s arguably the city’s best party of the year.
                  - paragraph [ref=e827]:
                    - strong [ref=e828]: "Address:"
                    - text: 1450 El Prado, San Diego, CA 92102
                  - paragraph [ref=e829]:
                    - strong [ref=e830]: "Opening hours:"
                    - text: Mon, Tue, Thu–Sat 10am–5pm; Sun noon–5pm
                  - paragraph [ref=e831]:
                    - strong [ref=e832]: "Pricing:"
                    - text: Adults are $25; youth 17 and under are free.
                - generic [ref=e833]:
                  - link "Read more" [ref=e835] [cursor=pointer]:
