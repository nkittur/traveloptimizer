                - generic [ref=e704]:
                  - paragraph [ref=e705]:
                    - strong [ref=e706]: What is it?
                    - text: A bustling downtown neighborhood known for its lively nightlife.
                  - paragraph [ref=e707]:
                    - strong [ref=e708]: Why go?
                    - text: As the alluringly charismatic and historic heart of downtown San Diego, the 16-and-a-half-block Gaslamp Quarter blends Victorian charm with a 21st-century entertainment, shopping, and nightlife scene. Impressively, the Gaslamp Quarter will celebrate its 160th anniversary in 2027. As the former site of San Diego’s red light district in the 19th century, the area has been revitalized over the last few decades and is now home to more than 100 retail stores. Nightclubs, lounges, bars and restaurants are abundant here, with crowds often spilling out of the nearby Convention Center for trade shows and events like San Diego Comic-Con to check out the local scene.
                  - paragraph [ref=e709]:
                    - strong [ref=e710]: "Time Out tip:"
                    - text: For an awesome night on the town, check out a show at one of the Gaslamp’s performing arts theatres including Balboa, Lyceum, and Spreckles; grab dinner at Cafe Sevilla, Huntress, or Lumi; and toast over drinks at Prohibition Lounge, Techo Beso, or The Nolen. Cap the evening off with a good laugh at American Comedy Co. or Mad House Comedy Club.
                  - paragraph [ref=e711]:
                    - strong [ref=e712]: "Address:"
                    - text: Fourth and Fifth Avenues between Broadway and Harbor Drive
