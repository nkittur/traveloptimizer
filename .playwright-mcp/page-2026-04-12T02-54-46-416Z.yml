              - generic [ref=e956]:
                - link "21. Take flight at Torrey Pines Gliderport" [ref=e958] [cursor=pointer]:
                  - /url: /usa/san-diego/sports-and-fitness/torrey-pines-gliderport
                  - heading "21. Take flight at Torrey Pines Gliderport" [level=3] [ref=e959]
                - list [ref=e962]:
                  - listitem [ref=e963]:
                    - generic [ref=e964]: Sports and fitness
                  - listitem [ref=e965]:
