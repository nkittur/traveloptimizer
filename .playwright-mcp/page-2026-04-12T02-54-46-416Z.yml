            - paragraph [ref=e135]:
              - text: If you’ve never been to San Diego, you’re in for a treat. The year-round perfect weather is just one of many selling points. Not to be overshadowed by its big sister Los Angeles, San Diego is one of the chillest spots in
              - link "California" [ref=e136] [cursor=pointer]:
                - /url: https://www.timeout.com/california
              - text: (if not the
              - link "USA" [ref=e137] [cursor=pointer]:
                - /url: https://www.timeout.com/usa
              - text: ), and it’s crammed full of remarkable things to do.
            - paragraph [ref=e138]:
              - text: Here you’ll find everything from whale watching and live music to roller coasters and horse racing, plus plenty of great
              - link "restaurants" [ref=e139] [cursor=pointer]:
                - /url: https://www.timeout.com/san-diego/restaurants/best-restaurants-in-san-diego
              - text: ", bars, and clubs to see you through to the evening. San Diego’s 70 miles of coastline are stuffed with activities and attractions (many of them outdoors), and whether you’re here for Comic-Con, Beer Week, the Zoo or just to finally relax: You’re going to love it. Here are the best things to do in San Diego."
            - paragraph [ref=e140]:
              - emphasis [ref=e141]:
                - strong [ref=e142]: "2026 Update:"
              - emphasis [ref=e143]: We highly recommend getting outside to enjoy rooftop patios, waterfront views, and anything that fully takes advantage of San Diego’s perpetual sunshine. It’s always a great time to book that concert, plan an amusement park date night, arrange a surf lesson or check out the latest art exhibits. For 2026, I’ve added the Flower Fields and San Diego’s incredible craft beer scene to this must-do list, and on a personal note, I’m already plotting out which concerts I want to see at the Rady Shell this year.
