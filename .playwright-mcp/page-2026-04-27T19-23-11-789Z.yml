                - heading "Potosí, Bolivia" [level=2] [ref=e1208]
                - paragraph [ref=e1210]:
                  - emphasis [ref=e1211]:
                    - strong [ref=e1212]: "Go for:"
                    - text: a big-deal lodge opening, luxe experiences amid otherworldly landscapes
              - figure [ref=e1216]:
                - generic [ref=e1219]:
                  - paragraph [ref=e1221]: High in the Bolivian Andes lies the province of Potosí, home to landscapes unlike anything else on Earth. As luxury tour operators and new lodges arrive to the region, travelers can visit its red lagoons, expansive salt flats, and towering peaks in style.
                  - generic [ref=e1222]: Getty
              - paragraph [ref=e1227]:
                - text: Bolivia’s star attraction has long been the otherworldly
                - link "Salar de Uyuni" [ref=e1228] [cursor=pointer]:
                  - /url: https://uyunisaltflat.com/Salar-de-Uyuni-and-Eduardo-Avaroa-National-Park-tour
                - text: ", 4,000 square miles of glistening crust left behind when prehistoric lakes evaporated that make up what is, today, the largest salt flat in the world. There’s a magnetism to this blinding-white expanse perched 12,000 feet high in the Andes. But in greater Potosí, the municipality that encompasses the flats, this is far from the only surreal landscape."
                - link "Eduardo Avaroa National Reserve" [ref=e1229] [cursor=pointer]:
                  - /url: https://www.cntraveler.com/gallery/why-bolivia-should-be-your-next-south-american-trip
                - text: stuns with its sculptural Valle de las Rocas; the blood-red waters of Laguna Colorada, a small 85°F hot-spring pool called Termas de Polques; and the emerald Laguna Verde shimmering beneath the snow-capped Licancabur volcano. Here, deserts are pocked by geysers and steaming geothermal fields with bubbling silver pools. Multiday jeep tours have long bumped along the roads, transporting travelers to see these alien-like landscapes, while offering front-row views of vicuñas grazing and flamingos taking flight.
              - generic [ref=e1236]:
                - paragraph [ref=e1237]:
                  - text: But now new hotel projects and better infrastructure are transforming the region, making it more appealing to travelers seeking comfort—and helping it shed the long-held backpacker-only reputation. Local outfitter
                  - link "Hidalgo Tours" [ref=e1238] [cursor=pointer]:
                    - /url: https://hidalgotours.com/en/
                  - text: now offers new, high-comfort excursions through Potosí, with 4x4s and a custom luxury van featuring business-class-style seats, onboard champagne and snacks, and even a proper bathroom—plus the option of a meal upon an apthapi (a traditional Andean communal table) right in the middle of the flats.
                  - link "Crillon Tours" [ref=e1239] [cursor=pointer]:
                    - /url: https://crillontours.travel/product/bespoke-luxury-uyuni-salt-flats-sample-itinerary/
                  - text: ", meanwhile, offers a three-day itinerary from the small village of Coquesa to the Green Lagoon with deluxe accommodations in a silver Airstream camper. For the adventurous the"
                  - link "Ultra Bolivia Race" [ref=e1240] [cursor=pointer]:
                    - /url: https://www.canal-aventure.com/en/ultra-bolivia-race
                  - text: ", a 220-kilometer foot race across salt flats, desert plains, and high-altitude lagoons, returns in September 2026. Around Uyuni in particular, a wave of design-forward stays is redefining what it means to sleep amid the stark beauty of the desert."
                  - link "Explora" [ref=e1241] [cursor=pointer]:
                    - /url: https://www.explora.com/uyuni-lodge/
                  - text: runs three minimalist mountain lodges in Ramaditas, Chituca, and Jirira—striking, sustainable properties surrounded by ethereal landscapes. In Jirira, the tiny town celebrated as the birthplace of Bolivia’s prized gold quinoa, the biggest opening of all is forthcoming, thanks to
                  - link "Casa Gastón" [ref=e1242] [cursor=pointer]:
                    - /url: https://cna.st/affiliate-link/3uiV3LmVK1YzRG3ZcNE3GCo6s4o97wb1qgyWtpeuLbLGushAtKmTqHcu3nU5x7DzE2mk9xrGyFCECP8gEEXfapSK9Fhkanqs4fxxcY63xT8YL4EVy1hdhPWBitZz47ti82PpZAsnDB3KU9N82iSviQiJ7Umw8DtzJX24Q7ywVJoiEroS6hCz8xAh15P6aqK7LimZd5gJCEnWP9HCf9qTjGWkXJHwe9H1s2wyXGGuuWmCtRXcCoQBDq5svKWWBiZ7Qg2XztAVvpy3
                  - text: . Come March 2026, the museum-hotel hybrid is set to open its doors in the foothills of Tunupa volcano. Designed by the late artist Gastón Ugalde, considered the father of contemporary Bolivian art, the property will blend ancient building techniques with contemporary design across 10 suites, while offering immersive experiences rooted in sustainable tourism.
                - paragraph [ref=e1243]:
                  - strong [ref=e1244]: "How to plan it:"
                  - text: Visit from late summer through fall (mid-February through May in the Southern Hemisphere), when daytime temperatures average 60°F—this period also falls during the rainy season (November to April), which turns the salt flats into a liquid mirror reflecting otherworldly cloud formations, sunsets, and starry nights. The easiest way to reach Potosí’s highlights is to fly into Uyuni (from
                  - link "La Paz" [ref=e1245] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/story/la-paz-bolivia-a-new-slate-of-restaurants
                  - text: or another city in Bolivia) and book with a tour operator (such as Hidalgo Tours or Crillon Tours) in advance; they’ll take care of everything from airport pickup to guided excursions. Alternatively, rent a car (ideally a 4x4) upon arrival for more flexibility.
                  - emphasis [ref=e1246]:
                    - text: —
                    - link "Rafael Tonon" [ref=e1247] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/contributor/rafael-tonon
                - link "Book a stay at Casa Gastón" [ref=e1249] [cursor=pointer]:
                  - /url: https://cna.st/affiliate-link/Dqg6mLFMxVSCS5QJw6gYz74Usykeqdw8huSSwjLJ1UY5ENkJdXqFS8MSjHgYrEUKaWpVUZWVVFeZFEgmLwzbB9BNdgf14shi6hZ2GEazu1pTrJrkumoJi1TB6P93ys3jhEtjBuEHM8uAkbjphsPi598BkuhFXvgphHRrjEqnqRTN3nG2j4huX51PjxzUwWnMT1Um71cncriNLNXSWDzKH2jq6ZtGBS4zzhUw9R34KC3ra8q3NuMZjFEUPN97Nk6mRXPCap1vuKr8D
                  - generic [ref=e1250]: Book a stay at Casa Gastón
