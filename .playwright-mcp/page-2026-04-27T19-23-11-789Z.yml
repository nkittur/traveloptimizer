                  - paragraph [ref=e243]:
                    - text: This list is for travelers and dreamers alike. So please, use it—
                    - link "along with the companion lists we created for six continents" [ref=e244] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/best-places-to-go
                    - text: —to jump-start your travel plans or simply indulge your sense of wonder. In the year ahead, our global team of editors will be exploring many of these places, and we can’t wait to share the stories we discover on the ground and, perhaps, even cross paths with some of you along the way. Here's a fantastic year of eye-opening travel.
