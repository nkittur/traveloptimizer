              - figure [ref=e726]:
                - generic [ref=e729]:
                  - paragraph [ref=e731]: A huge airport expansion is making the endlessly vibrant and multicultural city of Hong Kong easier to access for visitors in 2026.
                  - generic [ref=e732]: Getty
              - generic [ref=e736]:
                - paragraph [ref=e737]:
                  - text: Forever forward-facing,
                  - link "Hong Kong" [ref=e738] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/destinations/hong-kong
                  - text: is further enhancing its tourism credentials in 2026. Both on and off the island, the cultural scene is flourishing. At the tip of the Kowloon Peninsula, within the Foster + Partners’-designed
                  - link "West Kowloon Cultural District" [ref=e739] [cursor=pointer]:
                    - /url: https://www.westk.hk/en/home
                  - text: ", the WestK Performing Arts Centre will open three world-class dance and theatre stages in 2026, with seating for some 2,300 people. And, in the heart of Central, French chef"
                  - link "Daniel Boulud" [ref=e740] [cursor=pointer]:
                    - /url: https://www.danielboulud.com/
                  - text: will debut Terrace Boulud, on the 25th floor of Landmark Prince’s, which connects to the
                  - link "Mandarin Oriental, Hong Kong" [ref=e741] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/hotels/hong-kong-s-a-r-/jordan/mandarin-oriental-hong-kong
                  - text: via a walkway. The opening is part of the flagship hotel’s sweeping renovation, which is costing more than $100 million, includes the addition of longer-stay apartments, and is anticipated to wrap by late 2026.
                - paragraph [ref=e742]: With ambitions to handle up to 120 million air passengers by 2027, Hong Kong International Airport (HKIA) will unveil further improvements under its $18 billion, three-runway expansion program. Upgrades to Terminal 2 are key, with a newly opened coach hall and self-service check-in facilities due by the summer of 2026.
                - paragraph [ref=e743]:
                  - text: "If you plan to head outdoors to appreciate Hong Kong’s green spaces, you’ll find improved hiking trail facilities, such as waymarks and visitor information panels, at four of Hong Kong's peaks: The Peak, Lantau Peak, Tai Mo Shan, and Sai Kung Hoi. And for the best view of all? Head to the"
                  - link "sky100 Observation Deck" [ref=e744] [cursor=pointer]:
                    - /url: https://sky100.com.hk/en/
                  - text: for panoramic vistas of the city’s skyscraper skyline and undulating hills when it reopens with new visitor experiences mid-year.
