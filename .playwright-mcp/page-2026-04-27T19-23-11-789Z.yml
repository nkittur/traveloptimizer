                - paragraph [ref=e658]:
                  - emphasis [ref=e659]:
                    - strong [ref=e660]: "Go for:"
                    - text: world-renowned festivals; FIFA World Cup games; vibrant female-fronted industries
              - generic [ref=e664]:
                - figure [ref=e665]:
                  - generic [ref=e668]:
                    - img "Xokol restaurant people at table"
                  - generic [ref=e669]:
                    - paragraph [ref=e671]: The women of Mexico's third-largest city and the home of tequila are showcasing its vibrant culture through arts, crafts, and new fine-dining ventures like Xokol (above).
                    - text: Xokol
                - figure [ref=e672]:
                  - generic [ref=e675]:
                    - img "Xokol Guadalajara"
                  - generic [ref=e676]:
                    - paragraph [ref=e678]: Guadalajara's most exciting new restaurants are paying homage to indigenous traditions and ingredients while experimenting boldly.
                    - text: Xokol
              - paragraph [ref=e683]:
                - text: As the epicenter of traditions synonymous with Mexican culture—mariachi, ceramics, tortas ahogadas, and of course, tequila—
                - link "Guadalajara" [ref=e684] [cursor=pointer]:
                  - /url: https://www.cntraveler.com/story/where-to-eat-stay-and-play-in-guadalajara
                - text: has been ready for the spotlight. In 2026 the third-largest city in Mexico will also showcase its cultural achievements as host of several world-class events. The
                - link "Guadalajara International Film Festival" [ref=e685] [cursor=pointer]:
                  - /url: https://ficg.mx/en/
                - text: returns in April,
                - link "FIFA World Cup" [ref=e686] [cursor=pointer]:
                  - /url: https://www.fifa.com/en/tournaments/mens/worldcup/canadamexicousa2026/mexico/guadalajara
                - text: brings four matches in June, and November marks the 40th edition of the weeklong
                - link "Guadalajara International Book Fair" [ref=e687] [cursor=pointer]:
                  - /url: https://www.fil.com.mx/ingles/info/info_fil.asp
                - text: . But it’s the tapatías (women from Guadalajara) who are blossoming all over La Ciudad de las Rosas. Guadalajara’s first female mayor, Verónica Delgadillo García, is a sign of progress, as are gender-sensitive bike-share programs and women-fronted mariachi and cumbia bands who serenade the public. Guadalajara’s artisanal heritage intersects with art and food. Touring
                - link "Cerámica Suro" [ref=e688] [cursor=pointer]:
                  - /url: https://www.instagram.com/ceramicasuro/?hl=en
                - text: ", a ceramics factory in Colón Industrial, you’ll paint your own piece with guidance from Juliana Suro and her father, José Noé Suro, who host a residency program with local women artists and sister art gallery"
                - link "Plataforma" [ref=e689] [cursor=pointer]:
                  - /url: https://www.plac.mx/visita
                - text: and their rotating artists in residence. This feminine spirit touches modern gastronomy too. At Santa Teresita’s
                - link "Xokol" [ref=e690] [cursor=pointer]:
                  - /url: https://www.instagram.com/xokol_/?hl=en
                - text: ", chef Xrysw Ruelas is a storyteller of ancestral Mexican ingredients and matriarchs. Juana Segundo Alcántar, abuela to Xokol chef Óscar Segundo (Ruelas’s husband), is depicted in a lifelike mural overlooking the dining room’s communal tables, where guests are treated to tortillas freshly pressed with multicolored circles. Matriarchal culture is also a family affair at well-known Jalisco distilleries like La Alteña—2026 marks Jenny Camarena's first full year as CEO of"
                - link "El Tesoro" [ref=e691] [cursor=pointer]:
                  - /url: https://www.eltesorotequila.com/about-us
                - text: de Don Felipe Tequila. While Guadalajara has long been a gem of a destination, evolving quietly while neighboring cities get more attention, the spotlight is shining a bit brighter.
              - generic [ref=e698]:
