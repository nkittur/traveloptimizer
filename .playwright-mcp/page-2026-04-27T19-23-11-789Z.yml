              - figure [ref=e945]:
                - generic [ref=e948]:
                  - img "Naoshima's evolution from collection of quiet fishing villages to global art hub enters a new era with the opening of..."
                - generic [ref=e949]:
                  - paragraph [ref=e951]: Naoshima's evolution from collection of quiet fishing villages to global art hub enters a new era with the opening of the Naoshima New Museum of Art.
                  - generic [ref=e952]: Getty Images
              - paragraph [ref=e957]:
                - text: Tucked into Setouchi, off Japan’s southwest coast,
                - link "Naoshima" [ref=e958] [cursor=pointer]:
                  - /url: https://www.cntraveler.com/story/why-art-lovers-should-visit-japans-naoshima-island
                - text: has evolved from a few traditional fishing villages into an island-wide art gallery, where contemporary works spill from museums into repurposed bathhouses and abandoned schools, and line hillside trails. The
                - link "Naoshima New Museum of Art" [ref=e959] [cursor=pointer]:
                  - /url: https://benesse-artsite.jp/en/art/nnmoa.html
                - text: ", a minimalist, partially underground structure designed by renowned architect Tadao Ando opened in May 2025, with a mandate to collect art from Asia as well as Japan. The museum, the first in a residential suburb in Naoshima town, features works by Takashi Murakami and Cai Guo-Qiang, exploring themes of Asian futurism and Japanese cosmology. It’s Ando’s 10th major effort for Benesse Art Site Naoshima, the revolutionary art project conceived to drive rural regeneration on Naoshima and its neighbors, which grabbed world attention when a Kusama"
                - emphasis [ref=e960]: Pumpkin
                - text: sculpture was swept out to sea in a typhoon in 2021.
              - generic [ref=e967]:
                - paragraph [ref=e968]:
                  - text: As Naoshima and its neighboring islands attract greater numbers of culture seekers, travel companies are taking note. Luxury tour operator
                  - link "Tauck" [ref=e969] [cursor=pointer]:
                    - /url: https://www.tauck.com/
                  - text: is expanding its small-ship cruises in Japan with a new Seoul to
                  - link "Tokyo" [ref=e970] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/destinations/tokyo
                  - text: itinerary for 2026, which includes an exploration of the Seto Inland Sea, and a guided excursion to explore Naoshima’s contemporary arts legacy. The luxury hotel group, Mandarin Oriental, is set to open three boutique properties in Setouchi from 2027 to 2030, including a ryokan-style hotel in Naoshima—so go now, before the crowds arrive.
                - paragraph [ref=e971]:
                  - strong [ref=e972]: "How to plan it:"
                  - text: The best time to visit is March to May or September to November, avoiding the heat and rains of summer. Naoshima plays a starring role in the Setouchi International Art Triennale, a contemporary art festival with a reputation for community involvement, which runs sessions in spring, summer and autumn on different islands over the course of its programming. Take a domestic flight to Takamatsu or Okayama cities from the international flight hubs of Tokyo or Osaka, then it’s a short ferry ride to Naoshima. Stay at the beautifully curated, museum-cum-hotel
                  - link "Benesse House Museum" [ref=e973] [cursor=pointer]:
                    - /url: https://benesse-artsite.jp/en/stay/
                  - text: ", another early Ando project. —"
