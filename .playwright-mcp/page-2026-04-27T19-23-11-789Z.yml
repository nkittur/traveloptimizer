                - generic [ref=e358]:
                  - paragraph [ref=e360]: Brussels has long been known for its opulent Baroque buildings and timeless architecture, but new openings in 2026 it will cement its status as a hub of modern art and design.
                  - generic [ref=e361]: Getty
              - generic [ref=e368]:
                - paragraph [ref=e369]:
                  - text: This often-overlooked European capital is having a cultural moment, signaling a shift from a bureaucratic hub to a creative powerhouse. The opening of
                  - link "Kanal—Centre Pompidou" [ref=e370] [cursor=pointer]:
                    - /url: https://kanal.brussels/en/homepage-3
                  - text: in November 2026 transforms a long-dormant factory into a contemporary center for modern arts. One of Europe’s highly anticipated arrivals, it will feature expansive exhibition spaces curated with
                  - link "Paris" [ref=e371] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/tag/paris
                  - text: ’s Centre Pompidou, alongside a dynamic program of live performances, music, film, workshops, a library, and—five floors up—a
                  - link "restaurant" [ref=e372] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/galleries/2014-09-08/10-things-you-should-eat-in-belgium
                  - text: overlooking the vast showroom, capped by a rooftop bar with panoramic city views. Just steps away is newly opened
                  - link "The Standard," [ref=e373] [cursor=pointer]:
                    - /url: https://www.standardhotels.com/brussels/properties/brussels
                  - text: with a rooftop bar, greenhouse-style lounge, and bold design that mirrors the city’s creative energy.
                - paragraph [ref=e374]:
                  - text: Brussels’ cultural revival is visible everywhere, from the refreshed façades of Place de la Bourse to the
                  - link "Dome Project" [ref=e375] [cursor=pointer]:
                    - /url: https://www.vddprojectdevelopment.com/en/the-dome
                  - text: ", a restoration of Belgium’s first department store with modern flair. Nearby, the Gare Maritime, a former freight station, seamlessly blends sustainable architecture with design fairs and chef-led food stalls. Plan a spring visit, when"
                  - link "Art Brussels" [ref=e376] [cursor=pointer]:
                    - /url: https://artbrussels.com/
                  - text: draws galleries and collectors from around the world for a vibrant international fair, and the biannual Zinneke Parade transforms the city’s streets into a stage of theatre and imagination. For those seeking more adrenaline, base yourself in the city for the Belgian Grand Prix to marvel at the sporting spectacle.
                - paragraph [ref=e377]:
                  - strong [ref=e378]: "How to plan it:"
                  - text: Spring and early summer are ideal, while autumn’s crisp days are perfect for gallery-hopping. Brussels is easily accessible via major airlines, low-cost carriers such as Ryanair and EasyJet, or Eurostar from London, Paris, and Amsterdam. A car isn’t necessary—the city is compact with excellent public transportation. In 2026, new tram links will connect the airport to the city center and the canal district. For practical tips,
                  - link "visit.brussels" [ref=e379] [cursor=pointer]:
                    - /url: http://visit.brussels
                  - text: provides detailed itineraries and event listings. —
