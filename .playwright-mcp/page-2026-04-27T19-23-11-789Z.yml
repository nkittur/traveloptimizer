                - heading "Fès, Morocco" [level=2] [ref=e545]
                - paragraph [ref=e547]:
                  - emphasis [ref=e548]:
                    - strong [ref=e549]: "Go for:"
                    - text: a slate of ambitious restoration projects breathing new life into the historic city
              - figure [ref=e553]:
                - generic [ref=e556]:
                  - img "Bab Bou Jeloud gate located at Fes Morocco"
                - generic [ref=e557]:
                  - paragraph [ref=e559]: A banner year for Fès's design-lovers, as much-anticipated architectural renovations and reopenings in the ancient medina grace this ancient Moroccan city.
                  - generic [ref=e560]: Getty
              - generic [ref=e564]:
                - paragraph [ref=e565]:
                  - link "Fès" [ref=e566] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/story/where-to-eat-stay-and-play-in-old-fez-morocco
                  - text: is Morocco’s cultural capital and intellectual center, but it still flies beneath the radar. That looks set to change in 2026 with the long-awaited reopening of
                  - link "Palais Jamaï" [ref=e567] [cursor=pointer]:
                    - /url: https://cna.st/affiliate-
                  - text: —Fès’s iconic heritage hotel built in 1879 by a grand vizier to the sultan—after a decade-long renovation. A sister property to Marrakech’s landmark
                  - link "La Mamounia" [ref=e568] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/hotels/marrakech/la-mamounia
                  - text: ", Palais Jamaï is one of only a handful of centenarian"
                  - link "North African hotels" [ref=e569] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/gallery/best-hotels-in-morocco
                  - text: and retains its opulent architectural form, plus an atmosphere thick with history.
                - paragraph [ref=e570]:
                  - text: The gilded reopening is the cherry on the cake of a decades-long renovation of the world’s largest, most intact medieval medina that has reinforced several thousand rammed-earth structures as well as restored many of the city’s most significant monuments. First among these is the ninth-century Qarawiyyin Library in the world’s oldest university, while
                  - link "Place Lalla Yeddouna" [ref=e571] [cursor=pointer]:
                    - /url: https://www.instagram.com/reel/DKjk8BIIKUk/
                  - text: —a riverside neighborhood rehabilitated by architects
                  - link "Michel Mossessian" [ref=e572] [cursor=pointer]:
                    - /url: https://www.mossessian.com/
                  - text: and
                  - link "Yassir Khalil" [ref=e573] [cursor=pointer]:
                    - /url: https://www.yassirkhalilstudio.com/
                  - text: —was shortlisted for the
                  - link "2025 Aga Khan Award for Architecture" [ref=e574] [cursor=pointer]:
                    - /url: https://the.akdn/en/resources-media/whats-new/news-release/aga-khan-award-for-architecture-announces-2025-shortlist
                  - text: . Then there are the beautiful 14th- and 15th-century fonduks (trading houses) of Chemmaine, Sbitryine, and Barka, restored as gorgeous artisan workshops focused on high-quality local crafts. Fonduk Kaat Smen will join them before the end of 2026, reopening its doors to a unique historic honey market. The Al Batha Museum of Islamic Arts, now Morocco’s finest museum, also quietly reopened recently; it offers a well-curated overview of the country’s dynastic history by using exquisite artifacts and illuminated manuscripts that place Fès in the context of a wide web of Mediterranean and African relationships. Those connections are evident at the
                  - link "Fès Festival of World Sacred Music" [ref=e575] [cursor=pointer]:
                    - /url: https://fesfestival.com/2025/en/fez-festival/
                  - text: ", which takes place annually in May and June and celebrates Fès’s role as a center of Sufi mysticism, Islamic scholarship, and"
                  - link "Andalusian" [ref=e576] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/story/the-best-things-to-do-in-seville
                  - text: "musical heritage. Also on deck for 2026: The city kicks off the year hosting Africa Cup of Nations matches, and awaits a near-total solar eclipse in August."
              - generic [ref=e583]:
                - paragraph [ref=e584]:
                  - strong [ref=e585]: "How to plan it:"
                  - text: Ryanair is the only airline to offer direct flights from London Stansted to Fès-Saïss Airport. Alternatively, multiple airlines offer direct flights from the UK and European cities to the capital, Rabat, a two-and-a-half-hour drive from Fès. If you take this route, visit the Roman ruins of Volubilis, where Moulay Idris I, the founding father of Fès and the Moroccan state, first found refuge. Fès-based
                  - link "Culture Insider" [ref=e586] [cursor=pointer]:
                    - /url: https://culture-insider.com/
                  - text: offers engaging architecture, craft, culture, and food tours full of great storytelling and facilitates relaxed connections with local vendors, artisans, and chefs. With the appropriate notice, they can also help obtain permissions to visit the Qarawiyyin Library. —
                  - link "Paula Hardy" [ref=e587] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/contributor/paula-hardy
                    - emphasis [ref=e588]: Paula Hardy
