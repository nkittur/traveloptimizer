                - heading "Gabon" [level=2] [ref=e598]
                - paragraph [ref=e600]:
                  - emphasis [ref=e601]:
                    - strong [ref=e602]: "Go for:"
                    - text: pristine African rainforest meeting the sea; an immersive, active alternative to game-drive safaris; the wonder of isolation
              - figure [ref=e606]:
                - generic [ref=e609]:
                  - img "Cyril RuosoLoango Savannah Camp"
                - generic [ref=e610]:
                  - paragraph [ref=e612]: Surfing hippos, gorillas, and humpback whales are just a few of the incredible species one may encounter in Gabon's incredible and often overlooked national parks.
                  - generic [ref=e613]: Cyril Ruoso/Loango Savannah Camp
              - generic [ref=e617]:
                - paragraph [ref=e618]:
                  - text: Gabon's tourism industry might still be in its infancy, but 2026 will see it emerge as Africa’s (and arguably the world’s) most exhilarating
                  - link "rainforest destination" [ref=e619] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/gallery/rainforest-resorts
                  - text: with the January opening of
                  - link "Loango Savannah Camp" [ref=e620] [cursor=pointer]:
                    - /url: https://inivatourism.com/en/hotels/loango-savanna-camp/
                  - text: . Located on the iconic Iguela Lagoon—where forest elephants splash en route to a coastline made famous by Gabon’s surfing hippos—this new tented camp is one of three properties in the northern part of Loango National Park. Dubbed Africa’s Last Eden, Loango—a wonderland of pristine forest, savannah, and lagoons pouring into the wild Atlantic—offers, among other things, what some insiders are calling the best
                  - link "gorilla trekking" [ref=e621] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/story/lewis-hamilton-goes-gorilla-trekking-in-rwanda
                  - text: experience in Africa.
                - paragraph [ref=e622]:
                  - text: If three lodges are two too many, head south to
                  - link "Moukalaba-DouDou National Park" [ref=e623] [cursor=pointer]:
                    - /url: https://www.amazinggabon.com/en/moukalaba-doudou-national-park/
                  - text: ", where"
                  - link "Nyanga Lodge" [ref=e624] [cursor=pointer]:
                    - /url: https://inivatourism.com/en/hotels/nyanga-camp/
                  - text: ", which opened in early 2025, enjoys sweet isolation as the sole luxury safari property in what locals refer to as the “great apes national park.” Nyanga’s offerings for 2026 include outdoor dining experiences from a new treetop terrace to beach dinners, all the better to spy one of the park’s many primate species or marine spectacles like migrating humpback whales and nesting sea turtles. With its surrounding waters also rich in game fish like tarpon, Nyanga will additionally launch the first full season of its exclusive international catch-and-release"
                  - link "sport fishery" [ref=e625] [cursor=pointer]:
                    - /url: https://inivatourism.com/en/activities/sport-fishing-at-nyanga-camp/
                  - text: in 2026.
                - paragraph [ref=e626]:
                  - text: For those seeking an even wilder experience, the early 2026 opening of Sette Cama Eco Camp at the remote southern end of Loango National Park promises to be a game changer. The first property in
                  - link "Machaba Safaris" [ref=e627] [cursor=pointer]:
                    - /url: https://machabasafaris.com/en
                  - text: ’ Machaba Wild portfolio, this comfortable base camp will focus on adventures that favor immersion over indulgence. With activities like jungle treks (tracking chimpanzees, western lowland gorillas, forest elephants, and red river hogs), longer coastal trails (the best way to see the same jungle creatures on the beach as well as surfing hippos), and boat cruises and kayaking trips (ideal for spotting dwarf crocodiles, incredible bird life, and the shyer West African manatees), it’s all about active engagement with Gabon’s extraordinary environments. Perhaps the ultimate and most intimate version of jungle immersion,
                  - link "Lowveld Trails" [ref=e628] [cursor=pointer]:
                    - /url: https://www.lowveldtrails.co.za/
                  - text: Co. will launch its first full-season of multinight primitive walking trails in mid-late summer 2026, using Sette Cama Eco Camp as its base.
              - generic [ref=e635]:
                - paragraph [ref=e636]:
                  - text: While Gabon’s wonders are both unique and abundant, tourism infrastructure remains rudimentary at best, and great wildlife sightings are not always easy. With
                  - link "Anderson Expeditions" [ref=e637] [cursor=pointer]:
                    - /url: https://www.andersonexpeditions.com/expeditions/gabon/
                  - text: ", a pioneer in conservation-forward tourism in Gabon, resuming its tailored itineraries in 2026, private guides will help guests navigate the primeval forests and crystalline streams."
                - paragraph [ref=e638]:
                  - strong [ref=e639]: How to plan it
                  - text: ": Air France flies direct from Paris to Libreville daily, from which travel to the parks by charter flight is highly recommended. Ethiopian Airlines (via Addis Ababa, three to four times weekly) and Turkish Airlines (via Istanbul, six times weekly) also fly nonstop."
                  - link "FlyGabon" [ref=e640] [cursor=pointer]:
                    - /url: https://www.flygabon.online/en
                  - text: and
                  - link "ASKY" [ref=e641] [cursor=pointer]:
                    - /url: https://www.flyasky.com/tg/en/
                  - text: both offer twice-weekly flights from Johannesburg, as well as direct flights to and from São Tomé and Príncipe, providing a more classic “beach holiday” pairing with a Gabon adventure. Gabon’s tourism infrastructure is thin on the ground, so use a locally based operator like
                  - link "Iniva Tourism & Hospitality" [ref=e642] [cursor=pointer]:
                    - /url: https://cna.st/affiliate-link/7zscoHCrWNbASYdMmRXeKsqvcnC4fc1FLnYaYU5CMvn4FKKXgWjVgtX21hjj8EqTiBg9Lh974JFWSmNvq6e48h1D3mYTGVmbjGGbVwmPFB5WUdfdUmSBCehzitpatyDeV8qUnCATyN9XVP5Pr3YvBAHYRf6mEMfNqzSzQyT7PNoyNkYp1bGqpCWiZrCYP6zRWddkjruKNBSUys2KnhrWeXDju5dwmNAtBb2ayydxU6nMknqCfrSc9PQz9Ti9zYw3TkbZiNw2yr8mHSxp7nhwszGr91gLdauvKEM
