                - heading "East Coast, Barbados" [level=2] [ref=e490]
                - paragraph [ref=e492]:
                  - emphasis [ref=e493]:
                    - strong [ref=e494]: "Go for:"
                    - text: a new (unspoiled) slice of island life—and more access than ever
              - figure [ref=e498]:
                - generic [ref=e501]:
                  - img "Scenic view down the coastline looking north from bathsheba bathsheba barbados caribbean"
                - generic [ref=e502]:
                  - paragraph [ref=e504]: Barbados' wilder East Coast makes for a more rugged, windswept version of the Caribbean getaway—and with new flight and cruise options, there are now even more ways to access this surfer's paradise.
                  - generic [ref=e505]: Shutterstock
              - generic [ref=e509]:
                - paragraph [ref=e510]:
                  - text: With new direct flight routes and luxe cruise itineraries, the Caribbean’s
                  - link "easternmost island" [ref=e511] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/gallery/best-hotels-in-barbados
                  - text: is becoming more accessible than ever in 2026.
                  - link "Delta and KLM" [ref=e512] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/galleries/2015-10-07/top-international-airlines-readers-choice-awards
                  - text: recently launched nonstop routes from their hubs in Atlanta and Amsterdam, respectively, and the port of Bridgetown completed a $2 million upgrade in 2023. The island is also developing the port of Speightstown on the north end of the island, which now offers new moorings for smaller luxury vessels like the
                  - emphasis [ref=e513]:
                    - link "Emerald Sakara" [ref=e514] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/ships/emerald-cruises/emerald-sakara
                    - strong [ref=e515]: ","
                  - text: from Emerald Cruises, which docks here on a number of itineraries during its 2026 winter season.
                - paragraph [ref=e516]:
                  - text: All of this will invariably mean more visitors. But that doesn’t mean you can’t easily escape the crowds should you choose. While Barbados’s most popular luxury resorts lie along the tranquil western shores on the Caribbean Sea, adventure-minded travelers can drive just a half hour northeast from Grantley Adams International Airport or the busy Bridgetown cruise ports to reach the island’s more rugged Atlantic coastline, where dramatic scenery, world-class
                  - link "surfing" [ref=e517] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/story/best-surf-hotels-around-the-world
                  - text: ", and colorful fishing villages preserve the island’s unspoiled character. Start in Bathsheba, where powerful waves have long drawn surfers to the Soup Bowl, a reef break revered by international pros. There’s plenty of outdoor activities for nonsurfers too, with a"
                  - link "national park" [ref=e518] [cursor=pointer]:
                    - /url: https://barbados.org/fhill.htm
                  - text: and
                  - link "wildlife reserve" [ref=e519] [cursor=pointer]:
                    - /url: https://barbados.org/reserve.htm
                  - text: protecting the majority of the east coast from commercial development. Hike from Bath Beach to Bathsheba on a scenic six-mile path that follows the former route of the island's coastal railway. Then round out the day in the nearby village of Martin's Bay on Thursdays, when the Bay Tavern Fish Fry brings together neighbors and visitors alike for fresh-off-the-boat red snapper, baked mac and cheese, and rum-fueled karaoke sessions.
              - generic [ref=e526]:
                - paragraph [ref=e527]:
                  - text: In the past, the majority of east-coast accommodations have consisted of
                  - link "family-owned inns" [ref=e528] [cursor=pointer]:
                    - /url: https://www.atlantishotelbarbados.com/
                  - text: and seaside cottages. This September hotelier Paul Doyle, who owns the island’s oldest operating hotel,
                  - link "The Crane Resort" [ref=e529] [cursor=pointer]:
                    - /url: https://cna.st/affiliate-
                  - text: ", finished the three-year construction on a new all-villa property called"
                  - link "East Resort" [ref=e530] [cursor=pointer]:
                    - /url: https://www.eastresort.com/
                  - text: —bringing upscale yet intimate lodging to what they call Barbados’s best-kept secret.
                - paragraph [ref=e531]:
                  - strong [ref=e532]: "How to plan it:"
                  - text: The high season in Barbados runs from December through April. For peak action, plan your trip around the
                  - link "Barbados Surf Pro" [ref=e533] [cursor=pointer]:
                    - /url: https://www.visitbarbados.org/barbados-surf-pro
                  - text: in March, the Barbados Food & Rum Festival in November, or Barbados Sailing Week in January. Visiting during the low season, from July to October, you'll find thinner crowds, but expect brief daily rain showers. Direct flights into Barbados’ Grantley Adams International Airport are available from Miami, New York, Charlotte, and Dallas—new non-stop flights from Atlanta on Delta launched in May 2025, and new direct flights from Amsterdam on KLM start October 2025. If you prefer to arrive by sea, Four Seasons Yachts and Oceania Cruises offer new Caribbean itineraries in 2026 with stops in Bridgetown, which has just completed a $2 million port upgrade. —
                  - link "Mariette Williams" [ref=e534] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/contributor/mariette-williams
                    - emphasis [ref=e535]: Mariette Williams
                - generic [ref=e536]:
                  - link "Book a stay at The Crane Resort" [ref=e537] [cursor=pointer]:
                    - /url: https://cna.st/affiliate-
                    - generic [ref=e538]: Book a stay at The Crane Resort
                  - link "Browse more hotels in Barbados" [ref=e539] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/gallery/best-hotels-in-barbados
                    - generic [ref=e540]: Browse more hotels in Barbados
