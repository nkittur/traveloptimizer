                - heading "Minas Gerais, Brazil" [level=2] [ref=e873]
                - paragraph [ref=e875]:
                  - emphasis [ref=e876]:
                    - strong [ref=e877]: "Go for:"
                    - text: modern art, rich culinary traditions, and a capital city on the rise
              - figure [ref=e881]:
                - generic [ref=e884]:
                  - img "The Central Brazilian state of Minas Gerais has been flying under the radar but is home to some of the best contemporary..."
                - generic [ref=e885]:
                  - paragraph [ref=e887]: The Central Brazilian state of Minas Gerais has been flying under the radar but is home to some of the best contemporary architecture on Earth—not to mention its hip capital Belo Horizonte which is welcoming new hotels and restaurants to rival Rio.
                  - generic [ref=e888]: Inhotim Museum
              - generic [ref=e892]:
                - paragraph [ref=e893]:
                  - text: Brazil is almost a continent in itself, with regions as diverse as the palm-fringed beaches of the northeast, vineyards tucked into the lush valleys of the south, and the vast, wildlife-rich wetlands of the
                  - link "Pantanal" [ref=e894] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/story/in-brazils-pantanal-wetlands-jaguars-cowboys-and-a-changing-landscape-coexist
                  - text: . Yet with its deep culinary traditions, echoes of colonial architecture, and famously warm hospitality, Minas Gerais, one of Brazil’s largest states, is among its most overlooked treasures—at least to an international audience.
                - paragraph [ref=e895]:
                  - text: The capital city of Belo Horizonte has been quietly transforming into a top destination, fueled by its vibrant boteco culture centered around the no-frills, often anonymous bars serving great food and always-ice-cold beer. Much like the bistronomie movement in Paris, young chefs are reimagining regional classics in modern spots such as
                  - link "Bar Pirex" [ref=e896] [cursor=pointer]:
                    - /url: https://www.instagram.com/barpirex/
                  - text: ", from Caio Soter, and"
                  - link "A Porca Voadora" [ref=e897] [cursor=pointer]:
                    - /url: https://www.instagram.com/aporcavoadorabar/
                  - text: ", from Bruna Resende, while the city’s art scene continues to flourish. The architectural team behind"
                  - link "Mercado Novo" [ref=e898] [cursor=pointer]:
                    - /url: https://www.instagram.com/mercadonovobh?igsh=MXdzeGZqM3lpYmZxMw==
                  - text: —the cultural and gastronomic hub that helped reshape the city’s urban fabric over the past decade—is now launching Galeria Ficus, on a charming square in the Carlos Prates neighborhood. Housed in a restored manor house, this hybrid project will feature seven shops and a cocktail bar, aiming to bring new life into the historic space.
                - paragraph [ref=e899]:
                  - text: In the lively Savassi district, newly relaunched
                  - link "Albuquerque Contemporânea" [ref=e900] [cursor=pointer]:
                    - /url: https://albuquerquecontemporanea.com/
                  - text: is quickly establishing itself as a key player in Brazil’s contemporary art scene. By highlighting rising local artists like
                  - link "Mateus Moreira" [ref=e901] [cursor=pointer]:
                    - /url: https://albuquerquecontemporanea.com/artists/43-mateus-moreira/
                  - text: (who will open an exhibition in March 2026) while also representing internationally recognized Brazilian names such as Ana Maria Tavares, the gallery is helping place the city on par with cultural hubs like São Paulo and
                  - link "Rio de Janeiro" [ref=e902] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/story/getting-to-the-heart-of-rio-de-janeiros-brazilian-soul
                  - text: . Accor is getting in on the creative action and opened its first
                  - link "Tribe hotel" [ref=e903] [cursor=pointer]:
                    - /url: https://all.accor.com/hotel/B9Y6/index.pt.shtml
                  - text: in Brazil here in September 2025.
              - generic [ref=e910]:
                - paragraph [ref=e911]:
                  - text: Just outside the city (1.5 hours by car),
                  - link "Inhotim" [ref=e912] [cursor=pointer]:
                    - /url: https://www.inhotim.org.br/en/
                  - text: ", Latin America’s largest open-air art museum, home to 800 works by more than 50 artists from 18 countries, will celebrate its 20th anniversary in 2026, with new exhibitions in April and October. The on-site hotel, the"
                  - link "Clara Arte Resort" [ref=e913] [cursor=pointer]:
                    - /url: https://cna.st/affiliate-link/MqMVDRsypCNABtu4hPFKAT43sgSzWQjC29QCxqfKyD4PiU52qYpGTWs9jZw64b9PHK5uyswYYFBAUU4EaZ2aoXETrS1fWbm54qvTaZnmVc4RvvAnC7gUtqaetqYisHeLJBoGotsdLzmERcWuYTxeL2XwGsaCVZ5NsECZugDQKB1B9H4Jq535oGqBzhz3KGmorSueAVvC7xVM1rjwh1MJL46MVLVGcvEYEFZGVw32QqSY9zVw8BBT6RZo4MRnUCKtwU613sYzEPvoDJCFoMjraM7oF98iEaW9
                  - text: ", inspired by Japan’s Benesse House, is also expanding, with 30 additional rooms planned to open by August 2026 along with a spa set in the middle of the forest. The hotel also offers intimate guided experiences just for hotel guests on Mondays and Tuesdays, when the museum is closed to the public."
                - paragraph [ref=e914]:
                  - strong [ref=e915]: "How to plan it:"
                  - text: There aren’t many direct international flights to Belo Horizonte, but the capital of
                  - link "Minas Gerais" [ref=e916] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/story/the-brazilian-state-of-minas-gerais-is-a-design-lovers-dream
                  - text: is well-connected to major Brazilian cities such as São Paulo and
                  - link "Rio de Janeiro" [ref=e917] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/story/getting-to-the-heart-of-rio-de-janeiros-brazilian-soul
                  - text: ", with multiple daily departures. To reach Inhotim, the best option is to rent a car—in good news, this will also allow you to explore smaller towns and culinary backroads throughout the state. (Just plan to get a sturdy vehicle for the unpaved roads you’ll likely encounter.) From May to September, temperatures are milder, though Minas is certainly a year-round destination."
