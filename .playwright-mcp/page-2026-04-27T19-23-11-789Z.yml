                - heading "Deer Valley, Utah" [level=2] [ref=e443]
                - paragraph [ref=e445]:
                  - emphasis [ref=e446]:
                    - strong [ref=e447]: "Go for:"
                    - text: one last (Sun)dance; double the skiable terrain
              - figure [ref=e451]:
                - generic [ref=e454]:
                  - paragraph [ref=e456]: The year 2026 will be the last time Robert Redford's Sundance Film Festival calls Deer Valley home, but the legendary Utah ski destination is already looking beyond the bittersweet farewell with new hotel openings, a historic expansion of their beloved ski area, and even a champagne yurt.
                  - generic [ref=e457]: Getty
              - paragraph [ref=e462]:
                - text: For decades Deer Valley has been synonymous with groomed slopes, polished service, and the starry energy of the
                - link "Sundance Film Festival" [ref=e463] [cursor=pointer]:
                  - /url: https://www.sundance.org/blogs/what-to-know-about-the-2026-sundance-film-festival/
                - text: . In January 2026, that story will come full circle. After over four decades in
                - link "Park City" [ref=e464] [cursor=pointer]:
                  - /url: https://www.cntraveler.com/story/where-to-eat-stay-and-play-in-park-city
                - text: ", Sundance will mark its final year in Utah, culminating with what organizers call “a celebration full of gratitude and joy” to honor founder Robert Redford and the cultural milestone this moment represents. As Sundance bows out, Deer Valley enters a new era with the largest ski-resort expansion in North American history. The"
                - link "Expanded Excellence initiative" [ref=e465] [cursor=pointer]:
                  - /url: https://expandedexcellence.deervalley.com/
                - text: more than doubles skiable terrain to 4,300 acres, with nearly 100 new runs and 31 lifts. This winter also brings seven new chairlifts, including the East Village Express gondola, alongside the continued rollout of
                - link "East Village" [ref=e466] [cursor=pointer]:
                  - /url: https://deervalleyeastvillage.com/east-village#hotels-and-residences
                - text: ", which offers streamlined mountain access and more than 70 shops and restaurants. Upon completion, East Village will also feature eight hotels, including the"
                - link "Grand Hyatt Deer Valley" [ref=e467] [cursor=pointer]:
                  - /url: https://www.cntraveler.com/hotels/park-city/grand-hyatt-deer-valley
                - text: ", which opened in late 2024, the forthcoming"
                - link "Canopy by Hilton" [ref=e468] [cursor=pointer]:
                  - /url: https://cna.st/affiliate-
                - text: (Hilton's first ski-destination property, set to debut in summer 2026), and further out, a
                - link "Four Seasons resort and residences" [ref=e469] [cursor=pointer]:
                  - /url: https://cna.st/affiliate-
                - text: slated to open in 2028. Add in the swanky
                - link "Chute Eleven Champagne yurt" [ref=e470] [cursor=pointer]:
                  - /url: https://www.deervalley.com/things-to-do/restaurants/chute-eleven
                - text: ", returning for its second year, plus 300 inches of annual snowfall backed by a state-of-the-art snowmaking system, and Deer Valley stands ready to show travelers what its next chapter looks like."
              - generic [ref=e477]:
                - paragraph [ref=e478]:
                  - strong [ref=e479]: "How to plan it:"
                  - text: Salt Lake City International Airport is a mere 45-minute drive from Deer Valley, making the resort one of the most accessible in the Rockies. The ski season runs from early December through mid-April, and natural snowfall is augmented by snowmaking that covers key areas. If you're coming to hit the slopes, be sure to
                  - link "book your lift tickets" [ref=e480] [cursor=pointer]:
                    - /url: https://www.deervalley.com/plan-your-trip/tickets-and-passes
                  - text: early—Deer Valley caps daily skier numbers, via lift tickets sold daily, to preserve its uncrowded experience. —
                  - link "Lauren Dana Ellman" [ref=e481] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/contributor/lauren-dana-ellman
                    - emphasis [ref=e482]: Lauren Dana Ellman
                - link "Book a stay at Grand Hyatt Deer Valley" [ref=e484] [cursor=pointer]:
                  - /url: https://cna.st/affiliate-
                  - generic [ref=e485]: Book a stay at Grand Hyatt Deer Valley
