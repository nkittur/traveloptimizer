              - figure [ref=e773]:
                - generic [ref=e776]:
                  - img "PAIR'DBEACHCLUBCreditTourismWesternAustralia"
                - generic [ref=e777]:
                  - paragraph [ref=e779]: Wine takes center-stage in Margaret River, but with some of Western Australia's best coastline at your fingertips, you won't know whether to spend your time swimming or sipping. Thanks to new seaside wine festivals like Pair'd, you can do both.
                  - generic [ref=e780]: Tourism Western Australia
              - generic [ref=e784]:
                - paragraph [ref=e785]:
                  - text: Margaret River is a name that conjures visions of rugged
                  - link "coastal landscapes" [ref=e786] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/the-best-beaches-in-the-world
                  - text: ", big swells, and rolling"
                  - link "vineyards" [ref=e787] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/story/wine-regions-worth-visiting-even-if-you-dont-drink
                  - text: ". Here in Wadandi country, home to the “saltwater people” for over 40,000 years, you choose your own adventure: Hike the 84-mile Cape to Cape Track between Cape Naturaliste in the north and Cape Leeuwin in the south, dive into immersive cultural experiences, or engage with a food and wine scene that has deep roots."
                - paragraph [ref=e788]:
                  - text: The international surf spotlight shines on the
                  - link "WSL Margaret River Pro 2026" [ref=e789] [cursor=pointer]:
                    - /url: https://www.margaretriver.com/event/margaret-river-pro/
                  - text: (April 17–27), which will be the second stop of the World Surf League’s Championship Tour, which is celebrating its 50th anniversary. Then a local roster of food and wine talent lights up winter with the 10th edition of the
                  - link "Cabin Fever" [ref=e790] [cursor=pointer]:
                    - /url: https://cabinfeverfest.com.au/
                  - text: festival (July 17–26) before
                  - link "Pair’d," [ref=e791] [cursor=pointer]:
                    - /url: https://pairdmargaretriver.com/
                  - text: a wine and food celebration, returns in November 2026 for its third year in a row (in 2025, headliners included Francis Mallmann, David Pynt, and Josh Niland, and 2026 is likely to build on its impressive beginnings).
                - paragraph [ref=e792]:
                  - text: Opening in early 2026, the team behind Margaret River’s storied winery
                  - link "Vasse Felix" [ref=e793] [cursor=pointer]:
                    - /url: https://www.vassefelix.com.au/
                  - text: will debut two new experiences. First, there will be a sleek tasting salon for
                  - link "Idée Fixe," [ref=e794] [cursor=pointer]:
                    - /url: https://ideefixe.com.au/
                  - text: the winery’s sparkling offshoot dedicated to Blanc de Blancs, a style made entirely from Chardonnay, in the traditional Champagne method. While Idée Fixe, just south of Margaret River town, has quietly been producing for several years, this will be its first stand-alone space, where it will offer immersive tastings and a behind-the-scenes look into the craft of méthode traditionnelle winemaking. It's a natural evolution in a region widely considered Australia’s top Chardonnay producer. Second, a coastal-inspired bistro will open with sweeping views of the vineyard.
              - generic [ref=e801]:
                - paragraph [ref=e802]:
                  - text: Late in 2026, Dunsborough, in the region’s north, will welcome South West House, a boutique hotel that will bring a new layer of smart Australian luxury to the region. Throughout the 54 guest rooms and adjoining wellness and hospitality amenities, there’s a blend of raw industrialism and natural materials. Meanwhile, a transformative restoration of
                  - link "The Margaret River Hotel," [ref=e803] [cursor=pointer]:
                    - /url: https://margaretriverhotel.com.au/
                  - text: a 90-year-old icon, sees Arts and Crafts–era style put to work over 27 designer rooms and will open in mid-2026, as will the bar and dining room (much to the relief of locals), whose hyperlocal menu now champions Western Australian produce with a wine cellar to match.
                - paragraph [ref=e804]:
                  - strong [ref=e805]: "How to plan it:"
                  - text: "It’s a little over three hours by car from Perth, but Busselton-Margaret River Airport, which is a 45-minute drive, has Sydney and Melbourne flights via Jetstar. The region is vast and varied: Amid coastal towns, epic surf, and forested hinterlands, Margaret River's wineries are world-renowned; the region hosted the World's 50 Best Vineyards 2025 awards last November. With so much ground to cover—and limited public transport—hiring a car is the best way to explore properly. —"
                  - link "Max Brearley" [ref=e806] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/contributor/max-brearley
                    - emphasis [ref=e807]: Max Brearley
