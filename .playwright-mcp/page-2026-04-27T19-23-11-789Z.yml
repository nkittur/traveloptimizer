                  - generic [ref=e1202]:
                    - 'img "Image may contain: Chair, Furniture, Dining Table, Table, Plate, Art, Collage, Boat, Transportation, Vehicle, and Person"'
                  - generic [ref=e1203]:
                    - link "The Ever-Presence of Mythology on Greece's Peloponnese Peninsula" [ref=e1205] [cursor=pointer]:
                      - /url: /story/the-ever-presence-of-mythology-on-greeces-peloponnese-peninsula
