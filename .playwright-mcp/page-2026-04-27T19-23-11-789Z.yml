                - heading "Route 66, USA" [level=2] [ref=e1320]
                - paragraph [ref=e1322]:
                  - emphasis [ref=e1323]:
                    - strong [ref=e1324]: "Go for:"
                    - text: 100 years of the Mother Road
              - generic [ref=e1328]:
                - figure [ref=e1329]:
                  - generic [ref=e1332]:
                    - img "Stuffed bear at Watson's BBQ"
                  - generic [ref=e1333]:
                    - paragraph [ref=e1335]: Route 66 turns 100 this year, and from California to Chicago its famous roadside shops and attractions will be celebrating in style.
                    - text: Watson's B-B-Q/Rachel Wright
                - figure [ref=e1336]:
                  - generic [ref=e1339]:
                    - img "Blue Swallow Motel exterior"
                  - generic [ref=e1340]:
                    - paragraph [ref=e1342]: The road's iconic motel and drive-in signs are a testament to its Americana history—thanks to historic preservation efforts, they're looking better than ever at 100.
                    - text: Blue Swallow Motel/Rachel Wright
              - generic [ref=e1349]:
                - paragraph [ref=e1350]:
                  - text: Neon lights are burning a little brighter along Route 66, the iconic US highway that stretched between
                  - link "Chicago" [ref=e1351] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/destinations/chicago
                  - text: and
                  - link "Santa Monica" [ref=e1352] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/gallery/best-hotels-in-santa-monica-california
                  - text: ", as it celebrates its centennial in 2026. While the contiguous highway was decommissioned in 1985, sections of it have been preserved for historic interest. Along these, vintage motel and diner signs have been restored to their midcentury brilliance, including more than a dozen along Albuquerque’s 18-mile (the country’s longest) urban stretch. In St. Robert, Missouri, long-abandoned neon signs have been polished and collected in the just-opened"
                  - link "Route 66 Neon Park" [ref=e1353] [cursor=pointer]:
                    - /url: https://visitpulaskicounty.org/experiences/route-66-neon-park
                  - text: . Celebrations are planned along the 2,448-mile route, from Springfield, Missouri, host of the
                  - link "Route 66 Centennial National Kick-Off" [ref=e1354] [cursor=pointer]:
                    - /url: https://route66centennial.org/index.php/celebrate/centennial-kickoff-event
                  - text: in April, to Tulsa’s
                  - link "Capital Cruise" [ref=e1355] [cursor=pointer]:
                    - /url: https://oklahomaroute66.com/events-1#!event/2026/5/30/tulsa-oklahoma-city-centennial-event-tbd
                  - text: in May, a world-record attempt for the largest-ever classic-car parade, and Amarillo’s 10-day-long
                  - link "Texas Route 66 Festival" [ref=e1356] [cursor=pointer]:
                    - /url: https://www.visitamarillo.com/events/route-66/
                  - text: in June.
                - paragraph [ref=e1357]:
                  - text: A trip along the Mother Road invites nostalgia for the past but also consideration of how history has been told. Historically, over 25
                  - link "tribal nations" [ref=e1358] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/story/how-to-be-a-respectful-visitor-on-us-native-lands
                  - text: lived along the route, but for years their diverse cultures were largely represented through reductive stereotypes, with concrete tipi storefronts and signage adorned with Hollywood-style depictions of Native peoples. Now travelers can get a more realistic view at Indigenous-run institutions including Albuquerque’s
                  - link "Indian Pueblo Cultural Center" [ref=e1359] [cursor=pointer]:
                    - /url: https://indianpueblo.org/
                  - text: ", operated by the 19 Pueblos of"
                  - link "New Mexico" [ref=e1360] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/story/northern-new-mexico-winter-guide
                  - text: ", which celebrates its 50th year in 2026, and at the"
                  - link "First Americans Museum" [ref=e1361] [cursor=pointer]:
                    - /url: https://famok.org/
                  - text: ", which opened in Oklahoma City in 2021 to tell the stories of Oklahoma’s 39 nations."
                - paragraph [ref=e1362]:
                  - strong [ref=e1363]: "How to plan it:"
                  - text: Centennial celebrations kick off on April 30 and continue throughout the year. Spring and fall typically promise the most comfortable conditions. While a continuous Route 66 may no longer exist, you can piece it together by following brown “Historic Route 66” signs or downloading a
                  - link "dedicated navigation app" [ref=e1364] [cursor=pointer]:
                    - /url: https://www.route66navigation.com/
                  - text: —standard navigation tools will lead you onto interstate highways. Recently spruced up route-side motels along the route include Flagstaff, Arizona’s
                  - link "Americana Motor Hotel" [ref=e1365] [cursor=pointer]:
                    - /url: https://cna.st/affiliate-
                  - text: ", where Peter Fonda and Dennis Hopper parked while filming"
                  - emphasis [ref=e1366]: Easy Rider
                  - text: in 1968. At
                  - link "Arrive Albuquerque" [ref=e1367] [cursor=pointer]:
                    - /url: https://cna.st/affiliate-
                  - text: ", which opened in a historic Route 66 motel this spring, guests get a front-row seat to Sunday’s lowrider cruise during which souped-up vehicles roll by, bringing this road’s past into contemporary American culture. —"
                  - link "Karen Gardiner" [ref=e1368] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/contributors/karen-gardiner
                    - emphasis [ref=e1369]: Karen Gardiner
                - paragraph [ref=e1370]:
                  - emphasis [ref=e1371]:
                    - text: Read our complete guide to the
                    - link "Best Places to Go in North America & the Caribbean in 2026" [ref=e1372] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/story/best-places-to-go-north-america-caribbean-2026
                    - text: .
                - heading "Saadiyat Island, Abu Dhabi" [level=2] [ref=e1374]
                - paragraph [ref=e1376]:
                  - emphasis [ref=e1377]:
                    - strong [ref=e1378]: "Go for:"
                    - text: world-class cultural institutions
              - figure [ref=e1382]:
                - generic [ref=e1385]:
                  - img "teamLab Phenomena Abu Dhabi ArtworksImage Compilation"
                - generic [ref=e1386]:
                  - paragraph [ref=e1388]: A stacked calendar of museum openings this year on Abu Dhabi's Saadiyat Island is solidifying the city's reputation as the fine arts capital of the Middle East.
                  - generic [ref=e1389]: teamLab Phenomena
              - generic [ref=e1396]:
                - paragraph [ref=e1397]:
                  - link "Abu Dhabi" [ref=e1398] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/tag/abu-dhabi
                  - text: might not always get the same share of global attention as its glitzier neighbor,
                  - link "Dubai" [ref=e1399] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/destinations/dubai
                  - text: ", but the UAE capital has just as much, if not more, to shout about right now—much of which is taking place on Saadiyat Island, where a cultural renaissance is underway. Saadiyat Cultural District has been home to"
                  - link "Louvre Abu Dhabi" [ref=e1400] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/activities/abu-dhabi/louvre-abu-dhabi
                  - text: since 2018, and, come November 22, 2025, it will be joined by
                  - link "Natural History Museum Abu Dhabi" [ref=e1401] [cursor=pointer]:
                    - /url: https://www.nhmad.ae/en?gad_source=1&gad_campaignid=22973161434&gbraid=0AAAAADl2Ym1vJkenryX3D9Em7hNRWcKuk&gclid=CjwKCAjw04HIBhB8EiwA8jGNbVjgwzkosW5PvE2oAchbZtPeQDl5Zt-5opqIVkGoxWERtXbG53xedBoC8jEQAvD_BwE
                  - text: ", before the long-awaited"
                  - link "Zayed National Museum" [ref=e1402] [cursor=pointer]:
                    - /url: https://zayednationalmuseum.ae/?trk=public_post-text
                  - text: opens its doors a week later. Named after the UAE's Founding Father, Sheikh Zayed, the museum will take visitors through the history of the UAE, while looking to the country's future. Designed by renowned architect Lord Norman Foster, the building has taken dramatic shape on the capital’s skyline in recent years, featuring striking narrow glass atriums inspired by a falcon’s wingtips.
                - paragraph [ref=e1403]:
                  - text: Then, in 2026,
                  - link "Guggenheim Abu Dhabi" [ref=e1404] [cursor=pointer]:
                    - /url: https://www.guggenheim.org/exhibition/site/guggenheim-abu-dhabi
                  - text: is due to be completed, shaping this mile-square patch of island, surrounded by the calm waters of the Arabian Gulf, into a museum district to rival that of London or New York. Add to this line-up the new teamLab Phenomena and existing Abrahamic Family House—an interfaith complex and one of the world’s most unique representations of tolerance—plus the string of luxury resorts that line Saadiyat Beach, the UAE’s most beautiful stretch of coast, next door, and you’ve got more than enough reasons to add Saadiyat Island to your 2026 travel wishlist.
                - paragraph [ref=e1405]:
                  - strong [ref=e1406]: "How to plan it:"
                  - text: It’s a 30-minute taxi journey from Zayed International Airport to Saadiyat Island’s museum quarter. You can book a two-night stopover in the UAE capital, with a complimentary city hotel stay, via Etihad Airways
                  - link "." [ref=e1407] [cursor=pointer]:
                    - /url: https://www.etihad.com/en-gb/abu-dhabi/stopover
                  - text: The Experience Abu Dhabi Shuttle Bus is a hop-on-and-off complimentary service, linking hotels and tourist attractions across the city centre and beyond, including Saadiyat Island. —
                  - link "Sophie Prideaux" [ref=e1408] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/contributor/sophie-prideaux
                    - emphasis [ref=e1409]: Sophie Prideaux
                - paragraph [ref=e1410]:
                  - emphasis [ref=e1411]:
                    - text: Read our complete guide to the
                    - link "Best Places to Go in Asia in 2026" [ref=e1412] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/story/the-best-places-to-go-in-asia-in-2026
                    - text: .
                - heading "Saint-Gervais-les-Bains, France" [level=2] [ref=e1414]
                - paragraph [ref=e1416]:
                  - emphasis [ref=e1417]:
                    - strong [ref=e1418]: "Go for:"
                    - text: sustainable train travel and sweeping Haute-Savoie views
              - figure [ref=e1422]:
                - generic [ref=e1425]:
                  - img "Amid a changing climate SaintGervaislesBains is leading the charge for a new era of sustainable tourism in the Alps—a..."
                - paragraph [ref=e1428]: Amid a changing climate, Saint-Gervais-les-Bains is leading the charge for a new era of sustainable tourism in the Alps—a new energy efficient train and the opening of a glacier and climate center are conscious efforts toward positive change in a region whose way of life hangs in the balance.
              - generic [ref=e1435]:
                - paragraph [ref=e1436]:
                  - text: In 2026, Saint-Gervais-les-Bains, in Haute-Savoie, is taking a big step towards rewriting what
                  - link "Alpine tourism" [ref=e1437] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/story/in-the-bavarian-alps-waltzing-my-way-into-family-history
                  - text: can look like. The
                  - link "Mont Blanc Express" [ref=e1438] [cursor=pointer]:
                    - /url: https://www.mont-blanc-express.ch/en
                  - text: ", the century-old railway that winds between Saint-Gervais-les-Bains’ Le Fayet and Martigny, will unveil a new fleet of energy-efficient trains in the summer. For a line first electrified in 1908, it’s a symbolic upgrade: proof that sustainable travel is no longer a side story in the Alps, but the way forward. The new trains will double capacity, cut emissions, and ease car traffic in the valleys, while strengthening the cross-border links that have always defined this region. From 2026, the Léman Express from"
                  - link "Geneva" [ref=e1439] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/story/12-best-things-to-do-in-geneva-for-every-season
                  - text: will also expand services, making it easier than ever to arrive in the Mont Blanc foothills entirely by rail.
                - paragraph [ref=e1440]:
                  - text: In the Belle Époque spa town, innovation is already reshaping daily life. Launched in 2024, Le Valléen gondola is the first in
                  - link "France" [ref=e1441] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/destinations/france
                  - text: to connect a mainline SNCF station directly with a mountain resort centre. In five minutes, it whisks passengers from Saint-Gervais Le Fayet station to the town center with sweeping views over the Bonnant gorge, cutting traffic and linking directly to ski lifts. From the same station, the Mont Blanc Express runs up the valley to
                  - link "Chamonix" [ref=e1442] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/gallery/best-apres-ski-scenes-in-europe
                  - text: .
                - paragraph [ref=e1443]:
                  - text: The famous Alpine town adds to the story in 2026 with the opening of the
                  - link "Glaciorium" [ref=e1444] [cursor=pointer]:
                    - /url: https://montenversmerdeglace.montblancnaturalresort.com/en/page/glaciorium
                  - text: ", a glacier and climate center at Montenvers—a timely reminder of why these greener choices matter. Together with Saint-Gervais, this corner of Haute-Savoie feels less like a nostalgic ski destination and more like a region reimagining its future—proving the Alps can still thrill, while treading more lightly on the mountain."
                - paragraph [ref=e1445]:
                  - strong [ref=e1446]: "How to plan it:"
                  - text: From 2026, take the Léman Express direct to Saint-Gervais–Le Fayet in just over an hour. At Le Fayet, hop on the Le Valléen gondola for a five-minute ride into Saint-Gervais, or continue on the Mont Blanc Express to Chamonix and into Switzerland. With this growing rail-and-lift network, a car isn’t essential. Ski in winter, hike and climb in summer, and don’t miss the Saint-Gervais thermal baths year-round. —
                  - link "Katilena Dartford" [ref=e1447] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/contributor/katilena-dartford
                    - emphasis [ref=e1448]: Katilena Dartford
                - paragraph [ref=e1449]:
                  - emphasis [ref=e1450]:
                    - text: Read our complete guide to the
                    - link "Best Places to Go in Europe in 2026" [ref=e1451] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/story/the-best-places-to-go-in-europe-in-2026
                    - text: .
                - heading "Udaipur, India" [level=2] [ref=e1453]
                - paragraph [ref=e1455]:
                  - emphasis [ref=e1456]:
                    - strong [ref=e1457]: "Go for:"
                    - text: new luxury hotels and a sense of urban renewal
              - generic [ref=e1461]:
                - figure [ref=e1462]:
                  - generic [ref=e1465]:
                    - img "Leela Palace"
                  - generic [ref=e1466]:
                    - paragraph [ref=e1468]: Udaipur is synonymous with opulence, and its legendary hotels like the Leela Palace (above) are expanding and renovating as more tourists flock to the historic city.
                    - text: Leela Palace
                - figure [ref=e1469]:
                  - generic [ref=e1472]:
                    - img "Fairmont Udaipur"
                  - generic [ref=e1473]:
                    - paragraph [ref=e1475]: The city is welcoming a new class of modern hotels to its lineup of old-world classics, like the Fairmont Udaipur (above) which is moving into the lush forest surrounding the city.
                    - text: Fairmont Udaipur
              - generic [ref=e1482]:
                - paragraph [ref=e1483]:
                  - text: In a valley within the ancient Aravalli mountains, Rajasthan’s 16th-century “lake city” has always drawn glamorous travelers to its Rajput palaces and stately havelis. Now, a flurry of luxury hotel openings is bringing a welcome sense of renewal. Alongside icons of Indian hospitality like the Taj, Oberoi, and Leela groups, major international players have entered the fray. Tucked into the forest surrounding the 19th-century Monsoon Palace—the former hunting retreat of Maharana Sajjan Singh—
                  - link "Fairmont Udaipur Palace" [ref=e1484] [cursor=pointer]:
                    - /url: https://cna.st/affiliate-link/252UdZcajgSFKNQtumEptt12gsWx14abFexDicVgU9cvrSP4TXUGsu1orNGW4dg3R1NAeCxL2uLm8g2izpf1eaq1t3zA5pypp2d96rNfW76yX51yABm574XxHFzEkj446dWZbetzNeZWG4nxSpAeiqszACSLXwpGbMwr6cyJsS9oA4aG1VeBbGQYFTXbtytbCYbQExV89hD5sFAbr1Wer662CMGGXZGYPJ4btFmDTt9v4Bh69JpRzAEXFm2ejeygA5iPbaQVVVhy9bc3NAsvtaXG8TW2bP
                  - text: is a palatial 327-key hotel filled with Pichwai art, intricate chattris, and nods to Rajput-era design.
                - paragraph [ref=e1485]:
                  - text: If you’re inspired by its sumptuous design details, visit
                  - link "The House of Things" [ref=e1486] [cursor=pointer]:
                    - /url: https://thehouseofthings.com/
                  - text: ", Udaipur’s new address for Indian design, where more than 200 homegrown brands, including Jaipur Rugs and Aadyam Handwoven, come together under one roof in a collection curated by locals Astha and Manan Khetan. The"
                  - link "226-key Marriott" [ref=e1487] [cursor=pointer]:
                    - /url: https://cna.st/affiliate-
                  - text: has also debuted on the northern edge of Fateh Sagar, encircled by hills, and filled with sweeping marble terraces and stone-carved jharokas. Meanwhile, in the heart of Udaipur, on the fringes of Lake Pichola, longtime favorite
                  - link "The Leela Palace Udaipur" [ref=e1488] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/hotels/india/udaipur/leela-palace-kempinski-udaipur
                  - text: is channeling its signature modern Indian aesthetic into its new private villa offering, Arq at Pichola, with private butler service, mixologists on call, and waterfront daybeds at three exclusive villas.
                - paragraph [ref=e1489]:
                  - text: Boutique Indian brand
                  - link "Minimalist Hotels" [ref=e1490] [cursor=pointer]:
                    - /url: https://www.minimalisthotels.com/
                  - text: is due to bring its signature design-forward style to the banks of Lake Pichola in the coming months, with an intimate 20-key property, while the Hilton is set to arrive in early 2026. From February 20th to 22nd, vintage automobiles will rumble through the grounds of
                  - link "The Oberoi Udaivilas" [ref=e1491] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/hotels/udaipur/the-oberoi-udaivilas-udaipur
                  - text: as the Oberoi Concourse d’Elegance returns for its second edition. Sir Jackie Stewart, Jacky Ickx, and Giacomo Agostini are among the expert panel that will judge the showcase of European and American classics, heritage Indian cars and automobiles of erstwhile maharajas.
                - paragraph [ref=e1492]:
                  - strong [ref=e1493]: "How to plan it:"
                  - text: The best time to visit Udaipur is in the cooler months from September to March. Fly into Udaipur Airport from major Indian cities such as Delhi (1 hour and 15 minutes), Mumbai (1 hr 30 mins), Bengaluru (2 hr 10 mins) and Jaipur (1hr). Jaipur, a 6.5-hour drive away, is the closest international airport.—
                  - link "Malavika Bhattacharya" [ref=e1494] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/contributor/malavika-bhattacharya
