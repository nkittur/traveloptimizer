                - paragraph [ref=e326]:
                  - text: While the city received media attention recently in light of 2025 election demonstrations, Arusha is abuzz with other goings-on, too, courtesy of local entrepreneurs, from Afro-minimalist
                  - link "Makao Collective" [ref=e327] [cursor=pointer]:
                    - /url: https://www.makao.co.tz/
                  - text: ", which curates gorgeous handcrafted furniture and home decor, to Opuk Lounge, which makes delicious boxed-picnic lunches for conservation-focused safari outings with"
                  - link "The Wild Source" [ref=e328] [cursor=pointer]:
                    - /url: https://thewildsource.com
                  - text: ". Sports enthusiasts, take note: The 30,000-seat Samia Suluhu Hassan soccer stadium in Arusha’s Olomoti region will open in the summer of 2026, primed to host the 2027"
                  - link "Africa Cup of Nations" [ref=e329] [cursor=pointer]:
