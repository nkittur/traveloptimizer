                  - text: can assist with all in-country arrangements. While occurring year-round, gorilla trekking is best in the rainy seasons (February through April and October through November), when it’s also a good time to see wildlife on the beaches and to fish. The long dry season (May through September) generally affords easiest access for hiking and campouts), great bird-watching, and viewing the humpback whale migration, but there are fewer animals on the beach. The short dry season (December through January) enjoys clearer weather, wildlife on the beach, and nesting turtles. —
