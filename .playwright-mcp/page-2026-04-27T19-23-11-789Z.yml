                  - emphasis [ref=e1197]:
                    - text: Read our complete guide to the
                    - link "Best Places to Go in Europe in 2026" [ref=e1198] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/story/the-best-places-to-go-in-europe-in-2026
                    - text: .
