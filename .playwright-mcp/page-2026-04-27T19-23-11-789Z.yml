                  - paragraph [ref=e313]: Sitting at the edge of a vast swath of jungle, the city of Arusha is embracing its surrounding nature with a slate of new forest hotels and a primatology center dedicated to the late Dr. Jane Goodall.
                  - generic [ref=e314]: Entara’s Koroi Forest Camp
              - generic [ref=e321]:
                - paragraph [ref=e322]:
                  - text: Rumors of the late primatologist Jane Goodall’s new museum in the city of
                  - link "Arusha" [ref=e323] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/story/iconic-itineraries-tanzania
                  - text: have circulated for months—and now, finally, they’re confirmed.
                  - 'link "Dr. Jane''s Dream: The Goodall Centre for Hope" [ref=e324] [cursor=pointer]':
                    - /url: https://janesdream.org
                  - text: will open in late October 2026, next to the centrally located Arusha Cultural Heritage Center. Created by a team of designers who include an alumnus of
                  - link "Disney’s Animal Kingdom" [ref=e325] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/hotels/united-states/united-states/kissimmee/disney-s-animal-kingdom-lodge-buena-vista
