                  - text: —underscoring the project’s ambition to become a culinary city within the city. The exact opening date has yet to be confirmed, with timelines that range from March to April 2026. But when Wake does open, it’ll be hard to miss. Chefs here are proving Colombian food can be as inventive and layered as the country itself.
