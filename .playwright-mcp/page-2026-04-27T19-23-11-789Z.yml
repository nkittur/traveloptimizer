                - heading "Upper Carniola (Gorenjska), Slovenia" [level=2] [ref=e1557]
                - paragraph [ref=e1559]:
                  - emphasis [ref=e1560]:
                    - strong [ref=e1561]: "Go for:"
                    - text: fairy-tale villages and breathtaking lakes
              - figure [ref=e1565]:
                - generic [ref=e1568]:
                  - img "Muzej Lah"
                - generic [ref=e1569]:
                  - paragraph [ref=e1571]: Slovenia is known as a more relaxed yet equally gorgeous alternative to its alpine neighbors—with a new digital nomad visa program coming this year, it's the perfect time to take advantage of its incredible adventure opportunities and uniquely Central European culture.
                  - generic [ref=e1572]: Jošt Gantar/Muzej Lah
              - generic [ref=e1579]:
                - paragraph [ref=e1580]:
                  - text: Tucked between
                  - link "Austria" [ref=e1581] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/story/vienna-austria-timeless-capital-looking-toward-the-future
                  - text: and
                  - link "northern Italy" [ref=e1582] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/story/on-a-trip-across-northern-italy-getting-to-know-the-artisans-keeping-tradition-alive
                  - text: ", Slovenia’s Upper Carniola region (also known as Gorenjska, meaning “highlands”) is a gem hiding in plain sight. About a tenth of the size of Tuscany, this northwest corner packs a stunning lineup: Julian Alps, Lake Bled, Triglav National Park, and a sprinkling of villages plucked straight from a fairy tale."
                - paragraph [ref=e1583]:
                  - text: "While neighboring Italy braces for shoulder-to-shoulder crowds at the Milano Cortina Olympic Winter Games, Upper Carniola’s appeal is its breathing room. Don’t expect complete silence though: 2026 is shaping up to be its breakout year. A new"
                  - link "digital nomad visa" [ref=e1584] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/gallery/countries-with-digital-nomad-visas-1
                  - text: is being rolled out, perfectly timed with a wave of cultural and hospitality openings—a cue that the country is ready for its close-up.
                - paragraph [ref=e1585]:
                  - text: Summer 2026 will see Upper Carniola emerge as a destination for contemporary art lovers with the grand opening of
                  - link "Muzej Lah" [ref=e1586] [cursor=pointer]:
                    - /url: https://muzejlah.com/
                  - text: —showcasing over 800 European works lovingly collected over three decades by Igor and Mojca Lah—on the scenic slopes of Bled Castle. For wellness seekers,
                  - link "Kneipp NaturHotel Snovik" [ref=e1587] [cursor=pointer]:
                    - /url: https://www.terme-snovik.si/en/accommodation/kneipp_naturhotel
                  - text: ", after a 22 million euro ($25.5 million) investment, will debut in June 2026 on the region’s outskirts, becoming Slovenia’s highest-altitude thermal spa hotel. Wellness here is rooted in tradition (see Sebastian Kneipp’s five pillars of holistic living), but with a contemporary twist."
                - paragraph [ref=e1588]:
                  - text: Intimate, guesthouse-style hotels are quietly flourishing in the Julian Alps, such as five-suite
                  - link "Chalet Sofija" [ref=e1589] [cursor=pointer]:
                    - /url: https://cna.st/affiliate-
                  - text: ", where warm hospitality, sweeping views and serious culinary chops converge. It’s no surprise, then, that nine Slovenian restaurants earned Michelin stars in 2025. Regional staple"
                  - link "Hiša Franko" [ref=e1590] [cursor=pointer]:
                    - /url: https://www.hisafranko.com/en/
                  - text: retained its coveted three stars and Green Star for sustainability, cementing Ana Roš as one of two female chefs worldwide with that distinction. Meanwhile, history buffs shouldn’t miss the return of the Unesco-listed Passion Play to Škofja Loka’s cobblestone streets after a six-year pause, with 900 locals reviving one of Europe’s oldest Baroque-era plays.
                - paragraph [ref=e1591]:
                  - strong [ref=e1592]: "How to plan it:"
                  - text: "Upper Carniola shines year-round: snowy winters for skiing, balmy spring and summer for hikes and lake dips, but late summer through autumn proves most rewarding with fewer tourists, golden foliage, and visits to the new Muzej Lah. Fly into Ljubljana (nonstop from London, Zurich, Paris, Munich, and Frankfurt), then train to Jesenice, Kranj, or Radovljica. A rental car is recommended for exploring remote villages and alpine passes, as buses run less frequently during the off-season. —"
                  - link "Laura Zhang" [ref=e1593] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/contributors/laura-zhang4
                    - emphasis [ref=e1594]: Laura Zhang
                - link "Book a stay at Chalet Sofija" [ref=e1596] [cursor=pointer]:
                  - /url: https://cna.st/affiliate-
                  - generic [ref=e1597]: Book a stay at Chalet Sofija
                - paragraph [ref=e1598]:
                  - emphasis [ref=e1599]:
                    - text: Read our complete guide to the
                    - link "Best Places to Go in Europe in 2026" [ref=e1600] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/story/the-best-places-to-go-in-europe-in-2026
                    - text: .
                - heading "Victoria Falls, Zimbabwe" [level=2] [ref=e1602]
                - paragraph [ref=e1604]:
                  - emphasis [ref=e1605]:
                    - strong [ref=e1606]: "Go for:"
                    - text: a slew of new hotels offering fresh vantage points to experience the iconic falls and Africa’s adventure capital
              - figure [ref=e1610]:
                - generic [ref=e1613]:
                  - img "Samanzi"
                - generic [ref=e1614]:
                  - paragraph [ref=e1616]: Victoria falls are among the world's largest and most exhilarating to witness—so much so that you might forget about the incredible array of luxury hotels that surround them. But rest assured, thanks to a packed schedule of openings this year, there are more than ever.
                  - generic [ref=e1617]: Samanzi/James Salim
              - generic [ref=e1624]:
                - paragraph [ref=e1625]:
                  - text: Long celebrated for the Mosi-oa-Tunya—“the smoke that thunders”—the city of
                  - link "Victoria Falls" [ref=e1626] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/hotels/zimbabwe/victoria-falls/victoria-falls-hotel-victoria-falls
                  - text: is reinventing itself as one of southern Africa’s most exciting destinations in 2026. Travelers come not just to behold the falls but for the adventure, culture, and conservation experiences. And a spate of new hotels have arrived to meet the demand, including Anantara’s first Zimbabwean property, the plush
                  - link "Stanley & Livingstone Victoria Falls" [ref=e1627] [cursor=pointer]:
                    - /url: https://cna.st/affiliate-
                  - text: ", which debuted last December; adventure operator"
                  - link "Wild Horizons’ Waterfalls Lodge" [ref=e1628] [cursor=pointer]:
                    - /url: https://wildhorizons.co.za/waterfalls-lodge/
                  - text: ", which followed in July; and"
                  - link "Samanzi Luxury Cabanas" [ref=e1629] [cursor=pointer]:
                    - /url: https://cna.st/affiliate-
                  - text: ", a boutique retreat that opened in August with intimate cabanas and tranquil pools. This past June the"
                  - link "Palm River Hotel" [ref=e1630] [cursor=pointer]:
                    - /url: https://cna.st/affiliate-
                  - text: unveiled a stunning new riverside deck that overlooks the Zambezi, offering scenic dining experiences and a beautifully curated high tea. Looking ahead,
                  - link "Bupenyu Lodge" [ref=e1631] [cursor=pointer]:
                    - /url: https://newmarkhotels.com/accommodation/bupenyu-lodge?gad_source=1&gad_campaignid=22752802527&gbraid=0AAAAACs5qILM1ElAXA9sWrmJW1zlkawtE&gclid=Cj0KCQjw6bfHBhDNARIsAIGsqLgLTbfUO2SFWFZ0U16R0t3LwbhynmMwn9kLhUZ53mBjV4_ZuPCkH8QaAq74EALw_wcB#
                  - text: by Newmark Hotels & Reserves (opening at the end of 2025) and the
                  - link "House of Chinhara–Vignette Collection" [ref=e1632] [cursor=pointer]:
                    - /url: https://www.houseofchinhara-invest.com/
                  - text: (opening in January 2026) promise ultra-luxury options that will transform the region from a stopover to a destination in its own right. In addition, the new
                  - link "Mpala Jena Private Villas" [ref=e1633] [cursor=pointer]:
                    - /url: https://greatplainsconservation.com/mpala-jena-private-villas/
                  - text: ", set on the sandy banks of the Zambezi, offers a secluded and fully powered three-suite sanctuary with private pools, riverfront suites, personalized butler and guide services, and easy access to the falls by road or boat. Infrastructure is also keeping pace with this growth as the Bulawayo-Victoria Falls highway is under rehabilitation, Fastjet has just launched the new Bulawayo-Victoria Falls route, and the construction of the Mosi-oa-Tunya International Cricket Stadium, poised to host the 2026 ICC under-19 World Cup, is underway."
                - paragraph [ref=e1634]:
                  - strong [ref=e1635]: "How to plan it:"
                  - text: Most travelers love to visit in June through August, when the waterfalls have clear views, but October and November are the best time for white water rafting, as the water levels in Zimbabwe are at their lowest. While there are no direct flights from the US, travelers can arrive via major international hubs like Cape Town, Johannesburg, Nairobi, and Addis Ababa using Kenya Airways, Ethiopian Airlines, South African Airways, Airlink, or FlySafair. —
                  - link "Harriet Akinyi" [ref=e1636] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/contributor/harriet-akinyi
                    - emphasis [ref=e1637]: Harriet Akinyi
                - generic [ref=e1638]:
                  - link "Book a stay at the Stanley & Livingstone Victoria Falls" [ref=e1639] [cursor=pointer]:
                    - /url: https://cna.st/affiliate-
                    - generic [ref=e1640]: Book a stay at the Stanley & Livingstone Victoria Falls
                  - link "Book a stay at Mpala Jena Camp" [ref=e1641] [cursor=pointer]:
