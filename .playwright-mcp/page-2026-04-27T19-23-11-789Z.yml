                      - generic [ref=e280]:
                        - generic:
                          - paragraph [ref=e281]: Consider our list of The 26 Best Places to Go in 2026 your jumping off point for a full network of intel. To start? Read through and see why destinations get under your skin, in that exciting, can't-stop-thinking-about-you kind of way.
                          - paragraph [ref=e282]: At the end of each entry on this page, you'll find a section titled “How to Plan It" which will give you pointers on the best time to visit each place, where to stay, or even tour operators who can create an unforgettable itinerary for experiencing the destination. We even mention new airports, airline routes, cruise itineraries, and more, for easy booking. If there is anything new and forthcoming that you are eager to experience, pay attention to the opening dates we've included, so you can book a trip once said hotel or attraction has opened (but be prepared for potential delays, as is always possible with splashy launches). In rare cases where opening dates aren't confirmed, consider planning a trip for later in the year (though in every destination, we can promise there are multiple reasons to visit).
                          - paragraph [ref=e283]:
                            - text: "And, because we know many of you like to plan multi-trip stops, we suggest reading our expanded continent lists, which are linked under each destination. For example: If you're intrigued by Arusha, Tanzania, featured below, follow the link at the end of the writeup to our longer list of"
                            - link "The Best Places to Go in Africa in 2026" [ref=e284] [cursor=pointer]:
                              - /url: https://www.cntraveler.com/story/best-places-to-go-in-africa-2026
                            - text: ", which has an extended guide to 10 destinations across the continent. If you're looking for even more inspiration, consider revisiting our list of"
                            - link "The 25 Best Places to Visit in 2025" [ref=e285] [cursor=pointer]:
                              - /url: https://www.cntraveler.com/story/best-places-to-go-in-2025
                            - text: or years prior. And most importantly, keep an eye on our social feeds, where we will be sharing photo and video dispatches from our editors' travels to these destinations, to further inspire your own.
