                  - img "Tawa Refugio del Puelo"
                - generic [ref=e995]:
                  - paragraph [ref=e997]: As if Patagonia weren't already remote and rugged enough, a slate of new adventure lodges and boutique properties are making the region's isolated north one of the most exciting outdoor destinations of the year.
                  - generic [ref=e998]: Tawa Refugio del Puelo/NBG Photo
              - paragraph [ref=e1003]:
                - text: The skyscraping spires of
                - link "Torres del Paine National Park" [ref=e1004] [cursor=pointer]:
                  - /url: https://www.cntraveler.com/story/iconic-itineraries-chile
                - text: ", at the southern tip of South America, carry legendary status among global adventurers, but for those seeking less-trodden trails, the greener wildlands of Northern Patagonia in Chile remain blessedly unexplored. The newest reason to visit?"
                - link "Reñihué" [ref=e1005] [cursor=pointer]:
                  - /url: https://renihue.com/stay-here/
                - text: ", a vast fjord-side sanctuary set amid turquoise rivers, craggy peaks, and misty rainforest trampled by kodkods (the continent’s tiniest wildcats) and pudus (the world’s smallest deer). American conservationists Doug and Kris Tompkins started their pioneering work—which resulted in the creation and expansion of 15 national parks across Chile and Argentina—with a 1,750-acre land purchase in this valley. Fellow American Charlie Clark later acquired the property, launched the Reñihué Nature Conservancy Foundation, and, over the past year, turned the wood-shingled Tompkins home into a bookable four-room lodge overlooking the glaciated Michinmahuida Volcano."
              - generic [ref=e1012]:
                - paragraph [ref=e1013]:
                  - text: The Reñihué opening arrives amid a flurry of regional conservation wins since 2024, when local activists saved the so-called Yosemite of South America from property developers, protecting its granite domes (beloved by rock climbers) in the new Cochamó Valley Nature Sanctuary. The nearby Puelo and Futaleufú Rivers are set to become the first two protected waterways in Patagonia in early 2026, which will safeguard these milky-teal icons (revered by whitewater rafters) from energy exploitation. Meanwhile, thrill-seekers can rest their weary bones at the Ritual Patagónico Spa opening this austral summer at the lush
                  - link "Termas del Sol" [ref=e1014] [cursor=pointer]:
                    - /url: https://termasdelsol.com/
                  - text: hot springs complex; it’s right by the Puelo River and near the striking eight-room adventure lodge
                  - link "Tawa Refugio del Puelo" [ref=e1015] [cursor=pointer]:
                    - /url: https://tawarefugio.cl/
                  - text: ", which opened in 2023."
                - paragraph [ref=e1016]:
                  - strong [ref=e1017]: "How to plan it:"
                  - text: Fly into Chile’s capital of Santiago, then hop on a two-hour flight to El Tepual International Airport, near Puerto Varas, the gateway to Northern Chilean Patagonia. Get your bearings at the Brutalist-inspired lakeside retreat
                  - link "Hotel AWA" [ref=e1018] [cursor=pointer]:
                    - /url: https://cna.st/affiliate-link/XtSR1GXKWeHnfkbUf5GFkKQwevTqBPW6JL2P3tVX9NMsLBrnRQEZd4PVU6p41rrKMFHhiw9V1MPrdgoohFNDaFdCadikai4jCSjfgCfRKWXvfVhF7BuHTx11zuY4BP5H9N85kXfNSUeuTXdWAybknU3Hwgk2DhAaCiS6i7iS4k2G2qbDAGEfjp3qZVx4JwYiqA9CEKHjnwn2NzodcTi6ufiAMrzxL9i56uE6a5SWe9t3EzP5MKX79UuNWTLBSgogxzudcSuPg2YWtZdTH9G44rCzttCTRrrJrHBT
                  - text: ", before continuing south to Cochamó, Puelo, Reñihué, or Futaleufú via winding roads and fjord-crossing ferries."
                  - link "Birds Chile" [ref=e1019] [cursor=pointer]:
                    - /url: https://www.birdschile.com/
                  - text: specializes in high-end adventure- and conservation-themed tours to this region;
                  - link "Plan South America" [ref=e1020] [cursor=pointer]:
                    - /url: https://www.plansouthamerica.com/
                  - text: (a
