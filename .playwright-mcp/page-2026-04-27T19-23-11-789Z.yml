                - heading "Prince Edward County, Canada" [level=2] [ref=e1255]
                - paragraph [ref=e1257]:
                  - emphasis [ref=e1258]:
                    - strong [ref=e1259]: "Go for:"
                    - text: a newer wine region with an old soul
              - figure [ref=e1263]:
                - generic [ref=e1266]:
                  - img "The Royal"
                - generic [ref=e1267]:
                  - paragraph [ref=e1269]: Prince Edward County is establishing itself as Canada's premier wine destination, and restauranteurs and hoteliers are capitalizing on the buzz this year with a stacked calendar of openings.
                  - generic [ref=e1270]: Graydon Herriott/The Royal
              - generic [ref=e1277]:
                - paragraph [ref=e1278]:
                  - link "Prince Edward County" [ref=e1279] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/story/prince-edward-county-ontario-best-things-to-do
                  - text: —or PEC—is already a favorite long-weekend destination for many Canadians, especially those from
                  - link "Toronto" [ref=e1280] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/destinations/toronto
                  - text: and
                  - link "Montreal" [ref=e1281] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/destinations/montreal
                  - text: (it’s only a few hours drive from each). The region has been coming into its own for the past decade as a hot spot for boutique hotels, small family-run wineries, and world-class restaurants, but there’s plenty more to come. The region is eagerly awaiting the arrival of the new hotel, The
                  - link "Claramount Club" [ref=e1282] [cursor=pointer]:
                    - /url: https://www.claramountclub.ca/
                  - text: ", which will have two new restaurants as well. Meanwhile, the stylish lakeside escape"
                  - link "Wander the Resort" [ref=e1283] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/hotels/bloomfield/wander-the-resort
                  - text: expanded its experiences focused on local food and outdoor recreation and opened a lakefront Nordic spa.
                  - link "Happy Sailing" [ref=e1284] [cursor=pointer]:
                    - /url: https://www.happysailing.ca/
                  - text: started to offer sailing lessons along PEC’s curving shoreline, and
                  - link "Charlie" [ref=e1285] [cursor=pointer]:
                    - /url: https://www.charlieconsecon.com/
                  - text: ", a playful neighborhood bistro in Consecon, is already pulling in the crowds."
                - paragraph [ref=e1286]:
                  - text: A lot of what’s new is centered in the quaint town of Picton, which has been transformed over the last few years by hotels including
                  - link "The Royal" [ref=e1287] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/hotels/picton/the-royal-hotel
                  - text: . It’s become a community hub of sorts, drawing locals and travelers alike, and has been joined by excellent dining establishments like farm-to-table wine bar
                  - link "Theia" [ref=e1288] [cursor=pointer]:
                    - /url: https://www.wearetheia.ca/
                  - text: and Spanish restaurant
                  - link "Bocado" [ref=e1289] [cursor=pointer]:
                    - /url: https://bocadorestaurant.ca/picton/
                  - text: . But don’t be afraid to venture out of town to explore the county’s food scene—PEC is now a mecca for exciting young chefs who are opening their own spots with a local focus. Top tables include
                  - link "Darlings" [ref=e1290] [cursor=pointer]:
                    - /url: https://www.darlingspizza.ca/
                  - text: ","
                  - link "Stella’s Eatery" [ref=e1291] [cursor=pointer]:
                    - /url: https://www.stellaseatery.com/
                  - text: ", and"
                  - link "La Condesa" [ref=e1292] [cursor=pointer]:
                    - /url: https://www.lacondesarestaurant.com/
                  - text: ", all of which rival anything you’ll find in major tourist centers. If wine tourism is of interest, be sure to explore vineyards like"
                  - link "Traynor" [ref=e1293] [cursor=pointer]:
                    - /url: https://traynorvineyard.com/
                  - text: ","
                  - link "Closson Chase" [ref=e1294] [cursor=pointer]:
                    - /url: https://www.clossonchase.com/
                  - text: and
                  - link "Hinterland" [ref=e1295] [cursor=pointer]:
                    - /url: https://www.hinterlandwine.com/
                  - text: Wine Company. PEC may be one of Canada's youngest wine regions, but you’ll find elegant reds, crisp whites, and sparkling pét-nats thanks to its unique terroir and crisp, cool climate.
                - paragraph [ref=e1296]: When it comes to Prince Edward County, 2026 is when the world will catch up on what Canadians have known for years.
                - paragraph [ref=e1297]:
                  - strong [ref=e1298]: "How to plan it:"
                  - text: Prince Edward County is equally great in all four seasons, but it tends to be more popular among travelers in the summer, early fall, and the festive season. However, every time of year draws a different kind of traveler. In warmer months people flock to the beaches of Sandbanks Provincial Park for swimming and sailing; in winter it’s for cross-country skiing and snowshoeing. The spring and fall are great for wine tourism and thinner crowds. The County, as locals call it, is an easy drive from Toronto and Montreal and can be easily added to as a midpoint trip between the cities. It’s approximately a 2.5-hour drive from Toronto and 3.5 hours from Montreal. The best option is to fly into one hub and out the other—and plan to rent a car to get you around. In addition to the hotels mentioned above, check out the
                  - link "June Motel" [ref=e1299] [cursor=pointer]:
                    - /url: https://cna.st/affiliate-
                  - text: ","
                  - link "Drake Devonshire" [ref=e1300] [cursor=pointer]:
                    - /url: https://cna.st/affiliate-
                  - text: ","
                  - link "Mirazule" [ref=e1301] [cursor=pointer]:
                    - /url: https://mirazule.com
                  - text: ", or one of many charming"
                  - link "bed-and-breakfasts" [ref=e1302] [cursor=pointer]:
                    - /url: https://visitthecounty.com/staying-in-prince-edward-county-ontario
                  - text: in the region. —
