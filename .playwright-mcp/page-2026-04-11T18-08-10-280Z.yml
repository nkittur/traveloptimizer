                        - heading "Volta" [level=3] [ref=e1179]:
                          - paragraph [ref=e1180]: Volta
                      - paragraph [ref=e1183]: "Volta created quite a buzz when it opened last year in Barcelona’s food-loving neighborhood of El Born. And rightly so. The setting is the verdant, plant-filled ground floor of the equally cool Borneta boutique hotel, set beneath the iconic 19th-century arches of Passeig de Picasso. Volta isn’t just a restaurant but also a gorgeous cocktail bar, serving drinks inspired by Mediterranean aperitivo culture and full of fresh local ingredients. Like the cooling non-alcoholic Ginger Xarrup, made with ginger and cucumber cordial, mint, and elderflower soda. You can tell when a person really loves what they do, and just one glance at Italian chef Andrea de Benedictis’ eyes will convey his passion for this new project. It's all good, but the Italian dishes are where you’ll want to focus for a taste of the chef’s home-cooked recipes: perfectly prepared tagliolini with mussels, lemon and leek, hearty Ossobuco with bone marrow and celeriac, refreshing sea bass tartare with cucumber, avocado, capers, and beetroot."
                      - link "Read Full Review" [ref=e1184] [cursor=pointer]:
