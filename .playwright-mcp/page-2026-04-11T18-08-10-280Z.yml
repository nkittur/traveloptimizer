                        - heading "La Dama" [level=3] [ref=e3418]:
                          - paragraph [ref=e3419]: La Dama
                      - paragraph [ref=e3422]: This classic Barcelona restaurant has gone from strength to strength. And while it may have started out mainly making all sorts of waves for its impressive interior design (and less so for its food) back in 2017 when it reopened, the kitchen has positioned itself firmly as one of the top restaurants in Barcelona. The menu is as lavish as befits the location, with dishes like Tarragon oysters drizzled with shallot and white wine vinegar dressing, and duck magret cooked Wellington-style in puff pastry with black truffle and mushrooms. The dish you won’t want to miss is the squid carbonara, with squid cut in strips like tagliatelle, and a texture so satisfying you’ll be smacking your lips long after it has been devoured. If it’s that kind of night when everything just needs to be perfect, steer your way over to La Dama.
                      - link "Read Full Review" [ref=e3423] [cursor=pointer]:
                        - /url: https://www.cntraveler.com/restaurants/barcelona/la-dama
