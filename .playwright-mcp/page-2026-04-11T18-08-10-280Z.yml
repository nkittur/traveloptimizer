                        - heading "Suru Bar" [level=3] [ref=e3435]:
                          - paragraph [ref=e3436]: Suru Bar
                      - paragraph [ref=e3439]: The result is an unorthodox Catalan-Japanese fusion packed with exciting flavors and weird and wonderful raw materials–think yakitoris loaded up with chicken hearts, or chicken skin or veal tongue with piparra peppers and ravigotte vinaigrette-mostly prepared on the robata grill. Even if tongue and heart aren’t your jam, there’s still plenty to snack on, from grilled white asparagus or Maresme peas (depending on the season) with a delicate Basque-style cod pil-pil and Suru's showstopper, the yakitori of crisp chicken skin topped with buttery shrimp tartare.
                      - link "Read Full Review" [ref=e3440] [cursor=pointer]:
                        - /url: https://www.cntraveler.com/restaurants/barcelona/suru-bar
