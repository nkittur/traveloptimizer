                      - link "Casa Maians" [ref=e3248] [cursor=pointer]:
                        - /url: https://www.cntraveler.com/restaurants/barcelona/casa-maians
                        - heading "Casa Maians" [level=3] [ref=e3249]:
                          - paragraph [ref=e3250]: Casa Maians
                      - paragraph [ref=e3253]: With only 10-or-so tables, you may be wondering if you've accidentally walked into someone's living room but this is, in fact, the entirety of the restaurant. The living-room vibe is heightened by the warm service—that and the fact that all the people in here seem to know each other. If you don’t have a Catalan grandma, you probably haven’t tried Catalan grandma food, but Casa Maians is here to let you know what you’ve been missing. This is the kind of food that is full of earthy ingredients that taste like they've just arrived from a farm down the road. We’re talking oil and garlic dribbling down your chin as you down baby scallops and razor clams straight off the shell, and hearty pans of rice, overflowing with beef cheeks, foie gras, and artichokes. Get anything you want—it's all good—but make sure your order features one of the rice dishes from the blackboard of daily specials.
                      - link "Read Full Review" [ref=e3254] [cursor=pointer]:
                        - /url: https://www.cntraveler.com/restaurants/barcelona/casa-maians
