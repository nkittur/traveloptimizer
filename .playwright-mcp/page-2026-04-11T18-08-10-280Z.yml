                        - heading "Aleia" [level=3] [ref=e1609]:
                          - paragraph [ref=e1610]: Aleia
                      - paragraph [ref=e1613]: A great option for indecisive diners, Aleia offers one tasting menu, that's it. It costs €187. There are two pairings to go with it, alcoholic priced at €108, non-alcoholic for €78. From scallop in cava with soubise, or French onion sauce, to the decadent grilled crayfish in a sherry beurre blanc with crayfish head “air”, or the Iberian “flan”—like a dessert but with the flavor of the finest Iberico pork—with chantarelles, melon and smoked eel —that sounds like it shouldn’t work but totally does, everything is perfect. Even the desserts (like the astonishing peach topped with caviar and burned cream) are refreshing and leave you feeling not-too full (quite a feat after 13 courses). Few spaces in Barcelona are more elegant or romantic than Aleia. Better still, the food more than lives up to the hype.
                      - link "Read Full Review" [ref=e1614] [cursor=pointer]:
