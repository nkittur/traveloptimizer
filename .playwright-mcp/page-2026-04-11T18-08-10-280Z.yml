                        - heading "Fronda Pasaje" [level=3] [ref=e733]:
                          - paragraph [ref=e734]: Fronda Pasaje
                      - paragraph [ref=e737]: This is the perfect spot for a romantic vegetarian (or pescatarian) date. The tasting menu is full of unexpected flavors and textures, like the crispy enoki mushroom that looks like a red coral, served on cream of white beans with Mediterranean herbs, or the fat, delightfully chewy potato noodles served in a thick and spicy sweet potato and peanut broth. But the star of the show is the watermelon sashimi, served with lacto-fermented tomatoes, ijikis algae, and caramelized wasabi almonds. The watermelon is fermented, dehydrated, rehydrated in a seaweed broth, and pan-fried at low heat to give it the flavor, texture, and appearance of red tuna but with all the freshness of a watermelon. The tasting menu (five dishes for 50 euros, or around $57, or six for 65 euros, or around $75) is the way to go if you want the full Fronda Pasaje experience, or you can keep things simple and order à la carte.
                      - link "Read Full Review" [ref=e738] [cursor=pointer]:
                        - /url: https://www.cntraveler.com/restaurants/barcelona/fronda-pasaje
