                      - paragraph [ref=e2014]: The bright-white dining room has a distinct air of sophistication. Everything is impeccable, from the pristine white tablecloths, to the spacious table setup and the staff in their immaculate uniforms. Chef Paco Pérez is an El Bulli alum, one who took off from the Adrià universe and went off earn six Michelin stars in his own right. His love of “mar i muntanya” (Catalan for surf ‘n’ turf) is present in so many of his dishes, which include some delightfully unorthodox blends like, say, cuttlefish and truffle, or crab and mushroom, or elaborate dishes like naked sea cucumbers with pil-pil sauce, veal trotters, and wild mushrooms.
                      - link "Read Full Review" [ref=e2015] [cursor=pointer]:
