                        - heading "Suculent" [level=3] [ref=e2654]:
                          - paragraph [ref=e2655]: Suculent
                      - paragraph [ref=e2658]: Suculent wouldn't strike you as a gastronomic temple from the outside, however, the inside is rustic-chic, with wooden tables and wicker chairs. Books, plants, and jars fill the shelves that line the walls, creating a homey feel. Chef Toni Romero isn't afraid to push the boundaries. His dishes are unconventional, creative, and utterly decadent, so leave the diet at the door and prepare to indulge your inner gourmand. Adventurous eaters will be blown away by combinations like steak tartare served on grilled bone marrow, or the confit duck croquette that might just be the best croquette in town, while those of a more squeamish disposition might baulk at the sight of the glazed cockerel's crest sliced up “cap i pota”-style in an offal-based meat stew.
                      - link "Read Full Review" [ref=e2659] [cursor=pointer]:
