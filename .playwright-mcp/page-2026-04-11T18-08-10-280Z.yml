                        - heading "Sartoria Panatieri" [level=3] [ref=e949]:
                          - paragraph [ref=e950]: Sartoria Panatieri
                      - paragraph [ref=e953]: "Who doesn't love a converted industrial space turned into one of the of the hottest food spots in town? The space is hip, pared back, and packed to the brim with bearded, alt cool types wearing vintage loafers. Every night. There's red sauce, and there's red sauce. The one that sits victoriously atop Rafa Panatieri's award-winning Margarita is like a slow-cooked, warm, sweet, and savory taste explosion that fills your mouth with all the flavors of the Mediterranean: tomato, basil, garlic, olive oil, and sunshine. No wonder so many patrons come here just to order the often-maligned simplest pizza of all. Of course, there is more to the menu, with plenty to get your saliva flowing even if you prefer to spend your time at the wacky end of the pizza spectrum: like the cream of Padrón pepper, chistorra sausage, fried Padrón peppers, and smoked mozzarella pizza, or how about a pizza topped with applesauce, blue cheese, sweet and sour celery, caramelized almonds, freeze-dried apple, and mozzarella?"
