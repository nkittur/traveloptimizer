                        - heading "Terraza Martinez" [level=3] [ref=e1128]:
                          - paragraph [ref=e1129]: Terraza Martinez
                      - paragraph [ref=e1132]: "Barcelona’s favorite hilltop paella joint may have been around for a decade, but the years have been kind to Terraza Martinez. Popular as ever with rice and seafood enthusiasts, people come here to escape the menu-pushed-in-your-face approach of some of the beachfront establishments. We’d recommend one of the local specialties: the fideuà, where short vermicelli noodles replace the rice, or anything served in a “señorito” (gentleman's) version, meaning all the shellfish has been peeled for you (hooray!). The rice with lobster is made “socarrat”-style, meaning it has plenty of the toasty, caramelized edges around the paella dish, which locals will tell you is the most delicious part. And they’re not wrong. Come for a late lunch with all your friends, order all the rice and all the wine—and then more wine—and don't leave until the sun sets."
                      - link "Read Full Review" [ref=e1133] [cursor=pointer]:
                        - /url: https://www.cntraveler.com/restaurants/barcelona/terraza-martinez
