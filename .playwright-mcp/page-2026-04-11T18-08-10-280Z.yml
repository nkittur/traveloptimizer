                      - link "Jiribilla" [ref=e604] [cursor=pointer]:
                        - /url: https://www.cntraveler.com/restaurants/barcelona/jiribilla
                        - heading "Jiribilla" [level=3] [ref=e605]:
                          - paragraph [ref=e606]: Jiribilla
                      - paragraph [ref=e609]: "Walking past Jiribilla, set in a leafy, semi-pedestrianized street just across from the newly renovated Sant Antoni market, you can't help but gaze through the windows. A beautiful, warm light beckons you into the restaurant with its giant open kitchen and homey wood and wicker furniture. Catalan-born Gerard Bellver moved to Mexico at the age of 12 and learned to cook there before going on to work in fine-dining establishments in both Mexico and Spain (including the legendary El Bulli). Jiribilla is a reflection of the chef's love for his two home countries. Most dishes are a blend of seasonal Catalan ingredients and Mexican flavors. Tacos feature the soft shell crab with avocado and smoky chintextle—the one to home in—but the real stars are the classic Mexican-ized Catalan or Catalan-ized Mexican dishes: traditional Catalan lentil stew made with marinated chili and a shrimp head reduction, or the green mole made from Catalan herbs served with juicy grilled turbot."
                      - link "Read Full Review" [ref=e610] [cursor=pointer]:
                        - /url: https://www.cntraveler.com/restaurants/barcelona/jiribilla
