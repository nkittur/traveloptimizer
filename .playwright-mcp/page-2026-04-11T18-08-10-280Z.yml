                        - heading "Bar Cañete" [level=3] [ref=e1560]:
                          - paragraph [ref=e1561]: Bar Cañete
                      - paragraph [ref=e1564]: "This classic spot takes you right back to the days before dim lighting and mood music became the new normal. Bar Cañete is hectic, loud, bright, and always packed to the rafters with hungry people. If you’re going to have only one tapas dinner while in Barcelona, have it at Bar Cañete. Many of the dishes are the same as in other places, but you will struggle to find ingredients this fresh anywhere else. A shamelessly gluttonous feast for two might include some or all of the following: oysters, razor clams, tuna tartare, burrata with tomatoes and pesto, Galician baby scallops, stewed Santa Pau beans with baby squid, and grilled Iberian pork loin. If somehow you have room for dessert after all that, try the region's best traditional dessert, crema catalana."
                      - link "Read Full Review" [ref=e1565] [cursor=pointer]:
                        - /url: https://www.cntraveler.com/restaurants/barcelona/bar-canete
