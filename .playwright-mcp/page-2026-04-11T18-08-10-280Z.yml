                        - heading "Amar" [level=3] [ref=e2723]:
                          - paragraph [ref=e2724]: Amar
                      - paragraph [ref=e2727]: It will come as no surprise that a restaurant inside El Palace Barcelona, arguably the city’s most opulent luxury hotel, has a certain wow factor, but the splendor of Amar is other level. If seafood was a religion, Amar would be its mecca. The Bulli-style crayfish carpaccio and lobster “trikini”—or grilled sandwich of salmon, lobster, and caviar—are just decadent as they sound, while the caviar-topped brioche has been known to bring a tear to a grown man’s eye. Amar may look intimidating but we are is still in laid-back Barcelona so there is nothing pompous about the service. Amar means to love, and we suspect you may fall head over heels for the capable team here who are on hand to make all your crustacean desires come true.
