                              - paragraph [ref=e287]: Agreste Mar
                          - paragraph [ref=e290]: The new lobby restaurant of the oh-so-elegant Serras Barcelona is cool and stylish. Sit facing either the kitchen or the massive, floor-to-ceiling windows overlooking the Gothic Quarter outside. The starters are fresh and vegetable-forward; think Puglian tomato tartare with capers or little gem lettuce with butifarra sausage and langoustine, but the pasta dishes are where these Milanese chef's considerable skills really shine. The artisanal egg tagliarini topped with a perfectly tender crayfish and the Cappelletti stuffed with 24-month aged parmesan, butter, and sage—that popped satisfyingly in our mouths— are the reason we will be coming back. For dessert, it's the warm, whisky-infused tiramisu for the win. Agreste Mar is the kind of spot we'd cross the city to go to. Luckily it's slap-bang in the Gothic Quarter, just across the road from Port Vell (the old port), so we don't have to.
