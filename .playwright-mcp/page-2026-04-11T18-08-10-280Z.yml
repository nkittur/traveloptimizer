                      - link "Akiro Hand Roll Bar" [ref=e404] [cursor=pointer]:
                        - /url: https://www.cntraveler.com/restaurants/barcelona/akiro-hand-roll-bar
                        - heading "Akiro Hand Roll Bar" [level=3] [ref=e405]:
                          - paragraph [ref=e406]: Akiro Hand Roll Bar
                      - paragraph [ref=e409]: "Akiro doesn't take bookings and most evenings, there is a substantial line outside. Once you're in though, it's all elegant Japanese minimalism: light-wood paneling and good lighting, while diners sit in an orderly line along the bar and at the windows. Akiro is a restaurant specializing in Nikkei-style hand rolls, but with nigiris and sashimis that give them a run for their money. Nikkei food may be all the rage, but some people find the elaborate blends of rich mayos and tropical fruit overpowering, preferring instead to take a more purist approach to their sushi-eating. Most places cater to one of the other, but Akiro has both ends of the spectrum covered, from the perfect simplicity of the tuna toro sashimi to the unabashed decadence of the flambéed eel nigiri topped with ginger jam, molasses, and salted rocoto-chili chocolate."
                      - link "Read Full Review" [ref=e410] [cursor=pointer]:
                        - /url: https://www.cntraveler.com/restaurants/barcelona/akiro-hand-roll-bar
