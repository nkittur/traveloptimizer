                        - heading "Solomillo" [level=3] [ref=e1776]:
                          - paragraph [ref=e1777]: Solomillo
                      - paragraph [ref=e1780]: "Indulge all your darkest carnivorous desires at this meat-lovers’ paradise, where the name of the restaurant is the same as your order (solomillo means “sirloin steak”). This is the best steak in Barcelona, and the menu is customizable to your liking: Pick your type of beef, weight, and how you want it cooked, plus optional sauces and accompaniments. If you're overwhelmed by the choices, go with the Frisian beef, cooked medium rare, with Café de Paris sauce, and sides of dauphinois potatoes and browned carrots with cumin. You're welcome."
                      - link "Read Full Review" [ref=e1781] [cursor=pointer]:
                        - /url: https://www.cntraveler.com/restaurants/barcelona/solomillo
