                        - text: "restaurant was a favorite hangout for Barcelona’s artistic community, and the old-school bohemian decor has been well preserved: bad lighting, white tablecloths on dark wood, and walls adorned with old portraits and mosaics. The food is honest and delicious—top dishes include the cod fritters and meatballs with cuttlefish and prawns, made all the more delectable with a cheap beer pairing—and highly prized by locals, so come early in the day."
