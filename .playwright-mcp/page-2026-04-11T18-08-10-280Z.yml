                        - heading "Quirat" [level=3] [ref=e1000]:
                          - paragraph [ref=e1001]: Quirat
                      - paragraph [ref=e1004]: "Quirat is a restaurant with a clear vision: reviving old, often unfashionable, Catalan recipes and traditions for a younger, more international audience. The presentation is intricate and elegant, barely preparing you for the unabashedly deep, complex flavors. Each dish on the menu highlights something distinctly local: the humble calçot (a cross between a leek and a spring onion that only grows in Catalonia during the first four months of the year), and cap i pota, an old-school offal stew beloved by octogenarians, but served here on a bed of delicate crayfish. Quirat translates as carat, and its culinary gems can be sampled on the two aptly named 18K and 24K tasting menus. Catalonia is present in every bite and sip of Quirat, where the wine menu showcases the very best of Catalonia’s 12 designated wine regions, from Priorat reds to Penedès bubbles and Alella whites. You’re sure to find something distinctly Barcelonian in this recently opened gem."
                      - link "Read Full Review" [ref=e1005] [cursor=pointer]:
