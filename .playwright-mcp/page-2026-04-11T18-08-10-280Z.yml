                      - link "Mont Bar" [ref=e1824] [cursor=pointer]:
                        - /url: https://www.cntraveler.com/restaurants/barcelona/mont-bar
                        - heading "Mont Bar" [level=3] [ref=e1825]:
                          - paragraph [ref=e1826]: Mont Bar
                      - paragraph [ref=e1829]: "A foodie favorite for years, Mont Bar has slowly been making its name as one of the standouts in Barcelona’s gastro-tapas-bar movement. Last year, the people at Michelin finally awarded it the star it deserved. Back in the day, this space used to be quite rowdy and very cramped. The tables may be more spaced out these days and the vibe is more buttoned up than it used to be–but only slightly. It still feels like a tapas bar, just a smarter version. And with a Michelin star comes a tasting menu: in this case one consisting of 16 dishes and priced at €155. The good news here is that Mont Bar still offers an à la carte option, with bites from as little as €6. The menu changes with the seasons, but mainstays like the chicken skin and squid canapé and the mochi with Iberian sobrassada and Mahón cheese will make you cry with joy year-round. From there, just go with whatever your server recommends."
                      - link "Read Full Review" [ref=e1830] [cursor=pointer]:
                        - /url: https://www.cntraveler.com/restaurants/barcelona/mont-bar
