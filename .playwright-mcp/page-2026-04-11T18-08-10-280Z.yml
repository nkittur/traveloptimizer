                        - heading "Restaurante Lasarte" [level=3] [ref=e3232]:
                          - paragraph [ref=e3233]: Restaurante Lasarte
                      - paragraph [ref=e3236]: Lasarte is brought to us by Martín Berasategui, the chef who owns the most Michelin stars in Spain—twelve in all—and the third most Michelin-starred chef in the world overall. At present, seven of his restaurants boast 12 Michelin stars between them, Lasarte Restaurant in Barcelona has three. So it goes without saying the food here is going to be something out of the ordinary. You can tasting menu or à la carte (we recommend the full splurge on the tasting menu and wine pairing). Whichever you choose you'll find transcendent items like head chef Paolo Casagrande’s signature squid tartar with egg yolk, or Berasategui’s own mille feuille of smoked eel, foie gras, spring onion, and green apple–served as a snack. And make sure to save space for pastry chef Xavi Donnay's cherry petits fours. Donnay took home best pastry chef honors at The Best Chef Awards 2020.
                      - link "Read Full Review" [ref=e3237] [cursor=pointer]:
                        - /url: https://www.cntraveler.com/restaurants/barcelona/restaurante-lasarte
