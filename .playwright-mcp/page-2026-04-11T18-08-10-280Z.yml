                        - heading "Besta" [level=3] [ref=e1364]:
                          - paragraph [ref=e1365]: Besta
                      - paragraph [ref=e1368]: "Besta is the brainchild of Carles Ramón from Catalonia and Manu Núñez from Galicia. Together, they have invented a gastronomic style like none other: blending the finest in-season produce from their respective regions. It's a match made in heaven, and the result is positively ethereal—no wonder it’s so hard to score a reservation here. Ramón and Núñez are not afraid to take risks, especially when it comes to mixing unorthodox ingredients from the sea and the land. Surf 'n' turf (or mar i muntanya) is a mainstay of Catalan cuisine. Combinations like chicken and shrimp or meatballs and squid abound on menus here, but Besta’s tasting menus take it to another level, serving bone-marrow marinated wild sea bass with green asparagus and mustard, or market-fresh white shrimp, served in onion soup and topped with an egg yolk. The wines are mainly sourced from small producers and divided by color and region. It's own in-house branded gin is distilled with algae and oysters."
                      - link "Read Full Review" [ref=e1369] [cursor=pointer]:
                        - /url: https://www.cntraveler.com/restaurants/barcelona/besta
