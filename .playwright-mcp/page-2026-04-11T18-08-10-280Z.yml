                        - /url: https://www.cntraveler.com/restaurants/barcelona/come
                        - heading "COME Barcelona" [level=3] [ref=e2889]:
                          - paragraph [ref=e2890]: COME Barcelona
                      - paragraph [ref=e2893]: "There are plenty of Mexican joints in Barcelona but there's nothing like COME, which was awarded a well-deserved Michelin star within a year of opening. This Mexican fine-dining joint pops with bright colors on its walls and mosaic tabletops, and the refined elements are strictly reserved for the food. The rest of the ambiance is all about that famously warm and easy Mexican hospitality. If you’ve done fine dining in Barcelona, you know the drill: two tasting menus, one long in the evening, one short for lunch. What stands out at COME is that each one consists of a sequence of starters, followed by your choice of one main that is served to the whole table. And that there’s none of those gentle, prissy flavors you will find elsewhere—this may be fine dining, but it’s Mexican fine dining, so the seasoning smacks you in the mouth and doesn’t apologize for it. The highlights are the snacks and starters; the negroni and strawberry “cloud” that dissolves as you eat it and the impossibly tender lamb neck served with the sauces of black beans and hoja santa."
                      - link "Read Full Review" [ref=e2894] [cursor=pointer]:
                        - /url: https://www.cntraveler.com/restaurants/barcelona/come
