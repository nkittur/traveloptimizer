                        - heading "Slow & Low" [level=3] [ref=e2908]:
                          - paragraph [ref=e2909]: Slow & Low
                      - paragraph [ref=e2912]: "This once under-the-radar local foodie favorite is flying well above it these days, since the people from Michelin awarded it its first well-deserved star. When booking, request one of the stools at the kitchen counter, which are positioned at the same height as the chefs—a metaphor, perhaps, to the restaurant's ethos: take everything you traditionally associate with tasting menus and stick a finger up at it. Head chef Francesc Beltri spent time traveling and living in Bali and Singapore, and he brings those influences into his Mediterranean kitchen, along with the flavors of places like Thailand, Mexico and Peru. If that all sounds a bit curious—well, that’s the point. But you can also expect taste their love of Thailand and Peru along the way. Dinner will be full of risks, dishes that look simple but are everything but. Like the tostada topped with shrimp tartare, avocado and…wait for it…fermented shrimp paste, a kind of funky Bangkok-meets-Oaxaca fever dream, and we’re here to devour every bite of it."
                      - link "Read Full Review" [ref=e2913] [cursor=pointer]:
                        - /url: https://www.cntraveler.com/restaurants/slow-and-low-barcelona/slow-and-low-barcelona
