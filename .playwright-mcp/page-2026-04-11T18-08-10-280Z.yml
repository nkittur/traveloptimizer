                        - heading "Moments" [level=3] [ref=e1383]:
                          - paragraph [ref=e1384]: Moments
                      - paragraph [ref=e1387]:
                        - text: The kitchen may still be overseen by Carme Ruscalleda—recipient of no fewer than seven Michelin stars in her heyday—but the day-to-day running of Moments has now been handed down to her son Raül. Located in the beautiful
                        - link "Mandarin Oriental Hotel" [ref=e1388] [cursor=pointer]:
                          - /url: https://www.cntraveler.com/hotels/spain/placa-de-catalunya/mandarin-oriental-barcelona
                        - text: ", front and center on Passeig de Gràcia, the restaurant holds its own Michelin star, with an offering that is distinctly Catalan, but with international twists. Think Iberian feather steak with local Ganxet bean hummus, curry, mint, and puffed rice, or baba ganoush topped with Mediterranean caviar. Artisanal produce and seasonality were a thing here long before they became part of the zeitgeist, and sustainability is at the center of every dish. The themed menus are a thing of the past; making way for a pared-back concept with less fluff and more freedom for the mother-son chef team to let the produce of their homeland do the talking."
                      - link "Read Full Review" [ref=e1389] [cursor=pointer]:
                        - /url: https://www.cntraveler.com/restaurants/barcelona/moments
