                      - link "Nuara" [ref=e456] [cursor=pointer]:
                        - /url: https://www.cntraveler.com/restaurants/barcelona/nuara
                        - heading "Nuara" [level=3] [ref=e457]:
                          - paragraph [ref=e458]: Nuara
                      - paragraph [ref=e461]: "Going to Barcelona without tucking into a paella feast by the beach would be like not having a harborside lobster roll when in Maine. But not all Barcelona beachfront paella joints are created equal. Nuara is not only trendy and fresh, it's run by a family who have been doling out some of the best rice in Barcelona for six decades. Kick things off with some seafood treats: fresh oysters (topped with caviar if you're feeling bougie), Andalusian-style lightly battered calamari, the tuna tartare made from top-notch Balfegó tuna and served with creamy burrata. And then, the main event, the rice. Traditionalists will want to try the the thin-crusted, crispy rice topped with juicy red Mediterranean shrimp. Feeling disruptive? Try the flavor-packed surf-and-turf (mar i muntanya) rice with squid, pork belly, and mushrooms. Not in the mood for rice? The grilled catch of the day is excellent too."
                      - link "Read Full Review" [ref=e462] [cursor=pointer]:
                        - /url: https://www.cntraveler.com/restaurants/barcelona/nuara
