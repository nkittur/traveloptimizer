                        - heading "Bardeni el Meatbar" [level=3] [ref=e585]:
                          - paragraph [ref=e586]: Bardeni el Meatbar
                      - paragraph [ref=e589]:
                        - text: The red-and-black decor is giving French bistro, but the vibe inside is decidedly local. So much so, in fact, that we are the only non-Catalan speakers in the packed restaurant on a Friday night, despite being two blocks down from Barcelona's overtourism epicenter, a.k.a
                        - link "la Sagrada Familia" [ref=e590] [cursor=pointer]:
                          - /url: https://www.cntraveler.com/activities/barcelona/la-sagrada-familia
                        - text: . It's been two decades since Dani Lechuga (whose surname translates as lettuce, and, no, the irony isn't lost on him) opened what he refers to his “meat-bar.” This temple, situated just down the road from the even more famous Sagrada Família is where Barcelona's devout carnivores go to worship. They come to pay tribute to the steak tartare, amped up with tabasco, Worcestershire sauce, and sherry wine, and to pray for the cured Picanha, or “jamón” made from Angus beef, the taco stuffed with beef fillet carpaccio, and the fricandó (Catalan slow-cooked beef and mushroom stew) served as a sandwich. Perhaps, above all, they bow down before impossibly tender Black Angus steak, served with rich Café de Paris sauce and fried potatoes.
                      - link "Read Full Review" [ref=e591] [cursor=pointer]:
                        - /url: https://www.cntraveler.com/restaurants/barcelona/bardeni-el-meatbar
