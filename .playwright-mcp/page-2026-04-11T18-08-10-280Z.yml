                      - paragraph [ref=e2269]: Locals reign supreme here. Few tourists have heard of Berbena and even fewer venture off the beaten track to the posh end of town above Avenida Diagonal. Inside, there daily batches of home-baked bread that smell like your grandma’s kitchen, comfort food like hearty beef with wine stew and gooey slices of Spanish omelet, platters of locally sourced cheese and charcuteries—all made for sharing. We'd like to imagine that you'll probably stumble in here for a quick bite. You'll find a table by the window. One thing will lead to another and, before you know it, it’ll be midnight, and you'll realize you’ve spent hours snacking and sipping and chatting. And you won’t regret a single second of it
