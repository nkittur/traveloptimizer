                            - text: . Riskier and more avant garde, Hermanos Torres is currently one of only four restaurants in Barcelona with three coveted Michelin stars. Playing with juxtaposition—from wildly contrasting textures and temperatures, to ultra-modern takes on Catalan “grandma” dishes, and unexpected flavor pairings. Top dishes include the smooth-as-butter squid tartare in chicken consommé topped with a generous dollop of caviar, and (when in season) the sweet, Catalan Maresme peas with Iberico ham that pop in your mouth like bubble wrap. Speaking of pairings, wine pairings at tasting menu restaurants don't always give you your money's worth. That is not the case here. Go for the splurge.
