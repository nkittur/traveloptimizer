                        - heading "Alapar" [level=3] [ref=e2067]:
                          - paragraph [ref=e2068]: Alapar
                      - paragraph [ref=e2071]: "A small, unassuming-looking space in an even less noteworthy street, this isn't a place you'd walk into by accident–which is probably a good thing since it’s almost always fully booked. Alapar calls itself a Mediterranean-Japanese Izakaya (or Japanese tavern). That means you can expect lots of Japanese-style dishes–like sashimi, nigiris, and gyozas, but all made using top-notch locally sourced Mediterranean produce. Highlights include the “montadito”—a Spanish word referring to a small, open sandwich—in this case a decadent brioche loaded up with squid tartare and Iberian pancetta, the artichoke flower with eel sauce, and, for dessert, one of the cleverest twists we’ve ever seen on every Catalan’s favorite dessert of chocolate, salt, bread. and olive oil: a gooey chocolate mochi with olive oil ice cream."
