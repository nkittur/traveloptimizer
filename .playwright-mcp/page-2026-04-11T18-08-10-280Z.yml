                        - heading "Disfrutar" [level=3] [ref=e2195]:
                          - paragraph [ref=e2196]: Disfrutar
                      - paragraph [ref=e2199]:
                        - text: "A meal at Disfrutar is like a performance: There's fire, ice, smoke, and lots of flavor and color. What started as an exciting new project by three ex-chefs from the late, great El Bulli has achieved the pinnacle of success in its own right—being awarded three Michelin stars and named the best restaurant in the world—officially, in the 2024 edition of"
                        - link "The World’s 50 Best Restaurants" [ref=e2200] [cursor=pointer]:
                          - /url: https://www.theworlds50best.com/list/1-50
                        - text: . The tasting menus that are playful, unpredictable, often surprising us by telling our eyes one thing but sending our taste buds a completely different message. Top dishes include the crispy egg yolk with mushrooms and the chocolate peppers with oil and salt, but it’s all good. There's an extensive wine list that includes anything from reasonably priced glasses, to a mind-boggling selection of bottles, or a wine pairing to go with your tasting menu, priced at €170.
                      - link "Read Full Review" [ref=e2201] [cursor=pointer]:
                        - /url: https://www.cntraveler.com/restaurants/barcelona/disfrutar
