                      - text: Electric Bleu is already full to the brim with people who, according to the staff, “mostly walked here.” Mar Vists is clearly excited about this kinda French, kinda Australian, mostly Californian bistro. There’s a small patio where you’ll probably find someone eating with their dog, a large dining room with space for family dinners, and a long counter perfect for a casual date. The menu has some interesting-sounding dishes like charred figs with nduja and eggplant puree, or duck breast laid atop champagne grapes, but it’s the simple stuff that works best. The signature roast chicken is a standout, especially when ordered with a perfectly dressed side salad and a lesser-known Australian delicacy, fries with
