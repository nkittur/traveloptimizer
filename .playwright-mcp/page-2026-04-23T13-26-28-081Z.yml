                - generic [ref=e1234]:
                  - generic [ref=e1235]:
                    - paragraph [ref=e1237]: "Kojima is a simple proposition: eight seats, no menu, lots of sake, and one chef whipping up incredible Japanese dishes nightly. That might mean silky poached eggplant in sardine broth, a crackly fried taro puff, sweet snow crab with dashi jelly, or perfectly charred chicken hearts. Dinner at this kappo-style spot in a Sawtelle mini-mall involves putting yourself in the hands of Hayato Kojima, who recently relocated to LA after running an acclaimed izakaya in Tokyo. Book a reservation for his 12-course omakase at $200, or if you’re feeling spontaneous, show up for the $80 four-course mini omakase available to walk-ins. Either way, brush up on a few Japanese phrases—Kojima is still learning English."
