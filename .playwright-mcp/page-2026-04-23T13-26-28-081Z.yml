                  - text: Some say LA's Westside is a vapid wasteland hemmed in by freeways, some say it’s the center of the known universe. And, frankly, some people who live there haven't ventured outside its borders since 1996. But no matter what you think of the Westside—which we’re defining as everything west of Beverly Hills—there’s no denying that it’s home to some of the most exciting new restaurants. Which is why we created the Westside Hit List. Much like our
                  - link "LA Hit List" [ref=e153] [cursor=pointer]:
                    - /url: https://www.theinfatuation.com/los-angeles/guides/best-new-los-angeles-restaurants-hit-list
                  - text: ", you’ll find new places that we've checked out and genuinely love."
