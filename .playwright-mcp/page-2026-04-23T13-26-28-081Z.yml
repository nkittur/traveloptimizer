                - generic [ref=e348]:
                  - paragraph [ref=e350]: West LA's Sawtelle Boulevard continues to stockpile Japanese imports like a racing garage, but Kyoto transplant Ten No Meshi is the only place with a menu entirely devoted to katsu. The signature deep-fried A5 wagyu—which starts at $44 and is as juicy and fatty as it sounds—is excellent, but a whole production to eat (you're given five dipping sauces plus instructions, and a hot stone to sear the slices of rare steak). We prefer the less flashy but classically perfect pork katsu set, which is nearly half the price of the wagyu, and comes with a delicious roe-topped scallop katsu appetizer. Just know that in a chaotic twist, staff are trained to yell out “Ten No Meshi” at full volume whenever any dish topped with salmon roe is served, which happens very often.
