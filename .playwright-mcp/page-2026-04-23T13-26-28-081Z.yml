                - generic [ref=e1013]:
                  - paragraph [ref=e1015]: "A more casual resurrection of Broken Spanish—Ray Garcia’s new-wave Mexican restaurant that closed in 2020—Comedor has a lot going for it: a bumping Latin-funk playlist, sultry lighting that makes the A-frame space glow, and small plates that are actually priced like small plates. And you don't need to count the couples sharing enchiladas to realize its potential for an under-the-radar date night. Despite pea guacamole on the tostada and salt foam on the margarita, the food here is decidedly homey. Smoked tuna adds oomph to a cheese-stuffed flauta, and sweet potatoes come smothered in salsa macha butter. Don’t skip the crispy chicharrón in garlicky mojo, a Broken Spanish holdover that was on our mind (and breath) long after dessert."
