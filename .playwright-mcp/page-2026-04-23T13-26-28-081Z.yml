                      - paragraph [ref=e599]: Somebody finally decided to open a throwback steakhouse in Brentwood Village, and unsurprisingly, it’s already booked out weeks in advance. Classic touches at The Wilkes include vest-clad servers shaking filthy martinis, a wedge salad with enough crumbled blue to qualify it as a cheese course, and tablecloths swept for crumbs between courses. The kitchen serves a few moderate-sized steaks, but we’d point you toward the thick pork chop with roasted apples or the latke-crusted schnitzel with dill créme fraîche first. Add an order of sweet-smelling molasses bread and one of the interesting vegetable sides (hello, crispy maitakes), and you’ve got the makings of a useful dinner spot with vintage charm—and antique Scottie dog statues—to spare.
