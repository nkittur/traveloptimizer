                  - paragraph [ref=e232]:
                    - text: With its sprawling four-page menu, Utamaro Sushi Izakaya feels like several different Japanese restaurants huddled under one roof. The good news is that all of them are pretty impressive. Dishes like delicately fried karaage and braised pork belly that’s soft enough to cut with chopsticks hover under $20 and are exactly what we want with post-work Sapporos, and daily specials like scallop tempura are fun for glamming up date night. But the best bites here are at the sushi counter, where the
                    - link "Sushi Takeda" [ref=e233] [cursor=pointer]:
                      - /url: https://www.theinfatuation.com/los-angeles/reviews/sushi-takeda
                    - text: chef and his team serve seasonal barracuda nigiri and pack rolls with blue crab or negitoro. If you really want to see them flex, order the 10-piece sushi omakase priced at a very reasonable $78.
