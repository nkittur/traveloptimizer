                    - paragraph [ref=e455]:
                      - text: If Holy Basil Santa Monica were just a carbon copy of the one in
                      - link "Atwater Village" [ref=e456] [cursor=pointer]:
                        - /url: https://www.theinfatuation.com/los-angeles/reviews/holy-basil-atwater-village
                      - text: ", we’d be thrilled. But at their new location, you'll find a wild seafood-leaning Thai menu that's totally original, featuring fried calamari dusted in salted egg yolk, beef slices poached in concentrated boat noodle soup, and crispy noodles smothered in egg tofu gravy. The space is cramped and slightly chaotic (like the original), and when sitting at the counter, you’ll be close enough to the wok station to feel blasts of heat. But prices are reasonable, the room is fun, and the staff won’t miss a beat if you pop in for takeout pad kee mao. Consider us loyal subjects of the Holy Basil Empire."
