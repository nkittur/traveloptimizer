                - paragraph [ref=e731]: A West Asheville comfort food institution, Sunny Point serves breakfast all day along with lunch and dinner options, sourcing seasonal ingredients from its on-site production garden. It’s worth the unavoidable wait on weekend mornings for a crack at the sausage and cheese-stuffed French toast, carrot hotcakes, or locally lauded shrimp and grits. Dishes can be paired with anything from espresso to sweet tea to cocktails. Guests can wait for their table next door in the restaurant’s Rabbit Hole bakery and coffee shop before dining indoors or on the covered patio near the restaurant’s expansive, flower-filled garden.
