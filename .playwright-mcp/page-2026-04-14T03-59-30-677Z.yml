                - paragraph [ref=e637]: An outstanding wine selection, well-crafted seasonal food menu, and welcoming rustic outdoor space have helped make this second Haywood Road offering from the Admiral owner, Drew Wallace, a favorite neighborhood gathering spot. Popular dishes include deviled eggs with smoked honey and bacon or chicken liver mousse with blackberry jam and fennel pollen. Also, chef Austin Inselmann’s housemade pastas never disappoint. Brunch is served until 4 p.m. Saturdays and Sundays, while Monday evenings feature a special menu of Italian fare, with antipasti, spaghetti and meatballs, linguine and clams, and gelato for dessert.
