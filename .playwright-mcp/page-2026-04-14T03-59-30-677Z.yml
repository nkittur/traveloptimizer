              - paragraph [ref=e210]: Asheville’s creative vibe and collaborative spirit have fueled the rapid growth of a thriving, eclectic restaurant scene. The small city in the mountains of western North Carolina has a remarkably large pool of talented chefs who source inspiration — as well as market-fresh ingredients — from the region’s tight-knit network of farmers and foragers. Appalachian fare, Southern comfort food, and barbecue mingle with flavors from Asia, Europe, the Americas, and beyond, making for a riot of choices at mealtime.
              - paragraph [ref=e212]: This list represents a cross-section of Asheville’s diverse and ever-evolving culinary landscape. As Western North Carolina continues its long journey of rebuilding and recovering from the devastation of tropical storm Helene, Asheville’s restaurant scene remains in flux.
              - paragraph [ref=e214]:
                - emphasis [ref=e215]: "The Eater 18 is updated regularly. Removal from the list does not mean a restaurant isn’t still great and won’t return in the future; it allows for new additions, keeping the 18 fresh, inclusive, and geographically representative. New to the list: Tall John’s, Luminosa, Potential New Boyfriend, and Corner Kitchen."
                - emphasis [ref=e216]: The restaurants are listed in geographical order from north to south.
