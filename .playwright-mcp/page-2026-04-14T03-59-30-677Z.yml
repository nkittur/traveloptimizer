                  - paragraph [ref=e604]: Before opening her cozy West Asheville brick-and-mortar restaurant a decade ago, Lebanon native Suzy Phillips earned a diehard following dishing out her mother’s recipes from a food truck. With her little cafe, Phillips provides a friendly, welcoming mix of bohemian Asheville and the Middle East, with comfy, colorful pillows, pictures of her mom, and casual, clean-up-after-yourself counter service. The menu has something for everyone, from garlicky, lemony Lebanese fries to labneh, fattoush, spice-rich m’dardara, and lamb kafta. Sandwich seekers can fill fresh pitas with chicken, beef, or lamb shawarma, as well as housemade vegan seitan, falafel, and Lebanese-spiced beets. Deli cases and shelves near the entrance offer baklava and other tempting dessert options, plus Middle Eastern foods to take home.
