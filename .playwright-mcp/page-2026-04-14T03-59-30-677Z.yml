                  - paragraph [ref=e868]: Terrific cocktails and consistently delicious modern American fare may be what lure folks to Jargon, but once inside, the compact space itself becomes a key part of the experience. Owners Shelly and Sean Piper have won awards for their respectful and beautiful renovation of the historic building, and Shelly pours her art history background into the decor, which includes fascinating collections of whimsical artwork, curios, and antiques. A cool way to kick off a Jargon meal is with its signature Ice Breaker cocktail — an Old Fashioned served inside a smoked ice sphere. Bread service with housemade potato rolls and black shallot butter, and the pumpkin coconut soup make good entry points for mains that often include choices such as roasted duck breast, local chicken leg confit, and whole mountain trout.
