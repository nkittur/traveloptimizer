                - paragraph [ref=e427]: When chef Katie Button opened Cúrate in 2011, she set a high bar for Asheville’s then-nascent restaurant scene. With a 2022 James Beard Award for Outstanding Hospitality under its belt, the Spanish tapas concept still charms adoring crowds in its friendly, yet refined, historic downtown space with shareable classics like jamon Iberico, Galician-style octopus, and goat cheese-stuffed piquillo peppers. The bar stocks an impressive list of Spanish and Basque vermouths, sherries, and wines.
