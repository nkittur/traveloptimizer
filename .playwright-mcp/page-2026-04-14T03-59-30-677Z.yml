                    - img "Link" [ref=e922]
                - paragraph [ref=e924]: Located not far from the gates of the Biltmore Estate, Corner Kitchen is a cornerstone of Asheville’s modern restaurant industry. Its cozy, two-story pebbledash building was constructed in 1895, one of the original Biltmore Village structures. Since it opened in 2004, it’s cemented a reputation for delivering consistently excellent, straightforward fare to both locals and tourists — including famous visitors, like Barack and Michelle Obama in 2010. After the building was ravaged by severe flooding from Tropical Storm Helene in 2024, owners Kevin Westmoreland and Joe Scully completely rebuilt it, reopening in August 2025 to help lead the charge for Biltmore Village’s recovery. CK’s corn and crab chowder and the pecan-crusted trout are Asheville institutions, and on weekends, folks line up out the door to fill up on favorites like biscuits and gravy, boozy French toast, and pimento cheese tots.
