                  - paragraph [ref=e305]: Relocated in 2022 to a space just down the street from the funky Lexington Avenue building it had inhabited for 20 years, Rosetta’s still maintains its mellow, hippie vibe and serves the same menu of simple, fresh, affordably priced vegan and vegetarian soul food. The veggie burger and peanut butter-baked tofu are legendary, but the Buddha Bowl is another good choice with its simultaneously healthy and indulgent tumble of rice, smoky tofu, avocado, greens, and more (add the house-cultured kimchi for a kick). The spacious patio area offers on-tap, locally made Buchi kombucha plus cocktails, mocktails, and housemade sodas.
