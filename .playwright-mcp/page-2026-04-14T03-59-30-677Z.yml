                    - heading "Chai Pani" [level=2] [ref=e490]
                    - button "Copy link" [ref=e492] [cursor=pointer]:
                      - img "Link" [ref=e493]
                  - paragraph [ref=e495]: After winning the 2022 James Beard Award for Outstanding Restaurant, chef Meherwan Irani’s lighthearted homage to Indian street food outgrew the tiny downtown space where it earned its reputation, and in 2024, moved to much larger digs on the South Slope. The massive dining room welcomes guests withan explosion of Chai Pani’s signature buoyantly colorful decor and joyful Bollywood verve. Selections like the popular kale pakoras and lime-kissed matchstick okra fries share the menu with thali plates, grilled kebabs, pav street sandwiches, and Indian truck stop-style small plates such as the crispy sabudana vada tots. Chai Pani doesn’t take reservations, but on weekends, diners can wait for their table at the upstairs cocktail and pani puri bar.
