                - generic [ref=e1036]:
                  - heading "Posana" [level=2] [ref=e1037]
                  - button "Copy link" [ref=e1039] [cursor=pointer]:
                    - img "Link" [ref=e1040]
                - paragraph [ref=e1042]: Chef Peter Pollay’s elegant Posana restaurant has anchored the heart of downtown with its Pack Square location for more than 15 years, priding itself on a vast, award-winning wine list and luxurious, seasonally rotating cocktail menu. Many are shocked to learn after sampling the stellar housemade breads and pastas, that the restaurant is 100% gluten-free — the concept was inspired by Pollay’s wife, Martha, who has celiac disease. Menu exploration can begin with trusted favorites — the sesame seed breadsticks and lemony kale salad with local manchego. Entree options typically include the unfailingly delectable wine-braised short ribs as well as pastas and local chicken and pork dishes. Posana’s new South Asheville location offers the same menu and a similarly plush, upscale vibe with the welcome addition of an outdoor dining space.
