                  - heading "Tall John’s" [level=2] [ref=e258]
                  - button "Copy link" [ref=e260] [cursor=pointer]:
                    - img "Link" [ref=e261]
                - paragraph [ref=e263]: When chef Trevor Payne opened Tall John’s in 2022, his goal was to create a cozy neighborhood tavern where guests could drop in to relax with the simple pleasures of an ice-cold martini and perfectly roasted chicken. Nestled in an art-filled, historic wooden building at the edge of North Asheville’s tree-lined, residential Montford neighborhood, Payne’s restaurant delivers all that and more. In addition to the martinis and chicken, the menu of satisfying American-European classics feels like a warm hug with straightforward but beautifully executed options like pillowy Parker House rolls, grilled quail, and a quintessential Caesar salad.
