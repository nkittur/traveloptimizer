                - paragraph [ref=e337]: Everything about the experience at Luminosa is a treat, from the comfortable elegance of the wood-and-brass-filled dining room in the historic downtown Flat Iron Building to the friendly service and beautifully prepared Italian fare. But it’s the restaurant’s impeccable sense of place, staunch commitment to local sourcing, and zero-waste practices that earned it a 2025 Michelin Green Star, along with a Bib Gourmand designation for delivering outstanding fare at an excellent value. The bone marrow “tator tots” with horseradish aioli are a reliable place to start. From there, a wood-fired pizza might be in order — play it safe with a classic margherita or explore a bit with toppings such as lemon, fennel, and smoked mozzarella. The housemade pastas and meat dishes are also foolproof. Still, those in the know will also grab something from the contorni menu, which showcases vegetables sourced fresh from Western North Carolina farms.
