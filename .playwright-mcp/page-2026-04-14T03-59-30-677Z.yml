                  - paragraph [ref=e388]: Chef William Dissen’s the Market Place celebrated its 45th anniversary in 2024 with a semifinalist nod for the James Beard Outstanding Restaurant award. Opened in 1979, and in its current Wall Street location under Dissen’s ownership since 2009, the Market Place is Asheville’s landmark farm-to-table restaurant and a cornerstone of the city’s food scene history. Sampling the house pickles, fresh vegetable small plates, and charcuterie is a must. The seasonally rotating menu also showcases fresh local meats and trout, as well as Carolina seafood options. The Benton’s bacon Old Fashioned with maple syrup is a classic complement to the meal.
