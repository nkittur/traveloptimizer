                - paragraph [ref=e824]: Dip down a West Asheville side street and enter through the back door to discover the warm and utterly unique dining experience that chef-owner Silver Iocovozzi brings to life in a colorful, 17-seat space at Neng Jr.’s. Drawing inspiration from his Filipino roots, the chef delivers a rotating parade of vibrant offerings such as adobo oyster accented with cured quail egg yolk and the subtle, saline pop of sea grapes, crab fried rice, sinigang smoked wings, and a sculpted longanisa sausage pithivier. The cheese ice cream is a dessert favorite. The friendly staff carefully explains each dish to guests, so there’s no need to Google unfamiliar items.
