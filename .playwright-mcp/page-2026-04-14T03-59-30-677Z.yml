                  - paragraph [ref=e792]: Asheville is blessed with many excellent bakeries, but Old World Levain (OWL) is in a class by itself. Founder Susannah Gebhart learned the art and science of crafting her naturally leavened old-world breads and European pastries from a fourth-generation Spanish-Italian baker. Her bakeshop in West Asheville and the newer second location on Charlotte Street near downtown are often crowded with locals lined up for the perfect, airy baguettes and Instagramable sourdough loaves, as well as shatter-in-your-mouth croissants, jewel-like tarts sparkling with crystallized herbs, sugared Scandinavian cardamom buns, and other pastry delights. A sizable menu of coffee drinks and teas helps wash it all down. The Charlotte Street location recently expanded to include a dedicated retail cake shop.
