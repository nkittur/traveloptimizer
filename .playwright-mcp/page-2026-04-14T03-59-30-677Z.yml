                    - button "Copy link" [ref=e228] [cursor=pointer]:
                      - img "Link" [ref=e229]
                  - paragraph [ref=e231]: Located in a modest standalone building on busy Merrimon Avenue just north of downtown, Plant has regularly topped lists of the nation’s best vegan restaurants since it opened in 2011. It’s 90% organic and mostly gluten-free, but the bold and artful flavor profiles executive chef Jason Sellers coaxes from his ingredients lack nothing. The popular lasagna cruda and housemade vegan cheese plate are menu anchors, with other items rotating depending on the season and Sellers’s inspiration. Customers should save room to finish the meal with a scoop (or two) of the chef’s impossibly creamy and decadent dairy-free ice creams.
