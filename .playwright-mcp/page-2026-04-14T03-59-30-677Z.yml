                    - button "Copy link" [ref=e695] [cursor=pointer]:
                      - img "Link" [ref=e696]
                  - paragraph [ref=e698]: There’s no other place in Asheville quite like Potential New Boyfriend. A chic jewel box of bright colors; luxurious, mismatched furniture; and vivid artwork with an eclectic vinyl collection and top-notch sound system, PNB has established itself as the West Asheville neighborhood’s hip, home-away-from-home hangout. For savory snacking, there’s everything from grilled cheese sandwiches to savory aperitivo, like marinated olives and labneh with crudité. But it’s best not to sleep on the housemade ice creams and mindblowing desserts from pastry chef Dana Amromin — highlights include coconut tres leches and apricot cardamom Turkish Delight sundae. Owner Disco has crafted an impressive yet approachable selection of outside-the-box wines, amaros, vermouths, and wine-based cocktails. Helpful staff are always happy to help with suggestions and guidance.
