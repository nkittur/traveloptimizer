                  - paragraph [ref=e982]: With its flagship location in an unassuming West Asheville strip mall space and newer second shop just south of Biltmore Village, Taqueria Muñoz is regarded as a local culinary treasure for its lush and flavorful sopes, tortas, tacos, burritos, tamales, and more. The dominant language is Spanish, the dining experience is no-frills, the portions are hearty, and the prices are pleasantly affordable. Most dishes feature choices of pork pastor, carnitas, steak asada, chicharron, cabeza, and tongue, but vegetarians don’t have to settle for rice and beans — additional options include spinach and mushrooms, huitlacoche, nopales, and squash blossoms. Drink options include a rotating selection of housemade aguas frescas.
