                - paragraph [ref=e555]: Operating from a tiny, hip counter-service space on the bustling South Slope, chef Ashleigh Shanti’s Good Hot Fish restaurant definitely isn’t your grandma’s fish camp. But it does deliver — on brightly colored plastic Frisbees, no less — a craveable, high-end yet decidedly unfancy take on Southern fish camp cuisine. The namesake sandwich of perfectly fried North Carolina catfish and buttermilk tartar sauce layered unceremoniously between two pieces of white bread sounds far too simple for its price tag. But the first steaming, melt-in-your-mouth bite has the power to instantly mint new believers. The Ranchovy bowl (an expertly gussied-up version of the classic iceberg lettuce salad) is another good bet, as are many other sides, including the deeply satisfying Sea Island red peas and rich, gooey baked macaroni.
