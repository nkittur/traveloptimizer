                - generic [ref=e88]:
                  - generic [ref=e89]:
                    - paragraph [ref=e90]: "THERE are summer resorts that get busier and more chic over the years. And then there are the ones, like Bar Harbor, Me., that feel deliciously frozen in time. Don’t look for Starbucks, McDonald’s or Ralph Lauren here. Fashion shoppers stop at places with names like Cool as a Moose. Carmen Verandah and the Thirsty Whale are among the evening hot spots. Bar Harbor is the largest town on Mount Desert Island, and nearby Acadia National Park encompasses some 50 square miles. The rest of Mount Desert belongs to residents and a tony array of summer tenants: Brooke Astor summered here, as did myriad Rockefellers and, once upon a time, the town of Northeast Harbor had so many Philadelphia families that it was dubbed “Philadelphia on the rocks.” They all came lured by the striking setting of mountains, woodlands, lakes and ocean waves crashing against granite cliffs. Then and now, Mount Desert has served as a glorious nature camp for biking, hiking and boating. At day’s end, a visitor can cozy up with a blueberry beer and lobster. Evening strollers can watch sailboats drop anchor and the mist slip down over the hundreds of islands that dot the water."
                    - paragraph [ref=e91]:
                      - strong [ref=e92]: Friday
                    - paragraph [ref=e93]:
                      - strong [ref=e94]: 6 p.m.
                      - strong [ref=e95]: 1) TOAST THE SUNSET
                    - paragraph [ref=e96]: Take the two-hour cruise on the Margaret Todd, a four-masted windjammer that sails through Frenchman Bay and the Porcupine Islands (207-288-4585; downeastwindjammer.com; $37.50). You’ll pass Ironbound Island, still owned by descendants of the painter Dwight Blaney, who with his contemporary John Singer Sargent and others painted the remarkable vistas of the bay and Acadia. A guitarist may serenade you, but if you want to toast the sunset, bring your own wine.
