                  - generic [ref=e2857]:
                    - paragraph [ref=e2859]: "This is the restaurant equivalent of the little black dress: timelessly elegant and somehow always in fashion, over two decades into its tenure as one of San Diego’s best restaurants, newly reopened after a hiatus to renovate the kitchen. The rest of the space is just like before: a beautiful deck shaded by majestic Torrey Pines trees outside, and a chic Craftsman dining room inside. Everything is local (and delicious), including the pickled vegetables that punch up the silky chicken liver pate, or the seasonal fruit that comes with the bistro-perfect duck confit. Along with a wine list that’s been updated to include more natural and esoteric options, the menu is even more seasonal, with elegant dishes like ramp and asparagus soup and Baja shrimp with fava beans and green garlic coming and going, so you’ll want to keep coming back too."
