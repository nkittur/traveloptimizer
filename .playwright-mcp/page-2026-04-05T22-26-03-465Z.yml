                - generic [ref=e194]:
                  - paragraph [ref=e196]: Mission Hills is one of San Diego’s most beautiful residential neighborhoods, and Wolf In The Woods is beautiful, too. While the tightly-packed patio along the sidewalk feels a little European, inside it reads Santa Fe pueblo house, with ristras of dried chiles hanging from the ceiling and patterned chairs that give off a New Mexico vibe without being all Disneyland about it. The menu is new American with the occasional Indigenous influence, so there’s the obligatory yellowtail crudo, but also a pork chile stew with fry bread so fresh it’ll singe your fingers. You won’t find New Mexican food like this anywhere else in San Diego—or maybe even the rest of the country—and they pull off all the unexpected fusions effortlessly.
