                - generic [ref=e1606]:
                  - paragraph [ref=e1608]: One of the few cha chaan teng in San Diego, Mom Kitchen is a no-frills Hong Kong diner that serves nourishing noodle plates with maximum efficiency, along with mugs of steaming Ovaltine milk or salted lemon 7-Up. The tiny kitchen produces wide strands of scrumptious soft noodles made in-house. The beef chow fun is phenomenal—the noodles are intertwined with tender, peppery beef sirloin, crisp bean sprouts, and green scallions cut to the length of the bean sprouts. Order the malay water spinach, dressed in a mix of pungent shrimp paste and chili concocted in-house. Round out the meal with a platter of roast duck that radiates with lacquered, deep-red skin, and garlicky hainanese chicken. Ask for the wonton dumplings in broth only, a staff favorite. Mom will be proud when you finish your plate.
