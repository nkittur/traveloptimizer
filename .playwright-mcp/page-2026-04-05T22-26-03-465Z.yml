                  - generic [ref=e2227]:
                    - paragraph [ref=e2229]: Cori is a neighborhood spot worth trekking to even if you’re not in the neighborhood. The cozy dining room walls are decked out with vintage Italian posters, and the menu features homey Sicilian specialties you won’t find anywhere else in San Diego. Stacked like the Leaning Tower of Pisa, the fritelle cacio e pepe is a must-have starter dish of three pillowy doughnuts with warm pecorino cheese in the middle. Follow up with the spaghettoni, Cori’s famous seafood carbonara, made with toothy ancient grains that sit in a broth stewed with sea urchin, mussels, and lobster roe. Finish the meal with the lemon mousse and passionfruit on a delicate meringue that’ll make your mouth pucker in the best way.
