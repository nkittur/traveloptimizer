                - text: holds its own when it comes to food, whether you’re talking taco stands or three-Michelin-starred restaurants. But the city has even more to offer, like a brunch that’s worth a 45-minute drive, beachside restaurants that aren’t tourist traps and Filipino fine dining. With killer Chinese food in the Convoy district and better Mexican food than LA (sorry), consider this list a tour of some of the city’s finest restaurants and the wide variety of people and cultures that make San Diego special—AKA things to do when you aren’t exploring Balboa park or taking a stroll along the beach
