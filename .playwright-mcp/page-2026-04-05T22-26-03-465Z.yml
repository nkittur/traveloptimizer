                  - paragraph [ref=e1345]: "This Convoy strip mall joint does one good magic trick: it’s so good that you won’t mind having to order via QR code. If you haven’t had Chinese food from the Northwest of the country, it means plenty of lamb, hand-ripped noodles, and tart aged vinegar. The chewy hand-pulled noodles with (wonderfully fragrant) cumin lamb is a must-order, while the eggplant with garlic sauce is deeply savory with a kiss of spice. The burst tofu might be the sleeper hit, so sweet, sour, and punchy that you’ll fantasize about it afterwards like a teenager with a crush. Order more than you can eat––you’ll want to take a little Shan Xi magic home with you."
