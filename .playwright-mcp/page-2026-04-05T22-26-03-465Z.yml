                - generic [ref=e995]:
                  - paragraph [ref=e997]: Lamb is king at Aqui Es Texcoco, and if you leave without the meat sweats, you didn’t do it right. The cafeteria-like Chula Vista restaurant does brisk business in barbacoa, served with mugs of piping hot lamb broth and chickpea soup that make great hangover helpers, especially at breakfast time. Cuts of slow-roasted lamb, both fatty and lean, come with fresh corn tortillas and all the fixings to fashion your own tacos. But if you’re with the right company, you should get feral with a whole roasted lamb head, excavating morsels of fall-apart meat off the skull while navigating through the occasional tooth or eyeball.
