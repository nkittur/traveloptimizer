                    - paragraph [ref=e2532]: This Pacific Beach restaurant looks like a quintessential tavern—all polished wood, with fish mounted on the walls—where you could get great clam chowder. And you can. But you can also splash out on specials like caviar-topped scallops in a silky butter sauce and be smug in the knowledge that you’re scoring the most prized catch at any given moment, since The Fishery is attached to its own seafood distributor. Look out for local spot prawns or delicate sand dabs. The undersea theme extends into its cocktails, from a cheeky half-sized martini made with oyster shell-soaked vermouth to a negroni variant with kelp-infused gin that’s savory but not swampy.
