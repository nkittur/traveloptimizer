                    - paragraph [ref=e1796]: "A hotel in tony La Jolla might not be the likeliest place to find some of the best jerk of your life, but stranger things have happened. The restaurant delivers two versions of the Jamaican classic: one is a perfectly aromatic, spicy grilled chicken, and the other is an appetizer with a place in San Diego’s pantheon of iconic dishes. Cubes of pork belly draped in a jerk jelly mingle with plantains and black-eyed peas in a glaze that balances sweetness and heat like a tightrope walk. Nine-Ten’s take on cacio e pepe is equally righteous—it pairs handmade porcini spaghettini and shaved mushrooms for maximum umami."
