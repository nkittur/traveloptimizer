                    - paragraph [ref=e308]:
                      - text: Mabel’s Gone Fishing might be the best restaurant ever named after a dog—look out for paw prints embedded in the entryway floor and don’t miss the shrine in the bathroom. Diners happily sit elbow-to-elbow at snug tables flanked by a long, curved bar and a busy open kitchen. Part gintoneria, part wine bar, the servers at Mabel’s pour gin and tonics and glasses of pet-nat to pair with small plates that feel like they made the journey to your table by way of Spain and Portugal. That means house-smoked mackerel accompanied by pickled guindilla peppers, local wild shrimp nestled in a crisp-bottomed paella of Spanish bomba rice, or clams sauteed with tomato and basil cascading over a thick slice of sourdough from sibling bakery
