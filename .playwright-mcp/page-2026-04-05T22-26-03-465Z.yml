                  - generic [ref=e527]:
                    - paragraph [ref=e529]: Addison is a special restaurant trying hard to be special, best reserved for a once-in-a-lifetime occasion. They serve fancy food at fancy prices—$395 per person before tax, tip, or drinks, with the cheapest wine pairing coming in at an additional $395—with servers that move in alarming synchronicity, like ballet dancers. The ten-course tasting menu is a hodgepodge of Chinese, Japanese, and French food, and everything is technically impressive even if there's not a clear throughline from one dish to to the next. Think a bowl of rice, caviar, and sabayon sauce that tastes like a perfect bacon, egg, and cheese, or a Cantonese quail that rivals anything from a Chinatown BBQ window. In spite of all the pomp and circumstance and tweezer-plating, the best pleasures at Addison are simple.
