                    - paragraph [ref=e1952]: Draped in velvet and glowing with art deco glamour, Animae is one of San Diego’s grandest dining rooms. Its plush oversized booths have been perpetually full since the Pan-Asian menu took a more focused, Filipino direction. The strongest dishes here are like glow-ups of traditional homestyle plates, like sweet pork tocino that’s transformed into an outrageously succulent pork tomahawk steak with a beet glaze. Short rib subs in for oxtail in a more meatier riff on kare kare, a rich, peanutty Filipino curry. Eating these soulful dishes while dressed in your finest in what feels like an old-fashioned steakhouse never gets old.
