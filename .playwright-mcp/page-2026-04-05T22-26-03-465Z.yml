                - generic [ref=e779]:
                  - paragraph [ref=e781]: The deep sea mural outside the original Pacific Beach location of Oscar’s Mexican Seafood is a San Diego landmark for torta lovers and fish taco aficionados. The small storefront, usually crowded with people hunched over red plastic trays, carries the spirit of Oscar’s food truck roots, with a line of loyal regulars and a multitasking cashier calling out names and scooping citrusy ceviche into plastic cups. The atun adobado taco, marinated al pastor style and dotted with pineapple chunks, is a perfect balance of sugar and spice. And if the sea breeze from nearby Tourmaline Beach has you in the mood for surf and turf, the torta de Oscar is loaded with spicy shrimp and skirt steak, plus a layer of tender smoked fish.
