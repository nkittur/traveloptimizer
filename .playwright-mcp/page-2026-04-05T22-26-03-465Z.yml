                  - generic [ref=e2688]:
                    - paragraph [ref=e2690]: Kettner Exchange might be the only clubstaurant in San Diego with legitimately good food. If you don’t want to party in a cabana on the raucous patio, grab a quieter booth and grab a Pig Mac that swaps pork belly for beef and folds the lot into a steamed Asian bun with a cartoon pig face made out of dough on the side. Or dig into assertively numbing and spicy Szechuan frog legs, and a giant duck meatball that outshines most Italian restaurants. The best perch of all is at the chef’s table, hidden behind the expansive and immaculate kitchen, where the restaurant hosts monthly six-course, off-menu dinners for just eight guests.
