                - generic [ref=e2101]:
                  - paragraph [ref=e2103]: If there was ever a brunch worth driving 30 minutes and then lining up for, this is it. Atelier Manna is fine-dining in the daytime, but instead of a stuffy dining room you’re kicking back on a breezy patio with people in workout gear and their bandana-wearing dogs. Make sure to get the torrijas for the table—this imposingly tall, Spanish version of French toast has a custardy middle and a shatteringly crisp exterior, which might be topped with strawberries in spring or stone fruit in summer. When it comes to eggs, the highlight is cilbir, Turkish-style poached eggs set on a swath of herby yogurt and topped with chili garlic butter. There are no mimosas—or any alcohol—on offer, but the tea-based vitality tonics are compelling enough to forgo a boozy brunch just this once.
