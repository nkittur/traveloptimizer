                  - generic [ref=e1105]:
                    - paragraph [ref=e1107]: Kingfisher is transportive on every level. Cocooned in gilded wallpaper, the dramatically-lit dining room is a glittering backdrop for its menu of Vietnamese-French food, like a spicy spin on beef tartare with thai chiles and crispy shallots that reimagines the bistro classic. There’s also a show-stopping platter of dry-aged seared duck breast and confit duck leg that usually sells out before the end of the night, and a flan cloaked in Vietnamese coffee syrup, one of the city’s best desserts. The drink menu is worth its own review, but we’ll stop at the Saigon Moped, a mix of gin, debitterized bitter melon, perilla, and lime that makes a perfect sidecar for the salt-and-pepper fish belly snack that’s served only at the bar.
