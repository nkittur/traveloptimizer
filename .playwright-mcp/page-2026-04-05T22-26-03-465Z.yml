                  - generic [ref=e3315]:
                    - paragraph [ref=e3317]: This three-level North Park hub has the backing of Padres ace pitcher Joe Musgrove, who signed on after eating at one of the sister restaurants in Baja. Have an aperitif at the rooftop oyster bar before heading downstairs, where you can choose between a seven-course tasting menu at the chef’s counter that bellies up to the kitchen, or a lower-key prix fixe in the dining room. Either way, spring for the seafood tower add-on, which includes abalone, clam ceviche, and sea urchin toast if it’s available. And you should always pick the quail, which is the chef’s specialty—however it’s prepared, you need it on your table. The wine pairing is a great way to explore Mexico’s magical Valle de Guadalupe by the glass.
