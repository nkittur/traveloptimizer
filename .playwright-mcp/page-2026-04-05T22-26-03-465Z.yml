                    - paragraph [ref=e1459]: The fine-dining-factory atmosphere at Trust is familiar—concrete floors, exposed ventilation—but the menu throws a curveball. American staples like honey-butter hush puppies rub elbows with Asian-leaning dishes like lemongrass and thai chili-infused crab fried rice, though this isn’t a jack of all trades, master of none situation. The char siu glazed brisket is like elite Hong Kong BBQ, slow-cooked for 36 hours (and disappearing from your table within five minutes). Coal-roasted carrots are nestled on a bed of pistachio butter that’ll make you wonder why more places don’t pair the two. And while the food selection spans continents, the cocktails bring it back home. They’re named for different Balboa Park locales, including the Florida Canyon’s citrus blast or the savory heat of the poblano-and-jalapeño-infused Panama Fountain.
