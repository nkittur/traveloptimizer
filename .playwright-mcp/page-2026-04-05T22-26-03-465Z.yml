                    - text: ’s portrait hangs on the wall of the loft-like dining room, where the wood-fired oven action is visible from every seat, and the menu is stacked with takes on famous pies, including a gourmet version of Costco’s classic combo supreme spruced up with fancy Ezzo pepperoni and housemade fennel sausage. The gooey grandma-style crust is the best base for Tribute’s impressive ode to Brooklyn joint
