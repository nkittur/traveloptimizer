                - generic [ref=e421]:
                  - paragraph [ref=e423]: "This corner spot in Barrio Logan makes the best fish tacos in San Diego. You’ll see a line down the block before it opens at noon, as the staff haul in seafood caught off the coast that very same morning. All those people are chomping at the bit for their first bite of Fish Guts’ baja style tacos: ultra-crunchy, Modelo-soaked beer batter gives way to melty whitefish, with a pico de gallo-infused coleslaw to contrast. (And the baja shrimp tacos come with a fun layer of crunchy coconut shards.) Wash down the meal with a smoky mango margarita and watch the lowriders parade past on Logan Avenue. The shop closes when the fish is sold out—which is often way before closing time—so don’t try to sneak in at the last minute."
