                  - generic [ref=e857]:
                    - paragraph [ref=e859]: You might feel like a character in Midnight Diner entering Yakitori Tsuta’s unmarked door in a Convoy strip mall. Behind the six-seat dining counter, the chef carefully flips and turns round after round of skewers, all chicken, as tendrils of smoke rise up from the binchotan charcoal-fueled grill. Highlights include wings deconstructed to allow every inch of skin to render and crisp, juicy bonjiri (aka chicken butt), and a meatball so tender it’s a wonder that it stays on the stick. You can order a la carte or omakase—the latter includes non-skewered bangers like Chino Farm vegetables paired with homemade black sesame tofu, and a rich, deeply chickeny (of course) bowl of ramen.
