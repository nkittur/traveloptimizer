                  - generic [ref=e3166]:
                    - paragraph [ref=e3168]: Don’t be fooled by the cowhide chairs or the steer skull hanging on the wall—you have not wandered into a Cormac McCarthy novel. Welcome to Cowboy Star, a steakhouse bringing the Wild West to the East Village, right down to the giant spur-shaped door handle. If you’re looking to indulge your cowboy fantasy and tear into a tender, juicy hunk of ribeye, you’ll leave happy, but even the parker house rolls, bronzed from the oven, are amazing. And the roasted brussels sprouts come studded with diced apple—a surprising but inspired pairing. It might be tempting to continue the night with a mechanical bull ride in the Gaslamp, but probably not after all that food.
