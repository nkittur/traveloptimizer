                    - paragraph [ref=e1227]: Set a calendar reminder to book Soichi’s sushi omakase—reservations disappear within minutes of their monthly release at noon on the first day of each month. With a warm wabi-sabi aesthetic, this Adams Avenue restaurant offers takeout and a la carte options, but its main attraction is a $189 omakase with a dozen rounds of nigiri (and often, rarer cuts). Think silky gizzard shad marinated in a homemade vinegar sauce, or engawa, a prized portion of muscle from the fin of a flatfish. If you eat here more than a few times, it’s likely that the lineup will be tailored to your tastes. And if it’s your birthday, there’s a good chance that the chef might just grab his guitar and serenade you.
