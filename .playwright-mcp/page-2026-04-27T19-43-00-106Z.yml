            - heading "Itinerary" [level=2] [ref=e221]
            - paragraph [ref=e222]: Friday
            - figure "scoop-picture" [ref=e224]:
              - img "A toddler peers through a hole in a concrete block on display in a modern-looking museum space. On a table is a display of miniature buildings." [ref=e228]
              - generic [ref=e229]: Danish Architecture Center
            - generic [ref=e230]:
              - generic [ref=e231]: 4 p.m. Examine Danish architecture
              - generic [ref=e232]:
                - text: Copenhagen’s once-industrial harbor is today a welcoming public space with an eight-mile pedestrian-and-cycling
                - link "path" [ref=e233] [cursor=pointer]:
                  - /url: https://www.visitcopenhagen.com/copenhagen/planning/harbour-circle-gdk1117372
                - text: looping past swimming areas, playgrounds, the postcard-perfect Nyhavn canal and modern architectural landmarks. Find the
                - link "Danish Architecture Center" [ref=e234] [cursor=pointer]:
                  - /url: https://dac.dk/en/
                - text: ", or DAC, inside one of those landmarks: the multi-use"
                - link "Blox" [ref=e235] [cursor=pointer]:
                  - /url: https://blox.dk/english/
                - text: building which resembles a stack of greenish glass boxes. In March, DAC unveiled its first permanent exhibition, “So Danish!,” an engaging introduction to the country’s influential architectural designs from the Viking Age to present day, with plenty of Arne Jacobsen functionalism along the way. The current third-floor exhibition, “Copenhagen in Common” (through Oct. 22), investigates how the city employs architecture to improve the lives of locals. Don’t miss the rooftop with views across the harbor, or the option to exit via a thrilling, four-story spiral slide (DAC admission, 115 Danish kroner, or about $17).
            - generic [ref=e236]:
              - generic [ref=e237]: 7 p.m. Feast on seasonal fare
              - generic [ref=e238]:
                - text: In a city where so many restaurants tout their chefs’ Michelin-studded resumes, it’s refreshing to discover
                - link "Nr.30" [ref=e239] [cursor=pointer]:
                  - /url: https://nr30.dk/
                - text: . In a former butcher shop in the Indre By district, this unpretentious restaurant is the neighborhood hangout you wish would open on your block, with easygoing servers, a convivial atmosphere and an excellent (and well-priced) wine list. A recent meal during Denmark’s fleeting asparagus season meant that stalks appeared in a third of the dishes, including pan-fried turbot with tender white asparagus and a creamy langoustine sauce. But best was the tartare of farm-raised beef with burnt leeks and crisp bits of rye. Dinner for two, without drinks, about 600 kroner.
            - figure "scoop-picture" [ref=e241]:
              - img "Two people dressed in drag performing on stage. They both wear blond wigs in an up-do and tight dresses, one in green and one in hot pink." [ref=e245]
              - generic [ref=e246]: Folkehuset Absalon
            - generic [ref=e247]:
              - generic [ref=e248]: 11 p.m. Dance to the music
              - generic [ref=e249]:
                - text: On a tree-lined boulevard in the Vesterbro neighborhood,
                - link "Folkehuset Absalon" [ref=e250] [cursor=pointer]:
                  - /url: https://absaloncph.dk/en/
                - text: is a welcoming community house in a deconsecrated brick church where the neighborhood gathers for morning yoga, ceramics and dance classes, weekly bingo, drag shows and nightly communal dinners. But come after dark when the color-splashed nave hosts themed parties (often free) with crowds dancing to Danish disco and pop hits beneath the steepled ceiling. If there’s no event on the
                - link "schedule" [ref=e251] [cursor=pointer]:
                  - /url: https://absaloncph.dk/en/calender/
                - text: ", your backup is"
                - link "Bird." [ref=e252] [cursor=pointer]:
                  - /url: https://birdcph.dk/
                - text: This laid-back cocktail bar, just farther north in Frederiksberg, is known for its vinyl collection and invites musicians and D.J.s to steer the weekend playlists. Whether it’s jazz classics, hip hop or soul, slide into a blond-wood booth and start with a margarita made with orange bitters and vermouth flavored with sea buckthorn berries (130 kroner).
          - figure "scoop-picture" [ref=e253]:
            - img "People swim next to a wooden-plank pier in calm water on a sunny day. Others are sunbaking on the pier." [ref=e257]
            - generic [ref=e258]: Refshaleøen, a former shipyard, attracts crowds with its fine-dining restaurants and street-food markets, contemporary galleries and La Banchina, an idyllic waterside wine bar with a swimming area and sauna.
