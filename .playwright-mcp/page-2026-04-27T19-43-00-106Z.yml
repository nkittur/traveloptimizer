              - generic [ref=e270]: 9 a.m. Explore the new Nordhavn
              - generic [ref=e271]:
                - text: Copenhagen is often commended for its focus on sustainability, but what does that mean in practice? To find out, head to Nordhavn (North Harbor), an industrial area being transformed into a series of waterfront neighborhoods packed with glass-and-steel architecture, climate-neutral housing and clever green spaces. From the Nordhavn metro, which opened in 2020, walk to
                - link "Konditaget Lüders" [ref=e272] [cursor=pointer]:
                  - /url: https://www.visitcopenhagen.com/copenhagen/planning/konditaget-luders-gdk1091081
                - text: ", a rooftop playground atop a multi-story car park with panoramic views of the harbor and distinctive architectural marvels such as the"
                - link "Portland Towers" [ref=e273] [cursor=pointer]:
                  - /url: https://www.visitcopenhagen.com/copenhagen/planning/portland-towers-gdk1095316
                - text: ","
                - link "the Silo" [ref=e274] [cursor=pointer]:
                  - /url: https://dac.dk/en/knowledgebase/architecture/the-silo-2/
                - text: ","
                - link "FN Byen" [ref=e275] [cursor=pointer]:
                  - /url: https://dac.dk/en/knowledgebase/architecture/fn-byen-2/
                - text: and
                - link "CopenHill" [ref=e276] [cursor=pointer]:
                  - /url: https://www.copenhill.dk/en
                - text: ", a sloping power plant with a rooftop ski hill and vertiginous climbing wall. Order a cortado (38 kroner) at the artisan bakery"
                - link "Andersen & Maillard" [ref=e277] [cursor=pointer]:
                  - /url: https://www.andersenmaillard.dk/
                - text: ", then continue to the"
                - link "Sandkaj harbor bath" [ref=e278] [cursor=pointer]:
                  - /url: https://svoemkbh.kk.dk/sandkaj
                - text: ", a popular spot for swimming and sunbathing with a wide wooden boardwalk along the water."
            - generic [ref=e279]:
              - generic [ref=e280]: 11 a.m. Discover Danish design
              - generic [ref=e281]:
                - text: Architecture may be the prevalent theme this year, but for a peek at design on a smaller scale, visit
                - link "Designmuseum Danmark" [ref=e282] [cursor=pointer]:
                  - /url: https://designmuseum.dk/en/
                - text: (admission, 130 kroner). In 2022, this storied museum in the historic Frederiksstaden district reopened after an extensive, two-year renovation — a delicate undertaking for an institution designed in the 1920s by the grandfather of Danish modern design, Kaare Klint, and housed in an 18th-century, Rococo-style building (a former hospital where the philosopher Søren Kierkegaard died in 1855). Explore wide-ranging exhibitions covering the spectrum from how design can address challenges such as climate change, to the development of Danish silver craftsmanship, to the history of Modernism’s influential furniture, lighting and interior designs.
            - figure "scoop-picture" [ref=e284]:
              - img "People shop in a clothing store that has retro-looking designs. The walls are painted in block colors of bright orange and blue." [ref=e288]
              - generic [ref=e289]: Tootsie
            - generic [ref=e290]:
              - generic [ref=e291]: 1:30 p.m. Shop these blocks
              - generic [ref=e292]:
                - text: The charming lane Værnedamsvej has been called “Little Paris,” but
                - link "Italo Caffé" [ref=e293] [cursor=pointer]:
                  - /url: https://www.instagram.com/italocaffe_/?hl=en
                - text: ", which opened there last year, is resolutely Italian. Stop for a panino — best is the thin-sliced octopus with grilled peppers, crisp greens and pesto on fluffy focaccia (110 kroner). Then pop around the corner to"
                - link "Thiemers Magasin" [ref=e294] [cursor=pointer]:
                  - /url: https://www.thiemersmagasin.dk/
                - text: ", an independent bookstore with an English-language section well-stocked with Danish authors. Down the block,"
                - link "CAN Family" [ref=e295] [cursor=pointer]:
                  - /url: https://www.yeswecancan.com/
                - text: is the place to unearth rare vinyl from the collector Martin Aalykke Kristiansen as well as paintings and ceramics made by his wife, Stine Maria Aalykke. Next door,
                - link "Shrig Shop" [ref=e296] [cursor=pointer]:
                  - /url: https://shrigshop.com/
                - text: stocks limited-edition prints, posters and postcards with whimsical illustrations from the British artist David Shrigley. For mint-condition designer vintage, cross the street to
                - link "Tootsie" [ref=e297] [cursor=pointer]:
                  - /url: https://www.facebook.com/tootsiecph/
                - text: ", or visit"
                - link "IBlameLULU" [ref=e298] [cursor=pointer]:
                  - /url: https://iblamelulu.com/en
                - text: ", a nearby shop that often has recent-season voluminous dresses from the Danish rising-star designer Cecilie Bahnsen."
            - figure "scoop-picture" [ref=e300]:
              - img "A person walks in an opulent museum space with geometric-patterned floors. Roman-style statues are on display on plinths between rows of columns." [ref=e304]
              - generic [ref=e305]: Glyptoteket
            - generic [ref=e306]:
              - generic [ref=e307]: 4:30 p.m. Choose your art adventure
              - generic [ref=e308]:
                - text: One could spend an entire weekend exploring art institutions in and around the city, from
                - link "Glyptoteket" [ref=e309] [cursor=pointer]:
                  - /url: https://www.glyptoteket.com/
                - text: with its ancient marble busts and palm-filled Winter Garden, to the
                - link "Louisiana Museum of Art" [ref=e310] [cursor=pointer]:
                  - /url: https://louisiana.dk/en/
                - text: ", with its brilliant Alberto Giacometti collection and seaside sculpture garden just up the coast. When time is limited, prioritize"
                - link "Cisternerne" [ref=e311] [cursor=pointer]:
                  - /url: https://frederiksbergmuseerne.dk/en/cisternerne/
                - text: ", a subterranean exhibition space in Søndermarken park (admission, 115 kroner). Descend into the dark, damp cave — formerly a water reservoir — to experience the current installation by the South Korean artist Kimsooja (through Nov. 30), a series of iridescent screens projected with rays of light. Tread carefully on the over-water walkways that wind past dreamy, ever-changing rainbows and spot-lit stalactites."
            - figure "scoop-picture" [ref=e313]:
              - img "A view of a plate with a neatly presented piece of smørrebrød, cut into a rectangle with sharp edges. It is topped with flowers and small herbs. A glass of wine also rests on the table." [ref=e317]
              - generic [ref=e318]: Selma
            - generic [ref=e319]:
              - generic [ref=e320]: 7:30 p.m. Dine on a Danish classic
              - generic [ref=e321]:
                - text: Danes insist that smørrebrød should be eaten only at lunch — it’s tradition! — but bucking the norm has worked well at
                - link "Selma" [ref=e322] [cursor=pointer]:
                  - /url: https://selmacopenhagen.dk/
                - text: ", the first Copenhagen restaurant specializing in the classic open-faced sandwich to earn a Bib Gourmand in the Michelin Guide. Opened by the Swedish chef Magnus Pettersson, this restaurant serves exquisite seasonal creations (and a non-smørrebrød tasting menu for sticklers). Reserve a table in the cozy dining room, with warm pendant lighting, wooden tables and floral Josef Frank wallpaper, where recent highlights included green-anise-flavored herring on Danish rye topped with petal-like pieces of pearl onion, wild-garlic cream and tiny dollops of herring caviar. To drink, try the housemade aquavit — a bracing local spirit that here is infused with flavors like herbaceous lovage and brown butter — and a draft beer (the restaurant partners with the Copenhagen craft beer pioneer Mikkeller and local microbreweries are well represented). Dinner for two, without drinks, about 700 kroner."
            - generic [ref=e323]:
              - generic [ref=e324]: 10 p.m. Drink up the city
              - generic [ref=e325]:
                - text: After dinner, join Danes for a drink. On a side street in the lively Nørrebro neighborhood,
                - link "Pompette" [ref=e326] [cursor=pointer]:
                  - /url: https://www.instagram.com/pompettecph/?hl=en
                - text: is a local favorite for its well-priced natural wines — 60 kroner a glass — and laid-back vibe. Or head northwest to
                - link "Autopoul" [ref=e327] [cursor=pointer]:
                  - /url: https://www.instagram.com/autopoul/?hl=en
                - text: ", a pop-up bar that opened last year in a former car-repair shop in the Nordvest area, where crowds gather around tables in the old garage and parking lot to sip Danish ciders, vermouth, natural wines and craft beers from the neighborhood’s"
                - link "Flying Couch Brewing" [ref=e328] [cursor=pointer]:
                  - /url: https://flyingcouch.dk/
                - text: .
          - figure "scoop-picture" [ref=e329]:
            - img "A birds-eye view of a European city, with a highway in the foreground and a tall tower with a green spire rising from the buildings farther in the distance." [ref=e333]
            - generic [ref=e334]: Copenhagen was named the UNESCO World Capital of Architecture for 2023. The city has planned a yearlong slate of events, exhibitions and tours of the city’s most innovative architectural projects.
          - generic [ref=e335]: Advertisement
          - generic [ref=e336]:
            - paragraph [ref=e337]: Sunday
            - figure "scoop-picture" [ref=e339]:
              - img "One an outdoor table, a white cardboard box is filled with a variety of pastries, some topped with cream or fruit. A person is holding an iced coffee next to the box." [ref=e343]
              - generic [ref=e344]: Juno the Bakery
            - generic [ref=e345]:
              - generic [ref=e346]: 9:30 a.m. Bike to a bakery
              - generic [ref=e347]:
                - text: An explosion of noteworthy new bakeries —
                - link "Bageriet Benji" [ref=e348] [cursor=pointer]:
                  - /url: https://www.instagram.com/bageriet_benji/?hl=en
                - text: ","
                - link "Albatross og Venner" [ref=e349] [cursor=pointer]:
                  - /url: https://www.albatrossogvenner.dk/
                - text: in the Torvehallerne food market,
                - link "Lille Bakery" [ref=e350] [cursor=pointer]:
                  - /url: https://www.lillegrocery.com/
                - text: and
                - link "Hart Bageri" [ref=e351] [cursor=pointer]:
                  - /url: https://hartbageri.com/
                - text: among them — means you’re never far from a custardy spandauer pastry or a fresh loaf of Danish rye. One that absolutely shouldn’t be missed, however, is
                - link "Juno the Bakery" [ref=e352] [cursor=pointer]:
                  - /url: https://www.instagram.com/juno_the_bakery/
                - text: ", opened by Emil Glaser, a former chef at Noma. On a residential corner in Østerbro, this popular bakery draws customers from across the city for its seasonal rhubarb-vanilla tarts, sweet buns stuffed with pistachio cream and frangipane-filled almond croissants. My go-to order is a buttery cardamom bun and a seeded sourdough roll with butter and cheese. It’s best paired with a creamy cappuccino from the new"
                - link "Prolog" [ref=e353] [cursor=pointer]:
                  - /url: https://www.prologcoffee.com/pages/coffee-bar
                - text: coffee bar that opened nearby in February.
            - generic [ref=e354]:
              - generic [ref=e355]: 11 a.m. Set sail on the harbor
              - generic [ref=e356]:
                - text: Biking may be the preferred mode of transport in this city, but weekend traffic on the harbor suggests boating is a close second. No license or previous experience is required to captain an electric boat that seats up to eight (rentals from
                - link "GoBoat" [ref=e357] [cursor=pointer]:
                  - /url: https://goboat.dk/en/copenhagen
                - text: or
                - link "FriendShips" [ref=e358] [cursor=pointer]:
                  - /url: https://www.friendships.dk/en/boat-rental-christianshavn/
                - text: start at 549 kroner for one hour). Get an early start to beat the birthday parties and bachelorette groups (alcohol is allowed aboard) and putter through the narrow canals of Christianshavn and around Christiansborg Palace, the seat of Danish Parliament. When passing under the Højbro bridge, peer into the depths on the port side to spot the bronze underwater sculptures of “Agnete and the Merman,” by the Danish artist Suste Bonnén.
            - figure "scoop-picture" [ref=e360]:
              - img "A person sits in an outdoor sauna with a rounded, wooden roof. A large open portal looks out onto hanging greenery and a calm body of water." [ref=e364]
              - generic [ref=e365]: La Banchina
            - generic [ref=e366]:
              - generic [ref=e367]: 1:30 p.m. Hop around Refshaleøen
              - generic [ref=e368]:
                - text: Back on land, follow the stream of people headed north toward Refshaleøen, a rough-edged industrial area and former shipyard that today houses creative start-ups, fine-dining restaurants and much more. Many go directly to
                - link "Reffen" [ref=e369] [cursor=pointer]:
                  - /url: https://reffen.dk/en/
                - text: ", a street-food market with stalls in old shipping containers and tons of seating beside the harbor. Instead, stop at"
                - link "Copenhagen Contemporary" [ref=e370] [cursor=pointer]:
                  - /url: https://copenhagencontemporary.org/en/
                - text: for large-scale art exhibitions, including a glowing James Turrell installation (admission, 120 kroner). Grab something sweet at
                - link "Lille Bakery" [ref=e371] [cursor=pointer]:
                  - /url: https://www.lillegrocery.com/
                - text: ", or pop into"
                - link "Hart Bageri" [ref=e372] [cursor=pointer]:
                  - /url: https://hartbageri.com/
                - text: ", which opened this location in May, for a sticky bun made from leftover scraps of croissant dough. Then visit"
                - link "Mikkeller Baghaven" [ref=e373] [cursor=pointer]:
                  - /url: https://mikkeller.com/locations/mikkeller-baghaven
                - text: to sample spontaneously fermented sour beers — maybe a peachy Pántáo wild ale? (60 kroner) — or sunbathe on the pier at
                - link "La Banchina" [ref=e374] [cursor=pointer]:
                  - /url: https://www.labanchina.dk/
                - text: ", an idyllic waterside wine bar with a swimming area and sauna."
