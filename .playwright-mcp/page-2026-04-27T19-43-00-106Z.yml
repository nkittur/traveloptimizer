              - generic [ref=e87]: Ingrid K. Williams is a regular contributor to the Travel section. She lives part-time in Stockholm and has covered Scandinavia since 2010.
            - paragraph [ref=e88]:
              - text: For decades, Copenhagen has been lauded for its design, its food, its dedication to sustainability, even the general
              - link "good cheer" [ref=e89] [cursor=pointer]:
                - /url: https://edition.cnn.com/travel/article/worlds-happiest-countries-2022-wellness/index.html
              - text: of its residents. But this year, architecture is the focus after UNESCO named the city the World Capital of Architecture for 2023. What that means for visitors is a yearlong
              - link "slate" [ref=e90] [cursor=pointer]:
                - /url: https://arkitekturhovedstad.kk.dk/en/program
              - text: of events, exhibitions and tours of the city’s most innovative architectural projects. To maximize a trip, travelers this year need two companions. First is the
              - link "new free app" [ref=e91] [cursor=pointer]:
                - /url: https://dac.dk/en/city-walks/app/
              - text: from the Danish Architecture Center with in-depth details about hundreds of notable sites. And second, as always, a bike to crisscross this dynamic, ever-evolving Scandinavian capital. Because one thing that will never change is the Danes’ devotion to cycling, a true joy in a place as bike-friendly (and flat) as Copenhagen on these blissfully long summer days.
