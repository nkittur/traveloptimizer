                      - /url: https://www.innbythebay.com/
                  - text: is a more affordable mainstay. Guest rooms and event spaces in this 239-room hotel, built in 1973, have been renovated since 2020. The location is convenient — a block from the Portland Museum of Art — and room rates start around $160.
                - listitem [ref=e165]:
                  - text: While regulated Airbnbs are allowed in Portland,
                  - strong [ref=e166]: short-term rentals
                  - text: can be hard to find in summer months. With advance planning, look in Munjoy Hill, for easy access to the Eastern Promenade. To expand your search, consider staying in South Portland, just across the Casco Bay Bridge.
            - generic [ref=e167]:
