                  - strong [ref=e155]:
                    - link "The Longfellow Hotel" [ref=e156] [cursor=pointer]:
                      - /url: https://www.longfellowhotel.com/
                  - text: ", named after Henry Wadsworth Longfellow, Portland’s most famous poet, opened in May, with 48 guest rooms and a"
                  - link "spa" [ref=e157] [cursor=pointer]:
                    - /url: https://www.longfellowhotel.com/spa/
                  - text: on the edge of the historic West End neighborhood. A bar named for Longfellow’s five-man literary group, the Five of Clubs, is the lobby’s focal point. Rooms start at $499, higher during the summer season.
                - listitem [ref=e158]:
                  - strong [ref=e159]:
                    - link "Canopy by Hilton on the Portland Waterfront" [ref=e160] [cursor=pointer]:
                      - /url: https://www.hilton.com/en/hotels/pwmoppy-canopy-portland-waterfront/
                  - text: "opened in 2021 and has one feature that truly sets it apart: a year-round rooftop bar, called"
                  - link "Luna" [ref=e161] [cursor=pointer]:
                    - /url: https://lunarooftopbarmaine.com/
                  - text: ", where you can watch the sky over the Fore River change colors in the evening. With 135 rooms, it sits on a quieter block on Commercial Street, a tourist destination for shopping, dining and exploring the waterfront. Rooms start at $399 during the warmer months, higher for a water view."
                - listitem [ref=e162]:
                  - text: The
                  - strong [ref=e163]:
