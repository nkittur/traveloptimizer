                - listitem [ref=e171]:
                  - text: Many attractions on the Portland peninsula are within walking distance of one another. Greater Portland Metro’s bus service offers connections to the Portland Transportation Center, with
                  - strong [ref=e172]: bus
                  - text: and
                  - strong [ref=e173]: train
                  - text: service from Boston and other points, and also runs a route that circles most of the peninsula. A single ride for most adults is $2. Be sure to check for
                  - link "updated schedules" [ref=e174] [cursor=pointer]:
                    - /url: https://gpmetro.org/35/
                  - text: .
                  - strong [ref=e175]: Uber
                  - text: and
                  - strong [ref=e176]: Lyft
                  - text: offer generally reliable service. The city has a
                  - strong [ref=e177]: biking
                  - text: culture but a long way to go in developing
                  - link "bike lanes" [ref=e178] [cursor=pointer]:
                    - /url: https://www.portlandmaine.gov/699/Bicycle-Pedestrian-Planning
                  - text: . Those who travel by
                  - strong [ref=e179]: car
                  - text: should read parking lot signs carefully, as ticketing can be aggressive.
          - heading "Itinerary" [level=2] [ref=e180]
          - generic [ref=e181]:
            - heading "Friday" [level=2] [ref=e182]
            - generic [ref=e183]:
              - generic [ref=e184]: 4 p.m. Wander Washington Avenue
              - paragraph [ref=e186]:
                - text: A four-block stretch of Washington Avenue is a food hub good for shopping as well as eating. Start your stroll at
                - link "Onggi" [ref=e187] [cursor=pointer]:
                  - /url: https://onggi.com/
                - text: ", a fermentation market and cafe, where shelves are stocked with sake, chili crisp, pickled blueberries and more. Buy a hojicha-butterscotch oat cookie ($3.25 each) to enjoy as you wander south to browse high-end kitchenware and Maine-made home goods at"
                - link "Strata" [ref=e188] [cursor=pointer]:
                  - /url: https://strataportland.com/
                - text: and
                - link "Post Supply" [ref=e189] [cursor=pointer]:
                  - /url: https://www.thepostsupply.com/
                - text: ", found inside what once was the J.J. Nissen bakery, where the New England top-split hot dog bun was created. On the way: The repurposed shipping containers at"
                - link "the Black Box" [ref=e190] [cursor=pointer]:
                  - /url: https://www.tbbwashington.com/
                - text: ", which serve as five tiny shops with month-to-month leases. Arriving in July is a pop-up version of"
                - link "Rabelais" [ref=e191] [cursor=pointer]:
                  - /url: https://www.rabelaisbooks.com/
                - text: ", a renowned seller of rare food-and-drink books."
            - generic [ref=e193]:
              - img "A person wearing a maroon dress arranges a displays of homewares on a wooden table inside a store." [ref=e195]
              - paragraph [ref=e198]: Post Supply
            - generic [ref=e199]:
              - generic [ref=e200]: 6 p.m. Enjoy comfort food
              - paragraph [ref=e202]:
                - text: On to the eating, but how to choose? Texas-style barbecue is served on
                - link "Terlingua’s" [ref=e203] [cursor=pointer]:
                  - /url: http://www.terlingua.me/
                - text: sprawling back decks (one pound of house-smoked meats with a side, cornbread and pickles, $35), while sake and shared plates, such as fried tofu with jalapeño soy sauce and bonito ($7) or sautéed udon noodles with duck breast and vegetables ($15) can be found at
                - link "Izakaya Minato" [ref=e204] [cursor=pointer]:
                  - /url: https://www.izakayaminato.com/
                - text: .
                - link "Công Tử Bột" [ref=e205] [cursor=pointer]:
                  - /url: http://www.congtubot.com
                - text: offers a warm welcome, with Vietnamese food ordered family style, great cocktails and a buzzy dining area that’s especially pleasant when the garage-style doors are open. Try the salad of puffed rice, oyster mushrooms and “pickled stuff” dressed with chile oil ($17) or the twice-cooked eggplant ($14). Leave room for chè chuối, a dessert of tapioca, coconut and banana that is more than the sum of its parts ($11).
            - generic [ref=e206]:
              - generic [ref=e207]: 7:30 p.m. Savor the sunset, then settle with a beer or cider
              - paragraph [ref=e209]:
                - text: After dinner, take a short stroll up Munjoy Hill, which dominates the eastern end of the city’s peninsula, to enjoy not one but two incredible views. At the end of Marion Street, follow the stone steps up to Fort Sumner Park, which looks west over Portland’s Back Cove. On a clear day, you can see the peak of Mount Washington and an exceptional sunset. From there, walk up Quebec Street to arrive at the Eastern Promenade, a 78-acre park that looks east over Casco Bay. Lounge on the grass or head back downhill on Congress Street to sit outside at
                - link "Oxbow" [ref=e210] [cursor=pointer]:
                  - /url: https://oxbowbeer.com/location/portland/
                - text: ", one of the many Maine breweries that make beer in Portland or have outposts here, or choose from a long list of ciders on tap (from $7.50) at the Basque-inspired"
                - link "Anoche" [ref=e211] [cursor=pointer]:
                  - /url: http://anoche.co/
                - text: .
            - generic [ref=e213]:
              - img "People sit at wooden stools inside a bar." [ref=e215]
              - paragraph [ref=e218]: Anoche
          - generic [ref=e219]:
            - img "People sit on a deck under umbrellas outside a restaurant with a sign that reads \"OYSTERS\" in painted letters." [ref=e221]
            - paragraph [ref=e224]: A four-block stretch of Washington Avenue is known for good shopping as well as good eating, including at places like Island Creek Oysters.
          - generic [ref=e225]: Advertisement
          - generic [ref=e226]:
            - heading "Saturday" [level=2] [ref=e227]
            - generic [ref=e228]:
              - generic [ref=e229]: 8 a.m. Breakfast in a colorful spot
              - paragraph [ref=e231]:
                - link "Ugly Duckling" [ref=e232] [cursor=pointer]:
                  - /url: https://www.uglyducklingmaine.com/
                - text: ", which opened in 2023 with a big U-shaped counter and a come-as-you-are vibe, is the latest project by Ilma Lopez and Damian Sansonetti, owners of the nearby Spanish-French brasserie Chaval. Breakfast sandwiches come on housemade English muffins. The No. 2, which includes two fried eggs, house pork sausage, American cheese and ketchup, is a popular order ($11.75). You might need a fork to finish the Como Se Dice Buongiorno ($12.75): fried egg, hash brown, prosciutto, jalapeño, arugula and garlic aioli on an English muffin with everything-bagel seasoning."
            - generic [ref=e234]:
              - img "Two people sit on orange plush seats at a round white table inside a cafe." [ref=e236]
              - paragraph [ref=e239]: Ugly Duckling
            - generic [ref=e240]:
              - generic [ref=e241]: 10:15 a.m. Ride the ferry
              - paragraph [ref=e243]:
                - text: Catch the 10:15 a.m. boat to Peaks Island at the
                - link "Casco Bay Lines" [ref=e244] [cursor=pointer]:
                  - /url: https://www.cascobaylines.com/
                - text: "ferry terminal on Commercial Street. The island, with nearly 1,000 year-round residents, was once home to an amusement park and now has a no-shoes-required vibe. Part of the city of Portland, it sits just three miles offshore but feels much farther. During the 17-minute trip (from April to October: $14 roundtrip for adults, $7 for seniors and children), take in a view of Portland from the water, watch for harbor seals and pass by Fort Gorges, a formidable granite military fort built in the mid-19th century and now a frequent host to"
                - link "kayak tours" [ref=e245] [cursor=pointer]:
                  - /url: https://www.portlandpaddle.net/tours/fort-gorges-sea-kayak-trip/
                - text: and history buffs.
            - generic [ref=e246]:
              - generic [ref=e247]: 10:45 a.m. Explore Peaks on two wheels, then grab a pie
              - paragraph [ref=e249]:
                - text: You can explore the island by foot, but a bike is handy to make the nearly four-mile loop around the perimeter. Bring your own on the ferry for an extra fee ($7 adult, $3.50 children), or rent one from
                - link "Brad & Wyatt’s Island Bike Rental" [ref=e250] [cursor=pointer]:
                  - /url: https://maps.app.goo.gl/vj1T2raoQCzB29Y18
                - text: ($20 for two hours, $30 for four hours — rentals are first-come, first-served, no website). You’ll find great spots for exploring the rocks on the east side of the island, with views of the Atlantic Ocean. Before catching the return ferry, circle back to
                - link "Il Leone" [ref=e251] [cursor=pointer]:
                  - /url: https://illeone.me/
                - text: for salad and pizza cooked in a wood-fired oven and eaten at a shady picnic table. The menu typically includes at least one pie that follows the harvest, highlighting Maine-grown garlic scapes, heirloom tomatoes or squash blossoms (pizzas start at $17.95).
            - generic [ref=e253]:
              - img "A top-down view of a pizza that has chunks of lobster on top." [ref=e255]
              - paragraph [ref=e258]: Il Leone
            - generic [ref=e259]:
              - generic [ref=e260]: 4 p.m. Hunt for treasure
              - paragraph [ref=e262]:
                - text: Think of an indoor flea market and you might imagine rows of booths, some full of beauty, others full of dust. Back on the mainland,
                - link "Open House" [ref=e263] [cursor=pointer]:
                  - /url: https://www.openhouseportland.com/
                - text: instead arranges furniture in cozy living-room vignettes throughout its 10,000-square-foot shop on Congress Street, which has a large selection of vintage clothing and handcrafted goods. Items range in price from $5 for packable trinkets to a few thousand dollars for midcentury-modern antiques. And the owners welcome browsers — no stuffy gatekeepers here.
            - generic [ref=e265]:
              - img "A person wearing a denim jacket and a straw shoulder bag crouches down to inspect a wooden side table in a furniture store." [ref=e267]
              - paragraph [ref=e270]: Open House
            - generic [ref=e271]:
              - generic [ref=e272]: 5 p.m. Find a good book
              - paragraph [ref=e274]:
                - text: Maine has a rich literary past and present — for starters, Stephen King and Lois Lowry live and write in the state. In Portland, used, independent and specialty bookstores abound. Linger in the beautiful children’s section at
                - link "Back Cove Books" [ref=e275] [cursor=pointer]:
                  - /url: https://backcovebooks.com/
                - text: ", in the Woodfords Corner neighborhood, which displays its biographies and current affairs books in an old bank vault. Or visit"
                - 'link "Print: A Bookstore" [ref=e276] [cursor=pointer]':
                  - /url: https://www.printbookstore.com/
                - text: ", with its expertly curated staff picks and a large section highlighting Maine writers. Both shops draw an impressive slate of author readings and other events each month, so check their calendars online."
            - generic [ref=e277]:
              - generic [ref=e278]: 6:30 p.m. Eat from the sea
              - paragraph [ref=e280]:
                - text: Plenty of restaurants in Portland serve lobster, but few get you as close to the lobster boat as
                - link "Luke’s Lobster" [ref=e281] [cursor=pointer]:
                  - /url: https://lukeslobster.com/pages/portland-pier
                - text: ", a lobster-shack chain that has a full-service restaurant on the end of Portland Pier, off Commercial Street. The two-story restaurant, with a view of the Fore River as it meets Casco Bay, sits next to the company’s commercial lobster-buying facility, where lobster boats dock to sell their catch, some of which goes directly to the kitchen. (No reservations during the peak summer season.) Or reserve a table at"
                - link "Bar Futo" [ref=e282] [cursor=pointer]:
                  - /url: https://www.eatfuto.com/
                - text: in the Old Port to try skewers of squid, fish, pork belly or chicken ($7 to $9 each) grilled over binchotan, or Japanese charcoal, alongside a perfectly carbonated whiskey highball made with
                - link "a Suntory Toki machine" [ref=e283] [cursor=pointer]:
                  - /url: https://distiller.com/articles/toki-highball-machine
                - text: ($14).
            - generic [ref=e284]:
              - generic [ref=e285]: 8 p.m. Listen to the local sound
              - paragraph [ref=e287]:
                - text: Portland’s go-to venue for summer concerts by nationally touring artists is
                - link "Thompson’s Point" [ref=e288] [cursor=pointer]:
                  - /url: https://www.thompsonspoint.com/
                - text: ", an outdoor stage near the bank of the Fore River. Included in the 2024 lineup are Goose, Counting Crows and Dark Star Orchestra. But"
                - link "One Longfellow Square" [ref=e289] [cursor=pointer]:
                  - /url: https://onelongfellowsquare.com/
                - text: ", in the West End with 180 seats, has a cozy feel that lends itself well to the folk and roots music that makes up most of its shows. Ticket prices vary but start around $20. Just half a block away is"
