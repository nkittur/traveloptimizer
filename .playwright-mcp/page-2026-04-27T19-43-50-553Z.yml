              - paragraph [ref=e61]: Chelsea Conaboy is a writer and editor who lives near Portland.
              - time [ref=e62]: June 20, 2024
            - paragraph [ref=e63]:
              - text: From the fishing piers and wharves lined up like piano keys along Commercial Street to the ocean views and historic Queen Anne-style homes atop Munjoy Hill, Portland offers a lot for visitors to take in. And then there is the food. Maine's largest city has long been nationally known as a top food destination, and just this year
              - link "two Portland bakers won" [ref=e64] [cursor=pointer]:
                - /url: https://www.pressherald.com/2024/06/10/four-maine-restaurants-and-chefs-up-for-james-beard-awards-tonight/
              - text: James Beard Awards. To host travelers, culinary or otherwise, five boutique hotels have opened since 2020. The hotel construction, new high-end condo development and rising coastal real estate prices have exacerbated a housing crisis here. But the elements that make this New England city such an attractive place to visit — a dynamic creative economy, juxtaposition of the old and the new, and the distinctive character of a working waterfront — endure.
