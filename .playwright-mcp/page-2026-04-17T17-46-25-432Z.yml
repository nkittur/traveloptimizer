                - paragraph [ref=e244]: For late-night Korean food cravings, BCD is the place to be. Even with 11 locations across Southern California, the restaurant still relies on its original family recipes for its spicy, piping-hot bowls of silken tofu stew made with organic, non-GMO tofu. The combo options make for a hefty meal and are perfect for those who want to complement their soon tofu with grilled marinated meats like bulgogi or galbi.
