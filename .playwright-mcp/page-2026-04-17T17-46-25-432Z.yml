                - paragraph [ref=e543]: Breakfast Republic has locations throughout Southern California, where they’re serving classic brunch dishes — like benedicts, omelets, pancakes, and french toast — with a twist. The Oreo cookie pancakes come with a decadent cream filling and Oreo crumble, while their shrimp and grits breakfast plate consists of gouda cheese-infused grits and shrimp cooked with hot sauce, sweet corn, chives, and eggs. The drinks are also crowd pleasers, as Breakfast Republic offers an array of local craft beer and kombucha on draft.
