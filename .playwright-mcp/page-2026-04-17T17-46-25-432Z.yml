                  - paragraph [ref=e442]: Near John Wayne Airport and just a short drive off campus, Avocado Cafe is a quaint spot that will satisfy sandwich cravings and is a great option if looking for a quick, nutritious meal. Though all the sandwiches are filling and fresh, the standouts are the Tower 9, Kissell, and Chuy. Pair them with a smoothie or juice, or turn it into a combo meal to enjoy with a cup of soup or a side salad.
