                      - img "Link" [ref=e667]
                  - paragraph [ref=e669]: Hailing from Seoul, Korea as one of the most popular street food spots, Yup Dduk currently has outposts in both LA’s Koreatown and Irvine. The restaurant is known for its ultra-spicy rice cakes that are made with ttangcho chili peppers sourced from Korea. First-timers should opt for the “extra mild” spice level but don’t shy away from loading up on the toppings and sides. The large bowls are enough to feed up to three and come with an amalgam of rice cakes, fish cakes, sausages, cabbage, and green onion, and are topped with mozzarella for that iconic cheese pull.
