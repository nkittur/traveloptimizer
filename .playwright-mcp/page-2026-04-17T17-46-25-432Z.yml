              - paragraph [ref=e192]: Though Irvine may be known as a quiet, sleepy Orange County suburb, the area around UC Irvine has an unexpectedly burgeoning and dynamic food scene. The expansive plazas and strip malls near campus — like the University Town Center and Diamond Jamboree — offer local residents, students, faculty, and visitors an eclectic array of restaurants, ranging from old-timer sandwich delis and pizza shops to newcomers like açai bowl cafes, brunch spots, and even Korean street food.
              - paragraph [ref=e194]: These are essential spots near the UCI campus that stand out among the bounty. Zot Zot Zot.
