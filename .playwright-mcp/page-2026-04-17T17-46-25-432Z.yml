                  - paragraph [ref=e279]: Get those bibs ready at Kickin’ Crab, a lively Cajun seafood house located in the Diamond Jamboree plaza. The set combo deals are ideal for groups, as they offer a comprehensive seafood boil experience — complete with staples like shrimp, clams, crawfish, mussels, crabs, and lobster, along with sides of corn, potatoes, and sausages. The oysters and garlic noodles also make for great accompaniments to the flavorful, hands-on feast.
