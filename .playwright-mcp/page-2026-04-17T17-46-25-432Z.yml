                    - heading "Siam Station Thai Street Food" [level=2] [ref=e206]
                    - button "Copy link" [ref=e208] [cursor=pointer]:
                      - img "Link" [ref=e209]
                  - paragraph [ref=e211]: For some Thai street food fare just a short distance away from campus, Siam Station has got you covered. With large, filling portions of classic favorites like papaya salad, pad see ew, and panang curry, it’s a solid stop for a casual meal or a night of takeout. The khao soi — egg noodles served in a hearty coconut curry broth — is a crowd favorite. And don’t forget to finish the meal off with the mango sticky rice.
