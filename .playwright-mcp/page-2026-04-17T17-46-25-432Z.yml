                  - paragraph [ref=e374]: Exercise your creative muscles at Duck Donuts, where there are practically endless options to donut flavors. You won’t find a display case here, as these cake donuts are made to order, which results in a warm, fluffy interior and a slightly crispy exterior. Though there are set boxes and assortments to choose from, the fun comes from customizing your own, with the desired coating, toppings, and drizzle. There are even vegan donut bases, which are just as decadent as the regular ones.
