                - paragraph [ref=e407]: Bistango is the spot to visit for elevated dining near campus. The restaurant, which opened in 1987, serves upscale French and American cuisine in an expansive space that consists of a bar lounge and a lush outdoor patio – made complete with classy decor. Among the menu’s many options, the seabass, steak, and pasta dishes are the most beloved entrees. Bistango also regularly has live music performers, which is the cherry on top to the experience here.
