                - paragraph [ref=e634]: Hen House Grill is one of the most long-standing restaurants in the Irvine area. Established in 1988, the spot serves classic Iranian dishes, in which the flavorful, juicy meat is the star. Diners rave about the ground beef skewers and rotisserie chicken, which are served with rice, vegetables, herbs and nuts. The massive portions and affordable prices are notable perks, while the complimentary tea and late-night hours are additional pluses.
