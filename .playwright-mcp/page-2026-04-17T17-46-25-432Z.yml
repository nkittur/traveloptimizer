                - paragraph [ref=e312]: HiroNori may have made its way across California, but this original location is where it all started six years ago. The restaurant’s specialty of tonkotsu ramen comes served with hand-crafted noodles and prepared with pork bone broth simmered for over 24 hours. Notably, this bowl of noodles does not skimp out on the toppings, which include bean sprouts, green onion, spinach, egg, seaweed, wood ear mushrooms, and chashu pork. The vegan ramen is also a hit for its umami sesame miso broth.
