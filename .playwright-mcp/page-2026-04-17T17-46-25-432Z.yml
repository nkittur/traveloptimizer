                - paragraph [ref=e702]: Though acai bowls are common fare in Orange County, Blue Bowl is known for its highly customizable approach, with bases that transcend beyond the typical acai berry blend, like blue coconut, matcha, cold brew, or chia pudding. Each bowl is then topped with an assortment of granola, fruit, and toppings, and then drizzled with a nut butter of choice. The result is a visually stunning, rainbow-colored, layered bowl that doesn’t shy away from refreshing, fruity flavors and loads of superfoods.
