          - paragraph [ref=e139]:
            - text: With its alchemy of Southern charm, creative spirit, and natural beauty,
            - link "Asheville, North Carolina" [ref=e140] [cursor=pointer]:
              - /url: https://www.exploreasheville.com/
            - text: ", is that rare destination that appeals to every type of traveler. With the stunning Blue Ridge Mountains as its backdrop, the city is replete with Art Deco, Beaux Arts, and Neoclassical historical landmarks; boasts a thriving arts scene and dynamic food culture; and is a short distance from exhilarating outdoor adventures and breathtaking environmental wonders. Its magnetic pull has been distinct since its establishment in the late 1700s—on just about every corner you'll find evidence of great explorers who've passed through the area, among them Daniel Boone and Davy Crockett, as well as visionaries who've called the area home, including George W. Vanderbilt and Thomas Wolfe. Now it's time for you to leave your mark—here's how to spend three days (plus a bonus trip extension) in the heart of Appalachia."
          - heading "Where to Stay" [level=2] [ref=e141]
          - paragraph [ref=e142]:
            - text: If you want to be in the thick of it all, the
            - link "Windsor Boutique Hotel" [ref=e143] [cursor=pointer]:
              - /url: https://www.exploreasheville.com/listings/the-windsor-boutique-hotel/6148/
            - text: is walking distance to just about every major city attraction—and its thoughtfully renovated suites are an added perk. Just down the block,
            - link "Elevation Lofts Hotel" [ref=e144] [cursor=pointer]:
              - /url: https://www.exploreasheville.com/listings/elevation-lofts-hotel/17021/
            - text: offers a boutique experience in a historic setting, with amenities including gas fireplaces, full kitchens, in-room laundry, and dining areas. Those after a prime location with a bit of history should check into the
            - link "Kimpton Hotel Arras" [ref=e145] [cursor=pointer]:
              - /url: https://www.ihg.com/kimptonhotels/hotels/us/en/hotel-arras-asheville-nc/avlpa/hoteldetail?fromRedirect=true&qBrs=6c.hi.ex.sb.ul.ic.cp.cw.in.vn.cv.rs.ki.ma.sp.va.re.vx.nd.sx.we.lx.rn.sn&qSrt=sAV&qDest=Asheville,%20NC,%20United%20States&qRms=1&qAdlt=1&qChld=0&qCiD=15&qCiMy=012024&qCoD=17&qCoMy=012024&qAAR=6CBARC&qRtP=6CBARC&setPMCookies=true&qpMn=0&srb_u=1&qChAge=&qRad=30&qRdU=mi
            - text: ", a bank-turned-boutique accommodations conveniently located on Patton Avenue in the heart of downtown."
          - paragraph [ref=e146]:
            - text: Alternatively, you can literally vacation like a Vanderbilt by booking a beautifully appointed room or private cottage at
            - link "Biltmore" [ref=e147] [cursor=pointer]:
              - /url: https://www.exploreasheville.com/iconic-asheville/biltmore/
            - text: ", just southwest of the city center. The French Renaissance castle-home and 8,000-acre estate once belonged to George and Edith Vanderbilt. Within the gated getaway are meticulously kept gardens, wooded trails, dining and shopping experiences, and even the country's most-visited winery."
          - paragraph [ref=e148]:
            - text: If getting out of the city is one of your top priorities as a traveler, Asheville has some incredible ways to ensconce yourself in the great outdoors without totally roughing it.
            - link "Asheville River Cabins" [ref=e149] [cursor=pointer]:
              - /url: https://www.exploreasheville.com/listings/asheville-river-cabins/626/
            - text: are only 12 miles from downtown, but they feel a world away. You can rent a cabin or luxury trailer with modern amenities (and the French Broad River as your front yard!). If you prefer mountain views over forest scenes, check out
            - link "AutoCamp" [ref=e150] [cursor=pointer]:
              - /url: https://autocamp.com/location/asheville/?gad_source=1
            - text: ", opening in late spring 2024. It boasts incredible vistas from private cabins and decked out travel trailers, less than 20 minutes from the city center."
          - 'heading "Day 1: Delve Into Downtown" [level=2] [ref=e151]'
          - generic [ref=e154]:
            - img "Asheville North Carolina Aerial view at sunset" [ref=e155]
            - generic [ref=e157]: pawel.gaul//Getty Images
          - paragraph [ref=e158]
          - heading "What to See and Do" [level=2] [ref=e159]
          - paragraph [ref=e160]:
            - text: A must-see, the
            - link "Asheville Art Museum" [ref=e161] [cursor=pointer]:
              - /url: https://www.exploreasheville.com/listings/asheville-art-museum/262/
            - text: is a sprawling reflection of the visual traditions of the Southern Appalachian region. Here, you'll find special exhibitions and permanent collections of 20th- and 21st-century art on display, with the option of
            - link "guided tours" [ref=e162] [cursor=pointer]:
              - /url: https://www.exploreasheville.com/event-calendar/detail/public-tour%3a-discovering-art-in-asheville/48792/
            - text: . If you'd like to explore the art-education legacy of Asheville, consider a visit to the
            - link "Center for Craft" [ref=e163] [cursor=pointer]:
              - /url: https://www.exploreasheville.com/listings/center-for-craft/6705/
            - text: which has been at the vanguard of the craft movement for over 25 years. For a more offbeat experience, swing by the Radical Hotel's
            - link "Afterglow" [ref=e164] [cursor=pointer]:
              - /url: https://www.afterglowavl.com/
            - text: —an espresso bar by day and club by night—or enjoy a walking tour of a different kind at the historic
            - link "Riverside Cemetery" [ref=e165] [cursor=pointer]:
              - /url: https://www.exploreasheville.com/listings/riverside-cemetery/6381/
            - text: . Stick with the spooky theme on a post-dinner ghost tour with
            - link "Haunted Asheville" [ref=e166] [cursor=pointer]:
              - /url: https://www.exploreasheville.com/listings/haunted-asheville/341/
            - text: or
            - link "LaZoom Tours" [ref=e167] [cursor=pointer]:
              - /url: https://www.exploreasheville.com/listings/lazoom-tours/293/
            - text: .
          - heading "Where to Eat" [level=2] [ref=e168]
          - paragraph [ref=e169]:
            - text: Dine where the locals go—like
            - link "The Med," [ref=e170] [cursor=pointer]:
              - /url: https://www.exploreasheville.com/listings/the-med/517/
            - text: a beloved old-school diner, and
            - link "Cucina24" [ref=e171] [cursor=pointer]:
              - /url: https://www.exploreasheville.com/listings/cucina24/445/
            - text: ", a cozy brick-oven-adorned space featuring fine Italian-inspired fare. For a twist on soul food, check out"
            - link "Rosetta's Kitchen" [ref=e172] [cursor=pointer]:
              - /url: https://www.exploreasheville.com/listings/rosettas-kitchen/462/
            - text: ", a beloved vegetarian and vegan spot that also offers multiple flavors of kombucha (a tasty alternative for the non-alcoholic crowd)."
          - 'heading "Day 2: Have Some High-End Fun" [level=2] [ref=e173]'
          - generic [ref=e176]:
            - img "a plate of food" [ref=e177]
            - generic [ref=e179]: Jordan Hughes
          - paragraph [ref=e180]
          - heading "What to See and Do" [level=2] [ref=e181]
          - paragraph [ref=e182]:
            - text: Even if you're not staying on property at Biltmore, you won't want to miss its popular seasonal attraction
            - link "Biltmore Blooms" [ref=e183] [cursor=pointer]:
              - /url: https://www.exploreasheville.com/event-calendar/detail/biltmore-blooms/49354/
            - text: ". New flowers crop up weekly, so no one trip is the same: On any given day you might stroll past daffodils, azaleas, tulips, or roses among famed landscape architect Frederick Law Olmsted's picturesque landscapes. After taking in spring's bounty, get all dolled up for a night out at the"
            - link "Asheville Symphony" [ref=e184] [cursor=pointer]:
              - /url: https://ashevillesymphony.org/concerts/
            - text: for one of their beloved
            - link "Masterworks" [ref=e185] [cursor=pointer]:
              - /url: https://ashevillesymphony.org/concerts/?category=masterworks
            - text: concerts or
            - link "ALT ASO" [ref=e186] [cursor=pointer]:
              - /url: https://ashevillesymphony.org/concerts/?category=alt-aso
            - text: productions.
          - heading "Where to Eat" [level=2] [ref=e187]
          - paragraph [ref=e188]:
            - text: There are myriad fine-dining experiences to be had—if you're craving traditional live-fire cooking,
            - link "Asheville Proper" [ref=e189] [cursor=pointer]:
              - /url: https://www.exploreasheville.com/listings/asheville-proper/16565/
            - text: "'s steaks and classic cocktails can't be beat. For a critically acclaimed locale, try chef Katie Button's lauded"
            - link "Cúrate" [ref=e190] [cursor=pointer]:
              - /url: https://www.exploreasheville.com/listings/c%C3%BArate/476/
            - text: ", which features thoughtfully created Spanish tapas-style plates. Or enjoy a romantic dinner on the patio of"
            - link "Posana" [ref=e191] [cursor=pointer]:
              - /url: https://www.exploreasheville.com/listings/posana/484/
            - text: ", which features imaginative seasonal and sustainable culinary creations and an award-winning wine list."
          - 'heading "Day 3: Get Into Nature" [level=2] [ref=e192]'
          - generic [ref=e195]:
            - img "a man standing in a river with trees around him" [ref=e196]
            - generic [ref=e198]: J Smilanic
          - heading "What to See and Do" [level=2] [ref=e199]
          - paragraph [ref=e200]:
            - text: Hikers will love the jaw-dropping 360-degree mountain views at
            - link "Craggy Pinnacle Trail" [ref=e201] [cursor=pointer]:
              - /url: https://www.exploreasheville.com/stories/post/craggy-pinnacle-trail/
            - text: ", while thrill-seekers can get their pulses pumping by ziplining through the treetops of a 242-acre wildlife habitat with"
            - link "Navitat Canopy Adventures" [ref=e202] [cursor=pointer]:
              - /url: https://www.exploreasheville.com/listings/navitat-canopy-adventures/300/
            - text: ", or going whitewater rafting with"
            - link "French Broad Adventures" [ref=e203] [cursor=pointer]:
              - /url: https://www.exploreasheville.com/listings/french-broad-adventures/5/
            - text: (which also offers hot-springs float trips for the less adrenaline-inclined).
          - heading "Where to Eat" [level=2] [ref=e204]
          - paragraph [ref=e205]:
            - text: Support the community with a visit to
            - link "Plant" [ref=e206] [cursor=pointer]:
              - /url: https://www.exploreasheville.com/listings/plant/3775/
            - text: ", where nationally-recognized Chef Jason Sellers serves up an innovative menu of dishes sourced from the earth. If you want to patronize an area maker after a full day of outdoor activities, you can't beat"
            - link "Asheville Brewing Company" [ref=e207] [cursor=pointer]:
              - /url: https://www.exploreasheville.com/listings/asheville-brewing-company/414/
            - text: "'s award-winning craft beer and pub food. Or grab some burgers to go from"
            - link "Baby Bull" [ref=e208] [cursor=pointer]:
              - /url: https://www.babybullavl.com/
            - text: —an offshoot of Asheville's iconic Bull & Beggar restaurant—to enjoy at your outdoor oasis.
          - paragraph [ref=e209]: Extend Your Trip
          - paragraph [ref=e210]:
            - text: If you're itching to explore a little further past the city limits, stay an extra day or two and check out
            - link "Black Mountain" [ref=e211] [cursor=pointer]:
              - /url: https://www.exploreasheville.com/things-to-do/nearby-towns-neighborhoods/black-mountain/
            - text: ", a cozy town just 25 minutes east, known as a creative hub. Or you could branch out into nearby"
            - link "Weaverville" [ref=e212] [cursor=pointer]:
              - /url: https://www.exploreasheville.com/things-to-do/nearby-towns-neighborhoods/weaverville/
            - text: to shop small businesses on the buzzing Main Street.
