          - paragraph [ref=e91]:
            - text: You’ll very likely hear many other languages than just Portuguese these days in the hilly, sun-warmed streets of Lisbon, Portugal’s capital, as millions pour in as digital nomads, service-industry workers, home buyers and tourists. For travelers, especially in the summer, this popularity can mean long lines to enter the
            - link "Castelo de São Jorge" [ref=e92] [cursor=pointer]:
              - /url: https://castelodesaojorge.pt/
            - text: or to enjoy a pastry from
            - link "Pastéis de Belém" [ref=e93] [cursor=pointer]:
              - /url: https://pasteisdebelem.pt/en/
            - text: ", which can (almost) diminish the charm of the city’s colorful-tile-wrapped facades, centuries-old churches and melancholy fado music. Lisbon, once a slow-paced maritime city, is in development overdrive, which has not been without discontent: The cost of living has skyrocketed, leading to"
            - link "public debate (and protests" [ref=e94] [cursor=pointer]:
              - /url: https://edition.cnn.com/2023/04/02/europe/thousands-protest-housing-crisis-portugal-intl/index.html
            - text: ) about the city’s future and to the
            - link "cancellation of the “golden visa” program" [ref=e95] [cursor=pointer]:
              - /url: https://www.reuters.com/markets/europe/portugal-ends-golden-visas-curtails-airbnb-rentals-address-housing-crisis-2023-02-16/
            - text: ", which granted residency to foreigners who invested in high-value properties. Visiting Lisbon thus involves a delicate balance: enjoying one of Europe’s most dynamic cities while being sensitive to the challenges that have accompanied its rapid boom."
