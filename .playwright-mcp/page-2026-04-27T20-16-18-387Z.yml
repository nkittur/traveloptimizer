            - generic [ref=e258]: 1 p.m. Consume the Portuguese past
            - generic [ref=e259]:
              - text: Tradition and simplicity are hallmarks of the hearty farmhouse and fisherman’s fare ladled out at
              - link "Pica-Pau" [ref=e260] [cursor=pointer]:
                - /url: https://www.restaurantepicapau.pt/en
              - text: ", a newcomer in Príncipe Real with a pleasant back patio that reverently revives old-time Portuguese food. (The place is named after a working-class bar snack of meat cubes in beer sauce.) If gizzard stew sounds too adventurous, consider crispy fried cod cakes (€6) or scrambled eggs bursting with asparagus, croutons and white pudding, a type of sausage (€8). Also worthy, the steaming stew of monkfish, shrimp and spicy rice is a robust undersea medley. Lunch for two, without drinks, around €50."
