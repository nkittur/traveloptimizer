            - generic [ref=e253]: 10 a.m. Survey the market
            - generic [ref=e254]:
              - text: A patchwork of blankets and tables spread with the bric-a-brac of seemingly every Portuguese attic and basement, the
              - link "Feira da Ladra flea market" [ref=e255] [cursor=pointer]:
                - /url: https://www.visitlisboa.com/en/places/feira-da-ladra-flea-market
              - text: is also a citywide social gathering. As you ascend the hillside from the Campo de Santa Clara, the quality of the wares rises too, shifting toward glassware, china, jewelry and fashion. Keep an eye out for the vendor João F. de Almeida's ace selection of classic, indie and art-house films on DVD (look for his yellow van) and
              - link "A Gata Naladra" [ref=e256] [cursor=pointer]:
