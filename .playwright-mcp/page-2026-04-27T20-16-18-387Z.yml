              - text: is inside the
              - link "Palácio do Grilo" [ref=e241] [cursor=pointer]:
                - /url: https://palaciogrilo.com/en/
              - text: ", a formerly disused 18th-century manor in the emerging Beato district that was recently reborn as a restaurant and, more notably, a magnificent nocturnal hangout. The dance party fills a maze of grand aristocratic rooms with period details like ornate moldings and parquet floors coupled with laser lights, smoke machines, and a booming, eclectic playlist that runs from electro to disco classics. Within, black-clad night owls from varying decades of life drink cocktails (€10 to €14) while meandering through the warren of chambers, expansive gardens and even a former chapel. Entry is free if you reserve ahead via the club’s"
              - link "website" [ref=e242] [cursor=pointer]:
                - /url: https://galacricri.com/
              - text: or arrive before 10 p.m.; otherwise, €8.
