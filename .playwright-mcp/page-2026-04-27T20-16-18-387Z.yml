                    - img "A wood-paneled bar in a restaurant that has lush, green plants and hanging lightbulbs suspended above. Behind the bar are restaurant staff members wearing white, and many empty wine glasses. In front of the bar are liquor bottles."
          - generic [ref=e232]:
            - generic [ref=e233]: 9 p.m. Eat without meat
            - generic [ref=e234]:
              - text: In a city awash in restaurants dishing out copious piles of pork, chicken and sardines, light bites and meatless meals used to be hard to find. Not anymore. Several ambitious vegetarian restaurants have sprouted in recent years, perhaps none more quietly elegant than
              - link "Arkhe" [ref=e235] [cursor=pointer]:
                - /url: https://arkhe.pt/en/
              - text: ", near the Cais do Sodré district. Potted plants and a tall banana tree adorn the airy, high-ceilinged space. The menu is also filled with plants: kaleidoscopic and artful vegetarian dishes by the chef"
              - link "João Ricardo Alves" [ref=e236] [cursor=pointer]:
                - /url: https://www.instagram.com/joaord.alves/?hl=en
              - text: . One appetizer presents multiple preparations of red beet (chunky, pickled, crispy dried) served with a delicate dashi- and beet-infused broth, while a kimchi tortellini with carrot purée and Indonesian chile paste is tangy, fermented and fiery. Five courses, without drinks, €70 per person.
