                - /url: https://www.doiscorvos.pt/en/
              - text: ", an art-adorned beer hall selling its own craft brews."
          - generic:
            - figure "scoop-picture":
              - generic:
                - generic:
                  - generic:
                    - img "Two people sit at a small wooden dining table in a restaurant. Behind them is a dark-blue-painted wall, with Keith Haring-style illustrations of dancing figures. Wine bottles line the top of the wall next to them."
          - generic [ref=e284]:
            - generic [ref=e285]: 8 p.m. Sample Tricky’s treats
            - generic [ref=e286]:
              - text: A short detour from the noisy nightlife of Cais do Sodré,
              - link "Tricky’s" [ref=e287] [cursor=pointer]:
                - /url: https://www.cometotrickys.com/
              - text: "features industrial décor and draws a lively, youngish crowd lured by its natural wines and fun, eclectic small plates: There may be a mackerel wrapped in lardo with a spicy, peanut-pepper chutney; Portuguese shrimp with stracciatella cheese; or a mash-up of labneh, harissa and pomegranate seeds with a kebab of celeriac hiding underneath. The juicy and bright natural orange wine called Funky — from the Douro Valley in the country’s north — complements and summarizes the experience. Dinner for two, without drinks, runs about €70. Cash only."
          - figure "scoop-picture" [ref=e289]:
            - img "A closeup of a bartender preparing a cocktail. The drink has a flat disc with a whole through the center, that appears like dried pineapple, sitting on top of the rim of the glass. The bartender is adding a liquid via a dropper." [ref=e293]
            - generic [ref=e294]: Monkey Mash
          - generic [ref=e295]:
            - generic [ref=e296]: 10 p.m. Order a double
            - generic [ref=e297]:
              - text: Granted, speakeasy bars these days can seem as common as Starbucks outlets. But a speakeasy within a speakeasy? For that, hit
              - link "Monkey Mash" [ref=e298] [cursor=pointer]:
                - /url: https://www.monkeymash.pt/
              - text: ", a windowless underground cocktail haven with a tropical-chic aesthetic, located just off an upscale shopping street, Avenida da Liberdade. Start with a Dope Punch, a rum and cachaça cocktail with some eccentric ingredients (including marigold, Sichuan pepper and buttermilk) that make an aromatic concoction (€13.50). Then ask to see"
              - link "Red Frog" [ref=e299] [cursor=pointer]:
                - /url: https://www.redfrog.pt/
              - text: ". Hidden behind a wall panel, this velvety little meta-speakeasy is elegantly outfitted and serves creations like the American Gangster: Powdered cinnamon and cocoa on the glass enrich the spicy-sweet medley of Bulleit bourbon, amaro and Madeira (€15). Book in advance at both bars."
        - figure "scoop-picture" [ref=e300]:
          - img "A yellow tram moves through a very narrow, curved street, not much wider than the tram. The ground is paved with cobblestones. A person looks out at the tram from a doorway." [ref=e304]
          - generic [ref=e305]: The 12E Tram is less crowded than the more famous 28E Tram. It passes by the commanding views of the lookout point at Largo das Portas do Sol, down through the old Moorish quarter of Alfama and under the rectangular towers of Se Cathedral, among other popular sightseeing stops.
        - generic [ref=e306]: Advertisement
        - generic [ref=e307]:
          - paragraph [ref=e308]: Sunday
          - generic:
            - figure "scoop-picture"
          - generic [ref=e309]:
            - generic [ref=e310]: 10 a.m. Go for gold
            - generic [ref=e311]:
              - text: It’s good to be king. You can wear a collar of diamonds and emeralds, carry a
              - link "diamond-covered snuffbox" [ref=e312] [cursor=pointer]:
                - /url: https://www.tesouroreal.pt/en/pages/33c055b1-jewels
              - text: ", and read with a gold-and-sapphire bookmark. Those opulent objects — accumulated by Portuguese monarchs before the country’s first republic was proclaimed in 1910 — are displayed at the sleek new museum for Portugal’s crown jewels,"
              - link "Museu do Tesouro Real" [ref=e313] [cursor=pointer]:
                - /url: https://www.tesouroreal.pt/
              - text: ", which opened last year. Next door, the former royal palace,"
              - link "Palácio Nacional da Ajuda" [ref=e314] [cursor=pointer]:
                - /url: https://www.visitlisboa.com/en/places/ajuda-national-palace
              - text: ", also has a new look: an avant-garde facade of thick, white vertical bars by the architect João Carlos Santos. Inside you’ll find soaring salons filled with towering chandeliers, massive tapestries, marble statues, bearskin rugs and even a painting of Christ by El Greco. Combined admission, €13."
          - generic [ref=e315]:
            - generic [ref=e316]: 12 p.m. Ride the rails
            - generic [ref=e317]:
              - text: Hordes of travelers line up every day in Martim Moniz Square to ride the venerable yellow Tram 28, famous for its 50-minute journey across Lisbon and the points of interest it passes. Do not join them. Instead, board the nearly empty
              - link "Tram 12E" [ref=e318] [cursor=pointer]:
                - /url: https://www.carris.pt/en/travel/carreiras/12e-martim-moniz-circulacao-castelo/
              - text: from the same spot. It features the same mustard-colored paint job, the same wood-lined interior and the same creaky seats but offers a more rapid, less cliché and less claustrophobic sightseeing experience. Over roughly 30 minutes, it careens through the multiethnic Mouraria neighborhood, past the commanding views of the lookout point at
              - link "Largo das Portas do Sol" [ref=e319] [cursor=pointer]:
                - /url: https://www.lisbonportugaltourism.com/guide/miradouro-das-portas-do-sol.html
              - text: ", down through the old Moorish quarter of Alfama, under the rectangular towers of"
              - link "Se Cathedral" [ref=e320] [cursor=pointer]:
                - /url: https://www.sedelisboa.pt/?lang=en
              - text: ", through the urban grid of the Baixa commercial district, and finally uphill again among the boutique-lined lanes of the fashionable Chiado neighborhood before dropping you at the terminus in Bairro Alto, a lively area known for its restaurants and nightlife. Tickets, €3."
