            - generic [ref=e221]: 4 p.m. Meet the two faces of Lisbon
            - generic [ref=e222]:
              - text: The Lisbon of yesterday and today sit elbow to elbow in a sloping street called the Rua de São Bento. Climbing it from the intersection with Calçada da Estrela, you pass dusty antique shops, the Portuguese Parliament and the
              - link "Casa-Museu Amália Rodrigues" [ref=e223] [cursor=pointer]:
                - /url: https://amaliarodrigues.pt/en/house-museum/
              - text: — a museum that bears the name of the Portuguese fado diva that it is devoted to — interspersed with establishments from the new creative class. Check out the (mostly) single-color fashions of the French-owned
              - link "Homecore" [ref=e224] [cursor=pointer]:
                - /url: https://www.homecore.com/en
              - text: boutique, where you could pick up an outfit comprising purple jeans, a green military vest and tortoiseshell glasses. Farther up, the
              - link "Sokyo Lisbon" [ref=e225] [cursor=pointer]:
                - /url: https://sokyolisbon.com/
              - text: gallery specializes in melted-looking vases and meteorite-like sculptures by Japanese ceramists, while the
              - link "Distopia" [ref=e226] [cursor=pointer]:
                - /url: https://distopialivraria.pt/
              - text: bookshop sells two essential English-language guides dedicated to the city’s history — “Soul of Lisbon” and “Secret Lisbon” — along with vinyl albums, CDs and more.
          - generic [ref=e227]:
            - generic [ref=e228]: 7:30 p.m. Aim for the top
            - generic [ref=e229]:
              - text: Now head higher. The hilltop viewpoint at the
              - link "Miradouro da Senhora do Monte" [ref=e230] [cursor=pointer]:
                - /url: https://www.visitlisboa.com/en/places/miradouro-da-senhora-do-monte
              - text: ", overlooks an undulating sprawl of orange-tiled roofs, church towers and stony squares with the medieval crenellated battlements of the"
              - link "Castelo de São Jorge" [ref=e231] [cursor=pointer]:
                - /url: https://castelodesaojorge.pt/
              - text: and the blue Tagus River in the distance. But the marquee attraction is the sunset. A caipirinha (€7.50) from the Maria Limão stand enhances the feel-good, garden-party vibe as twilight approaches.
          - generic:
