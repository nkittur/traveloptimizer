            - paragraph [ref=e277]:
              - text: In the trendy Saint-Roch neighborhood, west of Old Quebec, are two adjoining sibling Japanese restaurants —
              - link "Hono Izakaya" [ref=e278] [cursor=pointer]:
                - /url: https://izakaya.honorestos.com/
              - text: ", minimally designed in light maple, and the adjoining"
              - link "Hono Ramen" [ref=e279] [cursor=pointer]:
                - /url: https://ramen.honorestos.com/
              - text: ", in contrasting dark mahogany tones. Try Izakaya for a selection of yakitori, small skewered bites from the grill (including a duck heart confit, 10 dollars), or larger plates like an elegantly presented Japanese curry (from 19 dollars). If walking into Hono Izakaya is a no-go — reservations are recommended — Hono Ramen offers several creative bowls, with flavors punched up with such additions as roasted leek oil and roasted garlic, and fun textures like puffed rice."
