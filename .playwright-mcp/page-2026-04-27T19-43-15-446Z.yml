            - generic [ref=e297]: 9 a.m. Chase winter waterfalls
            - paragraph [ref=e299]:
              - text: It’s hard to tire of the view of the expansive St. Lawrence River, but for another flavor of Quebec’s natural beauty, take a taxi or rideshare 15 minutes east of the old city to the 272-foot-high
              - link "Montmorency Falls" [ref=e300] [cursor=pointer]:
                - /url: https://www.sepaq.com/destinations/parc-chute-montmorency/index.dot?language_id=1
              - text: ", viewed from a suspension bridge (tell the driver to drop you off at Montmorency Manor, the historic home of Quebec’s third governor, where the trail starts). Enjoy free entry during the winter off-season months (the rate is otherwise about 10 dollars for adults). On the way to the suspension bridge, about a 15-minute walk, see giant icicles along the cliff sides and the frozen top of the Montmorency River, their stillness stark against the roaring rush of the waterfall."
          - img "A wintery, snowy scene with two people dressed in outdoor winter clothing who standing together taking a selfie. There's a hill in the background with falls." [ref=e304]
          - generic [ref=e305]:
            - generic [ref=e306]: 11 a.m. Admire Indigenous art
            - paragraph [ref=e308]:
              - text: Head to the
              - link "Musée National des Beaux-Arts du Québec" [ref=e309] [cursor=pointer]:
                - /url: https://www.mnbaq.org/
              - text: for the
              - link "“Early Days”" [ref=e310] [cursor=pointer]:
                - /url: https://www.mnbaq.org/en/exhibition/early-days-1308
              - text: exhibition (through April 21), which includes works from about 50 Indigenous artists. Admire the hopeful painting called “New Climate Landscape” by
              - link "Lawrence Yuxweluptun" [ref=e311] [cursor=pointer]:
                - /url: https://lawrencepaulyuxweluptun.com/
              - text: ", an artist born in Kamloops, British Columbia, who is known for his vibrant reimaginations of northwest coastlines. Also see works by Kent Monkman, whose arresting paintings reference historic European art styles and depict violent scenes of colonialism; and Norval Morrisseau, who popularized the Woodlands style of painting, which emphasizes thick, defined brushstrokes and loud, contrasting colors, and is used by many Indigenous artists from Ontario and Manitoba."
          - img "The exterior of a museum; large windows reveal chairs and a shop inside. A sculpture of tubes is in the foreground." [ref=e315]
