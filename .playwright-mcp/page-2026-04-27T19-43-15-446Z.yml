                - text: By Vjosa Isai
                - text: Photographs by Renaud Philippe
            - paragraph [ref=e59]: Vjosa Isai is a reporter and researcher for The Times based in Toronto, where she covers news from across Canada.
            - time [ref=e60]: Jan. 23, 2025
          - paragraph [ref=e61]:
            - text: With its fortified walls, Quebec City, one of North America’s oldest European settlements, in many ways feels frozen in time — a major draw for visitors who relish its quaint public squares and cobblestone streets, absent of skyscrapers. But while French speakers still resist the incursion of English, Quebec City is evolving. Walk down a street and you’ll find a Japanese restaurant serving up salmon poke bowls not far from a bistro offering the traditional fare of tourtière and poutine. Don’t miss the
            - link "Musée National des Beaux-Arts du Québec" [ref=e62] [cursor=pointer]:
              - /url: https://www.mnbaq.org/
            - text: ", home to the largest collection of Quebecois art in the world. And there’s plenty of fun to be had in even the most frigid months, when temperatures can drop to an average low of -16 Celsius (3 degrees) in February, whether you’re whizzing down the hill on a toboggan sled with a view of the St. Lawrence River, marveling at intricately carved sculptures at an ice hotel, or enjoying live music and ice canoe races at"
            - link "Le Carnaval de Quebec" [ref=e63] [cursor=pointer]:
              - /url: https://programmation.carnaval.qc.ca/
            - text: ", the annual winter carnival, which runs from Feb. 7 to Feb. 16."
