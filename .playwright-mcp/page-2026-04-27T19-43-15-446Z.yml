          - generic [ref=e144]:
            - button "Where to stay +" [ref=e145] [cursor=pointer]:
              - text: Where to stay
              - generic [ref=e146]: +
            - list:
              - listitem [ref=e147]:
                - text: The stately
                - strong [ref=e148]:
                  - link "Fairmont Le Château Frontenac" [ref=e149] [cursor=pointer]:
                    - /url: https://www.fairmont.com/frontenac-quebec/
                - text: is a ubiquitous presence in Quebec City, always peering down on visitors from its highpoint on the Cap Diamant escarpment. With 610 rooms, starting at around 300 dollars ($208) a night, the landmark hotel offers a sweeping view of the St. Lawrence River.
              - listitem [ref=e150]:
                - text: "The dozens of auberges, or inns, you’ll see dotting the streets fall into roughly two categories: hostels or boutique hotels. For the latter,"
                - strong [ref=e151]:
                  - link "Auberge Saint Antoine" [ref=e152] [cursor=pointer]:
                    - /url: https://www.saint-antoine.com/
                - text: ", a hotel near the Old Port of Quebec on the St. Lawrence River, offers a luxury experience starting at 230 dollars a night, with rooms decorated to include artifacts found in an archeological excavation of the site during the hotel’s construction."
              - listitem [ref=e153]:
                - text: Quiet fills the air at
                - strong [ref=e154]:
                  - link "Le Monastère des Augustines" [ref=e155] [cursor=pointer]:
                    - /url: https://monastere.ca/en/
                - text: ", a former monastery in Old Quebec that was converted in 2015 to a nonprofit wellness hotel. Guests have the option of sleeping in the sparsely furnished but comfortable nuns’ quarters, which start at around 200 dollars per night. The “contemporary rooms” have an in-suite private washroom and start at about 260 dollars."
              - listitem [ref=e156]:
                - text: Vacation rentals are available on platforms like
                - strong [ref=e157]:
                  - link "AirBnb" [ref=e158] [cursor=pointer]:
                    - /url: https://www.airbnb.ca/s/homes?dynamic_product_ids%5B%5D=26732592&omni_page_id=36021
                - text: and
                - strong [ref=e159]:
                  - link "Vrbo" [ref=e160] [cursor=pointer]:
                    - /url: https://www.vrbo.com/en-ca/vacation-rentals/canada/qu%C3%A9bec/capitale-nationale/qu%C3%A9bec-city
                - text: . Look for options in the Saint-Roch neighborhood, where you’ll find many of the city’s best restaurants and nightlife, and an easy walk to major attractions.
          - generic [ref=e161]:
            - button "Getting Around +" [ref=e162] [cursor=pointer]:
              - text: Getting Around
              - generic [ref=e163]: +
            - list [ref=e164]:
              - listitem [ref=e165]:
                - text: Quebec City is very pedestrian-friendly and walking is a hassle-free way to get to most attractions, but Ubers and taxis are also widely available. Taxis into town from Québec City Jean Lesage International Airport go for a flat rate of about 40 Canadian dollars, roughly as much as an Uber trip. The public transit system, Réseau de Transport de la Capitale, has a payment app called
                - link "RTC Nomade" [ref=e166] [cursor=pointer]:
                  - /url: https://www.rtcquebec.ca/en/rates-and-purchase/purchase-and-points-sale/rtc-nomade-paiement
                - text: to buy tickets, with day passes for 10 dollars. For trips to the Hôtel de Glace, some tour companies offer packages that include the price of the ticket and round-trip transport from the Fairmont, but it can be more cost effective to take a taxi or rideshare if you’re traveling in a small group.
        - heading "Itinerary" [level=2] [ref=e167]
        - generic [ref=e168]:
          - heading "Friday" [level=2] [ref=e169]
          - generic [ref=e170]:
            - generic [ref=e171]: 5 p.m. Breathe deeply in a nunnery
            - paragraph [ref=e173]:
              - text: In the 17th century, French settlers mounted defensive walls called ramparts along parts of Quebec City’s rocky escarpment to fortify it from the British. See these remnants on Rue des Remparts, which also offers panoramic views of the St. Lawrence River, the entry point for the city’s first settlers. The street is also home to
              - link "Le Monastère des Augustines" [ref=e174] [cursor=pointer]:
                - /url: https://monastere.ca/en/
              - text: ", the site of what historians believe is the first hospital on the continent north of Mexico, founded by Augustinian nuns from France. Prime your body for a weekend of Quebec City’s outdoors by dropping in for daily"
              - link "yoga" [ref=e175] [cursor=pointer]:
                - /url: https://monastere.ca/en/activity/gentle-yoga/
              - text: (18 dollars) in the monastery’s arched stone underground vault.
          - img "A view from above of city streets with quaint old buildings. A river with ice flows and a ship is in the background. On the right is a building with a trompe l'oeil, of a scene not unlike the one we're looking at." [ref=e179]
          - generic [ref=e180]:
            - generic [ref=e181]: 7 p.m. Catch a groove
            - paragraph [ref=e183]:
              - text: A classic skating option is at
              - link "Place D’Youville" [ref=e184] [cursor=pointer]:
                - /url: https://www.quebec-cite.com/en/businesses/patinoire-de-la-place-dyouville
              - text: ", a public square on one of the city’s oldest roads, under a giant wreath on a historic theater building, now home to"
              - link "Il Teatro" [ref=e185] [cursor=pointer]:
                - /url: https://ilteatro.ca/en/
              - text: restaurant. But for a livelier experience, about a 20-minutes’ walk north at the Old Port of Quebec, one of Canada’s largest ports, is a new nightclub-inspired skating rink called
              - link "Discoglace" [ref=e186] [cursor=pointer]:
                - /url: https://discoglace.portquebec.ca/
              - text: ", with live music and colorful lights. (Through March 9; entrance is free and open to all ages. Skate rentals, 8 dollars.)"
          - generic [ref=e190]:
            - generic [ref=e191]: 8 p.m. Dine at a Quebec mainstay
            - paragraph [ref=e193]:
              - text: If you work up an appetite,
              - link "Le Café du Monde" [ref=e194] [cursor=pointer]:
                - /url: https://www.lecafedumonde.com/#/
              - text: ", a 37-year-old bistro just a few minutes from Discoglace, serves camembert fondue (14 dollars) and confit duck legs (28 dollars). Or across the street from there,"
              - link "Lueur" [ref=e195] [cursor=pointer]:
                - /url: https://laurieraphael.com/lueur/
              - text: is a new, more affordable offshoot of
              - link "Laurie Raphaël" [ref=e196] [cursor=pointer]:
                - /url: https://laurieraphael.com/en/
              - text: ", the fine-dining powerhouse that charges 185 dollars for its tasting menu. Lueur fits only 14 people at a countertop, and the most expensive item on its modern-French menu is a filet mignon in foie gras sauce with fries at 30 dollars. Reservations are encouraged in Quebec’s busy restaurant scene, even in the winter off-season."
          - generic [ref=e200]:
            - generic [ref=e201]: 9:30 p.m. Lose yourself in a mellow tune
            - paragraph [ref=e203]:
              - text: Look for the blue door near the bottom of the steep Rue Ste.-Angèle. The light of a moody neon glow from the low window will let you know you’ve got the right place,
              - link "Bar Ste-Angèle" [ref=e204] [cursor=pointer]:
                - /url: https://www.facebook.com/BarSainteAngele/?locale2=fr_CA
              - text: ", a cozy jazz bar anchoring the live music scene of the Old Quebec district. The bar runs a nightly program (tickets are about 10 dollars) and serves affordable cocktails and beer (cocktail pitchers, around 20 dollars). While Quebec City’s winter nightlife can be muted compared to the summer,"
              - link "Pub Saint-Alexandre" [ref=e205] [cursor=pointer]:
                - /url: https://www.pubstalexandre.com/programmation
              - text: ", an English tavern in Old Quebec, is another bar that offers year-round programming."
          - img "A bar with a bartender shaking a cocktail. There is lots of wood, lots of bottles, and a sign that says \"Jazz Live.\" The atmosphere of the photo is warm and cozy." [ref=e209]
        - generic [ref=e210]:
          - img "A view from above of a snowy city; a large elegant, gabled building is in the background." [ref=e212]
          - paragraph [ref=e215]: Quebec City on a winter’s day, with the grand Fairmont Le Château Frontenac in the background.
        - generic [ref=e216]: Advertisement
        - generic [ref=e217]:
          - heading "Saturday" [level=2] [ref=e218]
          - generic [ref=e219]:
            - generic [ref=e220]: 9:30 a.m. Fuel up, Quebec-style
            - paragraph [ref=e222]:
              - text: A hearty breakfast at
              - link "La Buche" [ref=e223] [cursor=pointer]:
                - /url: https://www.restolabuche.com/
              - text: ", in Old Quebec, will give you the boost to take on Quebec City’s hilly pedestrian streets and the outdoor stairways that connect them. Deer heads are mounted on the walls, mini-toboggans are nailed to the ceiling, and lumberjack-plaid drapery evokes cabanes à sucre, or sugar shacks, traditional shanties set up in forests where the sap to be turned into maple syrup is harvested. Classic dishes like tourtière (29 dollars) are served alongside smoked trout crepes (24 dollars) and French toast with maple caramelized apples (20 dollars). Hang onto your receipt and get a 15 percent discount at the restaurant’s boutique shop next door, which sells clothes and touristy gifts such as maple syrup lollipops and spruce-scented candles."
          - img "The interior of a restaurant; lots of wood paneling, deer heads on the wall. A chandelier of antlers hangs from the ceiling; people are eating at tables with red checked tablecloths." [ref=e227]
          - generic [ref=e228]:
            - generic [ref=e229]: 11 a.m. Sift through treasures and trinkets
            - paragraph [ref=e231]:
              - text: Porcelain figurines, vintage Christmas decorations and old records occupy neighboring storefronts along Rue St. Paul, in the antiques district. While some shops close or operate on reduced hours in January,
              - link "Les Antiquités Bolduc" [ref=e232] [cursor=pointer]:
                - /url: https://lesantiquitesbolduc.com/
              - text: is a reliable bet. It’s run by a brother and sister, who inherited it from their parents, and neatly displays film cameras, glass paperweights and fine china. Newcomers to the street include
              - link "Rosie Papeterie" [ref=e233] [cursor=pointer]:
                - /url: https://rosiepapeterie.com/
              - text: ", a locally owned stationery shop with a minimalist aesthetic, and a sleek coffee shop,"
              - link "Café Apotek" [ref=e234] [cursor=pointer]:
                - /url: https://www.instagram.com/apotek.bakery/?hl=en
              - text: . Try its sweet brioche buns, stuffed with lime-and-blueberry mascarpone cream (8.50 dollars). For vintage shopping, the year-old
              - link "Oh La La! Boutique Éco Chic" [ref=e235] [cursor=pointer]:
                - /url: https://ohlalaeco.com/
              - text: offers luxury finds; it’s about a 20-minute walk west.
          - generic [ref=e237]:
            - img "A partial interior of a shop, with a string instrument and a painting hanging on the wall; on a tabletop surface is a bust and a decanter and glasses." [ref=e239]
            - paragraph [ref=e242]: Les Antiquités Bolduc
          - generic [ref=e243]:
            - generic [ref=e244]: 1 p.m. Hang onto your hat!
            - paragraph [ref=e246]:
              - text: Gleeful shrieks become louder as you summit Quebec’s oldest stairway — affectionately known by locals as the “breakneck stairs” — and head toward the Fairmont Le Château Frontenac. The sounds are coming from the toboggan slide
              - link "Au 1884" [ref=e247] [cursor=pointer]:
                - /url: https://www.fairmont.com/frontenac-quebec/activities/tobbogan/
              - text: ", named for the year it was built on the nearby Dufferin Terrace. One ride is 4.75 dollars per person, or 15 dollars for four tickets. You might work up a sweat dragging the wooden toboggan (which can fit four people) up the steep ramp, but you’ll easily dry off after racing down at speeds of nearly 45 miles per hour, while taking in a view of the Château Frontenac and St. Lawrence River. After a couple of rides, wander through the festively adorned cobblestone streets of the"
              - link "Petit Champlain" [ref=e248] [cursor=pointer]:
                - /url: https://www.quartierpetitchamplain.com/en/home/
              - text: district, believed to be one of North America’s oldest commercial streets, and now a bustling area of boutiques, heritage buildings and eateries.
          - paragraph [ref=e254]: The Petit Champlain district
          - generic [ref=e255]:
            - generic [ref=e256]: 2:30 p.m. Warm up in an English library
            - paragraph [ref=e258]:
              - text: Take a break from the cold in Quebec City’s English-language library, the
              - link "Morrin Center" [ref=e259] [cursor=pointer]:
                - /url: https://www.morrin.org/en/
              - text: ", originally built by the French in the 19th century as a prison, transformed by a Scottish doctor into a college, and later managed by the Literary and Historical Society of Quebec as a heritage site. The library houses an impressive collection over two stories of floor-to-ceiling bookshelves. But the library has some ghost stories of its own: In its crypt, learn about the haunting history of the prison, complete with graffiti and etchings from former inmates. Tours are 18.50 dollars and have set times in French and English, including at 1 p.m. and 3 p.m. in English."
          - img "The interior of a two-story library; the balcony has an elaborate railing, and there's a circular stairway connecting the floors. The model of a large ship is on display on a shelf." [ref=e263]
          - generic [ref=e264]:
            - generic [ref=e265]: 4:30 p.m. Delight in a hotel of ice
            - paragraph [ref=e267]:
              - text: It’s the 25th anniversary of the
              - link "Hôtel de Glace" [ref=e268] [cursor=pointer]:
                - /url: https://www.valcartier.com/en/lodging/hotel-de-glace-ice-hotel/
              - text: ", a one-story hotel built every December out of carved ice. On the grounds of the Valcartier Vacation Village, an outdoor recreational complex about 35 minutes northwest of Quebec City, the ice hotel has 30 rooms, a wedding chapel, two bars, ice sculptures depicting the Indigenous heritage of the local Huron-Wendat people and"
              - link "a new restaurant" [ref=e269] [cursor=pointer]:
                - /url: https://www.fairmont.com/frontenac-quebec/activities/restaurant-de-l-hotel-de-glace-signe-chateau-frontenac/
              - text: (open Friday and Saturday nights). Tour the hotel until 8 p.m., before overnight guests take their rooms (40 dollar day pass). Marvel at the intricate sculptures in themed rooms, with polar bears, dragons, flowers, canoes and psychedelic patterns carved so smoothly you would think the snow walls were made of stone.
