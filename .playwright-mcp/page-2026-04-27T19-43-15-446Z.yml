            - list [ref=e70]:
              - listitem [ref=e71]:
                - text: The
                - strong [ref=e72]:
                  - link "Fairmont Le Château Frontenac" [ref=e73] [cursor=pointer]:
                    - /url: https://www.fairmont.com/frontenac-quebec/
                - text: ", a hotel built by the Canadian Pacific Railway company in 1893, is Quebec City’s center of orbit."
              - listitem [ref=e74]:
                - text: Roam the cobblestone streets of
                - strong [ref=e75]:
                  - link "Le Quartier Petit Champlain" [ref=e76] [cursor=pointer]:
                    - /url: https://www.quartierpetitchamplain.com/en/home/
                - text: ", a historic commercial district in Old Quebec, a neighborhood in Quebec City, founded in 1608 by the French explorer Samuel de Champlain. Old Quebec toggles two terrains: a lower town at sea level, and an upper town on top of a rocky promontory, with steep roads and outdoor staircases connecting them."
              - listitem [ref=e77]:
                - text: The
                - strong [ref=e78]:
                  - link "Morrin Center" [ref=e79] [cursor=pointer]:
                    - /url: https://www.morrin.org/en/
                - text: ", the site of a former jailhouse, is now home to a library with an expansive English-language book collection."
              - listitem [ref=e80]:
                - strong [ref=e81]:
                  - link "Montmorency Falls" [ref=e82] [cursor=pointer]:
                    - /url: https://www.sepaq.com/destinations/parc-chute-montmorency/index.dot?language_id=1
                - text: ", a roughly 15-minute drive east of Quebec, is a 272-foot-tall waterfall with several vantage points, including an observation deck and a suspension bridge."
              - listitem [ref=e83]:
                - text: Quebec City’s largest art museum, the
                - strong [ref=e84]:
                  - link "Musée National des Beaux-Arts du Québec" [ref=e85] [cursor=pointer]:
                    - /url: https://www.mnbaq.org/en/exhibition/early-days-1308
                - text: ", will until late April host a touring art collection called “Early Days,” featuring works by Indigenous artists."
