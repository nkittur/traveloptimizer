                        - heading "La Jolla Cove" [level=3] [ref=e751]:
                          - paragraph [ref=e752]: La Jolla Cove
                      - paragraph [ref=e755]:
                        - text: Luxuriate in SoCal splendor in the upscale seaside village of La Jolla Cove, a quick 20-minute drive from downtown San Diego. Wind through Prospect Street to browse shops like the iconic Warwick’s, the nation's oldest family-run bookstore, or dine with an ocean view at high-end restaurants like seafood-centric George’s at the Cove. Walk along seaside Coast Boulevard for primo photo ops of the cliffs, stopping at the Children’s Pool to watch sunbathing seals camped on the rocks. Head to Peter Lik fine art gallery for awe-inspiring landscape
                        - link "photography" [ref=e756] [cursor=pointer]:
                          - /url: https://www.cntraveler.com/story/the-complete-guide-to-travel-photography
                        - text: ". And, if you need to, recharge your battery at Ellen Browning Scripps Park, a grassy area ideal for picnics and watching the sunset. Fun fact: It's the most-photographed place in San Diego."
                      - link "Read Full Review" [ref=e757] [cursor=pointer]:
                        - /url: https://www.cntraveler.com/activities/san-diego/la-jolla-cove
