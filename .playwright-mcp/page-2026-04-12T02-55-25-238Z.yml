                        - heading "USS Midway Museum" [level=3] [ref=e1225]:
                          - paragraph [ref=e1226]: USS Midway Museum
                      - paragraph [ref=e1229]: San Diego is a navy town, with 59 ships home-ported there. The U.S.S. Midway, America's longest-serving aircraft carrier of the 20th century, became a museum after being decommissioned in 1992. The USS Midway is one of only a few decommissioned US Navy aircraft carriers open to the public as a museum. Visitors can get a taste of navy life by visiting the plane-packed flight deck, sprawling hangar bay, mess hall, and berthing. The museum hosts about 400 active-duty military events annually—including reenlistment, retirement and change-of-command ceremonies—which are all open for the public to observe. Sometimes called a “floating city” due to its massive size, which stretches roughly the length of three football fields, the Midway’s self-guided audio tour takes an entire three hours to complete in full.
                      - link "Read Full Review" [ref=e1230] [cursor=pointer]:
                        - /url: https://www.cntraveler.com/activities/san-diego/uss-midway-museum
