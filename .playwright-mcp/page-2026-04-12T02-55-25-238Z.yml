                        - heading "Downtown Oceanside" [level=3] [ref=e1697]:
                          - paragraph [ref=e1698]: Downtown Oceanside
                      - paragraph [ref=e1701]: The seaside town of Oceanside is 45 minutes north of central San Diego, and growing in popularity as a beach vacation destination. In recent years, it’s moved past its long-held image of being a sleepy military town (Marine Corps Base Camp Pendleton is nearby) thanks to an influx of boutique luxury hotels and new dining options, including a Michelin-starred restaurant. The wide sand beaches here are easily accessible and not as crowded as some of the more touristy locales in the county. It’s also home to the landmark Oceanside Municipal Pier, one of the longest wooden piers on the West Coast. It’s a relaxed Southern California beach town with ample things to see and do.
                      - link "Read Full Review" [ref=e1702] [cursor=pointer]:
