                          - heading "Museum of Contemporary Art San Diego" [level=3] [ref=e386]:
                            - paragraph [ref=e387]: Museum of Contemporary Art San Diego
                        - paragraph [ref=e390]: This local institution devoted to showcasing modern art is perched right across from the Pacific Ocean in the tony coastal community of La Jolla just outside San Diego, and reopened its doors in 2022 after an extensive $105 million overhaul. The building was originally designed by architect Irving Gill as a home for philanthropist Ellen Browning Scripps—it was later converted into a museum in 1941. Today, MCASD has more than 4,000 pieces from renowned and emerging artists in its collection. The layout of the museum makes it easy for a self-guided tour at a relaxed pace, and there’s something exciting to experience at just about every turn. The inaugural exhibition showcased works in the museum’s collection, including pieces by John Baldessari, Marcos Ramírez ERRE, Robert Irwin, Barbara Kruger, Mildred Howard, Yoshimoto Nara, and Andy Warhol.
                        - link "Read Full Review" [ref=e391] [cursor=pointer]:
                          - /url: https://www.cntraveler.com/activities/la-jolla/mcasd
