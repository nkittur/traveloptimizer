                            - heading "Torrey Pines State Natural Reserve" [level=3] [ref=e315]:
                              - paragraph [ref=e316]: Torrey Pines State Natural Reserve
                          - paragraph [ref=e319]:
                            - text: A short 30-minute drive outside of downtown San Diego, this 1,750-acre oceanfront reserve promises sweeping ocean views for hikers. (
                            - link "See our favorite San Diego area hikes, here." [ref=e320] [cursor=pointer]:
                              - /url: https://www.cntraveler.com/gallery/best-hikes-in-san-diego
                            - text: ") The reserve is dedicated to preserving its namesake tree, the Torrey Pine, and surrounding wildlife, but travelers and locals come for the miles of trails through pine forests and sandstone canyons, and the 4.5-mile Torrey Pines State Beach. Torrey Pines is no hidden secret, but there's a reason crowds flock here. Plans to go are easy to make: The reserve is open 365 days a year, from sunrise to sunset, and all entering cars must pay an admission fee, which ranges from $10-$25 (or free with a"
                            - link "California State Parks Vehicle Day Use Pass" [ref=e321] [cursor=pointer]:
                              - /url: https://store.parks.ca.gov/product/california-explorer-annual-day-use-pass/
                            - text: ), depending on whether you park in the the North or South Beach parking lots. The visitor’s center is open seven days a week, and free docent-led hikes are available every Friday and Saturday at 10 a.m.
                          - link "Read Full Review" [ref=e322] [cursor=pointer]:
                            - /url: https://www.cntraveler.com/activities/san-diego/torrey-pines-state-natural-reserve
