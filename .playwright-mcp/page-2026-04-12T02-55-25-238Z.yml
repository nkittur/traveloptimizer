                      - link "North Park" [ref=e1568] [cursor=pointer]:
                        - /url: https://www.cntraveler.com/activities/san-diego/north-park
                        - heading "North Park" [level=3] [ref=e1569]:
                          - paragraph [ref=e1570]: North Park
                      - paragraph [ref=e1573]: While the Gaslamp Quarter and Pacific Beach neighborhoods draw younger crowds, North Park’s restaurants and nightlife appeals to people in their thirties and forties. Parts of the neighborhood are made up of quiet, residential streets lined with Craftsman homes, but a few key corridors—especially around the intersection of University Avenue and 30th Street—are lively hubs with no shortage of places to go out. This urban corner is packed with small breweries, wine lounges, bars, and popular restaurants. It gets busy in the evenings when there’s a show at The Observatory North Park, a historic live music venue featuring both indie bands and national acts on tour. During the day is prime time for window shopping at the fun boutiques in the area, and there’s a weekly farmers market every Thursday afternoon at 3 p.m.
                      - link "Read Full Review" [ref=e1574] [cursor=pointer]:
                        - /url: https://www.cntraveler.com/activities/san-diego/north-park
