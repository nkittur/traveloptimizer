                        - heading "Petco Park" [level=3] [ref=e950]:
                          - paragraph [ref=e951]: Petco Park
                      - paragraph [ref=e954]:
                        - text: Petco Park is a great way to spend an afternoon or evening in San Diego, but the appeal doesn't stop at baseball. The stadium was named the best MLB ballpark to watch a game at by
                        - emphasis [ref=e955]: USA Today
                        - text: "in 2024, and is among the few in the nation with a water view—it's a stone's throw from San Diego Bay. Hop heads will love the stellar local craft beer options: there are more than 40 different varieties poured at stalls and restaurants around the stadium. And with more than 50 dining options, Petco Park's culinary appeal stretches far beyond hot dogs. Many local restaurants run operations in the stadium, including Blue Water Seafood, Hodad’s, and Grand Ole BBQ. Some new notable eateries include fresh seafood at Deckman at The Draft (by Michelin-starred chef Drew Deckman), donuts from The Mini Donut Company, and boba drinks from Teaspoon."
                      - link "Read Full Review" [ref=e956] [cursor=pointer]:
                        - /url: https://www.cntraveler.com/activities/san-diego/petco-park
