                        - heading "Coronado" [level=3] [ref=e1421]:
                          - paragraph [ref=e1422]: Coronado
                      - paragraph [ref=e1425]:
                        - text: Make the short two-mile journey over one of San Diego’s most recognizable structures, Coronado Bridge, to reach the dreamy city of Coronado, an island (technically a peninsula) stronghold of hotels, resorts, beach-front restaurants. Alternately, you can pay $9 for a 15-minute ferry ride across the bay, which affords some of the best views of the downtown skyline. At the Coronado Ferry Landing, you’ll find restaurants, souvenir shops, and places to rent bikes or kayaks. Right next to the ferry landing is Centennial Park, a small waterfront park with stunning views of the bay and San Diego skyline–you’ll want to stop and get a photo here, especially if you didn’t ride the ferry. Head south to the island’s iconic beachside landmark,
                        - link "Hotel del Coronado" [ref=e1426] [cursor=pointer]:
                          - /url: https://www.cntraveler.com/hotels/united-states/coronado/hotel-del-coronado
                        - text: ", which instantly puts visitors in vacation mode."
