                        - heading "Barrio Logan" [level=3] [ref=e1372]:
                          - paragraph [ref=e1373]: Barrio Logan
                      - paragraph [ref=e1376]:
                        - text: One of California's 14 Cultural Districts, this historic, artsy neighborhood is rooted in Mexican and Chicano cultures. The most obvious proof is Chicano Park, the neighborhood's collection of more than 80 outdoor murals painted onto the concrete girders of the Coronado Bridge. The larger-than-life portraits depict iconic cultural figures, like revolutionary Emiliano Zapata and artist Frida Kahlo. Many of the hip, modern businesses that have landed on Logan Avenue, the main street, are still rooted in the community's culture. There's Por Vida for coffee, Fish Guts for sustainable Baja-style seafood, and Art Hub Makers, a collective space of 25 studios where local artists and designers showcase and sell their work. And for old-school flavor and some of the
                        - link "best Mexican food in San Diego" [ref=e1377] [cursor=pointer]:
                          - /url: https://www.cntraveler.com/gallery/best-mexican-food-in-san-diego
                        - text: ", don't miss a meal at"
                        - link "Las Cuatro Milpas" [ref=e1378] [cursor=pointer]:
                          - /url: https://www.cntraveler.com/restaurants/san-diego/las-cuatros-milpas
                        - text: ", but get there early—they usually sell out by lunchtime."
                      - link "Read Full Review" [ref=e1379] [cursor=pointer]:
                        - /url: https://www.cntraveler.com/activities/san-diego/barrio-logan
