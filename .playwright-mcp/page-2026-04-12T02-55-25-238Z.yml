                        - /url: https://www.cntraveler.com/activities/new-york/balboa-park
                        - heading "Balboa Park" [level=3] [ref=e622]:
                          - paragraph [ref=e623]: Balboa Park
                      - paragraph [ref=e626]:
                        - text: Reserve an entire afternoon for a visit to San Diego’s crown jewel, Balboa Park, a lush 1,200-acre urban oasis also home to nearly 30 museums and cultural centers, the Old Globe Theatre, plus the world-famous
                        - link "San Diego Zoo" [ref=e627] [cursor=pointer]:
                          - /url: https://www.cntraveler.com/activities/san-diego/san-diego-zoo
                        - text: . In recent years, the park has undergone a wave of revitalization. The Mingei International Museum, which focuses on showcasing “the art of the people,” reopened in the fall of 2021 after a three-year $55 million renovation and is a must-see—the main floor of the museum is always free to visit, and there’s also a full-service restaurant and cafe onsite. The Timken Museum, which doesn’t charge admission and is the only museum in the city that houses a work by Rembrandt, also got a refresh. The park’s iconic Botanical Building, which anchors a tranquil lily pond, recently reopened to the public after being closed for construction for nearly three years, and houses a collection of rare plants, ferns, orchids, and palms.
                      - link "Read Full Review" [ref=e628] [cursor=pointer]:
                        - /url: https://www.cntraveler.com/activities/new-york/balboa-park
