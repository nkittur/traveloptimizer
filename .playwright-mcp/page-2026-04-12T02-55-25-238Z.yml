                      - generic [ref=e1076]: Elyse Butler/Getty
                    - generic [ref=e1077]:
                      - link "Sunset Cliffs" [ref=e1078] [cursor=pointer]:
                        - /url: https://www.cntraveler.com/activities/san-diego/sunset-cliffs
                        - heading "Sunset Cliffs" [level=3] [ref=e1079]:
                          - paragraph [ref=e1080]: Sunset Cliffs
                      - paragraph [ref=e1083]:
                        - text: Set atop jagged, postcard-worthy sea cliffs, San Diego's aptly named Sunset Cliffs neighborhood rewards visitors with panoramic ocean views. Hands down San Diego's most popular spot at dusk, Sunset Cliffs attracts a crowd nightly for its serene, picture-perfect views. Part of the neighborhood overlaps with Sunset Cliffs Natural Park, a 68-acre reserve known for its sea caves, rock arch formations, and extremely steep bluffs. Follow a path along the cliffs for a scenic walk, while making note of the sprawling homes nearby. Head up the hill to the nearby
                        - link "Little Lion Café" [ref=e1084] [cursor=pointer]:
                          - /url: https://www.cntraveler.com/restaurants/san-diego/little-lion-cafe
                        - text: for a healthy, Cali-bistro fare to-go or dine on their small patio. Or grab Cuban sandwiches, pastries and desserts at Azucar, Chef Vivian Hernandez-Jackson's excellent neighborhood bakery, and head to the water for a sweet sunset.
                      - link "Read Full Review" [ref=e1085] [cursor=pointer]:
                        - /url: https://www.cntraveler.com/activities/san-diego/sunset-cliffs
