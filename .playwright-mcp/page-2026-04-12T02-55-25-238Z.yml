                  - paragraph [ref=e215]: Some may scoff at its nickname—"America's Finest City"—but when it comes to things to do in San Diego, this destination offers far more than just temperate weather year-round. Yes, as befitting any city in Southern California, there are pristine beaches; but there's also a vibrant arts scene; food and music that embrace the diversity of cultures here; and a rich military history that lend San Diego its distinct charm. As for that temperate weather—well, it means it's easy to get outside and enjoy some of the country's best hiking, biking, and surfing spots. Whatever has brought you to town, be sure to stop by the places on this list, a roster of the best things to do in San Diego.
