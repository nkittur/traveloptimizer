                        - heading "Little Italy" [level=3] [ref=e771]:
                          - paragraph [ref=e772]: Little Italy
                      - paragraph [ref=e775]:
                        - text: One of the buzziest neighborhoods in San Diego, Little Italy is the place to go for charming restaurants and bakeries, wine bars, and boutique shopping. The main thoroughfare along India Street is home to trusty favorite Italian spots like Barbusa, Buon Appetito, and Civico 1845, but the neighborhood has made room for several non-Italian restaurants in recent years, such as
                        - link "Ironside Fish & Oyster" [ref=e776] [cursor=pointer]:
                          - /url: https://www.cntraveler.com/restaurants/san-diego/ironside-fish-and-oyster
                        - text: ","
                        - link "Juniper & Ivy" [ref=e777] [cursor=pointer]:
                          - /url: https://www.cntraveler.com/restaurants/san-diego/juniper-and-ivy
                        - text: ", and Queenstown Public House. Stroll through the market along West Cedar Street between Kettner Boulevard and Front Street, picking up samples and prepared foods along the way. Rest your legs at Piazza della Famiglia, a European-style open-air community space with shaded bistro tables that’s right next to the Little Italy Food Hall. Go for a fun night out, or at least for a drink and a stroll. It's fun to see everyone in action."
                      - link "Read Full Review" [ref=e778] [cursor=pointer]:
                        - /url: https://www.cntraveler.com/shops/san-diego/little-italy
