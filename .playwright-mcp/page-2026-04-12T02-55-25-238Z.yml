                        - heading "Del Mar Racetrack" [level=3] [ref=e1099]:
                          - paragraph [ref=e1100]: Del Mar Racetrack
                      - paragraph [ref=e1103]: Put on your biggest hat or chicest fascinator and head to San Diego's Del Mar Racetrack for horse races by the sea, “where the turf meets the surf.” The track is open Thursday through Sunday, holding about eight to 12 races daily. There are 30 minutes between races to place your bets or refill your drink. In general, it's mostly adults here. But during the track's non-racing hours, the venue holds special events like food truck festivals and concerts, and the annual San Diego County Fair in June and July. No matter what time of year you visit the track, it’s a good idea to bring a light jacket or sweater. The so-called "marine layer"—an air mass that develops over the surface of a large body of water—brings a chill year-round, especially for spectators seated in the shade.
                      - link "Read Full Review" [ref=e1104] [cursor=pointer]:
                        - /url: https://www.cntraveler.com/activities/san-diego/del-mar-racetrack
