                        - heading "Cabrillo National Monument" [level=3] [ref=e1244]:
                          - paragraph [ref=e1245]: Cabrillo National Monument
                      - paragraph [ref=e1248]: This nature preserve and historic site at the edge of the Point Loma peninsula is one of the most picturesque spots in San Diego. It’s about 20 minutes from downtown, with the scenic ocean views starting from the moment you drive in. Once you park at the visitor center, you’re treated to panoramic views of San Diego Bay, downtown, Coronado, and the naval station on North Island. On clear afternoons, you can see all the way to Tijuana, Mexico. The park spans 140-plus acres, and there’s plenty of outdoor activities here from hiking trails to exploring tide pools, or just enjoying the views from one of the many overlooks. Cabrillo National Monument is a landmark where several milestones in San Diego’s modern history converge.
                      - link "Read Full Review" [ref=e1249] [cursor=pointer]:
