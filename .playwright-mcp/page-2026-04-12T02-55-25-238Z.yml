                        - heading "Cedros Avenue Design District" [level=3] [ref=e1550]:
                          - paragraph [ref=e1551]: Cedros Avenue Design District
                      - paragraph [ref=e1554]: Take a stroll down the palm tree-lined Cedros Avenue Design District in sunny Solana Beach (just north of San Diego) to shop at eclectic local independent boutiques, galleries, and home goods stores. To pair beauty with supporting small business, pop into Native Poppy, a cheery floral boutique selling bouquets, plants, giftables, and greeting cards. Don’t skip the Aaron Chang Ocean Art Gallery, which features striking fine art photography by the local artist, a noted surfing and ocean photographer. When you’re ready for a break, grab a cold brew at Lofty Coffee. On Sundays, the Solana Beach Farmers Market at the district’s south end spans about 60 organic food, craft, and specialty product vendors, plus a food court slinging everything from crab cakes to crepes. Attracting the largest crowds on Cedros, though, is Belly Up, an intimate, genre-spanning live music venue that's been in business since 1974.
                      - link "Read Full Review" [ref=e1555] [cursor=pointer]:
                        - /url: https://www.cntraveler.com/activities/solana-beach/cedros-avenue-design-district
