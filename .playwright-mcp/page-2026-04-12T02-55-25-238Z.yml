                        - heading "San Diego Zoo" [level=3] [ref=e413]:
                          - paragraph [ref=e414]: San Diego Zoo
                      - paragraph [ref=e417]: The world-renowned San Diego Zoo spans 100 acres and houses more than 12,000 rare and endangered animals. In addition to the 600 different species on display, the zoo's 700,000 types of plants create a lush jungle environment unlike any other. 2024 was a landmark year for the zoo, as it welcomed the return of two giant pandas from China, Xin Bao and Yun Chuan, at the renovated and expanded Panda Ridge exhibit. In 2025, two Tasmanian devils arrived at the Australian Outback exhibit. The former Children’s Zoo is now the Wildlife Explorers Basecamp and offers interactive and educational displays on insects, amphibians, and other wildlife, and is complete with play areas including a giant treehouse with rope bridges, a splash zone with a small waterfall, and climbing stations.
                      - link "Read Full Review" [ref=e418] [cursor=pointer]:
                        - /url: https://www.cntraveler.com/activities/san-diego/san-diego-zoo
