                        - heading "Mission Basilica San Diego de Alcalá" [level=3] [ref=e933]:
                          - paragraph [ref=e934]: Mission Basilica San Diego de Alcalá
                      - paragraph [ref=e937]: There are 21 missions dotting the California coast, and San Diego lays claim to the first. Established in 1769, Mission San Diego de Alcalá is the physical representation of Christianity's birth on the West Coast. Even today, you can worship here—it's an active parish with Mass held daily—but even if you aren't a practicing Catholic, the mission is still a sight to behold, with white stucco walls, Spanish roof tiles, and grand archways. Attendance here is casual; no tickets needed (unless you're booking a guided group tour) and admission is $8 per adult. Although it’s near the suburbs and big-box stores in the Mission Valley neighborhood, the Mission San Diego de Alcalá feels worlds away. The building is in great condition—it's the fifth church built on the site since 1769—and the grounds are immaculate. Make sure to spend some time in the gardens, which are filled with palms, flowers, and succulents.
                      - link "Read Full Review" [ref=e938] [cursor=pointer]:
                        - /url: https://www.cntraveler.com/activities/san-diego/mission-basilica-san-diego-de-alcala
