                        - heading "Torrey Pines Golf Course" [level=3] [ref=e433]:
                          - paragraph [ref=e434]: Torrey Pines Golf Course
                      - paragraph [ref=e437]: Just north of San Diego, La Jolla's iconic Torrey Pines Golf Course is known for its two 18-hole championship courses that sit on a cliff overlooking the Pacific. The South Course is the more challenging of the two and hosts the annual Farmers Insurance Open. Tiger Woods has clinched career-defining wins here, and word is former President Barack Obama has teed off at Torrey Pines, too. From the scenery and challenging greens to the prestige factor, this course is a bucket list destination for avid golfers. There's diverse terrain, ocean views, and hang gliders usually floating around holes 12 and 13 on the south course. Big-time golf fans with cash to burn need only apply. Tee times are often limited (reservations recommended), and it'll run you about $200–$300 per person to play here.
                      - link "Read Full Review" [ref=e438] [cursor=pointer]:
                        - /url: https://www.cntraveler.com/activities/la-jolla/torrey-pines-golf-course
