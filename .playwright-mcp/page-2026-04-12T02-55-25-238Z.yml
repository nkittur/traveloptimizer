                          - paragraph [ref=e562]: Belmont Park
                      - paragraph [ref=e565]: "Amusement parks can be kitschy, indulgent, and a little cheesy—and at Belmont Park, we embrace it. The ocean-adjacent San Diego mini amusement park is hard to miss as you drive west on Mission Bay Drive, thanks to the towering Giant Dipper roller coaster that serves as the park's centerpiece. The historic park recently celebrated its centennial, and retains its nostalgic charm alongside modern games and attractions. First things first: Ride the coaster. Built in 1925, the 2,600-foot-long Giant Dipper is one of only two wooden scaffold-supported roller coasters of its kind still operating on the West Coast, and it’s a fun, rattling ride that soars above the park and offers ocean views. New attractions include Shipwreck Cove, a kid-friendly interactive tower that features a 30-foot drop, themed escape rooms, and the Tiki Typhoon, a ride that spins around at 20 RPM."
