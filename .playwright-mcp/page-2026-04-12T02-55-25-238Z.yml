                      - link "Torrey Pines Gliderport" [ref=e1715] [cursor=pointer]:
                        - /url: https://www.cntraveler.com/activities/la-jolla/torrey-pines-gliderport
                        - heading "Torrey Pines Gliderport" [level=3] [ref=e1716]:
                          - paragraph [ref=e1717]: Torrey Pines Gliderport
                      - paragraph [ref=e1720]: The views of the coastal bluffs and sparkling Pacific Ocean from this vantage point are picture-perfect. While some gliderports are private, Torrey Pines is unique in that it’s open to the public and one of the oldest gliderports in the US dating back to the 1920s—aviation pioneer Charles Lindbergh took his first glider flight in a sailplane here. You don’t have to be an adrenaline junkie to appreciate the gliderport. It’s a great spot for people of all ages to enjoy the panoramic views of the ocean, Scripps Pier, and bluffs from a high vantage point, and kids especially will delight in watching the gliders take off and land. If you’re feeling adventurous, you can sign up for a tandem lesson with an instructor for a 20-minute flight onsite.
                      - link "Read Full Review" [ref=e1721] [cursor=pointer]:
