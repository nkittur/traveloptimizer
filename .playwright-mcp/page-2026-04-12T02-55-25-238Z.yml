                        - heading "The Rady Shell at Jacobs Park" [level=3] [ref=e1844]:
                          - paragraph [ref=e1845]: The Rady Shell at Jacobs Park
                      - paragraph [ref=e1848]: The Rady Shell is the summer home of the San Diego Symphony, which performs a wide range of concerts during its seasonal series—from classical works by Tchaikovsky to the music of Prince or nostalgic '90s hits with guest artists. Beyond the symphony’s programming, the venue also welcomes a wide variety of acclaimed performers. Upcoming acts include John Legend, British electronic duo Disclosure, stand-up comedy by Emmy Award winner John Mulaney, and more. The venue is set within a public park, and the open design fosters a sense of connection with the community—parkgoers and passerby can enjoy rehearsals and performances from the surrounding promenade. When a concert or event isn’t scheduled, the Rady Shell makes for a nice stop during a walk from the Convention Center to the shops and restaurants at Seaport Village.
                      - link "Read Full Review" [ref=e1849] [cursor=pointer]:
