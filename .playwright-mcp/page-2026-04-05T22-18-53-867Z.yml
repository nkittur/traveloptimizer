                - paragraph [ref=e1275]: Cafe Momentum, a Downtown restaurant with branches in Dallas and Nashville, is a mission-driven restaurant that serves a great meal. The staff is composed of those seeking social justice through the workplace as well as at-risk youth who learn front- and back-of-house skills throughout a 12-month paid internship. The menu features a signature smoked and fried chicken, red snapper with squid ink, and seasonal salads.
