                - paragraph [ref=e850]: Casbah is a Pittsburgh classic in Shadyside that’s about to celebrate its 30th anniversary for good reason. It’s a crowd pleaser for tailored gatherings, with an engaging wine list, strong service, and the kind of meal to linger over. Start with dishes like Mediterranean spreads and grilled artichokes, move on to mussels or grilled octopus, split the chicken orecchiette with sage cream, or splurge on the Elysian Fields lamb.
