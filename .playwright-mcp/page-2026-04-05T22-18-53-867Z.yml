                  - paragraph [ref=e1371]: The owners of Amazing Dumplings are a husband and wife team Fenping Geng and Feng Gao, who have deepened their celebration of Northern Chinese-style dishes for the past few years. Geng handles the dumplings, many of which come wrapped in vividly rainbowed, vegetable-dyed skins. Favorites include spicy pork with lotus root, the vivid “Van Gogh Starry Night” and sesame hot oil. Gao’s hand-pulled hot oil and biang biang noodles are also must-gets — the tomato and egg and the beef hot-oil version are great. Go with a group or a date.
