                      - img "Link" [ref=e414]
                  - paragraph [ref=e416]:
                    - text: Allegheny Wine Mixer is a Lawrenceville favorite, with its eclectic collection of flea-market paintings and a name inspired by the Catalina Wine Mixer scene in
                    - link "Step Brothers" [ref=e417] [cursor=pointer]:
                      - /url: https://www.youtube.com/watch?v=lJ9HcYuGVgU
                      - emphasis [ref=e418]: Step Brothers
                    - text: ". As such, it doesn’t take itself too seriously, though it offers a selection of interesting wines by the glass, with pours from often underrepresented wine regions and a small but compelling cocktail list. Food is limited to meat-and-cheese plates, toasties, sweet bites, and specials like hot dog Sundays. Co-owner with Piccolo Forno’s Domenic Branduzzi, Roger Li also operates three nearby establishments: the excellent Izakaya Umami, multifaceted Nanban, and terrific Hong Kong-influenced Parlor Dim Sum. All are worth visiting."
