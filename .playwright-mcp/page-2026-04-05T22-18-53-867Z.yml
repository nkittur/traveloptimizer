                  - paragraph [ref=e892]: Jamilka Borges and Dianne DeStefano were two of the chefs who helped spur Pittsburgh dining forward in the 2010s. Last year, the duo paired up to open Lilith, a lovely neighborhood bistro carrying on the tradition of hospitality-focused, joyful dining in the space previously occupied by the late Toni Pais’ Cafe Zinho. Borges’ savory offerings tilt coastal, drawing influence from her native Puerto Rico with items like scallop crudo, coconut oil, chili, and lime. DeStefano handles the bakery side of the operation, offering a selection of fresh bread and classic-meets-contemporary desserts such as baked Alaska with creme fraiche semifreddo, plus strawberry, lemon, and coriander streusel.
