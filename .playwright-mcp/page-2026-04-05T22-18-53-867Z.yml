                  - paragraph [ref=e960]: Pleasing breakfast, lunch, and dinner selections plus ultra-friendly service combine to make DiAnoia’s Eatery the day-into-night Italian restaurant that makes it a city staple. Breakfast means egg sandwiches, simple omelets, and toasts on terrific bread. Lunch is cold and hot paninis, pasta, and a few small plates. DiAnoia’s dinner menu expands on the pasta and contorni, adding larger dishes such as luscious porchetta and steak Florentine. Don’t skip the next-door pizzeria, Pizzeria Davide, and the family’s bakery and takeaway shop, Pane e Pronto, just a few blocks up the street.
