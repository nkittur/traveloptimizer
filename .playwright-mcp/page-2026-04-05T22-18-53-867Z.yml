                  - heading "The Warren Bar & Burrow" [level=2] [ref=e1195]
                  - button "Copy link" [ref=e1197] [cursor=pointer]:
                    - img "Link" [ref=e1198]
                - paragraph [ref=e1200]: The Warren is always there to fill our cravings after concerts, performances, and sporting events with a kitchen that stays open until midnight (a rare find in a town where it’s hard to get a good bite after 10 p.m.) and a bar open nightly till 2 a.m. You’ll find a selection of well-made, globally influenced pub grub as well as fresh fish and sushi dishes from business partners Penn Ave. Fish Co. The terrific bartenders seamlessly straddle high-volume and more elaborate cocktail styles and offer terrific beer and wine lists. The new sidebar, E.T.A. is a Japanese-style standing bar with an ace highball and cocktail list; the vinyl record playlist offers a significantly more chill atmosphere than its raucous neighbor.
