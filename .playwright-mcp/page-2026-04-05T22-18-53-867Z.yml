                  - text: at this three-year-old Nigerian spot in Squirrel Hill from Dr. Saudat Lawal and her husband, Luke. Lawal brings the heat in the kitchen to her pepper soups (the transcendent fish pepper soup is a must-get), and her chicken drumsticks in red sauce are some of the best in town. Round out your meal with an order of fufu or jollof rice. Lawal and her family import peppers, spices, stockfish, and other ingredients harder-to-find in Pittsburgh to ensure the dishes are true to her memory. A menu of beer, wine, and cocktails like a Lagos sunrise is available in the comfortable dining room.
