                  - paragraph [ref=e1431]: "Just around the corner from Squirrel Hill’s primary business district is a two-for-one special: Hidden Harbor and Independent Brewing Company. Hidden Harbor is one of the foremost tiki bars in the country, featuring an array of potent, tropical-style cocktails (take the “shark fin” strength warnings seriously) and a rum collection of more than 500 bottles. Independent Brewing Company is focused on beer, serving an ever-rotating selection of local and international craft brews from its taps. Look for items like tacos al pastor and smash burgers on the food menu."
