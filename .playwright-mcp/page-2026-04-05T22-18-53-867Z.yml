                - paragraph [ref=e1536]: Maria Elizabeth “Betty” Hernandez, a native of Honduras, came to Pittsburgh in 2013 and launched her eponymous restaurant in Pittsburgh’s burgeoning Beechview neighborhood (home to many of the city’s most exciting Mexican, Central, and South American restaurants) in 2019. From a menu of Honduran, Salvadoran, and Mexican dishes, start with baleadas, the Honduran staple with homemade flour tortillas, refried beans, and fresh cheese, or Salvadorian pupusas with fried pork belly. The restaurant’s mammoth torta Cubana is one of Pittsburgh’s grand sandwiches.
