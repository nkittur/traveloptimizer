                  - heading "Piccolo Forno" [level=2] [ref=e442]
                  - button "Copy link" [ref=e444] [cursor=pointer]:
                    - img "Link" [ref=e445]
                - paragraph [ref=e447]: Long before Lower Lawrenceville was a mini-restaurant row, Piccolo Forno served Northern Italian cuisine to hungry diners. Domenic Branduzzi followed in his parents’ culinary footsteps when he opened the restaurant in 2005. It’s a destination for thin and crispy wood-fired pizza (try the speck e mascarpone and mortadella e pistachio) and pasta made from scratch by Branduzzi’s mother, Carla. Branduzzi’s fantastic grappa and amari bar Grapperia is just around the corner, a terrific spot for pre- and post-dining drinks.
