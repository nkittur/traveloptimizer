                - text: from D.C., Pittsburgh punches above its weight in terms of diverse offerings, quality food, creative indie spots, and beloved longtime go-tos that have shaped generations of how the city eats.
              - paragraph [ref=e233]: Its foodways reflect influences of Appalachia, Italian American classics, polished New American restaurants, and a burgeoning Chinese scene. Because Pittsburgh is such a liveable city, affordable, with great neighborhoods, and rich cultural offerings — the Carnegie Museum, superb libraries, the Warhol, the Pittsburgh symphony, the Pirates, and of course, the Steelers — it’s attracting new and diverse residents. The restaurants reflect how the city is changing.
              - paragraph [ref=e235]:
                - text: This Eater 38 depicts where to eat and drink right now, an all-encompassing guide featuring a wide berth of restaurants new and old, fancy and affordable, plus a few great bars with easy-to-like bites. Have only a short time in the city? Check out
                - link "our weekend guide" [ref=e236] [cursor=pointer]:
