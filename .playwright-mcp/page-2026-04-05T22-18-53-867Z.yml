                  - paragraph [ref=e1310]: Pittsburgh was a xiao long bao desert until Mike Chen, the godfather of modern Chinese cuisine in Pittsburgh, opened Everyday Noodles in Squirrel Hill in 2013. The neighborhood is now a destination for regional Chinese dishes, with this foundational gem still putting out juicy soup dumplings and the “thwap! whap!” sounds of cooks pulling and stretching noodles for dishes like dan tzu noodles. Grab some items from the top of the list, too (the funky-sweet golden cabbage is a must-get).
