                - paragraph [ref=e762]: It’s increasingly rare to find a welcoming neighborhood bar that serves good food and well-made drinks at reasonable prices, yet maintains an old-school vibe without trying too hard. Kelly’s Bar & Lounge, founded in the 1940s and every bit as relevant today, is one of them. Grub highlights include a killer chicken sandwich, a tuna melt, and tofu bites. Cocktails veer toward staples like Negronis, palomas, and vespers, with daily specials rotated into the mix.
