                  - paragraph [ref=e254]: Six-time James Beard-nominated chef Wei Zhu hails from Chengdu, in China’s Sichuan Province. Plan on visiting with a crew to forge a meal that combines Sichuan classics like mapo tofu, cumin lamb, and Chongqing crispy chicken with rarer finds such as their own Chinese sausage, green Sichuan peppercorn fish soup, and vinegary shoestring potatoes. The newer Chengdu Gourmet 2 location just north of Pittsburgh is more elaborately decorated (and features fresh fish and shellfish tanks) than the original Squirrel Hill branch.
