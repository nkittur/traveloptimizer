                  - paragraph [ref=e733]: Fet Fisk, Pittsburgh’s buzziest new opening of 2024, debuted in March in a former Italian restaurant space in Bloomfield. Nik Forsberg, who landed a 2023 James Beard award semifinalist nod while operating Fet Fisk as a pop-up, helms the kitchen, offering a seasonal, Scandinavian-influenced lineup of dishes like pickled mackerel with smoked beets and seafood salad. The juicy roasted chicken with lingonberry sauce is a must.
