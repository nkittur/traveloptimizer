                - paragraph [ref=e1125]: This suburban Indian restaurant is one of the region’s oldest vegetarian establishments. The bustling dining room at Udipi resembles a neighborhood diner, but instead of plates of eggs and hash browns, it’s an assemblage of dishes from southern India’s Tuluva-Mangalorean and Andhra cuisines. The main draws are dosas, fermented rice, and lentil batter griddled into yard-long crepes stuffed with potatoes, onions, and other ingredients. Sambahr (lentil and vegetable soup), deluxe thali platter, and chili padoka are among other favorite dishes.
