                  - paragraph [ref=e1160]: Con Alma is a favorite downtown destination for pre- and post-show drinks and entertainment in a standalone space. The broad dining room and elegant bar harken back to an era when Pittsburgh was a hotbed for jazz. Today, you’ll find local and touring musicians playing here seven nights a week. Con Alma’s drinks menu features terrific seasonal cocktails, (spins on) classics, and a sharply curated wine list. The establishment’s dinner menu draws from Mediterranean influences, with roasted whole branzino with spicy berbere caponata, preserved lemon, and snacky bites like beet muhammara.
