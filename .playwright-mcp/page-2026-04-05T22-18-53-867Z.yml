                  - paragraph [ref=e813]: Drew Allen has perfumed Homewood with the aroma of hardwood smoke and slow-cooked meat for over 20 years. His Showcase BBQ is a draw for its smoked ribs, which have a tender tug as you pull the just-charred meat from the bone. His melting turkey ribs (technically part of the shoulder) are a reminder that enjoying the great bird ought not to be limited to Thanksgiving. Top those, or the crisp chicken wings, with a spoon of Showcase’s piquant barbeque sauce to add a little oomph to your day. The sides here are as much of a draw as the meats — yams, green beans, mac and cheese, and potato salad are a few of the standouts.
