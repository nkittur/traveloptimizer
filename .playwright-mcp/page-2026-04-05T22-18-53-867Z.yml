                - paragraph [ref=e1404]: Ariel Alexander and Cody Maze launched Stuntpig as a food truck in 2020. Their celebration of smoked and cured meats (plus some vegetarian options) in sandwich form quickly became a sensation at Pittsburgh-area breweries and events. Earlier this year, the couple opened a brick-and-mortar version of the now-retired “Pig Rig,” serving a rotating menu of killer handhelds such as Mr. Orange (smoked chicken, peri-peri sauce, pickles), Pitt Beef (smoked and shaved beef, thin vidalia onions, tiger sauce) and Madonia’s Muffuletta. Expect a small selection of handmade sides. The super-herby potato salad is especially good.
