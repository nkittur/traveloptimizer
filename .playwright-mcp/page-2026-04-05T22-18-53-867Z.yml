                - paragraph [ref=e1336]: Skip the national chains and head to one of Moonlit Burgers’ two locations for top-tier smash burgers, crispy chicken sandwiches, shoestring fries, and other tasty sides. Longtime Pittsburgh hospitality industry pros Mike McCoy and Derek Stevens spun an early COVID-19 era smash burger pop-up into a fully-fledged business in 2021, building the framework for a locally owned fast food destination — with a full bar to boot — in Dormont. Robust systems are on full display at Moonlit’s Uptown location before events and games at PPG Paints Arena, with the team keeping long lines moving and hot food delivered to tables at a quick clip.
