                - paragraph [ref=e932]: Hit Max’s Allegheny Tavern in Pittsburgh’s East Allegheny neighborhood for a bit of history. The front room’s grand wood-paneled bar and hexagonal tiled floor date back to the early 1900s when the building was called Hotel Rahn. It has existed as Max’s since 1977, offering a sprawling series of semi-private nooks and dining rooms across the floorplan of two attached buildings. The portions of the German-style cuisine are hefty; try the schnitzels, sausages, and German potato salad.
