                  - heading "Hyeholde Restaurant" [level=2] [ref=e282]
                  - button "Copy link" [ref=e284] [cursor=pointer]:
                    - img "Link" [ref=e285]
                - paragraph [ref=e287]: When William Kryskill built the Hyeholde for his wife, Clara, 87 years ago, the area surrounding Pittsburgh International Airport was a vast stretch of farmland far from Downtown. Today, it’s suburbs, some fancy homes, and big box stores, yet the restaurant survives as a reminder of an era of white-tablecloth dining and formal service. Longtime chef Chris O’Brien purchased the castle-like restaurant from the Kryskill’s daughter Barbara a few years ago, carrying on the tradition of romantic dining with a bill of fare that includes sherry bisque, summer gazpacho, and elk loin with baby turnips, chard, and port au poivre sauce.
