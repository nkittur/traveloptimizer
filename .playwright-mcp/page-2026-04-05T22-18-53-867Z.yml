                  - paragraph [ref=e1496]: Michele and Cindy Savoia run the very definition of an Italian neighborhood restaurant just a few blocks from one of Pittsburgh’s main partying drags. Dish, a beloved favorite for over 20 years now, offers a Sicilian-influenced roster of dishes where high-quality ingredients take center stage. Start with seasonal soup and seafood dishes such as carpaccio di tonno and grilled sardines bathed in fresh lemon juice. Then dig into Savoia’s terrific pasta dishes like his celebrated rigatoni alla scamorza (with cheese). Brother Andrea Savoia runs the energetic front-of-house, where you’ll find regulars aplenty.
