                - paragraph [ref=e1054]: Housed in a former firehouse, 12-year-old Bar Marco is one of the restaurants that pushed Pittsburgh’s restaurant revival forward in the early 2010s. The establishment pairs a well-executed Italian menu with pork tonnato, pastas, and fleeting seasonal offerings like asparagus with pistachio pesto and fava greens. The Strip District eatery has a top-flight cocktail list and one of Pittsburgh’s largest selections of amari. Bar Marco is a no-tip restaurant, with the two-course menu currently running $45 for an antipasti or salad and a pasta or large plate.
