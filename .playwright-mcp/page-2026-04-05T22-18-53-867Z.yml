                  - paragraph [ref=e673]: What does the definition of a contemporary brewery look like? Visit Trace Brewing in Bloomfield. The taproom offers an ever-shifting mix of easy-to-love beer covering a wide range of styles and ABV percentage, as well as on-tap cocktails from nearby Goodlander Cocktail Brewery. By day, Trace showcases a top-tier coffee menu and doubles as an easy-breezy space for meetings and hanging out. The deliberately inclusive space hosts a range of events, including the super popular Slappers N Bangers, Disco Sunday Disco, and Sunday drag brunches. There’s almost always something tasty to eat, as Trace programs a deep rotation of the region’s food trucks.
