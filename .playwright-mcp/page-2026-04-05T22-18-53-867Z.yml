                      - img "Link" [ref=e1569]
                  - paragraph [ref=e1571]: Pittsburgh has plenty of old-school diners, yet Gab & Eat stands out. Owners Sue Smith and Karie Goedert manage the 41-year-old eatery with a welcoming, no-nonsense staff who cater to regulars and newcomers at the 14-seat counter or 12 booths in the rectangular space within a shopping plaza just outside the city limits. Enjoy a mug of robust coffee alongside fluffy pancakes, heaps of home fries, crispy bacon, and eggs cooked to your preference. Gab & Eat’s flattop chefs were smashing burgers long before it became trendy; the never-frozen beef patties, topped with razor-thin onions and traditional garnishes, rank among Pittsburgh’s finest.
