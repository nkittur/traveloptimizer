                - paragraph [ref=e631]: Acclaimed restaurateurs Justin Severino and Hilary Prescott Severino founded Morcilla to follow their lauded, now-closed Cure. Sit in the taverna-style dining room for larger plates from executive chef/partner Nate Hobart, like top-notch Laurel Hill Farm trout with vivid salsa verde. Morcilla’s bar offers perfectly balanced cocktails, deep wine list, and an outstanding spirits selection.
