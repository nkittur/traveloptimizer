                  - paragraph [ref=e482]: California-influenced baker’s style pizzas are the core of Neil Blazin’s sourdough shop in Lower Lawrenceville. He and his team offer square and round pies, plus Roman-style cuts of pizza ranging from classics to seasonal options such as corn and peach. Over the years, Blazin has expanded Driftwood Oven into a full-fledged bakery, with high-quality bread, bagels, and sweets. The menu also includes hefty sandwiches, salads, and snacks. Seating is limited.
