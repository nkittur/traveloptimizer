                  - paragraph [ref=e1235]: The Richard DeShantz Restaurant Group operates numerous bars that happen to be restaurants throughout the city, ranging from the Strip District funhouse Coop de Ville to the eclectic Fish nor Fowl. The best is Gi-Jin. The intimate Downtown spot highlights raw fish with some of the city’s best nigiri, and its sushi chefs also prepare terrific hand rolls. Small plates such as hamachi crudo with ponzu, ginger oil, and daikon also stand out. Gi-Jin’s beverage list is deep, with sake and gin selections that are hard to find elsewhere in Pittsburgh.
