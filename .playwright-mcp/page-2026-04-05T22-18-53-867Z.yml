                - paragraph [ref=e702]: A Pittsburgh institution since 1981, Tessaro’s serves thick, handcrafted burgers with a custom blend of beef ground in-house daily cooked over a blend of PA hickory, oak, maple, and ash hardwoods by longtime grillmaster Courtney McFarlane. The tavern-style burgers are the primary draw, though you should also make it a point to visit the historic Bloomfield building on Thursdays for Tessaro’s weekly rib night. The menu is rounded out with steaks, chicken, and sides. Seating sprawls across several expansions; the best place to sit is still the front room, where you can enjoy a burger and cold beverage at or near the 1933 art deco Sears and Roebuck bar.
