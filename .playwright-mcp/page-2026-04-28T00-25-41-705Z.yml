      - generic [ref=e98]:
        - 'figure "Credit: Conny Pokorny/Getty Images" [ref=e99]':
          - img "View from the rugged cliff rocks to Bass Harbor Head Light. The lighthouse was built in 1858 and is located on the coast of the US state of Maine within Acadia National Park in Mount Desert Island." [ref=e102]
          - generic [ref=e104]:
            - text: "Credit:"
            - paragraph [ref=e105]: Conny Pokorny/Getty Images
        - generic [ref=e107]:
          - generic [ref=e108]:
            - text: Key Points
            - list [ref=e110]:
              - listitem [ref=e111]: Acadia National Park, set on Maine's coastline, is best visited from late August to mid-October for stunning views.
              - listitem [ref=e112]: The park offers extensive outdoor activities, including hiking the 150 miles of trails and experiencing unique spots like Thunder Hole.
              - listitem [ref=e113]: Visitors can stay overnight in several places, including campgrounds, Terramor Outdoor Resort, and historic hotels like The Claremont.
          - paragraph [ref=e114]: Acadia National Park encompasses nearly 50,000 acres along the coastline of Maine. One of the oldest and most-visited parks in the United States, Acadia welcomes more than four million visitors each year. The park spans nearly half of Mount Desert Island, the largest island off the coast of Maine, as well as a collection of smaller islands and the Schoodic Peninsula. The area is home to nearly 60 miles of coastline, 150 miles of hiking trails, and the 27-mile historic Park Loop Road.
          - paragraph [ref=e115]: Established in 1916 by President Woodrow Wilson, the country’s easternmost national park is one of the first places in the country to see the sunrise, with unparalleled views from atop Cadillac Mountain. The park offers extensive opportunities for hiking and biking, wildlife spotting, and fishing. While most visitors opt to visit in the summer, cold-weather enthusiasts can partake in cross-country skiing, snowshoeing, ice fishing, and snowmobiling throughout areas of the park during the winter.
          - paragraph [ref=e116]: Here's everything you need to know before visiting Acadia National Park.
          - 'figure "Credit: aimintang/Getty Images" [ref=e117]':
            - img "Cadillac Mountain at Sunrise in Autumn, Acadia National Park, Mount Desert Island, Maine, USA" [ref=e120]
            - generic [ref=e122]:
              - text: "Credit:"
              - paragraph [ref=e123]: aimintang/Getty Images
          - heading "Know Before You Go" [level=2] [ref=e124]
          - paragraph [ref=e125]: Acadia National Park is open year-round; however, some areas of the park operate seasonally and close for the winter. Schoodic Loop, Point Road, Carriage Roads, and Sand Beach are open year-round, while the Hulls Cove Visitor Center, Park Loop Road, and campgrounds are open seasonally.
          - paragraph [ref=e126]: Visitors to Acadia National Park are required to purchase a park entrance pass. Annual passes are available for $70, and private vehicle passes are $35. An additional reservation is required for access to Cadillac Summit Road and costs an additional $6 per vehicle, not per person.
          - generic [ref=e127]:
            - heading "Booking Tip" [level=3] [ref=e128]
            - paragraph [ref=e130]: To make the most of your visit to Acadia National Park, consider booking lodging, campgrounds, and vehicle reservations for Cadillac Summit Road well in advance, especially if you plan to visit during peak season from late August to mid-October.
            - img [ref=e131]
          - heading "Best Time to Visit" [level=2] [ref=e133]
          - paragraph [ref=e134]:
            - text: The
            - link "best time to visit Acadia National Park" [ref=e135] [cursor=pointer]:
              - /url: https://www.travelandleisure.com/trip-ideas/national-parks/best-time-to-visit-acadia-national-park-maine
            - text: is from late August to mid-October because of ideal weather, lower crowds, and stunning foliage. Acadia’s busiest time is June through early fall; visitors can expect large crowds and high occupancy at local campgrounds and hotels. Vanessa Santarelli, a travel planner specializing in planning Maine itineraries and the owner of
            - link "Your Maine Concierge" [ref=e136] [cursor=pointer]:
              - /url: https://www.yourmaineconcierge.com/
            - text: ", says, “If you ask most Mainers, they would likely say the 'sweet spot' of the season is around mid-late September through mid-October.”"
          - paragraph [ref=e137]: “While ‘peak season’ has extended through the early fall as of late, the volume of visitors sharply declines after kids go back to school,” she says. “During this time of year, the days are warm, the evenings are cool, the sunrises and sunsets are kaleidoscopic, and the fall foliage starts to emerge across the landscape.”
          - heading "How to Get There" [level=2] [ref=e138]
          - paragraph [ref=e139]:
            - text: Acadia is roughly 170 miles from
            - link "Portland, Maine" [ref=e140] [cursor=pointer]:
              - /url: https://www.travelandleisure.com/portland-maine-11771625
            - text: . While there are several small airports located closer to the park, the nearest major airport is Portland International Jetport, though Bangor International Airport is technically closest. Visitors can find the fastest route via 95 North or opt for the scenic path, passing through the charming coastal towns of Midcoast Maine, including Rockland, Camden, and Belfast. These towns are destinations in themselves, and they’re perfect places to stop for an evening if the trip needs to be split up.
          - heading "Best Things to Do" [level=2] [ref=e141]
          - 'figure "Credit: Silvia Bianchini/Getty Images" [ref=e142]':
            - img "Jordan Pond, Acadia National Park, Maine" [ref=e145]
            - generic [ref=e147]:
              - text: "Credit:"
              - paragraph [ref=e148]: Silvia Bianchini/Getty Images
          - heading "Drive Park Loop Road." [level=3] [ref=e149]
          - paragraph [ref=e150]:
            - text: Start at
            - link "Hulls Cove Visitor Center" [ref=e151] [cursor=pointer]:
              - /url: https://www.nps.gov/places/hulls-cove-visitor-center.htm
            - text: before driving on Park Loop Road, a 27-mile one-way road that loops around the eastern half of Acadia on Mount Desert Island. The drive winds through forests, mountains, and shorelines. The drive takes roughly one hour and provides access to several can’t-miss stops like Sand Beach, Jordan Pond, and Cadillac Mountain. Guests looking to see the iconic road in a different way can opt to take the self-guided tour with an
            - link "Acadia Gem electric vehicle" [ref=e152] [cursor=pointer]:
              - /url: https://www.acadiagem.com/
            - text: . “I can’t recommend booking one of these two, four, and six-passenger Acadia Gem electric vehicles enough, they offer a more robust experience,” says Santarelli. “The Gems are environmentally friendly, offer greater visibility of the panoramic views with glass rooftops and removable doors in nice weather, are more compact than regular vehicles for easier parking throughout the park, and are conveniently located for pick-ups in downtown Bar Harbor.”
          - generic [ref=e154]:
            - text: "Related:"
            - link "This Island off the Coast of Maine Has One of America's Most Beloved National Parks—How to Visit" [ref=e155] [cursor=pointer]:
              - /url: https://www.travelandleisure.com/mount-desert-island-maine-11745816
          - heading "Visit Cadillac Mountain." [level=3] [ref=e156]
          - paragraph [ref=e157]:
            - text: Visitors can make vehicle
            - link "reservations for Cadillac Mountain" [ref=e158] [cursor=pointer]:
              - /url: https://www.nps.gov/acad/planyourvisit/vehicle_reservations.htm
            - text: "to be among the first people in the country to see the sunrise. This year, reservations are required from May through Oct. Be sure to plan as early as you can, but don’t give up hope for a last-minute trip: While 30 percent of the vehicle reservations are available for purchase 90 days in advance of the reservation date, the remaining 70 percent of reservations are available for purchase at 10 a.m. two days in advance of the reservation date."
          - heading "Stop at Thunder Hole." [level=3] [ref=e159]
          - paragraph [ref=e160]:
            - text: Carved out of coastal rocks,
            - link "Thunder Hole" [ref=e161] [cursor=pointer]:
              - /url: https://www.nps.gov/places/thunder-hole.htm
            - text: is a natural phenomenon. When a wave hits a small cavern at the bottom of the inlet, air and water are forced out, resulting in a sound much like a clap of thunder. The waves can reach up to 40 feet high, making this a must-see stop for any first-time visitor to Acadia.
          - heading "Admire the plants at the Wild Gardens of Acadia." [level=3] [ref=e162]
          - paragraph [ref=e163]:
            - text: The
            - link "Wild Gardens of Acadia" [ref=e164] [cursor=pointer]:
              - /url: https://www.nps.gov/places/wild-gardens-of-acadia.htm
            - text: is home to over 400 native plant species, reflecting the habitats found on Mount Desert Island. Originally founded in 1909, the gardens are open seasonally every morning until dusk, and there is no additional fee to visit.
          - heading "Explore the carriage roads." [level=3] [ref=e165]
          - paragraph [ref=e166]:
            - text: Acadia has more than 45 miles of rustic carriage roads, a gift from John D. Rockefeller Jr. These car-free crushed gravel roads are the perfect way to explore via bicycle, on foot, or even
            - link "by horse-drawn carriage" [ref=e167] [cursor=pointer]:
              - /url: https://acadiahorses.com/
            - text: . Visitors can rent e-bikes from several local operators, including
            - link "Island Time E-Bike Rentals" [ref=e168] [cursor=pointer]:
              - /url: https://islandtimeebike.com/
            - text: ", which will deliver bikes to The Hulls Cove Visitor Center."
          - heading "Take a dip." [level=3] [ref=e169]
          - paragraph [ref=e170]:
            - text: Visitors looking to take a swim can opt for saltwater beaches, like
            - link "Sand Beach" [ref=e171] [cursor=pointer]:
              - /url: https://www.nps.gov/places/sand-beach.htm
            - text: ", or take a dip in the freshwater"
            - link "Echo Lake" [ref=e172] [cursor=pointer]:
              - /url: https://www.nps.gov/places/echo-lake.htm
            - text: . For people looking to take to the sea, the
            - link "Bar Harbor Whale Watch Co." [ref=e173] [cursor=pointer]:
              - /url: https://www.barharborwhales.com/
            - text: offers whale-watching expeditions, lighthouse and puffin tours, and island tours.
          - heading "Best Hikes" [level=2] [ref=e174]
          - 'figure "Credit: ktaylorg/Getty Images" [ref=e175]':
            - img "Directional sign overlooks the ocean in Bar Harbor from the top of Cadillac Mountain in Acadia National Park." [ref=e178]
            - generic [ref=e180]:
              - text: "Credit:"
              - paragraph [ref=e181]: ktaylorg/Getty Images
          - paragraph [ref=e182]:
            - text: With more than 150 miles of trails, Acadia offers hikes for visitors of every skill level. “There are dozens of trails throughout Acadia National Park and the region to explore, and as long as you time it right (often first thing in the morning, particularly during the busy season), you’ll get a more peaceful and less congested climb or stroll,” says Santarelli. As the terrain varies widely throughout the park, trails take hikers through a variety of environments. Guests looking for an easy hike can take the
            - link "Wonderland Trail" [ref=e183] [cursor=pointer]:
              - /url: https://www.nps.gov/thingstodo/hike-wonderland-trail.htm
            - text: ", a 1.4-mile round-trip coastal path leading visitors alongside the park’s rocky coastline. “The Wonderland is a fabulous trail in its own right with no real elevation, and footpaths out to the dramatic rocky coastline. This area is perfect for oceanfront picnics, artists, yoga, and more,” says Santarelli. Another family-friendly option is"
            - link "Ocean Path" [ref=e184] [cursor=pointer]:
              - /url: https://www.nps.gov/thingstodo/hike-ocean-path-trail.htm
            - text: ", a 4.4-mile round-trip trail that offers views of pink granite, seaside cliffs, and ocean views."
          - paragraph [ref=e185]: “The majority of my clients aren’t looking for technically challenging hikes but rather more scenic experiences that don’t eat up the entire day, and where they won’t run into a million people on the trail,” says Santarelli. “A couple of my favorite trails that offer beautiful scenery and elevation, and only take a few hours from start to finish, are Acadia Mountain Trail over towards the 'quiet side' of Mount Desert Island with views of Echo Lake. Or, park at The Wild Gardens of Acadia and start on the Jesup Path over to Kurt Diedrich’s Climb, continuing up to the Dorr Mountain Summit. This trail offers lake, mountain, ocean, and island views, with some dramatic cliff faces along the way that you traverse with a well-established stone stairway for much of the trail.”
          - heading "Wildlife" [level=2] [ref=e186]
          - paragraph [ref=e187]:
            - text: Acadia is home to a wide variety of animals on land, in the sky, and along the shore. Regarded as one of the best bird-watching areas in the country, Acadia boasts a record of 338 bird species encountered. Thanks to the diverse habitats found within the park, guests can spot owls, falcons, eagles, and more. Visitors can stop at the parking lot of the Precipice Trail during the summer to participate in the
            - link "Peregrine Watch" [ref=e188] [cursor=pointer]:
              - /url: https://www.nps.gov/acad/learn/nature/peregrine-falcons-in-acadia.htm
            - text: for an opportunity to use scopes to view peregrine and their nests on the cliff. On the trails, be on the lookout for deer, moose, and black bears. For hikers taking the Wonderland Trail early in the morning, Santarelli says “As you get close to the ‘Seawall’ causeway, keep your eyes peeled and you’re almost guaranteed to see whitetail deer.” Guests visiting from May to October should look to the coast for the chance to spot a humpback or North Atlantic right whale. The coast is also home to seals, dolphins, puffins, and a variety of marine life like crabs, mussels, and urchins.
          - heading "Places to Stay" [level=2] [ref=e189]
          - heading "Campgrounds" [level=3] [ref=e190]
          - paragraph [ref=e191]:
            - text: Visitors looking to camp have their choice between two campgrounds on Mount Desert Island, one campground on the Schoodic Peninsula, and five lean-to shelters on Isle au Haut.
            - link "Reservations are required" [ref=e192] [cursor=pointer]:
              - /url: https://www.nps.gov/acad/planyourvisit/camping.htm
            - text: and are available to reserve via the National Park Service six months in advance. In addition to these public campgrounds in the park, there are a number of campgrounds in the area offering lodging for tents and RVs, such as
            - link "Mount Desert Campground" [ref=e193] [cursor=pointer]:
              - /url: https://www.mountdesertcampground.com/
            - text: .
          - heading "Terramor Outdoor Resort" [level=3] [ref=e194]
          - paragraph [ref=e195]:
            - text: For guests looking to embrace the great outdoors without being too rustic,
            - link "Terramor Outdoor Resort" [ref=e196] [cursor=pointer]:
              - /url: https://terramoroutdoorresort.com/
            - text: is the perfect choice. The resort offers a variety of canvas tents accommodating anywhere from two to five guests, each outfitted with top-notch amenities, including in-room diffusers, electricity, and Wi-Fi. The resort offers complimentary grab-and-go breakfast, the perfect thing before a long day exploring the park.
          - heading "Salt Cottages" [level=3] [ref=e197]
          - 'figure "Credit: Courtesy of Salt Cottages/Getty Images" [ref=e198]':
            - img "Exterior Summer Salt Cottages in Arcadia National Park" [ref=e201]
            - generic [ref=e203]:
              - text: "Credit:"
              - paragraph [ref=e204]: Courtesy of Salt Cottages/Getty Images
          - paragraph [ref=e205]:
            - link "The Salt Cottages" [ref=e206] [cursor=pointer]:
              - /url: https://www.travelandleisure.com/hotels-resorts/hotel-openings/salt-cottages-bar-harbor-maine-acadia-national-park
            - text: are a collection of 30 standalone cottages and 10 bungalow motor-lodge-style oceanfront accommodations located just minutes from the Hull’s Cove entrance to Acadia. The property has an on-site pool, a clubhouse stocked with vintage games, and a snack bar stocked with summer treats.
          - heading "The Claremont" [level=3] [ref=e207]
          - paragraph [ref=e208]:
            - text: One of Maine’s oldest historic properties, The Claremont, underwent a complete renovation in 2021. The Southwest Harbor property offers single guest rooms, cottages, cabins, and two large homes.
            - link "The Claremont" [ref=e209] [cursor=pointer]:
              - /url: https://theclaremonthotel.com/
            - text: touts an impressive waterfront pool, complimentary beach cruisers for guests to explore the area, and several onsite dining and drinking options.
            - emphasis [ref=e210]: Lady Claire
            - text: and
            - emphasis [ref=e211]: Lady A
            - text: ", the Claremont’s very own boats, are available for guests to take sailing along the sound."
          - heading "Places to Eat" [level=2] [ref=e212]
          - 'figure "Credit: nancykennedy/Getty Images" [ref=e213]':
            - img "Outdoor dining area over looking Jordan Pond at Acadia National Park in Maine. Image shot before restaurant opened." [ref=e216]
            - generic [ref=e218]:
              - text: "Credit:"
              - paragraph [ref=e219]: nancykennedy/Getty Images
          - heading "Jordan Pond House" [level=3] [ref=e220]
          - paragraph [ref=e221]:
            - text: The
            - link "Jordan Pond House" [ref=e222] [cursor=pointer]:
              - /url: https://jordanpondhouse.com/
            - text: is the only full-service restaurant inside Acadia National Park, serving its world-famous popovers for more than 100 years. Lunch reservations can be made a month in advance and are recommended, as this is an extremely popular destination for visitors.
          - heading "Peter Trout’s Tavern & Inn" [level=3] [ref=e223]
          - paragraph [ref=e224]:
            - link "Peter Trout’s" [ref=e225] [cursor=pointer]:
              - /url: https://petertrouts.com/
            - text: is a casual tavern that serves Southern-inspired dishes made from scratch with the best ingredients. The waterfront spot is open for lunch, dinner, and weekend brunch. They cook up some of the best fish sandwiches in Maine, featuring a sheet tray-sized Gulf of Maine fish filet fried to perfection.
          - heading "Abel’s Lobster" [level=3] [ref=e226]
          - paragraph [ref=e227]:
            - text: It wouldn’t be a visit to Maine without some lobster, and at
            - link "Abel’s Lobster" [ref=e228] [cursor=pointer]:
              - /url: https://www.abelslobstermdi.com/
            - text: ", you can watch as they’re cooked in steamers right in front of you. This casual waterfront spot serves up Maine oysters, fried clams, and Maine crab rolls, too. More than just the classics, “They also have some of the finest elevated seafood dishes—like their Maine lobster and sweet corn chowder with crispy pork belly on top courtesy of Chef Matt Leddy,” says Santarelli."
          - heading "Blue Hill Co-Op" [level=3] [ref=e229]
          - paragraph [ref=e230]:
            - text: The perfect stop for snacks or anyone opting to camp,
            - link "Blue Hill Co-Op" [ref=e231] [cursor=pointer]:
              - /url: https://bluehill.coop/
            - text: stocks some of the finest small-batch and locally sourced products made in Maine. Visitors can find items from iconic local brands like Morse’s Sauerkraut, Atlantic Seafarms, Bixby Chocolate, and many of the state’s craft beers, like Maine Beer Company.
