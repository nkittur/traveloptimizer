                  - paragraph [ref=e495]:
                    - strong [ref=e496]: What is it?
                    - text: "A restaurant by two young chefs that lives up to its name: the space is rectangular, with a long bar dominating the room and square, industrial-style metal plates, where some dishes even arrive threaded onto skewers."
                  - paragraph [ref=e497]:
                    - strong [ref=e498]: Why go?
                    - text: They talk about four or five ingredients per plate and a simple style of cooking, but there’s actually a lot of work and complexity behind the food here at
                    - link "El Rectangle" [ref=e499] [cursor=pointer]:
                      - /url: https://www.instagram.com/elrectangle/?hl=en
                    - text: ". Try the vegan mushrooms, leek and lemon, and the grilled squid, which comes stuffed with its own fillet and tentacles, served with caramelised onion. Underneath, there’s a broth made from prawn heads, crab and mantis shrimp – homemade, of course – combined with a touch of roasting juices and lime: a spectacular surf-and-turf combination."
                  - paragraph [ref=e500]:
                    - strong [ref=e501]: "Time Out tip:"
                    - text: The idea is to share around five plates between two people.
