                  - paragraph [ref=e435]:
                    - strong [ref=e436]: Why go?
                    - text: Wine is important here, but the food is the star of the show. Try razor clams quickly grilled on the plancha, courgette flowers in a light, crisp tempura, or horse cecina sourced from Santa Caterina itself, among other things. The tomato salad is outstanding – easily among the best in Barcelona. And if you follow it with grilled
