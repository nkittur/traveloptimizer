                  - paragraph [ref=e468]:
                    - strong [ref=e469]: What is it?
                    - text: A Michelin-starred restaurant that has held the distinction almost continuously since opening in 2004, with a bold style of cooking that still preserves a classical French touch.
                  - paragraph [ref=e470]:
                    - strong [ref=e471]: Why go?
                    - text: Barcelona has many Michelin-starred restaurants, but as the years pass – and as some Michelin kitchens grow ever more technically elaborate –
                    - link "Caelis" [ref=e472] [cursor=pointer]:
                      - /url: https://www.caelis.com/en/
                    - text: "’s style becomes even more appealing: refined cooking with all the knowledge and resources behind it, yet where the real focus is on the succulence and coherence of the dishes rather than technical virtuosity."
                  - paragraph [ref=e473]:
                    - strong [ref=e474]: "Time Out tip:"
                    - text: There’s a very reasonably priced lunch menu, which can include dishes like macaroni stuffed with squid and foie gras.
                  - paragraph [ref=e475]:
                    - strong [ref=e476]: "Address:"
                    - text: Via Laietana 49, 08003 Barcelona
                  - paragraph [ref=e477]:
                    - strong [ref=e478]: "Opening hours:"
                    - text: Wednesday-Saturday 1.30-3pm, 8-10pm, closed Sunday-Tuesday
                  - paragraph [ref=e479]:
                    - strong [ref=e480]: "Expect to pay:"
                    - text: Tasting menus are roughly €125, with premium menus around €170, lunch menu about €65.
            - article [ref=e481]:
              - generic [ref=e482]:
                - heading "10. El Rectangle – a lively grill and bar counter" [level=3] [ref=e485]
