                  - paragraph [ref=e411]:
                    - strong [ref=e412]: Why go?
                    - text: "This is the kind of place you’ll want to return to often: the menu changes constantly, everything is 100 percent seasonal, and the prices remain refreshingly modest. This is a small restaurant – you could call it a bistro – where Bertozzi puts his masterful touch to work creating dishes from local produce, cooking on a human scale. Try the green beans with smoked stracciatella, homemade miso made from leftover bread and candied almonds, and the Iberian presa tataki tonnata."
