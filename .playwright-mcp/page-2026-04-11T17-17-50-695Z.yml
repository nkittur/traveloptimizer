                - heading "1. La Sosenga – the best restaurant in Barcelona" [level=3] [ref=e189]
                - generic [ref=e191]:
                  - img "La Sosenga – the best restaurant in Barcelona" [ref=e193]
                  - generic [ref=e195]: "Foto: Time Out Barcelona"
                - generic [ref=e198]:
                  - paragraph [ref=e199]:
                    - strong [ref=e200]: What is it?
                    - text: A restaurant that is firmly rooted in traditional Catalan culinary history (it’s name is taken from the oldest known Catalan cookbook, dating from 1324).
                  - paragraph [ref=e201]:
                    - strong [ref=e202]: Why go?
                    - text: Here, the creativity comes from the way they combine flavours – always anchored in Catalan culinary tradition. All the vegetables at
                    - link "La Sosenga" [ref=e203] [cursor=pointer]:
                      - /url: https://www.lasosenga.es/ca/
                    - text: "are organic and locally sourced, and every supplier is listed at the end of the menu. And dishes are spectacular, like the combo of beans, potato and black trumpet mushrooms: stewed trumpets with Iberian pork jowl, grilled yellow beans and homemade potato gnocchi – a dish that refreshes the pure spirit of Catalan cooking with a creative twist. The menu changes every month, though, so you’ll just have to give it a go."
                  - paragraph [ref=e204]:
                    - strong [ref=e205]: "Time Out tip:"
                    - text: The best thing about this restaurant is its monthly seven-course tasting menu for just €35.
                  - paragraph [ref=e206]:
                    - strong [ref=e207]: "Address:"
                    - text: Carrer de n’Amargós 1, 08002 Barcelona
                  - paragraph [ref=e208]:
                    - strong [ref=e209]: "Opening hours:"
                    - text: Tuesday-Thursday 1-4pm, Friday-Saturday 1-4pm, 8-11pm, closed Sunday-Monday
                  - paragraph [ref=e210]:
                    - strong [ref=e211]: "Expect to pay:"
                    - text: €35 for the tasting menu
