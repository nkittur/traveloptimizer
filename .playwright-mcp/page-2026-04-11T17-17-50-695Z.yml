                  - paragraph [ref=e243]:
                    - strong [ref=e244]: What is it?
                    - text: What began as a spin-off of its older sibling, Bar Alegria, has grown into a solid example of author-driven cooking with a distinctly Mediterranean and Barcelona spirit.
                  - paragraph [ref=e245]:
                    - strong [ref=e246]: Why go?
                    - link "Casa Luz" [ref=e247] [cursor=pointer]:
                      - /url: https://www.casaluzrestaurante.com/en/
                    - text: "lives up to its name (meaning House of Light in English): set on a rooftop overlooking Plaça Universitat with incredible views. And the food is great too – especially the tasting menu. It starts with a few small bites inspired by the tradition of vermouth hour – like mussels in carrot escabeche, or toast topped with Cantabrian anchovy and smoked butter – before moving on to more robust dishes like skate with potatoes and suquet made from rock fish, or their now-iconic tomato tartare with nasturtium leaves and kizami wasabi."
