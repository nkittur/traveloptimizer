                  - paragraph [ref=e711]: Finch Grocery was one of dozens of businesses badly damaged or destroyed when the Swannanoa River swept through Biltmore Village post-Helene. In the twee-est of the twee historic pebbledash cottages in Biltmore Village, Finch was tucked into the alley behind Scout Boutique and stocked from floor to ceiling with wine, packaged gourmet foods, condiments, tea, coffee, chocolate, linens, entertainment accessories, and paper goods. In early 2024, new owners introduced made-to-order lunch items to coffee drinks, tea, and fresh pastries, and added an outdoor patio for seating. The good news is, in October, Finch moved from 10 ½ All Souls Crescent to 10 All Souls Crescent, taking over the Scout building, expanding their footprint, inventory, and menu (wine by the glass, beer, and cider also available). Don’t miss their famous lemon bars.
