                - generic [ref=e172]: is an award-winning restaurant critic, journalist, writer, and author, focused on food, hospitality, the arts, and culture. She has worked in New York, Nashville, and Asheville as a regular contributor to local, regional, and national publications, including seven years as Nashville correspondent for People magazine.
              - paragraph [ref=e174]: Helene significantly altered Asheville’s restaurant landscape, and many temporary closures became permanent. Some relocated to new digs on higher ground, some took the opportunity to re-fresh and re-invent, and in the indomitable mountain spirit the town prides itself on, undaunted dreamers, visionaries, and entrepreneurs rolled out new restaurants, bars, and cafes.
              - paragraph [ref=e176]:
                - text: "More often than not, tipsters, readers, friends, and family of Eater have one question: Where should I eat right now? What are the new restaurants? What’s everyone talking about? While the"
                - link "Eater 18" [ref=e177] [cursor=pointer]:
                  - /url: /maps/best-asheville-restaurants
                - text: is a crucial resource covering old standbys and neighborhood essentials across the city, it is not a chronicle of the “it” places of the moment. Enter the Eater Heatmap, which will change continually to highlight the spots crowds are flocking to at the moment or generating a big buzz. Folks are asking, “Have you been yet?” Try one of these newbies today.
              - paragraph [ref=e179]:
                - emphasis [ref=e180]: "New to the map this update: SEN Vietnamese Street Food, Harmony Wine, Xico, Finch Grocery, Chorizo, and Posana Biltmore Park. Locations are listed geographically from west to east."
