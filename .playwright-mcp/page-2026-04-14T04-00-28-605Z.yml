                - paragraph [ref=e253]: When Boston native Mike Bean launched his sandwich pop-up under the Finest banner at the weekly West Asheville tailgate market in 2023, the enthusiastic feedback urged him to open a brick-and-mortar. There just happened to be an available address a couple blocks away, and after an extensive renovation — and some key additions to the team — Finest opened for breakfast, lunch, and all-day brunch, supported by a beverage program built by fellow New Yorker, co-owner, and certified cicerone Gab Bonfiglio.
                - paragraph [ref=e254]: Co-executive chefs Brooke Adams and Danny Cairo collaborated with Bean to develop the three menus. Start the day with a bodega egg sandwich or vegan fritter sandwich from the walk-up egg window, or go inside for fancier fare like avocado toast, eggs in purgatory, or mushroom gratinati. Lunch sandwiches include bodega chopped cheese, chicken parm, chicken salad, and a vegan “Shroom-Fil-A.”
