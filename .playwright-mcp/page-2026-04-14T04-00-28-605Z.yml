                    - img "Link" [ref=e665]
                - paragraph [ref=e667]: Fast, friendly service, casual indoor/outdoor seating, and thoughtfully adapted Middle Eastern street food — think pita wraps, build-your-own-bowls, dolmas, bourekas, and hummus — made Baba Nahm one of Asheville’s most frequent go-to lunch spots for downtown workers. Its popularity outgrew its tiny slice of the Grove Arcade, and chef-owners Laura and Brian Smith’s culinary ambition outgrew the rudimentary kitchen, so they found bigger digs on busy Biltmore Avenue, with a real dining room, a real bar, a real kitchen with a real hood, and expanded service hours to include breakfast and dinner. Lunch now includes kabobs, a lamb and beef pita burger, a crispy chicken schnitzel sandwich, and meal-sized salads. A succinct dinner menu of apps and entrees changes weekly. Cult favorite Baba fries — smothered in tomato jam, tahini, and harissa — are available from open to close.
