                    - img "Link" [ref=e742]
                - paragraph [ref=e744]: Hot Buns and Tasty Meat were the magic words that drew diners to Zella’s Deli when it first opened on College Street in downtown Asheville in the spring of 2024. The restaurant drew on industry vets John Tressler and Mike Reppert’s urban, northeastern roots (Pittsburgh and New York, respectively) and built a menu based on sandwiches, sides, and salads inherent to the delis they grew up with. That includes Jewish deli classics like pastrami on rye, corned beef, lox and bagels, and branding two sandwiches with their names — Mikey’s meatball sub and Johnny’s Italian (capicola, salami, pepperoni, provolone, lettuce, and tomato. Don’t dare ask for mayo.)
                - paragraph [ref=e745]: Zella’s popularity outgrew that small space, and in April 2024, they moved to bigger digs on US 70 in Swannanoa, where it thrived for the five months prior to being destroyed by Helene. Almost a year to the day, Zella’s (named for Mikey’s mother) is back, closer to town on Tunnel Road in East Asheville. Still with the bold red, white, and black color scheme (and classic black and white cookies), the sandwiches, the pickles, and the After5 Dinner plates honoring all the nonnas out there — spaghetti and meatballs, chicken parm, and alfredo with penne.
