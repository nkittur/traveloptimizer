                - paragraph [ref=e610]: Xico (shee-ko) describes itself as a Cocino de Fuego and Marisqueria — cooking on fire and seafood. Named for a small village in Veracruz, Mexico, Xico has a big vision for its large space in the South Slope. Culinarily driven by serial restaurateur/chef Scott Lindquist, Xico fires up much of its menu in a custom-built Jospur charcoal oven and wood-fired grill, like the bone-in angus ribeye for two and whole butterfly snapper. Tortillas are made fresh from Mexican heirloom corn nixtamal, and Josper-charred Spanish octopus is served with Oaxacan green mole. Table-side Caesar preparation is a special touch, as is the Margarita Classico using the original 1938 recipe from Rancho la Gloria in Baja, California, where legend says the margarita was born.
