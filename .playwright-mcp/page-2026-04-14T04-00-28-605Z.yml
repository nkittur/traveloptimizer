                  - paragraph [ref=e465]: "Chef Hector Diaz has been feeding Ashevillians and tourists for over thirty years from a quartet of downtown, internationally-inspired restaurants: Salsas, Modesto, Bomba, and, until its closure in 2016, Chorizo. Ten years later, Chorizo is back with a focus on tapas and dishes from southern Spain, particularly Córdoba, Madrid, and Andalusia, and a beverage program of Spanish wines, sherry, vermouth, and fancy cocktails. A sunny yellow awning hangs over the entrance on the Page Avenue side of the historic Grove Arcade, marking the spot for breakfast, lunch, and dinner."
