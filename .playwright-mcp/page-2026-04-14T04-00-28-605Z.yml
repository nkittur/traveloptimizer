                      - img "Link" [ref=e280]
                  - paragraph [ref=e282]: It took a coffee roaster and a designer to fully realize the aesthetic and business potential of a former auto garage in West Asheville. Bow Smith, who opened the first Rowan Coffee in a historic building in downtown Asheville, had long pined for space, but it wasn’t until he toured it for the first time that he realized there was room to fulfill his ultimate dream of a roastery and cafe under one roof. He got to work and turned the gorgeous bones of brick, banks of multi-paned original glass windows, polished concrete floors, and high ceilings over to his wife, Jessi Lee Cord. Neighborhood residents and friends fill the bar, banquettes, vintage leather booths, and covered outdoor seating for their fill of coffee drinks, wine, beer, baked goods, snacks, apps, pop-up chef dinners, and intermittent oyster nights.
