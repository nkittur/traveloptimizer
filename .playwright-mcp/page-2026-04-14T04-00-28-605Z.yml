                  - paragraph [ref=e405]: Butter definitely dominates the DNA of the delightfully quirky coffee-baked goods-biscuit cafe by pastry chefs Beth Kellerhals and Dana Amromin. An irresistible siren call to the ongoing resurrection of the River Arts District, so devastated by Helene, Butter Punk offers a cheery place to perch for the faithful following Kellerhals built over nearly four years at Asheville tailgate markets. Her generously sized biscuits — golden, crisped exterior, flaky inside, substantial enough for the hearty breakfast sandwiches on the menu — are blue ribbon winners. Her signature pimento cheese scone has its own fervent fan base. The duo fills up the vintage pastry case with cookies, shortbread, cakes, and pies. They name Betsy Johnson as their design North Star — the huge, pink-framed mirror in the restroom evokes a portal into Alice’s Wonderland.
