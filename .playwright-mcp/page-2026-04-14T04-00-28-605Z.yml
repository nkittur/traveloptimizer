                  - button "Copy link" [ref=e366] [cursor=pointer]:
                    - img "Link" [ref=e367]
                - paragraph [ref=e369]: Every new restaurant arrives with expectations, but for Crusco, which opened on July 30, the weight of those was especially heavy. It took over the space that housed the popular independent restaurant Vivian, which closed after Helene. It is located in the upper section of the River Arts District, which bore the brunt of the French Broad River’s impact. Most profoundly, the owners are the core team that worked for beloved chef Brian Canipelli at Cucina 24, Asheville’s most respected and authentic Italian restaurant. Canipelli’s sudden death on February 6 permanently closed Cucina and shattered the lives of his life partner, Kat Kearney, chefs Lauren Macellaro and Alex Harris, and beverage director Allen Clark. Crusco — named for a sweet red Italian pepper Canipelli was enamored with — is how the partners began to put those broken pieces back together.
                - paragraph [ref=e370]: Though there are nods to his legacy in the completely re-done space, and a continued commitment to the local farmers he relied on, the partners say it is not an Italian restaurant. Their descriptor is New American, vegetable-forward, local, and seasonal. There are pastas — agnolotti and spaghetti on a recent menu, but also crispy beets with pork, new potatoes with cultured butter and lovage, sweetbreads with lion’s mane; a fried pork chop with greens; and quite unexpectedly, shrimp toast with togarashi and a nod to Spain via the tortilla Española wth creme fraiche and caviar.
