                - paragraph [ref=e430]: Since 2009, Posana restaurant has been a welcoming beacon for modern fine dining in downtown Asheville. All of the deliciousness — from bread service to pasta course to dessert — based on local, regional, and seasonal sourcing is cooked and baked in an entirely gluten-free kitchen. In October, Martha and Peter Pollay gifted restaurant-bereft Biltmore Town Park Square with a second location, in an equally stylish room and menu thoughtful of every diner. Expect signature OG Posana dishes like kale salad, house-made gnocchi, and cheddar biscuits, and evolving presentations of pasta, vegetables, and the highest quality proteins. Posana Biltmore Park has added lunch service Monday to Friday and weekend brunch (gluten-free bagels, French toast, biscuits, and doughnut holes).
