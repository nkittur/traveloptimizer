                - paragraph [ref=e498]: The minute guests walk into the shotgun space that opened in December, the intoxicating scent from the open kitchen set against one wall compels them to quickly claim one of the 45 seats. The decor is minimalist, the ambiance serene, the menu for now is succinct, but the local chatter around the new restaurant is at high velocity. Vietnamese-born chef Quyen Hawes is the heart and hands behind the pho, which comes with a choice of four proteins in a deeply flavored 15-hour broth. Her parents are the helping hands in the kitchen, and her husband, Jesse Hawes, can usually be found out front. House-made peanut sauce comes with fried egg rolls and fresh spring rolls. The Cơm tấm Sườn Nướng Ốp La — a grilled, marinated pork chop served with a runny-yolk fried egg, broken rice vermicelli, and house-made condiments — is getting raves. No alcoholic beverages yet, but Vietnamese coffee brings the buzz.
