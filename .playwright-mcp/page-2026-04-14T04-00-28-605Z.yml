                  - paragraph [ref=e338]: Piccolina is dedicated to Italian sandwiches, Neapolitan-style pizza, and desserts. Piccolina means little one, which reflects the small slot of space within the Aura Arts Building, but is a big dream come unexpectedly true for Elana and Nathan Pearlman. The couple met at the CIA in Hyde Park. After graduating, they moved to Austin, where they married and built their careers, then left Texas behind to explore Charleston and Asheville. In the former, they stumbled upon Welton’s Tiny Bakeshop and influential owners Hannah and Zach Welton, taking a cue from their business model. In Asheville, they stumbled upon an available space with a hood, ordered a Neapolitan pizza oven, and built out 400 of the 800-square-foot room with 20 seats.
                  - paragraph [ref=e339]: The succinct lunch menu offers a trio of starters, four sandwiches, one pizza, zeppole, cookies, and Italian ice. Dinner includes an additional starter, pasta, and a couple of proteins.
                  - paragraph [ref=e340]: The sandwiches are baked to order, starting with a ball of dough dusted with semolina, set in the 700° oven, split, and filled. The mortadella — with Parmigiano Reggiano, arugula, pistachio, and lemon vinaigrette — was an instant Instagram sensation.
