                - paragraph [ref=e555]: Prosecco and pie? Sure. And you can at Periscope, the newest tenant in the S&W Market. Take a seat in the snazzy cocktail lounge on the mezzanine level and channel your inner F. Scott Fitzgerald characters with fast craft cocktails and natural wines created and selected by Becky Bronson and Spencer Schultz, well-known names in artisan beverage circles. Among cocktails on draft are the Negroni alla contrada with London dry gin, red bitter and vermouth di torino; Mexican vesper with agave spirit blend, cardamaro and ancho chili; and raspberry Americano with raspberry apertivo, rose vermouth, black pepper and soda. The pie comes from the Queen of Pie, Schultz’s sister-in-law, Ashley Capps, creator of the famous banana pudding pie while pastry chef at Buxton Hall Barbecue and co-owner with Travis Schultz of New Stock.
