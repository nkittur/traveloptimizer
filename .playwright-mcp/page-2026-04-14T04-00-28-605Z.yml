                  - heading "Harmony Wine" [level=2] [ref=e302]
                  - button "Copy link" [ref=e304] [cursor=pointer]:
                    - img "Link" [ref=e305]
                - paragraph [ref=e307]: Since opening Neng Jr. in West Asheville in 2022, married partners Silver and Cherry Iocovozzi have double-teamed the award-winning restaurant where Silver is the chef, and Cherry is the wine director. With the opening of Harmony Wine, a natural wine bar/bottle shop/listening room/reading nook up a couple of stairs in a sexy secret space in the same building, Cherry has his own little lair. Inspired by vintage photos of Silver’s mother at work in a Japanese karaoke bar, Shnozui and Meikyoku Kissa Lion Cafe in Tokyo, Ruby in San Francisco and Pompette in Copenhagen, Harmony is outfitted with books, meaningful memorabilia, photographs, prints, posters and bottles and bottles of natural wine from France, Italy, Spain, Mexico, Chile, Austria, Germany, Japan, and the United States. All of the wine can be taken home or enjoyed at the four-stool bar or a table. While karaoke will break out from time to time, Harmony’s soundtrack comes from the couple’s CD collection, run through 1960s Fisher receivers and Bozak speakers. “Snacks” made in Neng’s kitchen have included duck rillettes with a muscadine jam and a beautiful pork pate seasoned with galangal, ginger, chile, jujubee, and pistachio.
