                  - paragraph [ref=e583]: Easy Tiger aims to be the ultimate destination for sports enthusiasts. Just in time for weekends bursting with college and pro gridiron, MLB playoffs, NBA and NHL, it’s flipping on a dozen big-screen TVs, firing up the fryers, polishing the bar, and hooking up the kegs.
                  - paragraph [ref=e584]: The team behind Easy Tiger isn’t full of rookies; brothers Kyle and Carter James, with chef Gordon Gibbs, are the proven winners behind Flour Cafe in the S&W Market, and they’ve added Ashley Williams as a partner in charge of the beverage program. She is creating a seasonal craft cocktail menu and overseeing the state-of-the-art draft system, which will feature a wide range of beverages, from Guinness to nitro cold brew, as well as Sierra Nevada’s Trail Pass NA Hazy IPA. Expect elevated bar food, including vegetarian options.
