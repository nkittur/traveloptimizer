                  - paragraph [ref=e193]: Bubbles for breakfast, wine for lunch, aperitifs in the afternoon, and coffees from open to close are all in the house at Leo’s House of Thirst since owner Drew Wallace and partner-chef Austin Inselman expanded service hours and growth spurted the menu. Leo’s made its debut from a small, renovated cinderblock building in West Asheville in 2020 with an emphasis on wine and outdoor evening dining in response to COVID. Five years in, Wallace revived his original concept of a menu that seamlessly but distinctly segues from breakfast sandwiches, toasts, short rib hash, and Belgian waffles to soup, salad, shrimp rolls, and grilled cheese, to an hour-long snacky/small plates afternoon intermezzo, then finishes strong with Leo’s greatest dinner hits of pastas and roast chicken. Don’t pass on the baked goods or seasonal desserts.
