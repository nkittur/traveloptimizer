                  - paragraph [ref=e533]: Post Helene, the Asheville hospitality industry has fortified itself with stories of silver linings; few shine as brightly as Day Trip cocktail lounge, which saw its original site on Amboy Road swept away by the French Broad River one month after opening. Not to be deterred, owners Brandon Davis and Davie Roberts picked themselves up, brushed off their leisure suits, and found a space four times bigger — and far, far away from a body of water. The married couple is all in on 70s decor, mined from thrift stores and estate sales; patrons can time travel through rooms decked out with the greatest hits of basement rec rooms, snazzy bachelor pads, Aunt Betty’s kitschy breakfast nook, and your grandma’s living room if she used her ironing board as a coffee table. It’s a fun spot for your cocktails, mocktails, wine, beer, and charcuterie boards from Asheville Charcuterie Co.
