                  - paragraph [ref=e645]: New York-style pizza can be the opening for a food fight among aficionados, particularly those from New York. Justin Balzer — who is not from NY — defines it as a ‘20-inch round, thin-crust, crispy bottom — the ultimate mobile food, but also a meal.” Christine Costa Balzer is most definitely from New York. “My grandparents came from Italy, my family is Sicilian, I was born in New York, and raised in Jersey. This is my culture. I know a good New York pizza.” After many years working on their dough — from an eight-year-old sourdough starter — and seeking a downtown location that would accommodate families dining in, around a table, or grabbing a slice to fold and go — the married chefs opened Birdie’s Pizza on July 13 on busy Biltmore Avenue. Choose from one of eight pies – round, Sicilian, or by the slice, made with hand-stretched mozzarella, organic tomatoes, and toppings like caramelized onion, roasted red pepper, spicy sausage, and crispy chicken cutlets. Wait for your pie to finish with garlic knots, arancini, meatballs, or cacio e pepe fries.
