                      - text: . But there’s eating a slaphappy roadside taco, and then there’s eating smoky asada at Tacos Los Cholos. The meat at this two-story taquería in Huntington Park is just as good (if not better than) America’s best barbecue—they just so happen to use tortillas as the transportation method. Every cut, from the lime-marinated ribeye to the crispy short rib, absorbs the mesquite charcoal’s woody flavor. The next time an out-of-towner asks you to suggest just one taco place, send them to Los Cholos. Between the clouds of smoke, the banda music blaring through the speakers, and the highest standard of asada, this is LA tacos in one fell swoop.
