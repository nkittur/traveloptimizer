                    - paragraph [ref=e3749]: "From the outside, this casual Koreatown restaurant blends in with any other spot on Olympic, but Soban’s greatness shows up in the little details. It all starts with an eye-catching grid of a dozen colorful squares of banchan, and while the spread alone could keep you busy for a while, that’s just the opening act for the best Korean feast in LA. Rally a group and order the holy trifecta of Soban’s hits: the galbijjim in a rich braising sauce, spicy braised black cod with meat that slips right off the bones, and the garlicky soy-marinated raw crab. From there, the details keep piling on, from the mother-daughter duo running the place who swing by to mix rice into saucy crab shells and refill your barley tea before you've even realized you’re running low."
