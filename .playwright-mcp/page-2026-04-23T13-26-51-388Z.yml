                        - text: (all three are on this list, not by coincidence). Here you'll find the restaurant group at its most casual, which isn't necessarily that casual. There are shawarma sandwiches, tagine platters, and life-changing hummus, all served in a bright space you’ll want to hang out in all night. Walk-ins are encouraged and servers treat you like an old friend. The simple, high-quality kebabs are the best things on the menu, and skipping them would be as wise as going to the beach without sunscreen. Come here to slide tender beef cuts off of a three-foot skewer with a handful of fluffy laffa bread while sipping a rose vesper martini and admiring the fashion-world-adjacent crowd.
