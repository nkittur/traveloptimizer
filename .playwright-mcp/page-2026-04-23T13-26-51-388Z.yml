                      - paragraph [ref=e1258]:
                        - text: If the Ghost of Christmas Present—the jolly one with a robe and a wreath in his hair—opened a restaurant, it would probably look like Dunsmoor. Meals at this refined Southern-leaning spot in Glassell Park have the warm energy of a celebratory feast, even if you’re popping in for albacore crudo and a glass of wine. Table are laid out in banquet-style rows, the wood-fire hearth in the open kitchen exudes coziness, and the menu is filled with incredible ember-cooked dishes that Bear Grylls would fantasize about while wandering the brush (grilled trout, mushroom-crusted pork chops, and the cornbread to end all cornbreads). But big rustic dinners aren’t the only area in which Dunsmoor excels. The charming, understated wine bar in the back is perfect for an intimate drink—and happens to serve one of the
                        - link "best steak frites in LA" [ref=e1259] [cursor=pointer]:
