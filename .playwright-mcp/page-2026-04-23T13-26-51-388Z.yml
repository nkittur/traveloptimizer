                      - text: and find all the things you’d expect at a local corner store—a pack of cigarettes, an air freshener, and the calming waft of AC as you open the refrigerator for a Diet Coke. But what makes Baja Subs different is the secret menu of exceptional Sri Lankan food. You’ll find dishes like biryani topped with caramelized onion relish, garlicky Sri Lankan noodles, and kottu roti, a popular Sri Lankan street food made with flaky roti sautéed with vegetables, eggs, and spices. This is primarily a to-go operation, and though you can certainly order there, we recommend calling in before you head over, as most dishes take 20 to 30 minutes to make.
