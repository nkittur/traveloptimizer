                    - generic [ref=e2916]:
                      - paragraph [ref=e2918]: Si! Mon’s beach-adjacent setting in Venice is lush and dreamy, sure, but this splashy Panamanian spot’s appeal isn’t just string lights and a fleet of potted Birds of Paradise. The cooking here is as bold, bright, and inventive as anything in the city. You’ll slurp buttery baked oysters topped with toasted coconut and neon green tigre de leche. Impossibly tender kanpachi arrives wrapped in a banana leaf smelling like coconut oil and Thai basil. That it all goes down in a tropical bungalow packed with people sipping parmesan-washed rum and dancing in their seats to house music feels like some sort of Westside cheat code. Weekend decibel levels rival most clubstaurants. Like the exclamation point in its name, Si! Mon is just the right amount of over-the-top, with wildly fun food that hangs around in your brain long after the night is over.
