                      - paragraph [ref=e3045]: There’s a good chance you’ve heard of Bestia. You might even have an opinion on it. But even with all the praise this splashy Arts District Italian spot has accumulated since opening in 2012, we’re here to say this—the hype is still warranted. The oven-blistered pizzas, indulgent pasta, and hunks of wood-grilled meat are all close to perfect, and the energy inside the industrial-chic dining room bounces off the brick walls like surround sound (yes, it gets loud). Bestia is tailored for Big Nights Out. Servers pour wine through hollowed-out beef bones directly into people’s mouths, elaborate housemade salumi boards shimmer like jewelry cases, and no one in their right mind leaves without dessert. Plan on reservations unless you’re comfortable squeezing in at the counter. Even the best parties have peaks and dips, but the one at Bestia hasn’t slowed down for over a decade.
