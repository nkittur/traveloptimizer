                        - text: of this bright, breezy all-day Taiwanese-ish spot in Alhambra from the very beginning. But after their more recent introduction of dinner service, we can now say with confidence that Yang’s is not only one of the best places to eat in the SGV, but the entire city. At night, the lights in the white-wooded dining room are dimmed, soft indie music hums on the speakers, and friends huddle around tables ordering bottles of orange wine. It feels like a cool bookstore cafe that doesn’t close when the sun goes down. And while there are zero misses on Yang’s menu, the “larger bites” section is where you’ll want your attention. That’s where you’ll find dishes like peanut-y dan dan campanelle, creamy prawns and millet, and a Hainan fish rice with chili butter that we think about every morning when we wake up.
