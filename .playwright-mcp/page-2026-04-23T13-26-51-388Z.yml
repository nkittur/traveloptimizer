                      - paragraph [ref=e921]: Some gestures send a clear message, like anniversary chocolates or keying the word “asshat” onto your ex’s Honda Civic. If someone takes you to Bistro Na’s, they clearly want to charm you with an extravagant imperial-style Chinese meal, and, yes, it works every time. This high-end SGV restaurant looks plucked from a Qing Dynasty period drama with its opulent red dining room, expert service, and ornate food that is as stunning to eat as it is to behold. We daydream about the stir-fried angus beef with green peppercorns, glistening peking duck, and braised cod smothered in chili oil as often as we do winning the lottery (which, coincidently, is what it might require to eat here daily). A multi-course dinner at Bistro Na’s delivers the flair and precision of the finest tasting menu spots in town, even if you wouldn’t expect to find it in a suburban strip mall next door to a Planet Fitness.
