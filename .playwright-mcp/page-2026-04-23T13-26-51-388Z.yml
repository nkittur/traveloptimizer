                        - text: guide forever, but one thing it’s never been is cheap. At chef-owner Morihiro Onodera's latest spot—wedged on the first floor of an Echo Park condo tower—that's changed. Sure, the omakase still costs $400, but there's an a la carte menu, too, which lets you stroll in for life-altering nigiri and the world’s plumpest shrimp tempura roll on any random night. Think of Moirhiro as what happens when a high-end chef does a neighborhood sushi bar. There's a suit-wearing maître d, Talking Heads on the speakers, and cocktails that belong at a five-star Tokyo hotel. It's still not cheap, but eating LA's finest sushi suddenly requires a lot less commitment.
