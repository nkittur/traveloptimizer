                      - paragraph [ref=e1565]: Gjelina and “LOL” have similar cultural trajectories. At first, both were trendy and irresistible. Then they became too obvious, a touch on the nose. But at some point over the years, they earned their staying power. Gjelina in Venice is the house that kale salad built. Even if kale is rarely on the menu now, there are always gorgeous vegetables dolled up with acid, some cheese, and something crispy-crunchy to give it an edge. Whether you build an order around green stuff, or toss in a pizza and duck confit, a meal here is sure to feel “very LA,” complete with table neighbors who wear large-brimmed hats after dark and say things like "you should visit my aura reader" unironically. Love to hate or hate to love Gjelina, it’s one of the city's all-time greats.
