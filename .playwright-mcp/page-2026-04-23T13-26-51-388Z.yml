                    - paragraph [ref=e4038]: People say that LA isn’t a bagel town, but Courage Bagels proves them wrong. This walk-up window in Virgil Village serves crackly Montreal-style bagels that will make any NYC-bagel truther question their reality. The line will be long, but you’ll forget about the 45 minutes you spent sweating on the sidewalk the second you sink your teeth into a sesame half topped with smoked salmon slices so thin they’re almost translucent, a nest of dill, and glistening tomatoes. Nothing about Courage is trying to mimic a New York-style deli—it’s doing its own thing, piling farmers market produce onto bagels. These are the best bagels in LA. And maybe even beyond.
