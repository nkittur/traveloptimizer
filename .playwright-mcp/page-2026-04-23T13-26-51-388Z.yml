                      - text: after going to the Target on La Brea, or the post office, or the dry cleaner, or the doctor. In other words, we’re lured in whenever we need some peace and jade noodle soup. Everything about Luv2Eat looks and feels like any other LA strip mall restaurant, but the ultra-spicy regional specialties and the warm service make it an extreme challenge to drive by without popping in. You’ll find many of the highlights in the Chef’s Special section of the menu, a mixed bag of dishes that showcases the two chefs’ family recipes from Southern Thailand. The Phuket-style crab curry, for instance, when combined with the fatty crab meat bathing at the bottom, takes sweet, salty, and sour to euphoric levels. Even the moo-ping, a simple grilled pork skewer appetizer, is marinated and charred so perfectly that it should be rebranded as candy on a stick. If you've ever wondered where we eat on a “night off,” Luv2Eat is where to find us.
