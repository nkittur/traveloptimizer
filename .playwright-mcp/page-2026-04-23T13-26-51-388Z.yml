                        - text: tradition along the Central Coast, but selling the idea of great barbecue in LA to anyone outside of LA has always been met with some degree of eye rolls. The arrival of Moo’s in Lincoln Heights, however, changed everything. And that’s because this former pop-up isn’t just home to the best barbecue in LA, it’s home to some of the best we’ve eaten anywhere. This is Texas-style barbecue—meaning brisket is king—but what makes Moo’s even more special is how intricately owners Michelle and Andrew Muñoz have incorporated their East LA roots into things beyond smoked meat. Think side dishes like creamy, smoky esquites, dill-heavy red potato salad, and a stellar tres leches bread pudding.
