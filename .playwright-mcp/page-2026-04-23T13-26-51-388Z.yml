                      - paragraph [ref=e1430]: Anyone who likes meaty prawns and plump oysters, and eating those meaty prawns and plump oysters under a disco ball will care for Found Oyster like a family member. That is to say, after one visit, you’ll continue to check in on this undeniably sexy East Hollywood seafood spot with the devotion of a lioness to her cub. The walls are lined with natural wine, the dining room only fits 30-ish people, and there's a handwritten menu of seafood specials that changes every day. We like coming to this walk-in-only spot with a group for an impromptu shellfish tower or scallop tostada with yuzu kosho, but it's also ideal for a glass of gamay and a wedge salad at the bar.
