                    - text: ; and
                    - link "BeLoved Asheville" [ref=e315] [cursor=pointer]:
                      - /url: https://www.belovedasheville.com/
                    - text: is focusing on helping BIPOC (Black, Indigenous, and People of Color) individuals and communities of low wealth to rebuild. In the wake of Hurricane Helene, Explore Asheville created a digital platform,
                    - link "Love Asheville From Afar" [ref=e316] [cursor=pointer]:
                      - /url: https://always.exploreasheville.com/love-asheville#support
