                  - paragraph [ref=e274]:
                    - text: Despite the losses, the Asheville Regional Airport has been open since the week of the storm, and tourism reopenings have been slowly occurring since then. The iconic
                    - link "Biltmore Estate" [ref=e275] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/activities/biltmore-estate
                    - text: —George Vanderbilt's historic 250-room chateau
                    - link "that can host overnight guests" [ref=e276] [cursor=pointer]:
                      - /url: https://www.biltmore.com/
                    - text: —reopened its doors to guests this month, just in time for the landmark’s annual
                    - link "Christmas at Biltmore" [ref=e277] [cursor=pointer]:
                      - /url: https://www.exploreasheville.com/asheville/events/christmas-biltmore
                    - text: celebrations.
                  - paragraph [ref=e278]:
                    - text: “The Asheville area welcomes visitors who come with patience and heart as they support us and return to this special place,” says Vic Isley, president of
                    - link "Explore Asheville" [ref=e279] [cursor=pointer]:
                      - /url: https://www.exploreasheville.com/
                    - text: . “The heart of our local hospitality community has never been more alive than the days and weeks following Hurricane Helene—from beds and meals for first responders to care and clean-up in the community. Your plans to return give us hope and heart.”
                  - complementary [ref=e280]:
                    - paragraph [ref=e283]: “Visitors to Asheville and Western North Carolina are vital to helping us stand our mountain town back up after Helene.”
                    - generic [ref=e284]: —Shelton Steele, co-owner of Wrong Way River Lodge & Cabins
