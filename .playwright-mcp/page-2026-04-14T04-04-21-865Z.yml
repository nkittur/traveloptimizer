                  - paragraph [ref=e292]: The city and surrounding areas are still working through Hurricane Helene’s damage, with some areas still seeing continued water issues, road repairs, and power outages—yet, “many local businesses, restaurants, and hotels across the Asheville area are open and safely welcoming guests,” says Isley. While planning is essential, travelers can support Asheville by planning a trip there this winter or for 2025. Here’s how to do it, the businesses that are now welcoming tourists, and those that are still on their way to recovery—but may be open to other ways you can support them.
