              - generic [ref=e905]:
                - heading "Where to stay in Asheville post-Helene" [level=2] [ref=e906]
                - paragraph [ref=e907]:
                  - text: Many hotels have opened since, including most recently the iconic
                  - link "Asheville Flatiron building" [ref=e908] [cursor=pointer]:
                    - /url: https://www.exploreasheville.com/things-to-do/attractions/tours/walking/architecture-trail/flatiron-building
                  - text: ’s namesake
                  - link "Flat Iron Hotel" [ref=e909] [cursor=pointer]:
                    - /url: https://cna.st/affiliate-?xid=fr1776139461217hda
                  - text: . Once a signal of the city’s roaring 1920s, the property pays homage to the Gilded Age with Art Deco elements—and chef Graham House helms the kitchen at Italian farm-to-table restaurant
                  - link "Luminosa" [ref=e910] [cursor=pointer]:
                    - /url: https://www.luminosaavl.com/
                  - text: (don’t miss his fat-rendered tater tots).
                - paragraph [ref=e911]:
                  - text: In the River Arts District,
                  - link "The Radical" [ref=e912] [cursor=pointer]:
                    - /url: https://cna.st/affiliate-?xid=fr1776139461217ada
                  - text: is a whimsical hotel with murals by local muralist Ian Wilkinson decorating the common areas and guestrooms. While it was closed for a period post-Helene, the hotel is now back in action for travelers.
                - paragraph [ref=e913]:
                  - text: "\"Here in Asheville, the River Arts District is an important and vibrant part of our small city, and unfortunately, we’ve seen a lot of losses,” says Jacob Sessoms, chef behind the food and beverage concepts at the hotel including"
                  - link "Golden Hour" [ref=e914] [cursor=pointer]:
                    - /url: https://www.goldenhouravl.com/
                  - text: restaurant, Afterglow cafe, and the property’s Rooftop Bar. “We know Asheville and the River Arts District are coming back even better than before, because that’s the spirit of our community,” says Sessoms.
                - paragraph [ref=e915]:
                  - text: Tucked away in downtown’s South Slope on Biltmore Avenue,
                  - link "Zelda Dearest" [ref=e916] [cursor=pointer]:
                    - /url: https://cna.st/affiliate-?xid=fr1776139461217ega
                  - text: is a 20-room boutique hotel converted from three restored turn-of-the-century mansions—each named after the sisters of Zelda Fitzgerald, who spent her last days in Asheville. Downtown’s
                  - link "Kimpton Hotel Arras," [ref=e917] [cursor=pointer]:
                    - /url: https://cna.st/affiliate-?xid=fr1776139461217fcc
                  - text: a former bank from the 1960s, remains the tallest building in Asheville, offering the most iconic panoramic views of the Blue Ridge Mountains from its stylish rooms.
                  - link "Blind Tiger Asheville" [ref=e918] [cursor=pointer]:
                    - /url: https://www.larkhotels.com/hotels/blind-tiger-asheville
                  - text: ", a boutique hotel, reopened on November 14 to bookings taking place within Wednesday through Sunday nights, for now, while the business is operating with limited team members."
                - paragraph [ref=e919]: Others lodging options, like the historic Chestnut Street Inn bed and breakfast, remain closed for now. Owner Emilie Kapp has processed over $30,000 in refunds, and “as a B&B, we run the business on deposits,” Kapp says. “The occasional cancellation doesn’t hurt, but the month of October and November keep us afloat from January through April.” There’s a long road to recovery ahead for small businesses in 2025—but Kapp is optimistic about welcoming guests in a new way in early 2025.
                - paragraph [ref=e920]:
                  - text: “Visitors to Asheville and Western North Carolina are vital to helping us stand our mountain town back up after Helene,” says Shelton Steele, co-owner of reopened
                  - link "Wrong Way River Lodge & Cabins" [ref=e921] [cursor=pointer]:
                    - /url: https://www.wrongwaycampground.com/
                  - text: ", whose A-frame cabins along the French Broad River are equipped with comfy beds, sound machines, record players, and portable hammocks. “We’re a basecamp for people to explore the urban outdoors. Our communal spaces offer guests a space for reflection and gratitude,” Steele says. “We’re more sure of our mission than ever.”"
