                        - paragraph [ref=e560]: The Market Place was nominated for a James Beard award for Outstanding Restaurant this year, its 45th year in business
                        - text: Johnny Autry/The Market Place
                    - figure [ref=e561]:
                      - generic [ref=e564]:
                        - img "Image may contain Architecture Building Dining Room Dining Table Furniture Indoors Room Table Restaurant and Blade"
                      - generic [ref=e565]:
                        - paragraph [ref=e567]: When The Market Place opened in 1979, it became a trailblazer in Asheville’s farm-to-table movement.
                        - text: Johnny Autry/The Market Place
                  - heading "Where to eat in Asheville" [level=2] [ref=e568]
                  - paragraph [ref=e569]:
                    - text: Chefs like Katie Button of
                    - link "Cúrate" [ref=e570] [cursor=pointer]:
                      - /url: https://curatetapasbar.com/
                    - text: ", Meherwan Irani of"
                    - link "Chai Pani" [ref=e571] [cursor=pointer]:
                      - /url: https://chaipani.com/
                    - text: ", and William Dissen of"
                    - link "The Market Place" [ref=e572] [cursor=pointer]:
                      - /url: https://marketplace-restaurant.com/
                    - text: have established Asheville as a culinary destination, blending regional traditions with inventive flavors. Asheville’s farm-to-table movement began long before the concept was trendy, with Mark Rosenstein opening
                    - link "The Market Place" [ref=e573] [cursor=pointer]:
                      - /url: https://marketplace-restaurant.com/
                    - text: in 1979 as one of the pioneers. In 2009, chef William Dissen took over the restaurant, maintaining the ethos of working with local purveyors—and the restaurant was nominated for a James Beard award for Outstanding Restaurant this year, its 45th year in business. In the aftermath of Helene, restaurants Cúrate, Bears BBQ, and Chai Pani opened up their kitchens for
                    - link "World Central Kitchen" [ref=e574] [cursor=pointer]:
                      - /url: https://wck.org/en-us/news/chef-corps-asheville-helene
                    - text: to help feed those in most need.
                  - paragraph [ref=e575]:
                    - text: While Cúrate remains a prized reservation for visitors, Button and Félix Meana’s
                    - link "La Bodega" [ref=e576] [cursor=pointer]:
                      - /url: https://curatetapasbar.com/la-bodega-by-curate/
                    - text: ", where Spanish aperitivo culture shines with tapas and pintxos, is a more relaxed option. If wine director, Jessica Salyer is behind the bar, prepare for a fun intro to Spanish wines and vermut."
                  - paragraph [ref=e577]:
                    - link "Chai Pani" [ref=e578] [cursor=pointer]:
                      - /url: https://chaipani.com/
                    - text: is serving Indian street food in an expanded space with exciting new dishes—but don’t worry, their beloved matchstick okra fries are here to stay—and chef Meherwan Irani is gradually reopening the full restaurant, with a Hurricane Hot Bar through December offering classics like spicy lamb kheema, crispy masala fish fry, butter chicken, kale pakoras, and more. We can only hope the vibrant, Bollywood-inspired upstairs bar—with its pani puri and inventive cocktails—makes a triumphant return soon. Don’t forget to check out Irani’s newest outpost, Botiwalla, a spot that pays homage to the lively cafes of India.
