                  - paragraph [ref=e674]:
                    - link "All Souls Pizza" [ref=e675] [cursor=pointer]:
                      - /url: https://www.allsoulspizza.com/
                    - text: is a local favorite for its farm-driven pizzas, extensive wine list, and ample outdoor space perfect for families; meals end with nightcaps of soft serve for the table. Hit
                    - link "Terra Nova Beer Co." [ref=e676] [cursor=pointer]:
                      - /url: https://terranovabeer.co/
                    - text: for the beer, but stay for pizza from
                    - link "Mission Pizza Asheville" [ref=e677] [cursor=pointer]:
                      - /url: https://www.missionpizzaavl.com/
                    - text: ", a sister concept to its original Neapolitan location in Winston-Salem, a"
                    - link "top-25-ranked pizza slice" [ref=e678] [cursor=pointer]:
                      - /url: https://robbreport.com/food-drink/dining/2023-50-best-pizzerias-us-1234861822/
                    - text: "in the United States. Post-Helene, the spot pivoted into Mission Pizza Romana, serving up Roman-style squares, which Geoff Smith, co-owner, says are a more efficient solution in a time when labor shortages and high demand pose significant challenges: “We love them so it was a natural pivot without compromising who we are or our commitment to making the best product out there.”"
                  - paragraph [ref=e679]:
                    - text: If you’re craving Southern nostalgia in the form of a fish fry,
                    - link "Good Hot Fish" [ref=e680] [cursor=pointer]:
                      - /url: https://www.goodhotfish.com/
                    - text: is a must that pays homage to Carolina fish camps. During Helene, chef and owner Ashleigh Shanti teamed up with Silver Iocovozzi and the
                    - link "Neng Jr’s" [ref=e681] [cursor=pointer]:
                      - /url: https://www.nengjrs.com/
                    - text: team (who are not yet re-opened, but currently doing pop-ups) to prepare free meals for those in need. “For now, it’s incredibly important as a small restaurant to have the ability to gauge the amount of ice and water we need on a daily basis,” says Shanti. “Our seafood restaurant requires a lot of ice, and these things come at a pretty big cost for us now.”
                  - paragraph [ref=e682]:
                    - text: Steven Goff is back in action at
                    - link "Tastee Diner" [ref=e683] [cursor=pointer]:
                      - /url: https://www.tasteedineravl.com/
                    - text: ", a 1940s-style diner where the local chopped beef is a staple. For Oaxacan-inspired fare, chef Luis Martinez of"
                    - link "Taqueria Rosita" [ref=e684] [cursor=pointer]:
                      - /url: https://www.instagram.com/taqueriarositaavl/
                    - text: (located inside
                    - link "The Odd" [ref=e685] [cursor=pointer]:
                      - /url: https://linktr.ee/theoddavl
                    - text: bar) serves tlayudas (crispy tortillas topped with refried beans, meats, cheeses, and crunchy veggies) traditionally eaten to sop up Mezcal-filled nights in Oaxaca, plus heirloom corn-based tacos.
                    - link "The Odd" [ref=e686] [cursor=pointer]:
                      - /url: https://theoddasheville.com/
                    - text: is an iconic institution with memorabilia all over the walls and a Zoltar Machine, and on any given night you could find a drag show, magician, or just lively locals enjoying a night out.
