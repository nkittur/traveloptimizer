                  - heading "How to help Asheville from afar" [level=2] [ref=e309]
                  - paragraph [ref=e310]:
                    - text: "Even if you don’t plan to visit right now, there are many ways to help the region recover, including buying gift cards from any of the businesses mentioned in this guide, or shopping their online storefronts: At"
                    - link "East Fork Pottery" [ref=e311] [cursor=pointer]:
                      - /url: https://www.eastfork.com/
                    - text: (founded by Alex Matisse, the grandson of renowned
                    - link "French" [ref=e312] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/destinations/france
                    - text: artist Henri Matisse) 5% of sales, both in-store and online, are going to disaster organizations in the community. Wrong Way Campground’s
                    - link "Oxford Pennant ‘Asheville Forever’ flag" [ref=e313] [cursor=pointer]:
                      - /url: https://oxfordpennant.com/products/asheville-forever-outdoor-flag
                    - text: is sending all profits to the
                    - link "Equal Plates Project" [ref=e314] [cursor=pointer]:
