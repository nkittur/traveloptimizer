          - generic [ref=e232]:
            - paragraph [ref=e236]: All products and listings featured on Condé Nast Traveler are independently selected by our editors. However, we may receive compensation from retailers and/or from purchases of products through these links.
            - generic [ref=e237]:
              - generic [ref=e238]:
                - generic [ref=e241]:
                  - paragraph [ref=e242]:
                    - text: The damage that Hurricane Helene wrought on Western
                    - link "North Carolina’s mountain towns" [ref=e243] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/story/a-guide-to-the-gateway-towns-of-great-smoky-mountains-national-park
                    - text: this fall has been hard to comprehend. In late
                    - link "September" [ref=e244] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/gallery/best-places-to-travel-september
                    - text: ", Asheville recorded over nine inches of rain in just two days, causing severe flooding in areas like Biltmore Village and the city’s burgeoning River Arts District. Landslides forced closures on key highways I-26 and I-40, cutting off major access routes; power outages and disruptions to cellular service left residents isolated for days, making the aftermath feel “post-apocalyptic” to many residents and visitors. Utilities, including water and power, were restored in stages, with certain areas still in recovery mode today: On November 18, after a 53-day water crisis, the City of Asheville City finally lifted its boil-water notice, restoring clean and potable water throughout Asheville’s taps."
                  - link "Opens in a new window" [ref=e247] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/v2/offers/cnta01027?source=Site_0_JNY_CNT_DESKTOP_IN_CONTENT_0_US_QUICKPAY_TEST_2026_ZZ_PANELA
                    - 'img "IT''S TIME TO VOTE! <br> The 2026 Readers'' Choice Awards Survey is here <br> Go even further for your travels. Just <del>$2.50</del> <strong>$1 per month</strong> for one year. <br> CTA: SUBSCRIBE NOW" [ref=e248]'
                  - paragraph [ref=e249]:
                    - text: "Restored clean water is huge step for restaurants and hotels to safely reopen—but it may be too little, too late for some businesses. This year, the city completely missed out on its most crucial season for visitors: fall. Asheville-area businesses heavily rely on the high-season dollars of leaf peepers as the bulk of their revenue for the entire year. To put this in perspective: on average, Buncombe County hotels sold over $50 million in bookings during"
                    - link "October" [ref=e250] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/gallery/the-best-places-to-travel-in-october
                    - text: 2023—the next closest month of revenue,
                    - link "December" [ref=e251] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/gallery/best-places-to-travel-december
                    - text: ", trailed that number by $11 million. September ($38.8 million) and"
                    - link "July" [ref=e252] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/gallery/best-places-to-travel-july
                    - text: ($38.7 million) followed. This means that Asheville’s tourism numbers may not bounce back until the summer, and 2025 is going to represent a prolonged comeback.
