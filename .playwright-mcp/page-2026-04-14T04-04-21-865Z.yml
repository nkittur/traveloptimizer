                  - paragraph [ref=e423]:
                    - text: Whether
                    - link "hiking scenic trails" [ref=e424] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/gallery/the-best-hikes-in-the-us
                    - text: or embarking on a whitewater rafting trip, adventure seekers will find a perfect playground. The French Broad River, one of the world’s oldest rivers, winds through the heart of Asheville and remains central to the city's outdoor culture today. Hiking along the
                    - link "Blue Ridge Parkway" [ref=e425] [cursor=pointer]:
                      - /url: https://www.nps.gov/blri/index.htm
                    - text: is on everyone’s must-do list, but after Hurricane Helene, access is limited. The Blue Ridge Parkway Visitor Center, as well as adjacent trails like Graveyard Fields and Black Balsam, are now open and you can check the updated
                    - link "hike reopenings" [ref=e426] [cursor=pointer]:
                      - /url: https://www.exploreasheville.com/article/these-hikes-have-reopened-near-asheville-post-hurricane-helene
                    - text: list before heading out. For in the city limits nature, the
                    - link "North Carolina Arboretum" [ref=e427] [cursor=pointer]:
                      - /url: https://www.ncarboretum.org/
                    - text: ", a 434-acre public garden within the Bent Creek Experimental Forest, is a must."
                  - paragraph [ref=e428]:
                    - text: If relaxation is more your speed, unwind at
                    - link "Shoji Spa & Retreat," [ref=e429] [cursor=pointer]:
                      - /url: https://shojispa.com/
                    - text: a mountainside escape minutes from downtow, soaking in private outdoor hot tubs. Or downtown,
                    - link "Sauna House" [ref=e430] [cursor=pointer]:
                      - /url: https://www.saunahouse.com/?srsltid=AfmBOopV1s_VGmXAkjFDO8T88Y0U09KW_wYwIIlkg3JbZ9xZYqrd7ts0
                    - text: provides Scandinavian-style saunas and cold plunges. Check out the
                    - link "North Asheville Tailgate Market" [ref=e431] [cursor=pointer]:
                      - /url: https://northashevilletailgatemarket.com/
                    - text: on Saturdays, where you can score local products like
                    - link "Hominy Farm’s" [ref=e432] [cursor=pointer]:
                      - /url: https://www.hominyfarm.com/
                    - text: bread,
                    - link "Bridge & Tunnel Coffee Company," [ref=e433] [cursor=pointer]:
                      - /url: https://www.facebook.com/bridgetunnelcoffee/
                    - link "Sleight Family Farm" [ref=e434] [cursor=pointer]:
                      - /url: https://www.sleightfamilyfarm.com/
                    - text: ’s produce, and
                    - link "Ali Rae’s Pimento Cheese" [ref=e435] [cursor=pointer]:
                      - /url: https://www.aliraefoods.com/
                    - text: . It’s a great way as a tourist to help support small local businesses.
                  - paragraph [ref=e436]:
                    - text: The quirky
                    - link "River Arts District" [ref=e437] [cursor=pointer]:
                      - /url: https://www.riverartsdistrict.com/
                    - text: (RAD) was unfortunately one of the most hurricane-impacted places—but many studios, eateries, and galleries in the upper part of the district are open and welcoming customers. Step into
                    - link "NorthLight Studios" [ref=e438] [cursor=pointer]:
                      - /url: http://www.northlightstudiosasheville.com/
                    - text: for a pet portrait by artist Angela Alexander, or to
                    - link "Jeffrey" [ref=e439] [cursor=pointer]:
                      - /url: https://jeffreyburroughs.com/
                    - text: for ancient-inspired jewelry by the so-called “Mayor of the River Arts District,” Jeffrey Burroughs. Shop at
                    - link "There There" [ref=e440] [cursor=pointer]:
                      - /url: https://therethereshop.co/
                    - text: for a curated collection of consciously made clothing and home goods, and hit
                    - link "Curve Studios & Garden" [ref=e441] [cursor=pointer]:
                      - /url: https://www.curvestudios.org/
                    - text: for ceramics; the area is full of striking ceramics studios.
                  - paragraph [ref=e442]:
                    - text: In West Asheville, shop
                    - link "Provisions Mercantile" [ref=e443] [cursor=pointer]:
                      - /url: https://www.provisionsmercantile.com/
                    - text: for curated home goods;
                    - link "Flora" [ref=e444] [cursor=pointer]:
                      - /url: https://florabotanicalliving.com/
                    - text: (operating at limited hours for now) is a must for plant lovers. Stop by
                    - link "Fleetwood’s" [ref=e445] [cursor=pointer]:
                      - /url: https://fleetwoodschapel.com/
                    - text: ", where a rock-and-roll-themed"
                    - link "wedding chapel" [ref=e446] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/story/las-vegas-wedding-chapels
                    - text: ", vintage clothing shop, and cocktail bar coexist under one roof. In West Asheville, co-Founders Tarleton Walmsley and Seth Connelly reopened"
                    - link "Garden Party" [ref=e447] [cursor=pointer]:
                      - /url: https://www.shopgardenparty.com/
                    - text: in a new space last week; the cannabis-adjacent space sells cool sundries, with a focus on social justice.
                  - paragraph [ref=e448]:
                    - text: Downtown’s hilly streets are filled with many things to see. If contemporary art is your thing, don’t miss
                    - link "Blue Spiral 1" [ref=e449] [cursor=pointer]:
                      - /url: https://bluespiral1.com/
                    - text: for local art like
                    - link "Reuben Negrón’s" [ref=e450] [cursor=pointer]:
                      - /url: https://www.reubennegron.com/
                    - text: realist drawings and narrative watercolors. Stop by
                    - link "East Fork Pottery" [ref=e451] [cursor=pointer]:
                      - /url: https://www.eastfork.com/
                    - text: to stock up on the latest colors of their fashionable ceramics line and fund post-Helene efforts in the area (the aforementioned 5% of proceeds are currently going to Nanostead, Be Well AVL, and Umoja). Book nerds should head to
                    - link "Malaprop's Bookstore" [ref=e452] [cursor=pointer]:
                      - /url: https://www.malaprops.com/
                    - text: ", a beloved independent shop that has been a literary hub for decades; browse the carefully curated shelves or attend one of the many events that keep the place buzzing with life."
