                  - heading "The best things to do in Asheville" [level=2] [ref=e324]
                  - paragraph [ref=e325]:
                    - text: Asheville is a place where locals and tourists collide in a funky mountain town—where Victorian homes and historic buildings rub shoulders with edgy art galleries, indie boutiques, and street performers who’ll make you stop in your tracks. Its rise as a popular destination can be traced back to the late 19th century when George Washington Vanderbilt II built the Biltmore Estate, the largest privately owned home in America, which showcased the region’s natural beauty. Asheville grew with the expansion of railroads, at which time the city cemented its reputation as a resort town for the elite. In more recent years, it’s become a four-time winner of the
                    - link "Beer City USA" [ref=e326] [cursor=pointer]:
                      - /url: https://www.craftbeer.com/attachments/0003/8572/What_seems_like_the_most_talked_about_craft_beer_city.pdf
                    - text: title, attracting major players like Sierra Nevada and New Belgium Brewing to establish East Coast locations nearby. Asheville is proud in its quest to remain “weird,” with unique art and outdoor offerings—but it’s also undeniably cool, thanks to the James Beard-worthy chefs and a breezy vibe, all tucked into the
                    - link "striking Blue Ridge Mountains" [ref=e327] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/story/best-mountain-hikes-in-the-us
                    - text: ", which appear like something out of a Bob Ross painting."
