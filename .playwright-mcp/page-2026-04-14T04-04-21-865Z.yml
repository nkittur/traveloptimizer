                  - paragraph [ref=e782]:
                    - text: At
                    - link "Anoche" [ref=e783] [cursor=pointer]:
                      - /url: https://www.instagram.com/anocheasheville/?hl=en
                    - text: ", small-producer agave spirits and espresso collide in a tiny, ultra-cool space. Try the Verde V with sotol, or dive into a mezcal flight for something adventurous. At"
                    - link "Botanist and Barrel Tasting Bar + Bottle Shop," [ref=e784] [cursor=pointer]:
                      - /url: https://www.botanistandbarrelasheville.com/
                    - text: "pair a glass with tinned seafood from the impressive collection—the largest in the Southeast. Taste the brand’s cider and natural DeFi Wines made with local, sustainable grapes and Southern heirloom apples. Hurricane Helene unraveled local farms’ crops and business overnight, but business owners remain hopeful for next season despite setbacks: “We had orchards just coming into their best season yet—finally seeing the results after years of nurturing these forgotten trees back to life. [With] the storm, that momentum was ripped away,” co-owner Amie Fields says. “We’re determined to rebuild—not just for us, but for everyone around here who makes up this crazy, resilient patchwork of small farms and local producers.”"
                  - paragraph [ref=e785]:
                    - text: At
                    - link "Eda Rhyne Distilling Company" [ref=e786] [cursor=pointer]:
                      - /url: https://edarhyne.com/
                    - text: ", which crafts regional spirits like Appalachian Fernet and Rustic Nocino, the bar and tasting room are still closed—but travelers can get a taste of the brand’s The Bitter End cider, a collaboration that marries fernet and cider, at Botanist and Barrel, with proceeds helping the distillery to reopen."
                  - paragraph [ref=e787]:
                    - text: For stellar wine don’t miss
                    - link "Leo’s House of Thirst," [ref=e788] [cursor=pointer]:
                      - /url: https://www.leosavl.com/
                    - text: where natural wines complement dishes like tartare, chicken liver mousse, and deviled eggs. The outdoor patio, complete with fire pits, makes it a perfect spot to relax with friends. Whiskey enthusiasts should head to
                    - link "Wildwood Still" [ref=e789] [cursor=pointer]:
                      - /url: https://www.wildwoodstill.com/
                    - text: ", the rooftop bar atop the"
                    - link "Moxy Asheville" [ref=e790] [cursor=pointer]:
                      - /url: https://www.marriott.com/en-us/hotels/avlox-moxy-asheville/overview/?scid=f2ae0541-1279-4f24-b197-a979c79310b0
                    - text: featuring 360-degree views and a collection of over 150 whiskeys. Or cozy up at
                    - link "Contrada" [ref=e791] [cursor=pointer]:
                      - /url: https://www.contrada-avl.com/
                    - text: ", Brian Canipelli’s laid-back neighborhood bar with a small, curated list of pizzas, snacks, draft cocktails, and an excellent Italian wine list. As for beer, there’s still no shortage of cool breweries in town;"
                    - link "Burial Beer" [ref=e792] [cursor=pointer]:
                      - /url: https://burialbeer.com/
                    - text: ","
                    - link "Wicked Weed" [ref=e793] [cursor=pointer]:
                      - /url: https://www.google.com/search?q=wickerd+weed&rlz=1C5CHFA_enUS903US907&oq=wickerd+weed+&gs_lcrp=EgZjaHJvbWUyBggAEEUYOTIPCAEQLhgNGK8BGMcBGIAEMgkIAhAAGA0YgAQyCQgDEAAYDRiABDIJCAQQABgNGIAEMg8IBRAuGA0YrwEYxwEYgAQyCQgGEAAYDRiABDIJCAcQABgNGIAEMgkICBAAGA0YgATSAQgyNTMyajBqNKgCALACAA&sourceid=chrome&ie=UTF-8
                    - text: ","
                    - link "Green Man Brewery" [ref=e794] [cursor=pointer]:
                      - /url: https://www.greenmanbrewery.com/
                    - text: ", and"
                    - link "Highland Brewing Company" [ref=e795] [cursor=pointer]:
                      - /url: https://highlandbrewing.com/
                    - text: ", to name a few."
                  - paragraph [ref=e796]:
                    - text: There’s also bakeries, bread, and treats abound in Asheville.
                    - link "Owl Bakery" [ref=e797] [cursor=pointer]:
                      - /url: https://owlbakery.com/
                    - text: serves artisanal croissants flavored with rum and orange blossom;
                    - link "Flour" [ref=e798] [cursor=pointer]:
                      - /url: https://swmarketavl.com/flour-coffee-breakfast-downtown-asheville/
                    - text: is your go-to for mouthwatering breakfast biscuits (and the breakfast salad is a delight, too). Over in the River Arts District,
                    - link "Mother AVL" [ref=e799] [cursor=pointer]:
                      - /url: https://www.motheravl.com/
                    - text: is like a bread gallery with wine retail, while their new South Slope spot offers Euro-style café vibes with incredible bread-driven dishes like the croque madame with carbonara béchamel. For a sweet treat, grab a hot chocolate at
                    - link "French Broad Chocolate Lounge" [ref=e800] [cursor=pointer]:
                      - /url: https://www.frenchbroadchocolates.com/?srsltid=AfmBOoqktjP2F11nJjbU4F8sNyNjdrlln8BumYNiHxl2ZHBQn8grmjQP
                    - text: on Pack Square. And while
                    - link "Newstock Pantry" [ref=e801] [cursor=pointer]:
                      - /url: https://new-stock.square.site/
                    - text: ’s River Arts District was severely flooded and is closed indefinitely, you can find their divine cinnamon rolls at
                    - link "several places around town" [ref=e802] [cursor=pointer]:
                      - /url: https://new-stock.square.site/
                    - text: ", including on Tuesdays at the"
                    - link "West Asheville Tailgate Market" [ref=e803] [cursor=pointer]:
                      - /url: https://www.westashevilletailgatemarket.com/
