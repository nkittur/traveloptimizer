                  - paragraph [ref=e548]:
                    - text: Asheville is also known for its diverse LGBTQ+ community, with vibrant events like
                    - link "Served by Sev Drag Brunch" [ref=e549] [cursor=pointer]:
                      - /url: https://www.instagram.com/servedbysev/
                    - text: at
                    - link "The Mule at Devil's Foot Beverage" [ref=e550] [cursor=pointer]:
                      - /url: https://devilsfootbrew.com/location/the-mule/
                    - text: —a lively drag brunch. There’s also
                    - link "O. Henry's," [ref=e551] [cursor=pointer]:
                      - /url: https://www.ohenrysofasheville.com/
                    - text: the oldest gay bar in which opened in 1976 and is still home to ongoing drag shows, dance parties, trivia nights, and more. If you’re considering a September visit,
                    - link "Blue Ridge Pride Festival" [ref=e552] [cursor=pointer]:
                      - /url: https://www.blueridgepride.org/
                    - text: takes place in Pack Square and is known nationwide as one of the best pride festivals in the South.
