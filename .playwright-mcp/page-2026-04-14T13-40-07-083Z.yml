              - text: is the adult Disney World of the NC mountains. While you can stay overnight at this luxury resort with a world-class spa and golf course, we recommend stopping by for a sunset dinner at Edison or Sunset Terrace. Or, grab drinks at The Great Hall Bar.
            - paragraph [ref=e478]:
              - text: Those vibrant pink, orange, and purple sunsets will rival Santorini (we honeymooned in Greece). This is the perfect way to end your last night in Asheville. And if you happen to land in
