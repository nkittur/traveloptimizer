            - paragraph [ref=e206]:
              - text: With 36 hours in Asheville – a city nicknamed “Foodtopia”
              - link "filled with absolutely unforgettable restaurants" [ref=e207] [cursor=pointer]:
                - /url: https://www.uncorkedasheville.com/asheville-restaurants/
              - text: – you are going to have to make some hard restaurant decisions. Tom and I are both avid foodies and have eaten at hundreds of restaurants across the city.
            - paragraph [ref=e209]: "For fine dining, romantic, and award-winning restaurants, head to:"
