                    - time [ref=e642]: December 13, 2019 at 7:49 pm
                - generic [ref=e643]:
                  - paragraph [ref=e644]: Um, wow, I feel like I’m all mentally boozed up and full after reading this post. I want to eat at EVERY SINGLE PLACE you mentioned. I think I need more than 36 hours though. The Biltmore is on the very top of my list! If I visit, that may be the first thing on the agenda and since you have annual passes, you’ll have to come with.
                  - paragraph [ref=e645]: I love the sound of Chestnut or perhaps it’s the image you painted. Our favorite thing to do (at the right place) is to sit at a bar and share a charcuterie plate. Hubby will have sparkling water with lime while I enjoy the glass of wine I get to have every now and then. Seriously such a perfect setting.
                  - paragraph [ref=e646]: I want to visit for 2020. Let’s see! I’ll need to do my own foodie review after I stuff my face.
                  - paragraph [ref=e647]: Wonderful post! There is so much to do there and I don’t think people even realize it.
