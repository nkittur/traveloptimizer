            - paragraph [ref=e277]:
              - text: End your first day in Asheville celebrating with a drink – OK, and clearly, we cannot resist charcuterie. While
              - link "Asheville has loads of great bars to choose from" [ref=e278] [cursor=pointer]:
                - /url: https://www.uncorkedasheville.com/bars-in-asheville-nc/
              - text: (we’ll get to breweries later), for the most unique experience, head to the
              - link "Battery Park Book Exchange" [ref=e279] [cursor=pointer]:
                - /url: https://batteryparkbookexchange.com/
              - text: located inside the historic Grove Arcade. This is one of the
              - link "city’s best used bookstores" [ref=e280] [cursor=pointer]:
                - /url: https://www.uncorkedasheville.com/asheville-bookstores/
              - text: . Sip champagne, wine, and literary cocktails between the stacks. Catch live music or a poetry reading.
            - paragraph [ref=e281]:
              - text: With gorgeous weather, we also love
              - link "Asheville’s rooftop bars for breathtaking views" [ref=e282] [cursor=pointer]:
                - /url: https://www.uncorkedasheville.com/rooftop-bars-in-asheville-nc/
              - text: of the Blue Ridge Mountains. Our favorites include The Montford, Capella on 9, Hemingway’s Cuba, The Flat Iron Rooftop, and The Social Lounge. Tom and I cannot resist
              - link "wine bars" [ref=e283] [cursor=pointer]:
                - /url: https://www.uncorkedasheville.com/wine-bars-in-asheville/
              - text: like Leo’s House of Thirst and 5 Walnut. Newer to Asheville, head to Färməsē, a basement cocktail lounge.
            - paragraph [ref=e289]:
              - text: 📚
              - strong [ref=e290]: For bibliotourists
              - text: ": I am a huge literary traveler as a rogue, MLIS-degreed librarian. Be sure to read our"
              - link "Asheville Book Lovers’ Itinerary" [ref=e291] [cursor=pointer]:
                - /url: https://www.uncorkedasheville.com/asheville-for-book-lovers/
              - text: to find the best bookshops, libraries, literary and historical sites, and movie filming locations.
            - 'heading "Day 2: Full Day In Asheville" [level=2] [ref=e292]'
            - paragraph [ref=e293]:
              - text: Make the most out of your 1 to 2 days in Asheville. If you plan on staying in the city proper, we suggest half a day visiting Biltmore Estate followed by heading downtown for breweries and shopping before catching a sunset at The Omni Grove Park Inn.
              - link "For breakfast, try Sunny Point, 5 Points, Pulp & Sprout, or Liberty Cafe" [ref=e294] [cursor=pointer]:
                - /url: https://www.uncorkedasheville.com/best-breakfast-in-asheville-nc/
              - text: .
            - paragraph [ref=e295]:
              - text: However, if Biltmore is not for you, we suggest hiking DuPont State Forest for
              - link "those WNC waterfalls" [ref=e296] [cursor=pointer]:
                - /url: https://www.uncorkedasheville.com/waterfalls-near-asheville-nc/
              - text: ", followed by lunch in Hendersonville and wine tasting across Henderson County. Our"
              - link "Hendersonville attractions guide" [ref=e297] [cursor=pointer]:
                - /url: https://www.uncorkedasheville.com/things-to-do-in-hendersonville-nc/
              - text: will get you started. Hendersonville is about 35 – 45 minutes from Asheville.
