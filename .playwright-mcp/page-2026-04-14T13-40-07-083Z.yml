              - text: ", Kiernan, explains the creation and history behind Biltmore and the role the Vanderbilts played in Asheville’s economy. Edith participated in politics, quite the achievement for the time, and both Vanderbilts helped contribute to forestry education. I love this enlightening book, and it enhanced my perspective of WNC. Read more about"
