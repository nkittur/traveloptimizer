                        - time [ref=e657]: December 18, 2019 at 6:51 pm
                    - generic [ref=e658]:
                      - paragraph [ref=e659]: You would love Asheville as a foodie town sooooo much!
                      - paragraph [ref=e660]: The Biltmore is definitely a must–it’s just so iconic and SO ASHEVILLE. The grounds are neverending, and there is truly something for everyone. You bet I’d come with. I’m loving our annual passes. We like to go just to eat and grab a drink sometimes. Then, we hit the light walking trails.
                      - paragraph [ref=e661]: Chestnut is also a classic. It’s just quaint and classy. Plus, you recently saw that yummy drink I posted on The Uncorked Librarian’s IG. Charcuteries are literally my favorite. The Montford Rooftop bar has a good board too with amazing views.
                      - paragraph [ref=e662]: Yes, come visit!! Thank you!
