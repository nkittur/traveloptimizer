            - paragraph [ref=e421]: Downtown Asheville is always worth a visit. Walkable and easy to navigate, you don’t need a car. Before we moved to Asheville, we took an Uber downtown from our hotel (we stayed off Brevard Road). The main Downtown Asheville area and streets include Wall St., Biltmore Ave., Lexington Ave., and Page Ave.
