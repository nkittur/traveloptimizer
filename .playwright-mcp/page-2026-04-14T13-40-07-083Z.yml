                        - time [ref=e624]: December 18, 2019 at 6:56 pm
                    - generic [ref=e625]:
                      - paragraph [ref=e626]: Yessss, OMG we meet all of the bloggers at the Battery Park Book Exchange. It’s the perfect spot to grab a literary cocktail and catch up.
                      - paragraph [ref=e627]:
                        - text: Haha, don’t tell your parents that I said so, but that sounds like an amazing plan to me. You have to read Thomas Wolfe before you come–preferably
                        - emphasis [ref=e628]: Look Homeward, Angel
                        - text: –so that you can go on a literary date. It would be perfect!
                      - paragraph [ref=e629]: There are also great fiction books about the Biltmore so I see another date there. See, we are building up your blog content too!! Plus, this will help you reach your goal of doing more literary dates outside of NYC.
                      - paragraph [ref=e630]: My husband is gluten-free and Asheville is full of GF options for food and drinks. Yes, they have gf-free/reduced beer, cider, wine… You’d be all set for your dad. Some places, like Top of the Monk, make amazing mocktails too.
                      - paragraph [ref=e631]: Thank you SO MUCH!!!! I’D DIE IF YOU MOVED HERE—but in a totally good way.
