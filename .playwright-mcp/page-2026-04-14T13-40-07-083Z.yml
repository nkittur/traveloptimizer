                - generic [ref=e612]:
                  - paragraph [ref=e613]:
                    - text: Can we please meet up at the Battery Park Book Exchange? That place sounds awesome!! Asheville is only 3ish hours away from Atlanta so I think I’ll have to convince my parents to take a long weekend there with me. Then I’ll ditch them for a bit to hang with you!
                    - text: Riiiggght!?
                    - text: The Biltmore sounds amazing. I might be able to lure them over with that. Your husband is gluten free right? So do those breweries have gluten-free options? My father is gluten-free too. My mom doesn’t drink so she’d just watch me and my father drink. Or if there’s no gluten-free options then they will both watch me drink.
                  - paragraph [ref=e614]: I love all your Asheville posts! I think I should just move there although maybe I should visit first.
