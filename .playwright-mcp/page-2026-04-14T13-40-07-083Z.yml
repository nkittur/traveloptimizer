            - paragraph [ref=e539]:
              - link "Asheville has plenty of nice places to stay" [ref=e540] [cursor=pointer]:
                - /url: https://www.uncorkedasheville.com/where-to-stay-in-asheville-nc/
              - text: . However, with one to two nights in Asheville, these are our top picks for location and comfort.
            - list [ref=e542]:
              - listitem [ref=e543]:
                - link "Aloft – Downtown Asheville" [ref=e544] [cursor=pointer]:
                  - /url: https://booking.tpm.li/cfdr1Y7F
                - text: – If you are looking to stay in the heart of Downtown Asheville, the updated Aloft Hotel has murals, hipster rooms, and sprawling public areas, including a rooftop pool and ledge.
              - listitem [ref=e545]:
                - link "The Lion and the Rose" [ref=e546] [cursor=pointer]:
                  - /url: https://booking.tpm.li/LCoD5Vas
                - text: – A pink lady, Historic Montford District Bed & Breakfast.
              - listitem [ref=e547]:
                - link "The Restoration Asheville" [ref=e548] [cursor=pointer]:
                  - /url: https://www.booking.com/hotel/us/the-restoration-asheville.html
                - text: – Located Downtown with a rooftop bar and multiple restaurants, this 4-star hotel is in a great location with stellar views.
              - listitem [ref=e549]:
                - link "Hampton Inn And Suites Asheville Biltmore Area" [ref=e550] [cursor=pointer]:
                  - /url: https://booking.tpm.li/HEt5ZAQv
                - text: – Although this hotel sits on busy Brevard Road – NC-191 – across from the Asheville Outlets, it was one of our favorites before moving here. Clean, updated, and in the middle of everything, access Downtown Asheville, Biltmore, and the Blue Ridge Parkway. It’s family and budget-friendly.
              - listitem [ref=e551]:
                - link "Blind Tiger Asheville" [ref=e552] [cursor=pointer]:
                  - /url: https://www.booking.com/hotel/us/1889-whitegate-inn-cottage.html
                - text: – They also gifted us a staycation at this beautiful boutique hotel in the historic Chestnut Street area. Another charming gem. Walk to Bone & Broth, find Little Free Libraries, and even walk downtown.
            - heading "Frequently Asked Questions" [level=2] [ref=e554]
            - generic [ref=e555]:
              - generic [ref=e556]:
                - heading "Why is Asheville so popular?" [level=3] [ref=e557]
                - generic [ref=e558]: Along with large attractions like Biltmore Estate, Asheville is famous for the gorgeous Blue Ridge Mountains. Hike and chase waterfalls, drive the scenic Blue Ridge Parkway, and dine at award-winning restaurants.
              - generic [ref=e559]:
                - heading "Is Downtown Asheville worth visiting?" [level=3] [ref=e560]
                - generic [ref=e561]: Yes, Downtown Asheville is a great place to eat at famous restaurants, see historic buildings, shop, and enjoy the city’s craft breweries. Plus, it’s walkable; no car is needed.
              - generic [ref=e562]:
                - heading "How many days do you need for Asheville, NC?" [level=3] [ref=e563]
                - generic [ref=e564]: To experience the tourist attractions and local haunts, spend 3 to 4 days in Asheville. This will give you time for day trips nearby, too.
            - heading "Before You Go…" [level=4] [ref=e565]
            - paragraph [ref=e566]: We love living in Asheville and taking our out-of-town guests around. Everyone is friendly, happy, and well-hydrated. There are plenty of activities, and you can enjoy the North Carolina mountains and eclectic culture.
            - paragraph [ref=e567]: Please let us know how your vacation went in the comments. We’d love to hear your personal Asheville itinerary.
