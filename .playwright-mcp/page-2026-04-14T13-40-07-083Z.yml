            - paragraph [ref=e317]:
              - text: With only 36 hours in Asheville, visit
              - link "Biltmore Estate" [ref=e318] [cursor=pointer]:
                - /url: https://www.biltmore.com/
              - text: ", the area’s"
              - link "blockbuster tourist attraction" [ref=e319] [cursor=pointer]:
                - /url: https://www.uncorkedasheville.com/asheville-tourist-attractions/
              - text: . As America’s largest home, dreamed up by George and Edith Vanderbilt with the help of Richard Morris Hunt and Frederick Law Olmsted, Biltmore is Asheville’s version of the Newport mansions.
            - paragraph [ref=e321]:
              - text: We are
              - link "Biltmore annual passholders" [ref=e322] [cursor=pointer]:
                - /url: https://www.uncorkedasheville.com/biltmore-annual-pass/
              - text: . To
              - link "get your money’s worth" [ref=e323] [cursor=pointer]:
                - /url: https://www.uncorkedasheville.com/best-things-to-do-at-biltmore/
              - text: "without exhausting yourself, we suggest:"
            - list [ref=e324]:
              - listitem [ref=e325]: Self-guided or audio Biltmore House tour first thing in the morning; budget 1 to 1.5 hours; use the restrooms before entering
              - listitem [ref=e326]: Stroll the gardens; our favorite is the Walled Garden
              - listitem [ref=e327]: Lunch at Stable Cafe (next to the house) or Cedric’s Tavern (Antler Hill Village); make advanced reservations
              - listitem [ref=e328]: Wine taste at Biltmore Winery
              - listitem [ref=e329]: If time allows, walk the Lagoon Trail or catch a special exhibit
              - listitem [ref=e330]:
                - link "With kids" [ref=e331] [cursor=pointer]:
                  - /url: https://www.uncorkedasheville.com/biltmore-with-kids/
                - text: ", enjoy the live demonstrations, barnyard, bike rentals, and wooden playground"
            - paragraph [ref=e332]:
              - text: In the winter,
              - link "Christmas at Biltmore" [ref=e333] [cursor=pointer]:
                - /url: https://www.uncorkedasheville.com/christmas-at-biltmore/
              - text: is also a must, especially Candlelight Christmas evenings. Consider overnighting at the Village Hotel or The Inn.
            - paragraph [ref=e338]:
              - strong [ref=e339]: History Lovers Tip
              - text: ": Read"
              - link "The Last Castle by Denise Kiernan" [ref=e340] [cursor=pointer]:
                - /url: https://amzn.to/48E9ZSd
                - emphasis [ref=e341]: The Last Castle
