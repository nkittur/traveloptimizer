            - heading "Fun-Filled, 36 Hours In Asheville Itinerary" [level=2] [ref=e75]
            - paragraph [ref=e76]: When we first visited Western North Carolina, we had barely 2 days in Asheville (AVL) to see all the attractions, hike in the beautiful Blue Ridge Mountains, and tour the historic Biltmore Estate. However, that short time also convinced us to move here. We’ve been AVL residents since 2019.
