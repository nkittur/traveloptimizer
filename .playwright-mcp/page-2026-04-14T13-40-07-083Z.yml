                - text: like Baby Bull (burgers), Ultra Coffeebar (coffee & breakfast/lunch), and The Bull and Beggar (meats)
              - listitem [ref=e161]: Drinking at Ginger’s Revenge (GF ginger beer), Hi-Wire RAD Beer Garden, RAD Brewing, and Anoche (tequila bar)
              - listitem [ref=e162]:
