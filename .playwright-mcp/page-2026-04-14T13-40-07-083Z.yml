                - /url: https://www.uncorkedasheville.com/best-neighborhoods-in-asheville/
              - text: has a vibe. Reminiscent of Wynwood Walls in Miami, we love the River Arts District (RAD), which is full of artist studios and shops. However, because of its proximity to the French Broad River, the area was devastated by Tropical Storm/Hurricane Helene.
            - paragraph [ref=e150]:
              - text: Much of Upper RAD is open (all of Roberts Street, Artful Way, Depot Street, and Clingman Avenue), and a few places have reopened in the lower areas. While we have an
              - link "entire guide dedicated to RAD" [ref=e151] [cursor=pointer]:
                - /url: https://www.uncorkedasheville.com/asheville-river-arts-district/
              - text: ", add these memorable highlights to your Asheville itinerary:"
            - list [ref=e153]:
              - listitem [ref=e154]: Walking, skating, and biking the RAD Riverwalk along the French Broad River (much of the riverwalk has been cleared and repaired)
              - listitem [ref=e155]:
