            - 'heading "Day 3: Heading Out" [level=2] [ref=e482]'
            - paragraph [ref=e483]: If you have half a day in Asheville before heading out, these are our final suggestions. However, if you skip Biltmore altogether, driving the Blue Ridge Parkway is another great way to spend 36 hours in Asheville for Day 2.
            - heading "8. Drive down the scenic Blue Ridge Parkway" [level=3] [ref=e484]
            - figure [ref=e486]:
              - generic [ref=e487]:
                - img "Blue Ridge Parkway from Craggy Pinnacle" [ref=e488]
                - generic "Share on Pinterest" [ref=e489] [cursor=pointer]:
                  - img
                  - text: Pin
            - paragraph [ref=e491]:
              - text: The
              - link "Blue Ridge Parkway (BRP)" [ref=e492] [cursor=pointer]:
                - /url: https://www.blueridgeparkway.org/
              - text: is a 469-mile, 2-lane, scenic road managed by The National Park Service (NPS). Free to access, the Parkway runs from Virginia’s Shenandoah National Park to Great Smoky Mountains National Park in North Carolina.
            - paragraph [ref=e493]:
              - text: A must for any Asheville itinerary, find endless scenic overlooks and cascading waterfalls.
              - link "These BRP hikes" [ref=e494] [cursor=pointer]:
                - /url: https://www.uncorkedasheville.com/blue-ridge-parkway-hikes-near-asheville/
              - text: have some of the best mountain views. Before heading out, check the
              - link "NPS site for gate and Helene-related closures" [ref=e495] [cursor=pointer]:
                - /url: https://www.nps.gov/blri/planyourvisit/roadclosures.htm
              - text: .
            - paragraph [ref=e496]:
              - text: We have an
              - link "entire hiking guide for Asheville" [ref=e497] [cursor=pointer]:
                - /url: https://www.uncorkedasheville.com/asheville-hiking/
              - text: if you wish to swap out any of the above activities to get outside. Head to Black Balsam via the Art Loeb Trail or climb Mount Pisgah (we have this
              - link "Pisgah-area itinerary" [ref=e498] [cursor=pointer]:
                - /url: https://www.uncorkedasheville.com/mount-pisgah-itinerary/
              - text: ). In the fall, the BRP is a must for leaf chasers. Consider this popular
              - link "guided waterfall hiking tour" [ref=e499] [cursor=pointer]:
                - /url: http://vi.me/zk1zr
              - text: .
