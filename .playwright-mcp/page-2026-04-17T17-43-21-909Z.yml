                - paragraph [ref=e387]:
                  - text: Aref Shatarah and wife Majeda opened Al Baraka in 2023 specializing in Palestinian dishes; regulars tend to recommend the homestyle daily specials. Start with the sheikh el mahshi, fried squash stuffed with a medley of pine nuts and ground beef cooked in yogurt. The tender chicken and the marinated grape leaves filled with rice, onion, tomato, and verdant herbs set Al Baraka apart in
