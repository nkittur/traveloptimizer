                  - paragraph [ref=e721]: Garlic & Chives is one of those Little Saigon spots that never seems to lose momentum. The Mall of Fortune stalwart offers a variety of Vietnamese comfort dishes with unapologetic flavor — crunchy wings doused in garlic and Sichuan spice, garlic noodles topped with plump black tiger shrimp, fried salmon belly, sizzling cubes of toothpick lamb. This menu may be wide, but its execution is sharp; expect dishes to deliver plenty of its namesake aromatics. Inside, the room hums with energy, plates hit the table fast, and every dish feels built for sharing, especially mains like lamb chops or caramelized catfish with pork belly. There’s little subtlety and that’s part of the joy.
                  - paragraph [ref=e722]:
                    - strong [ref=e723]: "Must-try dishes:"
                    - text: Wings, garlic noodles, and toothpick lamb.
