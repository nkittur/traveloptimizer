                - paragraph [ref=e1358]: Korean comfort food served in large portions is what Yigah is known for in Orange County. The restaurant located within the Diamond Jamboree shopping center serves steamy galbi tang, beef short rib soup, as well as the bossam meal with boiled pork belly, napa cabbage, and spicy pickled radish. The soups — especially the spicy beef or ox knee varieties — arrive steaming and full of depth, while crisp tonkatsu and sizzling hot-stone bibimbap round out the soul-warming lineup. The room is as casual as it gets, the kind of place you can turn to on cold nights and quiet weekends.
