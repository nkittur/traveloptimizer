                  - /url: /maps/little-arabia-restaurants-places-to-eat-anaheim-california
                - text: . For upscale, white-tablecloth dining experiences with higher prices to match are fine dining stalwarts backed by big names. There’s something for everyone in Orange County. Here are the 38 best restaurants in Orange County.
