                - paragraph [ref=e1039]: This landmark restaurant offers a wide array of Vietnamese specialties, starting with 13 types of spring rolls — including its signature, nem nuong cuon. Grilled pork with lettuce, carrots, a slender piece of deep-fried egg-roll skin, mint, chives, and cucumber wrapped in rice paper. The menu continues with traditional Vietnamese noodle soups, rice porridge packed with sole, and banh xeo crepe filled with shrimp, sliced pork, mung beans, sprouts and a mountain of herbs..The dining room gleams — lively, family-driven, and full of laughter over shared plates.
