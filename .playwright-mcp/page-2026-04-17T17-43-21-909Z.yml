                - paragraph [ref=e1519]: "For first-timers, the lobster roll and creamy clam chowder at this seafood spot are a gateway experience. Bites of the buttery toasted bun stuffed with succulent claw meat get interspersed with slurps of homemade chowder with whole baby clams — the dish evokes memories of the best old-school seafood houses. Venture beyond the lobster roll: The rest of the menu includes favorites like crispy tempura-battered mahi mahi fish and chips, as well as wild-caught seafood for surf-and-turf plates. In June, it opened a second location along a popular stretch of La Plaza in Dana Point."
