                    - img "Link" [ref=e1603]
                - paragraph [ref=e1605]: A meal at Fable & Spirit, almost by default, starts with warm Guinness brown bread with European butter and Jacobsen sea salt. From there, the Lido Isle restaurant weaves between European meat and potato influences to pure California cuisine, like citrusy salads loaded with cara cara and blood oranges, chevre, and crispy quinoa. The fish and chips, lightly battered with a crisp outer layer gives way to pillowy, flaky meat. Fable serves it with vibrant crushed peas, hand-cut fries, and a curry remoulade sauce. The cocktails are inventive; the room lively with emerald green walls, gold accents, and art that plays into the rich mythology of Irish culture. Chef David Shofner and the Coyle family are also known for popular Mission Viejo restaurants Wineworks for Everyone and Dublin 4 Gastropub.
