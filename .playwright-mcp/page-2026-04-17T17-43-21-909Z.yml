                  - paragraph [ref=e932]: Chef Nokmaniphone Sayavong’s Laotian food built a cult following with her grilled sausage and tum mak houng, grated papaya salad mixed with tomato and seasoned with fish sauce. The herbaceous pork sausage should be eaten with sticky rice, a Laotian staple, and dipped in tangy, spiced jeow som, interspersed with bites of fresh cucumber. The khao pad, her signature fried rice, comes with either tofu, chicken, pork, shrimp, or crab. Nok’s turns out dishes that balance home-style comfort with restaurant polish. All of this can be had in its dining room with dark walls, rattan fixtures, and a centerpiece mural.
