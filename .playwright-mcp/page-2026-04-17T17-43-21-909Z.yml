                - paragraph [ref=e967]: Chaak Kitchen in Old Town Tustin is the sister restaurant to Gabbi’s Mexican Kitchen in Orange. The food pulls inspiration from Yucatán, Mayan, and European flavors — wood-grilled meats, smoky recados, and masa in all its glorious forms. Starters such as sikil p’ak, a creamy pumpkin seed dip, and mains like the cochinita pibil, achiote-smoked pork shoulder, remain examples of how this lush, modern restaurant, with its retractable roof and ample sidewalk patio dining, pushes the expectations of Mexican food found in Orange County. Don’t skip the wines from Mexico and cocktails from its robust menu.
