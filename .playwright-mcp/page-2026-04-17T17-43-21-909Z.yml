                  - paragraph [ref=e1665]: Chef Richard Mead is a long-standing figure in the Orange County dining scene. At the Farmhouse at Roger’s Gardens, the chef showcases the best that the season has to offer from the region’s many producers, which means ever-changing takes on dishes like sea scallops, as well as shrimp and mussels served in a tomato-Pernod broth with a polenta cake made from cornmeal sourced from the Tehachapi Heritage Grain Project. Surrounded by greenery, this open-air restaurant channels farm-to-table sincerity with California ease.
