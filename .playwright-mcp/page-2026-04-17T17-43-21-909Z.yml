                - paragraph [ref=e1853]:
                  - text: The line outside Heritage Barbecue says it all. San Juan Capistrano’s award-winning pitmaster Daniel Castillo — a
                  - 'link "2025 James Beard Award finalist for Best Chef: California" [ref=e1854] [cursor=pointer]':
                    - /url: /2025/4/2/24399234/los-angeles-james-beard-foundation-award-nominees-2025
                  - text: — takes barbecue to the next level with wood-smoked brisket with deep bark, sausages, turkey, ribs that fall clean off the bone, herb-seasoned chicken, and more. First-timers load up on the brisket and ribs, while regulars order sandwich specials like the tip French dip, brisket tacos prepared with La Palma tortillas, and creamy banana pudding layered with pound cake and vanilla wafer cookies. Get the charred broccoli with cheesy mornay sauce if it’s on the menu.
