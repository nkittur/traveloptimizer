                    - heading "Pho 79" [level=2] [ref=e774]
                    - button "Copy link" [ref=e776] [cursor=pointer]:
                      - img "Link" [ref=e777]
                  - paragraph [ref=e779]: This is not just another pho shop — Phở 79 is the institution. Thọ Trần and Liễu Trần’s restaurant has ladled out hot bowls of steaming pho since 1982. Step in and find a spartan but inviting sunshine-yellow interior adorned with a wall of honors — James Beard America’s Classics award and a Michelin Bib Gourmand being the most prominent. The broth runs deep and fragrant with star anise — a base that can hold brisket, tendon, oxtail, or, ideally, all three. Because the place is so loved, expect waits, but there’s a rhythm to the room that feels like clockwork precision — service is brisk and tables turn fast. Some places get crowded because they’re trendy; this one stays crowded because it’s timeless.
                  - paragraph [ref=e780]:
                    - strong [ref=e781]: "Must-try dish:"
                    - text: Oxtail pho with brisket and tendon.
