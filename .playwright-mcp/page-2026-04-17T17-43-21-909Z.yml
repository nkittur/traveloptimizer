                      - img "Link" [ref=e1009]
                  - paragraph [ref=e1011]: "Taco Mesita has quietly become a locals’ favorite in Tustin. The modern fast-food menu has an Alta California touch and lets quality wood-fired meats and seasonal ingredients do the heavy lifting: think skirt steak tacos served on organic hand-pressed blue corn tortillas, panela taquitos crowned by fresh cheese and avocado crema, and rotisserie pollo burrito filled with a vibrant tomatillo corn cabbage relish. Signature whipped jalapeño salsa adds personality, bringing heat and brightness that punch up each bite. Mesita’s breakfast features just as noteworthy steak or chorizo breakfast tacos, each finished with poblano strips, crispy cheese, potato, pickled onion, and sous vide egg. The space has a compact and warm neutral patio surrounded by lush landscaping, with a steady stream of locals cycling through the drive-thru — always a good sign."
