                    - heading "Alta Baja Market" [level=2] [ref=e835]
                    - button "Copy link" [ref=e837] [cursor=pointer]:
                      - img "Link" [ref=e838]
                  - paragraph [ref=e840]: "Delilah Snell’s Alta Baja Market is the heart of downtown Santa Ana. It’s also a community pillar: the market received the 2023 Siete Family Foods’ Siete Juntos Fund, which strives to support and empower Latino communities. Alta Baja Market’s breakfast and lunch menu includes dishes such as New Mexican blue cornbread with honey butter and Lady C’s green chile eggchilada, which resembles a breakfast casserole using La Princesita tortillas. The market’s specialty grocery section includes one of the largest selections of Mexican wines in the U.S., along with a variety of heirloom corn, beans, and grains. To get the full experience, order one of Alta Baja’s signature micheladas. La Chiquita, made with passion fruit, is a sweet and spicy complement to any dish."
                  - paragraph [ref=e841]:
                    - strong [ref=e842]: "Know before you go:"
                    - text: The last Sunday of every month is “Pozole Sunday.” Snell offers two styles — Zacatecas-style pork pozole rojo and vegan pozole verde from Guerrero — from 10 a.m. until sold out. And they will run out.
