                  - paragraph [ref=e1105]:
                    - text: Once a humble Baja California-style lonchera
                    - emphasis [ref=e1106]: ","
                    - text: "El Yaqui now anchors its own standalone space in Santa Ana — and the seafood remains the draw. The counters are simple and the plates generous: think ceviche towers, shrimp or fish tacos (fried or grilled), smoky marlin, and butterflied raw shrimp aguachile platters with lots of lime. Look for the Pokastrankas stack — a mountain of seafood, avocado, and serrano heat that regulars swear by. What you won’t get anywhere else is the cahuamanta, a spicy soup made with shrimp and manta ray, an invigorating pottage that has its roots in caguama (Mexican sea-turtle soup that became outlawed once the species became endangered). El Yaqui’s cahuamanta doesn’t skimp on the manta, whose flavor is similar to that of squid. If you order correctly, you’ll leave smelling like lime, and that’s precisely the point."
