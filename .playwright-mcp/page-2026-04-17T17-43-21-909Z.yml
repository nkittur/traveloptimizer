                  - emphasis [ref=e1243]: "Top Chef: All Stars’"
                  - text: Amar Santana opened this sleek Spanish hideaway in 2016 inside the Segerstrom Performing Arts Center. Aged steaks hang from illuminated cases as if perched in a sleek showroom. For friends and family, a specially priced menu only available on Mondays, the wagyu and bone marrow burger gets punched up with Fiscalini cheddar, crisp cabbage, and truffle aioli. Those looking for paella will find options with saffron-hinted bomba rice. But the sharable tapas are the most fun. The chef’s snacks rotate often, but the creamy chicken croquettes and warm pulpo with fingerling potatoes drizzled in Spanish olive oil remain mainstays since it opened.
