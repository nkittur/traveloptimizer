                    - text: by the
                    - emphasis [ref=e249]: Washington Post
                    - text: ", the pies at Fuoco Pizzeria Napoletana emerge from a nearly 1,000-degree wood-burning oven built in Naples by Stefano Ferrara — producing crusts that are airy, blistered, and char-kissed. Three generations of pizzaiolos continue churning out classic margherita pizzas and the Fuoco pie, which is topped with mozzarella, prosciutto crudo, arugula, and shaved Parmigiano, and drizzled with truffle oil. A mozzarella bar is stocked weekly with cheese imported from Caserta, Italy. The place hums with local pride, and the dining room fills up quickly."
