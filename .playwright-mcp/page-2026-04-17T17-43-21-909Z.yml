                - paragraph [ref=e462]:
                  - text: As one of the oldest restaurants in Anaheim’s
                  - link "Little Arabia District" [ref=e463] [cursor=pointer]:
                    - /url: /maps/little-arabia-restaurants-places-to-eat-anaheim-california
                  - text: ", Kareem’s remains a go-to for Middle Eastern food. Owner Kareem Hawari’s closely held family falafel recipe is so popular that the Hawaris started selling it wholesale to grocery stores and other restaurants. The baba ganoush, grape leaves, and hummus are staples not to miss, but Kareem’s newer menu items — vegetarian wraps, falafel sliders, and feta fries — also offer modern takes on dishes without sacrificing traditional flavor. The small restaurant gets packed during the lunch rush, but diners can usually find outdoor patio seating to enjoy a leisurely spread."
