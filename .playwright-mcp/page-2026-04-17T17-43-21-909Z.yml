                  - paragraph [ref=e1214]: Tucked inside a quiet plaza, chef Jimmy Stafford’s Parlor restaurant turns out fresh pastas like rigatoni Bolognese, bucatini all’Amatriciana, sausage and rapini paccheri, and rosemary focaccia worthy of its own Netflix special. Pizzas come from a wood-fired oven, their edges blistered and charred just enough — the Fiori e Limone with dollops of stracciatella, zucchini, Meyer lemon, and a hit of brightness might be the sleeper pick of the year. The space leans casual-industrial with counter-order service, making it the kind of weekday haunt that’s easy to drop into for takeout or a laid-back dinner. Weekends are closed (for now), but the word is building fast.
