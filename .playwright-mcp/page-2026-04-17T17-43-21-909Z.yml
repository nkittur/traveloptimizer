                  - paragraph [ref=e1289]: This modern French-Californian restaurant from chef Tony Esnault and Yassmin Sarmadi is ripe for celebratory meals. The three-course lunch and four-to-six-course dinner prix fixe menus change often. One week, it’s French black truffles; another evening, it’s a Nowruz dinner with recipes by Shamsi Katebi, prepared by Esnault and his kitchen team. Its plush banquets and round tables overlook the bar and open kitchen. A sunlit patio is typically booked with private weekend events, and a pricey but impeccable afternoon tea service is available on Saturdays. The surprisingly satisfying non-alcoholic cocktails, like the Cadillac margarita with orange, pomegranate, and lime, are also worth stopping in for.
