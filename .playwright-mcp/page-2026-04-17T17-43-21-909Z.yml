                      - img "Link" [ref=e514]
                  - paragraph [ref=e516]: The family-owned Los Alamitos landmark, founded by Sam Ratman and his wife Shirley, is known for its deli food and stocked bakery case that has black-and-white cookies, pastries such as custard-filled eclairs, chocolate chip Danishes, and rugelach. The family-sized portions allow diners to nosh on several dishes at once. Rotund matzo balls are served in Shirley’s chicken soup and rye bread pastrami sandwiches remain a Katella favorite. The vibe is family-friendly with a multi-generational crowd in the dining room, which was remodeled in 2022. The bakery section has illuminated cases filled with slices of layer cakes, cookies, and glistening fruit tarts, baskets filled with bagels, and a smattering of deli items available for takeaway.
