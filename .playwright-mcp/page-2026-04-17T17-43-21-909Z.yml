                  - paragraph [ref=e1916]: "George Barker opened Mayfield in 2020 and sparked a new dining movement in San Juan Capistrano. The food is influenced by Levantine regional flavors, with hints of North Africa, the Mediterranean, and the Middle East mixed with classic Californian approaches. Find a solid burger with harissa aioli at happy hour and za’atar fried chicken for dinner. For brunch, there’s avocado toast and egg sandwiches, but there are also Turkish eggs with labneh and fiery tomato shakshuka, showcasing the variety from the kitchen. The restaurant is also known for its cocktails: sip on a papa picante topped with habanero bitters or a well-made Negroni."
