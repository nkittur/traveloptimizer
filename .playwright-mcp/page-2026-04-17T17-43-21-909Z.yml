                  - heading "Banh Cuon Luu Luyen" [level=2] [ref=e744]
                  - button "Copy link" [ref=e746] [cursor=pointer]:
                    - img "Link" [ref=e747]
                - paragraph [ref=e749]: Lưu Luyến occupies the corner spot of a shopping plaza, which means it has a whole row of parking spots to itself — perfect for the long lines it regularly draws for its bánh cuốn. Delicate steamed rice sheets are spun paper-thin, then stretched, filled, and rolled to order with savory pork, shrimp, or mushrooms. Each plate lands with shards of fried shallots, fragrant herbs, and chile-infused nuoc cham good enough for a mason jar and ladle. Other dishes include spring rolls, bun moc soup, nem heo (fermented pork), but the bánh cuốn are the reason to come. The tiny dining room fills up quickly, so come early or be prepared to wait alongside locals who know exactly why it’s worth it.
