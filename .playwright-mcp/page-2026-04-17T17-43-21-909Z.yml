                  - paragraph [ref=e1411]: This Taiwanese restaurant in Irvine serves Chinese-style crispy pork chop over rice and thousand-layer pancakes, but the noodle dishes are not to be missed, including a beef noodle soup with deep peppery broth and noodles with ground pork. For diners who enjoy heat, the menu also features several Sichuan-style dishes, like beef tendon with garlic sauce and spicy wontons with a hint of sweetness and heat that doesn’t overpower. Pair it with a Chinese beef wrap or dumplings and you’ll understand why this shop is always full. It’s fast, warm, and feels like a familiar memory even the first time you visit.
