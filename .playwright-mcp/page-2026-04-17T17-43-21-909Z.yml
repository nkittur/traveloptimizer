                - paragraph [ref=e293]: This Michelin-recommended halal restaurant combines the flavors of India, Afghanistan, and Pakistan with a modern Californian twist. The tender boneless chicken karahi is served with tomatoes and shishito peppers, and the butter chicken with dried fenugreek is one of the restaurant’s more popular dishes. The pani puri with tamarind water, mint, onion, and potato arrives on a mini cart and is intended to be taken as a shooter. Expect richly spiced biryani, charred kebabs, and a nonalcoholic cocktail program that holds its own.
