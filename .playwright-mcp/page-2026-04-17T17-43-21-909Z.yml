                  - paragraph [ref=e636]:
                    - text: Smoke Queen Barbecue has established itself in Garden Grove as an
                    - link "Asian-style barbecue joint" [ref=e637] [cursor=pointer]:
                      - /url: /2024/3/13/24099807/smoke-queen-barbecue-restaurant-garden-grove-orange-county
                    - text: "that isn’t afraid to push beyond the expected. Chef-owner Winnie Yee’s restaurant leans into low-and-slow smoking techniques, turning out brisket, gochujang beef ribs, pork belly char siu, and other smoked meats that are tender, deeply seasoned, and rich with smoke. Smoke Queen stands out for its Chinese and Malaysian flavors, as well as its sauces and sides that add dimension without overpowering the barbecue fundamentals: think mapo chile, house-pickled spicy cucumbers, and coconut rice. The space itself feels relaxed and unfussy — more neighborhood hangout than destination dining room — but the aromas alone signal something serious happening in the smoker. It’s an easy choice for casual dinners or group feasts where ordering family-style is the move."
