                  - paragraph [ref=e1563]: "This cozy red booth hideout on Pacific Coast Highway is known for its Rat Pack atmosphere. The classic martini reigns at the bar, and the chicken pot pie is only available on Monday and Friday, but locals love the steaks, the roasted Mary’s organic chicken, and pan-seared Niman Ranch pork chops. Put simply: The restaurant is old-school done right. River Jetty Restaurant Group also operates A Restaurant’s sister locales CDM Restaurant, A Crystal Cove, and A Market, which are go-to hot spots in Newport Beach."
