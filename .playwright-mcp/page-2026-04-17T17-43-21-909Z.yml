                  - text: ", combining ancestral foodways with modern techniques. The menu, which presents as refined yet familiar, runs the gamut from chilaquiles (legendary since it first opened for its dense disc version of the dish) in smoky guajillo sauce to mole negro enchiladas and mezcal-forward cocktails that make a strong case for lingering. The vibe feels contemporary but not fussy — sleek lines, warm lighting, and plates that look as good as they taste. It’s the kind of restaurant that made locals rethink what Mexican food can mean in Orange County."
