                - paragraph [ref=e1435]: The omakase-only Hana re is a 10-seat sushi-ya helmed by Atsushi Yokoyama. Located in an industrial storage crate at the Lab in Costa Mesa, the counter, which held a Michelin star from 2019 to 2024, feels like a hidden gem, even though its stellar fish preparations are no secret anymore. Yokoyama and one server, who also assists with wine pairings, put out an omakase experience that includes bite-sized crab perched atop eel tempura, scallops enveloped in gelee, Whelk shellfish with celery root, caviar, and shiso. Reservations can be made via text at (714) 545-2800 for the $250 omakase.
