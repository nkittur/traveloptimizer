                  - heading "Fat Of The Land" [level=2] [ref=e802]
                  - button "Copy link" [ref=e804] [cursor=pointer]:
                    - img "Link" [ref=e805]
                - paragraph [ref=e807]: "Fat of the Land has carved out a thoughtful niche in Santa Ana, appealing to diners drawn to its coastal Spanish tapas, consistency, and attentive care. The menu emphasizes seasonality, resulting in dishes that feel intentional and balanced — octopus carpaccio in a mojo vinaigrette, a rack of pork, and Piquillo peppers stuffed with Iberian pork and fennel slaw — striking a balance between rustic and refined. The dining room mirrors that sensibility: accented with warm brass, dark-wood chairs and ornate mirrors, soft lights hidden in gentle fixtures, textured wallpaper, and a white marble bar. To complement the food, Fat of the Land’s wine list features a regional collection of Spanish wine. This is a place designed for lingering meals, whether for an intimate dinner or a longer catch-up over shared plates."
                - paragraph [ref=e808]:
                  - strong [ref=e809]: "Must-try dish:"
                  - text: Ask about the seasonal specials, which often showcase what the kitchen team is most excited about at the moment.
