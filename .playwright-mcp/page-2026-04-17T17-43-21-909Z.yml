                  - paragraph [ref=e418]: In an unassuming Orange strip mall, Ohshima quietly serves some of the county’s most dependable sushi. Whether you go at lunch or dinner, the restaurant feels calm and measured — sushi, sashimi, rolls, plus traditional Japanese entrees like fish collar and grilled beef tongue — all delivered with proper rice seasoning and deft fish preparation. There’s no omakase theater here, no flashy decor — just well-made fish, clean flavors, and simple excellence that keeps regulars coming weekly. Try a cold sake (available by the glass or bottle) with the uni chawamushi.
