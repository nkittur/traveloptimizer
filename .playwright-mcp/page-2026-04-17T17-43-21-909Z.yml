                  - heading "Omakase by Gino" [level=2] [ref=e874]
                  - button "Copy link" [ref=e876] [cursor=pointer]:
                    - img "Link" [ref=e877]
                - paragraph [ref=e879]: Sushi chef Gino Choi prepares an intricate omakase for 10 diners at his namesake downtown Santa Ana restaurant. (Choi is also a self-taught carpenter who built the sushi counter, entryway, and partitions himself.) Standout dishes include a creamy Hokkaido uni udon garnished with winter black truffles from Spain; Gino’s version of tamago, flavored with shellfish; and a yuzu foam topped with slow-cooked black cod bedded alongside green plum marinated roasted tomatoes. Choi serves four days a week with two seatings per night; the cost is $250 per person, and reservations vanish fast.
