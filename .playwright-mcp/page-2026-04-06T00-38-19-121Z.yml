                          - heading "The Fishery" [level=3] [ref=e316]:
                            - paragraph [ref=e317]: The Fishery
                        - paragraph [ref=e320]: A fixture in Pacific Beach for nearly 30 years, this restaurant is run by a local family with roots in the fishing industry, and specializes in fresh, sustainable seafood. If you’re wanting top-notch seafood during your visit to San Diego, The Fishery should be a destination on your list. The restaurant takes pride in their sourcing, and notes on their menu the names of the local farms and fishermen they work with. If you want to go all out, order one of the raw seafood towers (there’s options for 2-4 or 4-6 people) or get a dozen shucked oysters to pair with a cocktail. For entrees, popular items include the ahi “smashburger” on a brioche bun, and the grilled bone-in swordfish chop that serves two to three people. The Fishery prioritizes serving seafood that is sustainable and wild-caught as much as possible, and is a longtime family-owned business that’s definitely worth supporting.
                        - link "Read Full Review" [ref=e321] [cursor=pointer]:
                          - /url: https://www.cntraveler.com/restaurants/san-diego/the-fishery
