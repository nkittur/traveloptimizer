                  - generic [ref=e408]:
                    - link "Fort Oak" [ref=e409] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/restaurants/san-diego/fort-oak
                      - heading "Fort Oak" [level=3] [ref=e410]:
                        - paragraph [ref=e411]: Fort Oak
                    - paragraph [ref=e414]:
                      - text: Housed in a former Ford dealership in the upscale, pedestrian-friendly Mission Hills neighborhood, Fort Oak draws foodies of every age. pauch like their wildly successful
                      - link "Trust restaurant" [ref=e415] [cursor=pointer]:
                        - /url: https://www.cntraveler.com/restaurants/san-diego/trust
                      - text: in the nearby Hillcrest neighborhood, executive chef and co-owner Brad Wise and his team focus on rustic, wood-fired dishes. The proof is in the custom-built 7,000-pound grill used to cook branzino, a charred caulilini with fermented chile aioli, and more. The raw bar is one of the few places on the menu where the ingredients aren't seared; here you can opt for clams on the half shell or scallop aguachile. There's plenty for the plant-based diners, too, mostly in the small plates. And while it may sound excessive to pay $13 for bread and butter, order the sourdough served with house-cultured butter and thank us later. And don't miss dessert. Executive pastry chef Jeremy Harville makes magic happen with sugar, whether it's cookies n’ cream beignets or lemon meringue pie.
                    - link "Read Full Review" [ref=e416] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/restaurants/san-diego/fort-oak
