                  - generic [ref=e1302]:
                    - link "Shawarma Guys" [ref=e1303] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/restaurants/san-diego/shawarma-guys
                      - heading "Shawarma Guys" [level=3] [ref=e1304]:
                        - paragraph [ref=e1305]: Shawarma Guys
                    - paragraph [ref=e1308]: The owners of this food truck in the residential South Park neighborhood use Australian wagyu for the beef shawarma, which is marinated in spices overnight before it’s spit-roasted on site, and then sliced and wrapped in a grilled pita and topped with garlic paste, tahini, and pickles, or served on a plate with yellow rice and tabouli. The marbled beef used for the shawarma prevents it from getting dried out when it’s cooked on the vertical rotisserie, keeping the meat juicy. Everything is made fresh daily, from the hummus to the garlic paste. The owners recently opened their first brick-and-mortar location in La Mesa, about 20 minutes east of downtown San Diego. One might expect (or worry) that ordering food here will feel chaotic, but that’s not the case. The friendly staff is efficient at keeping the line moving. They also allow diners to call ahead for pick-up. Come here for a casual to-go lunch or dinner, and know that you're supporting a beloved local small business.
                    - link "Read Full Review" [ref=e1309] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/restaurants/san-diego/shawarma-guys
              - listitem [ref=e1310]:
                - generic [ref=e1314]:
                  - generic [ref=e1316]:
                    - generic [ref=e1317]:
                      - link "Izakaya Masa":
                        - /url: ""
                        - generic [ref=e1318] [cursor=pointer]:
                          - img "Izakaya Masa"
                    - generic [ref=e1320]: Delmo Dela Cruz
                  - generic [ref=e1321]:
                    - link "Izakaya Masa" [ref=e1322] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/restaurants/san-diego/izakaya-masa
                      - heading "Izakaya Masa" [level=3] [ref=e1323]:
                        - paragraph [ref=e1324]: Izakaya Masa
                    - paragraph [ref=e1327]:
                      - text: This tiny izakaya is pretty inconspicuous, so anyone inside is clearly in-the-know. You come for the ramen, but you stay for the small plates. Start with the Hakata ramen, a smooth tonkotsu broth layered with pork belly, fried garlic, seaweed, and ginger, before making your way to shareables like fried agedashi tofu, vegetable gyoza, and salmon
                      - emphasis [ref=e1328]: ochazuke
                      - text: (a rice-in-soup dish topped with fish). Skim the list and you'll see imported Japanese beer and vodka, though it's sake that reigns supreme. The food at this place is on point, and it has a line to show for it—but Izakaya Masa's intimate vibe and size are part of the fun, ratcheting up the experience of any date or (small) group meal with friends. More importantly, though, waiters don't circle like vultures—so you can stretch it out for as long you'd like.
                    - link "Read Full Review" [ref=e1329] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/restaurants/san-diego/izakaya-masa
            - list [ref=e1337]:
              - listitem [ref=e1338]:
                - generic [ref=e1342]:
                  - generic [ref=e1345]:
                    - link "Monello San Diego Restaurant Food":
                      - /url: ""
                      - generic [ref=e1346] [cursor=pointer]:
                        - img "Monello San Diego Restaurant Food"
                  - generic [ref=e1347]:
                    - link "Monello" [ref=e1348] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/restaurants/san-diego/monello
                      - heading "Monello" [level=3] [ref=e1349]:
                        - paragraph [ref=e1350]: Monello
                    - paragraph [ref=e1353]:
                      - text: "Although San Diego is generally known for its casual dress code and easy attitude, Monello is a place worth dressing up for. The Milanese restaurant is undoubtedly known for its cheese wheel, which they heat, melt, and toss pasta on. Divine, yes—but if you think that's indulgent, drop in on Wednesdays, when they sub out pasta for risotto. Both on the wheel and off, you're free to mix-and-match your pasta dishes, by choosing your shape (spaghetti, penne, or gnocchi) then your sauce (carbonara, cacio e pepe, and more). Pizzas are also a top option: crafted from a four-day fermented dough that makes them extra-light and crispy, they're laced with prosciutto, cremini mushrooms, balsamic figs, and other high-end toppings. Whatever you throw on there, though, just don't forget to ask for"
                      - emphasis [ref=e1354]: raspa dura
                      - text: —the shaved cheese flakes that add a grainy, subtle intensity to the pie, despite being one of the more serially overlooked items on the menu.
                    - link "Read Full Review" [ref=e1355] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/restaurants/san-diego/monello
              - listitem [ref=e1356]:
                - generic [ref=e1360]:
                  - generic [ref=e1362]:
                    - generic [ref=e1363]:
                      - link "San Diego Addison":
                        - /url: ""
                        - generic [ref=e1364] [cursor=pointer]:
                          - img "San Diego Addison"
                    - generic [ref=e1366]: Courtesy Addison
                  - generic [ref=e1367]:
                    - link "Addison" [ref=e1368] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/restaurants/san-diego/the-addison
                      - heading "Addison" [level=3] [ref=e1369]:
                        - paragraph [ref=e1370]: Addison
                    - paragraph [ref=e1373]: Addison is the pinnacle of fine dining in the region —it is the only restaurant in San Diego (and all of Southern California) to receive three Michelin stars. Chef William Bradley’s ten-course tasting menu celebrates what he calls modern “California gastronomy” with produce and herbs from local farms, fresh seafood, and flavors from different cuisines spanning from Mexico to across Asia. While the menu changes seasonally, signature dishes include a chicken liver churro appetizer with bitter chocolate, a decadent “eggs and rice” course featuring Koshihikari rice, Regiis Ova Reserve caviar, and smoked sabayon, and Bradley’s take on sweet and sour tom kha goong with king crab. Optional add-ons may include caviar or A5 wagyu for an entree. It's made for special occasions and a special trip, as the restaurant is a destination within itself. Addison will print a take-home copy of your menu and gift you with a small treat to end the night.
                    - link "Read Full Review" [ref=e1374] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/restaurants/san-diego/the-addison
            - list [ref=e1382]:
              - listitem [ref=e1383]:
                - generic [ref=e1387]:
                  - generic [ref=e1389]:
                    - generic [ref=e1390]:
                      - link "Las Cuatros Milpas San Diego Restaurants":
                        - /url: ""
                        - generic [ref=e1391] [cursor=pointer]:
                          - img "Las Cuatros Milpas San Diego Restaurants"
                    - generic [ref=e1393]: Mark Rosati
                  - generic [ref=e1394]:
                    - link "Las Cuatros Milpas" [ref=e1395] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/restaurants/san-diego/las-cuatros-milpas
                      - heading "Las Cuatros Milpas" [level=3] [ref=e1396]:
                        - paragraph [ref=e1397]: Las Cuatros Milpas
                    - paragraph [ref=e1400]: Sometimes you just need a straightforwardly delicious meal—and this is the place to get one. Customers range from workers to hipsters to tourists who've heard about the legendary tacos. Many consider this the gold standard for San Diego Mexican food. The food—at least, the few items you have to choose from—is inexpensive and authentic. Our advice? Go with the rolled tacos slathered in sour cream and cheese, or the rice and beans with chorizo, served with two flour tortillas. Whatever you get, it'll taste like your abuela made it just for you—and it'll only cost you and your dining buddy about $20 total. This is a place to take a fellow foodie, who's not opposed to long lines and bare bones decor in the name of authenticity and taste.
                    - link "Read Full Review" [ref=e1401] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/restaurants/san-diego/las-cuatros-milpas
              - listitem [ref=e1402]:
                - generic [ref=e1406]:
                  - generic [ref=e1408]:
                    - generic [ref=e1409]:
                      - link "Sushi Ota Restaurant San Diego":
                        - /url: ""
                        - generic [ref=e1410] [cursor=pointer]:
                          - img "Sushi Ota Restaurant San Diego"
                    - generic [ref=e1412]: Greg Rannells/Courtesy Sushi Ota
                  - generic [ref=e1413]:
                    - link "Sushi Ota" [ref=e1414] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/restaurants/san-diego/sushi-ota
                      - heading "Sushi Ota" [level=3] [ref=e1415]:
                        - paragraph [ref=e1416]: Sushi Ota
                    - paragraph [ref=e1419]:
                      - text: Couples young and old, groups of friends, and families with children in tow show up to this humble seafood restaurant. They're not exactly here for the ambience, but they're definitely keen on quality—and that's just what they're getting. It's a strip mall setting with a five-star menu and reservations are a must. It's packed…all the time. Order a cooked entrée if you must—there's plenty of teriyaki marinade in the kitchen—but that's really,
                      - emphasis [ref=e1420]: really
                      - text: not what you come for. It's all about the crazy fresh raw seafood. Uni, sourced straight from the San Diego docks, is their speciality, and comes served as nigiri (over rice). Other popular picks include yellowtail sashimi and
                      - emphasis [ref=e1421]: chawanmushi,
                      - text: a delicate egg custard. And if you're up for trying an
                      - emphasis [ref=e1422]: omakase
                      - text: ", this is the place to do it: the experience, which runs $140, is transformative."
                    - link "Read Full Review" [ref=e1423] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/restaurants/san-diego/sushi-ota
            - list [ref=e1431]:
              - listitem [ref=e1432]:
                - generic [ref=e1436]:
