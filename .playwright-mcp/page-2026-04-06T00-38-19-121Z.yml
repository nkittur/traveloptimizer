                      - heading "Wayfarer Bread & Pastry" [level=3] [ref=e1156]:
                        - paragraph [ref=e1157]: Wayfarer Bread & Pastry
                    - paragraph [ref=e1160]: "At first glance, you might think Wayfarer, a breezy, beachy cafe, serves up California burritos or another SoCal staple. But it's actually home to the best bread in town. Located in the upscale, yet laid-back coastal mini-'hood of Bird Rock in La Jolla, Wayfarer is a small, unassuming bakery with surfboard-shaped signage. It's casual here—flip-flops and beach clothes are more than acceptable—but we like to think naturally leavened sourdough and flaky, melt-in-your-mouth croissants are a special occasion, too. Start your day with White's fruit tarts, strawberry-pistachio croissants, berry scones, or, for something heftier, the simple, well-executed breakfast sandwich on housemade English muffins. Lunch brings sandwiches, with one or two vegetarian and non-vegetarian options apiece. If you're lucky, you can grab a pie at Wayfarer's weekly pizza night; the menu has two or three pizzas as well as a couple starter options like Marcona almonds and Castelvetrano olives. But come early: It often sells out."
