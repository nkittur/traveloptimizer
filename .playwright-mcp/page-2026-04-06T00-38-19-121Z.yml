                      - heading "Cesarina" [level=3] [ref=e869]:
                        - paragraph [ref=e870]: Cesarina
                    - paragraph [ref=e873]: Owned by couple Niccolò Angius and Cesarina Mezzoni, this fun and light-hearted trattoria in Point Loma serves up housemade pastas, build-your-own negronis, and tiramisu prepared tableside. All the pastas are made in-house, including in less-common and fun shapes like mafalde, lumache, paccheri, and gemelli. You could go for one of the specialties, such as the Paccheri Vodka and Scampi, where pasta in a creamy vodka sauce is topped with a whole langoustine, or select your own pasta and sauce and top it with cured guanciale, beef meatballs, mozzarella, or ricotta. Diners who need vegan options will find plenty to choose from here, and the restaurant also offers gluten-free spaghetti and penne. It’s relaxed and pleasant here. Waitstaff, food runners, and managers often greet customers with Italian terms of endearment. Go for the convivial dining experience, quality housemade pastas, and fun cocktails for lunch or an evening out.
