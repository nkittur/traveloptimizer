                      - heading "Seréa Coastal Cuisine" [level=3] [ref=e1215]:
                        - paragraph [ref=e1216]: Seréa Coastal Cuisine
                    - paragraph [ref=e1219]:
                      - text: Serẽa is laid-back luxury at its best. Located in the historic
                      - link "Hotel del Coronado" [ref=e1220] [cursor=pointer]:
                        - /url: https://www.cntraveler.com/hotels/united-states/coronado/hotel-del-coronado
                      - text: ", the seafood restaurant mimics the upscale beach vibes of its surroundings. Executive chef and partner JoJo Ruiz was an early practitioner of sustainable seafood cooking and his ethos is clear in Serẽa's menu, which puts a Mediterranean spin on thoughtfully sourced fish, lobster, and meats from local purveyors like Tuna Harbor Dockside Market and Catalina Offshore Products. Get the smoked and seared tuna, charcoal-grilled octopus, and—for a real San Diego specialty—the local catch ceviche with cucumber, lime, avocado, and coconut. For a side of education with dinner you can also choose a whole fish from the fresh fish display, have it deboned tableside and prepared over an open fire while learning about the environmental importance of sustainable seafood. You are in San Diego's most famous hotel, and the service at its most upscale restaurant is five-stars all the way."
                    - link "Read Full Review" [ref=e1221] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/restaurants/coronado/serea-coastal-cuisine
