                      - heading "Mister A's" [level=3] [ref=e988]:
                        - paragraph [ref=e989]: Mister A's
                    - paragraph [ref=e992]:
                      - text: "It's always adult swim here—this is where the well-heeled grown-ups linger over their caviar for at least a few hours. To wit: Mister A's requests business casual attire (collared shirts and closed-toe shoes for men)"
                      - emphasis [ref=e993]: before
                      - text: 4:00 p.m. On any given night, you'll find cuisine with French touches like rack of lamb Provençal, or king salmon “Wellington” with béarnaise and duxelles with foraged mushrooms, along with caviar, house-baked baguettes with whipped French butter, and a Maine lobster strudel in cognac sauce. A personalized chef’s tasting menu of four to seven courses can be ordered ahead for a weeknight visit. There are a decent number of gluten-free options, but vegetarians will have to stick to salads and pastas. The menu (and the place, in general) loosens up a little during brunch on the weekends. Of course, there are fancy options—see the escargot in garlic-herb butter—but there are also lower-maintenance staples, including croque madame sandwiches and omelettes.
