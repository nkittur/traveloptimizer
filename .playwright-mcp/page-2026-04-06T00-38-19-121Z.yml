                      - heading "Wolf in the Woods" [level=3] [ref=e1040]:
                        - paragraph [ref=e1041]: Wolf in the Woods
                    - paragraph [ref=e1044]: "This cozy bistro is tucked in a blink-and-you-might-miss-it shop in a residential neighborhood. The menu comprises tapas and plates meant to be shared. Larger plates, including tender Spanish octopus in a spicy harissa and carne adovada–braised pork shoulder in a rich red sauce and served with fry bread–are highlights. New Mexico’s prized Hatch chile appears in a variety of snacks and dishes: in a crema dip for freshly fried potato chips, roasted and atop a grass-fed beef burger, and in fritters accompanying the flavorful corn and piñon (pine nut) soup. New Mexican cuisine is not easy to find in San Diego, and Wolf in the Woods offers an interesting take on the state’s cooking traditions. The restaurant is off the beaten path of the city’s tourist locales and an excellent choice for a romantic or cozy evening."
