                    - link "Morning Glory" [ref=e390] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/restaurants/san-diego/morning-glory
                      - heading "Morning Glory" [level=3] [ref=e391]:
                        - paragraph [ref=e392]: Morning Glory
                    - paragraph [ref=e395]: Morning Glory's design hits you with a checklist of Instagram hits—rose-gold accents, tiled floors, Millennial-pink booths, wallpaper galore, and a few rock 'n roll touches like skulls. It's hard to know where to look; thankfully, you'll have plenty of time to take it all in because there's usually a wait, particularly on Saturday mornings. Prolific San Diego restaurant group CH Projects cook up morning rituals from across the globe. There's ginger fried rice, a khachapuri from Georgia, a gourmet take on the egg salad sandwich from 7-Eleven in Japan, and souffle pancakes. There are also coffee and espresso drinks, turmeric lattes served in glass goblets, and a lineup of unique hot chocolates (strawberries with cream, maple cinnamon) available as flights. But the day-drinking menu of low-ABV cocktails is the centerpiece. Try a fizzy refresher like the Morning Glory Spritz, made with grapefruit-infused contratto and sparkling wine.
                    - link "Read Full Review" [ref=e396] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/restaurants/san-diego/morning-glory
