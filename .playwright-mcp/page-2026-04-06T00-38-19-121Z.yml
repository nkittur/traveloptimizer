                      - heading "Buona Forchetta" [level=3] [ref=e1102]:
                        - paragraph [ref=e1103]: Buona Forchetta
                    - paragraph [ref=e1106]: Buona Forchetta is all about pizza—Neapolitan-style, specifically—with blistered crusts, San Marzano tomato sauce, and five-star olive oil (Italian-born owner Matteo Cattaneo hails from a line of olive oil producers, and ships in his family's liquid gold by the barrel). Pies are simple, allowing high-quality ingredients like fresh buffalo mozzarella, basil, and the much-beloved spicy salami to shine. With pizza this good, it's hard to consider other items—but we'd still recommend the polpettine and focaccia. Grab a seat on their oft-packed patio, illuminated by string lights and filled with leafy trees, and soak in the warm California night while you wait. No matter the day, there's a buzzing, festive spirit here, which makes Buona a popular place for birthdays and large group meals. If you want a quieter, more subdued vibe, make plans to come on the earlier side, or during lunch.
                    - link "Read Full Review" [ref=e1107] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/restaurants/san-diego/san-diego/buona-forchetta
