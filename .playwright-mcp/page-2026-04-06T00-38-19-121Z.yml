                      - heading "Soichi Sushi" [level=3] [ref=e653]:
                        - paragraph [ref=e654]: Soichi Sushi
                    - paragraph [ref=e657]: From the outside, this unassuming restaurant near Old Trolley Barn Park in University Heights could be mistaken for a casual izakaya, but it’s the only Michelin-starred sushi restaurant in San Diego. There are three set omakase options, from a petite version with three small bites, six pieces of nigiri, and dessert, to the full omakase with 12 pieces of sushi, plus hot and cold appetizers. We recommend arriving hungry and ordering the full omakase to try the breadth of dishes available, including a savory chawanmushi (steamed egg custard with dashi broth), seasonal bites ranging from a raw oyster to fried mackerel and tofu, and shirumono, a clear fish soup. For sushi and sashimi, options may include cuts of fatty toro, hirame (halibut) cured in seaweed, chrome-skinned slices of gizzard shad marinated in the chef’s special vinegar blend, and lightly seared kinmedai (snapper). The high-quality seafood from Japan coupled with Chef Soichi Kadoya ’s jovial service provides an intimate and fun dining experience.
