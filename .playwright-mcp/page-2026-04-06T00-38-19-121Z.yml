                  - generic [ref=e1441]:
                    - link "Valle" [ref=e1442] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/restaurants/oceanside/valle
                      - heading "Valle" [level=3] [ref=e1443]:
                        - paragraph [ref=e1444]: Valle
                    - paragraph [ref=e1447]:
                      - text: This restaurant is on the first floor of the Mission Pacific Beach Resort in Oceanside, which is right across the street from the city’s scenic pier and has prime views of the sea and setting sun. The eight-course tasting menu showcases Chef Roberto Alcocer’s skill and love of Baja California’s ingredients from land and sea, as well as the cuisines of Mexico’s Puebla and Oaxaca regions. A botana, or snack, may include an “oyster” shot of kombu and wakame gelee with sea beans that has a pleasantly briny aftertaste. Courses such as a pitch-black charred onion tart with mole and topped with caviar, and a
                      - emphasis [ref=e1448]: tetela
                      - text: (a corn tortilla folded into a triangle) stuffed with chicharron, will get your appetite ready for the braised lamb barbacoa with homemade corn tortillas. A more exclusive chef’s table experience offers a front-row seat to the inner workings of the kitchen with a view of the pass.
                    - link "Read Full Review" [ref=e1449] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/restaurants/oceanside/valle
