                      - heading "Campfire" [level=3] [ref=e634]:
                        - paragraph [ref=e635]: Campfire
                    - paragraph [ref=e638]: "With a name like Campfire, it's no surprise the decor trends toward the woodsy: a mountain motif lines one wall, while camping tchotchkes stock shelves. But don't mistake any of that for kitsch at this casual Carlsbad spot—it's über-stylish in its own Mid-century-meets-California way, and laid-back, thanks to the local surf culture. The vibe is relaxed, and you may end up in a communal dining situation—so it's best for groups. Bland camp weenies there are none. Most dishes are shareable, and smoked, grilled, or roasted, a nod to the restaurant's name. Oysters are cooked over coals and served with smoked oxtail dashii; roasted broccoli is dressed in chermoula; and the can't-miss aged ribeye is served with fermented Fresno chile chimmichuri. Lest you think the dessert menu seems a bit much with its grilled strawberry toast with olive oil and tarragon, direct your eyes to the very bottom, where it says: \"Yes, we have s'mores.\" Crisis, averted."
