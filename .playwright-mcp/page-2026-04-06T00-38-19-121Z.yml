                    - link "George's at the Cove" [ref=e1276] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/restaurants/san-diego/california-modern
                      - heading "George's at the Cove" [level=3] [ref=e1277]:
                        - paragraph [ref=e1278]: George's at the Cove
                    - paragraph [ref=e1281]: The three-tier restaurant concept overlooking scenic La Jolla Cove is entering its fourth decade as a landmark in the seaside town. It includes the Ocean Terrace, an alfresco rooftop lounge, and the buzzy Level2 cocktail bar. Chef Trey Foshee has long been a pioneer of farm-to-table cuisine in San Diego, and this menu is proof of his commitment. Highlights include perfectly-charred octopus with green romesco, seared locally caught yellowtail, and a pork chop with grilled plums. At lunch time, Foshee's rockfish tacos are a must-try. Service is friendly and efficient. If you want a table along the glass wall with the best views, you’ll need to choose the “premium seating” option when making the reservation. This is a tried-and-true spot for ocean view dining and admiring the scenery, or capping off the day with a cocktail at sunset.
                    - link "Read Full Review" [ref=e1282] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/restaurants/san-diego/california-modern
