                      - heading "Kingfisher" [level=3] [ref=e929]:
                        - paragraph [ref=e930]: Kingfisher
                    - paragraph [ref=e933]: This modern Vietnamese restaurant in the Golden Hill neighborhood near the south end of Balboa Park incorporates the sauces, flavors, and fragrant herbs that are the bedrock of the cuisine and presents them in new and fun ways in both the cocktail and food menus. Crispy chicken wings are glazed in tamarind and served with a toasted coconut ranch sauce, a Thompson Heritage Farms pork chop is accompanied with a nước chấm broth, rice noodles, and lettuce, and an impressive dry-aged and smoked duck with XO sauce consistently sells out during the night. Kingfisher has been popular with locals since it opened, and it attracts a younger crowd. The cocktails are light and refreshing, and pair well with the food. Their spin on a mule includes tequila blanco instead of vodka, Earl Grey tea, galangal root, and lime, and is served with a sesame leaf. The Saigon Moped with gin, bitter melon, lime, and salt is another popular choice.
