                      - /url: https://www.cntraveler.com/restaurants/san-diego/rare-society
                      - heading "Rare Society" [level=3] [ref=e488]:
                        - paragraph [ref=e489]: Rare Society
                    - paragraph [ref=e492]: "Rare Society is a retro-glam steakhouse that has the cozy feeling of a neighborhood eatery. Its flagship location opened just a few minutes north of Balboa Park and the San Diego Zoo, and the restaurant has since expanded north to Solana Beach and outside of San Diego. Think indulgent steak dinners and seafood in an unpretentious environment: there’s dry-aged cuts (the ribeye is a crowd pleaser), and wagyu from Durham Ranch. Order one of the entree boards (the chef selects a variety of steak cuts and presents them for sharing), or stop in for happy hour on the outside deck. Each board comes with a variety of house-made steak sauce, salsa, bearnaise and roasted bone marrow. Although it’s a steakhouse, it’s not strictly formal—diners can come as they are, whether that’s dressed for a night out or casually in jeans."
