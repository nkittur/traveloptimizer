                  - paragraph [ref=e1344]:
                    - text: Also in 2026,
                    - link "Tube Factory" [ref=e1345] [cursor=pointer]:
                      - /url: https://www.bigcar.org/tube/
                    - text: ", an artist-run contemporary art museum and community center, will quadruple its footprint with a new, 40,000-square-foot space in a 125-year-old former dairy barn, allowing it to offer even more free programming, performances, and cultural collaborations. Alongside it, the"
                    - link "Factory Arts District" [ref=e1346] [cursor=pointer]:
                      - /url: https://www.factoryartsdistrict.com/
                    - text: ", Indy's largest community of artists, is growing into a powerhouse destination for art, entertainment, and great souvenir shopping too. Among the new openings there are"
                    - link "Daisy Bar" [ref=e1347] [cursor=pointer]:
                      - /url: https://www.instagram.com/daisybarindy/?hl=en
                    - text: (a casual but energetic complement to those who love daytime dining stalwart
                    - link "Milktooth" [ref=e1348] [cursor=pointer]:
                      - /url: https://milktoothindy.com/
                    - text: ),
                    - link "MVMT House" [ref=e1349] [cursor=pointer]:
                      - /url: https://www.mvmthouseindy.com/
                    - text: pilates studio, and
                    - link "Salt & Ash" [ref=e1350] [cursor=pointer]:
                      - /url: https://saltandashsoap.com/pages/store
                    - text: market for locally made gifts.
                    - link "First Friday art walks" [ref=e1351] [cursor=pointer]:
                      - /url: https://www.instagram.com/p/DG3OFNmJ2LZ/?hl=en
                    - text: ", where you can enjoy live music, dancing, and interactive workshops, are always a fun time here as well."
                  - paragraph [ref=e1352]:
                    - strong [ref=e1353]: "How to plan it:"
                    - text: You can fly to Indianapolis from every major US airport, and in even better news, IND has been named the
                    - link "best airport in North America" [ref=e1354] [cursor=pointer]:
                      - /url: https://www.ind.com/about/media/media-releases/world-class-customer-experience-keeps-indy-airport-at-no-1
                    - text: for 13 consecutive years by the Airports Council International. May through October is the best time of year to visit to enjoy outdoor activities. Stay at the new
                    - link "InterContinental Indianapolis" [ref=e1355] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/hotels/indianapolis/intercontinental-indianapolis-by-ihg
                    - text: on Mile Square, which opened in February after a $120 million restoration of the
                    - link "100-year-old landmark" [ref=e1356] [cursor=pointer]:
                      - /url: https://digital.library.in.gov/Record/ISL_p16066coll13-2600
                    - text: Illinois Building, or the boutique
                    - link "Bottleworks Hotel" [ref=e1357] [cursor=pointer]:
                      - /url: https://www.bottleworkshotel.com
                    - text: ", in a former Coca-Cola bottling plant. A new Kimpton hotel and an 800-room, skyline-changing Signia by Hilton are throwing their doors open in late 2026 as well. —"
                    - link "Amber Gibson" [ref=e1358] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/contributor/amber-gibson
                      - emphasis [ref=e1359]: Amber Gibson
