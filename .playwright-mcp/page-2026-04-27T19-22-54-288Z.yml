                    - strong [ref=e968]: "How to plan it:"
                    - text: Chicago has two airports, Chicago O’Hare International Airport (ORD) and Midway International Airport (MDW), and all major airlines fly into one or both airports. Each airport is located on a Chicago Transit Authority line, so you can easily get downtown. Most
                    - link "hotels" [ref=e969] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/gallery/best-hotels-in-chicago
                    - text: are located in The Loop or River North. Stay at the Jeanne Gang–designed
                    - link "St. Regis Chicago" [ref=e970] [cursor=pointer]:
