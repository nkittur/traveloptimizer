                  - heading "East Tennessee" [level=2] [ref=e1103]
                  - paragraph [ref=e1105]:
                    - emphasis [ref=e1106]:
                      - strong [ref=e1107]: "Go for:"
                      - text: classic Appalachia, refreshed and revamped
                  - figure [ref=e1109]:
                    - generic [ref=e1112]:
                      - img "Blackberry Farm exterior stay shot"
                    - generic [ref=e1113]: Blackberry Farm
                  - paragraph [ref=e1114]:
                    - text: Tennessee’s cultural cachet doesn’t just stop at
                    - link "Nashville" [ref=e1115] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/destinations/nashville
                    - text: ’s honky-tonks and bachelorette parties or Memphis’s blues and barbecue. A relatively unsung region of the state, East Tennessee has recently come into its own in the arts, outdoor adventure, and hospitality on the whole. In 2026, the 230th anniversary of the Volunteer State’s founding, visitors will be right on time to catch the crest of East Tennessee’s renaissance.
                  - paragraph [ref=e1116]:
                    - text: Long celebrated for its fall foliage, the region is home to the
                    - link "Great Smoky Mountains National Park" [ref=e1117] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/gallery/where-to-stay-great-smoky-mountains-national-park
                    - text: ", one of the 26"
                    - link "UNESCO World Heritage Sites" [ref=e1118] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/story/new-unesco-world-heritage-sites-for-2025
                    - text: recognized in the United States. By and large the most visited park in the US system, the Smokies have averaged nearly 12 million annual visitors for the last decade, thanks to a small parking fee, a middle-earth beauty, and a
                    - link "spectrum of hikes" [ref=e1119] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/gallery/the-best-hikes-in-the-us
                    - text: that can accommodate leisurely sightseers and aspiring Davy Crocketts alike. The call of the Smokies grows even louder in 2026, when two major trails are coming back after a series of closures and renovations. At the start of the year, set foot on Bullhead Trail, a moderately challenging route that feeds into the legendary hike to Mount LeConte, before rehabilitation work resumes in May 2026. For a more casual tour through the mountains, plan your visit for July 2026, when the 2.6-mile Laurel Falls Trail is slated to reopen after 18 months of rehabilitation work, reuniting 300,000-plus visitors with its cooling mist just in time for the summer. Outside the park the gloriously over-the-top
                    - link "Bonnaroo Music & Arts Festival" [ref=e1120] [cursor=pointer]:
                      - /url: https://www.bonnaroo.com/
                    - text: "returns in June 2026 after severe weather canceled the festival in 2025. For fun the whole family can enjoy, head to Dolly Parton’s Dollywood Parks & Resorts in Pigeon Forge, Tennessee: Spring 2026 sees the debut of the park’s most Smoky Mountains–inspired attraction yet: the $50 million"
                    - link "NightFlight Expedition" [ref=e1121] [cursor=pointer]:
                      - /url: https://www.dollywood.com/themepark/rides/nightflight-expedition/
                    - text: ", which pays homage to the epic shows of bioluminescence put on by the Smokies' synchronous fireflies every summer."
