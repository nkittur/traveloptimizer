                    - strong [ref=e1483]: "How to plan it:"
                    - text: Major carriers including Hawaiian Airlines, Delta, United, and American fly directly into Honolulu’s Daniel K. Inouye International Airport (HNL) from across North America. From there, Waikiki is no more than an hour’s drive; rideshares and taxis are plentiful, though renting a car gives you flexibility for day trips up to the North Shore or out to the windward coast. Anchor your stay at the freshly renovated
                    - link "Moana Surfrider" [ref=e1484] [cursor=pointer]:
                      - /url: https://www.marriott.com/en-us/hotels/hnlwi-moana-surfrider-a-westin-resort-and-spa-waikiki-beach/overview/
                    - text: in Waikiki for its classic, columned architecture and modern polish. For something a little gentler on the wallet, there are smaller, youthful boutique options too, including
                    - link "Kaimana Beach Hotel" [ref=e1485] [cursor=pointer]:
                      - /url: https://www.kaimana.com/
                    - text: and the new
                    - link "Romer House Waikiki" [ref=e1486] [cursor=pointer]:
                      - /url: https://www.romerhotels.com/romer-house-waikiki
                    - text: . To have the ultimate surfing experience, time your visit when the World Surf League finale returns to Pipeline from December 8 to 20, 2026.
                    - emphasis [ref=e1487]:
                      - text: —
                      - link "John Wogan" [ref=e1488] [cursor=pointer]:
