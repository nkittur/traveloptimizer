                  - heading "Oahu" [level=2] [ref=e1366]
                  - paragraph [ref=e1368]:
                    - emphasis [ref=e1369]:
                      - strong [ref=e1370]: "Go for:"
                      - text: a new embrace of Hawaiian culture, a major surf moment, and urban openings
                  - figure [ref=e1372]:
                    - generic [ref=e1375]:
                      - img "Waikiki's storied Moana Surfrider hotel has undergone a stunning renovation in time for its 125th birthday this year..."
                    - paragraph [ref=e1378]: Waikiki's storied Moana Surfrider hotel (above) has undergone a stunning renovation in time for its 125th birthday this year, and is the perfect home base from which to explore the buzzing island of O'ahu.
                  - paragraph [ref=e1379]:
                    - text: It’s been more than a century since Waikiki’s
                    - link "Moana Surfrider" [ref=e1380] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/hotels/united-states/honolulu/moana-surfrider-waikiki-beach
                    - text: first opened its white-columned doors to travelers chasing the South Pacific dream, and in March 2026, to celebrate its 125th birthday, the “First Lady of Waikiki” will emerge from a major renovation that preserves its Victorian bones while layering in new, design-forward details. The milestone is just one reason the
                    - link "Hawaiian island" [ref=e1381] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/story/best-island-to-visit-in-hawaii-for-every-type-of-traveler
                    - text: of
                    - link "Oahu" [ref=e1382] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/story/the-best-places-to-eat-in-oahu-according-to-chef-sean-sherman
                    - text: (home to its capital and most populous city,
                    - link "Honolulu" [ref=e1383] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/story/honolulus-chinatown-is-the-creative-heart-of-urban-hawaii
                    - text: ) feels particularly of the moment, as it leans into a cultural resurgence that celebrates its heritage without slipping (too much, anyway) into kitsch. Other reasons to visit? Cirque du Soleil’s
                    - link "ʻAuana" [ref=e1384] [cursor=pointer]:
                      - /url: https://cna.st/affiliate-
                      - emphasis [ref=e1385]: ʻAuana
                    - text: residency at the
                    - link "Outrigger Waikiki Beachcomber Hotel" [ref=e1386] [cursor=pointer]:
                      - /url: https://www.outrigger.com/hawaii/oahu/outrigger-waikiki-beachcomber-hotel
                    - text: ", an only-in-Hawaii performance that blends the company’s theatrical spectacle with a hula lineage fitting its location (it debuted in December 2024 and will run through 2026). Up the coast, on the North Shore, professional surfing marks its 50th anniversary in December 2026, when the"
                    - link "World Surf League" [ref=e1387] [cursor=pointer]:
                      - /url: https://www.worldsurfleague.com/
                    - text: "final returns to the sport’s holy ground of Banzai Pipeline, where its history and mythos converge on one stretch of reef. Meanwhile, downtown Honolulu is buzzing: The"
                    - link "Hawaii Theatre Center" [ref=e1388] [cursor=pointer]:
                      - /url: https://www.hawaiitheatre.com/
                    - text: which celebrated 100 years in 2022, continues with its island-inspired concerts, retro cinema nights, and other entertainment. And new nightlife spots like
                    - link "EP Bar," [ref=e1389] [cursor=pointer]:
                      - /url: https://www.epbar.co/
                    - text: with its 3,000-strong vinyl library, and
                    - link "Yours Truly" [ref=e1390] [cursor=pointer]:
                      - /url: https://www.yourstrulyhawaii.com/
                    - text: ", a subterranean speakeasy hidden beneath a faux post office, channel Japanese hi-fi culture and Prohibition-era discretion, respectively. In short, Oahu in 2026 is set to usher in a new era for the island, one that offers a compelling experience for any kind of traveler."
