                    - generic [ref=e1244]:
                      - paragraph [ref=e1246]: A historic cleanup effort has made Indianapolis's White River accessible for kayakers and canoers, offering a new way to experience the ever-expanding green spaces of the Midwestern metropolis.
                      - text: Visit Indy
                  - paragraph [ref=e1247]:
                    - text: Long known as a walkable and bike-friendly city,
                    - link "Indianapolis" [ref=e1248] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/story/where-to-eat-stay-and-play-in-indianapolis
                    - text: takes its outdoorsy reputation further in 2026 with the rollout of 38 miles of brand-new trails and bike lanes, which will tie into the city’s existing 77-mile trail network and offer increased connectivity across central Indiana. Collectively, these trails will see improved navigability thanks to a new
                    - link "Trailways" [ref=e1249] [cursor=pointer]:
                      - /url: https://thetrailways.com/
                    - text: website, which includes digital mapping assets, as well as a new, quarter-mile glow-in-the-dark trail for night rides.
                  - paragraph [ref=e1250]:
                    - text: The city’s footprint is growing too, with a 15-acre expansion of
                    - link "White River State Park" [ref=e1251] [cursor=pointer]:
                      - /url: https://whiteriverstatepark.org/extension/
                    - text: heading toward completion in July 2026 and the opening of Henry Street Bridge, a new gateway into the city from the underserved west side, by the end of the year, which will be marked by a striking design that includes massive rings over the bridge that light up at night. This new pedestrian and vehicular overpass crosses White River, where you can now enjoy paddleboarding, kayaking, and canoeing after what has been roughly half a century of river cleanup, making Indy America’s newest river city. Book a guided tour with or rent equipment from
                    - link "Frank's Paddlesports Livery" [ref=e1252] [cursor=pointer]:
                      - /url: https://www.frankslivery.com/
                    - text: to explore the city by water.
