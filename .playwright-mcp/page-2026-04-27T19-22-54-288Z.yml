                  - heading "Chicago" [level=2] [ref=e852]
                  - paragraph [ref=e854]:
                    - emphasis [ref=e855]:
                      - strong [ref=e856]: "Go for:"
                      - text: the opening of the Obama presidential library, jazz, and great dining
                  - figure [ref=e858]:
                    - generic [ref=e861]:
                      - img "Herbie Hancock Performs During The La Dfense Jazz Festival At Parvis De La Dfense In Puteaux"
                    - generic [ref=e862]:
                      - paragraph [ref=e864]: Chicago will host the UNESCO International Jazz Day for the first time this year, which will feature performances by hometown jazz legend Herbie Hancock (above).
                      - text: Getty
                  - paragraph [ref=e865]:
                    - text: Spring is a beautiful time to visit
                    - link "Chicago" [ref=e866] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/destinations/chicago
                    - text: (once the blustery chill has receded, at least), and spring 2026 is poised to be a big one for the city. After years of delays
                    - link "The Obama Presidential Center" [ref=e867] [cursor=pointer]:
                      - /url: https://www.obama.org/presidential-center/
                    - text: ", former president Barack Obama’s presidential library, is slated to open in Jackson Park. The second presidential library in Illinois (you’ll also find Abraham Lincoln’s located downstate, in Springfield), the Obama campus won’t just house the president’s papers—it’ll bring a variety of cultural offerings to the Woodlawn neighborhood, near Obama’s old stomping grounds of"
                    - link "Hyde Park" [ref=e868] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/story/what-to-do-in-hyde-park-chicago
                    - text: . The center will span 19.3 acres to include a museum, installations from such artists as Nick Cave, a community fruit and vegetable garden, and the John Lewis Plaza, which will host events like outdoor music performances and festivals.
                  - paragraph [ref=e869]:
                    - text: Spring is also a good time for jazz lovers to visit, as the city will host the 15th annual UNESCO
                    - link "2026 International Jazz Day" [ref=e870] [cursor=pointer]:
                      - /url: https://cna.st/affiliate-link/252UdZcajgSFKNQtumEptt12gsWx14abFexDicVgU9cvrSP4TXUGsu1orNGVBvTXTWhfMbiRWNnZb1HTaoCi3w2pFGmX9DfduqVLnUAUBRcBPnpg1eXirWebgrimNdHBkDsSBgNG155DccS6X1Fwrt1KQYigorQjtxSpcCqeGbETmWoe7W6HxwxSEU9YaRK3s5pCYLJFUeUSh886rBAbkxRYUHqQdVXM6Pqsa7jdW9XmYeUeL4zGko5TE7TbZ8qfyFmuX1YFK2XPhNkrv2z6AEC7AAzwRP
                    - text: "for the first time in April. The festivities include the All-Star Global Concert, led by Chicago-born jazz legend Herbie Hancock, as well as concerts and talks around the city. The city’s dining scene is thriving too: Among the fresh newcomers are the French-Midwestern bistro"
                    - link "Creepies" [ref=e871] [cursor=pointer]:
                      - /url: https://cna.st/affiliate-
                    - text: and the sourcing-obsessed fine dining spot
                    - link "Feld" [ref=e872] [cursor=pointer]:
                      - /url: https://cna.st/affiliate-
                    - text: ", along with two newly minted James Beard Award–winning establishments. Visit"
                    - link "Kumiko" [ref=e873] [cursor=pointer]:
                      - /url: https://barkumiko.com/
                    - text: ", the winner for Outstanding Bar, to try Julia Momosé’s Japanese-influenced cocktails, like the standout ume boulevardier, which gets a fruity note from Japanese plum liqueur, and"
                    - link "Oriole" [ref=e874] [cursor=pointer]:
                      - /url: https://cna.st/affiliate-
                    - text: ", a refined two-Michelin-starred restaurant helmed by Noah Sandoval, who was named Best Chef: Great Lakes. And if you’re planning to road-trip along Route 66 for its 100th anniversary, spend a few days exploring the city before heading out—the route begins in downtown Chicago right by"
                    - link "Lou Mitchell’s" [ref=e875] [cursor=pointer]:
                      - /url: https://cna.st/affiliate-
                    - text: ", a classic diner that opened in 1923. Dig into a malted pecan and bacon waffle before hitting the road."
