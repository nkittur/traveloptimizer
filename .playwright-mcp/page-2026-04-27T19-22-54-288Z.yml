                    - strong [ref=e446]: "How to plan it:"
                    - text: Boston Logan International Airport is something of an unsung hero. It may not have the soaring atria of the Middle East’s grand hubs or the local character of, say, Savannah/Hilton Head International Airport, but, much like Boston writ large, what Logan lacks in warm overtures or gimmicks, it amply makes up for with efficiency. Outside of rush hour, you can hop in a cab (or the Logan Express bus, which is free for this route) and be in the heart of Back Bay in between 15-30 minutes—and that can be the last time you use a car for your entire stay. This is one of America’s great walking cities, but an ongoing series of updates to the beloved yet historically less-than-perfect T rail system have made getting around easier than ever. Plant yourself at the
                    - link "Four Seasons Hotel Boston" [ref=e447] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/hotels/boston/four-seasons-hotel-boston
                    - strong [ref=e448]: ","
                    - text: the
                    - link "Newbury" [ref=e449] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/hotels/boston/the-newbury-boston
                    - text: Boston, or the
                    - link "Whitney" [ref=e450] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/hotels/the-whitney-hotel
                    - text: Hotel—all fabulous, all ideally located—and you’ll be strolling down brick sidewalks and falling for Boston’s local charms in no time. —
                    - link "Todd Plummer" [ref=e451] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/contributor/todd-plummer
