                  - paragraph [ref=e1213]:
                    - text: Beyond the outdoors, East Tennessee kitchens have been waiting for the inaugural
                    - link "Michelin Guide to the South" [ref=e1214] [cursor=pointer]:
                      - /url: http://guide.michelin.com/us/en/article/news-and-views/michelin-guide-alabama-mississippi-louisiana-tennessee-north-south-carolina-atlanta
                    - text: ", which came out November 3. But such pioneers in farm-to-table dining as"
                    - link "Blackberry Farm" [ref=e1215] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/hotels/walland/blackberry-farm
                    - text: in Walland, Dancing Bear Lodge & Appalachian Bistro in Townsend, and The
                    - link "Walnut Kitchen" [ref=e1216] [cursor=pointer]:
                      - /url: https://thewalnutkitchen.com/
                    - text: "in Maryville have long drawn gourmands. Rising to meet the occasion are a batch of new hotels:"
                    - link "Dollywood's HeartSong Lodge & Resort" [ref=e1217] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/story/dolly-parton-hotel-heartsong-lodge-resort
                    - text: opened in late 2023 and
                    - link "Hotel Indigo Gatlinburg by IHG" [ref=e1218] [cursor=pointer]:
                      - /url: https://cna.st/affiliate-
                    - text: began welcoming guests in September 2025. The historic Andrew Johnson Building in Knoxville is set to complete its renovations by the end of 2026. It will mark the return of the storied high-rise touted as “the long-sought missing link between Hank Williams, Amelia Earhart, and Jean-Paul Sartre,” nodding to a small sample of the historic hotel’s impressive roster of past guests. Joining the new
                    - link "Tempo by Hilton in Pigeon Forge" [ref=e1219] [cursor=pointer]:
                      - /url: https://cna.st/affiliate-
                    - text: ", which opened in October, will be Knoxville’s own Tempo by Hilton, debuting in fall 2026, as well as an AC Hotel by Marriott later in winter, which will expand the city’s portfolio of upscale accommodations."
                  - paragraph [ref=e1220]:
                    - strong [ref=e1221]: How to plan it
                    - text: ": Fly into McGhee Tyson Airport (TYS) in Alcoa, Tennessee, for central access to East Tennessee's highlights. The airport is a 30-minute drive from Knoxville and 80 minutes from Gatlinburg. Allegiant Air, American Airlines, Delta Airlines, Frontier Airlines, and United Airlines all have service to TYS. If you're opting to drive, I-40 and I-75 run through Knoxville. Those looking to directly visit the Smokies can continue on I-40 or I-75 before getting off at state highways to enter the park via the Gatlinburg or Townsend, Tennessee, entrances."
