                  - paragraph [ref=e1797]:
                    - text: Sacramento may be
                    - link "California" [ref=e1798] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/tag/california
                    - text: ’s capital, but its real power sits in the soil. With its 1.5 million acres of farms and ranches that grow more than 160 crops, the region has been an agricultural powerhouse for over a century. That abundance fuels restaurants where menus shift constantly and farm-to-fork isn’t a slogan but a way of life. You taste it at
                    - link "Midtown Farmers Market" [ref=e1799] [cursor=pointer]:
                      - /url: https://exploremidtown.org/midtown-markets/
                    - text: ", where the stalls stretch for blocks ("
                    - link "American Farmland Trust" [ref=e1800] [cursor=pointer]:
                      - /url: https://farmland.org/no-farms-no-food/
                    - text: ranked this the best farmers market in California, and the third best in the nation).
                  - paragraph [ref=e1801]:
                    - text: Decades of agricultural heritage have spurred on a dining culture that celebrates the region’s bounty year-round. In 2025, Sacramento hosted the Michelin Guide California Awards, where
                    - link "Localis" [ref=e1802] [cursor=pointer]:
                      - /url: https://localissacramento.com/
                    - text: and
                    - link "The Kitchen" [ref=e1803] [cursor=pointer]:
                      - /url: https://thekitchenrestaurant.com/
                    - text: retained their stars,
                    - link "Pho Momma" [ref=e1804] [cursor=pointer]:
                      - /url: https://phomomma.com/
                    - text: earned a Bib Gourmand, and
                    - link "Kin Thai" [ref=e1805] [cursor=pointer]:
                      - /url: https://www.kinthaieatery.com/
                    - text: and
                    - link "Majka Pizzeria" [ref=e1806] [cursor=pointer]:
                      - /url: https://www.majkabakes.com/
                    - text: were added to the guide. Also in 2025,
                    - link "Terra Madre Americas" [ref=e1807] [cursor=pointer]:
                      - /url: https://terramadreusa.com/
                    - text: ", the global slow-food summit, chose Sacramento for its first US edition, recognizing the region’s fertile landscape and leadership in connecting chefs and farmers. The event drew chefs including Alice Waters, Jeremiah Tower, and Elizabeth Falkner, and will return every two years through 2035."
                  - paragraph [ref=e1808]:
                    - text: Also worth planning around is the
                    - link "Tower Bridge Dinner" [ref=e1809] [cursor=pointer]:
                      - /url: https://www.visitsacramento.com/towerbridgedinner/
                    - text: ", which sets long communal tables on the bridge that spans the Sacramento River and hosts more than 800 guests—the event is the crown jewel of the city’s Farm-to-Fork Festival (the 2026 event will likely take place in September). In spring 2026,"
                    - link "Our Street Night Market" [ref=e1810] [cursor=pointer]:
                      - /url: https://www.ourstreetnightmarket.com/
                    - text: will take over several blocks of the R Street corridor with street food, music, and late-night crowds. Founded in 2018 and inspired by the night markets of Asia, it has grown into one of the largest in the country; it spotlights both beloved mom-and-pop restaurants and chefs experimenting with new ideas.
                  - paragraph [ref=e1811]:
                    - text: "In 2026 it’ll also be easier to get to the city: Sacramento International Airport will open the first phases of its $1.3 billion renovation; the Terminal A expansion is expected by 2027, and will bring a new parking garage, more gates, and refreshed dining options from local favorites Magpie, Temple Coffee, and Nixtaco. A $2 million investment in public art rounds out the upgrades. Later in the year comes"
                    - link "Hotel Eleanor" [ref=e1812] [cursor=pointer]:
                      - /url: https://hoteleleanorsacramento.com/
                    - text: ", the first five-star property for Sacramento, reimagining a former 1910 bank building as a 107-room Art Deco stay with 1940s glamour. With Major League Baseball’s Athletics (formerly of Oakland) playing in West Sacramento until 2028, and the Kings’ electrifying basketball season, the city’s sports scene has officially commandeered the Bay Area greats: Sacramento has shed its underdog status."
                  - paragraph [ref=e1813]: From the fields to the riverfront, Sacramento’s rise—rooted in its land, powered by its people, and unmistakably its own—feels inevitable.
                  - paragraph [ref=e1814]:
                    - strong [ref=e1815]: "How to plan it:"
                    - text: Skip Sacramento’s scorching summers and visit in spring or fall, when the Delta breeze cools temps during the city’s golden afternoons. Sacramento International Airport is quick to navigate and only 15 minutes from the city center, a rare convenience compared with California’s larger hubs. Stay at the
                    - link "Kimpton Sawyer" [ref=e1816] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/hotels/kimpton-sawyer-hotel
                    - text: ", which has views of the entertainment hub"
                    - link "Golden 1 Center" [ref=e1817] [cursor=pointer]:
                      - /url: https://www.golden1center.com/
                    - text: and is steps from Old Sacramento’s riverfront, where wooden sidewalks and historic buildings transport visitors back to the Gold Rush era. —
                    - link "Keyla Vasconcellos" [ref=e1818] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/contributor/keyla-vasconcellos
                      - emphasis [ref=e1819]: Keyla Vasconcellos
