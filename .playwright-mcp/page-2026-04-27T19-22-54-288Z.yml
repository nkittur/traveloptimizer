                  - paragraph [ref=e1938]:
                    - link "San Francisco" [ref=e1939] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/destinations/san-francisco
                    - text: is making a long overdue comeback. Postpandemic, media coverage of the city had focused on its empty storefronts and dwindling art scene, but, with Daniel Lurie, the new, energized mayor at its helm, the city is on the precipice of a fresh, exciting era. A quick look at the mayor’s
                    - link "Instagram" [ref=e1940] [cursor=pointer]:
                      - /url: https://www.instagram.com/danielluriesf/?hl=en
                    - text: "shows just how exhilarating spending time in the city is: One can attend"
                    - link "Diplo’s Run Club" [ref=e1941] [cursor=pointer]:
                      - /url: https://diplosrunclub.com/
                    - text: in the morning and celebrate at a new restaurant opening in the evening, popping into a glitzy gallery opening on the way. Add an increasingly busy downtown and a key role in the
                    - link "FIFA World Cup" [ref=e1942] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/story/how-to-get-tickets-to-the-fifa-world-cup
                    - text: and the
                    - link "Super Bowl" [ref=e1943] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/story/this-man-has-traveled-to-all-57-super-bowls
                    - text: next year, and you’ll get a buzzing destination with a renewed zest for life.
                  - paragraph [ref=e1944]:
                    - text: San Francisco’s already stellar restaurant scene, in particular, will experience a boost in 2026, led by multiple new openings at the iconic Ferry Building, which is shaping up to be one of the city’s leading dining destinations. The upcoming Mediterranean concept
                    - link "Hayati" [ref=e1945] [cursor=pointer]:
                      - /url: https://www.instagram.com/hayati.sf/
                    - text: and the newly opened
                    - link "Arquet," [ref=e1946] [cursor=pointer]:
                      - /url: https://www.arquetrestaurant.com
                    - text: from the Michelin-acclaimed team behind
                    - link "Sorrel" [ref=e1947] [cursor=pointer]:
                      - /url: https://www.sorrelrestaurant.com/
                    - text: ", are two to watch, as is"
                    - link "Via Aurelia" [ref=e1948] [cursor=pointer]:
                      - /url: https://www.viaaureliasf.com/
                    - text: ", an ambitious fine-dining restaurant from local star chef David Nayfeld in nearby Mission Bay. At the"
                    - link "Transamerica Pyramid," [ref=e1949] [cursor=pointer]:
                      - /url: https://transamericapyramid.com/
                    - text: another San Francisco skyline landmark that recently underwent a major redevelopment, chef Brad Kilgore is leading a small, mighty culinary empire with the chic
                    - link "Café Sebastian" [ref=e1950] [cursor=pointer]:
                      - /url: https://www.cafesebastiansf.com/
                    - text: ", the creative ice cream and kakigori spot"
                    - link "MadLab" [ref=e1951] [cursor=pointer]:
                      - /url: https://www.instagram.com/madlab_kakigori/?hl=en
                    - text: ", and, most recently, the dim, sexy"
                    - link "Ama" [ref=e1952] [cursor=pointer]:
                      - /url: https://www.opentable.com/r/ama-san-francisco
                    - text: "restaurant. Even longtime favorites have cause to celebrate: Chinatown’s fine-dining gem,"
                    - link "Mister Jiu’s" [ref=e1953] [cursor=pointer]:
                      - /url: https://www.misterjius.com/
                    - text: ", turns 10 in 2026—and plans to mark it with an exciting lineup of chef collaborations and alumni reunions."
                  - paragraph [ref=e1954]:
                    - text: The city’s recently dormant nightlife is reinvigorated, with an infusion of sultry private clubs, from the new maximalist private club
                    - link "The Bank" [ref=e1955] [cursor=pointer]:
                      - /url: https://www.thebankatamador.com/
                    - text: to the return of Jack’s, a historic downtown restaurant and club closed in 2009, reborn and transformed into a cultural venue and civic salon with a Belle Époque–inspired menu. Another alluring option is
                    - link "Dante’s Inferno" [ref=e1956] [cursor=pointer]:
                      - /url: https://www.instagram.com/dantesinferno_sf/
                    - text: ", an upcoming immersive multi-venue spot, guaranteed to keep things interesting alongside the reopening of the city’s famed jazz club Bar Deluxe."
                  - paragraph [ref=e1957]:
                    - text: Beyond the buzz of new restaurants and late-night spots, San Francisco's creative energy spills into its cultural institutions. The museum landscape soon will welcome the
                    - link "Courage Museum" [ref=e1958] [cursor=pointer]:
                      - /url: https://couragemuseum.org/?gad_source=1&gad_campaignid=21650218780&gbraid=0AAAAADwU5J5quys5auDMRbD99HkTITgCa&gclid=Cj0KCQjw3aLHBhDTARIsAIRij596Dd9kPDapZZAAFVvhmYc6fEmeJXqsd-C2M2o0EldMZsxIGYXISxcaAvV7EALw_wcB
                    - text: at the Presidio, joining the festive reopening of
                    - link "The Vault" [ref=e1959] [cursor=pointer]:
                      - /url: https://www.sfchronicle.com/realestate/article/sf-levis-museum-21075920.php
                    - text: ", Levis’ museum’s waterfront location that has been closed to the public for years. Fine art lovers can also plan to visit the deYoung Museum, which will welcome a Monet and Venice exhibit in 2026 (from March to July), and"
                    - link "SFMOMA" [ref=e1960] [cursor=pointer]:
                      - /url: https://www.sfmoma.org/
                    - text: ", where a show centered on Matisse's"
                    - emphasis [ref=e1961]: Femme au Chapeau
                    - text: (
                    - emphasis [ref=e1962]: Women With a Hat
                    - text: ) will be on display. For accommodations, keep an eye out on the long-awaited reopening of
                    - link "The Huntington Hotel" [ref=e1963] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/hotels/san-francisco/san-francisco/huntington-hotel
                    - text: ", a storied landmark that closed during the pandemic—set to relaunch under new ownership in March 2026."
