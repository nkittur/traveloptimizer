                    - strong [ref=e835]: "How to plan it:"
                    - text: Weather-wise, the best (though crowded) times to visit are April and May and September and October, but the latter is high hurricane season, so take note that your plans can change.
                    - link "Breeze" [ref=e836] [cursor=pointer]:
                      - /url: https://www.flybreeze.com/
                    - text: Airways has a growing hub in Charleston, with direct flights from Palm Beach, Los Angeles, and Richmond, but plenty of other carriers offer direct flights from bigger cities too. Charleston’s high humidity in summer is the stuff of legend, so lodgings close to the beach—or one with a pool—are pretty much required. —
