                    - strong [ref=e581]: "How to plan it:"
                    - text: Most major US airports have direct or one-stop flights to Buffalo Niagara International Airport (BUF). After landing, you’d be wise to rent a car to best navigate the city. If you’re coming from the Northeast, consider road-tripping so you can cross the Canadian border and continue to Toronto. Although Buffalo is a year-round destination, summer is the best time to enjoy the new outdoor offerings as well as events like the
                    - link "Juneteenth celebration" [ref=e582] [cursor=pointer]:
                      - /url: https://cna.st/affiliate-
                    - text: ","
                    - link "Garden Walk" [ref=e583] [cursor=pointer]:
                      - /url: https://www.gardensbuffaloniagara.com/garden-walk-buffalo
                    - text: ", and the National"
                    - link "Buffalo Wing Festival" [ref=e584] [cursor=pointer]:
                      - /url: https://buffalowing.com/
                    - text: . The historic
                    - link "Richardson Hotel" [ref=e585] [cursor=pointer]:
                      - /url: https://cna.st/affiliate-
                    - text: and
                    - link "The Roycroft Inn" [ref=e586] [cursor=pointer]:
                      - /url: https://cna.st/affiliate-
