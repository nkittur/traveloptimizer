                - generic [ref=e232]:
                  - paragraph [ref=e233]: "It's a momentous time to talk about the best places to go in the US: In 2026 the country will celebrate its semiquincentennial birthday. America probably looks a bit different right now from what our forefathers could have predicted when they founded the United States a whopping 250 years ago—I imagine they’d have some notes for us (for what it’s worth, I have some notes for them too)."
                  - paragraph [ref=e234]:
                    - text: Ahead of this anniversary I have been making a point to remind myself of what I love most about this country, what it is that we want to protect and preserve while doing our best to navigate an era of transition and uncertainty. Travel is a useful tool. I think of the fact that, in the city of
                    - link "Chicago" [ref=e235] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/destinations/chicago
                    - text: ", with its jazz, or the"
                    - link "Smoky Mountains" [ref=e236] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/story/a-guide-to-the-gateway-towns-of-great-smoky-mountains-national-park
                    - text: of East Tennessee, where the sounds of bluegrass carry through the hills, you can find music traditions so deeply rooted in this land, and yet they evolve as we do. I think of places like
                    - link "Oahu" [ref=e237] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/story/best-island-to-visit-in-hawaii-for-every-type-of-traveler
                    - text: and
                    - link "Catalina Island" [ref=e238] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/story/catalina-island-is-one-of-los-angeles-best-kept-secrets
                    - text: ", both of which we're lucky to count as part of this country, where island landscapes intermingle with a fascinating blend of cultural influences, from ancient"
                    - link "Polynesia" [ref=e239] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/story/in-the-remote-marquesas-islands-nature-is-at-its-most-intimidating-and-irresistible
                    - text: to 1920s
                    - link "Hollywood" [ref=e240] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/destinations/los-angeles
                    - text: . I think of the spirit of reinvention and rebirth emerging in cities like Buffalo and
                    - link "San Francisco" [ref=e241] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/destinations/san-francisco
                    - text: ", and I can't help but daydream about the sheer poetry that it must be to trace"
                    - link "Route 66" [ref=e242] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/story/best-airbnbs-route-66
                    - text: —and to be reminded that even without a passport, there is more to see here than any of us can experience in a lifetime.
                  - link "Opens in a new window" [ref=e245] [cursor=pointer]:
