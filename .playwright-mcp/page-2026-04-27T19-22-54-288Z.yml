                  - heading "Catalina Island, California" [level=2] [ref=e595]
                  - paragraph [ref=e597]:
                    - emphasis [ref=e598]:
                      - strong [ref=e599]: "Go for:"
                      - text: a century of Art Deco glamour and some wild surprises
                  - figure [ref=e601]:
                    - generic [ref=e604]:
                      - paragraph [ref=e606]: With its Art Deco architecture, Old Hollywood relics, and stunning natural beauty, Catalina Island is a true American gem—as it celebrates its 100th anniversary as a resort destination this year, there's no better time to join in the festivities.
                      - text: Getty
                  - paragraph [ref=e607]:
                    - text: In 2026,
                    - link "Catalina Island" [ref=e608] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/story/catalina-island-is-one-of-los-angeles-best-kept-secrets
                    - text: is celebrating its 100th anniversary as a resort destination, so there’s never been a better time to rediscover the Channel island located just an hour off the
                    - link "Southern California coast" [ref=e609] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/gallery/13-best-beaches-in-los-angeles
                    - text: . Starting in 1919, William Wrigley Jr. transformed the island into a “playground for all.” He invited the Chicago Cubs to train in Avalon in 1921 and had an Art Deco gem of a theater, the
                    - link "Catalina Casino" [ref=e610] [cursor=pointer]:
                      - /url: https://www.visitcatalinaisland.com/things-to-do/catalina-casino
                    - text: ", built in 1929. A herd of bison—originally brought over for a silent-film shoot in 1924—still roam the island’s wild interior today. Thanks to the Wrigley family’s conservation legacy, 88% of Catalina is protected, preserving habitats for endemic species like the Catalina Island fox. Adventurers can hike the 38.5-mile Trans-Catalina Trail,"
                    - link "snorkel" [ref=e611] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/activities/avalon/casino-point-dive-park
                    - text: the turquoise waters at Lover’s Cove Marine Reserve, or kayak to hidden coves in search of sea lions and bright-orange garibaldi fish.
                  - paragraph [ref=e612]:
                    - text: If indoor sports are more your thing, don’t miss your chance to lace up vintage skates and twirl across the same polished floor where big bands once played, beneath glittering Tiffany chandeliers, in the Catalina Casino’s former ballroom. It now moonlights as the coolest roller skating rink in the world owing to its current creative director, Wesley Alfvin, a former member of the Dapper Dans a cappella group at Disneyland. And over at
                    - link "Mt Ada" [ref=e613] [cursor=pointer]:
                      - /url: https://www.visitcatalinaisland.com/mt-ada
                    - text: ", William Wrigley Jr.’s former mansion perched above Avalon Bay, a 2024 refresh means rooms now feature spa-style bathrooms, curated period antiques, and a 24/7 butler’s pantry stocked with handcrafted gelato."
