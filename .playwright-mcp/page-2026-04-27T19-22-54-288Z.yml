                    - strong [ref=e706]: "How to plan it:"
                    - text: Catalina Express offers daily ferry service from Long Beach, San Pedro, and Dana Point. In spring or fall, you’ll get ideal weather and far fewer crowds. Book early for summer weekends. Catalina Island has a strict limit on cars, so explore by foot, bike, or golf cart. The Catalina Island Conservancy has guided eco-tours and private adventures tailored to photography, botany, or history. Visit the Trailhead Visitor Center in Avalon for hiking permits and insider tips. Kayak rentals are available at Descanso Beach Ocean Sports—either by the hour or for full-day adventures. —
