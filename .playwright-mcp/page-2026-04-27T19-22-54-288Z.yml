                    - strong [ref=e1095]: "How to plan it:"
                    - text: Salt Lake City International Airport is a mere 45-minute drive from Deer Valley, making the resort one of the most accessible in the Rockies. The ski season runs from early December through mid-April, and natural snowfall is augmented by snowmaking that covers key areas. If you're coming to hit the slopes, be sure to
                    - link "book your lift tickets" [ref=e1096] [cursor=pointer]:
                      - /url: https://www.deervalley.com/plan-your-trip/tickets-and-passes
                    - text: early—Deer Valley caps daily skier numbers, via lift tickets sold daily, to preserve its uncrowded experience. —
