                  - heading "Boston" [level=2] [ref=e332]
                  - paragraph [ref=e334]:
                    - emphasis [ref=e335]:
                      - strong [ref=e336]: "Go for:"
                      - text: FIFA World Cup, Sail Boston, and America’s big birthday
                  - figure [ref=e338]:
                    - generic [ref=e341]:
                      - img "kitchen interior"
                    - generic [ref=e342]:
                      - paragraph [ref=e344]: New restaurants like Comfort Kitchen (above) are spotlighting Boston's diverse cultural heritage as the historic city gears up for America's 250th anniversary.
                      - text: Comfort Kitchen/Christian Harder
                  - paragraph [ref=e345]:
                    - link "Boston" [ref=e346] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/destinations/boston
                    - text: "already wears its history proudly, but America’s 250th anniversary will shine a brighter spotlight on the historic capital. The city is experiencing a turning point, and the world is starting to see the version of Boston that its residents have always known: not a college town or a business-first destination but a vibrant and dynamic metropolis where past and future"
                    - link "coexist" [ref=e347] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/story/boston-historic-past-writing-next-chapter
                    - text: ". And 2026 is going to be a banner year for goings-on. There’s something old: the return of"
                    - link "Sail Boston" [ref=e348] [cursor=pointer]:
                      - /url: https://www.sailboston.com/
                    - text: "in July, an event held roughly every eight years when Boston Harbor gets packed with floods with historic tall ships from around the world, many of which guests can board and explore for free. There’s something new too: Boston is one of the host cities for the"
                    - link "2026 FIFA World Cup" [ref=e349] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/story/how-to-get-tickets-to-the-fifa-world-cup
                    - text: ", which organizers are already calling the single largest sporting event"
                    - emphasis [ref=e350]: ever.
                    - text: But even if you visit outside of those dates, you’ll find that the city is percolating with new energy. Take James Beard Award finalist
                    - link "Comfort Kitchen" [ref=e351] [cursor=pointer]:
                      - /url: https://www.comfortkitchenbos.com/
                    - text: ", for instance, which offers comfort food inspired by the African diaspora, or"
                    - link "Row 34" [ref=e352] [cursor=pointer]:
                      - /url: https://www.row34.com/
                    - text: ", which continually ups the ante with best-in-class seafood, in a city home to what must be the highest number of seafood snobs in the world. That’s just the amuse-bouche of it all. A new wave of artists and diverse entrepreneurs is drawing visitors to less-explored neighborhoods like Charlestown, Dorchester, and East Boston, and the forthcoming"
                    - link "Atlas Hotel" [ref=e353] [cursor=pointer]:
                      - /url: https://cna.st/affiliate-
                    - text: in Allston will further shift the city’s center of gravity away from its downtown core—contributing to a renewed sense that yes, in fact, what is old can be made new again.
