                  - heading "Deer Valley, Utah" [level=2] [ref=e982]
                  - paragraph [ref=e984]:
                    - emphasis [ref=e985]:
                      - strong [ref=e986]: "Go for:"
                      - text: one last (Sun)dance; double the skiable terrain
                  - figure [ref=e988]:
                    - generic [ref=e991]:
                      - img "Park City will host the Sundance Film Festival one final time in 2026—and at nearby Deer Valley the ski offerings are..."
                    - paragraph [ref=e994]: Park City will host the Sundance Film Festival one final time in 2026—and, at nearby Deer Valley, the ski offerings are bigger and better than ever.
                  - paragraph [ref=e995]:
                    - text: For decades Deer Valley has been synonymous with groomed slopes, polished service, and the starry energy of the
                    - link "Sundance Film Festival" [ref=e996] [cursor=pointer]:
                      - /url: https://www.sundance.org/blogs/what-to-know-about-the-2026-sundance-film-festival/
                    - text: . In January 2026 that story will come full circle. After over four decades in
                    - link "Park City" [ref=e997] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/story/where-to-eat-stay-and-play-in-park-city
                    - text: ", Sundance will mark its final year in Utah, culminating with what organizers call “a celebration full of gratitude and joy” to honor founder Robert Redford and the cultural milestone this moment represents. As Sundance bows out, Deer Valley enters a new era with the largest ski-resort expansion in North American history. The"
                    - link "Expanded Excellence initiative" [ref=e998] [cursor=pointer]:
                      - /url: https://expandedexcellence.deervalley.com/
                    - text: more than doubles skiable terrain to 4,300 acres, with nearly 100 new runs and 31 lifts. This winter also brings seven new chairlifts, including the East Village Express gondola, alongside the continued rollout of
                    - link "East Village" [ref=e999] [cursor=pointer]:
                      - /url: https://deervalleyeastvillage.com/east-village#hotels-and-residences
                    - text: ", which offers streamlined mountain access and more than 70 shops and restaurants. Upon completion, East Village will also feature eight hotels, including the"
                    - link "Grand Hyatt Deer Valley" [ref=e1000] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/hotels/park-city/grand-hyatt-deer-valley
                    - text: ", which opened in late 2024, the forthcoming Canopy by Hilton (Hilton's first ski-destination property, set to debut in summer 2026), and further out, a"
                    - link "Four Seasons resort and residences" [ref=e1001] [cursor=pointer]:
                      - /url: https://cna.st/affiliate-
                    - text: slated to open in 2028. Add in the swanky
                    - link "Chute Eleven Champagne yurt" [ref=e1002] [cursor=pointer]:
                      - /url: https://www.deervalley.com/things-to-do/restaurants/chute-eleven
                    - text: ", returning for its second year, plus 300 inches of annual snowfall backed by a state-of-the-art snowmaking system, and Deer Valley stands ready to show travelers what its next chapter looks like."
