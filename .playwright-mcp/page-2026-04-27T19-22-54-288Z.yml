                  - heading "Arkansas" [level=2] [ref=e277]
                  - paragraph [ref=e279]:
                    - emphasis [ref=e280]:
                      - strong [ref=e281]: "Go for:"
                      - text: a world-class mountain biking destination; new hiking trails flanking the Mississippi River
                  - figure [ref=e283]:
                    - generic [ref=e286]:
                      - img "Autumn Scenic Drive"
                    - generic [ref=e287]:
                      - paragraph [ref=e289]: This year all eyes are on Arkansas’s booming mountain bike scene, which offers unprecedented access to the state’s natural splendor.
                      - text: Shutterstock
                  - paragraph [ref=e290]:
                    - text: Fittingly nicknamed the Natural State, Arkansas is rich in outdoor landmarks that include the bubbling thermal waters at
                    - link "Hot Springs National Park" [ref=e291] [cursor=pointer]:
                      - /url: https://www.hotsprings.org/
                    - text: and teeming forest ecosystems across Ozark National Forest and the Ouachita Mountains. In 2026, two new chairlift-served mountain cycling parks will cement the state as the country’s cycling epicenter and broaden its reputation as a gateway for outdoor recreation. In the Ouachita Mountains the
                    - link "Trails at Mena project" [ref=e292] [cursor=pointer]:
                      - /url: https://storymaps.arcgis.com/stories/d6415d25350c453d90538005b84c148f
                    - text: ", which breaks ground in 2026, will become the largest lift-served mountain bike park in the world when it opens, featuring 100 miles of exhilarating trails built for all levels, including mountain bikers and backcountry users. In northwestern Bella Vista,"
                    - link "OZ Trails Bike Park" [ref=e293] [cursor=pointer]:
                      - /url: https://www.oztrails.com/oz-trails-bike-park/
                    - text: ", the state’s first chairlift-served downhill mountain biking park when it opens in mid-2026, will offer a state-of-the-art Poma-Leitner high-speed chairlift system that can carry four passengers and their bikes; more than 20 miles of downhill biking trails across 200 acres; dedicated paths for hiking and running; and a buzzing central hub with restaurants, bars, and communal gathering spaces. Set against pin-drop-silent remote flatlands and forests buoyed by swamp and marsh wetlands, new segments of the"
                    - link "Delta Heritage Trail" [ref=e294] [cursor=pointer]:
                      - /url: https://www.arkansasstateparks.com/trails/delta-heritage-trail
                    - text: next spring will round out 84.5 miles of hiking and biking trails flanked by the Mississippi River. When you’re ready to head indoors, find your way to the
                    - link "Crystal Bridges Museum of American Art" [ref=e295] [cursor=pointer]:
                      - /url: https://crystalbridges.org/
                    - text: in
                    - link "Bentonville" [ref=e296] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/hotels/united-states/bentonville/21c-museum-hotel-bentonville
                    - text: ", where there are two new galleries showcasing five centuries of American art across 114,000 square feet of new space, broadening the cultural appeal of a city already well loved for its biking opportunities. Just steps away from the museum—and a stone’s throw away from the forest trails that beckon adventure travelers—visitors can check in to"
                    - link "The Compton" [ref=e297] [cursor=pointer]:
                      - /url: https://cna.st/affiliate-
                    - text: ", a newly opened 142-room boutique property that celebrates the region's great outdoors with a sculptural bluff in the central atrium inspired by the natural cliffs of Buffalo National River."
