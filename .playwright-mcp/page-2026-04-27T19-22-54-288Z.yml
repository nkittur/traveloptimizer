                  - heading "Buffalo" [level=2] [ref=e469]
                  - paragraph [ref=e471]:
                    - emphasis [ref=e472]:
                      - strong [ref=e473]: "Go for:"
                      - text: a comeback kid with a revitalized waterfront and new cultural stalwarts
                  - figure [ref=e475]:
                    - generic [ref=e478]:
                      - img "A Rust Belt city on an upward swing Buffalo is home to one of the country's best collections of modern and contemporary..."
                    - paragraph [ref=e481]: A Rust Belt city on an upward swing, Buffalo is home to one of the country's best collections of modern and contemporary architecture, with Frank Lloyd Wright's Graycliff (above) serving as its crown jewel.
                  - paragraph [ref=e482]:
                    - text: What was once one of the country’s
                    - link "wealthiest cities" [ref=e483] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/story/richest-cities-in-the-world
                    - text: is looking to cement something of a comeback. Buffalo, New York, has become a postindustrial punching bag, only attracting visitors primarily due to its proximity to
                    - link "Niagara Falls" [ref=e484] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/activities/toronto/niagara-falls
                    - text: "—and the Buffalo Bills. But urban revitalization efforts will come to a head in 2026 with a spate of openings worth paying attention to. There are green spaces galore: 2025 already saw the reopening of Wilkeson Pointe, part of"
                    - link "New York State" [ref=e485] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/story/best-upstate-new-york-day-trips-from-nyc
                    - text: "’s $300 million restoration plan for the Buffalo Waterfront with hiking trails, kayak and bike rentals, and, eventually, a public beach, while the first-phase rollout of the 100-acre Ralph C. Wilson Jr. Park begins in 2026 with the unveiling of a pedestrian bridge that will link the west side to the waterfront. Sports fans can anticipate the summer opening of the new $2.2 billion Highmark Stadium, just ahead of the Buffalo Bills’ 2026 season—it is claimed that this facility will have the world’s largest heated roof. That’s not all: The"
                    - link "Hispanic Heritage Cultural Institute" [ref=e486] [cursor=pointer]:
                      - /url: https://hispanicheritagewny.org/cultural-institute.php
                    - text: will open on Buffalo’s west side and a brand-new visitor center at Frank Lloyd Wright’s Graycliff (FLW designed
                    - link "several significant buildings in Buffalo" [ref=e487] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/story/the-best-city-to-experience-frank-lloyd-wright-architecture-is-buffalo
                    - text: ) are also forthcoming in the summer. In fall 2026 the Lipsey Architecture Center, which focuses on advancing Buffalo’s architectural legacy including cultural institutions built by
                    - link "Eero Saarinen" [ref=e488] [cursor=pointer]:
                      - /url: https://www.archpaper.com/2022/09/renovation-underway-buffalo-kleinhans-music-hall-eliel-eero-saarinen/
                    - text: ", will get a new home on the Richardson Olmsted Campus. Programming announcements for America’s semiquincentennial celebration are yet to come, so keep your eyes peeled—but in the meantime there’s much else to plan on as Buffalo blossoms."
