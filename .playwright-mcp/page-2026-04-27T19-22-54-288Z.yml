                  - heading "Portland, Oregon" [level=2] [ref=e1499]
                  - paragraph [ref=e1501]:
                    - emphasis [ref=e1502]:
                      - strong [ref=e1503]: "Go for:"
                      - text: exciting art and culinary projects that tell a fresh story
                  - generic [ref=e1505]:
                    - figure [ref=e1506]:
                      - generic [ref=e1509]:
                        - img "The Willamette Valley yields an abundance of fresh produce which new Portland restaurants like Kann are celebrating in..."
                      - paragraph [ref=e1512]: The Willamette Valley yields an abundance of fresh produce, which new Portland restaurants like Kann (above) are celebrating in style.
                    - figure [ref=e1513]:
                      - generic [ref=e1516]:
                        - img "interior restaurant"
                      - generic [ref=e1517]:
                        - paragraph [ref=e1519]: Portland is home to several James Beard Award–winning chefs like Gregory Gourdet of Kann (above). Now the prestigious culinary foundation is opening its first public market in the city.
                        - text: Steve Freihon/Kann
                  - paragraph [ref=e1520]:
                    - text: For a few years now, this perpetually overcast town—with the prevailing tired image of hipster
                    - emphasis [ref=e1521]: Portlandia
                    - text: —has developed a thornier reputation. But in 2026 a series of major art, architecture, and culinary projects conspire to tell a fresh story about the
                    - link "City of Roses" [ref=e1522] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/destinations/portland-oregon
                    - text: . Travelers will sense the city’s plot twist the moment they disembark at
                    - link "Portland International Airport" [ref=e1523] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/story/portland-airport-new-terminal
                    - text: ", which, in early 2026, opens the final third of its new terminal, acclaimed for its award-winning mass-timber architecture. Built with wood sourced from nearby forests and via tribal partnerships, the wavy ceiling extends over some two dozen local shops and restaurants. In the city’s walkable downtown, the"
                    - link "Portland Art Museum" [ref=e1524] [cursor=pointer]:
                      - /url: https://portlandartmuseum.org/
                    - text: (PAM), the oldest art museum in the Pacific Northwest, completes a massive expansion in November 2025. With an additional 100,000 square feet, PAM will display nearly 300 new major acquisitions and introduce new galleries, including one dedicated solely to Black artists. In a city with one of the continent’s most acclaimed food scenes, which has spawned stars such as Gregory Gourdet of
                    - link "Kann" [ref=e1525] [cursor=pointer]:
                      - /url: https://kannrestaurant.com/
                    - text: ", summer 2026 will bring yet another reason to celebrate the"
                    - link "Willamette Valley" [ref=e1526] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/story/the-other-side-of-the-willamette-valley
                    - text: "’s bounty: the"
                    - link "James Beard Public Market" [ref=e1527] [cursor=pointer]:
                      - /url: https://www.jamesbeardpublicmarket.com/
                    - text: ", which finally comes to life after more than a decade of planning starts and stops. The indoor-outdoor venue, filled with small-scale growers and producers, will be one to rival Seattle’s Pike Place. For sports lovers there is the new WNBA team, the"
                    - link "Portland Fire" [ref=e1528] [cursor=pointer]:
                      - /url: https://fire.wnba.com/
                    - text: ", which will kick off its first season in May, drawing droves of fans to"
                    - link "The Sports Bra" [ref=e1529] [cursor=pointer]:
                      - /url: https://thesportsbraofficial.com/?srsltid=AfmBOorSsPt6NHroqXySDb4VfmG3RoaVfMVRg6sg6udwNqfIIV_8t7fw
                    - text: . And while these developments signal Portland's evolution, the city's soul remains intact—where else would a sprawling bookstore (
                    - link "Powell's" [ref=e1530] [cursor=pointer]:
                      - /url: https://www.powells.com/
                    - text: ), an urban forest (Forest Park), and one of the country's longest-running drag venues (
                    - link "Darcelle XV" [ref=e1531] [cursor=pointer]:
                      - /url: https://darcellexv.com/
                    - text: ) rank among the top attractions? —
                    - link "JD Shadel" [ref=e1532] [cursor=pointer]:
                      - /url: https://cntraveler.com/contributor/jd-shadel
                      - emphasis [ref=e1533]: JD Shadel
