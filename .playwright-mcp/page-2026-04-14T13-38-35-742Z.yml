            - generic [ref=e268]: Salsa dancers gather in downtown Asheville on a recent weekend.
          - generic [ref=e269]: Advertisement
          - generic [ref=e270]:
            - paragraph [ref=e271]: Sunday
            - generic:
              - figure "scoop-picture"
            - generic [ref=e272]:
              - generic [ref=e273]: 9:30 a.m. Visit the Vanderbilts’ not-so-humble abode
              - generic [ref=e274]:
                - text: No trip to Asheville is complete without a stop at the
                - link "Biltmore House" [ref=e275] [cursor=pointer]:
                  - /url: https://www.biltmore.com/visit/biltmore-estate/biltmore-house/
                - text: ", the palatial Gilded Age mansion built by George Vanderbilt in 1895. Billed as the largest home in the United States, it comes in at a whopping 175,000 square feet. A"
                - link "self-guided audio tour" [ref=e276] [cursor=pointer]:
                  - /url: https://www.biltmore.com/activity/audio-guide-to-biltmore-house/
                - text: (from $89) can feel stale if you aren’t an architecture buff or particularly interested in the Vanderbilt family, but fortunately the larger estate offers everything from wine tastings at the onsite
                - link "Biltmore Winery" [ref=e277] [cursor=pointer]:
                  - /url: https://www.biltmore.com/visit/winery/
                - text: to
                - link "hiking trails and bike rentals" [ref=e278] [cursor=pointer]:
                  - /url: https://www.biltmore.com/things-to-do/activities/outdoors/biking-hiking/
                - text: to explore the estate’s 22 miles of paved and woodland dirt paths. Through Jan. 7, 2024, the “
                - link "Italian Renaissance Alive" [ref=e279] [cursor=pointer]:
                  - /url: https://www.biltmore.com/things-to-do/events/italian-renaissance-alive/
