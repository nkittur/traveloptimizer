              - generic [ref=e181]:
                - generic [ref=e182] [cursor=pointer]:
                  - text: Getting around
                  - generic [ref=e183]: +
                - list:
                  - listitem [ref=e184]: While downtown Asheville is compact enough to explore on foot, you may want to rent a car to reach the many nature trails and attractions just outside of the city. Asheville’s regional airport hosts most national rental car brands, otherwise Ubers and Lyfts average less than $10 a ride to get to most Asheville neighborhoods.
          - generic [ref=e185]:
            - heading "Itinerary" [level=2] [ref=e186]
            - paragraph [ref=e187]: Friday
            - figure "scoop-picture" [ref=e189]:
              - img "A storefront with the words" [ref=e193]
              - generic [ref=e194]: Noir Collective AVL
            - generic [ref=e195]:
              - generic [ref=e196]: 2:30 p.m. Walk ‘the Block’
              - generic [ref=e197]:
                - text: Seventy years ago, Eagle and Market Streets, known as the Block, made up a prosperous African American business district. The Young Men’s Institute (now
                - link "the YMI Cultural Center" [ref=e198] [cursor=pointer]:
                  - /url: https://www.ymiculturalcenter.org/
                - text: ) was a cornerstone of the local Black community, with a library, athletic facilities, retail space and classrooms. Though much of the neighborhood was destroyed by urban renewal policies, the Tudor-inspired, red-brick center, built in 1893, is undergoing renovations and expected to open in its entirety later this year. Already, the ground-level retail spaces include
                - link "Noir Collective AVL" [ref=e199] [cursor=pointer]:
                  - /url: https://noircollectiveavl.com/
                - text: ", a Black-owned boutique filled with artwork, jewelry, teas, soaps and more, and"
                - link "PennyCup Coffee" [ref=e200] [cursor=pointer]:
                  - /url: https://pennycupcoffeeco.com/
                - text: ", where a colorful mural by the artist Big Al Carter greets visitors. Nearby, a cultural center called"
                - link "LEAF Global Arts" [ref=e201] [cursor=pointer]:
                  - /url: https://theleaf.org/
                - text: allows visitors to virtually explore music from around the world, play instruments and occasionally enjoy live performances (free).
            - generic [ref=e202]:
              - generic [ref=e203]: 4:00 p.m. Celebrate Indigenous artistry
              - generic [ref=e204]:
                - text: Also in the downtown area,
                - link "Weaving Rainbows" [ref=e205] [cursor=pointer]:
                  - /url: https://www.weavingrainbows.love/
                - text: ", a new art gallery and creative space dedicated to Indigenous artists, works with artists from the local Eastern Band of Cherokee Indians as well as Indigenous communities in Mexico, Peru and Guatemala, with most of the works created by women. Here you’ll find naturally dyed, handmade weavings, clothing, rugs, huipils (ponchos) and more. This month, the team plans to open the onsite Bejaflor Botanicals Elixir Garden, a nonalcoholic bar of elixirs ($5) made from both international and Appalachian herbs."
            - generic:
              - figure "scoop-picture"
            - generic [ref=e206]:
              - generic [ref=e207]: 6:30 p.m. Dine among legends
              - generic [ref=e208]:
                - text: An oversize portrait of the writer James Baldwin by the local artist Jenny Pickens greets guests at
                - link "Benne on Eagle" [ref=e209] [cursor=pointer]:
                  - /url: https://www.benneoneagle.com/
                - text: ", a restaurant that pays homage to local African American culinary traditions. Ask for a table near the “Legends of the Block” portraits of four Black female chefs and Eagle street business owners from the 1960s and ’70s whose culinary impact is still felt today. The restaurant focuses on seasonal Southern cuisine: Starters like fried green tomatoes ($12) are served with pimento cheese and tangy chow chow, while the fried catfish and collards entree ($24), served with sweet potato hash and peanut red pepper sauce, is a must. Check out the night’s featured cocktails or try the Mo Benne Blues ($14) with vodka, blueberry, lemon and lavender."
            - generic [ref=e210]:
              - generic [ref=e211]: 8 p.m. Listen to live jazz
              - generic [ref=e212]:
                - text: Asheville is known for its music scene and you can ease into it just steps away from dinner at the
                - link "Foundry Hotel" [ref=e213] [cursor=pointer]:
                  - /url: https://foundryasheville.com/
                - text: . Housed in three 19th-century buildings that were once a steel factory for the nearby
                - link "Biltmore Estate" [ref=e214] [cursor=pointer]:
                  - /url: https://www.biltmore.com/
                - text: ", the Foundry offers Gilded Age vibes with Art Deco-inspired furnishings and free live jazz most evenings in the"
                - link "Workshop Lounge" [ref=e215] [cursor=pointer]:
                  - /url: https://foundryasheville.com/dining/workshop-lounge
                - text: bar (cocktails from $12 to $15). On Fridays, the Hot Club of Asheville jazz collective plays 1930s swing until 9:30 p.m. Don’t be afraid to join fellow guests on the dance floor.
          - figure "scoop-picture" [ref=e216]:
            - img "Three people stroll on footpaths among newly planted gardens on a bucolic estate. In the foreground are some lilies, In the background is a greenhouse with arched windows and beyond that are trees. On one side is a covered walking bath with trellises on which vines grow." [ref=e220]
            - generic [ref=e221]: Visitors stroll among the gardens on the Biltmore Estate.
          - generic [ref=e222]: Advertisement
          - generic [ref=e223]:
            - paragraph [ref=e224]: Saturday
            - generic:
              - figure "scoop-picture"
            - generic [ref=e225]:
              - generic [ref=e226]: 10 a.m. Unwind at a Japanese spa
              - generic [ref=e227]:
                - text: Just 15 minutes from downtown Asheville, you’ll find the Blue Ridge mountain views that so many come here for. In the late 19th century, doctors began praising the area’s fresh air, some saying that it was a cure for respiratory illnesses. Today, you’ll find yoga, salt caves and aura readings to help you pursue inner calm, but nothing quite compares to
                - link "Shoji Spa & Retreat" [ref=e228] [cursor=pointer]:
                  - /url: https://shojispa.com/
                - text: . The Japanese-inspired spa, deep within the
                - link "Pisgah National Forest" [ref=e229] [cursor=pointer]:
                  - /url: https://www.fs.usda.gov/recarea/nfsnc/recarea/?recid=48114
                - text: ", is known for its open-air private tub houses. Guests may soak in salt mineral hot tubs ($123 for 90 minutes) with tub-side tea service ($24) that includes the spa’s signature tea blend, raw unfiltered honey and tea crackers. All soaks and spa packages include access to a wet cedar sauna and cold showers."
            - generic [ref=e230]:
              - generic [ref=e231]: 1 p.m. Blow glass and sip brews
              - generic [ref=e232]:
                - text: Along the French Broad River, in former warehouses, mills and shipping containers, is the
                - link "River Arts District" [ref=e233] [cursor=pointer]:
                  - /url: https://www.riverartsdistrict.com/
                - text: ", a one-mile stretch of galleries and studios for more than 200 artists. If you visit on the"
                - link "second Saturday" [ref=e234] [cursor=pointer]:
                  - /url: https://www.riverartsdistrict.com/events/category/second-saturdays/
                - text: of the month, you’ll find live music, workshops and food and wine tastings. Visit the
                - link "North Carolina Glass Center" [ref=e235] [cursor=pointer]:
                  - /url: https://www.ncglasscenter.org/
                - text: for a
                - link "30-minute Hot Shop class" [ref=e236] [cursor=pointer]:
                  - /url: https://www.ncglasscenter.org/classes
                - text: and create a paperweight or drinking glass ($90), then check out
                - link "Foundation Woodworks" [ref=e237] [cursor=pointer]:
                  - /url: https://foundationwoodworks.com/
                - text: for wooden kitchenware, sculptures and jewelry. Nearby, at the
                - link "Hi-Wire Brewing AVL Beer Garden" [ref=e238] [cursor=pointer]:
                  - /url: https://hiwirebrewing.com/rad-beer-garden-asheville/
                - text: ", choose from 24 taps (from $3 for a four-ounce pour) among mural-covered shipping containers, while snacking on fried brussels sprouts ($8) or smoked barbecue over a cornbread waffle ($15) from the onsite"
                - link "Foothills Local Meats food truck" [ref=e239] [cursor=pointer]:
                  - /url: http://foothillslocalmeats.com/food-truck-rad
                - text: . Afterward, play a game of bocce or pinball.
            - figure "scoop-picture" [ref=e241]:
              - img "A garden is cluttered with various signs and portraits and sections of fences. In the foreground is a blue edged sign that reads" [ref=e245]
              - generic [ref=e246]: Peace Gardens & Market
            - generic [ref=e247]:
              - generic [ref=e248]: 4 p.m. Explore Affrilachia
              - generic [ref=e249]:
                - text: Coined by the Kentucky poet Frank X. Walker, “Affrilachia” refers to the cultural contributions of local African Americans to the Appalachian South, which is often portrayed as predominantly white. With hopes of reinvigorating Affrilachia, DeWayne Barton, founder of the
                - link "Hood Huggers International" [ref=e250] [cursor=pointer]:
                  - /url: https://www.hoodhuggers.com/
                - text: tour company, leads walking and driving tours, like the
                - link "Burton Street tour" [ref=e251] [cursor=pointer]:
                  - /url: https://www.hoodhuggers.com/tours/
                - text: ($30), which explores the neighborhood founded in 1912 by Edward W. Pearson, a businessman and former Buffalo Soldier (the name given to members of the historic Black U.S. Army regiments). Cliff Cotton, Pearson’s grandson, greets tour-goers at the Burton Street Community Center with tales of his grandfather, who founded Asheville’s first Black semi-pro baseball team. The tour also visits the
                - link "Peace Gardens & Market" [ref=e252] [cursor=pointer]:
                  - /url: https://www.urbanpeacegardens.org/
                - text: ", part community garden, part outdoor museum."
            - generic [ref=e253]:
              - generic [ref=e254]: 7:30 p.m. Sample pinxtos and bread pudding
              - generic [ref=e255]:
                - text: Many visitors think that dining in Asheville must include a meal created by Katie Button, the James Beard Award-winning chef who helped put the city’s dining scene on the national stage when she opened the Spanish restaurant
                - link "Cúrate Bar de Tapas" [ref=e256] [cursor=pointer]:
                  - /url: https://curatetapasbar.com/
                - text: in 2011. Reservations are sometimes hard to snag, so shoot for a table at the nearby sister restaurant,
                - link "La Bodega by Cúrate" [ref=e257] [cursor=pointer]:
                  - /url: https://curatetapasbar.com/la-bodega/
                - text: . The dinner menu offers Basque pintxos, including mejillones, spicy mussels served with a warm baguette ($16) and pescadito frito, fried anchovies with green peppercorn mayo ($14). Or journey through pinxto culture with the chef’s tasting menu ($65; optional wine pairing, $35). Save room for s’mores ($16) or bourbon pecan cheesecake ($12) at
                - link "Crave Dessert Bar" [ref=e258] [cursor=pointer]:
                  - /url: https://www.cravedessertbar.com/asheville-menu/
                - text: ", a five-minute walk away."
            - generic:
              - figure "scoop-picture"
            - generic [ref=e259]:
              - generic [ref=e260]: 10:30 p.m. Dance the night away
              - generic [ref=e261]:
                - text: Known for its Sunday drag brunch parties, downtown’s
                - link "Asheville Beauty Academy" [ref=e262] [cursor=pointer]:
                  - /url: https://www.avlbeautyacademy.com/
                - text: "also encourages folks to stay up late. The dance club and bar got its name from the building’s former life as a beauty academy in the 1950s, but today, the L.G.B.T.Q.-focused space welcomes guests to join Saturday night themed parties that might include a Hip-Hop Vinyl Party ($5 cover). House or draft cocktails (from $9) flow until 2 a.m., so you can experience the club’s tagline: The longer you stay, the better you look."
          - figure "scoop-picture" [ref=e263]:
