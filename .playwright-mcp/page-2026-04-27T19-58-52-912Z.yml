                - text: Charity Robey is a feature writer for the
                - emphasis [ref=e62]: Shelter Island Reporter
                - text: ", and a resident of the East End since 1985."
              - time [ref=e63]: July 3, 2025
            - paragraph [ref=e64]: A hundred miles from New York, the East End of Long Island is where New Yorkers go to escape. If the island is shaped like a striped bass, the East End is the forked tail, with an island set between the forks, thousands of acres of farmland and nature preserves, and towns that look more like coastal New England than New York. The East End has long attracted a summer crowd. Archaeological evidence suggests that some Native people may have come to the North Fork seasonally to fish before Europeans arrived in the 17th century. Today about 160,000 people live year-round on the East End, and although the summertime population swells to an estimated 300,000, the East End still offers breathing room. Thanks to the Peconic Land Trust, and county and town preservation programs that blocked development on approximately 40 percent of the land, the East End is where you come to do the things your grandmother recognized as wholesome activities, like walking on the beach, sailing, paddling, ogling extravagant houses and taking in the Atlantic coastline.
