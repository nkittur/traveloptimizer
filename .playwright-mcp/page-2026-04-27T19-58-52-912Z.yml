                - strong [ref=e292]:
                  - link "The Coecles Harbor Marine Water Trail" [ref=e293] [cursor=pointer]:
                    - /url: https://static1.squarespace.com/static/5b6495b655b02c39c3fca968/t/5b64a5dbf950b7fbc7b34674/1533322716949/coeclesharbortrailmap.pdf
                - text: . Call ahead to reserve a kayak, paddles and safety vest from
                - strong [ref=e294]:
                  - link "Kayak Shelter Island" [ref=e295] [cursor=pointer]:
                    - /url: https://www.kayaksi.com/kayak-tours
                - text: (rates are $35 for single kayaks for two hours, $55 for tandems). For those who like a guide, Adam Mills, the owner, or Chris Stone, a former ferry captain, will accompany a four-person-or-fewer group ($300 for boats and guide) to make sure you don’t miss that osprey flying overhead with a fish in its talons, or get rocked by the wake of a passing motorboat. The water trail runs along a mostly undeveloped shoreline, in and out of pristine creeks with great blue herons above and schools of fish below. Taylor’s Island is a town park with a landing for your kayak, picnic tables and a rustic cabin with a porch for enjoying 360-degree water views of Coecles Harbor.
            - generic [ref=e297]:
              - img "A rock shelf with seashells on top and shrubbery around it. In the background is water and a shore with greenery." [ref=e299]
              - paragraph [ref=e302]: Taylor’s Island
            - generic [ref=e303]:
              - generic [ref=e304]: 3 p.m. “To live again in these wild woods…”
              - paragraph [ref=e306]:
                - text: Once you turn in your kayak, you are a 10-minute drive from the ancient, shady woods and gardens of
                - strong [ref=e307]: Sylvester Manor
                - text: ", a 17th-century provisioning plantation that produced food and lumber for the sugar trade using enslaved Africans and indentured laborers. It is now a center for historical research and an educational farm on 200 acres of fields, woods and trails. Here you can take a walk through"
                - strong [ref=e308]:
                  - link "Sculpture @ Sylvester Manor" [ref=e309] [cursor=pointer]:
                    - /url: https://www.sylvestermanor.org/sculpture/
                - strong [ref=e310]: .
                - text: There is no admission fee for the self-guided exhibit “Paradise Lost,” which continues through the summer. Sculptures, installations and photography by 23 artists appear along a one-mile trail on the banks of Gardiner’s Creek. This is the second year for this surprising and whimsical exhibit, which was created by the curator Tom Cugliani and features a new group of East End artists whose works inhabit and reference the land.
            - generic [ref=e312]:
              - img "A large vaselike sculpture, painted a deep Chinese red with vines carved on. There is greenery all around it." [ref=e314]
              - paragraph [ref=e317]: Broken Vessel, by Walter Channing
            - generic [ref=e318]:
              - generic [ref=e319]: 4 p.m. A lighthouse that looks like a bug
              - paragraph [ref=e321]:
                - text: It is a five-minute drive from Sylvester Manor to the North Ferry (allow 15 minutes in case of a line) for the ride back to Greenport, where you can park near the Greenport terminal. Reserve ahead and don’t be late for the
                - strong [ref=e322]:
                  - link "Bug Light Cruises and Tours" [ref=e323] [cursor=pointer]:
                    - /url: https://www.eastendseaport.org/cruises
                - text: ($75 for adults, $30 for children), leaving from the East End Seaport Museum at 5 p.m. sharp every Saturday. Long Beach Bar Lighthouse is called Bug Light because of its strong resemblance to an insect when viewed from afar. It’s a two-hour round trip aboard a fishing boat (porgies are often hauled aboard a few hours prior) with sunset views of the Shelter Island and Greenport shorelines and a close-up inspection of Orient’s still-working lighthouse. Built in 1870, the lighthouse was destroyed by fire in 1963, rebuilt and recommissioned in 1990. Proceeds from the boat tours support maintenance and improvements to Bug Light.
            - img "A man and a woman seen from behind stand by the rail on a boat, talking. A lighthouse is in the background." [ref=e327]
            - generic [ref=e328]:
              - generic [ref=e329]: 7 p.m. Beverages on the boardwalk
              - paragraph [ref=e331]:
                - text: Now that you are back on terra firma, walk a few steps from where you disembarked to
                - strong [ref=e332]:
                  - link "Port" [ref=e333] [cursor=pointer]:
                    - /url: https://www.portnorthfork.com/about
                - text: ", a restaurant with a waterside bar just off the Greenport boardwalk. Here you may enjoy the entertainments of docking ferries, sand-covered beachgoers, and the train and jitney riders coming and going while sipping glasses of sauvignon blanc ($18) or locally brewed summer ale ($9)."
            - img "An outdoor bar with a gazebolike structure. People mill about by the bar. The sign reads \"Port Waterfront.\"" [ref=e337]
            - generic [ref=e338]:
              - generic [ref=e339]: 8 p.m. A dinner of land and sea
              - paragraph [ref=e341]:
                - text: Fifteen years ago, Chef Noah Schwartz and his partner and sommelier Sunita Schwartz opened
                - strong [ref=e342]:
                  - link "Noah’s" [ref=e343] [cursor=pointer]:
                    - /url: https://www.chefnoahs.com/
                - text: in Greenport, a restaurant that says “local” with every bite. With 17 small plates and nine not-so-small on offer (local strawberries on arugula with toasted almond slivers and crunchy, bitter cocoa nibs, drizzled in a syrupy balsamic reduction for $20; sweet roasted beets with mint and orange topped with labneh, $18; seafood stew with sea scallops, littleneck clams, mussels, squid and a silky, spicy sauce to slurp, $48), the menu reflects the chef’s enduring relationships with local farms and fishers and is a showcase for the North Fork’s finest foods. The wine list has an excellent selection of the Long Island wines that grow together and go together with the local farm bounty.
            - img "Three tuna bites with avocado and rice on an elegant rectangular plate, cutlery and a napkin beside it." [ref=e347]
          - generic [ref=e348]:
            - img "A view from the walkway of a lighthouse; we see the ocean, a parking lot, greenery, a few structures by the lighthouse." [ref=e350]
            - paragraph [ref=e353]: Montauk Point Lighthouse sits at the state’s easternmost point and boasts great ocean vistas.
          - generic [ref=e354]: Advertisement
          - generic [ref=e355]:
            - heading "Sunday" [level=2] [ref=e356]
            - generic [ref=e357]:
              - generic [ref=e358]: 9 a.m. South of the border
              - paragraph [ref=e360]:
                - text: Today it’s Montauk or bust, using Shelter Island and the
                - strong [ref=e361]:
                  - link "North" [ref=e362] [cursor=pointer]:
                    - /url: https://northferry.com/
                - text: and
                - strong [ref=e363]:
                  - link "South Ferry" [ref=e364] [cursor=pointer]:
                    - /url: https://www.southferry.com/
                - text: as a 45-minute bridge to North Haven on the South Fork. Continue south, through the charming village of Sag Harbor, where before turning east, you should stop for huevos rancheros with sweet and lemony tomatillo salsa, refritos and eggs ($19.50) at
                - strong [ref=e365]:
                  - link "Estia’s Little Kitchen" [ref=e366] [cursor=pointer]:
                    - /url: https://estias.com/
                - text: ", just south of town. This 20-year-old Mexican lunch counter with a few indoor tables and a long row of picnic tables in its vegetable garden serves rich coffee and fluffy blueberry pancakes. An East End mainstay, Estia’s is still firing on all cylinders, and the house-made hot sauces will surely energize you."
            - generic [ref=e368]:
              - img "A ferry on the water, with cars and people aboard. The photo is taken from a dock, with a red life ring on a piling." [ref=e370]
              - paragraph [ref=e373]: The North Ferry
            - generic [ref=e374]:
              - generic [ref=e375]: 10 a.m. Climb sand dunes
              - paragraph [ref=e377]:
                - text: As you approach East Hampton, prepare mentally for 27 East, a road as famous for its scenery as for its traffic. Fortunately, you have avoided the heart of the Hamptons so after nine miles of farmstands and ocean vistas, and a left on Napeague Harbor Road, the Walking Dunes trailhead is marked with a sign at the end of the road.
                - strong [ref=e378]:
                  - link "Walking Dunes Trail" [ref=e379] [cursor=pointer]:
                    - /url: https://montauklibrary.org/the-walking-dunes/
                - text: is named for the formation of sand dunes on the Napeague Bay that prevailing winds shift three or four inches a year to the southeast. An easy 2.7-mile loop takes you over the dunes, past a forest buried in sand, through a native cranberry bog and back along the beach. On a clear day, you can see much of the East End from the highest dune, across Napeague Bay and all the way out to the privately owned Gardiner’s Island, where the 17th-century pirate Captain William Kidd buried his valuables.
            - img "Two people, seen from behind, walking on a narrow beach by an inlet; the water is on their left, short sand dunes with shrubs on their right." [ref=e383]
            - generic [ref=e384]:
              - generic [ref=e385]: 12 p.m. This is the end
              - paragraph [ref=e387]:
                - text: "Take 27 East for 11 more miles and you have reached The End:"
                - strong [ref=e388]:
                  - link "Montauk Point Lighthouse" [ref=e389] [cursor=pointer]:
                    - /url: https://montaukhistoricalsociety.org/montauk-point-lighthouse/plan-your-lighthouse-visit/
                - text: ", a site of many superlatives. The first U.S. president commissioned it, and in 1796, it became New York State’s first lighthouse. It sits at the state’s easternmost point, is as effective at warning ships away from the rocky shore as ever and boasts the best ocean vistas anywhere. The lighthouse is open daily from 10:30 a.m. to 4:30 p.m.; parking is $8, and admission is $15 for adults and $5 for children. The true East End experience is not complete without a stop at the"
                - strong [ref=e390]:
                  - link "Clam Bar" [ref=e391] [cursor=pointer]:
                    - /url: https://clambarhamptons.com
                - text: at Napeague for a roadside lobster roll ($42). Don’t miss taking a deep inhale of salty sea air before you start driving west to Riverhead.
            - img "A lobster roll that looks delicious, with a side of coleslaw and a lemon wedge by it. A plastic cup of beer and a wooden crate with condiments are also on the table." [ref=e395]
