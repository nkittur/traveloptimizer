                - text: The fun starts in Riverhead, the last exit on the Long Island Expressway, and a two-hour drive from New York City, if you are lucky with traffic. Riverhead is an up-and-coming town with an agricultural past and a downtown riverwalk along the Peconic River. Head east toward Orient and make a few stops along the scenic, 28-mile drive from Riverhead. Stop at
                - strong [ref=e191]:
                  - link "Wickham’s Fruit Farm" [ref=e192] [cursor=pointer]:
                    - /url: http://wickhamsfruitfarm.com
                - link [ref=e193] [cursor=pointer]:
                  - /url: http://wickhamsfruitfarm.com
                - text: in Cutchogue for Fourth of July cherries and
                - strong [ref=e194]:
                  - link "Latham Farm" [ref=e195] [cursor=pointer]:
                    - /url: https://www.lathamfarms.org/
                - strong [ref=e196]: s
                - text: in Orient for just-picked berries. Both farms are run by families who have worked their land for more than a century. Take a walk through the charming village of
                - strong [ref=e197]:
                  - link "Orient" [ref=e198] [cursor=pointer]:
                    - /url: https://oysterpondshistoricalsociety.org/
                - text: ", with views of Orient Harbor, visit the exhibits and grounds of the"
                - strong [ref=e199]:
                  - link "Oysterponds Historical Society" [ref=e200] [cursor=pointer]:
                    - /url: https://oysterpondshistoricalsociety.org/hours-and-directions/
                - text: ($10 admission) and stop in at
                - strong [ref=e201]:
                  - link "Orient" [ref=e202] [cursor=pointer]:
                    - /url: https://www.orientlinenco.com
                - link [ref=e203] [cursor=pointer]:
                  - /url: https://www.orientlinenco.com
                - strong [ref=e204]:
                  - link "Linen Company" [ref=e205] [cursor=pointer]:
                    - /url: https://www.orientlinenco.com
                - text: ", where the textile teacher and designer Janet Markarian offers a rustic assortment of tea towels, baby bibs, aprons and shower curtains that beg to be given as gifts."
