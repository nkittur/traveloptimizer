              - paragraph [ref=e228]: Greenport Harbor Brewing Company
            - generic [ref=e229]:
              - generic [ref=e230]: 7:30 p.m. Dine overlooking a “crick”
              - paragraph [ref=e232]:
                - text: From Greenport, it’s a 25-minute drive on the farm-lined North Road to
                - strong [ref=e233]:
                  - link "The Old Mill Inn" [ref=e234] [cursor=pointer]:
                    - /url: http://www.oldmillnorthfork.com
                - link [ref=e235] [cursor=pointer]:
                  - /url: http://www.oldmillnorthfork.com
                - text: (you will need a reservation) at the end of West Mill Road in Mattituck. Built alongside the creek and powered by tidal flow, the mill was converted to a speakeasy during Prohibition. By the turn of the 21st century, the water was getting perilously close to the mill before the structure was raised, restored and reopened in May. The food lives up to the incomparable setting. As you tuck into plump, cornmeal-battered fried oyster sliders on a sweet Hawaiian roll, with spicy housemade aioli and smoked cabbage slaw ($21), smoked beet dip with labneh and cured egg yolk served with pita ($16), and smashed artichoke with ricotta and herb salsa ($19), it may occur to you that a) someone in the kitchen knows how to fry an oyster, and b) it is fun to sit at a table that looks out on a creek. Or is it an inlet? On the East End, it’s called a creek, and North Fork old-timers would call it a “crick.”
            - img "A plate of three sliders and a glass of white wine. A window is in the background and there is a glimpse of the water through it." [ref=e239]
