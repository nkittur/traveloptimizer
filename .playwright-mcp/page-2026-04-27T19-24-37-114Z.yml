          - paragraph [ref=e66]: Yes, Paris is always a good idea.
          - paragraph [ref=e67]: But Bucharest, Romania (the “little Paris of the East”), has a lively bar scene and Belle Époque architecture—and draws a fraction of the crowds. Japan’s Sado Island surprises with pristine white-sand beaches and relaxing onsens and has none of the tourism congestion that plagues Kyoto. And St. Louis’s arts and culture offerings rival those in much larger cities.
          - paragraph [ref=e68]: Isn’t it time these places got their due?
          - paragraph [ref=e69]: In 2026, we want to lessen the burden on overtouristed destinations and expand visitation to more varied spots across the world. Read on to discover 24 emerging regions and overlooked locales—as well as the resources and recommendations to make these trips a reality. We chose these places because they allow for this kind of responsible travel, yes, but also because they will inspire you to start planning your next great adventure right now. —Edited by Ellen Carpenter
          - generic [ref=e70]: ADVERTISEMENT
          - figure [ref=e73]:
            - img "WTG-26-Adelaide-Jack-Fenby-1x1.jpg" [ref=e76]
            - generic [ref=e77]:
              - paragraph [ref=e79]: At Shōbōsho in Adelaide, diners can try cocktails made from yuzushu, a yuzu liqueur.
              - paragraph [ref=e81]: Photo by Jack Fenby
          - paragraph
          - heading "Adelaide, Australia" [level=2] [ref=e82]
          - paragraph [ref=e83]: Aboriginal heritage, live music, and a flourishing food-and-wine scene meet on South Australia’s coast.
          - paragraph [ref=e84]: Historically, Adelaide, the culturally rich coastal capital of the state of South Australia, has never been as accessible as the country’s other gleaming metropolises. But that changed in December 2025, when United Airlines launched direct flights from San Francisco—the Australian region’s first-ever nonstop option from the U.S.
          - paragraph [ref=e85]:
            - text: Adelaide’s story begins with the Kaurna people, whose history travelers can learn about at the Aboriginal cultural center
            - link "Yitpi Yartapuultiku" [ref=e86] [cursor=pointer]:
              - /url: https://www.cityofpae.sa.gov.au/about/major-projects/yitpi-yartapuultiku
            - text: ", which opened in June 2025 after recent reconciliation efforts. The name, meaning “Soul of Port Adelaide,” nods to its riverside location, where visitors can hike the restored shoreline habitat and take in Aboriginal art, along with dance and music performances, as part of the center’s programming."
          - generic [ref=e87]: ADVERTISEMENT
          - paragraph [ref=e88]:
            - text: Music is woven into Adelaide’s DNA. The capital marked a decade as Australia’s only UNESCO City of Music in 2025, and its musical chops are on display at the
            - link "Thebarton Theatre" [ref=e89] [cursor=pointer]:
              - /url: https://thebartontheatre.com.au/
            - text: —affectionately known as the “Thebby"—which reopened in October after an $8 million transformation, bringing new life to the nearly century-old venue. And each year, the city’s stages swell with international talent during
            - link "Adelaide Fringe" [ref=e90] [cursor=pointer]:
              - /url: https://adelaidefringe.com.au/
            - text: ", Australia’s biggest arts festival, and"
            - link "WOMADelaide" [ref=e91] [cursor=pointer]:
              - /url: https://www.womadelaide.com.au/
            - text: ", a global celebration of music, arts, and dance."
          - paragraph [ref=e92]:
            - text: Adelaide is also quietly evolving into one of Australia’s best food cities, thanks to top players like
            - link "Shōbōsho" [ref=e93] [cursor=pointer]:
              - /url: https://www.shobosho.com.au/
            - text: ", a Japanese izakaya restaurant that turns out salmon tataki on an indoor yakitori grill, and newcomers such as"
            - link "Homeboy" [ref=e94] [cursor=pointer]:
              - /url: https://www.homeboyco.com/
            - text: ", a coffee and “sando” shop run by 20-year-old TikTok star Tom Oswald. In 2026, the 19th-century"
            - link "Central Market" [ref=e95] [cursor=pointer]:
              - /url: https://adelaidecentralmarket.com.au/
            - text: ", South Australia’s most visited attraction, will unveil a major expansion, doubling its footprint."
          - paragraph [ref=e96]:
            - text: The culinary story continues just beyond the city limits in Australia’s famous wine country. In McLaren Vale, sip shiraz at
            - link "Lino Ramble" [ref=e97] [cursor=pointer]:
              - /url: https://www.linoramble.com.au/
            - text: ’s tasting room and pair braised kangaroo tail with a local chenin blanc at the
            - link "Salopian Inn" [ref=e98] [cursor=pointer]:
              - /url: http://salopian.com.au/
            - text: .
          - paragraph [ref=e99]:
            - text: "Where to stay: Opened in the city center in 2024, the"
            - link "Adelaide Marriott" [ref=e100] [cursor=pointer]:
              - /url: https://www.marriott.com/en-us/hotels/adlmc-adelaide-marriott-hotel/overview/
            - text: was carefully built into a historic post office, preserving the existing 152-year-old structure. There are references throughout to the post office (the
            - link "Penny Blue" [ref=e101] [cursor=pointer]:
              - /url: https://www.pennybluerestaurant.com/
            - text: restaurant, named for a rare blue stamp) and to the surrounding wine country (interior colors range from leaf green to dark red, following a vine’s life cycle). —Aislyn Greene
