          - paragraph
          - heading "Da Nang, Vietnam" [level=2] [ref=e260]
          - paragraph [ref=e261]: Surf breaks, street eats, and jungle trails meet in this major port city.
          - paragraph [ref=e262]:
            - text: The largest city in central
            - link "Vietnam" [ref=e263] [cursor=pointer]:
              - /url: https://www.afar.com/travel-guides/vietnam/guide
            - text: ", Da Nang is framed by 40 miles of golden, Miami Beach–like coastline. Long a popular getaway for those living in Vietnam—a place to swim and surf and feast on noodle soups like mi quang—it’s finally capturing global attention after decades of being overlooked by international travelers headed to Hanoi and Ho Chi Minh City. Five airlines, including Emirates and Philippine Airlines, launched new flights in 2025 connecting Da Nang to Bangkok, Manila, and other cities in Asia. In 2026,"
            - link "Nobu" [ref=e264] [cursor=pointer]:
              - /url: https://www.nobuhotels.com/hotel-collection/nobu-hotel-danang/
            - text: is expected to open a 200-room beachfront hotel and
            - link "Mandarin Oriental" [ref=e265] [cursor=pointer]:
              - /url: https://www.mo-residencesdanang.com/
            - text: will debut 22 luxury residences.
          - paragraph [ref=e266]:
            - text: The region is full of natural wonders. Just four miles south of downtown are the Marble Mountains, five limestone outcrops with pagodas, grottoes, and Buddhist shrines hidden inside caves. To the north is the Son Tra Peninsula, a coastal rainforest and nearly 11,000-acre nature reserve. Book a wildlife-focused tour with the woman-owned ecotourism company
            - link "Next Continent" [ref=e267] [cursor=pointer]:
              - /url: https://nextcontinenttours.com/
            - text: to see critically endangered red-shanked douc langur monkeys while trekking along the coast.
          - generic [ref=e268]: ADVERTISEMENT
          - paragraph [ref=e269]:
            - text: Da Nang is also a gateway to Hoi An, a UNESCO World Heritage site just 40 minutes south. The ancient town was a bustling port from the 1400s to the 1800s, and its maze-like streets are filled with remarkably well-preserved buildings mixing Chinese, Vietnamese, Japanese, and European architectural styles. A ticket to enter
            - link "Hoi An Ancient Town" [ref=e270] [cursor=pointer]:
              - /url: https://whc.unesco.org/en/list/948/
            - text: (about $5) grants visits to five of 22 heritage attractions, including the 17th-century Phuc Kien Assembly Hall, a pagoda with a green tiled roof and intricate wooden carvings of people and animals. At night, take a boat ride along the Hoai River surrounded by floating, glowing lanterns.
          - paragraph [ref=e271]:
            - text: "Where to stay:"
            - link "InterContinental Da Nang" [ref=e272] [cursor=pointer]:
              - /url: https://www.ihg.com/intercontinental/hotels/us/en/danang-city/dadha/hoteldetail
            - text: ", the only luxury hotel set in the rainforest, is a perfect base for spotting wildlife. Guests can also indulge in an eight-course menu (scallop mousseline, wagyu beef) at the city’s only Michelin-starred restaurant,"
            - link "La Maison 1888" [ref=e273] [cursor=pointer]:
              - /url: https://www.danang.intercontinental.com/dining/la-maison-1888/
            - text: . At the beachfront
            - link "Tia Wellness Resort" [ref=e274] [cursor=pointer]:
              - /url: https://tiawellnessresort.com/en/
            - text: ", meanwhile, enjoy spa treatments, cooking classes, and wellness activities while staying in private villas. —Liz Provencher"
          - figure [ref=e277]:
