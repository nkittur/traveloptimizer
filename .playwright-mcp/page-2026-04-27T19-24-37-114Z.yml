          - paragraph
          - heading "Eleuthera, Bahamas" [level=2] [ref=e317]
          - paragraph [ref=e318]: Nassau’s quieter cousin promises pretty pink-sand beaches and plenty of solitude.
          - paragraph [ref=e319]: About 70 miles east of Nassau, the Bahamian island of Eleuthera draws its name from the Greek word eleutheria, which means freedom. And that’s exactly what travelers will feel here. Even with the summer 2024 opening of Lighthouse Point on Eleuthera’s southernmost tip (Disney’s latest private cruise destination in the Bahamas), there’s a sense of place and peace here that’s far removed from the mass tourism that can overrun other Bahamian destinations such as Nassau and Grand Bahama during high season.
          - paragraph [ref=e320]: It’s easy to spend a few days exploring Eleuthera’s narrow, 110-mile spine, from tony Harbour Island—with its tidy grid of streets lined with pastel-colored cottages that conjure both New England and Key West—to Governor’s Harbour, established in 1648, one of the oldest settlements in the Bahamas.
          - generic [ref=e321]: ADVERTISEMENT
          - paragraph [ref=e322]:
            - text: Travelers will want to stop at roadside stands for flamingo-pink conch shells or fresh mangoes and sapodillas. Adventure seekers should make their way to the precipice above Sapphire Blue Hole to take the leap into one of several natural sinkholes—reminiscent of Mexico’s cenotes—pocked into Eleuthera’s karst topography. There’s also fine dining for those who want to get dressed up and clink champagne glasses; book a table at the
            - link "Fig Tree" [ref=e323] [cursor=pointer]:
              - /url: https://www.thepotlatchclub.com/restaurant/
            - text: in the Potlatch Club, a mid-century modern social club set on a former pineapple plantation and reborn in June 2024 as one of Eleuthera’s most luxurious boutique resorts.
          - paragraph [ref=e324]: Mostly, however, the island’s timeless appeal comes from breathing easy knowing there’s nowhere urgent to be, lingering on flour-white and blush-pink beaches with hardly a soul in sight. It’s something that will come naturally, the Potlatch Club’s co-owner, Hans Febles, assures guests. “Eleuthera is not a place you come to do,” he says. “It’s a place you come to be.”
          - paragraph [ref=e325]:
            - text: "Where to stay: Ben Simmons and his wife, Charlie, opened the"
            - link "Farm" [ref=e326] [cursor=pointer]:
              - /url: https://www.littleislandhotels.com/the-farm
            - text: in late 2024, one of four properties in their Little Island Hotels chain. Its 12 elegant wooden cottages are surrounded by fruit trees and are just a five-minute stroll to the beach. Most of the restaurant’s produce—avocados, eggplants, and more—is grown on-site. Just across the sound, fronting Pink Sand Beach on Harbour Island,
            - link "Coral Sands Inn & Cottages" [ref=e327] [cursor=pointer]:
              - /url: https://www.coralsands.com/
            - text: ’ recent renovations fully embrace tropical maximalism, with seashell details and shades of pink and sherbet. The eight sea cottages have private paths that lead directly to the sand. —Terry Ward
          - figure [ref=e330]:
            - img "WTG-26-East-London-Uncle-Hons-1x1.jpg" [ref=e333]
