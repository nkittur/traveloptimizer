          - paragraph
          - generic [ref=e339]: ADVERTISEMENT
          - heading "Far East London" [level=2] [ref=e340]
          - paragraph [ref=e341]: A new cultural quarter and a slew of creative restaurants make this the city’s most exciting area.
          - paragraph [ref=e342]:
            - text: "London’s epicenter of cool has been on a steady eastward march for decades, and now, culture lovers will want to venture a bit farther: Sadiq Khan, London’s mayor, invested more than £1 billion ($1.33 billion) to transform the"
            - link "Queen Elizabeth Olympic Park" [ref=e343] [cursor=pointer]:
              - /url: https://www.queenelizabetholympicpark.co.uk/?utm_source=goolge&utm_medium=local&utm_campaign=glocal
            - text: (where the 2012 Games were held) into the East Bank cultural quarter. Located east of Hackney and Bethnal Green, it’s easier than ever to get there, thanks to the Elizabeth line, which links Soho to Stratford in 20 minutes.
          - paragraph [ref=e344]:
            - text: February 2025 saw the opening of
            - link "Sadler’s Wells East" [ref=e345] [cursor=pointer]:
              - /url: https://www.sadlerswells.com/your-visit/sadlers-wells-east/welcome-to-sadlers-wells-east/
            - text: ", an outpost of London’s premier dance theater, followed in May by the"
            - link "V&A East Storehouse" [ref=e346] [cursor=pointer]:
              - /url: https://www.vam.ac.uk/east/storehouse/visit
            - text: ", which brings together 250,000 artifacts from the Victoria & Albert collection, ranging from samurai swords to Elton John’s stage costumes. Its nontraditional storage-facility aesthetic has earned it (loving) comparisons from architecture critics, who have likened it to an Ikea warehouse and a cabinet of curiosities. Visitors can book an appointment to interact with items as part of its radical “order an object” program. Next up, V&A East, an associated museum with rotating exhibits, will open in spring 2026, with the new home of the BBC Music Studios debuting nearby later in the year."
          - paragraph [ref=e347]:
            - text: Beyond cultural institutions, the surrounding postindustrial neighborhoods of Hackney Wick and Fish Island (actually a peninsula bounded by canals) have been bubbling with ground-level creativity for years. Recent openings include the Black-owned community hub
            - link "Badu Café" [ref=e348] [cursor=pointer]:
              - /url: https://www.queenelizabetholympicpark.co.uk/eat-drink/badu-cafe
            - text: ;
            - link "Unlock" [ref=e349] [cursor=pointer]:
              - /url: https://unlock2021.me/
            - text: ", a pizzeria and cocktail bar run by two Neapolitan siblings; the Chinese-Texas-style"
            - link "Uncle Hon’s BBQ" [ref=e350] [cursor=pointer]:
              - /url: https://unclehonsbbq.com/
            - text: ; and
            - link "Inis" [ref=e351] [cursor=pointer]:
              - /url: https://inisfishisland.com/
            - text: ", a seasonal Irish spot with a killer full Irish breakfast. Between meals, visit the not-for-profit"
            - link "Community Sauna Baths" [ref=e352] [cursor=pointer]:
              - /url: https://www.community-sauna.co.uk/
            - text: and
            - link "Coven" [ref=e353] [cursor=pointer]:
              - /url: https://covenhackney.com/home
            - text: ", a Black-owned queer venue."
          - generic [ref=e354]: ADVERTISEMENT
          - paragraph [ref=e355]:
            - text: "Where to stay: The 145-room"
            - link "Stratford, Autograph Collection" [ref=e356] [cursor=pointer]:
              - /url: https://www.marriott.com/en-us/hotels/lonsh-the-stratford-autograph-collection/overview/
            - text: pairs Scandinavian-inspired interiors with plant-filled rooftop terraces. In May 2025, the hotel welcomed
            - link "Kokin" [ref=e357] [cursor=pointer]:
              - /url: https://kokin.co.uk/
            - text: ", a wood-fired Japanese restaurant offering Portuguese bluefin tuna collar and tempura lobster. The"
            - link "Gantry London, Curio Collection by Hilton" [ref=e358] [cursor=pointer]:
              - /url: https://www.hilton.com/en/hotels/longaqq-the-gantry-london/
            - text: sits just two minutes from the bustling Stratford International Station and has 291 rooms and suites, as well as a Colombian coffee shop, a steak house, an Afro-Caribbean restaurant and music venue, and a “sparkling bar” serving U.K.-made sparkling wine and other fizzy drinks. —Nicholas DeRenzo
          - figure [ref=e361]:
