          - paragraph
          - heading "Albuquerque, New Mexico" [level=2] [ref=e116]
          - paragraph [ref=e117]: In this high-desert city, Route 66 winds its way past contemporary galleries and updated vintage hotels.
          - paragraph [ref=e118]:
            - link "New Mexico" [ref=e119] [cursor=pointer]:
              - /url: https://www.afar.com/travel-guides/united-states/new-mexico/guide
            - text: "’s largest city is a crossroads in more ways than one: where the Chihuahuan Desert meets the Colorado Plateau, where the adobe buildings of Old Town stand next to midcentury modern motor courts on Route 66. But Albuquerque, a common launching point to Santa Fe and Taos, is a destination in its own right."
          - paragraph [ref=e120]:
            - text: Ahead of the Route 66 Centennial in 2026, Albuquerque’s Department of Arts & Culture partnered with Santa Fe’s immersive art organization
            - link "Meow Wolf" [ref=e121] [cursor=pointer]:
              - /url: https://meowwolf.com/visit/santa-fe
            - text: to tap local artists to develop large-scale murals and interactive art installations that will line the city’s 18-mile stretch of Route 66 (also known as Central Avenue), from the new
            - link "Route 66 Visitor Center" [ref=e122] [cursor=pointer]:
              - /url: https://www.cabq.gov/artsculture/route-66-visitor-center
            - text: to the Singing Arrow neighborhood. The city is working with the collaborative arts group Friends of the Orphan Signs to revitalize historic neon signage—and keep Albuquerque shining bright.
          - generic [ref=e123]: ADVERTISEMENT
          - paragraph [ref=e124]:
            - text: Must-visit spots in town include the neon-lit
            - link "KiMo Theatre" [ref=e125] [cursor=pointer]:
              - /url: https://www.cabq.gov/artsculture/kimo
            - text: ", a pueblo deco downtown landmark that was recently restored and hosts everything from rock shows to ballets; Old Town’s"
            - link "Albuquerque Museum" [ref=e126] [cursor=pointer]:
              - /url: https://www.cabq.gov/artsculture/albuquerque-museum/
            - text: ", where galleries tell the story of the city through artifacts and interactive exhibits;"
            - link "A. Hurd Gallery" [ref=e127] [cursor=pointer]:
              - /url: https://ahurdgallery.com/
            - text: ", displaying artist Anthony Hurd’s depictions of queer cowboys and a reimagined West; and"
            - link "Teddy Roe’s" [ref=e128] [cursor=pointer]:
              - /url: https://www.teddyroes.com/
            - text: ", a 1920s-style speakeasy in the alley behind Italian restaurant"
            - link "M’tucci’s Bar Roma" [ref=e129] [cursor=pointer]:
              - /url: https://www.mtuccis.com/
            - text: ", which itself occupies a former service station on Route 66."
          - paragraph [ref=e130]:
            - text: "Where to stay: The newly renovated"
            - link "Arrive Albuquerque" [ref=e131] [cursor=pointer]:
              - /url: https://www.arrivehotels.com/hotels/albuquerque
            - text: is a former Route 66 motor inn, now reborn as a retro-chic 137-room, six-story hotel with a pool and a gallery highlighting the work of Southwestern artists. Its restaurant,
            - link "DWTNR Cocktail Bar & Lounge" [ref=e132] [cursor=pointer]:
              - /url: https://www.dwtnrbar.com/
            - text: ", serves Southwestern and Pan-Asian plates such as coconut shrimp toast made with fried milk bread, and green chili smash burgers with hatch chili Velveeta. —Matt Kirouac"
          - figure [ref=e135]:
            - img "WTG-26-Birmingham-Corey-Favino-Jesse-Legg.jpg" [ref=e138]
            - generic [ref=e139]:
              - paragraph [ref=e141]: In Birmingham, get a good night’s sleep at the Painted Lady hotel and try Gulf yellowfin tuna with Cara Cara oranges at Bayonet.
              - paragraph [ref=e143]: Photos by Corey Favino (L); Jesse Legg (R)
          - paragraph
          - heading "Birmingham, Alabama" [level=2] [ref=e144]
          - paragraph [ref=e145]: This Southern hub is hungry for the title of top U.S. food city.
          - generic [ref=e146]: ADVERTISEMENT
          - paragraph [ref=e147]:
            - text: "Pork ribs in red sauce, oysters on ice, fried green tomatoes, sugary French patisserie: Birmingham,"
            - link "Alabama" [ref=e148] [cursor=pointer]:
              - /url: https://www.afar.com/travel-guides/united-states/alabama/guide
            - text: ", is quietly obsessed with food. “I wouldn’t say the cat’s out of the bag, but there’s a paw,” says Melissa Booth Hall with a laugh. Hall is codirector of the Southern Foodways Alliance, which protects and promotes Southern culinary culture and hosts an annual symposium in Birmingham that draws hundreds of chefs. “Serious foodies know Birmingham,” she says, “but I think [most] travelers are just waking up.”"
          - paragraph [ref=e149]:
            - text: Visitors should rise early on Saturdays for the downtown
            - link "Farmers Market at Pepper Place" [ref=e150] [cursor=pointer]:
              - /url: https://pepperplacemarket.com/
            - text: ", with about 80 farmers and vendors. From there, make a beeline to"
            - link "Continental Bakery," [ref=e151] [cursor=pointer]:
              - /url: https://www.continental-bakery.com/
            - text: a mainstay of the English Village neighborhood, to get cinnamon rolls and wild-yeast sourdough loaves fresh from the oven.
          - paragraph [ref=e152]:
            - text: For restaurants in town, James Beard Award nominations grow like the kudzu vine. José Medina Camacho, cofounder of the Mexican spirits–focused cocktail bar
            - link "Adiõs" [ref=e153] [cursor=pointer]:
              - /url: https://www.adiosbham.com/
            - text: ", was a 2025 finalist for Outstanding Professional in Beverage Service, and multiple Best Chef Southeast winners call the city home. One is Frank Stitt, a Southern food legend and owner of the Italian spot"
            - link "Bottega" [ref=e154] [cursor=pointer]:
              - /url: https://bottegarestaurant.com/
            - text: and the French bistro
            - link "Chez Fonfon" [ref=e155] [cursor=pointer]:
              - /url: https://www.fonfonbham.com/
            - text: . Adam Evans won the award in 2022 for his
            - link "Automatic Seafood & Oysters" [ref=e156] [cursor=pointer]:
              - /url: https://www.automaticseafood.com/
            - text: and co-opened a second spot,
            - link "Current Charcoal Grill" [ref=e157] [cursor=pointer]:
              - /url: https://www.currentcharcoalgrill.com/
            - text: ", in 2024."
          - paragraph [ref=e158]:
            - text: Another chef gaining recognition is Rob McDaniel, a multiple James Beard Award semifinalist, who opened his second restaurant, the seafood-forward
            - link "Bayonet" [ref=e159] [cursor=pointer]:
              - /url: https://bayonetbham.com/
            - text: ", in 2025. “Our oyster list is extensive,” McDaniel says. “We also break down fish in front of guests. It’s important to who we are.”"
          - generic [ref=e160]: ADVERTISEMENT
          - paragraph [ref=e161]:
            - text: Dining downtown has never been more vibrant. Recent openings include
            - link "Armour House" [ref=e162] [cursor=pointer]:
              - /url: https://www.armour-house.com/
            - text: —a brasserie with an attached craft cocktail bar,
            - link "Pogo" [ref=e163] [cursor=pointer]:
              - /url: https://www.armour-house.com/pogo
            - text: —and
            - link "Johin’na" [ref=e164] [cursor=pointer]:
              - /url: https://www.johinnabhm.com/
            - text: ", a Japanese restaurant offering an omakase experience, oysters, and sushi (the Birmingham roll has crab, cucumber, fried catfish, and spicy mayo)."
          - paragraph [ref=e165]:
            - text: "Where to stay:"
            - link "Elyton Hotel, Autograph Collection" [ref=e166] [cursor=pointer]:
              - /url: https://www.marriott.com/en-us/hotels/bhmak-elyton-hotel-autograph-collection/overview/
            - text: is set in a 1909 skyscraper of molded terra-cotta and pink granite. Located downtown in the theater district, it has 111 guest rooms and six suites.
            - link "The Painted Lady" [ref=e167] [cursor=pointer]:
              - /url: https://www.thepaintedladyhotel.com/
            - text: debuted downtown in 2025 with 22 whimsically decorated rooms inside the historic Eyer-Raden Building. The hotel’s name is a nod to Louise C. Wooster, a brothel owner who went on to become a town hero as a nurse during a cholera outbreak in 1873. —Jenny Adams
          - figure [ref=e170]:
            - img "People walk on cobblestoned streets and sit at a row of tables outside a restaurant in the old city of Bucharest, Romania" [ref=e173]
            - generic [ref=e174]:
              - paragraph [ref=e176]: Bucharest’s Old Town is full of neoclassical and neobaroque buildings, including the grand CEC Palace, one of the city’s most famous landmarks.
              - paragraph [ref=e178]: Photo by Alexander Spatari/Getty Images
          - paragraph
          - heading "Bucharest, Romania" [level=2] [ref=e179]
          - paragraph [ref=e180]: With a focus on restoring prewar buildings and a bustling nightlife, the former Communist capital lives up to its title as the “little Paris of the East.”
          - generic [ref=e181]: ADVERTISEMENT
          - paragraph [ref=e182]: A 1930 printing house turned Gen Z culture hub. A World War II German headquarters transformed into a stunning hotel. A former sheet-metal factory brought back to life as a neon-lit nightlife destination. In recent years, Bucharest has converted industrial buildings into eclectic spaces, particularly in and around the Cișmigiu district.
          - paragraph [ref=e183]:
            - text: At Palatul Universul, the former printing house, visitors should order a cocktail spotlighting Romanian-made pollen liqueur at
            - link "Fix Me a Drink" [ref=e184] [cursor=pointer]:
              - /url: https://fixmad.com/
            - text: ", attend a contemporary dance performance at"
            - link "Linotip" [ref=e185] [cursor=pointer]:
              - /url: https://linotip.ro/
            - text: ", and check out goods from local makers at Mezanin Space."
          - paragraph [ref=e186]:
            - text: A block from Boulevard Regina Elisabeta is No Room Taproom, a major player in the city’s growing craft-beer scene. And a few blocks away is
            - link "Bar Ton" [ref=e187] [cursor=pointer]:
              - /url: https://bar-ton.com/
            - text: ", a hip listening bar where patrons can spend an evening drinking vermouth-heavy cocktails while enjoying DJ sets. After sunset, the place to be is Platforma Wolff, a sheet-metal factory turned club, for dancing until morning."
          - paragraph [ref=e188]:
            - link "EVA Foundation" [ref=e189] [cursor=pointer]:
              - /url: https://evafoundation.art/
            - text: ", a new arts space dedicated to works by women, opened in October 2025 in a 1930s townhouse in the city center. The debut exhibition, Sirens, includes pieces by Judy Chicago and Jenny Holzer."
          - generic [ref=e190]: ADVERTISEMENT
          - paragraph [ref=e191]:
            - text: "The past few years have also seen more variety in Bucharest’s food scene as Romanian classics are newly interpreted: At"
            - link "Arzu," [ref=e192] [cursor=pointer]:
              - /url: https://arzu.ro/
            - text: in the old Jewish Quarter, diners can try stuffed bell peppers with a glass of Romanian mustoasă de măderat white wine. Or they can visit
            - link "Soro Lume" [ref=e193] [cursor=pointer]:
              - /url: https://sorolume.ro/
            - text: ", on the eastern side of the city, for mushroom-glazed pork cooked overnight in a wood-fired oven."
          - paragraph [ref=e194]:
            - text: "Where to stay: The"
            - link "Corinthia Bucharest" [ref=e195] [cursor=pointer]:
              - /url: https://www.corinthia.com/en-gb/bucharest/
            - text: opened in March 2025 in a Belle Époque building that opened in 1873 as the Grand Hotel du Boulevard. It was later used as a German headquarters during WWII and as the Ministry of Culture during Romania’s Communist era. Now, the 30-suite hotel has a skincare-focused spa and a restaurant in the art nouveau ballroom. —Erin Vivid Riley
          - figure [ref=e198]:
            - img "Buffalo has many changes in the works for 2026, including several in the downtown area." [ref=e201]
            - generic [ref=e202]:
              - paragraph [ref=e204]: Buffalo has many changes in the works for 2026, including several in the downtown area.
              - paragraph [ref=e206]: Photo by Matthew Digati/Visit Buffalo
          - paragraph
          - heading "Buffalo, New York" [level=2] [ref=e207]
          - paragraph [ref=e208]: The city’s African American Heritage Corridor gets revitalized with a reborn jazz club and first-of-its-kind Black radio museum, setting the tempo for wider change.
          - generic [ref=e209]: ADVERTISEMENT
          - paragraph [ref=e210]:
            - text: In Buffalo’s burgeoning Michigan Street African American Heritage Corridor, history isn’t just behind glass—it’s on the mic. The
            - link "Historic Colored Musicians Club & Jazz Museum" [ref=e211] [cursor=pointer]:
              - /url: https://www.thecoloredmusiciansclub.com/
            - text: ", one of the nation’s oldest Black-owned clubs, will reopen in spring 2026 after a three-year, $3.2 million overhaul. The renovation adds an elevator-accessible performance space, upgraded lighting and sound for live-streaming, and new interactive exhibits. Museum president George Scott says visitors are often surprised by how deep Buffalo’s jazz roots run; the club’s stage has welcomed icons such as Ella Fitzgerald alongside homegrown talent like Elvin Shepherd and Dodo Greene. “[The Club] is going to be a big factor in drawing people to Buffalo,” Scott says. “They may come for Niagara Falls, but they leave with a love of jazz.”"
          - paragraph [ref=e212]:
            - text: On the same block,
            - link "WUFO Black Radio History Collective" [ref=e213] [cursor=pointer]:
              - /url: https://www.wufoblackradiohistorycollective.org/
            - text: "will open in 2026 as the nation’s first museum dedicated to Black radio. Charting the evolution from reel-to-reel and cassettes to podcasts, it explores radio’s outsize influence on popular culture and civil rights. For WUFO owner Sheila Brown, the goal is simple: She wants visitors—especially young people—to leave “thinking that radio is still cool” and to understand the importance of “telling your own narrative.”"
          - paragraph [ref=e214]:
            - text: Change is afoot throughout the corridor. The 180-year-old
            - link "Michigan Street Baptist Church" [ref=e215] [cursor=pointer]:
              - /url: https://www.michiganstreetbaptistchurch.org/
            - text: ", whose founding members were actively engaged in the Underground Railroad, unveiled a major interior restoration in January 2025. In October 2025 the city secured an additional $12 million in funding for the corridor project to repave streets, widen sidewalks, add landscaping, and more. “The whole area is changing,” Brown says."
          - paragraph [ref=e216]:
            - text: That momentum can be felt citywide. The Buffalo Bills’ new $2.2 billion
            - link "Highmark Stadium" [ref=e217] [cursor=pointer]:
              - /url: https://www.highmarkstadiumny.com/
            - text: is expected to open in time for the 2026 NFL season, and the first phase of the 100-acre, $200 million
            - link "Ralph Wilson Park" [ref=e218] [cursor=pointer]:
              - /url: https://rwparkbuffalo.org/
            - text: will debut in 2026 along the Lake Erie shoreline with a pedestrian bridge and landscaped gardens. From the corridor to the lakefront, it’s clear Buffalo is ready for its next act.
          - generic [ref=e219]: ADVERTISEMENT
          - paragraph [ref=e220]:
            - text: "Where to stay: The"
            - link "Richardson Hotel" [ref=e221] [cursor=pointer]:
              - /url: https://therichardsonhotelbuffalo.com/
            - text: is set in a transformed 19th-century psychiatric hospital, a National Historic Landmark. Designed by Henry Hobson Richardson and with sprawling grounds by Frederick Law Olmsted, it’s now an 88-room retreat with Romanesque arches and original wood flooring. —Ashlea Halpern
          - figure [ref=e224]:
            - img "Hiker Hamilton Boyce walks past Tunnel Falls on the Eagle Creek Trail, cut into the basalt cliff behind the waterfall, in Columbia River Gorge National Scenic Area, Oregon." [ref=e227]
            - generic [ref=e228]:
              - paragraph [ref=e230]: The Columbia River Gorge has nearly 100 waterfalls, including Tunnel Falls.
              - paragraph [ref=e232]: Photo by Ethan Welty
          - paragraph
          - heading "Columbia River Gorge, Oregon and Washington" [level=2] [ref=e233]
          - paragraph [ref=e234]: Come for the outdoor adventure and scenic drives, stay for the seasonal restaurants in this majestic Pacific Northwest landscape.
          - paragraph [ref=e235]: “There is but one Columbia River Gorge [that] God put into this comparatively short space, [with] so many beautiful waterfalls, canyons, cliffs and mountain domes.” This is how engineer Samuel C. Lancaster described the volcano- and flood-forged gorge more than a century ago, and the sentiment remains relevant today.
          - generic [ref=e236]: ADVERTISEMENT
          - paragraph [ref=e237]: "Marking the border of Oregon and Washington, the Columbia River Gorge begins 30 miles east of Portland and packs a stunning amount of natural splendor into its 80 miles: wildflower meadows, moss-covered rainforests, sheer cliffs, and nearly 100 waterfalls. It’s no surprise that Lancaster and other visionaries built the nation’s first scenic byway here, the Historic Columbia River Highway, between 1913 and 1922."
          - paragraph [ref=e238]: While just a fraction of visitors make it past Multnomah Falls, near the western entrance to the gorge, those in the know continue east to riverside towns such as White Salmon and Hood River. Portions of the historic highway are now a state trail for car-free recreation; one standout section is the new Mitchell Point Tunnel, a 655-foot-long cliffside passageway with riverview arches that opened in March 2025.
          - paragraph [ref=e239]:
            - text: Hood River in particular is luring visitors with impressive culinary and beverage offerings. In 2023,
            - link "Hiyu Wine Farm" [ref=e240] [cursor=pointer]:
              - /url: https://hiyuwinefarm.com/
            - text: —a combination farm, tasting room, and restaurant serving multicourse seasonal meals—fetched a James Beard Award nomination for its wine program. From
            - link "Ferment Brewing Company" [ref=e241] [cursor=pointer]:
              - /url: https://fermentbrewing.com/
            - text: to
            - link "pFriem Family Brewers" [ref=e242] [cursor=pointer]:
              - /url: https://www.pfriembeer.com/
            - text: ", tasting rooms abound in this craft beer hub; Kings & Daughters’ new taproom, the"
            - link "Walled Garden" [ref=e243] [cursor=pointer]:
              - /url: https://www.kingsanddaughters.com/
            - text: ", opened in fall 2025."
          - paragraph [ref=e244]:
            - text: "Where to stay: The upscale outdoors hospitality company Under Canvas debuted its"
            - link "latest glamping outpost near White Salmon in 2025" [ref=e245] [cursor=pointer]:
              - /url: https://www.afar.com/hotels/in-depth-review-of-under-canvas-columbia-river-gorge-in-washington-state
            - text: . From April 23 to October 26, book one of its minimalist, Mount Hood–view tents, with evening s’mores and stargazing. For a cozy retreat, enjoy geothermal hot springs and snug rooms at
            - link "Bonneville Hot Springs Resort & Spa" [ref=e246] [cursor=pointer]:
              - /url: https://www.bonnevilleresorts.com/
            - text: ", which reopened in February 2025 after a renovation. Hood River welcomed"
            - link "Lightwell Hotel & Spa" [ref=e247] [cursor=pointer]:
              - /url: https://lightwellhotel.com/
            - text: in fall 2025. Located in a carefully restored 1904 building, it has 69 rooms and suites, a rooftop bar, and a spa with a hot tub, cold plunge, and sauna open to all guests. —Zoe Baillargeon
          - generic [ref=e248]: ADVERTISEMENT
          - figure [ref=e251]:
            - img "A street scene / vignette in Da Nang Vietnam photographed at night." [ref=e254]
            - generic [ref=e255]:
              - paragraph [ref=e257]: Da Nang’s streets are lined with food stalls, including Dua Ben Tre 196, which sells coconut jelly and coconut ice cream.
