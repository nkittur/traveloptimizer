          - paragraph
          - heading "Fort Worth, Texas" [level=2] [ref=e370]
          - paragraph [ref=e371]: From cowboy culture to Black history, Cowtown is putting its heritage front and center.
          - paragraph [ref=e372]:
            - text: Thanks to Beyoncé’s Cowboy Carter album and shows like Yellowstone, Fort Worth’s Western roots feel more current than ever. The city’s legendary
            - link "Stockyards" [ref=e373] [cursor=pointer]:
              - /url: https://www.fortworthstockyards.org/
            - text: ", a National Historic District since 1976, have been reimagined with boutiques and restaurants taking up residence in the area’s former mule and horse barns. Even Yellowstone creator Taylor Sheridan has gotten in on the action, purchasing and remodeling the renowned"
            - link "Cattlemen’s Steak House" [ref=e374] [cursor=pointer]:
              - /url: https://www.cattlemenssteakhouse.com/
            - text: in 2025. (Now he’s at work on a private members’ club downstairs.) The spirit of Cowtown lives on with year-round rodeos at the
            - link "Cowtown Coliseum" [ref=e375] [cursor=pointer]:
              - /url: https://www.cowtowncoliseum.com/
            - text: ; the annual
            - link "Fort Worth Stock Show & Rodeo" [ref=e376] [cursor=pointer]:
              - /url: https://www.fwssr.com/
            - text: (including the
            - link "Cowboys of Color Rodeo" [ref=e377] [cursor=pointer]:
              - /url: https://www.fwssr.com/events/2026/cowboys-of-color-rodeo3
            - text: on January 19, 2026); honky-tonking at
            - link "Billy Bob’s" [ref=e378] [cursor=pointer]:
              - /url: https://billybobstexas.com/
            - text: ; and the world’s only twice-daily cattle drive along East Exchange Avenue.
          - generic [ref=e379]: ADVERTISEMENT
          - paragraph [ref=e380]:
            - text: In November of 2026, the
            - link "National Cowgirl Museum" [ref=e381] [cursor=pointer]:
              - /url: https://www.cowgirl.net/
            - text: "will debut a 16,000-square-foot expansion; one of the new exhibits will feature a number of outfits from country singer Miranda Lambert’s Velvet Rodeo residency in Las Vegas. Until then, visitors can take in Soldaderas to Amazonas: Escaramuzas Charras, an exhibit that brings Mexico’s all-female equestrian tradition to life through vibrant dresses and embellished saddles."
          - paragraph [ref=e382]:
            - text: But there’s more to Texas’s fourth-biggest city than rodeos and honky-tonks. Groundbreaking for the
            - link "National Juneteenth Museum" [ref=e383] [cursor=pointer]:
              - /url: https://nationaljuneteenthmuseum.org/
            - text: is slated for early 2026 in the historic Southside neighborhood. The museum—whose founding board member, 99-year-old Opal Lee, was instrumental in making Juneteenth a federal holiday in 2021—will focus on the legacy of emancipation and the ongoing struggles for equality, justice, and unity. “We’re located in an area that was somewhat of a Black Wall Street in the early 20th century,” says Christopher Blay, director of public programs. “We are part of what’s bringing this community alive again.” Designed by the Bjarke Ingels Group, it will feature immersive exhibitions, a 250-seat theater, and a food hall spotlighting diasporic cuisine. The building will have a courtyard designed in the shape of a nova star, which is at the center of the Juneteenth flag, symbolizing a new path forward.
          - paragraph [ref=e384]:
            - text: "Where to stay: The"
            - link "Nobleman Fort Worth" [ref=e385] [cursor=pointer]:
              - /url: https://www.hilton.com/en/hotels/ftwmtup-the-nobleman-fort-worth/
            - text: opened in May 2025, incorporating the facade of an old firehouse in the Near Southside neighborhood. Inside, an original fireman’s pole and staircase lead to art-lined walls and a brasserie, Duchess, serving rib eyes, roast chicken, and fried eggplant schnitzel.
            - link "Sandman Signature Fort Worth Downtown Hotel" [ref=e386] [cursor=pointer]:
              - /url: https://www.sandmanhotels.com/signature-fort-worth-downtown
            - text: is set to reopen in 2026, bringing fresh life to the 1920 W.T. Waggoner Building, a neoclassical marble, brick, and terra-cotta tower. —Nora Walsh
          - figure [ref=e389]:
            - img "WTG-26-Harlem-Dror-Baldinger-1x1.jpg" [ref=e392]
            - generic [ref=e393]:
              - paragraph [ref=e395]: Harlem’s Studio Museum reopened its doors in November 2025 after a seven year renovation.
              - paragraph [ref=e397]: Photo by Dror Baldinger FAIA
          - paragraph
          - generic [ref=e398]: ADVERTISEMENT
          - heading "Harlem, New York City" [level=2] [ref=e399]
          - paragraph [ref=e400]: As iconic institutions reopen after major renovations, the upper Manhattan neighborhood and Black cultural capital is ready to share its rhythm and resilience with visitors.
          - paragraph [ref=e401]: The heady swing of jazz legend Duke Ellington and his contemporaries still reverberates in the storied Manhattan blocks from 110th to 155th streets. And now, the stretch—which contains multiple historic districts—is poised to offer residents and visitors reasons to explore more deeply.
          - paragraph [ref=e402]:
            - text: Its revitalization will be especially visible in some of the neighborhood’s most famous institutions. The
            - link "Studio Museum in Harlem" [ref=e403] [cursor=pointer]:
              - /url: https://www.studiomuseum.org/
            - text: —which
            - link "reopened" [ref=e404] [cursor=pointer]:
              - /url: https://www.afar.com/magazine/a-preview-of-the-new-studio-museum-in-harlem
            - text: in November 2025 with seven floors of galleries, workshops, artist studios, and education centers—represents the street, the stage, and the sanctuary. And under the longtime direction of chief curator Thelma Golden, the new museum edifice also represents a fourth social sphere with its “inverted stoop” inspired by Harlem brownstones, which invites people to sit and find community.
          - paragraph [ref=e405]:
            - text: Less than a five-minute walk west of the museum is the legendary
            - link "Apollo Theater" [ref=e406] [cursor=pointer]:
              - /url: https://www.apollotheater.org/
            - text: on 125th Street. Originally a burlesque venue, by the 1930s it became a home for some of the world’s most transformative Black artists, helping launch the careers of James Brown, Luther Vandross, H.E.R., and many more in its long-running Amateur Night competition. As the main Apollo Theater undergoes a major renovation and preps for its grand reopening in late 2026, live performances continue at
            - link "Apollo Stages" [ref=e407] [cursor=pointer]:
              - /url: https://www.victoriatheaternyc.com/theaters
            - text: ", next door in the Victoria Theater."
          - paragraph [ref=e408]:
            - text: Also set to reopen in 2026 is the
            - link "National Black Theatre" [ref=e409] [cursor=pointer]:
              - /url: https://nationalblacktheatre.org/
            - text: ", which is located at the corner of 125th Street and Fifth Avenue. It was founded by the late actress Dr. Barbara Ann Teer in 1968 to provide a platform for new and emerging Black voices. From here, head south to the"
            - link "Harlem Meer" [ref=e410] [cursor=pointer]:
              - /url: https://www.centralparknyc.org/locations/harlem-meer
            - text: "in Central Park: In April 2025, the $160 million"
            - link "Davis Center" [ref=e411] [cursor=pointer]:
              - /url: https://www.centralparknyc.org/locations/the-davis-center
            - text: was unveiled on the meer’s shore with a massive swimming pool, winter skating rink, turf field, and pavilion, completely transforming the north end of the park.
          - paragraph [ref=e412]:
            - text: "Where to stay:"
            - link "Renaissance New York Harlem Hotel" [ref=e413] [cursor=pointer]:
              - /url: https://www.marriott.com/en-us/hotels/nychl-renaissance-new-york-harlem-hotel/overview/
            - text: opened in 2023 at the Victoria Theater on 125th Street with a Cajun-inspired restaurant, lobby lounge, and 211 rooms and suites, many with stellar city views. For a homier stay, consider the
            - link "Mount Morris House" [ref=e414] [cursor=pointer]:
              - /url: https://www.mountmorrishousenyc.com/
            - text: ", a fully restored 1888 Victorian townhouse that has two spacious suites overlooking Marcus Garvey Park. —Shannon J. Effinger"
          - figure [ref=e417]:
            - img "Suyian Lodge outdoor lounge area with fireplace and view of the Suyian Conservancy" [ref=e420]
            - generic [ref=e421]:
              - paragraph [ref=e423]: Suites at andBeyond Suyian Lodge look out over the Laikipia Plateau.
              - paragraph [ref=e425]: Courtesy of andBeyond Suyian Lodge
          - paragraph
          - heading "Laikipia, Kenya" [level=2] [ref=e426]
          - paragraph [ref=e427]: Community-focused wildlife conservancies, rare protected species, and sustainable luxury lodges make Laikipia East Africa’s new center of responsible safaris.
          - paragraph [ref=e428]:
            - text: “There are lions here,” whispers Segera Retreat guide Peter Ngimat, stopping the Land Cruiser. Not three minutes later, a lioness stalking a zebra creeps out of an acacia thicket on a 50,000-acre wildlife conservancy in the grasslands of
            - link "Kenya" [ref=e429] [cursor=pointer]:
              - /url: https://www.afar.com/travel-guides/kenya/guide
            - text: ’s Laikipia Plateau. What tipped him off? A footprint? An antelope’s alarm call?
          - paragraph [ref=e430]: “A feeling,” says Ngimat, who was raised in a nearby village and sharpened his instincts growing up in the bush. “Sometimes you just know.” Located about 140 miles north of Nairobi, Laikipia is a county with an economy driven by both agriculture and tourism. Since British settlers first claimed land there in the early 20th century, the area has faced persistent conflict between large-scale commercial ranchers and pastoralists.
          - paragraph [ref=e431]: Today, many community-run or private conservancies are based on former farms and work hand in hand with locals, like Ngimat, to transform degraded land into prime habitat for more endangered species—including African wild dogs—than anywhere else in East Africa. “These conservancies create a direct link between conserving wildlife and earning a livelihood,” Ngimat says. “Then the community naturally feels a strong sense of ownership and responsibility.”
          - paragraph [ref=e432]:
            - text: If Laikipia is known for one animal, it’s the rhinoceros. The region’s stronghold of rhino sanctuaries, including
            - link "Ol Jogi" [ref=e433] [cursor=pointer]:
              - /url: https://oljogi.org/
            - text: and
            - link "Borana" [ref=e434] [cursor=pointer]:
              - /url: https://www.savetherhino.org/programmes/borana-conservancy/
            - text: ", added another to their ranks in June 2025 when the Zeitz Foundation and Kenya Wildlife Service moved 21 black rhinos into the new"
            - link "Segera Rhino Sanctuary" [ref=e435] [cursor=pointer]:
              - /url: https://zeitzfoundation.org/projects/
            - text: . This was a major milestone in the effort to establish what will become the
            - link "Kenya Rhino Range Expansion" [ref=e436] [cursor=pointer]:
              - /url: https://www.rhinorange.org/
            - text: ", one of the largest interconnected rhino sanctuaries in the world with some 840,000 acres."
          - paragraph [ref=e437]:
            - text: "Where to stay: Opened in July 2025,"
            - link "andBeyond Suyian Lodge" [ref=e438] [cursor=pointer]:
              - /url: https://www.andbeyond.com/lodge-editorial/suyian-lodge/
            - text: in the Suyian Conservancy offers views across the plains to Mount Kenya from 14 suites with private plunge pools.
            - link "Segera Retreat" [ref=e439] [cursor=pointer]:
              - /url: https://www.segera.com/
            - text: is located on a private reserve and has 10 villas and houses. The property also has an extensive collection of contemporary art from Africa and its diaspora curated by owner Jochen Zeitz, the cofounder of Cape Town’s
            - link "Zeitz Museum of Contemporary Art Africa" [ref=e440] [cursor=pointer]:
              - /url: https://zeitzmocaa.museum/?v=0b3b97fa6688
            - text: . —Alexandra Owens
          - figure [ref=e443]:
            - img "A female Bengal tiger named Flying Bird coming out from a bath in a small pond at Pench National Park, India" [ref=e446]
            - generic [ref=e447]:
              - paragraph [ref=e449]: Madhya Pradesh, the “tiger state of India,” is home to nine tiger reserves, including Pench National Park, pictured.
              - paragraph [ref=e451]: Photo by Manuel ROMARIS/Getty Images
          - paragraph
          - heading "Madhya Pradesh, India" [level=2] [ref=e452]
          - paragraph [ref=e453]: This central India state surprises at every turn, with tiger reserves and otherworldly stargazing.
          - paragraph [ref=e454]: Often called the heart of India due to its central location, Madhya Pradesh is also its tiger stronghold, home to 785 of the big cats—the highest number of any state in the country, which itself is home to 75 percent of the world’s tiger population. But the thrill of spotting wildlife here goes beyond big cats.
          - paragraph [ref=e455]: In Satpura National Park, the only reserve in India to allow guided walking safaris in its core zone (a highly protected area with limited tourism activities), visitors can glimpse sloth bears, leopards, and hundreds of bird species (kingfishers, crested serpent eagles) while winding through dense tropical forests and streams. To the southeast and straddling Maharashtra and Madhya Pradesh, Pench National Park—said to have inspired Rudyard Kipling’s The Jungle Book—offers classic jeep safaris as well as cycling routes through teak and bamboo groves. Its rich wildlife includes gaur (known as the Indian bison), wild dogs, and, of course, tigers.
          - paragraph [ref=e456]:
            - text: Pench also impresses after dark. Free of light pollution, the park is renowned for clear stargazing. Lodges such as
            - link "Pench Jungle Camp" [ref=e457] [cursor=pointer]:
              - /url: https://www.penchjunglecamp.com/
            - text: can arrange star walks and telescope sessions, plus local forest department–run dark-sky safaris to spot constellations and the Milky Way.
          - paragraph [ref=e458]:
            - text: "Where to stay:"
            - link "Jungle Camps India" [ref=e459] [cursor=pointer]:
              - /url: https://junglecampsindia.com/
            - text: runs conservation-driven lodges in Pench, Kanha, and Rukhad, offering eco-conscious cottages and luxury tents, with night and day safaris led by trained naturalists. Close to Satpura Tiger Reserve,
            - link "Reni Pani Jungle Lodge" [ref=e460] [cursor=pointer]:
              - /url: https://www.jehannuma.com/reni-pani-jungle-lodge-satpura-resort/
            - text: has earthy-chic cottages and a handful of canvas tents overlooking a water hole. The property specializes in immersive, low-impact safaris—think walking trails, canoe trips, and overnight wilderness camping. —Poonam Binayak
          - figure [ref=e463]:
            - img "WTG-26-Menton-Luna-Wang-Unsplash-Horizontal.jpg" [ref=e466]
            - generic [ref=e467]:
              - paragraph [ref=e469]: Menton’s Plage des Sablettes, at the base of the old town, is especially popular among families with young children.
              - paragraph [ref=e471]: Photo by Luna Wang/Unsplash
          - paragraph
          - heading "Menton, France" [level=2] [ref=e472]
          - paragraph [ref=e473]: France’s last coastal stop before Italy is also its most delicious.
          - paragraph [ref=e474]: More than 300 days of sunshine a year define this Franco-Italian border town, nicknamed the “Pearl of France,” where candy-colored buildings cascade between the Alpes-Maritimes and glittering Riviera beaches. Menton’s mild, subtropical microclimate is so uncommon that its lemons—intensely fragrant, with an edible rind and no bitterness—have Protected Geographical Indication status and can’t be grown anywhere else on the continent.
          - paragraph [ref=e475]:
            - text: Menton offers a tranquil version of the French Riviera, with Italian influences woven through its architecture and restaurants. The Italian Argentine chef Mauro Colagreco has spent two decades building a restaurant mini empire, starting with his now three-Michelin-starred
            - link "Mirazur" [ref=e476] [cursor=pointer]:
              - /url: https://www.mirazur.fr/
            - text: ", and his vision of a more sustainable way of dining has quietly transformed the town. His"
            - link "Mitron Bakery" [ref=e477] [cursor=pointer]:
              - /url: https://mitronbakery.com/
            - text: is the place to go for breads made with ancient wheat flour;
            - link "La Pecoranegra" [ref=e478] [cursor=pointer]:
              - /url: https://www.pecoranegra.fr/
            - text: ", for wood-fired pizzas; and"
            - link "Casa Fuego" [ref=e479] [cursor=pointer]:
              - /url: https://www.casafuego.fr/en/
            - text: ", for grilled meats and seafood. In 2026, coinciding with Mirazur’s 20th anniversary, Colagreco will inaugurate his most ambitious project yet: an 11-suite luxury hotel set beside Mirazur’s garden."
          - paragraph [ref=e480]:
            - text: Restaurants across Menton celebrate the incredible bounty of the region. At Pasta Piemonte, Luisa Delpiano Inversi serves lemon ravioli and other fresh pastas, and at
            - link "JR Bistronomie" [ref=e481] [cursor=pointer]:
              - /url: https://www.jr-bistronomie-restaurant-menton.com/
            - text: ", chef Jérôme Rigaud creates traditional Gallic dishes with Italian influences, such as a caramelized tomato tart and red mullet fillets with fennel, tomato confit, and basil."
          - paragraph [ref=e482]:
            - text: There’s more to Menton than food. Wander beyond the old town’s winding streets to discover 137 rare citrus varieties at the two-and-a-half-acre
            - link "Jardin d’agrumes du Palais Carnolès" [ref=e483] [cursor=pointer]:
              - /url: https://www.menton-riviera-merveilles.fr/offres/jardin-dagrumes-du-palais-de-carnoles-jardin-public-menton-fr-3051967/
            - text: ", surrounding a former Monaco royal summer residence, or visit the Palais de l’Europe to see its Jean Cocteau exhibition (through August 2026). Travelers should also pop into"
            - link "Les Sablettes Beach Club" [ref=e484] [cursor=pointer]:
              - /url: https://www.sablettesbeach.com/
            - text: ", part of Menton’s newly redesigned seafront promenade."
          - paragraph [ref=e485]:
            - text: "Where to stay: The boutique"
            - link "Hôtel Gabriel" [ref=e486] [cursor=pointer]:
              - /url: https://www.hotelgabrielmenton.com/en/
            - text: reopened in 2025 with 35 charming rooms and a patio bar in Menton’s historic center. Housed in an elegant 1885 neoclassical building designed by architect Hans-Georg Tersling, the sumptuous
            - link "Villa Genesis" [ref=e487] [cursor=pointer]:
              - /url: https://www.villagenesis.com/
            - text: has sea-view terraces, a pool, and impeccable service. —Jenn Rice
          - figure [ref=e490]:
            - img "default" [ref=e493]
            - generic [ref=e494]:
              - paragraph [ref=e496]: Oulu is located where Finland’s Oulu River meets the Bothnian Bay.
              - paragraph [ref=e498]: Photo by Tero Suutari / Business Oulu
          - paragraph
          - heading "Oulu, Finland" [level=2] [ref=e499]
          - paragraph [ref=e500]: Art, innovation, and the beauty of the north converge in this 2026 European Capital of Culture.
          - paragraph [ref=e501]: Given its location only 100 miles south of the Arctic Circle, it’s unsurprising that Oulu, Finland’s northernmost major city, has managed to fly under the radar for so long. But in 2026, a continental spotlight will hit the lively university town, one of the year’s two European Capitals of Culture. A three-day winter festival in mid-January will kick off a yearlong celebration of the region with more than 1,000 events, exhibitions, performances, and public art projects.
          - paragraph [ref=e502]:
            - text: Oulu’s year of culture leans into its northern grit and offbeat humor. (This is the city that hosts the
            - link "Air Guitar World Championships" [ref=e503] [cursor=pointer]:
              - /url: https://airguitarworldchampionships.com/en/home/
            - text: .) There’s
            - link "Frozen People" [ref=e504] [cursor=pointer]:
              - /url: https://urbanculture.fi/en/frozenpeople
            - text: ", an electronic music festival taking place on the sea ice, and"
            - link "Polar Bear Pitching" [ref=e505] [cursor=pointer]:
              - /url: https://polarbearpitching.com/
            - text: ", a Shark Tank–style competition where entrepreneurs propose start-ups while waist deep in Arctic waters. The"
            - link "concert Beyond the Sky" [ref=e506] [cursor=pointer]:
              - /url: https://oulu2026.eu/en/culture-programme/beyond-the-sky/
            - text: will look to the cosmos with a multimedia blend of astrophotography, orchestral music, and imagination.
          - paragraph [ref=e507]:
            - text: Plans to honor the culture of the Sami, the European Union’s only Indigenous people, include the debut of a new opera,
            - link "Ovllá" [ref=e508] [cursor=pointer]:
              - /url: https://oulu2026.eu/en/culture-programme/ovla/
            - text: ", exploring the reclamation of their heritage and the community’s subjugation by the state. For intrepid palates, the five-course surprise menu at"
            - link "Oula Kitchen & Bar" [ref=e509] [cursor=pointer]:
              - /url: https://www.kitchenoula.fi/en
            - text: "in the Lapland Hotels Oulu is a culinary journey of the north’s diverse bounty (think: reindeer, arctic char, lingonberries). For something lighter and livelier, Cafe Konstantiina pairs Finnish pancakes with live music and theater performances. In August, Arctic Food Lab, a group focused on promoting northern gastronomy, hosts"
            - link "Summer Night’s Dinner" [ref=e510] [cursor=pointer]:
              - /url: https://arcticfoodlab.fi/en/programme/summer-night-dinner/
            - text: ", a half-mile-long communal table that runs through the city center where anyone can bring food and make new friends."
          - paragraph [ref=e511]:
            - text: "Where to stay:"
            - link "Lapland Hotels Oulu" [ref=e512] [cursor=pointer]:
              - /url: https://www.laplandhotels.com/en/hotels-and-destinations/oulu/lapland-hotels-oulu
            - text: reopened in May 2025 after the first stage of a major renovation; in January an additional 96 rooms will be available, some with private saunas.
            - link "De Gamlas Hem" [ref=e513] [cursor=pointer]:
              - /url: https://degamlashotel.fi/en/home/
            - text: ", a home for wealthy seniors in the early 20th century, now operates as a 17-room boutique hotel with a seasonally driven restaurant. —Susan Portnoy"
          - figure [ref=e516]:
            - img "WTG-26-Penang-Luo-Yang-Belmond-Apartamento.jpg" [ref=e519]
            - generic [ref=e520]:
              - paragraph [ref=e522]: "A photo-essay cookbook from Apartamento and Belmond, Penang: Recipes & Wanderings Around an Island in Malaysia (2024), captures the area’s dining scene, from street food stalls to local delicacies."
              - paragraph [ref=e524]: Photos by Luo Yang/Belmond/Apartamento
          - paragraph
          - heading "Penang Island, Malaysia" [level=2] [ref=e525]
          - paragraph [ref=e526]: Hike highland trails and devour delicious hawker fare in a multicultural haven.
          - paragraph [ref=e527]:
            - text: Penang Island, one of two parts of the Malaysian state of the same name, has the whimsy and color palette of a Wes Anderson film, the energy of a major city, and arguably Asia’s most interesting food scene. But don’t call it a melting pot. “A melting pot seems to suggest you throw everything in and don’t recognize the original ingredient,” says Ooi Geok Ling, former director of
            - link "Penang Global Tourism" [ref=e528] [cursor=pointer]:
              - /url: https://www.mypenang.gov.my/?lg=en
            - text: . “We are probably more of a salad, a rojak—there’s a special sauce that binds it, but every piece stays itself.”
          - paragraph [ref=e529]:
            - text: That mix is especially vivid in George Town, a UNESCO World Heritage site where crimson three-wheeled rickshaws roll past ornate Chinese clan temples and colorful shophouses that have been transformed into restaurants and hotels, such as the forthcoming 15-suite
            - link "Soori Penang" [ref=e530] [cursor=pointer]:
              - /url: https://sooripenang.com/
            - text: . Along and just off the half-mile Street of Harmony, four different houses of worship—an Anglican church, a Hindu temple, a Chinese Buddhist temple, and a mosque—stand within steps of one another. The island’s multicultural community comes together in festivals, too, from the Hindu celebration of Thaipusam each winter to the
            - link "George Town Festival" [ref=e531] [cursor=pointer]:
              - /url: https://www.georgetownfestival.com/
            - text: every August.
          - paragraph [ref=e532]:
            - text: Food here unites. Penang’s hawker stalls dish out fiery, subtly smoky char koay teow noodles and tangy assam laksa; some of them are among the island’s 27 Bib Gourmand spots. There are also two Michelin-starred restaurants,
            - link "Au Jardin" [ref=e533] [cursor=pointer]:
              - /url: https://www.restaurant-aujardin.com/
            - text: "and Auntie Gaik Lean’s Old School Eatery. In 2024, UNESCO recognized Malaysia’s breakfast culture as an Intangible Cultural Heritage: Woven deeply into daily life here, it’s a blend of Malay, Chinese, and Indian dishes such as nasi lemak (coconut rice served with egg, anchovies, sambal, cucumber, and more) and roti canai (a flaky flatbread served with a dipping curry), and the meal offers a chance for people to gather and enjoy their mornings together."
          - paragraph [ref=e534]: Though Penang is ringed by sand, it’s not a beach destination so much as a place of hills and hidden trails. Locals volunteer to maintain footpaths that wind into the granite highlands, some carved in whimsical animal shapes, like the Unicorn Trail. “The volunteerism in our hiking is very, very special,” says Ooi Geok Ling.
          - paragraph [ref=e535]:
            - text: "Where to stay: The"
            - link "Millen Penang, Autograph Collection" [ref=e536] [cursor=pointer]:
              - /url: https://www.marriott.com/en-us/hotels/pentm-the-millen-penang-autograph-collection/overview/
            - text: opened in February 2025 in George Town with 146 rooms and suites, two restaurants, a spa, and an infinity pool with views of the Andaman Sea. —Kathryn Romeyn
          - figure [ref=e539]:
            - img "WTG-26-Rabat-Fairmont-horizontal.jpg" [ref=e542]
            - generic [ref=e543]:
              - paragraph [ref=e545]: The Fairmont La Marina Rabat-Salé overlooks the confluence of the Bou Regreg River and the Atlantic Ocean.
              - paragraph [ref=e547]: Courtesy of Fairmont
          - paragraph
          - heading "Rabat, Morocco" [level=2] [ref=e548]
          - paragraph [ref=e549]: The Moroccan capital is fast becoming a cultural hub thanks to new museums, hotels, and Africa’s largest music festival.
          - paragraph [ref=e550]:
            - text: “Why would you take people here?” That’s what Farah Cherif D’Ouezzan, the founder of the Rabat-based
            - link "Center for Cross Cultural Learning" [ref=e551] [cursor=pointer]:
              - /url: https://www.cccl-morocco.com/
            - text: ", recalls being asked when she first began running study abroad programs and educational trips to Morocco’s capital in 1995. For years, travelers have flocked to the country’s other imperial cities—Marrakech, Fès, and Meknes—but this outpost on the northwestern Atlantic coast has been largely overlooked, considered more of a governmental hub."
          - paragraph [ref=e552]:
            - text: That’s changing. In June 2025, Rabat’s annual Mawazine music festival welcomed a record 3.75 million people who came to see performers including Afropop pioneer Salif Keita and Grammy Award–winning rapper Kid Cudi. In 2026, the city will bear the title of UNESCO World Book Capital, recognized for its “54 publishing houses, the third-largest international book and publishing fair in Africa, and a growing number of bookstores,” according to UNESCO. And two new museums—of African culture and archaeology—are expected to open in late 2026. Visitors can also dig into Rabat’s history at
            - link "Chellah" [ref=e553] [cursor=pointer]:
              - /url: https://www.chellah.site/en/
            - text: ", a first-century B.C.E. archaeological site that reopened after a major restoration in 2024 with Roman and Marinid ruins surrounded by landscaped gardens."
          - paragraph [ref=e554]: "For D’Ouezzan, the draw of Rabat lies in its small scale and unhurried pace: watching kids jump into the Bou Regreg River from the earthen red walls of the Kasbah of the Udayas, a citadel from the 12th century; connecting with residents like Mohammed Aziz, who’s eager to discuss the books at his store, Bouquiniste El Azizi; and tasting bastilla, a multilayered pastry with poultry and almonds, at the restaurant Dar Chrifa. In Rabat, D’Ouezzan says, “You have time to stop and talk to people, taste the food, and see everything.”"
          - paragraph [ref=e555]:
            - text: "Where to stay:"
            - link "Fairmont La Marina Rabat-Salé" [ref=e556] [cursor=pointer]:
              - /url: https://all.accor.com/hotel/A7Z0/index.en.shtml
            - text: opened in 2022 with a rooftop pool and 186 elegant guest rooms. The
            - link "Waldorf Astoria Rabat Salé" [ref=e557] [cursor=pointer]:
              - /url: https://www.hilton.com/en/hotels/rbartwa-waldorf-astoria-rabat-sale/
            - text: is set to open in early 2026 inside the Mohammed VI Tower, Morocco’s tallest building. At the northern end of the medina is
            - link "Euphoriad" [ref=e558] [cursor=pointer]:
              - /url: https://www.euphoriad.com/?lang=en
            - text: ", a 19th-century residence transformed into a stunning riad by Moroccan architect Chafiq Kabbaj. It now has eight rooms and suites, a two-story duplex with bay windows overlooking an interior garden, and a terrace pool with panoramic views. —Yulia Denisyuk"
          - figure [ref=e561]:
            - img "WTG-26-Saba-Rocio-Arrieta-horizontal.jpg" [ref=e564]
            - generic [ref=e565]:
              - paragraph [ref=e567]: A volcanic island, Saba is just five square miles and has only four towns with a total population of 2,000.
              - paragraph [ref=e569]: Photo by Rocio Arrieta
          - paragraph
          - heading "Saba" [level=2] [ref=e570]
          - paragraph [ref=e571]: The tiny Dutch Caribbean island offers craggy cliffs, coral reefs, and quietly charming villages without the crowds.
          - paragraph [ref=e572]: "Touching down on Saba feels like landing on the edge of the Earth. A smooth 12-minute flight from Sint Maarten wraps with a white-knuckle descent onto the world’s shortest commercial runway—a narrow strip carved into a cliffside. From there, a drive up “the road” (there’s only one) cuts through Saba’s four villages, home to just 2,000 residents in total: Hell’s Gate (or Zion’s Hill), known for its historic buildings and scenic views; Windwardside, the most tourist-friendly, with restaurants, hotels, and shops; St. John’s, a small residential village; and the Bottom, the island’s capital, set in a bowl-like valley."
          - paragraph [ref=e573]: Saba isn’t your typical tropical escape. There are no white-sand beaches, large resorts, or major cruise ships, just the wild beauty of the “Unspoiled Queen of the Caribbean.” The tiny island is only five square miles and sits at the tip of a dormant underwater volcano. Most travelers come for world-class diving with thriving marine life, including spotted eagle rays, hawksbill turtles, and tiger sharks. (The island and its unusually large specimens of tiger sharks were recently featured on an episode during Discovery Channel’s Shark Week.) Others come to summit the 2,910-foot Mount Scenery, often shrouded in clouds. But there’s plenty to do at sea level, too.
          - paragraph [ref=e574]:
            - text: Visitors can swim at “wandering beach,” a rare black-sand stretch at Wells Bay that appears sporadically, depending on the tides and the season. Another option is to hike Mas Cahones Hill with James Johnson, aka Crocodile James, a native Saban whose family has lived on the island for eight generations. He helped build the hiking network by hand, and shares the island’s stories and secrets as he leads treks along the best trails. Book a tour through the
            - link "Saba Conservation Foundation" [ref=e575] [cursor=pointer]:
              - /url: https://sabapark.org/
            - text: ’s website or by calling them directly.
          - paragraph [ref=e576]:
            - text: "Where to stay:"
            - link "Juliana’s Hotel" [ref=e577] [cursor=pointer]:
              - /url: https://www.julianashotelsaba.com/
            - text: is set on the slopes of Windwardside, within walking distance of the parks, shops, and restaurants in the area. The boutique hotel offers ocean-view rooms and traditional gingerbread-style Saban cottages. (Opt for the spacious Orchid Cottage.) Opening in February 2026 at the foot of Mount Scenery, the
            - link "Scenery Hotel" [ref=e578] [cursor=pointer]:
              - /url: https://sceneryhotelsaba.com/
            - text: will be Saba’s first luxury boutique property, with bungalow-style rooms and secluded suites as well as a restaurant and infinity pool. —Bianca Bujan
          - figure [ref=e581]:
            - img "WTG-26-Sado-Island-Maibaru-Travel-1x1.jpg" [ref=e584]
            - generic [ref=e585]:
              - paragraph [ref=e587]: Visitors to Sado Island can take a ride in a tarai-bune, a tub boat.
              - paragraph [ref=e589]: Photo by Maibaru Travel
          - paragraph
          - heading "Sado Island, Japan" [level=2] [ref=e590]
          - paragraph [ref=e591]: This under-the-radar spot rewards those in the know with tranquil shores, bountiful seafood, and a legacy of gold.
          - paragraph [ref=e592]: Off the coast of Japan’s Niigata Prefecture, Sado Island is easily accessible from Tokyo via a two-hour bullet train and a 60-minute ferry ride. But despite a striking landscape of forested mountains, wide sandy beaches, and aqua-marine bays, the island—the sixth largest in the Japanese archipelago—is a world apart from the country’s heavily Instagrammed, over-touristed hot spots. Today Sado is home to fewer than 50,000 residents and is largely unknown among international travelers.
          - paragraph [ref=e593]: During the summer months, when the temperatures reach the 70s and 80s, Sado’s dramatic coastline draws Japanese beachgoers. The island has a remarkable bounty, including sweet shrimp, abalone, and Sado beef as well as persimmons that are famous throughout Japan.
          - paragraph [ref=e594]:
            - text: The 400-year-old
            - link "Sado Island Gold Mines" [ref=e595] [cursor=pointer]:
              - /url: https://www.sado-kinzan.com/en/
            - text: "are the largest gold and silver mines in Japan: Doyu no Warito, a mountain split in two by a massive 98-foot-wide, 243-foot-deep chasm, was hand-dug in the 1600s at the start of the gold rush. In 2024, the mines were designated a UNESCO World Heritage site; now, they feature video reenactments with local people instead of professional actors and offer tours that navigate underground shafts where life-size animatronic “miners” greet visitors."
          - paragraph [ref=e596]: Another only-in-Sado experience is a trip in a tarai-bune, the tub boat depicted in the 2001 animated film Spirited Away by acclaimed director Hayao Miyazaki. Though they’re more of a tourist draw these days (Yajima-Kyojima is a popular boarding point), the wooden vessels are sometimes still used for fishing and, per tradition, operated primarily by women. The anglers have a glass-bottomed box that floats alongside the boat, serving as a window into the Sea of Japan.
          - paragraph [ref=e597]:
            - text: "Where to stay: In 2024, the hospitality brand Nipponia opened a scattered collection of stand-alone kominka (traditional rural homes). The historic houses, which have been immaculately restored, operate as a single full-service hotel. Guests can choose to have a breakfast basket delivered each morning; every element—from the rice to the horse mackerel and miso—is local to Sado. Visitors can also stay in seaside hotels and onsens, such as the elegant"
            - link "Hotel Oosado" [ref=e598] [cursor=pointer]:
              - /url: https://hotel-oosado.jp/en/
            - text: ", known for its exceptional food and open-air baths. —Freda Moon"
          - figure [ref=e601]:
            - img "WTG-26-Peru-Kevin-Faingnaert-1x1.jpg" [ref=e604]
            - generic [ref=e605]:
              - paragraph [ref=e607]: Peru’s Colca Canyon is one of the deepest canyons in the world.
              - paragraph [ref=e609]: Photo by Kevin Faingnaert
          - paragraph
          - heading "Southern Peru" [level=2] [ref=e610]
          - paragraph [ref=e611]: With colonial cities, celebrated gastronomy, and new tented camps, this region delivers a journey that blends adventure with tradition.
          - paragraph [ref=e612]: Nobel laureate Mario Vargas Llosa would often say that, to him, “Peru is Arequipa.” The towering figure in Latin American literature (who passed away in April 2025) praised his hometown, located more than 600 miles south of Lima, for its wild volcanic setting, proud mestizo culture, and plazas lined with perfectly preserved 16th-century buildings in pearly volcanic stone, earning Arequipa its nickname, the White City.
          - paragraph [ref=e613]:
            - text: Travelers should begin here to plot grand adventures across Southern Peru, as well as to feast on Arequipa’s gastronomy, recognized by UNESCO for its purity and tradition. Vargas Llosa, in particular, was a fan of Arequipa’s women-run picanterías—like Picantería La Cau Cau II and La Nueva Palomino—which serve hearty local dishes such as chupe de camarones (a river shrimp chowder) and adobo (a tangy pork stew) alongside chicha de guiñapo, an alcoholic drink. After fueling up in Arequipa, explore the world’s highest navigable lake, Titicaca, or the gaping Colca Canyon, which is twice as deep as the Grand Canyon, with
            - link "SA Expeditions" [ref=e614] [cursor=pointer]:
              - /url: https://www.saexpeditions.com/
            - text: ", a B-Corp–certified company that puts together some of the most adventurous tailor-made trips in Peru."
          - paragraph [ref=e615]:
            - text: "“The best part about the south—apart from its astonishing views, traditions, and cultures—is how raw, real, and true everything feels,” says Lorenzo Masias, head of commercial at the high-design Peruvian hotel brand Andean, which has built adventure lodges across Southern Peru, helping open it up to international travelers. This includes two new safari-style tented camps:"
            - link "Puqio" [ref=e616] [cursor=pointer]:
              - /url: https://www.puqio.pe/
            - text: ", which debuted on the rim of Colca Canyon in 2024, and"
            - link "Tinajani" [ref=e617] [cursor=pointer]:
              - /url: https://www.tinajani.pe/
            - text: ", which launched in the red-rock Tinajani Canyon in April 2025. Andean’s latest hotel will rise in 2027 on Suasi Island, on Titicaca’s isolated northern coast."
          - paragraph [ref=e618]:
            - text: "Where to stay: Sleep under vaulted ceilings in a converted 16th-century monastery at"
            - link "Cirqa" [ref=e619] [cursor=pointer]:
              - /url: https://www.cirqa.pe/
            - text: ", a Relais & Châteaux property with a plunge pool and rooftop terrace overlooking Arequipa’s historic center, with views of the city’s volcanoes. Then head out to remote"
            - link "Tinajani" [ref=e620] [cursor=pointer]:
              - /url: https://www.tinajani.pe/
            - text: ", six hours away, where wannabe archaeologists can immerse themselves in an earlier era of Andean exploration, when geographers and anthropologists searched for the “lost cities” of the Inca. Set on a 400-acre private conservation area, the retreat has just six tents, and daily excursions include bike rides along the canyon and hikes among the puyas de Raimondi plants. —Mark Johanson"
          - figure [ref=e623]:
            - img "St. Louis Symphony Orchestra performs the music of John Williams Sunday, March 20, 2022, at Powell Hall. (Photo by Whitney Curtis)" [ref=e626]
            - generic [ref=e627]:
              - paragraph [ref=e629]: St. Louis’s 100-year-old Powell Hall reopened in 2025.
              - paragraph [ref=e631]: Photo by Whitney Curtis
          - paragraph
          - heading "St. Louis, Missouri" [level=2] [ref=e632]
          - paragraph [ref=e633]: The Gateway City reemerges as an artistic hub of America’s Midwest.
          - paragraph [ref=e634]:
            - text: St. Louis’s artistic resurgence has been years—even decades—in the making. Half a century ago, residents voted to tax themselves to make cultural attractions free for visitors, but the momentum really picked up in 2018, when the Gateway Arch and its surrounding national park reopened as part of the $380 million
            - link "CityArchRiver" [ref=e635] [cursor=pointer]:
              - /url: https://www.archpark.org/foundation/legacy
            - text: project. The riverside landmark suddenly became more than just a photo op—it symbolized the city’s broader reinvention, where the arts are leading the way.
          - paragraph [ref=e636]:
            - text: The
            - link "Grand Center Arts District" [ref=e637] [cursor=pointer]:
              - /url: https://www.grandcenter.org/
            - text: has emerged as one of the country’s best artistic hubs, focused on repurposing historical structures and giving local creators space to grow alongside international artists and Broadway touring companies. September 2025 saw the reopening of
            - link "Powell Hall" [ref=e638] [cursor=pointer]:
              - /url: https://slso.org/
            - text: ", the 100-year-old home of the St. Louis Symphony Orchestra, following a $140 million renovation and a 64,000-square-foot expansion, as well as the debut of the"
            - link "Sovereign" [ref=e639] [cursor=pointer]:
              - /url: https://oldrockhouse.com/venue/the-sovereign/
            - text: ", a 1,200-capacity concert venue."
          - paragraph [ref=e640]:
            - text: The
            - link "Old Courthouse" [ref=e641] [cursor=pointer]:
              - /url: https://www.nps.gov/jeff/planyourvisit/och.htm
            - text: —where Dred and Harriet Scott sued for their freedom and Virginia Minor, founder of the first women’s suffrage organization, attempted to vote—reopened in May 2025, marking the final phase of the CityArchRiver project. Visitors can learn about Black life in 19th-century St. Louis at the courthouse’s Pathways to Freedom exhibit.
          - paragraph [ref=e642]:
            - text: St. Louis isn’t just focused on attracting audiences, but on building community, as well. The city began investing in housing for artists through the STL Art Place Initiative, which transforms vacant properties into affordable live-work spaces. The new projects join a slate of cultural mainstays, from the
            - link "Opera Theatre of Saint Louis" [ref=e643] [cursor=pointer]:
              - /url: https://opera-stl.org/
            - text: ", currently celebrating its 50th anniversary, to"
            - link "Shakespeare in the Streets" [ref=e644] [cursor=pointer]:
              - /url: https://stlshakes.org/streets/
            - text: ", which pairs seasoned playwrights with locals to write and perform original plays based on the Bard’s stories."
          - paragraph [ref=e645]:
            - text: "Where to stay: The"
            - link "21c Museum Hotel St. Louis" [ref=e646] [cursor=pointer]:
              - /url: https://21cmuseumhotels.com/st-louis/
            - text: opened in 2023 with 173 rooms, showcasing art exhibitions and partnering with local entrepreneurs. The free on-site museum means you’re only one elevator ride away from thoughtful and immersive installations, including The Way Out West, which covers the stairwells and carpets with hundreds of photographs of native flora and fauna. At the
            - link "Four Seasons Hotel St. Louis" [ref=e647] [cursor=pointer]:
              - /url: https://www.fourseasons.com/stlouis/
            - text: ", guests check in on the eighth floor and are immediately rewarded with panoramas of the Arch and the Mississippi River. Keep the good views going at the Sky Terrace’s rooftop pool and private cabanas. —Caitlin Morton"
          - figure [ref=e650]:
            - img "Grinda, Sweden" [ref=e653]
            - generic [ref=e654]:
              - paragraph [ref=e656]: Grinda Island has a handful of swimming coves, including Källviken, a popular sandy beach.
              - paragraph [ref=e658]: Photo by Morgan Levy
          - paragraph
          - heading "Stockholm Archipelago, Sweden" [level=2] [ref=e659]
          - paragraph [ref=e660]: A new trail allows adventurous visitors to explore 20 islands in the Baltic Sea, easily accessible from the Swedish capital.
          - paragraph [ref=e661]:
            - text: Want to summer like a Swede? Skip Stockholm and instead head to its archipelago, which technically begins a few minutes outside of the city, covers an area the size of Houston, and comprises some 24,000 postcard-perfect, tranquil islands. Navigating it is easier than ever, thanks to the
            - link "Stockholm Archipelago Trail" [ref=e662] [cursor=pointer]:
              - /url: https://stockholmarchipelagotrail.com/
            - text: ", a hiking path network that launched in October 2024 to help support local businesses and encourage responsible visitor flow."
          - paragraph [ref=e663]:
            - text: The trail covers 170 miles across 20 islands—connected by ferries—with well-marked paths. Travelers with a week to explore would be wise to choose a portion, such as the center and northern archipelago. Begin an hour from Stockholm in Vaxholm, considered the archipelago’s capital, and after checking into the newly restored
            - link "Waxholms Hotell" [ref=e664] [cursor=pointer]:
              - /url: https://www.waxholmshotell.se/
            - text: ", walk a mile and a half to the Bogesundslandet peninsula and its 7,000-acre"
            - link "Bogesundslandet Nature Reserve" [ref=e665] [cursor=pointer]:
              - /url: https://www.naturkartan.se/sv/stockholms-lan/bogesundslandet?guide_id=15
            - text: ", thick with pine and oak trees."
          - paragraph [ref=e666]: From Vaxholm, boats to surrounding islands leave regularly, providing travelers with a choose-your-own-adventure experience. For a nature reserve with a hiking trail and swimming coves, head to Grinda. To sweat like a Swede, visit the island of Finnhamn and reserve a beautiful beachfront sauna before plunging into the sea just beyond. And for typical Swedish fare and a tattoo in the same afternoon, stop by Jeppes Gästgiveri, a restaurant and bar (and makeshift tattoo parlor) on the island of Möja, which has only 150 year-round residents. When it’s time to catch your next ferry, head down to the dock and raise the semaphore (the foldable sign on the jetty) to let the boat know it should stop.
          - paragraph [ref=e667]:
            - text: "Where to stay:"
            - link "Ingmarsö B&B" [ref=e668] [cursor=pointer]:
              - /url: https://www.ingmarsobnb.se/en
            - text: has six rooms spread across two former farmhouse buildings on its namesake island. Its divine breakfast is best enjoyed outside. Dating to 1906,
            - link "Grinda Wärdshus" [ref=e669] [cursor=pointer]:
              - /url: https://grinda.se/en/
            - text: was once the summer home of the Nobel Prize committee director. Today it includes a sprawling terrace overlooking the nearby sound, a lobby stocked with books and games, and a restaurant decorated with photos of legends who have visited over the years. —Katherine LaGrave
          - figure [ref=e672]:
            - img "WTG-26-West-Cork-Michel-Colaci-Photography-horizontal.jpg" [ref=e675]
            - generic [ref=e676]:
              - paragraph [ref=e678]: The Irish coastal village of Baltimore is the main ferry port to Sherkin Island and Cape Clear Island.
              - paragraph [ref=e680]: Photo by Michel Colaci
          - paragraph
          - heading "West Cork, Ireland" [level=2] [ref=e681]
          - paragraph [ref=e682]: On the southern stretch of the Wild Atlantic Way, travelers can uncover a less harried coast.
          - paragraph [ref=e683]: Many people on a first trip to Ireland head for the southwest, visiting places like the Ring of Kerry and the Lakes of Killarney. The Irish, though, go to West Cork, which marks the start or end of the 1,500-mile Wild Atlantic Way along Ireland’s west coast. Here, traffic thins and slows just off the main street, and tree-lined backroads lead to craggy peninsulas. Although this is part of the country’s “wild” corner, there’s a hint of softness here. Visitors will find enchanting towns, such as Kinsale and Clonakilty, as well as sandy beaches, rocky lookout points, and the occasional landmark lighthouse, like Galley Head outside of Rosscarbery. This is a place to linger and watch the bay full of bobbing boats at Glandore Harbour or the waves rolling in at Owenahincha Beach.
          - paragraph [ref=e684]:
            - text: On tiny Garinish Island, a 15-minute ferry ride from Glengarriff, wander among lovingly tended Italian gardens that are open to the public. For total peace, visit the Bronze Age–era Drombeg Stone Circle at dawn, and at night, join
            - link "Atlantic Sea Kayaking" [ref=e685] [cursor=pointer]:
              - /url: https://www.atlanticseakayaking.com/
            - text: for a moonlit adventure at Castlehaven Bay and a chance to see the water glow with bioluminescence.
          - paragraph [ref=e686]:
            - text: Arriving in the tiny village of Baltimore, travelers will feel as if they’ve hit the bottom of Ireland, but from here a 10-minute ferry ride leads to the artists’ haven Sherkin Island. Or head farther out to Cape Clear Island, where lavender grows between the stone walls, to try
            - link "Cape Clear Distillery" [ref=e687] [cursor=pointer]:
              - /url: https://www.capecleardistillery.com/
            - text: ‘s seaweed-flavored gin. Back in Baltimore, the “Works of Art” tasting menu of two-Michelin-star Turkish restaurant
            - link "Dede" [ref=e688] [cursor=pointer]:
              - /url: https://customshousebaltimore.com/
            - text: at the Customs House awaits.
          - paragraph [ref=e689]:
            - text: "Where to stay:"
            - link "Dunmore House" [ref=e690] [cursor=pointer]:
              - /url: https://www.dunmorehousehotel.ie/
            - text: in Clonakilty offers peace and quiet with views overlooking the Atlantic. Its
            - link "Adrift" [ref=e691] [cursor=pointer]:
              - /url: https://www.dunmorehousehotel.ie/adrift-restaurant
            - text: restaurant relies on local ingredients, including many from its own Ocean Garden.
            - link "Native" [ref=e692] [cursor=pointer]:
              - /url: https://www.native.ie/
            - text: ", a sustainably designed eco-guesthouse in Ballydehob, opened in 2024 and has three guest rooms and two garden suites. Twenty percent of its profits go toward financing a local rewilding project. —Yvonne Gordon"
