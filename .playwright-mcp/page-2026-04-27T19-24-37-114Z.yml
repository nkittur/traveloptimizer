          - figure [ref=e308]:
            - img "The Farm Eluthera Bahamas" [ref=e311]
            - generic [ref=e312]:
              - paragraph [ref=e314]: The Farm’s freshwater pool is just a short walk from some of Eleuthera’s best beaches.
