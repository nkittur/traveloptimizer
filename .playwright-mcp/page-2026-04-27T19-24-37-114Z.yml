          - paragraph
          - heading "East Antarctica" [level=2] [ref=e286]
          - paragraph [ref=e287]: New small-ship voyages open access to the world’s most remote frontier.
          - generic [ref=e288]: ADVERTISEMENT
          - paragraph [ref=e289]:
            - text: Travel to
            - link "Antarctica" [ref=e290] [cursor=pointer]:
              - /url: https://www.afar.com/travel-guides/antarctica/guide
            - text: is at an all-time high. But while more ships are departing from Ushuaia, Argentina, for the Antarctic Peninsula, lesser-visited East Antarctica offers a more exclusive experience, with fewer crowds, towering ice cliffs, and a better chance to see emperor penguins.
          - paragraph [ref=e291]:
            - text: A growing number of small-ship expedition cruises are departing from Hobart in
            - link "Tasmania" [ref=e292] [cursor=pointer]:
              - /url: https://www.afar.com/travel-guides/australia/tasmania/guide
            - text: ","
            - link "Australia" [ref=e293] [cursor=pointer]:
              - /url: https://www.afar.com/travel-guides/australia/guide
            - text: ", or"
            - link "New Zealand’" [ref=e294] [cursor=pointer]:
              - /url: https://www.afar.com/travel-guides/new-zealand/guide
            - text: s South Island, including ones from
            - link "Heritage Expeditions" [ref=e295] [cursor=pointer]:
              - /url: https://www.heritage-expeditions.com/antarctica-ross-sea-cruises-gl/
            - text: ;
            - link "Scenic Luxury Cruises and Tours" [ref=e296] [cursor=pointer]:
              - /url: https://www.scenicusa.com/ocean/destinations/polar-regions/ross-sea-east-antarctica
            - text: ; and
            - link "Aurora Expeditions" [ref=e297] [cursor=pointer]:
              - /url: https://www.aurora-expeditions.com/destination/ross-sea-east-antarctica
            - text: ", whose newest purpose-built ship, the Douglas Mawson, made its maiden voyage in December 2025. It takes about a week to cruise to East Antarctica, and the journey is far from uneventful, moving from open ocean to drifting sea ice and vast tabular icebergs. Expect talks by onboard experts such as polar explorer Robert Swan, who joins Scenic Tours’ expedition “Antarctica’s Ross Sea: Majestic Ice & Wildlife” in January 2026; or there might be visits to subantarctic islands—perhaps Australia’s Macquarie Island, home to four species of penguin, including royal penguins with their striking yellow crests."
          - paragraph [ref=e298]: Travelers’ first glimpse of Antarctica might be the immense Ross Ice Shelf towering 160 feet above the cobalt depths of the Ross Sea, where orcas and humpback whales cruise the pack ice and Weddell and crabeater seals rest on ice floes. Or it could be Cape Adare, home to the world’s largest accessible Adélie penguin colony, with an estimated 330,000 breeding pairs. Shore excursions offer a chance to walk among penguin, seal, and seabird colonies and explore the region’s human history, with preserved huts once used by explorers, including Ernest Shackleton, Carsten Borchgrevink, Robert Scott, and Douglas Mawson, now open-air museums. And only here can adventurers see the jagged peaks of the Transantarctic Mountains marching toward the South Pole.
          - paragraph [ref=e299]:
            - text: "Where to stay: For those leaving from Hobart, the"
            - link "Tasman, a Luxury Collection Hotel" [ref=e300] [cursor=pointer]:
              - /url: https://www.marriott.com/en-us/hotels/hbalc-the-tasman-a-luxury-collection-hotel-hobart/overview/
            - text: ", is a short stroll from the"
            - link "Mawson’s Huts Replica Museum" [ref=e301] [cursor=pointer]:
              - /url: https://www.mawsons-huts.org.au/
            - text: and the
            - link "Tasmanian Museum & Art Gallery" [ref=e302] [cursor=pointer]:
              - /url: https://www.tmag.tas.gov.au/
            - text: ", with its long-term Antarctica exhibition Islands to Ice. The hotel is home to the Italian-inspired"
            - link "Peppina" [ref=e303] [cursor=pointer]:
              - /url: https://www.peppinarestaurant.com/
            - text: ", from celebrated Australian Italian chef Massimo Mele. Travelers departing from Queenstown, New Zealand, will want to soak up sublime Lake Wakatipu views from the"
            - link "Roki" [ref=e304] [cursor=pointer]:
              - /url: https://roki-collection.com/
            - text: ", a luxury hotel that opened in September 2025 with 15 suites, including a grand seven-bedroom option with a rooftop balcony and private sauna and spa. —Sarah Reid"
