                - paragraph [ref=e445]: Since it opened in 1985, Peking Gourmet is one of the oldest Korean Chinese food restaurants in Orange County. The interior resembles a typical Chinese American restaurant circa the 90s and the menu offers the typical broccoli beef, egg rolls, wonton soup, and chicken fried rice. But the best representation of the Korean Chinese fusion is found in the jajangmyeon. The fermented black bean sauce noodles served with tender bites of pork originated in Incheon, Korea, by Chinese immigrants.
