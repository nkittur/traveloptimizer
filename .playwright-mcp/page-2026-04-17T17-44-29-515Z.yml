                - paragraph [ref=e235]: A Gen Z epicenter for Korean culture and K-pop, The Source in Buena Park grew into the place where fans pick up coveted albums, collectibles and Korean street food. Notable spots include Myungrang Hot Dog, Old Ferry Donut from Seoul with its custard-filled creme brulee and pistachio doughnuts, and even more things to eat tucked into two food courts. Boba shops like Ding Tea embrace the K-pop frenzy with special events featuring BTS and other bands printed on paper cup sleeves. The limited quantities make sleeves collectibles, with people lining up for hours just for a single cup.
