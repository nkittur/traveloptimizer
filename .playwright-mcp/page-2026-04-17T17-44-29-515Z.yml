              - paragraph [ref=e192]: In 2023, Orange County designated its own Koreatown in Buena Park. The city known for Knott’s Berry Farm has evolved into the epicenter of OC Korean culture. From the Source, an outdoor shopping center, which boasts mostly Korean-language CGV cinemas, a K-pop dance school, a doughnut shop straight from Seoul, and mom-and-pop restaurants. The Korean diaspora is represented throughout Orange County, including in La Palma, Garden Grove, Irvine, and Artesia. Here’s a map of where to eat stellar Korean food in Orange County.
