                  - paragraph [ref=e205]:
                    - text: The seolleongtang, ox bone soup, remains a longtime favorite at Jangmo Jip. Orange County food writers have
                    - link "written about it for years" [ref=e206] [cursor=pointer]:
                      - /url: https://www.ocregister.com/2011/07/11/the-best-soup-youve-never-heard-of/
                    - text: . But Jangmo Jip’s other soups, such as the soothing samgyetang, or ginseng chicken soup with purple rice, and the beef brisket, are worthwhile. Most people order soup, but other popular items include the tender mandu and pork belly bossam wrapped in lettuce seasoned with ssamjang.
