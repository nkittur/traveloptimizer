                  - paragraph [ref=e270]: This is the place to slurp on Busan-style pork bone broth simmered for 24 hours. The boiling hot milky white soup is dotted with chunks of tender pork meat and served with banchan like cabbage kimchi, raw onions, jalapenos, chili sauce, and seasoned chives. Purple-tinged rice and noodles arrive on the side for the soup. Another Jinsol opened in Stanton recently and the chain boasts two locations in LA’s Koreatown as well.
