                - paragraph [ref=e611]: Located inside the food court at the most well-stocked H Mart in Irvine, this Jopok Topokki is much smaller than its sister restaurant on Commonwealth in Buena Park. At both locations, the rapokki, a combination of rice cakes and ramen in kimchi broth and fish cakes, remains the most popular item, even for takeout orders. Since it’s in a grocery store, the crisp waffle-like dessert taiyaki comes stuffed with nutella, custard, or red bean, making for a scrumptious pre- or post-shopping snack.
