                  - paragraph [ref=e419]: The bossam jungsik is what most first time diners order since the tender pork belly wrapped in lettuce is approachable and easily customizable, but more adventurous diners opt for the octopus bibimbap and the spicy raw marinated crab, yangnyeom gejang. Gaenali Bon Ga also serves Korean comfort food such as budae jjigae, or army stew, a spicy pot filled with ramen, kimchi, hot dogs, and tofu. Also try the monkfish soup and claypot galbitang.
