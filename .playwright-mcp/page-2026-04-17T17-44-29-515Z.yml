                  - paragraph [ref=e708]: Inspired by Korean food wagons that evolved into outdoor food stalls, Hanshin Pocha serves street food and savory bar bites that pair well with soju and beer. Wedged in a cluster of casual restaurants near an Albertsons at Quail Hill Shopping Center, the location seems like an unusual place to set up a pocha. But people (many of whom are UCI students) wait in groups outside for tables. The tteokbokki (spicy rice cakes) and kimchi jeongol (kimchi hot pot), along with the pub-friendly whole fried chicken and stir-fried spicy squid are easily shareable. Dishes can also be taken to-go.
