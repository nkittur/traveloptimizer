                - paragraph [ref=e673]: This is the ideal fast-casual stop for Korean homestyle stews, lunches, and rice bowls. Dosirak is the Korean version of a lunchtime bento box. The shop’s large refrigerator case is stocked with seaweed soup, pickled vegetables, and cold noodle salads to take away. For other dishes, orders can be placed at the counter or online. The dosirak and rice bowls with glazed salmon or bulgogi are the most popular. Another popular item is the gimbap, which can be rolled with tuna, spicy pork, bulgogi, shrimp, or vegetables.
