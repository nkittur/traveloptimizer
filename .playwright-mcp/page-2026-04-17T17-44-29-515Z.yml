                - paragraph [ref=e530]: Since opening in 2014, the Korean barbecue export now boasts more than 40 locations in South Korea, Japan, Southeast Asia, and the U.S. In Orange County, the Garden Grove location remains the busiest. Sookdal means “experienced master” and echoes the restaurant’s attention to using aged meat. The beef brisket, bavette, and ribeye are all dry-aged. The pork set with pork neck, pork belly, and marinated pork ribs features wet-aged meat. The sides include Korean shabu-shabu, grilled cheese, sliced pineapple, and mushrooms to grill at the table.
