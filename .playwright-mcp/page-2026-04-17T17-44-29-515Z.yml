                  - paragraph [ref=e334]: Though technically just outside of Orange County in Artesia, Hsiang Yuen Restaurant is worth the stop. The small mom-and-pop restaurant opened in 1983. It’s known for its jajangmyeon, a pork-based black bean sauce dotted with chopped onions and bits of green zucchini. The noodles are springy, sopping up the dark sauce. The crispy fried sesame balls with sweet black beans are a poppable dessert. Though be warned they’re scorchingly hot when they first emerge from the fryer.
