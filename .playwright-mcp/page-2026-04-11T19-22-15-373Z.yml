              - text: over medium-high heat and add the butter and onions. Saute until the onions are golden brown, about 12 to 14 minutes. Add the tomato paste and stir, cooking for another minute. Sprinkle the flour over the mixture and cook for 1 minute or until the raw flour smell dissipates and the flour begins to stick to the bottom of the skillet. Add the beef stock and whisk to combine until the flour is fully incorporated and the mixture thickens, about 1 minute. Stir in the heavy cream, then add the crumbled meatballs to the pan. Set aside.
