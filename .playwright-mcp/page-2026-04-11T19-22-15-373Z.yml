            - paragraph [ref=e570]:
              - text: Andrew Rea loves to bring wacky, surreal dishes to life. It’s why he started his YouTube channel,
              - link "Binging With Babish" [ref=e571] [cursor=pointer]:
                - /url: https://www.youtube.com/c/bingingwithbabish
              - text: ; to recreate foods from beloved movies, TV shows, and video games, giving his 10.5 million subscribers tangible recipes they can make at home. So when we asked the food creator and cookbook author to turn his attention to another fan-favorite destination,
              - link "IKEA" [ref=e572] [cursor=pointer]:
                - /url: https://www.ikea.com/us/en/
              - text: ", and create three recipes using ingredients from the store, Rea was down for the challenge."
            - paragraph [ref=e574]: "For his Swedish meatball Shepherd’s pie, Rea relies on a cheater’s roux to get a thick, luscious gravy — reminiscent of the one you’d find on your plate at an IKEA Restaurant — without any aggressive whisking or time spent nursing the pot to prevent it from burning. For recipe two, a shrimp sandwich borrows its flavor profile from a Scandinavian dill mustard sauce, incorporating fresh dill and lemon zest into each patty. He piles a bounty of butter lettuce on top along with a handful of fried onions for added texture. For dessert, a massive cookie filled with everything but the kitchen sink: cashews, chocolate, crispy wafers, and potato chips. He recommends serving them warm to maintain the gooey, cookie dough-like interior, so reserve a couple of dough balls in the freezer to have at the ready throughout the week."
