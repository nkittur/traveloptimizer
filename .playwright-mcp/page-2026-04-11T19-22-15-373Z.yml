            - paragraph [ref=e616]:
              - strong [ref=e617]: "Step 2:"
              - text: In a large saucepot, add the potatoes and cover with cold water by at least 1 inch. Season generously with salt, cover, and bring to a boil. Once boiling, remove the lid and reduce to a gentle simmer. Cook for about 10 minutes, or until fork tender.
            - paragraph [ref=e619]:
