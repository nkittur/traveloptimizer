              - paragraph [ref=e117]:
                - text: There are some things you can be fairly sure of when you’re visiting Barcelona — a city that, as a travel destination, is not exactly untread territory. First and most reliably, there will be
                - link "jamón" [ref=e118] [cursor=pointer]:
                  - /url: /e/22395370
                - text: . There will be Gaudí. There will be crusty hunks of bread rubbed with tomato and
                - link "tall glasses of vermouth" [ref=e119] [cursor=pointer]:
                  - /url: /e/22391972
                - text: spritzed with soda — the latter preferably consumed in the late morning near a gathering of loud elder Catalonians. There will be football. There will be mind-bending
                - link "tasting menus" [ref=e120] [cursor=pointer]:
                  - /url: /e/22387702
                - text: with six-month wait-lists and platters of paella (better yet,
                - link "fideuà" [ref=e121] [cursor=pointer]:
                  - /url: /e/22385322
                - text: ) scarfed by the seashore. There will be
                - link "11 p.m. dinners" [ref=e122] [cursor=pointer]:
                  - /url: /e/22397099
                - text: . And typically, yes, there will be people. A lot of them — at times crushing throngs from all manner of countries and cruise ships that have, rather unfortunately, choked much of the city for years. (Many of us have been among the guilty.)
              - paragraph [ref=e124]:
                - text: While most of these Barcelona signatures blissfully remain, a global pandemic has a way of changing even the most fundamental givens of a city — especially one that cut off the flood of outsiders for more than a year, an act that, in itself, altered every aspect of city life. Visit today, for instance, and you’ll find the tourist-swarmed Gothic Quarter with fewer T-shirt shops and goblets of sangria and more
                - link "independent, local-leaning restaurants and cafes" [ref=e125] [cursor=pointer]:
                  - /url: /22726478/pandemic-impact-barcelona-restaurants-dining-tourism
                - text: — an increasing number of which proudly write their menus exclusively in Catalan. (The language was banned for much of the 20th century, so its use means something bigger; it’s also why this guide defaults to Catalan spellings.)
              - paragraph [ref=e127]:
                - text: With more space, it’s easier to appreciate other, longer-standing bits of Barcelona life, like the
                - link "quaint covered markets" [ref=e128] [cursor=pointer]:
                  - /url: /e/22385347
                - text: beyond the famed Boqueria, the cherished neighborhood bakeries selling classic
                - link "Catalan treats" [ref=e129] [cursor=pointer]:
                  - /url: /e/22395153
                - text: ", and all the excellent, excellent wine. Tapas still aren’t as big a thing here as in, say, Seville, which gives you extra time to relish potato-stuffed"
                - link "samosas" [ref=e130] [cursor=pointer]:
                  - /url: /e/20937846
                - text: on the beach and other staggering examples of immigrant cooking from Ecuador, Peru, Pakistan, and Morocco. Or hop a bus or tram just beyond the city center headed
                - link "to a tucked-away hamlet, remote beach, or rural winery" [ref=e131] [cursor=pointer]:
                  - /url: /barcelona/22631439/barcelona-day-trips-restaurants
                - text: where everyday local life abounds, and hordes of foreigners do not.
              - generic [ref=e132]:
                - text: advertisement
                - generic [ref=e133]: AD
              - paragraph [ref=e135]: Eater’s guide to Barcelona will help you navigate your way through both the expected and now slightly less-expected Barcelona — essential destinations each, but which you could very easily get all wrong or miss completely without the proper know-how. More importantly, this is a city that feels refreshed, renewed, and recommitted to itself, a palpable vibe you can (yes, even as a traveler) experience firsthand. If it’s not on your post-pandemic travel list, consider this a not-so-subtle hint to reconsider. Here, then, is a collection of stories to help you travel and eat your way through whatever flavor of Barcelona you happen to be craving — with a few slabs of pa amb tomàquet on the side.
