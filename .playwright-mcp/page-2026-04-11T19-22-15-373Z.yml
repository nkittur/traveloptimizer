              - text: over medium-high heat and add the butter, oil, celery, carrots, and a generous pinch of salt. Saute the vegetables until they are softened and lightly browned around the edges, about 8 to 10 minutes. Stir in the frozen peas and cook until defrosted, about 1 more minute. Set the mixture aside.
            - paragraph [ref=e623]:
              - strong [ref=e624]: "Step 4:"
              - text: Drain the potatoes, then add them back to the pot over low heat, stirring frequently until the potatoes are chalky and dry, about 2 to 3 minutes. Pass the potatoes through a ricer and back into the pot, then mix in heavy cream, butter, and grated nutmeg. (Mashing the potatoes with a masher until smooth also works). Add the cheese and gently fold it in. Season with salt and pepper.
            - paragraph [ref=e626]:
