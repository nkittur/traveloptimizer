              - 'link "Where to at the best paella in Barcelona: a local’s guide Foto: 7 Portes" [ref=e314] [cursor=pointer]':
                - /url: /barcelona/restaurants/best-paella-in-barcelona
                - 'img "Where to at the best paella in Barcelona: a local’s guide" [ref=e316]'
                - generic [ref=e318]: "Foto: 7 Portes"
              - generic [ref=e321]: Paella, arroz del señorito, black rice, Milanese-style rice, baked rice, brothy rice with mantis shrimp, arroz a banda with octopus... do you catch our drift? There isn’t just one kind of rice dish in Barcelona, and paella only scratches the surface of the fabulous rice you can try here. But there are a handful of restaurants that do our famous rice dish very, very well – and they’re well worth a visit. Paella has its origins in Valencia (a simple day trip down the coast), but you’ll find plenty of options in Barcelona if you’re looking to sample this most traditional of dishes. Of course, the people of Barcelona will argue that their rice dishes (found on menus as arròs, not paella) are better than the others, but we’ll let you be the judge of that. Here are the best paellas and rice dishes in the city, chosen by our editors. 🍴 Discover our ultimate guide to Barcelona’s restaurant scene Who makes the cut? Headed up by Food & Drink Editor Ricard Martín, the team over at Time Out Barcelona spend their days sampling the very best of Barcelona’s food scene – hearty rice dishes, tucked-away tapas bars, Michelin-starred menus and all the rest of it. Every paella on this list has been reviewed (and usually re-reviewed) by our team. If it’s on here, we’ve tried it, and we truly believe you’ll love it. 📍 Ready to book? Discover the best hotels and the best Airbnbs in Barcelona Ricard Martín is the food and drink editor at Time Out Barcelona. At Time Out, all of...
          - article [ref=e322]:
            - generic [ref=e323]:
              - link "15th Passejada amb Barret (Stroll with a Hat)" [ref=e325] [cursor=pointer]:
                - /url: /barcelona/things-to-do/15th-passejada-amb-barret-stroll-with-a-hat
                - heading "15th Passejada amb Barret (Stroll with a Hat)" [level=3] [ref=e326]
