                - generic [ref=e172]: "Photograph: Shutterstock"
              - generic [ref=e175]: Barcelona is a cultural powerhouse, with world-class galleries, attractions and museums. If you’re a fan of art and museums, you’re probably happy to pay for the experience. However, if you’re trying to persuade a friend who’d rather hit the beach or browse the city’s many great shops, then finding free museum options could be a great way to convince them to come along. Sunday is a great day to visit museums in Barcelona, since some institutions offer free entry on the first Sunday of every month, while others have free access on Sunday afternoons. Below, our local editors have compiled a list of the Barcelona museums which open for free on Sundays – don’t say we’re not good to you.RECOMMENDED:🥘 The best restaurants in Barcelona🍸 The best things to do for free in Barcelona📍 The best attractions in Barcelona🏨 The best hotels in BarcelonaRita Roig is the Culture and News Editor at Time Out Barcelona. This piece was written by the editorial team. At Time Out, all of our travel guides are written by local writers who know their cities inside out. For more about how we curate, see our editorial guidelines.
