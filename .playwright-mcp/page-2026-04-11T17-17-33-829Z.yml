                - generic [ref=e224]: "Foto: Great Visuals - Bar Canyí"
              - generic [ref=e227]: "Barcelona is one of the best cities in the world for eating (and drinking). So welcome to our list of the best restaurants in Barcelona, where you’ll find the cities best spots, carefully selected through experience, curiosity and precision. On our list you’ll find old and new, traditional and modern – you’ll find everything from old-school tapas and contemporary Catalan cuisine to Italian, Japanese, Mediterranean, Mexican and more. The team at Time Out Barcelona have tried every single spot on this list, so you can trust us when we say these are the best restaurants in Barcelona right now. ➡️ Want to try our favourite restaurants all under one roof? Head to Time Out Market Barcelona, which features our favourite chefs in the city, curated by our very own critics. How we curate our lists Headed up by editor Maria Jose Gomez, the team over at Time Out Barcelona spend their days sampling the best things to do on offer in this marvellous city, from brand-new restaurants to cutting-edge exhibitions and all-time attractions. Everything on this list has been reviewed and selected for a reason: we’ve been there (sometimes twice), we think it’s great and we’d genuinely recommend it. For more about how we curate, see our editorial guidelines. By the way, this article includes affiliate links. These links have no influence on our editorial content. For more information, see our affiliate guidelines. 📍 Ultimate guide to eating in Barcelona"
