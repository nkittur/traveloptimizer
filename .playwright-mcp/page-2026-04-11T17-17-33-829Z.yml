              - 'link "The best things to do in Barcelona in 2026 Photograph: Sven Hansche / Shutterstock" [ref=e187] [cursor=pointer]':
                - /url: /barcelona/things-to-do/best-things-to-do-in-barcelona
                - img "The best things to do in Barcelona in 2026" [ref=e189]
                - generic [ref=e191]: "Photograph: Sven Hansche / Shutterstock"
              - generic [ref=e194]: "Everyone should visit Barcelona at least once. Everyone. No excuses. The Catalan capital is a bustling city that lives up to its reputation, a thriving cultural centre with brilliant museums, magnificent restaurants and a club scene that goes all night long – and our very own Time Out Market Barcelona, showcasing the city’s best chefs, restaurants and bars under one roof. But this year, there’s an even bigger reason to visit than usual: 2026 marks the 100th anniversary of the death of architect Antoni Gaudí, the single most influencial figure in Barcelona’s architectural history. 📍 RECOMMENDED: Ultimate guide to what to do in Barcelona Barcelona’s best things to do at a glance 💎 Our can’t miss activity: Gaudí Year 2026 💸 Best free activity: The Magic Fountain light shows 🍹 Best for young adults and couples: El Palace rooftop bar 🥘 Best for foodies: Time Out Market Barcelona 🐋 Best for kids: The port cable cars How we curate our lists Headed up by editor Maria Jose Gomez, the team over at Time Out Barcelona spend their days sampling the best things to do on offer in this marvellous city, from brand-new restaurants to cutting-edge exhibitions and all-time attractions. Everything on this list has been reviewed and selected for a reason: we’ve been there (sometimes twice), we think it’s great and we’d genuinely recommend it. For more about how we curate, see our editorial guidelines. By the way, this article includes affiliate links. These links have no..."
