                - generic [ref=e151]: Time Out Market Barcelona
              - generic [ref=e154]: "Time Out Market is a unique global concept, celebrating authentic flavours and bringing together the best food and chefs of the city, all under one roof. What started in 2014 with the opening of Time Out Market Lisbon has turned into a global phenomenon: Time Out Market Barcelona, which opened in July 2024, is the ninth location of this culinary concept, following in the footsteps of major cities around the world (New York, Montreal, Porto, Cape Town and more). You’ll find Time Out Market Barcelona at Port Vell, on the terrace-viewpoint of Maremagnum. Directly accessible from the street via escalators and a lift, the 5,250 square metre space features a curated selection of 14 chefs, a full-service restaurant and four bars, two of which are outdoors with spectacular views of the sea and the city, including iconic buildings like the Torre del Reloj in Barceloneta and the new fish market. One of the bars is run by Paradiso, one of the best cocktail bars in the world. And if cocktails aren’t your thing, the Market offers every beverage you can imagine, all perfectly executed; wines, speciality coffee, beer, soft drinks, hot chocolates and more. Most of the seating, except for the full-service restaurant, is communal, making it easy for you and your crew to sample a ton of different cuisines in one meal. Though the space is vast and vibrant, it’s incredibly easy to get your hands on the food. Our FAQs page will answer any questions you have about Time Out Market Barcelona. As..."
