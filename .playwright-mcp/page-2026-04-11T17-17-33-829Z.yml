              - generic [ref=e264]: Located in a building constructed for the Internacional Exposition of 1929 that makes for an incomparable setting, this restaurant is an oasis of tranquility and nature. It’s so dreamy that you’ll want to write poems on the napkins and draw pictures on your electricity bills. They have set lunch menus, and they'll also do set dinner menus for groups. In winter, the cafeteria closes at 6pm.
          - article [ref=e265]:
            - generic [ref=e266]:
              - link "The best tapas restaurants in Barcelona" [ref=e268] [cursor=pointer]:
                - /url: /barcelona/restaurants/barcelonas-best-tapas-bars
                - heading "The best tapas restaurants in Barcelona" [level=3] [ref=e269]
              - list [ref=e272]:
                - listitem [ref=e273]:
                  - generic [ref=e274]: Spanish
              - 'link "The best tapas restaurants in Barcelona Foto: Irene Fernández" [ref=e276] [cursor=pointer]':
                - /url: /barcelona/restaurants/barcelonas-best-tapas-bars
                - img "The best tapas restaurants in Barcelona" [ref=e278]
                - generic [ref=e280]: "Foto: Irene Fernández"
              - generic [ref=e283]: "Your Barcelona itinerary might be crammed full, but we can bet tapas is pretty high on your list. After all, for many, tapas bars are a religion – a perfect prelude to a hearty dinner or a varied feast that stands on its own. Tapas are the queens of bars and of good eating and drinking – but not all of them are worth your dough. So where can you find the best in Barcelona? We recommend following this list of bars with foolproof tapas. Long live the tapa. And take note – it’s not an urban myth: there are still places in Barcelona where you’ll get a free tapa with your drink! We’ve sampled more jambon, croquetas and pimientos de padron than we care to admit, but it does make us experts in the stuff. Here are the best places to get tapas in all of Barcelona. 🍴 Ultimate guide to Barcelona’s restaurant scene📍 Ready to book? Discover the best hotels and the best Airbnbs in Barcelona Ricard Martín is the food and drink editor at Time Out Barcelona. At Time Out, all of our travel guides are written by local writers who know their cities inside out. For more about how we curate, see our editorial guidelines."
          - article [ref=e284]:
