              - 'link "Views, booze and tapas: here are the best rooftop bars in Barcelona" [ref=e198] [cursor=pointer]':
                - /url: /barcelona/things-to-do/barcelona-rooftop-bars-drinks-with-a-view
                - 'heading "Views, booze and tapas: here are the best rooftop bars in Barcelona" [level=3] [ref=e199]'
              - 'link "Views, booze and tapas: here are the best rooftop bars in Barcelona Foto: The Hoxton" [ref=e201] [cursor=pointer]':
                - /url: /barcelona/things-to-do/barcelona-rooftop-bars-drinks-with-a-view
                - 'img "Views, booze and tapas: here are the best rooftop bars in Barcelona" [ref=e203]'
                - generic [ref=e205]: "Foto: The Hoxton"
              - generic [ref=e208]: If you’ve already explored some of Barcelona’s best restaurants, it might be time to turn your direction upwards. Rooftops bars offer a welcome escape from the city’s hustle and bustle. It's an opportunity to slow things down, enjoy the view and savour each sip, breeze and ray of sunshine. But don't worry, night owls. There's plenty of sky-high fun after dark, too. Our team of experts rounded up the best rooftop bars in Barcelona, from terraces with tropical gardens to Peruvian restaurants with panoramic views. Here are our favourite spots for this year. After all, everything tastes better from above. 📍 Discover our ultimate guide to nightlife in Barcelona Ricard Martin is the food and drink editor at Time Out Barcelona. At Time Out, all of our travel guides are written by local writers who know their cities inside out. For more about how we curate, see our editorial guidelines.
