                - heading "The best flea markets in Barcelona" [level=3] [ref=e288]
              - list [ref=e291]:
                - listitem [ref=e292]:
                  - generic [ref=e293]: Shopping
              - 'link "The best flea markets in Barcelona Photograph: Pilar Picas / Shutterstock" [ref=e295] [cursor=pointer]':
                - /url: /barcelona/things-to-do/best-weekend-markets-in-barcelona
                - img "The best flea markets in Barcelona" [ref=e297]
                - generic [ref=e299]: "Photograph: Pilar Picas / Shutterstock"
              - generic [ref=e302]: "These days, more and more people prefer to shop in second-hand stores to refresh their wardrobe, and Barcelona has plenty of them. Barcelona’s retail scene is full of this kind of market, and they come in all shapes and sizes: bargains for under a fiver, full-on rummage sales and plenty of bric-a-brac to get your teeth into. At Time Out, we’re fanatics too, and we know it’s not easy to keep track of them all, so we’ve put together a round-up of all of our favourite ones. Here are our favourite flea markets in Barcelona right now, exactly when they run, and exactly where to find them. 📍 Discover more of the best things to do in Barcelona How we curate our lists Headed up by editor Maria Jose Gomez, the team over at Time Out Barcelona spend their days sampling the best things to do on offer in this marvellous city, from brand-new restaurants to cutting-edge exhibitions and all-time attractions. These guides are translated into English for our global audience. Everything on this list has been reviewed and selected for a reason: we’ve been there (sometimes twice), we think it’s great and we’d genuinely recommend it. For more about how we curate, see our editorial guidelines. By the way, this article includes affiliate links. These links have no influence on our editorial content. For more information, see our affiliate guidelines. 🍴 Everything you need to know about Time Out Market Barcelona🏨 The very best hotels to book in Barcelona"
          - article [ref=e303]:
