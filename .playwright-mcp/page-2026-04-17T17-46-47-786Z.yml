                              - generic [ref=f307e26]:
                                - heading "IMPORTANT SAFETY INFORMATION AND USE" [level=2] [ref=f307e28]
                                - generic [ref=f307e30]:
                                  - heading "What is the most important information I should know about RINVOQ?" [level=2] [ref=f307e31]:
                                    - text: What is the most important information I should know
                                    - text: about RINVOQ?
                                  - heading "RINVOQ may cause serious side effects, including:" [level=3] [ref=f307e32]
                                  - list [ref=f307e33]:
                                    - listitem [ref=f307e34]:
                                      - strong [ref=f307e35]: Serious infections.
                                      - text: RINVOQ can lower your ability to fight infections. Serious infections have happened while taking RINVOQ, including tuberculosis (TB) and infections caused by bacteria, fungi, or viruses that can spread throughout the body. Some people have died from these infections. Your healthcare provider (HCP) should test you for TB before starting RINVOQ and check you closely for signs and symptoms of TB during treatment with RINVOQ. You should not start taking RINVOQ if you have any kind of infection unless your HCP tells you it is okay. If you get a serious infection, your HCP may stop your treatment until your infection is controlled. You may be at higher risk of developing shingles (herpes zoster).
                                    - listitem [ref=f307e36]:
                                      - strong [ref=f307e37]: Increased risk of death in people 50 years and older who have at least 1 heart disease (cardiovascular) risk factor.
                                    - listitem [ref=f307e38]:
                                      - strong [ref=f307e39]: Cancer and immune system problems.
                                      - text: RINVOQ may increase your risk of certain cancers. Lymphoma and other cancers, including skin cancers, can happen. Current or past smokers are at higher risk of certain cancers, including lymphoma and lung cancer. Follow your HCP’s advice about having your skin checked for skin cancer during treatment with RINVOQ. Limit the amount of time you spend in sunlight. Wear protective clothing when you are in the sun and use sunscreen.
                                    - listitem [ref=f307e40]:
                                      - strong [ref=f307e41]: Increased risk of major cardiovascular (CV) events, such as heart attack, stroke, or death, in people 50 years and older who have at least 1 heart disease (CV) risk factor, especially if you are a current or past smoker.
                                    - listitem [ref=f307e42]:
                                      - strong [ref=f307e43]: Blood clots.
                                      - text: Blood clots in the veins of the legs or lungs and arteries can happen with RINVOQ. This may be life-threatening and cause death. Blood clots in the veins of the legs and lungs have happened more often in people who are 50 years and older and with at least 1 heart disease (CV) risk factor.
                                    - listitem [ref=f307e44]:
                                      - strong [ref=f307e45]: Allergic reactions.
                                      - text: Symptoms such as rash (hives), trouble breathing, feeling faint or dizzy, or swelling of your lips, tongue, or throat, that may mean you are having an allergic reaction have been seen in people taking RINVOQ. Some of these reactions were serious. If any of these symptoms occur during treatment with RINVOQ, stop taking RINVOQ and get emergency medical help right away.
                                    - listitem [ref=f307e46]:
                                      - strong [ref=f307e47]: Tears in the stomach or intestines.
                                      - text: This happens most often in people who take nonsteroidal anti-inflammatory drugs (NSAIDs) or corticosteroids. Get medical help right away if you get stomach-area pain, fever, chills, nausea, or vomiting.
                                    - listitem [ref=f307e48]:
                                      - strong [ref=f307e49]: Changes in certain laboratory tests.
                                      - text: Your HCP should do blood tests before you start taking RINVOQ and while you take it. Your HCP may stop your RINVOQ treatment for a period of time if needed because of changes in these blood test results.
                                  - paragraph [ref=f307e50]:
                                    - strong [ref=f307e51]: Do not take RINVOQ if you are allergic to upadacitinib or any of the ingredients in RINVOQ.
                                    - text: See the Medication Guide or Consumer Brief Summary for a complete list of ingredients.
                                  - heading "What should I tell my HCP BEFORE starting RINVOQ?" [level=2] [ref=f307e52]
                                  - paragraph [ref=f307e53]: "Tell your HCP if you:"
                                  - list [ref=f307e54]:
                                    - listitem [ref=f307e55]:
                                      - text: "Are being treated for an infection, have an infection that won’t go away or keeps coming back, or have symptoms of an infection, such as:"
                                      - list [ref=f307e56]:
                                        - generic [ref=f307e57]:
                                          - listitem [ref=f307e58]: Fever, sweating, or chills
                                          - listitem [ref=f307e59]: Shortness of breath
                                          - listitem [ref=f307e60]: Warm, red, or painful skin or sores on your body
                                          - listitem [ref=f307e61]: Muscle aches
                                          - listitem [ref=f307e62]: Feeling tired
                                          - listitem [ref=f307e63]: Blood in phlegm
                                        - generic [ref=f307e64]:
                                          - listitem [ref=f307e65]: Diarrhea or stomach pain
                                          - listitem [ref=f307e66]: Cough
                                          - listitem [ref=f307e67]: Weight loss
                                          - listitem [ref=f307e68]: Burning when urinating or urinating more often than normal
                                    - listitem [ref=f307e69]: Have TB or have been in close contact with someone with TB.
                                    - listitem [ref=f307e70]: Are a current or past smoker.
                                    - listitem [ref=f307e71]: Have had a heart attack, other heart problems, or stroke.
                                    - listitem [ref=f307e72]: Have or have had any type of cancer, hepatitis B or C, shingles (herpes zoster), blood clots in the veins of your legs or lungs, diverticulitis (inflammation in parts of the large intestine), or ulcers in your stomach or intestines.
                                    - listitem [ref=f307e73]: Have other medical conditions, including liver problems, low blood cell counts, diabetes, chronic lung disease, HIV, or a weak immune system.
                                    - listitem [ref=f307e74]: Live, have lived, or have traveled to parts of the country, such as the Ohio and Mississippi River valleys and the Southwest, that increase your risk of getting certain kinds of fungal infections. If you are unsure if you've been to these types of areas, ask your HCP.
                                    - listitem [ref=f307e75]: Have recently received or are scheduled to receive a vaccine. People who take RINVOQ should not receive live vaccines.
                                    - listitem [ref=f307e76]: Are pregnant or plan to become pregnant. Based on animal studies, RINVOQ may harm your unborn baby. Your HCP will check whether or not you are pregnant before you start RINVOQ. You should use effective birth control (contraception) to avoid becoming pregnant during treatment with RINVOQ and for 4 weeks after your last dose.
                                    - listitem [ref=f307e77]: There is a pregnancy surveillance program for RINVOQ. The purpose of the program is to collect information about the health of you and your baby. If you become pregnant while taking RINVOQ, you are encouraged to report the pregnancy by calling 1-800-633-9110.
                                    - listitem [ref=f307e78]: Are breastfeeding or plan to breastfeed. RINVOQ may pass into your breast milk. Do not breastfeed during treatment with RINVOQ and for 6 days after your last dose.
                                  - paragraph [ref=f307e79]:
                                    - strong [ref=f307e80]: Tell your HCP about all the medicines you take,
                                    - text: including prescription and over-the-counter medicines, vitamins, and herbal supplements. RINVOQ and other medicines may affect each other, causing side effects.
                                  - paragraph [ref=f307e81]:
                                    - strong [ref=f307e82]: "Especially tell your HCP if you take:"
                                  - list [ref=f307e83]:
                                    - listitem [ref=f307e84]: Medicines for fungal or bacterial infections
                                    - listitem [ref=f307e85]: Rifampicin or phenytoin
                                    - listitem [ref=f307e86]: Medicines that affect your immune system
                                  - paragraph [ref=f307e87]: If you are not sure if you are taking any of these medicines, ask your HCP or pharmacist.
                                  - heading "What should I avoid while taking RINVOQ?" [level=2] [ref=f307e88]
                                  - paragraph [ref=f307e89]: Avoid food or drink containing grapefruit during treatment with RINVOQ as it may increase the risk of side effects.
                                  - heading "What should I do or tell my HCP AFTER starting" [level=2] [ref=f307e90]
                                  - heading "RINVOQ?" [level=2] [ref=f307e91]
                                  - list [ref=f307e92]:
                                    - listitem [ref=f307e93]: Tell your HCP right away if you have any symptoms of an infection. RINVOQ can make you more likely to get infections or make any infections you have worse.
                                    - listitem [ref=f307e94]:
                                      - text: "Get emergency help right away if you have any symptoms of a heart attack or stroke while taking RINVOQ, including:"
                                      - list [ref=f307e95]:
                                        - generic [ref=f307e96]:
                                          - listitem [ref=f307e97]: Discomfort in the center of your chest that lasts for more than a few minutes or that goes away and comes back
                                          - listitem [ref=f307e98]: Severe tightness, pain, pressure, or heaviness in your chest, throat, neck, or jaw
                                          - listitem [ref=f307e99]: Pain or discomfort in your arms, back, neck, jaw, or stomach
                                        - generic [ref=f307e100]:
                                          - listitem [ref=f307e101]: Shortness of breath with or without chest discomfort
                                          - listitem [ref=f307e102]: Breaking out in a cold sweat
                                          - listitem [ref=f307e103]: Nausea or vomiting
                                          - listitem [ref=f307e104]: Feeling lightheaded
                                          - listitem [ref=f307e105]: Weakness in one part or on one side of your body
                                          - listitem [ref=f307e106]: Slurred speech
                                    - listitem [ref=f307e107]:
                                      - text: "Tell your HCP right away if you have any signs or symptoms of blood clots during treatment with RINVOQ, including:"
                                      - list [ref=f307e108]:
                                        - listitem [ref=f307e109]: Swelling
                                        - listitem [ref=f307e110]: Pain or tenderness in one or both legs
                                        - listitem [ref=f307e111]: Sudden unexplained chest or upper back pain
                                        - listitem [ref=f307e112]: Shortness of breath or difficulty breathing
                                    - listitem [ref=f307e113]: Tell your HCP right away if you have a fever or stomach-area pain that does not go away, and a change in your bowel habits.
                                  - heading "What are other possible side effects of RINVOQ?" [level=2] [ref=f307e114]
                                  - paragraph [ref=f307e115]: Common side effects include upper respiratory tract infections (common cold, sinus infections), shingles (herpes zoster), herpes simplex virus infections (including cold sores), bronchitis, nausea, cough, fever, acne, headache, swelling of the feet and hands (peripheral edema), increased blood levels of creatine phosphokinase, allergic reactions, inflammation of hair follicles, stomach-area (abdominal) pain, increased weight, flu, tiredness, lower number of certain types of white blood cells (neutropenia, lymphopenia, leukopenia), muscle pain, flu-like illness, rash, increased blood cholesterol levels, increased liver enzyme levels, pneumonia, low number of red blood cells (anemia), and infection of the stomach and intestine (gastroenteritis).
                                  - paragraph [ref=f307e116]: A separation or tear to the lining of the back part of the eye (retinal detachment) has happened in people with atopic dermatitis treated with RINVOQ. Call your HCP right away if you have any sudden changes in your vision during treatment with RINVOQ.
                                  - paragraph [ref=f307e117]: Some people taking RINVOQ may see medicine residue (a whole tablet or tablet pieces) in their stool. If this happens, call your healthcare provider.
                                  - paragraph [ref=f307e118]: These are not all the possible side effects of RINVOQ.
                                  - heading "How should I take RINVOQ?" [level=2] [ref=f307e119]
                                  - paragraph [ref=f307e120]: RINVOQ is taken once a day with or without food. Do not split, crush, or chew the tablet. Take RINVOQ exactly as your HCP tells you to use it. RINVOQ is available in 15 mg, 30 mg, and 45 mg extended-release tablets.
                                  - paragraph [ref=f307e121]:
                                    - strong [ref=f307e122]: This is the most important information to know about RINVOQ. For more information, talk to your HCP.
                                  - paragraph [ref=f307e123]:
                                    - strong [ref=f307e124]:
                                      - text: You are encouraged to report negative side effects of prescription drugs to the FDA. Visit
                                      - link "www.fda.gov/medwatch" [ref=f307e125]:
                                        - /url: javascript:void(window.open(window.clickTag4, 'blank'))
                                      - text: or call 1-800-FDA-1088.
                                  - paragraph [ref=f307e126]:
                                    - strong [ref=f307e127]:
                                      - text: If you are having difficulty paying for your medicine, AbbVie may be able to help. Visit
                                      - link "AbbVie.com/PatientAccessSupport" [ref=f307e128]:
                                        - /url: javascript:void(window.open(window.clickTag5, 'blank'))
                                      - text: to learn more.
                                  - heading "USE" [level=2] [ref=f307e129]
                                  - paragraph [ref=f307e130]: RINVOQ is a prescription medicine used to treat adults with moderate to severe rheumatoid arthritis (RA) when 1 or more medicines called tumor necrosis factor (TNF) blockers have been used, and did not work well or could not be tolerated. It is not known if RINVOQ is safe and effective in children under 2 years of age with polyarticular juvenile idiopathic arthritis (pJIA).
                                  - paragraph [ref=f307e131]:
                                    - strong [ref=f307e132]:
                                      - text: Please see the
                                      - link "Full Prescribing Information" [ref=f307e133]:
                                        - /url: javascript:void(window.open(window.clickTag2, 'blank'))
                                      - text: ", including the"
                                      - link "Medication Guide" [ref=f307e134]:
                                        - /url: javascript:void(window.open(window.clickTag3, 'blank'))
                                      - text: ", for RINVOQ."
