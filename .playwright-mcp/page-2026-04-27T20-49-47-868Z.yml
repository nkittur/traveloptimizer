                    - /url: https://www.one66hotel.com/
                - text: has something for everyone, with full apartments, spacious standard rooms and glamping units, as well as a gym, a superb pizzeria and its own laundromat. Rooms start at €90, and include breakfast.
              - listitem [ref=e207]:
                - strong [ref=e208]:
                  - link "Tivoli Boutique Inn" [ref=e209] [cursor=pointer]:
                    - /url: https://tivoliboutiqueinn.com/
                - text: ", which opened in March, has 30 rooms across three floors and is a friendly, well-priced hotel on a quiet street with a gracious staff. Among its most attractive qualities is its proximity to Ljubljana’s sprawling Tivoli Park — the city’s largest green space. Rooms start at €80."
              - listitem [ref=e210]:
                - text: A slew of
                - strong [ref=e211]: short-term rentals
                - text: can be found across town, and all within easy reach of Ljubljana’s main draws. For the best options near the Old Town area, check out the Krakovo, Trnovo and Mirje districts. The up-and-coming Siska District, just northwest of the city center tourist zone, provides a little more breathing room.
