            - paragraph [ref=e90]:
              - generic [ref=e91]:
                - text: By Alex Crevar
                - text: Photographs by Susan Wright
            - paragraph [ref=e92]: Alex Crevar is a freelance journalist and regular contributor to New York Times Travel. He has lived in and covered the Western Balkans for 25 years.
            - time [ref=e93]: June 13, 2024
          - paragraph [ref=e94]:
            - text: A lifetime in travel has passed since Ljubljana was named the European Commission’s
            - link "“green capital”" [ref=e95] [cursor=pointer]:
              - /url: https://environment.ec.europa.eu/topics/urban-environment/european-green-capital-award_en
            - text: for 2016, but philosophically little has changed for the capital of Slovenia. Ljubljana is still an international
            - link "model for sustainability" [ref=e96] [cursor=pointer]:
              - /url: https://www.slovenia.info/en/business/green-scheme-of-slovenian-tourism
            - text: "with more than 1,600 shared-bicycle docking sites, a car-free urban center and an average of around 5,900 square feet of green space per citizen. It also remains quintessentially Central European: Just look to the hilltop castle that guards the cobbled squares straddling the Ljubljanica River. That’s not to say the city of nearly 300,000, which is framed by the Julian and Kamnik-Savinja Alps and traces its history back more than 5,000 years, hasn’t evolved. In recent years, Ljubljana opened Michelin-starred restaurants,"
            - link "UNESCO" [ref=e97] [cursor=pointer]:
              - /url: https://whc.unesco.org/en/list/1643
            - text: recognized the city for its urban design and last fall, in classic Slovenian recycle-and-reuse fashion, the city reopened a former
            - link "bicycle factory" [ref=e98] [cursor=pointer]:
              - /url: https://center-rog.si/en/
            - text: as a creative hub with open studios, galleries and shops.
