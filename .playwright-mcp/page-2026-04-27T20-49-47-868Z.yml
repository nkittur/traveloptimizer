              - listitem [ref=e201]:
                - strong [ref=e202]:
                  - link "April 1550" [ref=e203] [cursor=pointer]:
                    - /url: https://www.april1550.com/
                - text: ", in the Old Town and built in 1550, has eight rooms, each with their own character, all meticulously designed to feel like home — only much nicer and with exceptional service. The owners, Ljubljana residents who live nearby, are on hand for travel tips and there’s a pastry chef on site for exquisite breakfasts. Rooms start at €260, or about $281."
