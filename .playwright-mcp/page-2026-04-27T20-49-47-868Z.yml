              - listitem [ref=e106]:
                - strong [ref=e107]:
                  - link "Ljubljana Castle" [ref=e108] [cursor=pointer]:
                    - /url: https://www.ljubljanskigrad.si/en
                - text: and its Castle Hill has watched over the capital for millennia and is the spot for panoramas, wine and dinner in a Michelin-starred restaurant.
              - listitem [ref=e109]:
                - strong [ref=e110]:
                  - link "Plecnik House" [ref=e111] [cursor=pointer]:
                    - /url: https://mgml.si/en/plecnik-house/
                - text: ", which was the home and studio of the city’s chief 20th-century designer, Joze Plecnik, remains as he left it at the time of his death in 1957."
              - listitem [ref=e112]:
                - text: The
                - strong [ref=e113]:
                  - link "Krizanke Summer Theater" [ref=e114] [cursor=pointer]:
                    - /url: https://www.visitljubljana.com/en/poi/krizanke-summer-theatre/
                - text: ", which comes alive from June to September during the Ljubljana Festival, stages pop, jazz and symphonic concerts."
              - listitem [ref=e115]:
                - strong [ref=e116]:
                  - link "Center Rog" [ref=e117] [cursor=pointer]:
                    - /url: https://center-rog.si/en/
                - text: ", a former bicycle factory opened last year as an art laboratory and now provides workspaces for designers and artists, a public library, cafes and shops."
