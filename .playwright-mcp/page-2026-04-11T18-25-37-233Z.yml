              - generic [ref=e228]:
                - paragraph [ref=e229]:
                  - strong [ref=e230]: Tell us about your first impressions when you arrived.
                  - text: "Clean, modern, and elegant, the restaurant feels exclusive without being stuffy. Disfrutar’s credentials speak for themselves: Apart from its three-star Michelin status, the restaurant was ranked number one in the world in the 2024 edition of the prestigious"
                  - link "World’s 50 Best Restaurants list" [ref=e231] [cursor=pointer]:
                    - /url: https://www.theworlds50best.com/list/1-50
                  - text: . Daring to step foot inside might seem like an intimidating prospect, but the staff here is so welcoming that you can’t help but feel at ease. There are no white tablecloths or gloves, just a bright, airy space where the food does all the talking.
                - paragraph [ref=e232]:
                  - strong [ref=e233]: What was the crowd like?
                  - text: "When Mateu Casañas, Oriol Castro, and Eduard Xatruch (all alums of El Bulli, former best restaurant in the world) decided to open a restaurant of their own, one thing was clear: They wanted it to be the kind of friendly, informal place where anyone would feel welcome. They named the restaurant Disfrutar, which means \"enjoy,\" and that’s exactly what you'll do."
                - paragraph [ref=e234]:
                  - strong [ref=e235]: What should we be drinking?
                  - text: There's an
                  - link "extensive wine list" [ref=e236] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/gallery/best-wine-bars-in-barcelona
                  - text: that includes reasonably priced glasses, to a mind-boggling selection of bottles, or a wine pairing to go with your tasting menu, priced at €170.
                - paragraph [ref=e237]:
                  - strong [ref=e238]: "Main event: the food. Give us the lowdown—especially what not to miss."
                  - text: "A tasting menu at Disfrutar is like a performance: There's fire, ice, smoke, and lots of flavor and color. This is why Disfrutar can only really be experienced in the tasting menu format. Casañas, Castro, and Xatruch’s creations are playful and unpredictable, often surprising us by telling our eyes one thing but sending our taste buds a completely different message. Disfrutar has too many life-altering dishes to list here, but, if it’s your first time here, we recommend trying the “Classic” menu featuring many of the star dishes that have earned Disfrutar its lofty status: like the crispy egg yolk with mushroom gelatin, and the chocolate peppers with oil and salt. Also the “panchino” bao bun that oozes creamy Beluga caviar is simply transcendent."
                - paragraph [ref=e239]:
                  - strong [ref=e240]: And how did the front-of-house folks treat you?
                  - text: Disfrutar may be serious about its food, but that doesn’t mean it hires snooty waiters. On the contrary, servers at Disfrutar are warm, laid-back, and eager to help.
                - paragraph [ref=e241]:
                  - strong [ref=e242]: What’s the real-real on why we’re coming here?
                  - text: Come for any special occasion or just for fun. All you need is an open mind and a curious palate (and, yes, a fat stack of euros).
