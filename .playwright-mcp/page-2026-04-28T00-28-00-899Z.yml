              - generic [ref=e64]:
                - text: By Cindy Hirschfeld
                - text: Photographs by Ruth Fremson
            - paragraph [ref=e65]: Cindy Hirschfeld, an avid skier and frequent contributor to the Travel section, regularly visits the Canadian Rockies.
            - time [ref=e66]: Feb. 20, 2025
          - paragraph [ref=e67]:
            - text: The town of Banff, about 80 miles west of Calgary in southwest Alberta, sits within
            - link "Canada’s oldest national park" [ref=e68] [cursor=pointer]:
              - /url: https://parks.canada.ca/pn-np/ab/banff
            - text: of the same name, offering awe-inspiring mountain views at every turn, and, of course, an abundance of outdoor recreation. In summer, two million visitors pour into the park, but despite
            - link "three ski resorts" [ref=e69] [cursor=pointer]:
              - /url: https://www.skibig3.com/
            - text: nearby, winter is noticeably quieter. That makes it a perfect time to bundle up and enjoy the snow-blanketed natural splendor, enhanced by new lifts and recent terrain updates at the ski areas, as well as new hotels and restaurants. Thanks to institutions like the
            - link "Banff Center for Arts and Creativity" [ref=e70] [cursor=pointer]:
              - /url: https://www.banffcentre.ca/
            - text: ", internationally known for its"
            - link "mountain film festival" [ref=e71] [cursor=pointer]:
              - /url: https://www.banffcentre.ca/banffmountainfestival/tour
            - text: ", this town of 10,300 residents (all of whom must be locally employed to live within the national park) also has a vibrant cultural scene that sets it apart from many other mountain resorts. Plus, the town’s natural hot springs that have long attracted visitors are open year-round."
        - generic [ref=e72]: Advertisement
        - heading "Recommendations" [level=2] [ref=e73]
        - generic [ref=e74]:
          - generic [ref=e75]:
            - button "Key stops –" [ref=e76] [cursor=pointer]:
              - text: Key stops
              - generic [ref=e77]: –
            - list [ref=e78]:
              - listitem [ref=e79]:
                - text: The
                - link "Banff Gondola" [ref=e80] [cursor=pointer]:
                  - /url: https://www.banffjaspercollection.com/attractions/banff-gondola/
                - text: whisks you to the top of Sulphur Mountain in eight minutes and, on winter evenings, the experience includes an immersive multimedia art exhibit called
                - link "Nightrise" [ref=e81] [cursor=pointer]:
                  - /url: https://www.banffjaspercollection.com/attractions/banff-gondola/events/nightrise/
                - text: .
              - listitem [ref=e82]:
                - link "Banff Sunshine" [ref=e83] [cursor=pointer]:
                  - /url: https://www.skibanff.com/
                - text: ski area, five miles from town, has 138 trails on more than 3,300 acres across three peaks and a season that lasts into May.
              - listitem [ref=e84]:
                - text: The region’s biggest ski resort is
                - link "Lake Louise" [ref=e85] [cursor=pointer]:
                  - /url: https://www.skilouise.com/
                - text: ", 32 miles from Banff, with 164 runs on 4,200 acres and extensive open bowls."
              - listitem [ref=e86]:
                - link "Banff Upper Hot Springs" [ref=e87] [cursor=pointer]:
                  - /url: https://hotsprings.ca/banff/
                - text: has drawn visitors since the late 1800s to its mineral-rich pool on the side of Sulphur Mountain.
          - generic [ref=e88]:
            - button "Attractions and activities +" [ref=e89] [cursor=pointer]:
              - text: Attractions and activities
              - generic [ref=e90]: +
            - list:
              - listitem [ref=e91]:
                - text: The
                - link "Whyte Museum of the Canadian Rockies" [ref=e92] [cursor=pointer]:
                  - /url: https://www.whyte.org/
                - text: provides an excellent overview of the Banff region’s mountain ethos through exhibits that explore art, history, nature, outdoor recreation and more.
              - listitem [ref=e93]:
                - link "Mount Norquay" [ref=e94] [cursor=pointer]:
                  - /url: https://banffnorquay.com/
                - text: is Banff’s original ski area, opened in 1926, and today offers 60 runs on 190 acres.
              - listitem [ref=e95]:
                - link "Lake Minnewanka" [ref=e96] [cursor=pointer]:
                  - /url: https://www.banfflakelouise.com/experiences/lake-minnewanka
                - text: ", a 10-minute drive from Banff, is a favorite spot for star-gazing and viewing the northern lights."
              - listitem [ref=e97]:
                - link "Johnston Canyon" [ref=e98] [cursor=pointer]:
                  - /url: https://www.alltrails.com/trail/canada/alberta/johnston-canyon-to-upper-falls
                - text: ", 15.5 miles west of Banff, includes a winter hiking trail popular for its up-close views of fantastical frozen waterfalls and cascades."
              - listitem [ref=e99]:
                - link "Vermilion Lakes" [ref=e100] [cursor=pointer]:
                  - /url: https://parks.canada.ca/pn-np/ab/banff/visit/les10-top10/vermilion
                - text: is a good spot to ice skate near town and offers stellar views of high peaks.
