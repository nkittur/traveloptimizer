          - figure "scoop-picture" [ref=e243]:
            - img "People sit in a row of white Adirondack chairs on a grassy hill that faces the sea. A speedboat leaves a wake of white foam in the ocean, and sailboats can be seen in the distance. A server wearing an apron stands in front of the people in chairs with a tray." [ref=e247]
            - generic [ref=e248]: Castle Hill Inn
          - generic [ref=e249]:
            - generic [ref=e250]: 12 p.m. Lunch on a legendary lawn
            - generic [ref=e251]:
              - text: Pedaling two miles past Fort Adams along Newport’s bucolic southwestern edge, turn right at the sign for the
              - link "Castle Hill Inn" [ref=e252] [cursor=pointer]:
                - /url: https://www.castlehillinn.com/
              - text: ", built in 1875 as a summer home for the pioneering deep-sea oceanographer Alexander Agassiz. While locals prize the hotel’s grassy knoll for sundowners, a midday reservation on the patio at"
              - link "the Lawn" [ref=e253] [cursor=pointer]:
                - /url: https://www.castlehillinn.com/dine/the-lawn/
              - text: restaurant brings plenty of close-up boat watching. Enjoy Point Judith calamari ($19) and a large gratin pan of rigatoni al forno ($32) with eggplant confit, tomatoes, olives and goat cheese. If it rains, the floor-to-ceiling windows in the dining room beautifully frame Narragansett Bay. On a sunny day, recline post-feast in white Adirondack chairs as boats tack across the water. Afterward, follow the hotel’s short private trail that leads to the
              - link "Castle Hill Lighthouse" [ref=e254] [cursor=pointer]:
                - /url: https://www.lighthousefriends.com/light.asp?ID=396
              - text: ", tucked into a cliff and listed on the National Register of Historic Places."
          - generic [ref=e255]:
            - generic [ref=e256]: 1 p.m. Ride into the Gilded Age
            - generic [ref=e257]:
              - text: Pedal south on Ocean Avenue, along breathtaking bluffs and past Brenton Point State Park, popular with kite flyers, until you reach the secluded
              - link "Bailey’s Beach" [ref=e258] [cursor=pointer]:
                - /url: https://www.google.com/maps/place/Bailey%E2%80%99s+Beach/@41.4555322,-71.3131348,17z/data=!3m1!4b1!4m6!3m5!1s0x89e5a5bffe70299b:0x1c70f93079d784c1!8m2!3d41.4555282!4d-71.3105545!16s%2Fm%2F080f8ym?entry=ttu
              - text: . There’s powdery white sand, few, if any, people, and no place to park a car. From there, a four-minute spin north on Bellevue Avenue will bring you to the Beaux-Art style
              - link "Marble House" [ref=e259] [cursor=pointer]:
                - /url: https://www.newportmansions.org/mansions-and-gardens/marble-house/
              - text: (entry, $25), which cost $11 million to build between 1888 and 1892 ($7 million spent on marble). It was William Vanderbilt's 39th birthday present to his wife Alva, who would make this home an unofficial command post of Rhode Island’s suffrage movement. The free self-guided audio tour offers informative nuggets about rooms like the Versailles-inspired grand salon. Suffragettes drank tea from “Votes for Women” chinaware in the
              - link "Chinese Tea House" [ref=e260] [cursor=pointer]:
                - /url: https://resy.com/cities/nwp/stoneacre-tea-house?date=2023-06-15&seats=2
              - text: ", which, today, serves a $35 prix-fixe afternoon tea on weekends."
          - figure "scoop-picture" [ref=e262]:
            - img "Decorative, colorful paper artworks hang from the ceiling inside a museum space. An intricately carved wooden staircase rail slopes in the background, and a colorful large painting hangs on the wall behind." [ref=e266]
            - generic [ref=e267]: Newport Art Museum
          - generic [ref=e268]:
            - generic [ref=e269]: 3:30 p.m. Admire statement pieces
            - generic [ref=e270]:
              - text: Ride north a couple of miles (or hop on the bike-friendly
              - link "#67 trolley" [ref=e271] [cursor=pointer]:
                - /url: https://www.discovernewport.org/blog/post/free-trolley/
              - text: ) along Bellevue Avenue, until you arrive at the
              - link "Newport Art Museum" [ref=e272] [cursor=pointer]:
                - /url: https://newportartmuseum.org/
              - text: ", an oft-overlooked wonder founded in 1912. In a current exhibition, “"
              - link "Shaman Ladders and Other Stories" [ref=e273] [cursor=pointer]:
                - /url: https://newportartmuseum.org/exhibitions/ana-flores-shaman-ladders-and-other-stories/
              - text: "” (through Nov. 5), the Cuban-born Rhode Islander Ana Flores’ deep-seated tree chairs invite viewers to find answers in nature. Newport is as much for art lovers as for thalassophiles: Newcomers like"
              - link "CUSP Gallery" [ref=e274] [cursor=pointer]:
                - /url: https://www.cuspgallery.com/
              - text: and the
              - link "Matriarch" [ref=e275] [cursor=pointer]:
                - /url: https://matriarchri.com/home
              - text: store are keeping the community’s creative soul afloat, as well as the longtime art co-op
              - link "Spring Bull Gallery" [ref=e276] [cursor=pointer]:
                - /url: https://springbullgallery.com/
              - text: and the local artist
              - link "Chris Wyllie" [ref=e277] [cursor=pointer]:
                - /url: https://www.chriswyllie.com/
              - text: ". Also make time to see the “Pride: In Retrospect” exhibition, showcasing 50 years of queer history, at the"
              - link "Newport Pride Center" [ref=e278] [cursor=pointer]:
                - /url: https://www.newportprideri.org/about-1
              - text: ", a new inclusive space and resource for the L.G.B.T.Q. community."
          - generic [ref=e279]:
            - generic [ref=e280]: 6 p.m. Level up at a celebrated ristorante
            - generic [ref=e281]:
              - text: Bypass the crowd outside
              - link "Scales & Shells" [ref=e282] [cursor=pointer]:
                - /url: https://www.scalesandshells.com/
              - text: ", the Italian seafood institution since 1987: Instead, a door on the corner of Thames and Goodwin Streets leads you to its new sister restaurant upstairs,"
              - link "Upscales" [ref=e283] [cursor=pointer]:
                - /url: https://www.scalesandshells.com/
              - text: . Neither restaurant takes reservations, but an early arrival at Upscales, which is the more laid-back of the two, should grant you the coveted balcony table overlooking Thames, where a hungry horde may still be huffing by the time you’ve finished the Lavender Bees Knees cocktail ($14) and started on the lobster ravioli ($29).
          - figure "scoop-picture" [ref=e285]:
            - img "People sit at a dark wooden bar smiling and drinking espresso martinis." [ref=e289]
            - generic [ref=e290]: Midtown Oyster Bar
          - generic [ref=e291]:
            - generic [ref=e292]: 7:30 p.m. Hit the high notes
            - generic [ref=e293]:
              - text: Move west on Thames past the booming Midtown Oyster Bar, the bachelorette parties and the glowing pedicabs rumbling along the cobblestones, until you reach a little-known historic site on Pelham Street, the first street in the United States to be illuminated with a gas-lit lamp in 1805. Above the lamppost is a sign for
              - link "Dueling Pianos" [ref=e294] [cursor=pointer]:
                - /url: https://thepelham.com/dueling-pianos/
              - text: ", a rollicking piano bar experience with roots in the ragtime era of the 1890s. On the building’s third floor, grab a drink with sparkling harbor views from the lounge area. At 8 p.m., two singing pianists will perform requested songs, be it Elton John’s “Bennie and the Jets” or Mark Ronson’s cover of “Valerie.” (Standing-room tickets range from free to $20. Tables for five start at $100.)"
        - figure "scoop-picture" [ref=e295]:
          - img "People relax on a beach with white sand during the daytime. The ocean is blue and calm, with small waves." [ref=e299]
          - generic [ref=e300]: Pedal a bike down Ocean Avenue, along breathtaking bluffs, to reach the secluded Bailey’s Beach. There’s powdery white sand, few, if any, people, and no place to park a car.
