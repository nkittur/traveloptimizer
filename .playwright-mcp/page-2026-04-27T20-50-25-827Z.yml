            - generic [ref=e197]: 3:15 p.m. Sail like a champ
            - generic [ref=e198]:
              - text: Next to Bowen’s Wharf, board a 12-metre America’s Cup boat for a two-hour, family-friendly sail ($90) up Narragansett Bay. The
              - link "America’s Cup Charters" [ref=e199] [cursor=pointer]:
                - /url: https://americascupcharters.com/
              - text: fleet includes the legendary US 22 Intrepid, known for winning the sport’s most famous race in 1967 and 1970. Cruising through the harbor, you may spy a white egret coasting off the bow and catch a fishy whiff in the warm breeze. Guests can pitch in, taking the wheel or trimming the sails, or simply relax with a can of sparkling water. The knowledgeable crew sprinkles in tales about points of interest such as the 1870
              - link "Rose Island Lighthouse" [ref=e200] [cursor=pointer]:
                - /url: https://roseisland.org/
              - text: (where you can spend the night) and a red-roofed Victorian mansion where Jacqueline Bouvier Kennedy grew up and later had her wedding reception with President John F. Kennedy in 1953.
          - generic [ref=e201]:
            - generic [ref=e202]: 5:30 p.m. Walk the wharf
            - generic [ref=e203]:
              - text: Back on land,
              - link "Bowen’s Wharf" [ref=e204] [cursor=pointer]:
                - /url: https://bowenswharf.com/
              - text: and
              - link "Bannister’s Wharf" [ref=e205] [cursor=pointer]:
                - /url: https://www.bannistersnewport.com/
              - text: mark the unofficial starting line for exploring Newport. Along the historic brick and granite quay, you’ll find moored schooners, seafood restaurants and 18th-century buildings. Grab a stool at the oyster bar at
              - link "Clarke Cooke House" [ref=e206] [cursor=pointer]:
                - /url: https://www.clarkecooke.com/
              - text: ", built by a sea captain in 1780, and pair a glass of Sancerre with freshly shucked oysters ($3.50 each) from Nova Scotia, Maine and Rhode Island. Make time to locate the first"
              - link "Rhode Island Slave History Medallion" [ref=e207] [cursor=pointer]:
                - /url: https://rishm.org/newport-county/newport/
              - text: on the Chandlery building behind the Bowen’s Wharf anchor, installed in 2020. Scan the QR code to read about the port’s history as a major hub in the trans-Atlantic slave trade.
          - generic:
            - figure "scoop-picture":
              - generic:
                - generic:
                  - generic:
                    - img "A topdown view of a table outdoors on a sunny day. There is a plate of brioche buns topped with sesame seeds and another dish with a creamy sauce and chopped ham and herbs."
          - generic [ref=e208]:
            - generic [ref=e209]: 6:30 p.m. Enjoy a local feast
            - generic [ref=e210]:
              - text: In a sea of tourist-driven, fast-casual restaurants,
              - link "Thames Street Kitchen" [ref=e211] [cursor=pointer]:
                - /url: https://www.tsknpt.com/
              - text: is an ever-classy, farm-to-table buoy. The chefs Tyler Burnley and Chad Hoffer take full advantage of the small-scale agriculture on Aquidneck Island (home to the towns of Portsmouth, Middletown and Newport), where farmers are known to deliver produce off the back of a moped. Reserve a seat in advance at the bar to watch supper come to fruition in the open kitchen. Order warm salted bread with cacio e pepe butter ($4) to soak up the yolky sauce of the raviolo with serrano ham and ricotta ($10). Early reservations also mean top pick of shareable cuts of rib eye and strip steak ($3 an ounce).
          - generic [ref=e212]:
            - generic [ref=e213]: 8 p.m. Raise a glass to the past
            - generic [ref=e214]:
              - text: New bars seem to open with each regatta season, such as the speakeasy-styled
              - link "Bar 12" [ref=e215] [cursor=pointer]:
                - /url: https://www.bar12newport.com/
              - text: and tiki charmer
              - link "Wharf Fish House" [ref=e216] [cursor=pointer]:
                - /url: https://wharffishhousenewport.com/?fbclid=PAAabvq8ilCEEbnY-0JOiwcNAF_kK-2RbKRBos7-hH0nNUB77KmDTOqtlAbbk
              - text: . But who can compete with the O.G.? The
              - link "White Horse Tavern" [ref=e217] [cursor=pointer]:
                - /url: https://whitehorsenewport.com/
              - text: ", a National Historic Landmark that is believed to be the oldest tavern still operating in the United States, is toasting its 350th anniversary this year. It was a meeting place of the colony’s General Assembly and Criminal Court for nearly 100 years (and was also run for a time by a rich pirate). Under the big wood beams, patrons sip vanilla-infused, smoked old-fashioneds ($17), sharing stories about far-flung travels. Some are hoping history will be honored nearby, too: Across from the tavern, in Liberty Square, a"
              - link "Newport Middle Passage" [ref=e218] [cursor=pointer]:
                - /url: https://newportmiddlepassage.org/monument/
              - text: monument has been proposed to honor the Africans who perished on slave ships and the enslaved workers who helped build the city.
