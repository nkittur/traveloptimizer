          - generic [ref=e304]:
            - generic [ref=e305]: 9 a.m. Rêve up for the day
            - generic [ref=e306]:
              - link "Beaucoup" [ref=e307] [cursor=pointer]:
                - /url: https://www.instagram.com/beaucoupcafe/
              - text: ", a new cafe and boutique on Thames Street with a bright-yellow striped awning and robin-egg-blue Fiat parked out front emits an irresistible joie de vivre, despite the neighboring gas station. Locals can guess that the person responsible for turning a dingy old liquor shop into a heavenly milieu is Cheryl Guibone, the owner of the nearby home goods store,"
              - link "Guibone Living" [ref=e308] [cursor=pointer]:
                - /url: https://www.instagram.com/guibone_living/?hl=en
              - text: ". While you eat a warm spinach and feta feuilleté pastry and a cinnamon sugar scone (each $5.50), your eyes may travel across the tables topped with surf magazines and a Porsche photography book, over the gingham settee, and up to the giraffe sconces, colorful striped beach bags and handmade palm hats: a snapshot of Ms. Guibone’s adventures to places like Marrakech, Cartagena, Marbella and, of course, Paris."
          - generic [ref=e309]:
            - generic [ref=e310]: 10 a.m. Travel back through time
            - generic [ref=e311]:
              - text: At the
              - link "Museum of Newport History" [ref=e312] [cursor=pointer]:
                - /url: https://newporthistory.org/museum-shop/
              - text: (suggested donation, $5), above the
              - link "Newport Historical Society's" [ref=e313] [cursor=pointer]:
                - /url: https://newporthistory.org/
              - text: shop, dive into the city’s long, fascinating and complicated history. Learn how English settlers fled rigid Puritanism in Massachusetts and obtained settlement rights from the Narragansett tribe in 1638. You’ll learn religious freedoms were celebrated in the 18th century among the Quakers, Jews and Congregationalists, while nearly half of the families owned at least one enslaved person. Take in revolutionary war artifacts and Gilded Age gossip, and climb into a covered wagon that plays mini history lectures.
              - link "God’s Little Acre" [ref=e314] [cursor=pointer]:
                - /url: https://www.colonialcemetery.com/
              - text: ", the country’s largest intact colonial-era African burial ground, is a 10-minute walk from the museum. Download the"
              - link "Action Tour Guide app" [ref=e315] [cursor=pointer]:
                - /url: https://actiontourguide.com/place/newport-common-burying-ground-self-guided-walking-tour/
              - text: for a self-guided audio tour of notable headstones, such as Duchess Quamino, the “Pastry Queen of Rhode Island.”
          - generic:
            - figure "scoop-picture":
              - generic:
                - generic:
                  - generic:
                    - img "The exterior of a restaurant with signage that reads"
          - generic [ref=e316]:
            - generic [ref=e317]: 12 p.m. Spice things up
            - generic [ref=e318]:
              - text: On the way back downtown, get lost on Broadway, a refreshingly un-touristy slice of Newport with rainbow crosswalks, hipster coffee shops, craft cocktail bars, a record store and neighborhood haunts like
              - link "Humming Bird" [ref=e319] [cursor=pointer]:
                - /url: https://www.hummingbirdnewport.com/
              - text: . The delightful chef wife-husband team, Dezna Bowen and Abraham Parkes, have decorated the place with baskets, Jamaican hues and a Usain Bolt mural. Since 2018, the only Black-owned restaurant in the city has been feeding devoted denizens slow-braised oxtail and piquant jerk chicken dishes with perfectly crisp fries. While you sit in the window, savoring caramelized bites of fried plantains, a steady stream of clientele will come in to take golden beef patties for the road. Stay long enough, you may do the same.
