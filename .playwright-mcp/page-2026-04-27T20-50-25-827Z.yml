            - generic [ref=e229]: 10 a.m. Learn the ropes
            - generic [ref=e230]:
              - text: The
              - link "Sailing Museum" [ref=e231] [cursor=pointer]:
                - /url: https://thesailingmuseum.org/
              - text: ", which opened last year in the historic Armory building, is a high-tech interactive voyage across an ever-evolving sport. You’ll design your own sailboat, learn its anatomy, and race alongside fellow museumgoers. Exhibits cover ocean conservation and barrier-breaking seafarers, like Bill Pinkney, the first African American to sail solo around the world, and Maureen McKinnon, the first woman to win gold in the Paralympic Sailing Olympics in 2008. Check out the America’s Cup Hall of Fame, which displays models of the winning boats, and use the touch screen to discover nationwide sailing organizations, be it a school, yacht club, or community sailing program."
          - generic [ref=e232]:
            - generic [ref=e233]: 11 a.m. Explore on two wheels
            - generic [ref=e234]:
              - text: The first national bike organization, the
              - link "League of American Wheelmen" [ref=e235] [cursor=pointer]:
                - /url: https://bikeleague.org/
              - text: ", was born in Newport in 1880. The mostly flat Newport remains a"
              - link "bike-friendly" [ref=e236] [cursor=pointer]:
                - /url: https://bikenewportri.org/maps-and-rides/
              - text: town today, ideal for breezy cruising. Pick up a rental at
              - link "Ten Speed Spokes" [ref=e237] [cursor=pointer]:
                - /url: https://www.tenspeedspokes.com/
              - text: ", then pedal away from downtown and out along peaceful roads, past mansions and the Ida Lewis Yacht Club on Lime Rock, where the lighthouse keeper Ida Lewis rowed out to rescue more than 18 people between 1842 and 1911, including soldiers from a nearby military compound, now"
              - link "Fort Adams State Park" [ref=e238] [cursor=pointer]:
                - /url: https://fortadams.org/
              - text: . Fort Adams, which offers expansive bay views and guided walking tours ($20), marks its 200th anniversary in 2024 and is home to the public sailing center
              - link "Sail Newport" [ref=e239] [cursor=pointer]:
                - /url: https://sailnewport.org/
              - text: and annual summer concerts like the
              - link "Newport Folk Festival" [ref=e240] [cursor=pointer]:
                - /url: https://newportfolk.org/
              - text: and
