                - generic [ref=e624]:
                  - paragraph [ref=e626]: This tiny, order-at-the-counter shop makes our favorite kabobs in the neighborhood. They’re juicy and tender, while still maintaining a light crunch, courtesy of the grated onion inside. And at $15 for a full plate with rice and tomatoes, it's a solid quick lunch option that also isn't going to put a hole through your debit card. While the meats are a priority here (their citrusy cornish hen kabob is another standout), we recommend getting involved with the dips, too. The mast-o-mousir, which is strained yogurt mixed with chopped shallots, is tangy, sour, and thick. We usually order one for the meal itself and then another for the road to spread on everything else we eat throughout the week.
