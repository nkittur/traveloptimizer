                - generic [ref=e839]:
                  - paragraph [ref=e841]: Persian-style pizza is one of the most popular street foods in Tehran, and in Westwood, our favorite version can be found at Café Glacé. The crust is thin and crunchy, there’s no tomato sauce, and there’s a lot of cheese on top. The spinach and goat cheese pizza is a standout, but our favorite pie on the menu is the “Mix.” Topped with beef mortadella, hot dogs, green peppers, tomatoes, mushrooms and mozzarella, this is a salty, savory masterpiece and should be on any LA pizza aficionado's shortlist. Also, it’s open until midnight on the weekends, making it a great stop for students who are tired of their usual late-night routine.
