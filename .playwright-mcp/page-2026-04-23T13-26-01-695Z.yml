                      - text: ", House of Mandi is a Yemeni restaurant that's the best spot in Westwood for a big group dinner. And when we say big, we mean UCLA dining hall big. The cavernous space on Gayley has long tables, banquettes, and a row of majlis—traditional sitting areas with low, U-shaped sofas. Groups of students and extended families gather around the namesake mandi spreads (available until 1am nightly), featuring roasted lamb, chicken, or fish over a mountain of yellow rice and soft Yemeni flatbread. if you’re not showing up with your entire dorm floor, they also have individual lunch specials and a la carte menu."
