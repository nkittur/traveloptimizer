                - generic [ref=e1476]:
                  - paragraph [ref=e1478]: From the outside, Hamasaku looks like one of those uniquely-LA strip mall sushi spots, but inside, it feels like you might actually be in Japan, not next to a Coffee Bean. Their $85 omakase plays the same trick - you get a pretty high-quality product for a reasonably fair price. On top of all the sushi (including less-common options like cuttlefish and sardine), the omakase includes miso soup, egg custard, and dessert as part of the deal. The fish is fresh, the crowd is low-key, and you’ll definitely leave full.
