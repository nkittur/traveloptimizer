              - generic [ref=e127]:
                - paragraph [ref=e128]: Westwood is home to a world-class university, over-priced celebrity condos, and soul-crushing traffic. And while most people associate Westwood with the UCLA-adjacent Village, it actually stretches from Bel-Air all the way to Century City. Though the neighborhood will never exactly be known for its food, there are still plenty of great places to check out.
                - paragraph [ref=e129]: From divey, late-night spots in the Village to the best Persian food in LA south of Wilshire, Westwood has quite a bit more than you think. So whether you work in the neighborhood and are looking for a quick lunch spot, or are a stoned freshman who doesn’t know where you are, here are all the places you need to be eating in Westwood.
