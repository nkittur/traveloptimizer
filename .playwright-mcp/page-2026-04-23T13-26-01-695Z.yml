                - generic [ref=e694]:
                  - paragraph [ref=e696]: Toranj is a Persian spot located in the heart of Westwood Village making it an ideal lunch option if you can’t veer too far from campus. They do a brisk takeout service, but if you’re interested in dining in, there’s also a large sidewalk patio. As far as the food goes, the priority here absolutely needs to be the Juicy Chicken. It’s slightly sweet, somewhat buttery, and so unbelievably tender you’ll forget you’re actually eating chicken. If you want some heat on it, order the spicy version, which has been marinated overnight in their special housemade spicy sauce. We also like their ghormeh sabzi, which is a bit more sour than other versions in the neighborhood, and goes nicely with the tahdig you should order as an appetizer.
