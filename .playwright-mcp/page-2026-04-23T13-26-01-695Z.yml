                  - paragraph [ref=e302]: If you’re headed to this classic daytime-only shop on Westwood Blvd., chances are the beef tongue sandwich is on your agenda. And rightfully so, this iconic sandwich is a meaty, tangy masterpiece and one of the most well-known dishes in the neighborhood. That said, it shouldn’t be the only thing you order. We love their kuku sabzi, an aromatic, herb-based frittata, that you can get either as a sandwich or as an entree. Get both and fight about which one is better with your friends. And then grab a seat in the courtyard patio for some of the best people-watching in the neighborhood.
