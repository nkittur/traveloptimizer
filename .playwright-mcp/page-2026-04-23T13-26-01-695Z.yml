                - generic [ref=e909]:
                  - paragraph [ref=e911]: "At Lima Nikkei you’ll find high-quality sushi rolls with Peruvian influence—though you’ll literally have to find them first. This handroll bar is located in the easy-to-miss upstairs food court of 99 Ranch Market in Westwood, which is consistently a ghost town. That’s a shame because the open-faced temaki here are unique as they are tasty: grilled shrimp with aji amarillo, buttery tuna, and crispy quinoa seasoned with a ponzu kiss, and king crab in leche de tigre. The sushi isn’t cheap, so come during the weekday Happy Hour from 2-6pm when the filling three-piece handroll set is discounted to $25. And make sure to flash your receipt and get 90 minutes of validated parking in the market’s underground garage."
