                - link "Lpetrilla Thehyeholde Pghmagbestrest25 0219" [ref=e183] [cursor=pointer]:
                  - /url: https://www.pittsburghmagazine.com/content/uploads/2025/05/f/t/lpetrilla-thehyeholde-pghmagbestrest25-0219.jpeg
