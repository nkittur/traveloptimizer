            - heading "Here Are the 26 Best Restaurants in Pittsburgh" [level=1] [ref=e173]
            - heading "Updated for 2025, we share the best places for dining around the Steel City." [level=5] [ref=e174]
            - generic [ref=e175]:
              - time [ref=e177]: May 30, 2025
              - generic [ref=e178]:
                - generic [ref=e179]: by
                - link "Emily Catalano" [ref=e180] [cursor=pointer]:
