              - paragraph [ref=e186]:
                - generic [ref=e187]: I
                - text: t’s an inspiring time to be covering Pittsburgh’s restaurant industry. There’s an undercurrent of electricity to dining in the city right now, driven by chefs who are growing into themselves and spaces that feel more self-assured than ever. We’ve never been a city that’s been focused too much on buzzy gimmicks and fleeting trends.
              - paragraph [ref=e188]: What’s happening here is deeper than that. Our chefs are digging into their identities and building menus that reflect who they are — and who they want to be. And it’s making me excited to see what’s next.
              - paragraph [ref=e189]: The 26 restaurants in this list exemplify the best of what’s out there, with dishes that stopped me in my tracks and experiences that lingered long after the last bite.
              - heading "The Best Restaurants in Pittsburgh" [level=2] [ref=e190]:
                - strong [ref=e191]: The Best Restaurants in Pittsburgh
              - list [ref=e192]:
