                  - strong [ref=e179]:
                    - link "buses" [ref=e180] [cursor=pointer]:
                      - /url: https://www.sdmts.com/
                  - text: ", along with private"
                  - strong [ref=e181]:
                    - link "ferries" [ref=e182] [cursor=pointer]:
                      - /url: https://coronadoferrylanding.com/ferry-info/
                  - text: ","
                  - strong [ref=e183]: pedicabs
                  - text: and
                  - strong [ref=e184]: ride-hailing
                  - text: services reaches beyond downtown.
          - heading "Itinerary" [level=2] [ref=e185]
          - generic [ref=e186]:
            - heading "Friday" [level=2] [ref=e187]
            - generic [ref=e188]:
              - generic [ref=e189]: 4:30 p.m. Snack and sip during happy hour
              - paragraph [ref=e191]:
                - text: Start at one of the city’s best happy hours (3 p.m. to 5 p.m., weekdays) at
                - link "Ironside Fish & Oyster Bar" [ref=e192] [cursor=pointer]:
                  - /url: https://ironsidefishandoyster.com/
                - text: . This
                - link "Little Italy" [ref=e193] [cursor=pointer]:
                  - /url: https://www.littleitalysd.com/
                - text: mainstay, with a giant papier-mâché octopus above the dining room, hasn’t raised prices for its beautiful, fresh oysters ($1 each) since it opened in 2014. There are other snacks, including a fried shrimp taco with spicy aioli ($6), and a seasonal selection of $8 cocktails. Don’t leave Little Italy without a scoop (starting at $5.85 for a two-flavor cup) at
                - link "Bobboi Natural Gelato" [ref=e194] [cursor=pointer]:
                  - /url: https://www.bobboi.com/
                - text: ", whose Sardinian chef, Monica Maccioni, studied at Bologna’s Università del Gelato. Exotic flavors are ever-changing, but one of the more traditional options, the pistacchio della California — made with organic nuts from Santa Barbara — is both rich and refreshingly herbaceous."
            - generic [ref=e196]:
              - img "A plate of a dozen raw, shucked oysters on ice, with two sauces and lemon wedges." [ref=e198]
              - paragraph [ref=e201]: Ironside Fish & Oyster Bar
            - generic [ref=e202]:
              - generic [ref=e203]: 5:30 p.m. Bring your blanket for a waterfront show
              - paragraph [ref=e205]:
                - text: Walk the waterfront en route to the
                - link "Rady Shell," [ref=e206] [cursor=pointer]:
                  - /url: https://www.theshell.org/
                - text: a gleaming white, hornlike concert venue that opened in 2021. Along the two-mile stroll, admire the
                - link "Maritime Museum" [ref=e207] [cursor=pointer]:
                  - /url: https://sdmaritime.org/
                - text: ’s
                - link "Star of India" [ref=e208] [cursor=pointer]:
                  - /url: https://sdmaritime.org/visit/the-ships/star-of-india/
                - text: — the world’s oldest active sailing ship, built in 1863, and the massive
                - link "USS Midway Museum" [ref=e209] [cursor=pointer]:
                  - /url: http://midway.org
                - text: ", housed in the longest-serving U.S. aircraft carrier of the 20th century. Alternatively, hop on a pedicab for a wind-in-your-hair ride ($10 to $50, by distance). The Rady Shell, an $85 million acoustic dream in a peninsular park on San Diego Bay, hosts the"
                - link "San Diego Symphony" [ref=e210] [cursor=pointer]:
                  - /url: https://www.sandiegosymphony.org/
                - text: as well as mainstream pop acts. Opt for either a table up front or, for a more affordable option, a bring-your-own-blanket or lawn chair spot on the lawn (tickets start at $30).
            - generic [ref=e211]:
              - generic [ref=e212]: 9 p.m. Splurge, then sneak away to 1920s Japan
              - paragraph [ref=e214]:
                - text: Make reservations for a late, postshow dinner at
                - link "Callie" [ref=e215] [cursor=pointer]:
                  - /url: https://www.calliesd.com/
                - text: ", a splurge-worthy restaurant in the East Village, a 20-minute walk away, that celebrates Southern California ingredients with a Mediterranean-meets-Middle Eastern menu. Opened in 2021, Callie is a homecoming for the chef Travis Swikard, who spent a decade in the kitchens of"
                - link "Daniel Boulud’s" [ref=e216] [cursor=pointer]:
                  - /url: https://www.danielboulud.com/photos/restaurants
                - text: famed New York City restaurants. Try the kanpachi (greater amberjack) served on a vibrant green splash of
                - link "zhoug" [ref=e217] [cursor=pointer]:
                  - /url: https://www.seriouseats.com/schug-zhug-srug-yemenite-israeli-hot-sauce-recipe
                - text: "-like hot sauce and dusted with black lime and avocado ($29) or the local uni (sea urchin) on toast with Spanish Iberico ham ($29). After dinner, head around the corner to"
                - link "Bar Kamon" [ref=e218] [cursor=pointer]:
                  - /url: https://barkamon.com/
                - text: . Hidden behind an unmarked door inside a Japanese bakery, this cocktail bar evokes 1920s Japan with dim lighting, rice-papered walls and whiskey-centric drinks.
            - generic [ref=e220]:
              - img "People sit at wooden stools at a long, gray, polished bar. Small lamps along the bar emit a warm glow. A bartender wearing a red apron pours a drink." [ref=e222]
              - paragraph [ref=e225]: Callie
