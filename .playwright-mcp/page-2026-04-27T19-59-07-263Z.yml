                  - text: By Freda Moon
                  - text: Photographs by John Francis Peters
              - paragraph [ref=e62]: Freda Moon, a frequent New York Times Travel contributor living in California, is a San Diego devotee and visits as often as she can.
              - time [ref=e63]: July 18, 2024
            - paragraph [ref=e64]:
              - text: Dripping with flowers, adorned in murals and fronted by gorgeous beaches, San Diego is almost too pretty to be taken seriously. It excels at being underrated and overlooked. But that’s changing fast, as new hotels, restaurants and arts institutions, including the
              - link "$85 million Rady Shell" [ref=e65] [cursor=pointer]:
                - /url: https://www.nytimes.com/2021/08/10/arts/music/san-diego-rady-shell.html
              - text: ", the San Diego Symphony’s summer stage, add depth to a city already flush with eclectic, arty neighborhoods. Despite the changes, tradition holds strong in the “birthplace of California” (San Diego was the first permanent European settlement on the West Coast). The beloved"
              - link "Balboa Theater" [ref=e66] [cursor=pointer]:
                - /url: https://sandiegotheatres.org/
              - text: ", a former vaudeville venue, turns"
              - link "100 this year" [ref=e67] [cursor=pointer]:
                - /url: https://sandiegotheatres.org/balboatheatre100
              - text: ", and Balboa Park’s"
              - link "Spreckels Organ" [ref=e68] [cursor=pointer]:
                - /url: https://balboapark.org/arts-culture/spreckels-organ-pavilion-balboa-park/
              - text: — over a century old and the world’s largest outdoor pipe organ — continues to draw crowds for free public concerts (every Sunday at 2 p.m.).
