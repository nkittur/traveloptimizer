              - paragraph [ref=e331]: Secret Sister
            - generic [ref=e332]:
              - generic [ref=e333]: 11 a.m. Eat quintessential California
              - paragraph [ref=e335]:
                - text: For lunch, drive to the coast for a revitalizing, booze-free brunch at
                - link "Atelier Manna" [ref=e336] [cursor=pointer]:
                  - /url: https://www.atelier-manna.com/visit-us
                - text: in Leucadia. The modest-size outdoor dining room serves an eclectic mix of dishes with big, fresh flavors, including a gorgeous halibut ceviche topped with a tangle of herbs and chile ($23), and a thick slice of miche bread topped with boquerones (fresh anchovies) and a ramp dressing ($18). In place of mimosas and Bloody Marys, the restaurant serves sophisticated mocktails it calls “vitality tonics” (from $8). Then, walk up the hill to
                - link "Leucadia State Beach" [ref=e337] [cursor=pointer]:
                  - /url: https://www.parks.ca.gov/?page_id=661
                - text: ", where you can climb down the cliff-clinging staircase to stroll a shoreline of colorful pebbles while pelicans soar overhead."
            - generic [ref=e338]:
              - generic [ref=e339]: 12:30 p.m. Go green
              - paragraph [ref=e341]:
                - text: One of the world’s great urban greenspaces, 1,200-acre
                - link "Balboa Park" [ref=e342] [cursor=pointer]:
                  - /url: https://balboapark.org/
                - text: is bigger than Central Park in New York and Millennium Park in Chicago combined. Best known for the exceptional
                - link "San Diego Zoo" [ref=e343] [cursor=pointer]:
                  - /url: https://zoo.sandiegozoo.org/
                - text: ", the park has 18 museums and dozens of other attractions. The"
                - link "Mingei International Museum" [ref=e344] [cursor=pointer]:
                  - /url: https://mingei.org/
                - text: (entry $15, under 18 free) reopened in 2021 after a three-year, $55 million renovation. The museum celebrates global folk art and crafts, with exhibits highlighting practices like tea services, beadwork and quilting. The museum also has a piece by
                - link "Niki de Saint Phalle" [ref=e345] [cursor=pointer]:
                  - /url: https://nikidesaintphalle.org/
                - text: ", the French artist who spent her final years in Southern California and created the kaleidoscopic, open-air mosaic installation “"
                - link "Queen Califia’s Magical Circle" [ref=e346] [cursor=pointer]:
                  - /url: https://visitescondido.com/queen-califias-magical-circle-escondido/
                - text: ” in Escondido, a city a half-hour north of San Diego (it’s worth a private tour on your drive out of town;
                - link "schedule in advance" [ref=e347] [cursor=pointer]:
                  - /url: https://www.escondido.org/Facilities/Facility/Details/Niki-de-Saint-Phalles-Queen-Califias-Mag-19
                - text: ).
