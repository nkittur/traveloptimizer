                - listitem [ref=e175]:
                  - text: Thanks to its relatively small urban core — much of it walkable — San Diego is the rare city in the Western United States that is possible to enjoy without a car. A utilitarian network of
                  - strong [ref=e176]:
                    - link "public trolleys" [ref=e177] [cursor=pointer]:
