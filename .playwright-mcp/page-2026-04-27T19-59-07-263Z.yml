            - heading "Saturday" [level=2] [ref=e234]
            - generic [ref=e235]:
              - generic [ref=e236]: 8 a.m. Rise, shine and dine on chilaquiles
              - paragraph [ref=e238]:
                - text: Get to
                - link "Cocina 35 Brunch" [ref=e239] [cursor=pointer]:
                  - /url: https://cocina35.com/menu-liberty-station/
                - text: early to beat the crush of boisterous multigenerational families celebrating milestone birthdays at the first full-service restaurant from this long-running local Mexican cafeteria chain. Cocina 35 has a following for its five varieties of chilaquiles (starting at $21), crispy fried tortillas in a red or green chile sauce with assorted toppings. Or skip brunch and head to Ocean Beach, for a
                - link "California burrito" [ref=e240] [cursor=pointer]:
                  - /url: https://slate.com/human-interest/2024/03/california-burrito-san-diego-chipotle-mexican.html
                - text: ", one of San Diego’s quintessential dishes (carne asada, French fries, guacamole and more, $15), to go from"
                - link "Mike’s Taco Club" [ref=e241] [cursor=pointer]:
                  - /url: https://www.mikestacoclub.com/
                - text: ", a counter-service spot with bottle caps tiling the walls. Eat at the beach while watching the surfers and seagulls before walking south of the neighborhood’s famous pier to explore"
                - link "tide pools" [ref=e242] [cursor=pointer]:
                  - /url: https://oceanbeachsandiego.com/attractions/ocean-beach-pier
                - text: full of sea anemones, crabs and more (best at low tide).
            - generic [ref=e244]:
              - img "A restaurant worker wearing a beige apron walks between tables of diners inside a colorful restaurant with a skylight. A tree with pink blossoms appears to be growing inside the restaurant." [ref=e246]
              - paragraph [ref=e249]: Cocina 35 Brunch
            - generic [ref=e250]:
              - generic [ref=e251]: 9:30 a.m. Cruise around an island
              - paragraph [ref=e253]:
                - text: Take the
                - link "Flagship Ferry" [ref=e254] [cursor=pointer]:
                  - /url: https://www.flagshipsd.com/cruises/flagship-ferry
                - text: to Coronado, a beachy island city in San Diego Bay, for a quick cruise along the waterfront ($8). Rent some wheels at
                - link "Holland’s Bikes & Beyond" [ref=e255] [cursor=pointer]:
                  - /url: https://www.hollandsbicycles.com/about/bike-rentals-pg1295.htm
                - text: to ride the island’s six miles of bike paths through charming neighborhoods of bungalows and Craftsman homes to the powdery white sand of
                - link "Coronado Beach" [ref=e256] [cursor=pointer]:
                  - /url: https://www.coronado.ca.us/244/Coronado-Beach
                - text: . From there, travel along the boardwalk for a glimpse of the 1888 Victorian
                - link "Hotel del Coronado" [ref=e257] [cursor=pointer]:
                  - /url: https://hoteldel.com/
                - text: ", or “the Del,” which is undergoing a"
                - link "multiyear, $160 million" [ref=e258] [cursor=pointer]:
                  - /url: https://hoteldel.com/press/hotel-del-coronado-announces-more-than-160-million-restoration-and-revitalization-of-historic-victorian-building/
                - text: renovation set to be completed next spring. A nonguest can buy
                - link "a day pass" [ref=e259] [cursor=pointer]:
                  - /url: https://www.resortpass.com/hotels/Hotel-del-Coronado
                - text: to visit the hotel’s beachside, Olympic-size Cabana Pool, which is heated year-round (starting at $75 per adult, $35 per child).
            - generic [ref=e260]:
              - generic [ref=e261]: 2 p.m. Hit the barrio
              - paragraph [ref=e263]:
                - text: In Barrio Logan, a historic Mexican American neighborhood, Chicano culture is celebrated at every turn, in bilingual bookstores, galleries, street-art supply stores, record shops and new-school taquerias. First, stand in line at
                - link "Las Cuatro Milpas" [ref=e264] [cursor=pointer]:
                  - /url: http://www.las-cuatro-milpas.com/
                - text: ", an institution since 1933, which serves homestyle food from another era. While the counter-service restaurant is known for its rolled tacos, it’s the chorizo con huevos ($5)"
                - emphasis [ref=e265]: ","
                - text: a soupy mix of spiced sausage, egg and beans beneath a sheen of chile oil, and the burrito-size tortillas, rich in lard and a delicate crust of flour, that you’re unlikely to have elsewhere. Then, cross Cesar Chavez Parkway to
                - link "Chicano Park" [ref=e266] [cursor=pointer]:
                  - /url: https://chicanoparkmuseum.org/
                - text: . Established in 1970, after a 12-day occupation of the site at the height of California’s Chicano civil rights movement, this
                - link "national historic landmark" [ref=e267] [cursor=pointer]:
                  - /url: https://savingplaces.org/stories/explore-the-murals-of-san-diegos-chicano-park
                - text: features more than
                - link "100 outdoor murals" [ref=e268] [cursor=pointer]:
                  - /url: https://www.nytimes.com/2022/04/19/us/chicano-park-anniversary.html
                - text: — the country’s largest collection — depicting cultural figures central to the neighborhood’s story.
            - generic [ref=e270]:
              - img "A pillar that appears to be supporting a bridge is covered in a colorful mural depicting the heads of three bearded people wearing berets with stars on them." [ref=e272]
              - paragraph [ref=e275]: Chicano Park
            - generic [ref=e276]:
              - generic [ref=e277]: 3:30 p.m. Hang out in the Heights
              - paragraph [ref=e279]:
                - text: Walk uphill on Cesar Chavez to Logan Heights’
                - link "Bread & Salt" [ref=e280] [cursor=pointer]:
                  - /url: https://www.breadandsaltsandiego.com/
                - text: (closes at 4 p.m.), a former bread factory converted into a 45,000-square-foot community art center, with galleries, studios, a cafe and sculpture garden. Unlike a meticulously curated museum, this lived-in, experimental space is somewhere to wander and be surprised. Afterward, go next door to
                - link "Mujeres Brew House" [ref=e281] [cursor=pointer]:
                  - /url: https://www.facebook.com/mujeresbrewhouse
                - text: ", a rare woman-owned brewery in a city lousy with great beer. Serving micheladas (a beer cocktail, typically with some combination of Clamato or tomato juice, Worcestershire, hot sauce and lime) and a lineup of refreshing cervezas that taste made for the brewery’s brightly hued, picnic-table-and-plant-filled patio, which often features a taco cart and live music."
            - generic [ref=e282]:
              - generic [ref=e283]: 5 p.m. Fill your suitcase
              - paragraph [ref=e285]:
                - text: For Southern California-style souvenirs, head to South Park’s extraordinarily exuberant
                - link "Bad Madge & Co." [ref=e286] [cursor=pointer]:
                  - /url: https://www.badmadge.com/
                - text: ", a vintage shop that leans heavily into a 1960s- and ’70s-era riot of color in its clothing offerings and a midcentury housewares aesthetic that includes an impressive collection of ceramic tiki glasses. Opened in 2015, North Park’s"
                - link "Verbatim Books" [ref=e287] [cursor=pointer]:
                  - /url: https://verbatimbooks.com/
                - text: is a warehouse-size used-book store that’s grown into a local institution. It’s a mural-adorned cathedral to literature, with soaring ceilings and quirky corners that feel like altars (one to Stephen King, another to vintage Hardy Boys and Nancy Drew). On the next block,
                - link "Pigment" [ref=e288] [cursor=pointer]:
                  - /url: https://www.shoppigment.com/
                - text: is a color-themed gift and décor shop with a D.I.Y. succulent arrangement station that evokes year-round sunshine.
            - generic [ref=e290]:
              - img "The inside of a store with a sign on the wall that reads \"Vintage.\" A mannequin reclines with its legs crossed on a chair. The space is filled with furniture, potted plants and lamps." [ref=e292]
              - paragraph [ref=e295]: Bad Madge & Co.
            - generic [ref=e296]:
              - generic [ref=e297]: 8 p.m. Spend time in Spain
              - paragraph [ref=e299]:
                - link "Mabel’s Gone Fishing" [ref=e300] [cursor=pointer]:
                  - /url: https://www.mabelsgonefishing.com/
                - text: has the unfussiness of a neighborhood restaurant, but with a citywide following that demands reservations. With its long, perpetually packed bar, where gin and tonics ($16) and tapas (from $9) are king, this sultry Spanish-style restaurant is date night incarnate. Sit at the chef’s counter if you want to sweat while watching onions char and fish sizzle in glistening oil in the restaurant’s frenetic open kitchen. The menu changes based on the availability of local seafood and seasonal produce, but the Basque cheesecake ($16) is a reliable end-of-meal hit.
            - generic [ref=e301]:
              - generic [ref=e302]: 10 p.m. Bowl at the bar
              - paragraph [ref=e304]:
                - text: Across the 30th Street,
                - link "Part Time Lover" [ref=e305] [cursor=pointer]:
                  - /url: https://www.parttimeloverhifi.com/
                - text: is a surprise. Behind a facade that only nods at what’s inside, this beautiful, low-lit listening room and bar has a rich wood interior with Art Deco and Craftsman detailing. The in-house record store, at the back of the bar, supplies the eclectic mix of music for the hi-fi system. Then, end the evening with a game at the retro fabulous
                - link "Lafayette Hotel" [ref=e306] [cursor=pointer]:
                  - /url: https://lafayettehotelsd.com/#Dining
                - text: ", where"
                - link "the Gutter" [ref=e307] [cursor=pointer]:
                  - /url: https://www.opentable.com/r/the-gutter-san-diego?corrid=e14e25ef-f0f3-43b3-9731-32e20a6d7bb8&avt=eyJ2IjoyLCJtIjowLCJwIjowLCJzIjowLCJuIjowfQ&p=1&sd=2024-01-11T19%3A00%3A00
                - text: offers a two-lane bowling alley ($50 per group, up to six people), along with shuffleboard, pool table and cocktails.
