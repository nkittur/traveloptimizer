              - generic [ref=e319]: 8 a.m. Grab breakfast to go, then hike through oak and chaparral
              - paragraph [ref=e321]:
                - text: Pick up a breakfast sandwich — a cheddar-and-garlic-chive gougère (a savory French pastry) with a fried egg and arugula ($11) — and coffee to go from South Park’s
                - link "Secret Sister" [ref=e322] [cursor=pointer]:
                  - /url: https://www.secretsistersouthpark.com/
                - text: ", so you can hit the trails early. Add a sourdough doughnut, with seasonally changing flavors (local passion fruit is a favorite, $5), for a midhike pick-me-up. Then, drive to"
                - link "Oakoasis County Preserve" [ref=e323] [cursor=pointer]:
                  - /url: https://www.sdparks.org/content/sdparks/en/park-pages/Oakoasis.html
                - text: ", about a half-hour from downtown’s skyscrapers. The preserve’s partly shaded 2.5-mile loop has just enough elevation change to offer a modest workout, along with an ever-changing landscape of wildflowers, oak trees and a meandering creek. About halfway, there’s a detour to a large boulder where you can sit above the chaparral and look out over"
                - link "San Vicente Reservoir" [ref=e324] [cursor=pointer]:
                  - /url: https://www.sandiego.gov/reservoirs-lakes/san-vicente-reservoir
                - text: .
