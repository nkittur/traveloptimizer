                - text: At its locations in Westwood, Encino and Marina del Rey, Naab Café serves grilled kebabs, gyro and shwarma plates as well as a variety of Mediterranean wraps and sandwiches.
                - text: With a hookah bar in the back room in Westwood, this cafe has long been a go-to Persian spot in the city. There are two different vibes you find yourself immersed in depending on what time of day you visit. In the mornings, the lounge is lighted up as sunlight trickles through the rafters of the semi-outdoor setting, and vegetables and kebabs are vivid screaming colors. Things start to shift as the sun goes down, the music starts playing and the coconut hookah starts flowing.
                - text: The restaurant also offers custom catering for up to 300 people serving Mediterranean and Persian entrées, small plates and desserts.
