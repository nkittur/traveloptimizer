          - paragraph [ref=e85]: Like other Muslims around the world, I make sure what I consume is halal. The Arabic word means permissible. In regards to food, this refers to the type of meat and the way it is slaughtered. Pork and pork byproducts are prohibited as well as meat from animals that died before slaughter. The other thing is to make sure that the slaughter is humane, that their pain is minimized and that no other animals witness it. An adult Muslim of sane mind invokes the name of God, slits the throat in a swift motion, then allows the animal to bleed out completely before its meat is processed for consumption. This method of slaughter is known as zabiha.
          - paragraph [ref=e86]: "Food is the Asian love language, if not a universal one, and I made it my mission to find halal food that touches the heart. These restaurants not only represent the diversity that exists within the halal food community but also reflect how immigrants take it upon themselves to fill a gap wherever a halal option does not exist within a certain cuisine. (One thing that’s still missing: an Italian restaurant with halal options.)"
          - generic [ref=e89]: Advertisement
          - paragraph [ref=e90]: Here I’ve shortlisted 22 must-visit places for halal food, from Sun Valley to Irvine.
