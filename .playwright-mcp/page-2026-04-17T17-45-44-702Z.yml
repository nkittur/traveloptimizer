                - text: When he was 18, Mohamad Nabir Farhat started a halal Mexican food stand in front of his father’s meat market in Bell while studying biology at UCLA. If you make your way to Cedar’s for dinner and get there before they sell out for the day, try the birria quesadilla and relish it in all its cheesy glory.
                - text: Farhat’s family is from Lebanon, but his father grew up in Colombia before moving to the United States. Farhat was born and raised in South L.A. around Arab and Latin communities, where he picked up on Mexican food culture.
                - text: Working with a Latino family at the meat market as a kid, he learned how to marinate, chop and cook meat in traditional Mexican ways and hoped to combine it with Lebanese tradition to bridge the two communities.
                - text: “It amazes me when people drive very far to try halal Mexican food,” Farhat says. “I’ve had a customer all the way from the U.K. that saw me on TikTok and came to try my food.”
                - text: Cedar’s now offers a full-service Mexican menu with your choice of meat, and Farhat has plans to open a dine-in restaurant.
