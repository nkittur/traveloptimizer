              - generic [ref=e1090]:
                - text: Pho Redbo is one of the few, if not the only, Vietnamese place in Garden Grove with
                - link "halal items on the menu" [ref=e1091] [cursor=pointer]:
                  - /url: https://phoredbo.com/menu
                - text: — marked in the online version for customers’ convenience.
                - text: James Bui and his wife, Quiyen Tonnu, bought this pho restaurant and relaunched the spruced-up space with a new menu in early 2022, using halal meat.
                - text: “Basically I was asking myself, ‘How can I get the best meat?’” Bui says. The pho with rare steak and the pho with well-done brisket are both fan favorites, prepared with halal Australian Wagyu. The meat is highly marbled and nutty and tastes wonderful, but the protagonist is definitely the broth.
                - text: Bui says the broth was the most challenging thing to find a halal source for. It needed halal bones. After much investigation, they were able to work with distributors and producers who helped source the bones.
                - text: They’ve since trained the staff to process halal and nonhalal dishes separately.
