            - generic [ref=e1134]:
              - generic [ref=e1135]:
                - text: Enter Ma’s House through a heavy dark wooden door and you’ll find yourself in a reception area with swirling wrought iron, giant windows with a blue-green tint and a domed roof set with extended half-round glass panels and a massive gold chandelier. A stone fountain features fake pink lotuses floating in the water. There is a hint at grandeur here, but the booths and tables inside are plain in comparison.
                - text: Don’t let any of this distract you from the food. The extensive menu can be overwhelming — especially if making food decisions is not your strong suit — but allow yourself to try something you’ve never had before.
                - text: I feel like having dim sum and end up trying the pan-fried beef dumplings, packed with flavor. Plus, it’s a treat to see 11 different soup options. The soup arrives in a family-sized bowl and comes to you hot, hot, hot.
                - text: This Chinese restaurant has been serving certified halal food for “almost half a century,” according to its website. There are now three locations, in Anaheim, Laguna Hills and San Diego.
