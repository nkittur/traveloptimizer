                - text: This Koreatown spot is one of L.A.’s many hot-chicken places that have gone halal in recent years. The restaurant didn’t start out that way, but just one month after opening, it changed suppliers because of popular demand. Now its menu is halal with the exception of the bacon fries.
                - text: Owner Lion Choi moved to California from Korea in 2004 and, while attending school in Riverside, became interested in the food business. Three years ago, Choi went to Nashville, tried the hot chicken that originated there and fell in love.
                - text: He immediately knew he wanted to re-create it in SoCal.
                - text: Stark’s Hot Chicken has four combos on the menu, but Choi says Combo 3 is the most popular; it features a chicken tender, waffle fries and a sando (with jumbo tenders, coleslaw, pickles and sauce ranging from mild to Stark hot). There are options to order wings and sides including a creamy macaroni salad. Additionally, Choi added a touch of Korea to his menu with sweet Korean popcorn chicken.
