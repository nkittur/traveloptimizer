                - text: Picture buttery paratha rolls, samosas and fritters with an array of chutneys, a bright aesthetic and sustainable packaging. True to its slogan — khao magar pyaar se (eat but with love in Urdu/Hindi) — Paratta’s menu is created with heart.
                - text: Often craving South Asian street food and living in Los Angeles, Asim Bharwani and Zara Ahsan — a couple with roots in India, Pakistan and Bangladesh — started Paratta in 2018 as a passion project. “We wanted to show that there’s more to Muslim or halal than what you may have heard about — there’s more to us brown people — to kind of get rid of those stereotypes and make a connection,” Bharwani says.
                - text: Their rolls are wrapped in a house-made 9-inch pastry-like flaky lachha paratha, which is a staple South Asian flatbread. The menu has halal chicken and beef as well as vegetarian options. Although the couple has plans for a dine-in location in the future, Paratta currently operates primarily as a takeout and delivery spot, with a food truck that makes appearances at food festivals like Smorgasburg and other
                - link "special events" [ref=e169] [cursor=pointer]:
                  - /url: https://paratta.com/schedule
                - text: . Decorated with Zara’s detailed illustrations (same as for all their packaging), it stands out so you definitely won’t miss it.
