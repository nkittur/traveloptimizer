                - text: Los Angeles’ first Brazilian steakhouse to serve halal beef, lamb and chicken is a modern full-service churrascaria where servers come to the table to display skewers of premium meat cuts and slice off exactly what you want onto your plate.
                - text: It’s an upscale all-you-can-eat, with a salad bar and an additional a la carte menu. The seasonal cut of Japanese Wagyu on the menu is not halal, and the steakhouse does serve pork. However, the staff has been trained on the concept of halal meat and uses separate utensils and grills as well.
                - text: Owner Henrique Huyer says, “I’m a gaucho, a southern Brazilian cowboy. This is in my DNA.”
                - text: He adds that he was raised on a farm in Brazil and that his dad had a butchery business so he “grew up dealing with meat.”
                - text: Huyer says that the restaurant received numerous calls from potential customers asking if the meat was halal and, after looking into it, he switched in September. He says he is happy to be serving this new customer base.
                - text: While there are several dining settings to choose from, each with its own vibe, step into H&H’s autumn-themed open-kitchen space to see the cooks preparing the meat across the room.
                - text: Multiple locations include 518 W. 7th St., Los Angeles, (213) 266-8103,
