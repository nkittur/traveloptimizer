              - generic [ref=e572]:
                - text: "Alhambra is a welcome home for this Uyghur restaurant. Staffers all wear black T-shirts that say “Google Uyghurs” and #CloseTheCamps in reference to concentration camps in China where much of the Uyghur Muslim population is detained and subject to inhumane policies. Even the art on the walls includes reminders of this."
                - text: Owner Bugra Arkin says Uyghur food is an amalgam of cultures, as historically the Central Asian people absorbed and adapted food from surrounding countries. So you find lamb kebabs, laghman hand-pulled noodle dishes, samsa — perhaps a sister dish to samosa — and five kinds of teas all on the same menu.
                - text: Arkin is an international public policy and management graduate from USC. Having previously been accosted and arrested in China without cause, he knew he could not return there, so he started Dolan’s with the hope of bringing attention to the Uyghur plight and introducing their food and culture to Angelenos. Dolan’s also caters and has regularly provided its services to mosques in the area.
