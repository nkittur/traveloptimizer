                - text: Named Tribos for founder Lubna Ismail’s family, or her own personal tribe, this peri-peri chicken restaurant has something for everyone, including chicken, beef and vegetarian options.
                - text: For the peri-peri chicken, sauce options are lemon and herb, mild, medium, hot or extra hot. Peri-peri chicken is essentially chicken marinated in and served with peri-peri sauce, a hot sauce based on the African bird’s-eye chile pepper.
                - text: Ismail says she tasted peri-peri chicken from Nando’s — an international peri-peri restaurant chain that started in Johannesburg, South Africa, in 1987 — for the first time at a cousin’s wedding in London and was inspired to start her own thing.
                - text: She opened her first restaurant in Saddle Brook, N.J., in 2018. Tribos now has nine franchise locations and more coming soon. Sauces went through much experimentation in a test kitchen, but the testing really started at backyard barbecues with family and friends.
                - text: Having grown up in an Indian Muslim community, Ismail said halal hand-slaughtered meat was a no-brainer, and she is committed to making sure each new branch maintains this standard.
