                - text: Big Al’s is certainly a meat lover’s pizza dream come true. Named after and run by Ali Chahine, this Lebanese-inspired pizzeria in Maywood offers 12 pizza options, as well as baked chicken wings and a barbecue brisket sub. Chahine says, “We didn’t just want to sell cheese and pepperoni like everybody else.”
                - text: The pizzas are baked in a conveyor oven, then garnished, boxed and ready to be handed over. Big Al’s has been serving halal meat on its menu since it opened almost a decade ago.
                - text: Chahine especially wanted to make provisions for the Muslim community, as he says no one was catering to them at the time. The place even serves halal “bacon” — prepared by curing, drying, smoking and thinly slicing beef belly.
                - text: Since 2013, when Chahine started the place, his brother and cousin handled day-to-day operations and his wife helped, especially with the wing sauce recipes. Today, his niece and daughter regularly work at the location in Maywood, and his sister’s handmade confections line the shelves — Cinamom’s Goodies, after the family’s nickname for her. Seriously, the best part about stopping by is that you can grab some of that sweet goodness on the way out.
