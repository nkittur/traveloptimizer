                - text: Mohammad Azeem Farooq and his wife, Sarah Ali Farooq, are owners of Urban Skillet, serving wings, hot dogs and burgers such as the Southern BBQ, Eggcelent and Oh So Hot burgers.
                - text: Azeem says that their current menu was designed by Sarah and that they are committed to hand-slaughtered zabiha halal meat. “Halal eating is a whole lifestyle,” he says. He points out that there are places where some options are halal but the halal concept is not fully embraced, so the word “halal” is being used as a marketing term by people who don’t understand it. He says that Urban Skillet “gives an opportunity for people to actually understand that there are places that serve 100% halal.”
                - text: The couple wants to make sure that everybody can eat at the restaurant, no matter their dietary or religious restrictions. With locations in North Hollywood, Santa Monica and Minnesota, they are actively expanding, with Houston and Irvine locations coming soon.
