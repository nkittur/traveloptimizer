                - text: Famous for serving halal chicken, Dave’s is a nationwide hot-chicken name (with locations in Canada too). This place is not known for being bland. You can set the spice level according to your taste, ranging from No Spice to the Reaper. The eatery’s special sauce is so popular that customers bring extra packets home as a condiment for other meals.
