                - text: Next to a laundromat and a Cuban bakery on Venice Boulevard, Abhiruchi Grill serves the best biryani in town — with the perfect blend of flavorful spices that aren’t Americanized and don’t overwhelm the essence of the meal, and firm basmati rice grains “cooked to perfection,” as the restaurant claims.
                - text: Coming from a biryani elitist like me, this endorsement is the highest honor, for biryani is sacred. And if you are someone who disrespects this fan-favorite king among South Asian cuisine by calling New York cart-style chicken and rice “biryani,” you certainly can’t sit with us.
                - text: The Abhiruchi menu has 10 biryani options for all tastes and preferences. Some rave about its goat biryani, while others can’t get enough of the egg biryani; there’s even a boneless option if that’s what you like.
                - text: The restaurant offers a full halal menu with authentic South Asian food and both vegetarian and nonvegetarian options, including chicken, goat and lamb dishes. The biggest thing this place has going for it is word-of-mouth; there is not a single South Asian student at USC who has not had food here (as an alum, I was made aware of this recently).
                - text: Even though the restaurant doesn’t deliver within the free Lyft zone on campus, I have known many to go out of their way to order from here. The chicken-to-rice ratio is great, and the serving size is good enough that the leftovers can provide up to two additional full meals.
