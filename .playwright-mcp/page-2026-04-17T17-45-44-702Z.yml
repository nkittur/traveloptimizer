          - paragraph [ref=e68]: I’m on the hunt for halal food in and around Los Angeles. I miss my mother’s beef shami kebabs. My heart aches for a footlong paratha roll delivered to my door, and on the coldest nights in a Los Angeles winter, I crave hot chicken soup in a plastic cup, the kind I could get only from street vendors in Islamabad, Pakistan.
          - paragraph [ref=e69]: One day, my friend Lucia Ruan takes me to a place in Koreatown with the promise of Bangladeshi, Pakistani and Indian food. There is a neon green halal logo on the door. We order some biryani to share. I can’t say it is the best biryani I’ve had, but it is the first time I feel at home in a way only food can make you feel at home in a new city.
