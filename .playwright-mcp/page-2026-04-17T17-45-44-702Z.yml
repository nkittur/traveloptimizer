                - text: Are you a Flamin’ Hot Cheetos fan? Have you been searching TikTok for crazy new recipes featuring the crunchy puffs’ red dust? If yes, Fatima’s Grill should be on your radar. This Lebanese-Mexican spot is popular for its Birria Hot Cheetos Crunch Wrap — made with beans, birria, guacamole, lettuce, tomatoes, sour cream, Hot Cheetos and nacho cheese.
                - text: The restaurant also offers burritos, quesadillas, wraps, tacos, tortas, kebab platters and even burgers.
                - text: Owner Ali K. Elreda named Fatima’s Grill after his daughter, who is now 17. Born in Detroit and raised by Lebanese parents in Bell, Elreda grew up in diverse neighborhoods and became invested in fusion food.
                - text: The Downey location has the full menu, while the other franchise locations offer 10 to 15 items based on demand in the area. Although expansion has been relatively slow because of the commitment to halal meat, Elreda plans to open a new location in downtown Los Angeles in early 2023.
