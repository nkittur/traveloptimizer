              - generic [ref=e996]:
                - text: There’s something about a spice meter that always brings out the daredevil in people. In addition to its signature peri-peri chicken, based on the African bird’s-eye chile, Port of Peri Peri serves lamb chops, burgers and several vegetarian dishes.
                - text: Founder Syed Pasha opened in Villa Park, Ill., in 2017 (with 21 other franchise locations now operating across the country and several under construction). Pasha left his IT job for the food business with the goal to take peri-peri nationwide.
                - text: The current menu has eight spice levels, ranging from plain to extra hot. Having experienced supply chain issues during the pandemic, Pasha set up a pipeline from a hatchery to a farm (where the
                - link "chickens" [ref=e997] [cursor=pointer]:
                  - /url: https://www.myperiperi.com/port-chicken2/
                - text: are free-roaming and given vegetarian feed). The chickens are individually hand-slaughtered in a USDA-approved processing facility as per
                - link "halal standards" [ref=e998] [cursor=pointer]:
                  - /url: https://www.hfsaa.org/
                - text: set by the Halal Food Standards Alliance of America.
