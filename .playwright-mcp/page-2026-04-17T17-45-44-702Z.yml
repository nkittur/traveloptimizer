                - text: The high-top tables, vibrant barstools and bright wall art match Papi’s signature red-orange tacos, served with 16-hour cooked consommé.
                - text: The face of the family-run business, Omar Ghanim made several extended visits to Mexico, where he perfected his recipes before starting the business.
                - text: "Full disclosure: Papi’s was not always a halal option. One of Ghanim’s friends was dying to try his food but ate only halal, so Ghanim cooked a special halal birria and chicken tacos for his friend to try."
                - text: Falling in love with the flavor, the friend inspired Ghanim to switch to an all-halal menu in February to accommodate more people. Although Papi’s primary location on Jefferson was damaged in a fire in 2021, it is set to reopen within a few months. Ghanim also just opened a new location in Santa Ana.
