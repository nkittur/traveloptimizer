                - text: "As you walk into HiHo Cheeseburger’s Santa Monica location, to the left you see information about its grass-fed Wagyu beef in giant chalk-like lettering on a black wall, including the brag: “The best beef on Earth.”"
                - text: The burger joint’s short and sweet menu sticks to the classics with beef and vegan burgers and a fried chicken sandwich; there are also options to add pastrami or make it spicy.
                - text: The beef, sourced from First Light Farms, is halal but the restaurant does not have halal cheese, meaning it includes nonhalal byproducts. (Although HiHo is protective of its cheeseburger and never posts photos without the cheese, you can request it be removed if you eat only halal.)
                - text: The burgers are complemented with ketchup, onion jam, lettuce, pickles and mustard, and there is a double and even triple patty add-on option for the HiHo burger.
                - text: The restaurant also serves from-scratch shakes and house-made desserts. Initially, the restaurant didn’t realize that its meat was halal and didn’t advertise it as such. But after an influx of new Muslim customers, word got out. One of the owners, Sheeroy Desai, calls it a “fortunate accident.” Now, there are four locations in L.A. County, and HiHo has a sister restaurant called
                - link "Matu" [ref=e760] [cursor=pointer]:
                  - /url: https://www.matusteak.com/
                - text: ", a Beverly Hills steakhouse also serving halal Wagyu beef."
