            - generic [ref=e711]:
              - generic [ref=e712]:
                - text: At Simpang Asia, the nasi bungkus I order is prepared with chicken curry, beef rendang, sambal egg and vegetable curry, wrapped in banana leaves. The unraveling of it comes with an early-birthday-present energy.
                - text: This Indonesian restaurant, with locations in Palms and Venice, started out as an Indonesian specialty market in 2002, grew into a cafe and had become a full-service restaurant by 2010.
                - text: The Palms location also has an outdoor patio set up with string lights and colorful chairs that match the indoor leafy green and white oak decor.
                - text: The restaurant shifted to a halal menu in July 2018. Owner Leni Kumalasari says the restaurant would get frequent queries and requests about halal options.
                - text: “I grew up in Indonesia, so I grew up with a lot of [Muslim] friends,” Kumalasari says. “I like to listen to what my customers need, so usually my menu also goes from there.”
                - text: She adds that despite it being more expensive and challenging to consistently provide halal food, she is committed to serving it and has seen a lot of growth this year.
                - text: Simpang Asia does have two items marked on the
                - link "menu" [ref=e713] [cursor=pointer]:
                  - /url: https://www.simpangasia.com/menu
                - text: as containing nonhalal ingredients — the nasi goreng jagger and the char kway teow have chicken sausage in them that is not halal-certified — but the kitchen staff is trained to avoid cross-contamination.
                - text: Multiple locations,
                - link "simpangasia.com" [ref=e715] [cursor=pointer]:
                  - /url: https://www.simpangasia.com/
