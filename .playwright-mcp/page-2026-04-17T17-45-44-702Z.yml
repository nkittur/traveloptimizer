                - text: "Pizzaiolo Ali Haider says that at 786 Degrees, everybody gets a different country on the plate. A pizza is his canvas: “Why not bring the best from different countries and then present it like a painting on a pizza?” he says."
                - text: After experimenting at home, Haider built a mobile oven to take to farmers markets and events. Eventually, with his wife and co-owner, Sayyeda Ali, he opened his first pizza place in Sun Valley in 2016, with a wood-fired oven built and shipped by Haider’s friends in Italy — friends he made when he first trained there in the art of Naples-style pizza.
                - text: They now have another location in Pasadena and 35 options on the menu, serving Neapolitan pizzas inspired by American, Mexican, Korean, Middle Eastern and South Asian cuisines, along with several vegan and vegetarian options.
                - text: Regulars get access to a secret menu once they’ve tried the entire menu.
                - text: The Iraqi Indian pizza chef grew up in a household with hummus, curry and pasta served on the same table — so the blending of cuisines and flavors is not new to him. He tests all his new pizzas at home, and if the kids approve, then the pizzas get a chance.
                - text: Haider has professionally competed in pizza contests and most recently
                - link "won a contest on Hulu’s “Best in Dough" [ref=e478] [cursor=pointer]:
                  - /url: https://www.hulu.com/watch/6587b461-8445-483a-8e1a-6474510508a3
                - text: "” pizza champions episode. Pizzas to try: the Bulgogi Gangnam style, the Habibi lamb and the Istanbul."
