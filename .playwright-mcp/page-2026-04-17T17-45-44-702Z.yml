                - text: desi food to a diverse millennial crowd. The smoked beef or salmon kebabs make for an exhilarating show as they arrive on a wooden board covered with a smoke-filled glass dome.
                - text: Originally from Karachi, Pakistan, co-owner Imran Mookhi moved to the United States in 2000 as a 17-year-old. He got a job as a dishwasher at a restaurant to pay the bills while studying computer science. Eventually, he trained under numerous Michelin-starred chefs. His previous ventures include Tantra on Sunset, Tamarind of London in Newport Beach, Dosa in San Francisco and Tumbi in Santa Monica. Mookhi recalls the lack of halal options when he first moved here. “To get halal food, you [would] have to drive an hour away just to buy meat, and there were not too many halal restaurants out there either.”
                - text: Try Khan Saab’s pani puri, puff pastry stuffed with garbanzo, potato and onion and served with spiced mint and tamarind water in a shot-glass array set atop a miniature food cart, or stop by for a drink at the eatery’s nonalcoholic bar for signature crafted mocktails and zero-proof brews.
