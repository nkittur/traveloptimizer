              - generic [ref=e306]:
                - text: A historic Pakistani restaurant, Bundoo Khan started selling parathas and kebabs on the streets of Karachi in 1948, later scaling up to a dine-in restaurant in 1957. The Bundoo Khan franchise made its way to the West Coast in 2021 with its first U.S. location. The Fullerton branch delivers on its promise of authentic Pakistani barbecue.
                - text: As I walk into the open-kitchen restaurant, I hear the sizzle of skewers on the grill, I smell meat cooking above a bed of hot coals and I see the rolls and kebabs being prepped. It all takes me back to family barbecue nights.
                - text: The restaurant offers chicken, beef, lamb and even fish options, along with family deals and catering options ranging from 12 to 130 kebabs per tray. The only drawback is that if you do not eat meat, there isn’t much for you on this menu.
