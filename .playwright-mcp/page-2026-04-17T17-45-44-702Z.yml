                - text: This is so far the only Korean barbecue restaurant I’ve found in the area that offers a full halal menu. With locations in Santa Ana, Irvine and Tustin, I Can Barbecue offers an all-you-can-eat experience.
                - text: I’d never tried cooking meat on grills built into the dining table because I hadn’t found any halal KBBQ spots. So I was excited as I walked up to the location in Santa Ana just as lunch hour was about to end. As a first-timer, I got all the help I needed to figure out how I preferred to cook for myself.
                - text: Along with beef, chicken, seafood and even tofu options, you can order a variety of sides — steamed eggs, rice and pita. The table is always set up with complimentary banchan, including pickled cucumbers, rice cakes and kimchi. The bulgogi, beef belly and Cajun marinated chicken do not disappoint. People who eat only halal have hailed the restaurant as a way to experience Korean food, and some even visit from San Francisco and Las Vegas. Just remember, no takeaway.
                - text: Also located at 5781 Alton Parkway, Irvine,
