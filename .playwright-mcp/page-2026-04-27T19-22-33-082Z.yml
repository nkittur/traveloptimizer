              - figure [ref=e456]:
                - paragraph [ref=e461]: A Hebridean escape for whisky connoisseurs, in 2026 Islay will be home to even more distilleries than ever before
              - generic [ref=e468]:
                - paragraph [ref=e469]:
                  - text: The first distillery opened on Islay in 1779, and nearly 250 years later the peat-cut island is setting the whisky world alight once more, as though in the process of remaking itself. Openings are rare in the
                  - link "Hebrides" [ref=e470] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/story/scotlands-inner-hebrides-sailing-adventure
                  - text: ", but 2026 brings a raft of exciting spots for lovers of the \"water of life.”"
                - paragraph [ref=e471]:
                  - text: Nowhere is this thrilling shift more feel good than at
                  - link "Laggan Bay Distillery" [ref=e472] [cursor=pointer]:
                    - /url: https://www.ianmacleod.com/brands/laggan-bay-distillery
                  - text: ", the 12th whisky house on the island. Due to open in late 2025 near the toffee-colored Big Strand, the island’s longest beach, this launch from the brains behind Edinburgh Gin and Glengoyne could be the most newsworthy story of the year. That is, if it weren’t for the arrival of a second distillery—"
                  - link "Portintruan" [ref=e473] [cursor=pointer]:
                    - /url: https://elixirdistillers.com/distilleries/
                  - text: ", which will soon be up and running outside Port Ellen on Islay’s south coast."
                - paragraph [ref=e474]:
                  - text: Add to this picture newly opened
                  - link "Ardbeg House" [ref=e475] [cursor=pointer]:
                    - /url: https://www.ardbeghouse.com/
                  - text: ", from French luxury empire LVMH. The sooty maritime single malt once represented the darker side of Islay whiskies, but now Ardbeg represents opportunity and optimism. The brand’s 12-bedroom boutique residence in Port Ellen is somewhere to eat, drink, and unplug, with kaleidoscopic textiles, richly detailed furnishings, and design that’s pushing the limits of luxury on the island. No one in the world of whisky has seen anything like it in years."
                - paragraph [ref=e476]:
