              - figure [ref=e494]:
                - generic [ref=e497]:
                  - img "Ahead of the 2026 Winter Olympic Games Milan is preparing for its role as host with a series of boxfresh..."
                - paragraph [ref=e500]: Ahead of the 2026 Winter Olympic Games, Milan is preparing for its role as host with a series of box-fresh hotels—including Rosewood Milan
              - paragraph [ref=e505]:
                - link "Milan" [ref=e506] [cursor=pointer]:
                  - /url: https://www.cntraveler.com/story/how-milan-became-the-most-forward-thinking-city-in-italy
                - text: "has long been misunderstood and underestimated, but the Lombardy capital charts its own course, delivering everything a city lover could possibly want: nuanced culture, rich heritage, inventive"
                - link "restaurants" [ref=e507] [cursor=pointer]:
                  - /url: https://www.cntraveler.com/story/in-milan-peruvian-restaurants-build-on-a-tradition-of-fusion
                - text: and cocktail bars, and a bursting dynamism only set to grow in 2026.
              - generic [ref=e514]:
                - paragraph [ref=e515]:
                  - text: From February 6th to 22nd, Milan will co-host the
                  - link "Winter Olympic Games" [ref=e516] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/story/last-minute-winter-olympics-trip-to-italy-2026
                  - text: with Cortina d’Ampezzo. The Games are poised to be the most widespread in history, spanning 8,500 square miles between the two hubs and their outlying venues. The 2026 Games will also be the most gender-balanced winter edition in history, with 47% female participation, while sustainability remains at the forefront. Initiatives include 100% renewable energy, the use of 11 (out of 13) existing or temporary venues and an Olympic Village, outfitted with solar panels, rainwater harvesting, and urban farming, which will be repurposed into student dorms.
                - paragraph [ref=e517]:
                  - text: From April 22nd to 26th, design devotees will descend on Milan for the 64th edition of Design Week, or
                  - link "Salone del Mobile" [ref=e518] [cursor=pointer]:
                    - /url: https://www.salonemilano.it/en
                  - text: ", the world’s largest furniture fair. Fuorisalone, the city-center offshoot, unfolds through hundreds of courtyards, galleries, and showrooms rooted in a unifying theme. As 2026’s theme, Be the Project will aim to bring sustainability and social impact into focus, expanding on last year’s Connected Worlds, which explored AI and digital interconnectedness."
                - paragraph [ref=e519]:
                  - text: But sports and design are hardly Milan’s only draw. In 2026, a trio of five-star hotels will open. In the Quadrilatero della Moda, the golden rectangle delineating the upscale fashion district, two 19th-century palazzi will house the 70 guest rooms of
                  - link "Rosewood Milan" [ref=e520] [cursor=pointer]:
                    - /url: https://cna.st/affiliate-?xid=fr1777317751824hga
                  - text: .
                  - link "Six Senses" [ref=e521] [cursor=pointer]:
                    - /url: https://cna.st/affiliate-?xid=fr1777317751824acf
                  - text: will debut a short stroll away in the Brera, set in a post-war rationalist building with 68 guest rooms, including 15 suites (two with plunge pools), a spa, rooftop bar, and sky pool. A short stroll from Piazza del Duomo,
                  - link "Mett Milan" [ref=e522] [cursor=pointer]:
                    - /url: https://www.metthotelsandresorts.com/milan/
                  - text: will claim the top nine floors of the Torre Velasca, a 26-story 1950s skyscraper with a protruding top reminiscent of a medieval watchtower. Adding to the mix,
                  - link "Soho House" [ref=e523] [cursor=pointer]:
                    - /url: https://www.sohohouse.com/en-us/new-house-openings
                  - text: is also set to arrive, transforming the 1930s Cinema Arti into a creative club and accommodation of more than 50 rooms, along with a rooftop terrace and pool.
                - paragraph [ref=e524]:
                  - strong [ref=e525]: "How to plan it:"
                  - text: "Milan has two main airports: Linate and Malpensa. Linate is the more comfortable option, with the city center just 15-20 minutes away by taxi. It’s also connected via buses and the new-ish M4 metro line. Malpensa is nearly an hour away. From there, you can take the dedicated train (tickets available at the station or from the TreNord app) or a bus or grab a taxi—just confirm the €114 fixed rate before setting off In general, finding a taxi can be tricky (especially during Salone or other buzzy events), but apps like itTaxi, FREENOW, and appTaxi make it easier. Uber operates in Milan, but it’s mostly Uber Black with limited availability. Also, public transport is efficient and reliable, and all buses, trams, and metro lines accept contactless payment. —"
                  - link "Jaclyn deGiorgio" [ref=e526] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/contributors/jaclyn-degiorgio
                    - emphasis [ref=e527]: Jaclyn deGiorgio
                - paragraph [ref=e528]:
                  - emphasis [ref=e529]:
                    - text: Read our full list of the
                    - link "best hotels in Milan" [ref=e530] [cursor=pointer]:
                      - /url: https://www.cntraveler.com/gallery/best-hotels-in-milan
                    - text: .
                - link "Browse more Milan hotels" [ref=e532] [cursor=pointer]:
                  - /url: https://www.cntraveler.com/gallery/best-hotels-in-milan
