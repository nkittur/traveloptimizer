                    - /url: https://www.cntraveler.com/story/the-best-things-to-do-in-seville
                  - text: new cuisine—and its new lease of life. Although it’s perhaps the most beautiful city in Spain, Seville has had reputation for being not very disruptive and sometimes quite old-fashioned, but that's changing fast. The city is jam-packed with young, enterprising chefs we’ve been keeping an eye on, who look ahead with a focus on innovation and ingenuity, without losing sight of tradition. But because no one wants to miss out on the classic Seville experience, iconic restaurants such as
                  - link "Cañabota" [ref=e603] [cursor=pointer]:
                    - /url: https://canabota.es/en/
                  - text: ","
                  - link "Jaylu" [ref=e604] [cursor=pointer]:
                    - /url: https://www.restaurantejaylu.com/en/
                  - text: ", Casa Ruperto, and"
                  - link "Yebra" [ref=e605] [cursor=pointer]:
                    - /url: https://www.yebrarestauracion.com/
                  - text: "shouldn’t be overlooked. Adding to the culinary momentum is a new cohort of cocktail bars:"
                  - link "Naked and Famous" [ref=e606] [cursor=pointer]:
                    - /url: https://nakedandfamous.es/
                  - text: (yes, in English),
                  - link "Plácido y Grata" [ref=e607] [cursor=pointer]:
                    - /url: https://www.hotelsone.com/seville-hotels-es/placido-y-grata.html?dsti=70791182&dstt=8&nid=1&as=g&aid=758014103426&cmpid=21722256953&agid=189406403908&gid=CjwKCAjwx-zHBhBhEiwA7Kjq65s0Q6mrNsIvZ_XyEpw54dVnThovyEZRJyR0ZCz-hTetuGplBB0XzRoCZRsQAvD_BwE&gwbrd=Ck0KCQjwpOfHBhD1ARI8AJRnVBeG9D9--Gk387FoEdM6qcPpCG3S3DpP-lJFnelpyOyGuCIBUiUdkDEAhGtXjifJFB9dct0KOJHXGgKkWA&ggbrd=0AAAAAD4o1Peqzmn81feyq78T0x6LsTO9_&gad_source=1&gad_campaignid=21722256953&gbraid=0AAAAAD4o1Peqzmn81feyq78T0x6LsTO9_&gclid=CjwKCAjwx-zHBhBhEiwA7Kjq65s0Q6mrNsIvZ_XyEpw54dVnThovyEZRJyR0ZCz-hTetuGplBB0XzRoCZRsQAvD_BwE
                  - text: —which is also a charming hotel—and
                  - link "Tremenda Muela" [ref=e608] [cursor=pointer]:
                    - /url: https://www.instagram.com/tremendamuela/?hl=en
                  - text: are a few examples. The night is long and exciting in the new version of Seville.
                - paragraph [ref=e609]:
                  - text: Hotels are also opening in quick succession and international brands, in particular, are betting on the city, which will soon rank as the third most significant luxury destination in Spain (after
                  - link "Madrid" [ref=e610] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/story/best-things-to-do-in-madrid
                  - text: and
                  - link "Mallorca" [ref=e611] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/gallery/best-hotels-mallorca
                  - text: ). Among the recent arrivals turning heads are cozy
                  - link "La Casa del Limonero" [ref=e612] [cursor=pointer]:
                    - /url: https://cna.st/affiliate-?xid=fr1777317751824dbe
                  - text: ","
                  - link "Querencia de Sevilla by Autograph Collection" [ref=e613] [cursor=pointer]:
                    - /url: https://cna.st/affiliate-?xid=fr1777317751824ffj
                  - text: ", and"
                  - link "Cristine Bedfor" [ref=e614] [cursor=pointer]:
                    - /url: https://cna.st/affiliate-?xid=fr1777317751824hcf
                  - text: (the third—and chicest—hotel from one of the coolest Spanish brands).
                  - link "Serras Sevilla" [ref=e615] [cursor=pointer]:
                    - /url: https://serrascollection.com/es/hoteles/serras-sevilla/
                  - text: will soon be unveiled in a historic building near La Giralda bell tower—and other projects already underway include Six Senses—on the Caprichosa estate in Gerena, on the outskirts of the city, which was owned by William Randolph Hearst's granddaughter—Thompson Sevilla, on Plaza de la Gavidia;
                  - link "Hotel Alfonso XIII, a Luxury Collection by Marriott" [ref=e616] [cursor=pointer]:
                    - /url: https://cna.st/affiliate-?xid=fr1777317751824gej
                  - text: in a former tobacco factory; and a Kimpton in the beautiful 13th-century Convent of San Agustín. Four Seasons will touch down in 2027, occupying the Generali building in Plaza Nueva.
                - paragraph [ref=e617]:
                  - strong [ref=e618]: "How to plan it:"
                  - text: This growth is accompanied by new international air routes, such as the recent ones to Düsseldorf, Baden-Baden, Copenhagen, Basel and Istanbul, while progress is being made on the launch of direct routes between Miami and Seville and Beijing and Seville. Meanwhile, the high-speed train linking Madrid and Seville remains a fast and comfortable way to reach the city from the Spanish capital, with numerous daily departures and a journey time of just two and a half hours. —
