                - paragraph [ref=e323]:
                  - text: Brussels’s cultural revival is visible everywhere, from the refreshed façades of Place de la Bourse to the
                  - link "Dome Project" [ref=e324] [cursor=pointer]:
                    - /url: https://www.vddprojectdevelopment.com/en/the-dome
                  - text: ", a restoration of Belgium’s first department store with modern flair. Nearby, the Gare Maritime, a former freight station, now seamlessly blends sustainable architecture with design fairs and chef-led food stalls. Plan a spring visit, when"
                  - link "Art Brussels" [ref=e325] [cursor=pointer]:
                    - /url: https://artbrussels.com/
                  - text: draws galleries and collectors from around the world for a vibrant international fair, and the biannual Zinneke Parade transforms the city’s streets into a stage of theater and imagination. For those seeking more adrenaline, base yourself in the city for the Belgian Grand Prix to marvel at the sporting spectacle.
              - generic [ref=e332]:
                - paragraph [ref=e333]:
                  - strong [ref=e334]: "How to plan it:"
                  - text: Spring and early summer are ideal, while autumn’s crisp days are perfect for gallery-hopping. Brussels is easily accessible via major airlines, low-cost carriers such as Ryanair and EasyJet, or Eurostar from London, Paris, and Amsterdam. A car isn’t necessary—the city is compact with excellent public transportation. In 2026, new tram links will connect the airport to the city center and the canal district. For practical tips,
                  - link "visit.brussels" [ref=e335] [cursor=pointer]:
