              - generic [ref=e422]:
                - paragraph [ref=e423]:
                  - text: Best known as
                  - link "Germany" [ref=e424] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/gallery/most-beautiful-places-in-germany
                  - text: "’s financial hub and a skyline that has earned it the nickname “Mainhattan,” Frankfurt am Main is far more than banks and trading floors. This is a city of contrasts that fit together with surprising charm: a metropolis where local dialect is still spoken, a global city in pocket format. Not entirely walkable, yet compact. Polished, but never too polished. Sometimes a little rough around the edges. Home to Goethe and birthplace of the"
                  - link "techno scene" [ref=e425] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/gallery/best-things-to-do-in-berlin
                  - text: ", it blends urban energy with Hessian conviviality, and today has one of the country’s most exciting food cultures."
                - paragraph [ref=e426]:
                  - text: The perfect moment to experience it will be 2026, when Frankfurt steps onto the stage as World Design Capital under the banner “Design for Democracy.” More than 2,000 events will animate the city, from the banks of the River Main to neighborhoods that have reinvented themselves in recent years—such as Osthafen, once industrial land, now a lively quarter.
                  - link "Neue Altstadt" [ref=e427] [cursor=pointer]:
                    - /url: https://www.visitfrankfurt.travel/en/experience/attractions/new-old-town
                  - text: ", opened in 2018, is a once-in-a-century architectural project, where painstakingly reconstructed half-timbered houses stand alongside contemporary buildings in a strikingly harmonious whole. At its heart is the Römer, the city hall since 1405 and a symbol of democracy, fronted by the ornate Fountain of Justice, which once flowed with wine during coronations."
                - paragraph [ref=e428]:
                  - text: The dialogue between past and present will also be on show in 2026 with the opening of the Jewish Academy. A new center for education, exchange, and culture in the Westend district, it will be a landmark project for Germany’s
                  - link "Jewish community" [ref=e429] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/story/the-best-jewish-food-in-nyc-according-to-a-jewish-new-yorker
                  - text: ", which has shaped the city economically and culturally and remains deeply rooted here. In July 1950, just five years after the Holocaust, the Central Council of Jews in Germany was founded in Frankfurt."
                - paragraph [ref=e430]:
                  - text: Travelers can also check out a glittering trio of new hotels.
                  - link "Kimpton Frankfurt" [ref=e431] [cursor=pointer]:
                    - /url: https://cna.st/affiliate-?xid=fr1777317751824bbj
                  - text: and
                  - link "The Florentin" [ref=e432] [cursor=pointer]:
                    - /url: https://cna.st/affiliate-?xid=fr1777317751824aid
                  - text: (formerly Villa Kennedy) bring a fresh dose of boutique character, while the iconic
                  - link "Grandhotel Hessischer Hof" [ref=e433] [cursor=pointer]:
                    - /url: https://cna.st/affiliate-?xid=fr1777317751824jbf
                  - text: is set to return under the Taj banner by the end of 2025.
