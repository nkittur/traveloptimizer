                - paragraph [ref=e358]: Ikos Kissamos, just west of Chania, is one of several island resorts celebrating Crete's culinary prowess.
              - generic [ref=e362]:
                - paragraph [ref=e363]:
                  - text: Since it’s home to the health-boosting Cretan diet, and to wine production that dates back to the Bronze Age Minoans, it’s no surprise that
                  - link "Greece’s" [ref=e364] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/story/best-time-to-visit-greece
                  - text: megalo nisi (big
                  - link "island" [ref=e365] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/gallery/best-greek-islands-to-visit
                  - text: ") is next year’s European Region of Gastronomy. Locavores way before the term was trendy, Cretans love to forage for their supper: askolimbi (golden thistle) whose roots taste like artichoke, kochlioi (snails) swimming in a garlicky sauce, or vlita (wild greens) lightly steamed and dressed with sea salt and fresh lemon juice. These are just some of the scintillating, yet simple, dishes showcased in the week-long"
                  - link "Cretan Diet festival" [ref=e366] [cursor=pointer]:
                    - /url: https://cretandietfestival.gr/en/home/
                  - text: that will be held in the Venetian-fortress-topped town of Rethymnon in July 2026.
                - paragraph [ref=e367]:
                  - text: Keen to celebrate the island’s culinary flair, a raft of new hotels, with gourmet restaurants, are also opening their doors.
                  - link "Ikos Kissamos" [ref=e368] [cursor=pointer]:
                    - /url: https://cna.st/affiliate-?xid=fr1777317751824bed
                  - text: ", the brand’s first Cretan resort, promises seven stunning restaurants with menus crafted by Michelin-lauded chefs. Housed in a sumptuously revamped former soap factory, hyper-chic urban retreat"
                  - link "Niko Seaside Resort MGallery Crete" [ref=e369] [cursor=pointer]:
                    - /url: https://cna.st/affiliate-?xid=fr1777317751824fai
                  - text: plans to dish up locally sourced fare, while scenic views of former leper colony Spinalonga will be the backdrop for a raft of unique farm-to-table culinary experiences at Greece’s first
                  - link "Rosewood" [ref=e370] [cursor=pointer]:
                    - /url: https://cna.st/affiliate-?xid=fr1777317751824iff
                  - text: in jet-setter hideout Elounda. The soft launch of the island’s new airport—replacing the old one, which is regularly voted “Europe’s worst”—will be the icing on the island’s drool-worthy cake.
                - paragraph [ref=e371]:
                  - strong [ref=e372]: "How to plan it:"
                  - text: Crete’s main airport Heraklion gives access to both sides of the island, but there are also two smaller (less crowded) airports in the west, near Chania, and in the east in Sitia. It’s easy to get into town from any of the airports—they are all close to their respective town centres. Rethymnon, home to the Cretan Diet festival, is on the island’s (great value) KTEL bus route. Discover Greece (
                  - link "discovergreece.com" [ref=e373] [cursor=pointer]:
                    - /url: http://discovergreece.com
                  - text: ) is a great one-stop-shop for information about the island. —
