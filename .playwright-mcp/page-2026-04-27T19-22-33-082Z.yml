                - heading "Saint-Gervais-les-Bains, France" [level=2] [ref=e535]
                - paragraph [ref=e537]:
                  - emphasis [ref=e538]:
                    - strong [ref=e539]: "Go for:"
                    - text: sustainable train travel and sweeping Haute-Savoie views
              - figure [ref=e543]:
                - generic [ref=e546]:
                  - img "A new fleet of energyefficient Mont Blanc Express trains are proof that this French destination is changing the face of..."
                - paragraph [ref=e549]: A new fleet of energy-efficient Mont Blanc Express trains are proof that this French destination is changing the face of Alpine tourism.
              - generic [ref=e556]:
                - paragraph [ref=e557]:
                  - text: In 2026, Saint-Gervais-les-Bains, in Haute-Savoie, is taking a big step towards rewriting what
                  - link "Alpine tourism" [ref=e558] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/story/in-the-bavarian-alps-waltzing-my-way-into-family-history
                  - text: can look like. The
                  - link "Mont Blanc Express" [ref=e559] [cursor=pointer]:
                    - /url: https://www.mont-blanc-express.ch/en
                  - text: ", the century-old railway that winds between Saint-Gervais-les-Bains’s Le Fayet and Martigny, will unveil a new fleet of energy-efficient trains in the summer. For a line first electrified in 1908, it’s a symbolic upgrade: proof that sustainable travel is no longer a side story in the Alps, but the way forward. The new trains will double capacity, cut emissions, and ease car traffic in the valleys, while strengthening the cross-border links that have always defined this region. From 2026, the Léman Express from"
                  - link "Geneva" [ref=e560] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/story/12-best-things-to-do-in-geneva-for-every-season
                  - text: will also expand services, making it easier than ever to arrive in the Mont Blanc foothills entirely by rail.
                - paragraph [ref=e561]:
                  - text: In the Belle Époque spa town, innovation is already reshaping daily life. Launched in 2024, Le Valléen gondola is the first in
                  - link "France" [ref=e562] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/destinations/france
                  - text: to connect a mainline SNCF station directly with a mountain resort center. In five minutes, it whisks passengers from Saint-Gervais Le Fayet station to the town center with sweeping views over the Bonnant gorge, cutting traffic and linking directly to ski lifts. From the same station, the Mont Blanc Express runs up the valley to
                  - link "Chamonix" [ref=e563] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/gallery/best-apres-ski-scenes-in-europe
                  - text: .
                - paragraph [ref=e564]:
                  - text: The famous Alpine town adds to the story in 2026 with the opening of the
                  - link "Glaciorium" [ref=e565] [cursor=pointer]:
                    - /url: https://montenversmerdeglace.montblancnaturalresort.com/en/page/glaciorium
                  - text: ", a glacier and climate center at Montenvers—a timely reminder of why these greener choices matter. Together with Saint-Gervais, this corner of Haute-Savoie feels less like a nostalgic ski destination and more like a region reimagining its future—proving the Alps can still thrill, while treading more lightly on the mountain."
                - paragraph [ref=e566]:
                  - strong [ref=e567]: "How to plan it:"
                  - text: From 2026, take the Léman Express direct to Saint-Gervais–Le Fayet in just over an hour. At Le Fayet, hop on the Le Valléen gondola for a five-minute ride into Saint-Gervais, or continue on the Mont Blanc Express to Chamonix and into Switzerland. With this growing rail-and-lift network, a car isn’t essential. Ski in winter, hike and climb in summer, and don’t miss the Saint-Gervais thermal baths year-round. —
                  - link "Katilena Dartford" [ref=e568] [cursor=pointer]:
                    - /url: https://www.cntraveler.com/contributor/katilena-dartford
                    - emphasis [ref=e569]: Katilena Dartford
