                  - text: ferry from the Kennacraig terminal on the Kintyre peninsula. Foot passenger and car tickets cost £8.70/£52.60, but with limited public transport on the island, a car is recommended. If you like whisky culture, community get-togethers and ceilidhs, May 2026 is the 40th anniversary of Feis Ile, the island’s annual 10-day whisky festival. —
