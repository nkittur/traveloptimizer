            - generic [ref=e217]: 6 p.m. Walk among the colorful cottages
            - generic [ref=e218]:
              - text: Catch Oak Bluffs, an eclectic town on the island’s northeastern shore, as the sun begins to peek through the ornate cutouts of the gingerbread cottages that have lined the downtown streets for more than 160 years. The brightly colored houses were built by a
              - link "Methodist movement" [ref=e219] [cursor=pointer]:
                - /url: https://www.mvcma.org/history-1
              - text: for their growing community and mimic the tents its members originally gathered in. Many of the 300-plus original cottages can be found in Wesleyan Grove, the historic district encompassing the
              - link "old campground" [ref=e220] [cursor=pointer]:
                - /url: https://buildingsofnewengland.com/tag/wesleyan-grove/
              - text: . Afterward, stroll a few minutes east to admire some of Oak Bluffs’ grandest homes, which line Ocean Park, including the
              - link "Joe Overton House" [ref=e221] [cursor=pointer]:
                - /url: https://mvafricanamericanheritagetrail.org/trail-sites/town-of-oak-bluffs/
              - text: ", a Victorian mansion built in 1875 that was eventually owned by a Black union organizer from Harlem, for whom it is named today. The house was a frequent destination for civil rights leaders, including the Rev. Dr. Martin Luther King Jr., and is part of"
              - link "a vibrant tradition of African Americans in Oak Bluffs" [ref=e222] [cursor=pointer]:
                - /url: https://www.nytimes.com/2021/09/24/travel/black-travel-marthas-vineyard.html
              - text: .
          - generic [ref=e223]:
            - generic [ref=e224]: 7 p.m. Have dinner on the harbor
            - generic [ref=e225]:
              - text: Summer is on full display along Oak Bluffs harbor, where ferries and charter fishing boats pull right up to a dock full of bars and restaurants.
              - link "Nancy’s Restaurant" [ref=e226] [cursor=pointer]:
                - /url: https://www.nancysrestaurant.com/
              - text: ", a sprawling, multilevel space that has anchored the waterfront for more than 60 years, serves seafood classics like local littleneck clam linguine ($35) and fish tacos ($23) along with Mediterranean staples like fattoush salad ($17). While you wait for your table, head downstairs to"
              - link "Donovan’s Reef" [ref=e227] [cursor=pointer]:
                - /url: https://www.mvtimes.com/2018/07/25/guess-whos-back/
              - text: ", where Donovan Clarke, for whom the bar is named, holds court, pouring Dirty Bananas (a riff on the mudslide cocktail, $13) every summer, when he travels to the island from Jamaica, part of a robust international summer workforce. If Nancy’s is packed, try the"
              - link "Pawnee House" [ref=e228] [cursor=pointer]:
                - /url: https://www.thepawneehousemv.com/
              - text: ", a quiet bistro on a corner of Kennebec Avenue with an expansive menu including vegan options and creative cocktails."
          - figure "scoop-picture" [ref=e230]:
            - img "A person wearing glasses and a short-sleeved shirt sings into a microphone next to a guitar player. Nearby, people appear to be dancing. The ceiling is rigged with rows of brightly colored string lights." [ref=e234]
            - generic [ref=e235]: The Ritz
          - generic [ref=e236]:
            - generic [ref=e237]: 9 p.m. Dance in a dive bar
            - generic [ref=e238]:
              - text: Music has long been an integral part of the Vineyard (the island was a folk-music destination in the 1960s, drawing the likes of
              - link "James Taylor and Carly Simon" [ref=e239] [cursor=pointer]:
                - /url: https://vineyardgazette.com/news/2011/07/28/when-going-viral-meant-passing-posters-folkies-all-flocked-moon-cusser
              - text: ); these days, there is
              - link "live music" [ref=e240] [cursor=pointer]:
                - /url: https://calendar.vineyardgazette.com/
              - text: every night of the week during the summer.
              - link "The Ritz" [ref=e241] [cursor=pointer]:
                - /url: https://www.theritzmv.com/shows
              - text: ", a year-round dive bar with live music (entry $5), will have you dancing to local bands like"
              - link "Johnny Hoy and the Bluefish" [ref=e242] [cursor=pointer]:
                - /url: http://www.johnnyhoyandthebluefish.com/
              - text: and
              - link "the Dukes of Circuit Avenue" [ref=e243] [cursor=pointer]:
                - /url: https://www.instagram.com/thedukesmv/?hl=en
              - text: . Up the block, you can watch the summer crowds from the porch bar at
              - link "Red Cat Kitchen" [ref=e244] [cursor=pointer]:
                - /url: https://www.redcatkitchen.com/
              - text: ", where"
              - link "punches" [ref=e245] [cursor=pointer]:
                - /url: https://www.redcatkitchen.com/cocktails
              - text: (from $17) and
              - link "nonalcoholic cocktails" [ref=e246] [cursor=pointer]:
                - /url: https://www.redcatkitchen.com/zeroproof
              - text: (about $11) go down easy. For a respite from the noise, you can get ice cream at
              - link "Ben & Bill’s Chocolate Emporium" [ref=e247] [cursor=pointer]:
                - /url: https://www.benandbillsmv.com/
              - text: ": Adventurous eaters may reach for the lobster flavor (if you really think you’ll like the taste of frozen crustacean, go crazy), but classics like peach and black forest are the real winners."
