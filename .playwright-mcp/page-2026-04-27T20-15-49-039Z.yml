          - generic [ref=e257]:
            - generic [ref=e258]: 9 a.m. Hike peaceful marshes and meadows
            - generic [ref=e259]:
              - text: About 40 percent of Vineyard land is
              - link "protected" [ref=e260] [cursor=pointer]:
                - /url: https://www.mvcommission.org/open-space-protection
              - text: ", managed primarily by conservation groups that are seeking to preserve the island’s fragile ecosystem. Much of that land is accessible by public walking trails."
              - link "Felix Neck Wildlife Sanctuary" [ref=e261] [cursor=pointer]:
                - /url: https://www.massaudubon.org/places-to-explore/wildlife-sanctuaries/felix-neck
              - text: ", more than 200 acres along the island’s northeastern shoreline managed by the Massachusetts Audubon Society, has four miles of trails along Sengekontacket Pond that capture nearly everything the island has to offer: woodlands, meadows, ponds, salt marshes and shorelines. If you’re lucky, you’ll see an osprey soar, most likely looking for food to bring back to a nearby nest on top of a pole. The trails are open daily from dawn to dusk ($4 for adults, members are free). If you’re looking to explore further, download"
              - link "TrailsMV" [ref=e262] [cursor=pointer]:
                - /url: https://sheriffsmeadow.org/trailsmv-app/
              - text: ", a free app created by another conservation group and the official guide to all of the public trails on the Vineyard."
          - generic [ref=e263]:
            - generic [ref=e264]: 11:30 a.m. Pack a beach picnic
            - generic [ref=e265]:
              - text: You’ll need to recharge after your hike, and
              - link "Mo’s Lunch" [ref=e266] [cursor=pointer]:
                - /url: https://www.moslunch.com/
              - text: is worth the short drive to Oak Bluffs. The small takeaway counter opened in 2021 inside the hall of the Portuguese American Club, the home of a
              - link "benevolent group" [ref=e267] [cursor=pointer]:
                - /url: http://holyghostassociation.com/
              - text: with roots in the island’s seafaring Portuguese heritage. Sandwiches like a cauliflower melt ($14) and an Italian sub ($15) are big enough to split, but there’s a pretty good chance you won’t want to share. Behind the counter, desserts like Key lime bars ($5) and big cookies with sprinkles ($3.50) are stacked high like something out of a Baroque still life. You can eat at a few tables inside the hall, but these generous sandwiches and sweet treats are best enjoyed on the beach.
          - generic [ref=e268]:
            - generic [ref=e269]: 12 p.m. Visit ‘Jaws’ without the bite
            - generic [ref=e270]:
              - text: An afternoon at
              - link "Joseph Sylvia State Beach" [ref=e271] [cursor=pointer]:
                - /url: https://www.dukescounty.org/natural-resources/pages/joseph-sylvia-state-beach
              - text: ", a 2.2-mile-long barrier beach that divides Sengekontacket Pond and Nantucket Sound, has options for adventurers and beach bums. Take out a kayak or a stand-up paddleboard to explore the pond;"
              - link "Island Spirit Kayak" [ref=e272] [cursor=pointer]:
                - /url: https://www.islandspiritkayak.com/
              - text: ", a kiosk near Little Bridge, rents either option at $30 an hour and also offers guided group tours. Or just park yourself beachside along the bay’s calm blue waters. Driving farther down the beach on Beach Road, you’ll cross what locals refer to as Big Bridge and what movie fans will recognize from the scene of a monster shark attack in “Jaws,” which was filmed on the island in 1974. But there is nothing scary about these waters, which make it easy to swim out to nearby sandbars."
