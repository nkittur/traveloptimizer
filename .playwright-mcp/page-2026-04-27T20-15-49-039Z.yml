            - generic [ref=e274]: 3 p.m. Head up-island
            - generic [ref=e275]:
              - text: Spend an afternoon in Aquinnah, on the Vineyard’s western tip. The town,
              - link "the ancestral home of Wampanoag Tribe," [ref=e276] [cursor=pointer]:
                - /url: https://wampanoagtribe-nsn.gov/wampanoag-history
              - text: was formerly called Gay Head, named by settlers for its brightly colored clay cliffs, before the residents
              - link "voted to restore its original name" [ref=e277] [cursor=pointer]:
                - /url: https://vineyardgazette.com/news/2018/05/17/aquinnah-officially-turns-20-gay-head-name-endures
              - text: in the late 1990s. You can see the kaleidoscopic patterns from the top of the
              - link "Gay Head Lighthouse" [ref=e278] [cursor=pointer]:
                - /url: https://www.gayheadlight.org/
              - text: ", which was built in 1799 (open 10 a.m. to 4 p.m., $6) or from a nearby overlook, where a kiosk shares history about the Aquinnah Wampanoag. Stop by one of the nearby shops, which are all managed by tribal members, like"
              - link "the Gay Head Store" [ref=e279] [cursor=pointer]:
                - /url: https://www.instagram.com/thegayheadstore/
              - text: or
              - link "Aquila MV" [ref=e280] [cursor=pointer]:
                - /url: https://aquilamv.square.site/
              - text: for a refreshment.
          - generic [ref=e281]:
            - generic [ref=e282]: 6 p.m. Slurp oysters on the dock
            - generic [ref=e283]:
              - text: In the heart of the town of Chilmark, in the island’s southwestern corner, is the fishing village of Menemsha, where boats bring in a fresh catch and the United States Coast Guard operates a rescue station. While many of the great island fishing families have largely put down their rods and nets, the Larsen family has for decades owned and operated
              - link "Larsen’s Fish Market" [ref=e284] [cursor=pointer]:
                - /url: https://www.larsensfishmarket.com/
              - text: and
              - link "Menemsha Fish Market" [ref=e285] [cursor=pointer]:
                - /url: https://www.menemshafishmarket.com/
              - text: ", two neighboring places along Dutcher Dock where you can slurp down a dozen oysters (about $34). Try a mix of oysters from both Katama Bay (larger and brinier) and West Tisbury (smaller and sweeter). Parking can be an issue, so the transit authority offers a free shuttle known as the"
              - link "Sunset Bus" [ref=e286] [cursor=pointer]:
                - /url: https://www.vineyardtransit.com/sites/g/files/vyhlif5126/f/uploads/rt_12_is_23_rev.pdf
              - text: between a parking lot up the road and the village.
          - figure "scoop-picture" [ref=e288]:
            - img "A view of a metal tray with cooked lobster, a corn cob, a baked potato and corn bread. A pair of hands are breaking open a piece of the lobster." [ref=e292]
            - generic [ref=e293]: The Homeport
          - generic [ref=e294]:
            - generic [ref=e295]: 7 p.m. Eat a fish dinner by the water
            - generic [ref=e296]:
              - link "The Homeport" [ref=e297] [cursor=pointer]:
                - /url: https://www.thehomeportmv.com/menus/
              - text: "has been a cornerstone of Menemsha’s (small) dining scene since 1930, serving lobster dinners and local catch from a spot overlooking Menemsha Pond and Vineyard Sound. The restaurant, which came into new ownership last year, offers three courses for $79: Smoked bluefish pâté, fried fluke and chips, and a slice of peach pie capture the essence of a Vineyard meal. Chilmark is the last dry town on the island, so be sure to bring your own bottle of rosé ($15 corkage fee). The restaurant also offers complimentary parking. For something a little more low-key,"
              - link "Menemsha Galley" [ref=e298] [cursor=pointer]:
                - /url: https://menemshagalley.com/
              - text: serves burgers ($9), fish sandwiches ($14.50), lobster rolls ($27) and soft-serve ice cream ($6) and has a small deck in the back with a view of fishing shacks.
        - figure "scoop-picture" [ref=e299]:
          - img "Red cliffs seen from across a calm body of water at dusk. The top of a lighthouse peeks from behind the cliffs." [ref=e303]
          - generic [ref=e304]: The town of Aquinnah is home to the Wampanoag Tribe’s ancestral lands. Visitors can see its brightly colored clay cliffs from the top of the Gay Head Lighthouse.
        - generic [ref=e305]: Advertisement
        - generic [ref=e306]:
          - paragraph [ref=e307]: Sunday
          - generic:
            - figure "scoop-picture":
              - generic:
                - generic:
                  - generic:
                    - img "A wooden path leading downhill to a calm beach in the daytime. Two people make their way from the sand towards to wooden path with a dog."
          - generic [ref=e308]:
            - generic [ref=e309]: 8 a.m. Start your day with a swim
            - generic [ref=e310]:
              - text: Many of the Vineyard’s beaches are restricted to town residents with parking and walk-on passes during the summer months; others are privately owned and gated, a system that dates back to
              - link "a 17th-century law" [ref=e311] [cursor=pointer]:
                - /url: https://vineyardgazette.com/news/2012/08/02/peek-past-gate-key-beaches
              - text: intended to encourage property owners to invest in the waterfront. But if you go before 9 a.m. or after 6 p.m., anyone can enjoy the calm waters and white sands of
              - link "Lambert’s Cove Beach" [ref=e312] [cursor=pointer]:
                - /url: https://www.google.com/maps/place/Lambert's+Cove+Beach,+West+Tisbury,+MA+02568/data=!4m2!3m1!1s0x89e5267df9fa005f:0x7b686d2d9f019f9d?sa=X&ved=2ahUKEwiF5cn6veT_AhUqkIkEHZv_CdQQ8gF6BAhXEAA&ved=2ahUKEwiF5cn6veT_AhUqkIkEHZv_CdQQ8gF6BAhiEAE
              - text: in West Tisbury. Walk down the oak-shrouded path, leave your sandals at the base of the dune, and wander through the beach plums to find this protected bay beach along Vineyard Sound. Just make sure to leave by 9 a.m., when parking is enforced.
          - generic [ref=e313]:
            - generic [ref=e314]: 10 a.m. Stroll past the homes of old whaling captains
            - generic [ref=e315]:
              - text: Edgartown was the Vineyard’s first colonial settlement and went on to become a major 19th-century whaling port. Much of that history — and the wealth it generated — is still visible in the town’s Greek Revival and Federal-style homes that have been preserved over the centuries, with the
              - link "Old Whaling Church" [ref=e316] [cursor=pointer]:
                - /url: https://vineyardtrust.org/property/old-whaling-church/
              - text: ", which was built in 1843 and mimics an ancient temple, as the crown jewel. School, South Water and North Water Streets are lined with homes that once belonged to whaling captains, and if you look closely, you’ll see plaques with names of the captains and years the houses were built. After your stroll, pull up a stool at the"
              - link "Dock Street Coffee Shop" [ref=e317] [cursor=pointer]:
                - /url: https://www.facebook.com/DockStreetCoffeeShop/
              - text: ", a single-counter greasy spoon, and recharge with eggs and home fries ($8)."
          - generic:
            - figure "scoop-picture":
              - generic:
                - generic:
                  - generic:
                    - img "A person walks down a shaded retail street in the daytime. In the foreground is a store with a blue awning, a blue door and blue planter boxes."
          - generic [ref=e318]:
            - generic [ref=e319]: 11 a.m. Forget the past, embrace the presents
            - generic [ref=e320]:
              - text: "Edgartown is not just nautical history and immaculately groomed roses and hydrangeas pouring over white fences: There is also plenty of shopping to be done."
              - link "Edgartown Books" [ref=e321] [cursor=pointer]:
                - /url: https://www.edgartownbooks.com/
              - text: has titles from local authors and Pulitzer Prize winners alike, and frequently hosts both for book signings on its front porch. When you walk into
              - link "Salte" [ref=e322] [cursor=pointer]:
                - /url: https://saltemv.com/
              - text: on South Water Street, you might think it’s another want-everything-need-nothing store, but its collection of housewares, local art and sun essentials, with a cool, contemporary design inside a historic building, is the perfect respite on a hot summer day. Down the block, the walls of the
              - link "North Water Gallery" [ref=e323] [cursor=pointer]:
                - /url: https://northwatergallery.com/
              - text: display Vineyard life — rolling hills, golden light and working harbors — at its finest. Their collection includes Ray Ellis, whose work appears in the permanent collection at the White House.
          - generic:
            - figure "scoop-picture":
              - generic:
                - generic:
                  - generic:
                    - img "A close up view of colorful flower bouquets."
          - generic [ref=e324]:
            - generic [ref=e325]: 1 p.m. Lunch on the farm
            - generic [ref=e326]:
              - link "Morning Glory Farm" [ref=e327] [cursor=pointer]:
                - /url: https://morninggloryfarm.com/
              - text: ", a five-minute drive from Edgartown, began selling vegetables out of a shed nearly 50 years ago. In the decades since, the Athearn family has transformed it into a market overflowing with island-grown vegetables and flowers, baked goods and prepared foods. The farm stand also sells island-made goods like the award-winning"
              - link "Prufrock cheese" [ref=e328] [cursor=pointer]:
                - /url: https://www.nytimes.com/2022/01/10/dining/grey-barn-prufrock-cheese-marthas-vineyard.html?utm_source=nytimes
              - text: ", a washed-rind variety from"
              - link "the Grey Barn" [ref=e329] [cursor=pointer]:
                - /url: https://www.thegreybarnandfarm.com/
              - text: ; yogurt from
              - link "Mermaid Farm and Dairy" [ref=e330] [cursor=pointer]:
                - /url: https://www.facebook.com/people/Mermaid-Farm-and-Dairy/100064671104717/
              - text: ; and
              - link "local" [ref=e331] [cursor=pointer]:
                - /url: https://marthasvineyardseasalt.com/
              - link "sea salts" [ref=e332] [cursor=pointer]:
                - /url: https://www.bytheseasalt.com/
              - text: . As one of the largest farms on the island, with more than 250 acres of total farmland, Morning Glory offers a salad bar that is constantly updated with seasonal vegetables ($12.95 a pound). There is also a food truck out back that has BLTs ($12), farm salads ($12) and burgers ($12). You can enjoy your lunch on picnic tables outside the stand or on a rocking chair on the back porch.
