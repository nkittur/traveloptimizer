            - generic [ref=e90]: June 29, 2023
            - generic [ref=e91]: Remy Tumin is a breaking news reporter for The New York Times. She was previously a reporter for The Vineyard Gazette, based on Martha’s Vineyard, and travels to the island frequently.
          - paragraph [ref=e92]:
            - text: Step off the ferry and inhale that salt air deeply — that is a feeling that has called visitors back to this island off the coast of southeastern Massachusetts year after year. The Vineyard, with a
            - link "history" [ref=e93] [cursor=pointer]:
              - /url: https://www.bostonmagazine.com/news/2016/07/31/clintons-obamas-marthas-vineyard/
            - text: of
            - link "presidential" [ref=e94] [cursor=pointer]:
              - /url: https://www.nytimes.com/1997/08/24/us/on-martha-s-vineyard-news-is-relative.html
            - link "visitors" [ref=e95] [cursor=pointer]:
              - /url: https://www.nytimes.com/2016/08/07/us/politics/obama-arrives-in-marthas-vineyard-for-two-week-vacation.html
            - text: ", has a reputation as a"
            - link "respite" [ref=e96] [cursor=pointer]:
              - /url: https://mvmagazine.com/news/2021/02/24/and-house-jackie-built
            - text: for the elite, a narrative that prompted Gov. Ron DeSantis of Florida to
            - link "send two planeloads of migrants" [ref=e97] [cursor=pointer]:
              - /url: https://www.nytimes.com/2022/09/14/us/desantis-florida-migrants-marthas-vineyard.html
            - text: there without warning last fall, throwing the island in the national spotlight once again. In spite of the stereotypes, the Vineyard’s many cultures — African American, Brazilian, Jamaican and islanders that go back dozens of generations or far more, including Native Americans — have come to redefine this longtime summer destination as a place of community and joy.
