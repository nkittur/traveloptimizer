            - generic [ref=e232]:
              - text: Occupying an Arts and Crafts-inspired former McGill University building just north of downtown, the
              - link "McCord Stewart Museum" [ref=e233] [cursor=pointer]:
                - /url: https://www.musee-mccord-stewart.ca/en/
              - text: (20 dollars) specializes in the history of Montreal. The permanent “
              - link "Indigenous Voices of Today" [ref=e234] [cursor=pointer]:
                - /url: https://www.musee-mccord-stewart.ca/en/exhibitions/indigenous-voices-of-today/
              - text: ” exhibition spotlights about 100 objects — including snowshoes, knives, beaded bags and an extraordinary parka made of waterproof, breathable animal intestinal membranes — from 11 nations in Quebec, letting individual members of those nations explain the items’ significance through plaques and videos. One section of the exhibition focuses on the devastating impact that Canada’s residential school system had on Indigenous communities,
              - link "a dark chapter" [ref=e235] [cursor=pointer]:
                - /url: https://www.nytimes.com/2023/01/21/canada-indigenous-settlement.html
              - text: the country is still wrestling to understand. On the museum’s top floor, see the Canadian artist
              - link "James Duncan" [ref=e236] [cursor=pointer]:
                - /url: https://www.gallery.ca/collection/artist/james-duncan
              - text: ’s panoramic, autumnal watercolors of 19th-century Montreal. Many were painted from the top of Mont-Royal, looking down toward the St. Lawrence River, showing fields and bucolic copper and golden groves where gleaming skyscrapers now stand.
