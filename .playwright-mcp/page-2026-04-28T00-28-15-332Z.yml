              - text: ", a kind of Grey Gardens for the vintage set, with its mannequins, creaky wooden floors and shelves groaning with sometimes creepy dolls and well-worn books. Then grab a pick-me-up at"
              - link "Dispatch Coffee" [ref=e261] [cursor=pointer]:
