            - generic [ref=e238]: 11:30 a.m. Head to the top
            - generic [ref=e239]:
              - text: Now, it’s time to see for yourself how those views from the top of Mont-Royal have changed. Climb the steps at the top of Rue Peel to the summit of what locals call the Mountain, taking in the surroundings of a park designed by Frederick Law Olmsted along a trail named for him. At the
              - link "Kondiaronk Belvedere" [ref=e240] [cursor=pointer]:
                - /url: https://montreal.ca/en/places/kondiaronk-lookout
              - text: ", a spacious stone plaza at the top, you’re likely to see a wide variety of activities, possibly even juggling and unicycle riding (remember that Montreal is the headquarters of"
              - link "Cirque du Soleil" [ref=e241] [cursor=pointer]:
                - /url: https://www.cirquedusoleil.com/
              - text: ). Compare the graceful, new cable-stayed
              - link "Samuel de Champlain Bridge" [ref=e242] [cursor=pointer]:
                - /url: https://www.arup.com/projects/samuel-de-champlain-bridge
              - text: ", opened in 2019, with the nearby"
              - link "Victoria Bridge" [ref=e243] [cursor=pointer]:
                - /url: https://csce.ca/en/historic-site/victoria-bridge/
              - text: ", a former railroad crossing (it now carries cars, too) that was hailed as the “eighth wonder of the world” when its first wrought-iron incarnation officially opened in 1860."
          - generic [ref=e244]:
            - generic [ref=e245]: 1:30 p.m. Ride to an old-school deli
            - generic [ref=e246]:
              - text: No visit to Montreal is complete without a pile of smoked meat — a savory, peppery cross between pastrami and corned beef that appears in poutines and on pizzas as well as in overflowing sandwiches that are the trademark of Montreal’s Jewish delis. While many visitors line up at the historic Schwartz’s Deli, one of the oldest in Canada, the 77-year-old
              - link "Snowdon Deli" [ref=e247] [cursor=pointer]:
                - /url: http://www.snowdondeli.com/en/
              - text: is a little harder to get to, but worth the effort. Take the Metro to the Snowdon stop, or ride a Bixi bike along a dedicated cycling lane on the Chemin de la Côte-St.-Antoine, which passes through
              - link "Westmount" [ref=e248] [cursor=pointer]:
                - /url: https://westmount.org/en/
              - text: ", one of Canada’s wealthiest enclaves. Grab a spacious booth at the deli and enjoy a smoked-meat sandwich (medium fat) with a smear of yellow mustard on pillowy light rye, a"
              - link "Cott black cherry soda" [ref=e249] [cursor=pointer]:
                - /url: https://www.thejewishstar.com/stories/cott-black-cherry-a-montreal-deli-experience,19626
              - text: and a plateful of sharp, sour pickles (21 dollars total).
