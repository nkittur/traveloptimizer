            - generic [ref=e88]: Photographs by Clara Lacasse
            - generic [ref=e89]: Oct. 12, 2023
            - generic [ref=e90]: Danial Adkison, an editor for New York Times Travel, has visited Montreal nearly a dozen times since 2004.
          - paragraph [ref=e91]: "“Bonjour hi,” the ubiquitous greeting servers and shopkeepers use to figure out whether you prefer French or English, encapsulates so much about Montreal, which like its province, Quebec, retains a strong French Canadian identity. In this 381-year-old city of 1.78 million, which Mark Twain once described as a place “where you couldn’t throw a brick without breaking a church window,” one of Canada’s most vibrant L.G.B.T.Q. scenes thrives, and communities formed by Jewish, African, Asian, Italian, Portuguese and Haitian immigrants all offer something special to see (and taste). The city is on an upswing: Modern apartment buildings, cafes and bike paths are popping up in formerly industrial Griffintown, while the Plateau and Mile End areas offer art and music worthy of the place that nurtured Arcade Fire and Leonard Cohen. There is too much for just 36 hours, but if you bring some good walking shoes, you’ll find terrific meals, stunning views atop Mont-Royal and a creative spirit that comes across in any language."
