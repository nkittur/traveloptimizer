            - img "Two young people sit at a bar on red and black stools. Behind the bar are lit-up shelves of bar glasses and bottles of alcohol. The shelves are backed with mirrors that have been sprayed here and there with gold paint. Overhead are three old-fashioned mismatched light fixtures, each with white glass shades." [ref=e275]
            - generic [ref=e276]: Dieu du Ciel
          - generic [ref=e277]:
            - generic [ref=e278]: 10 p.m. Raise a glass to the upstarts
            - generic [ref=e279]:
              - text: The giant Molson brewery once dominated Montreal’s riverfront in the same way that its commercial brews dominated menus around the city. But in the last decade, microbreweries have exploded onto the scene, many now sharing Mile End with the pioneer
              - link "Dieu du Ciel" [ref=e280] [cursor=pointer]:
                - /url: https://dieuduciel.com/en/
              - text: (which turned 25 in September).
              - link "HELM" [ref=e281] [cursor=pointer]:
                - /url: https://www.helmmicrobrasserie.ca/?lang=en
              - text: ", one of these upstarts, has a particularly enticing offering of rotating brews in a welcoming space with slate floors, a U-shaped bar and a ceiling draped in dangling vines. The name HELM stands for houblon, eau, levure and malt (hops, water, yeast and malt), the main ingredients of what you’re about to drink, and they take their craft seriously with house-brewed stouts, bitters and I.P.A.s (draft pints, 7 dollars)."
        - figure "scoop-picture" [ref=e282]:
          - img "The cavernous, ornate interior of a mid-19th-century basilica has towering arches and columns and a shadowy interior illuminated here and there by light seeping through stained-glass windows. Rows of wooden pews fill the room." [ref=e286]
          - generic [ref=e287]: The mid-19th-century St. Patrick’s Basilica in downtown Montreal was built to serve the city’s growing Irish community.
        - generic [ref=e288]: Advertisement
        - generic [ref=e289]:
          - paragraph [ref=e290]: Sunday
          - figure "scoop-picture" [ref=e292]:
            - img "A large geodesic dome, its rounded surface a latticework of steel, rises above a leafy parklike area. The dome appears to be basically transparent. Inside the sphere is an industrial-looking structure, which is actually a museum devoted to the environment." [ref=e296]
            - generic [ref=e297]: The Biosphère
          - generic [ref=e298]:
            - generic [ref=e299]: 9 a.m. No place like dome
            - generic [ref=e300]:
              - text: The lasting impression of Expo 67 is most visible on the islands of
              - link "Parc Jean-Drapeau" [ref=e301] [cursor=pointer]:
                - /url: https://www.parcjeandrapeau.com/en/
              - text: ", the site of many of the exhibitions. The former United States pavilion, with a huge Buckminster Fuller-designed geodesic dome — it inspired the one at Disney’s Epcot Center — is now the"
              - link "Biosphère" [ref=e302] [cursor=pointer]:
                - /url: https://espacepourlavie.ca/en/biosphere
              - text: ", a museum occupying a graceful glassy building perched on tall stilts in the center of the dome. (The acrylic panels of the dome burned in"
              - link "a 1976 fire" [ref=e303] [cursor=pointer]:
                - /url: https://www.youtube.com/watch?v=ev2cFpP90uE
              - text: ", leaving just the steel structure.) Besides being breathtakingly beautiful, the museum offers interactive exhibitions, most of them kid-friendly, about environmental issues and climate change (adults, 22.75 dollars; 17 and under, 11.50 dollars). While you’re on the island, be sure to check out “Trois Disques,” a"
              - link "70-foot-tall stainless steel sculpture" [ref=e304] [cursor=pointer]:
                - /url: https://www.parcjeandrapeau.com/en/public-art/trois-disques-homme-calder/
              - text: that the artist Alexander Calder created in 1967 for the World’s Fair.
          - generic [ref=e305]:
            - generic [ref=e306]: 10 a.m. Ride along the river
            - generic [ref=e307]:
              - text: Contrast Modern architecture with the industrial past by riding a Bixi bike from Parc Jean-Drapeau across the
              - link "Concordia Bridge" [ref=e308] [cursor=pointer]:
                - /url: https://expolounge.blogspot.com/2008/08/expo-bridges-concordia-bridge-and-pont.html
              - text: toward downtown. Watch for the Jenga-like lines of Habitat 67, the Brutalist apartment complex designed by the architect Moshe Safdie. The path leads around the Five Roses flour mill, whose flashing sign is as beloved by Montrealers as the Citgo sign is by Bostonians. Montreal’s location near the eastern end of the Great Lakes helped make it the
              - link "largest grain port in North America" [ref=e309] [cursor=pointer]:
                - /url: https://www.port-montreal.com/en/the-port-of-montreal/about-the-port/the-port-of-montreal-through-history/timeline
              - text: in the 1920s, a legacy you can see in the steamship-like form of
              - link "Silo No. 5" [ref=e310] [cursor=pointer]:
                - /url: https://memento.heritagemontreal.org/en/site/silo-no-5/
              - text: ", a hulking grain elevator that has stood empty since the mid-1990s. The path follows the Lachine Canal through Griffintown, a mushrooming cluster of glassy new buildings, where you can stop for a hand-rolled bagel with cream cheese (3.50 dollars) at"
              - link "Le Trou" [ref=e311] [cursor=pointer]:
                - /url: https://www.letrou.ca/
              - text: ", a tiny cafe with its own oven."
          - generic:
            - figure "scoop-picture":
              - generic:
                - generic:
                  - generic:
                    - img "At the edge of a parklike promontory covered in fall foliage that juts into an urban canal is a spa housed in what was once a river ferry, now painted black. In the background is a long, industrial-looking building. More buildings rise in the background."
          - generic [ref=e312]:
            - generic [ref=e313]: 11 a.m. Get a massage on the water
            - generic [ref=e314]:
              - text: Listen for the sound of the water flowing over the canal locks. It will be your soundtrack to relaxation at
              - link "Bota Bota" [ref=e315] [cursor=pointer]:
                - /url: https://botabota.ca/en/
              - text: ", a luxurious spa that began aboard an old ferry boat docked near the Old Port and has expanded to include a nearby land-based garden with a complex of pools. The boat offers hot tubs, cold plunges, steam rooms, dry saunas and massages in a silent environment (signs reminding you not to talk are everywhere). Across a footbridge, in the garden (you can talk there), you’ll find pools ranging from hot to cold, one with a waterfall to massage your shoulders (three-hour “water circuit” 60 to 90 dollars, depending on the season and time)."
