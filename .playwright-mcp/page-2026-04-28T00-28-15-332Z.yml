            - generic [ref=e197]: 8 p.m. Dine in a desanctified church
            - generic [ref=e198]:
              - text: Montreal is teeming with steeples and spires, though Mass attendance in Quebec has
              - link "dwindled" [ref=e199] [cursor=pointer]:
                - /url: https://www.nytimes.com/2018/07/30/world/canada/quebec-churches.html
              - text: . Many churches have found new life as community spaces and restaurants, including the desanctified
              - link "St. Joseph’s Church" [ref=e200] [cursor=pointer]:
                - /url: https://montreal.eater.com/2015/12/11/9890292/candide-john-winter-russell-little-burgundy-photos#0
              - text: ", built in 1861, in the Petite-Bourgogne neighborhood. If the facade impresses you, wait until you walk around to"
              - link "Candide" [ref=e201] [cursor=pointer]:
                - /url: https://www.restaurantcandide.com/
              - text: ", in the former rectory. Sit at the bar and the industrious, mostly young kitchen staff will happily explain the prix-fixe-only menu, which changes monthly. Fresh, Quebec-produced ingredients shine in dishes like a kohlrabi, bean and yogurt salad, a riot of crisp and creamy textures. The presentation is as fun as it is delicious: For one dessert choice,"
              - link "Le Frère Chasseur" [ref=e202] [cursor=pointer]:
                - /url: https://fromagesduquebec.qc.ca/en/cheeses/cow-milk/au-gre-des-champs/frere-chasseur-le
              - text: cheese, shaved thin on a rotary curler, arrives looking like buttery flower petals (78 Canadian dollars, or about $58, per person).
          - generic [ref=e203]:
            - generic [ref=e204]: 10 p.m. Feel the love in the Gay Village
            - generic [ref=e205]:
              - text: The signs along the Rue Ste.-Catherine, the main axis of the Gay Village, declare, “Quartier Inclusif,” a reminder that Montreal takes inclusion seriously. The street, closed to cars through the Village most of the summer and early fall, becomes a runway on Friday and Saturday nights, when all parts — all ages, too — of the L.G.B.T.Q. spectrum gather at bars and clubs to sing karaoke, dance and show off their fiercest looks. Leather is welcome at the cozy
              - link "Aigle Noir" [ref=e206] [cursor=pointer]:
                - /url: https://www.facebook.com/Bar.Aigle.Noir/
              - text: ", or Black Eagle, bar, but you won’t need to be wearing any to have a good time. Over a pint of beer (6.75 dollars), you might strike up a conversation with a friendly Montrealer. If the weather is nice, finish your night at the multifloor"
              - link "Complexe Sky" [ref=e207] [cursor=pointer]:
                - /url: https://www.instagram.com/explore/locations/257726544329654/complexe-sky/?hl=en
              - text: nightclub, with a cocktail at the rooftop bar (free entry to the bar, 8 dollars for the club).
