              - text: ", which are bursting with charming midcentury modern pieces, old globes, pendant lamps and almost any other home decoration you can imagine. Looking for a zebra-striped armchair? La Pompadour may have just the piece (975 dollars)."
          - generic [ref=e265]:
            - generic [ref=e266]: 6:30 p.m. Feast on creativity
            - generic [ref=e267]:
              - text: Boulevard St.-Laurent eventually leads all the way to Mile End, the locus of Montreal’s creative class, northeast of downtown and Parc du Mont-Royal. The neighborhood, which was once a blue-collar hub of Montreal’s Jewish community, now abounds in bars, clubs and restaurants like
              - link "Le Butterblume" [ref=e268] [cursor=pointer]:
                - /url: http://www.lebutterblume.com/
              - text: ", a solid choice for dinner with a menu that includes pork schnitzel with a breading of panko and pumpkin and sunflower seeds with jalapeño mayonnaise, cherry tomatoes, corn and marinated mushrooms (26 dollars). Keep the good times going with a cocktail and a slightly ironic game of table tennis at the"
              - link "Ping Pong Club" [ref=e269] [cursor=pointer]:
                - /url: https://www.pingpongclub.ca/
              - text: ", a comfy and convivial bar, nearby (free entry)."
