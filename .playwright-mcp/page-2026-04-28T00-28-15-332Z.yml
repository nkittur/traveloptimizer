              - text: offers an orange-tree-decorated oasis with an outdoor garden. It’s a relaxing hideaway for people-watching while sipping big cups of coffee. Try an everything bagel made by St.-Viateur, a classic purveyor of the big-holed Montreal variety, loaded with guacamole, feta and a sunny-side-up egg (23.75 dollars). After breakfast, check out the
              - link "Hôtel Le Germain" [ref=e228] [cursor=pointer]:
                - /url: https://www.germainhotels.com/en/le-germain-hotel/montreal
              - text: next door — its concrete facade painted since 2021 with a kaleidoscopic mural called
              - link "“Dazzle My Heart" [ref=e229] [cursor=pointer]:
                - /url: https://www.germainhotels.com/en/blog/a-dazzling-mural-at-le-germain-hotel-montreal
              - text: .” The hotel, which emerged from a major renovation in early 2020, occupies the Modernist former headquarters of a professional organization for engineers that was built in 1967, when the World’s Fair, also called Expo 67, transformed much of Montreal’s skyline.
