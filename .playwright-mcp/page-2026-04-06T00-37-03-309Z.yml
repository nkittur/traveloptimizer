              - paragraph [ref=e197]: Nómada brings a bright addition to Carlsbad’s flourishing dining scene. The personal menu highlights chef Alex Carballo’s Sinaloense heritage and adventures in Mexico with live fire cooking, along with an emphasis on local seafood, seen in dishes such as charred octopus and wood-fired oysters. The raw bar’s supple tortillas get made on site; a duck mole taco trio will satisfy the table. Ask staff to chat about the cocktails like the Ranchero Paloma with fresh twists like cinnamon and traditional ingredients, or the non-alcoholic chicha morada from Peru.
