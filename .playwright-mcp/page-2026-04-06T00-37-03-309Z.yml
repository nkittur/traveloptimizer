                - paragraph [ref=e311]: "A new Mira Mesa phở destination from industry veterans has emerged just in time for soup season. At takeout pop-up Phở Gà Go, find Saturday, Sunday, and Monday pickups for steaming bowls of phở gà with diners’ choice of bowl styles: one with a wing and breast, one with leg and thigh, and a whole chicken version. Starters like crispy chả giò packed with pork, shrimp, taro, and wood ear mushroom; gỏi gà xé phai, a shredded chicken salad; and Vietnamese coffee drinks complete the picture. Pickups happen at Crab Hut Mira Mesa."
