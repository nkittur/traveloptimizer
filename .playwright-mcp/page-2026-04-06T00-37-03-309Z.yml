                - text: in La Jolla. Along with co-owner Edgar Machuca, the team wanted to branch out from East County. “I like to add different touches to the sushi rolls and crudo,” Ibarra told Eater. The restaurant serves sashimi, rolls, nigiri, octopus made with aji Amarillo and crispy garlic, and salmon mango tradito, comprising of sashimi slices on thin avocado slices nested in a tangy tropical puree.
