                - paragraph [ref=e384]: La Jolla’s blossoming restaurant scene continues to grow with the arrival of Fleurette, a dinner destination with a French- and Italian-leaning menu; San Diego hotspot Callie is its sister restaurant. Here, find “ham and cheese” gougères, duck liver and bone marrow paté, risotto al pistou, and golden roasted chicken with black truffle–infused jus. Sides like crispy panisse and desserts such as chocolate and hazelnut mille-feuille round out the menu, which feels even more transportive than it needs to be.
