                    - /url: https://hongdaedak.com/en/
                  - text: ", just landed in the Convoy District. Since 1996, Shin Mi Kyung Hongdae Dakgalbi has been slinging stir-fried chicken in a secret sauce at its Hongdae location in Seoul. Taking over the former Nice 2 You Chuan Chuan Hot Pot space, the restaurant specializes in signature spicy chicken blanketed in mozzarella and cheddar cheese fondue, cooked on a cast-iron grill in the center of the table. Servers assist in preparing the family-style meals. Finish off with a fried rice order to soak up all the flavors. For the best value, go for the set menus for two to four people."
