                  - text: debuted in March 2026. An open kitchen, outdoor patio space adjacent to a pool, and an expansive dining area are part of the facelift. The all-day Italian restaurant highlights dishes from Italy’s central Tuscan region. Grilled Mediterranean octopus, wood-fired pizzas, wood-fired focaccia with fennel pollen dip, and pastas made in house feature on the menu, as well as cocktails and a thoughtfully curated wine list.
