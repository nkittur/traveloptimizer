                - paragraph [ref=e250]: Skateboarding legend Tony Hawk opened his long-awaited Chick & Hawk restaurant in Encinitas. Here, diners can pore over behemoth fried chicken or fish sandwiches with craggy, golden exteriors; robust salad bowls; truffle hot sauce-spiked duck fat frites; maitake bo ssam; and a full slate of inventive cocktails. The punchily decorated space makes this a good place to come in and linger with friends or family; skaters, in particular, will get a kick out of the nostalgic memorabilia illustrating Hawk’s iconic career.
