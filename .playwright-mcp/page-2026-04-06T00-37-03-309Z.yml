                - paragraph [ref=e486]:
                  - text: After being closed for nearly a decade, Asian fusion restaurant
                  - link "Roppongi Restaurant and Lounge" [ref=e487] [cursor=pointer]:
                    - /url: https://roppongiusa.net/
                  - text: has reopened in La Jolla. Originally opened in 1998, the iconic restaurant was a popular hot spot for nearly 20 years. When the landlord didn’t renew the lease in 2015, leading to the restaurant’s closure, the hospitality group retained its headquarters on site. In 2025, Roppongi reached an agreement with the landlord to reopen. The well-worn space has been updated with a gold-brushed wall, Milanese ceiling sculptures, and Buddhist statues. Favorite dishes from the original menu, such as the Polynesian crab stack, hamachi crudo tacos, and Roppongi Roll (shrimp tempura and unagi), return alongside new items like lobster dumplings and wok-fired dishes. A daily happy hour with half-price food items runs from 2 p.m. to 5 p.m.
