                - text: Located on bustling Prospect Street in La Jolla,
                - link "La Jollita" [ref=e450] [cursor=pointer]:
                  - /url: https://jollita.com/
                - text: is the first U.S. restaurant from Alejandro Angulo, a second-generation restaurateur whose family launched the
                - link "Los Arcos Restaurant Group" [ref=e451] [cursor=pointer]:
                  - /url: https://en.restaurantlosarcos.com/
                - text: "in Mexico in 1977. Settle in at a patio table for the best perch for people watching: The open-air dining room and expansive bar decorated like street-taco stands adds to the lively atmosphere. Dressed up in tropical colors, the restaurant showcases coastal Mexican cuisine with a menu that spans tacos gobernador, zarandeado-style shrimp, ceviche, mezcal-flamed filet mignon, margaritas, and aqua frescas, like pineapple and mint."
