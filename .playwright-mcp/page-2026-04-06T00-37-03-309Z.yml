              - paragraph [ref=e512]: Rip-and-dip bagel specialist PopUp Bagels has landed on Pearl Street in La Jolla. Here, customers are encouraged to pick up piping-hot bagels in sets of three, six, or 12, and dunk them into tubs of spread, including original cream cheese, herbaceous scallion cream cheese, and nutty vegan cream cheese. The company, which first achieved viral success on the East Coast, plans to open 10 locations in San Diego over the next few years.
