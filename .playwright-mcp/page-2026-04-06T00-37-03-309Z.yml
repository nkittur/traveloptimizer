                - text: is the first San Diego location for the Los Angeles–based restaurant brand. The space spans two floors of dining rooms, warmly lit bars on both floors, an outdoor dining terrace, and a balcony filled with intimate tables, overlooking the streets. Executive chef Lior Hillel worked at Jean-Georges in New York City and serves a broadly Mediterranean menu featuring dishes such as Moroccan cigars; spiced lamb shakshuka pizza; and malabi, a rosewater and pistachio custard. Be sure to order a selection from the extensive wine list or a cocktail such as the Love Letter, made with honeyed whiskey, passionfruit, and toasted marshmallow.
