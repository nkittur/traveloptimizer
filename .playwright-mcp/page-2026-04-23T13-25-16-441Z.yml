              - generic [ref=e2725]: Dinner at Darkroom is an invitation to leap into another dimension by way of a dimly lighted restaurant in a Santa Ana industrial complex. Chef-owner Zach Scherer crafts a menu that zigzags among Asian, Mediterranean and Latin influences, and it will likely change with each visit. Dinner may include calamari over braised cabbage cooked like sweet and slack caramelized onions. Or a Nashville swordfish brushed with a smoky, musty sauce of Calabrian chiles, red wine vinegar, butter and cayenne pepper. A slab of zucchini bread is presented as a riff on both Spanish torrijas and jambon au beurre, seared in a cast-iron skillet with copious amounts of koji butter and ribbons of Spanish ham over the top. Scherer and chef-partner Drew Adams also offer an eight-course tasting menu Thursday through Saturday evenings. Regardless of the format, it’s unlikely you’ll find a similar dinner experience in Orange County, and possibly elsewhere in the universe. BarBeverage director Gianna Marcario is a drinks whiz behind the bar, with small-batch infused vermouth highlighted in many of the low ABV cocktails. If you’re experiencing menu fatigue with the same gem lettuce salad and crudo at every other place in town, Darkroom is the answer.
