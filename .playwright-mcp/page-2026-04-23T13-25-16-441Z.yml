                  - text: Halfway through the decade, I’m already certain we’ll look back over the 2020s and cite Anajak as one of the feel-good triumphs of the era. Second-generation owner Justin Pichetrungsi left a thriving career as an art director at Walt Disney Imagineering to take over leadership of the Sherman Oaks restaurant founded by his parents, Ricky and Rattikorn, in 1981. Justin uses Ricky’s recipes, merging his Thai upbringing and Cantonese heritage, as a blueprint, resketching sauces for river prawns and soft-shell crabs and barbecued pork collars to his own definitions. More vegetables populate the menu, without crowding out favorites like wok-smoky noodles supreme and the balanced earthy sweetness of Massaman beef with sweet potatoes. His Thai Taco Tuesday phenomenon, where fish tacos lit up by chili crisp and limey nam jim crisscross with wok-fragrant drunken noodles and Dungeness crab fried rice, galvanized the community when it was held outdoors during the pandemic, and its magnetism continues. He occasionally hosts omakases driven by the question, “What if this ritualized format had been codified in Thailand rather than Japan?” And his
                  - link "exuberance for wine" [ref=e5936] [cursor=pointer]:
                    - /url: https://www.latimes.com/food/story/2023-05-26/anajak-thai-wine-list-los-angeles
                  - text: literally spilled into the dining room, filling a long central console and every other free nook. A swift, handsome renovation this summer produced kitchen upgrades, a more open flow and a new second dining area featuring art by Justin’s grandfather. Wine director Ian Krupp has more storage space, too, but the bottle overflow can still cut into diners’ elbow room. It’s hard now to imagine the scene any other way.
