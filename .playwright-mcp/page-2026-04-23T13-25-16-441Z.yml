            - generic [ref=e4091]:
              - generic [ref=e4092]: "The sun-drenched all-day restaurant in downtown Long Beach, run by chef Dima Habibeh and her family, has grown impressively in dimensions and ambitions since its 2018 opening. Habibeh — born to a Palestinian father and a Syrian mother and raised in Jordan — poignantly evinces her origins in her cooking. Shakshouka, its lacy poached eggs nearly submerged in fragrant tomato stew, arrives with sourdough toast from nearby star bakery Gusto Bread for sopping. Solo diners will be happy at the plant-draped bar, rapt by garlic-lemon rotisserie chicken at lunch or sea bass over spiced rice with caramelized onions and nuts at dinner, with perhaps a glass of white wine from Lebanon’s Bekka Valley. Even better is gathering a crowd for a spread that begins with too much mezze: hummus with pine nuts, yielding grape leaves, labneh dyed fuchsia from pureed beets, fried kibbeh stuffed with ground beef or spinach, fattoush sharpened with sumac, a mix of the savory hand pies called fatayer. Saucy moussaka or a platter of kebabs might arrive next, followed by crunchy-cheesy knafeh scented with orange blossom syrup and date cake baked by Habibeh’s daughter Masah. There is no more gracious setting for consummate Levantine cooking in Southern California."
