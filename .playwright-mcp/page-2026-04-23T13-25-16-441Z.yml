              - generic [ref=e4371]: Okay Inak’s cooking career has included fine-dining temples on both coasts — Eleven Madison Park and Per Se in Manhattan, Mélisse in Santa Monica — but his first solo restaurant resides at the edge of downtown’s Fashion District on a fairly desolate, well-lighted block with plenty of parking. Step inside the tiny dining room facing the open kitchen and you’ll feel Turkish ground beneath your feet. Among intricately dressed salads and elegant kebabs, look for two dishes that define Inak’s worldview. The first is kitel, a large oval dumpling filled with spiced beef and set over thickened yogurt with drizzles of dill-scented herb oil, butter sparked with Aleppo pepper and a finishing tablespoon of meat sauce intensified with chile oil. Next is corti taplamasi, a cloudy, red-orange soup made from cabbage fermented for three weeks. The small, soft, hand-rolled balls knocking around in the broth? Leftover bulgur dough from making kitel. These are regional Turkish dishes you can’t find anywhere else in Los Angeles, by a chef who also has a modernist knack and a roaming imagination. His command extends to dessert. In Sora’s first year, he has served a variation on his father’s specialty called kirecte kabak, soaking chunks of butternut squash in limewater overnight so that, when cooked, their exterior retains a thin, crackling shell while the inside melts to cream. Sweetened with simple syrup, splattered with tahini and flecked with crushed pistachios, it was delicious and a little otherworldly.
