          - img [ref=e104]
          - paragraph [ref=e105]: The 101 Best Restaurants in Los Angeles, now in its 13th edition, is a guide to excellence but also an annual cultural snapshot. Names of familiar taquerias or fine-dining temples may appear, but the worlds in and around them are always changing.
          - paragraph [ref=e106]:
            - text: Food columnist Jenn Harris joins me for the second year as co-author. Her hometown camaraderie was essential after I spent months journeying the state to write The Times’ inaugural
            - link "101 Best Restaurants in California" [ref=e107] [cursor=pointer]:
              - /url: https://www.latimes.com/food/list/best-restaurants-california-guide
            - text: ", published in June."
          - paragraph [ref=e108]: We can all use more fellowship right now. In an already challenging decade for Los Angeles, the fires and immigration raids we witnessed in 2025 stretched the imagination in their horrors. Every major calamity affects the restaurant industry, deepening uncertainty and triggering closures. Yet Jenn and I noticed something specific over weeks and weeks of recent dining. Some restaurants understandably buckled down and stayed their creative courses. At others, though, chefs inspiringly leaned in, tapping into higher realms of inventiveness or joyful quirkiness. In those places, creativity felt like an act of resistance. It helped us, and no doubt other diners, feel hopeful.
          - generic [ref=e111]:
            - link "7 new favorite places to grab a drink in Los Angeles" [ref=e113] [cursor=pointer]:
              - /url: https://www.latimes.com/food/list/best-los-angeles-bars-cafes-cocktails-coffee-matcha
              - 'img "Collaged cocktail images: various colorful drinks" [ref=e115]'
            - generic [ref=e116]:
              - generic [ref=e117]:
                - paragraph [ref=e118]:
                  - link "Food" [ref=e119] [cursor=pointer]:
                    - /url: https://www.latimes.com/food
                - heading "7 new favorite places to grab a drink in Los Angeles" [level=3] [ref=e120]:
                  - link "7 new favorite places to grab a drink in Los Angeles" [ref=e121] [cursor=pointer]:
                    - /url: https://www.latimes.com/food/list/best-los-angeles-bars-cafes-cocktails-coffee-matcha
              - time [ref=e122]: Dec. 9, 2025
          - paragraph [ref=e123]: "In that spirit, we’ve included 31 fresh entrants this year. Among them: a charismatic supper club in South-Central Los Angeles where live jazz plays nightly; a hidden downtown restaurant serving singular Turkish dishes; a weekend taco stand with one of the city’s most distinct regional Mexican salsas (hint: there’s mustard); new neighborhood mainstays in Montrose, Westchester and Hermosa Beach; and a 10-seat counter in Little Tokyo pushing the definitions of modern Korean cooking."
          - paragraph [ref=e124]: The newcomer to the No. 1 ranking is an icon that synthesizes community values and notions of deliciousness so vital right now.
          - paragraph [ref=e125]: A single inductee ascends to the Hall of Fame this year. If you’ve been dining out in L.A. over the past dozen years, you know its name. We also highlight seven new favorite drinking destinations — mostly bars and restaurants that lead a recent next-level cocktail boom, but also two standout options for coffee and Japanese tea (yes, matcha, but much more too).
          - paragraph [ref=e126]: Our celebration, amid difficulties, also affirms the city’s tenacity. We want the guide to be useful. Enjoy debating our choices. What’s the 102nd best restaurant? It’s your favorite we left off. Maybe head there this week, or book it for an approaching special occasion. I imagine the staff will be really happy to see you.
          - paragraph [ref=e127]: — Bill Addison
