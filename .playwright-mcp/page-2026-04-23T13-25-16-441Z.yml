            - generic [ref=e1107]:
              - generic [ref=e1108]: "The primary draw at Tun Lahmajo, a restaurant in Burbank lined with grainy woods to resemble a summer cabin, is right there in the name. A mottled, golden-edged lahmajo lands on nearly every table — or maybe three or four of them, for every person in a group. Cooks here stretch the flatbread nearly as thin as a water cracker, though the flavor has far more char and tang. A silky-rough mixture of seasoned beef and tomato paste is smeared right to the brim, which often handsomely buckles in the heat of baking. This signature, consistent and excellent, has already been embraced by L.A.’s Armenian community. Keep scanning the menu, though. Very few local places delve so deeply into the regionally specific Armenian repertoire. Among khashlama, a category of brothy stews, the generously sized fish version is a particular joy, brought out in a pot with hunks of trout (watch for bones), peeled potatoes and whole peppers, and heaped with dill, parsley and other feathery herbs. Aveolouk (greens with walnut and pomegranate) and strained yogurt, mulchy with herbs, make for substantial sides. Circling back to breads: I prefer the lahmajo plain, and for hedonism order the puffed Megrelakan khachapuri rich in eggs, butter and grated sulguni cheese. Servers carry it wobbling through the dining room, deflating like a souffle. As the speckled pie cools and its ingredients settle and condense, an appealing salty-sharpness becomes more overt."
