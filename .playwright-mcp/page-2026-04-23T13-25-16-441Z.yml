              - generic [ref=e2158]: "Always high on my wish list for Los Angeles: more restaurants bringing the cuisines of North Africa to the forefront. Chef Lenora Marouani does her part by incorporating the flavors of Tunisia she’s learned from her wine expert husband, Adnen, and his family. The couple run two wine bar-shop hybrids, in Manhattan Beach and El Segundo, but at their Hermosa Beach restaurant the Cal-Med menu most directly expresses Tunisian cooking, generous in spice, garlic and olive oil. At Barsha, the street-food sandwich of oil-cured tuna, hard-boiled eggs and potatoes, stained vermilion with harissa, becomes bruschetta: Preserved lemon and harissa light up sous-vide tuna conserva, spread over crusty bread with mashed chickpeas and a jammy egg. Beef cheek, collapsing like the best pot roast, nearly vanishes into a tomato stew over couscous, crowned with butternut squash and shishitos. Even buttermilk-soaked fried chicken, available only during Sunday brunch, reveals hints of tabil, the spice blend abundant in coriander and caraway. Star-shaped pendant lamps cast patterned shadows across the dining room in the evenings, setting the mood for a mellow cocktail of three vermouths and sherry called — what else? — A Night in Tunisia."
