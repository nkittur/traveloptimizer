            - generic [ref=e1153]: By Jenn Harris
            - generic [ref=e1155]:
              - generic [ref=e1156]: The best Korean barbecue restaurants don’t crowd your table-top grill with every cut of steak and pork. Purists know that you seek out specific cuts at different restaurants, your pursuit of bulgogi taking you to one shopping center while the finest slabs of pork belly can be found in another. For the marinated short ribs known as galbi, there is only Soowon Galbi. The restaurant marinates flat, wide strips of short rib in a sweet and savory elixir of soy, garlic, ginger and other aromatics for 48 hours. The meat curtains are splayed over the grill, then monitored by the watchful eye of your server, who will seem to appear out of nowhere to flip or cut the meat at just the right moment. The heavily marbled ribs baste in their own fat, and the sugar in the marinade creates crispy, curling edges. The dduk galbi uses the same marinade to flavor minced short rib formed into a tire-sized patty on the grill. Though the galbi is the thing to order, this place is much more than a one-hit restaurant. Don’t miss the perilla seed stew, with a rich and earthy broth and chewy hand-torn noodles.
