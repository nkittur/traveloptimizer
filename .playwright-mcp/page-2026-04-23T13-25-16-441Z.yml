              - generic [ref=e4833]: "Yasuhiro Hirano, whose family owned a sushi restaurant and fish market in Japan’s eastern Chiba prefecture while he was growing up, operates a six-seat counter inside I-naba, a restaurant in Torrance, specializing in tempura and soba. Its size — and the truth that, in a region that has become nearly glutted with high-end omakase options, Hirano distinguishes himself as one of the top three finest practitioners — makes reservations extremely competitive. Score a seat, and at 7 p.m. the evening’s group will be led into a small, simple room. Attention rests on Hirano’s seamless craft, and the exquisiteness of the micro-seasonal seafood around which he composes a meal. Dinner typically begins with chawanmushi; gently smoky, electric-orange ikura, tied to the year’s salmon run through Japanese waters, recently crowned the custard. A few more small plates and Hirano segues into nigiri, the fish often aged for more concentrated, buttery textures and each variety prepared in ways to tease out its individual characteristics. Scored, charred barracuda, for example, registered as somehow fluffy on the palate. Rice crucially receives equal consideration. He achieves pleasing sourness with shari by blending two kinds of akazu, the red vinegar made from sake lees that has its roots in sushi’s Tokyo origins. Hirano also has a sense of humor: For those of us recording every detail of dinner with our phone cameras, he’ll smirk and point to a basket in the corner containing portable LED lights to borrow. Funny, and also thoughtful."
