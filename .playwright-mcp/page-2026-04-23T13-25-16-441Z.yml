            - generic [ref=e1684]:
              - generic [ref=e1685]: Do you follow Bistro Na’s on Instagram? It’s the best way to learn about executive chef Tian Yong’s seasonal menus at the Temple City restaurant. I frequent Bistro Na’s – known for its Chinese imperial-inspired cuisine – for the crispy shrimp, fried and lacquered in a sweet and sticky hawthorn glaze. The Peking duck, available by advanced reservation and in limited quantities, involves a three-day preparation that results in the most lavish, mind-bogglingly delicious presentation of meat and crispy skin. But the seasonal menus are where Yong is most ambitious, and sometimes, deeply personal. He recently transported diners back to his childhood in Xidan, Beijing, to the hutong where he lived near a restaurant that specialized in Yanji noodles. It’s a dish from the city in northeast China’s Jilin province, near the North Korean border. Similar to Korean naengmyeon, TYong’s Yanji noodles were served as a tangle of springy buckwheat noodles in an ice-cold broth suspended in perfect equilibrium, just sweet enough with an earthy, meaty backbone. Kimchi, watermelon, shredded cucumber, pickled radish, boiled egg, beef shank and chile sauce were all arranged over the top like a color wheel. I miss the cold noodles, but I’m looking forward to whatever TYong creates next.
