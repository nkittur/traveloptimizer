                - generic [ref=e3472]: I have never made it home with one of the patties from Bridgetown Roti. I eat the yellow-tinged pockets straight from their paper sleeves, scalding hot while the pastry breaks into shards all over my lap. I time my bites to the stoplights, careful not to endanger those around me with my momentary lapses in attention. But the sensation of the crisp, flaky crust collapsing into the warmly spiced paste of braised oxtail curry is too difficult to resist. They’re a staple at Rashida Holmes’ East Hollywood restaurant, where the food is an expression of the chef’s Barbadian heritage. When she started her pop-up, she helped introduce and propagate an appreciation for Caribbean flavors in L.A.. Her patties are nonnegotiable, even after finishing a curry shrimp roti, the plump shrimp and potato tucked into a buttery, flaky paratha roti with slaw. Or following a wedge of her macaroni and cheese pie, the noodles and cheese kissed with curry powder and the edges crusty. And alongside an order of jerk chicken, the dark, spice-rubbed meat singing with pepper and allspice. Holmes’ permanent location on Western Avenue, which marked its first anniversary this summer, is definitely something to celebrate. Patties forever!
