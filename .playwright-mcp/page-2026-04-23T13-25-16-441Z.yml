              - generic [ref=e6335]: Modern language fails to grasp the otherworldliness of the food at Kwang Uh and Mina Park’s Arts District restaurant. It’s a tasting menu heavily rooted in Korean flavors and tradition, with the unwieldy spirit of fermentation at its core. And it is the vegetarian twist on that menu, available with advanced booking, that so thoroughly allows Uh to flex his culinary muscles. Grilled hearts of palm are tender with a slight crunch, suspended in a curry ssamjang that hums with heat and warm spices. Next is a bowl of buckwheat noodles sheathed in a delicate seaweed cracker, its surface a maze of braided fibers, rough and feathery as a sheet of deckle-edge paper. The climax of the meal arrives as a series of baroo bowls, the vessels Buddhist monks use to eat their meals. Rice, vegetables at various stages of freshness and fermentation and a bowl of radish leaf soup are all designed to nudge the diner toward mindful eating. Cauliflower sits in a vibrant pool of Green Goddess dressing. Triangles of perilla jeon are like perfect, bite-sized presents. Wedges of pickled cucumber melon are nestled into a macerated strawberry soy paste that’s hot, tart and sweet, with a deep strawberry flavor buoyed by the tang of vinegar. The food may be cerebral, but Uh is ever attuned to the pulse of the larger culinary conversation happening around the globe. Recently, he took poetic license with the Dubai chocolate bar, presenting a quenelle of strawberry sorbet with crumbles of bitter chocolate wafers over pistachio cream that so perfectly mimicked the texture of knafeh. The dessert equivalent of a wink, and a nod, at the end of a spectacular meal.
