              - generic [ref=e5374]: "Courtney Kaplan and Charles Namba — the couple who built Tsubaki, their tiny Echo Park izakaya, and next-door sake bar Ototo into community sanctuaries — have created a superb Japanese-French bistro in downtown’s Arts District as their most ambitious project to date. Frosted pendant globe fixtures, lots of knotty wood paneling, red leather booths and pale green banquettes stamp the lofty space with an overt Midcentury Modern vibe. Menu-wise, precise grafting of cultures is the sum of its owners’ lives, professional and personal. It’s no exaggeration to say Kaplan rewired L.A.’s understanding of sake, and here too a conversation with her could soon have you sipping something herbal, or effervescent, or otherwise mind-opening. Camélia also affords Kaplan the chance to re-center her wine knowledge; her list condenses a tour of France into classic styles and up-and-coming producers. As for the cooking: Namba and his team are hand-stitching two cuisines like master tailors. Every dish, whether a salad of tomatoes matched with burrata and ponzu jelly, or a gushing Croque Madame hiding a clever layer of ham katsu, or sweet potato gratin heightened with thyme and miso butter, feels considered in its own context. Does an abalone and bay scallop pot pie color too far outside the bistro lines? When a chef touches on the sublime, labels mean nothing. We know that in Los Angeles."
