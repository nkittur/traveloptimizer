              - generic [ref=e5252]: “Where should I go for incredible pastries?” “Is there a very good place for lunch that will make people with very different tastes happy?” “Where can I take out-of-town friends for a special-occasion dinner that also feels super L.A.?” Walter and Margarita Manzke’s all-day modern California restaurant is the answer to many of the questions people ask about restaurants in Los Angeles. The married chefs are equally adept talents who gave themselves the format — a bakery plus an all-day restaurant in a spectacular Spanish-Gothic building in Hancock Park — to succeed at what each of them does best. Every morning Margarita and her team fill the front counter with eye-catching geometries of sweet and savory pies, cakes, canelés, fruit-filled tarts and croissants. At night the space transitions elegantly to formal dinner service, bolstered by a deep, Euro-centric cellar overseen by wine director Sarah Clarke. Walter’s salads and tarts and meticulously cooked meats reveal technique grounded in French tradition, yet crucially steered by a vast network of Golden State farmers. Sunday brunch, always mobbed, is when coconut-rich chia pudding covered in fruit and textbook Croque Madame might grace the table with a wobbling block of French toast or a frittata baked with both green and white asparagus. Notice the crowd, one of the most racially diverse mix of people you’ll likely see in a Los Angeles restaurant. Many, many of us pass through République. It is a cornerstone of our dining lives, a part of our village.
