            - generic [ref=e4635]:
              - generic [ref=e4636]: Can a restaurant with a well-known chef at the helm completely reinvent itself after half a decade? In a town as fickle and unforgiving as Los Angeles? Dave Beran and his team at Pasjoli proved that the impossible can be achieved, and in the span of just two weeks. When the restaurant opened in the fall of 2019, Beran introduced Los Angeles to a new wave of French dining fueled by smart, reimagined classics. And he wowed diners with his whole pressed duck, a presentation that involves cramming the carcass into a gleaming contraption and using the cartilage, bones and tissue to create a luxurious gravy. In its six years, the restaurant underwent a series of changes to its menu and format in a never-ending attempt to embody the spirit of the sort of neighborhood French bistro Beran always imagined. Earlier this year, he temporarily closed the Santa Monica bistro to revamp the dining room and introduce a new menu with fun in mind. At the new Pasjoli, a limited number of customers can still order the duck, complete with the table-side presentation. But most of the new menu skews more casual, with mini bowls of soup dubbed French onion souplettes; the bar snack of your dreams in the form of fried maitake mushrooms; a burger dripping with marrow aioli; and crepes swimming in beurre blanc studded with caviar. And with an expanded beverage program — including mini martinis and bespoke cocktails — the bar is a destination for pre- and post-dinner drinks too. The new Pasjoli is more approachable, just as delicious, and yes, even more fun.
