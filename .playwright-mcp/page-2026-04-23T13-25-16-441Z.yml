                  - text: "As a reminder that splendors can flower in the darkest times, some of the decade’s most inspired restaurants were conceived in the early pandemic months when unemployed chefs started pop-ups as a means of survival. Exhibit A: Quarter Sheets, the tiny Echo Park sensation born from Aaron Lindell’s pivot to crackly edged, Detroitish-style pizzas and Hannah Ziskin’s intuitive genius with layer cakes. Their pizzeria-that’s-more-than-a-pizzeria does big takeout business. To experience the fullest gamut of their talents, though, score a dine-in reservation. The aesthetic is early-’80s rec room, complete with charmingly wonky art (parrots are a theme) and both record and cassette players. On Tuesdays, Wednesdays and Sundays Lindell throws round, thin, charry-edged bar pizzas into the mix. Start with a warm, brothy gigante bean salad or downy meatballs in red sauce. Ziskin continues to serve her now-famous spin on princess cake, but she also makes"
