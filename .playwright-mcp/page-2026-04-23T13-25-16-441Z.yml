              - generic [ref=e5468]: At Jihee Kim’s tiny converted garage in Victor Heights, banchan isn’t the whirlwind of bowls that accompany a spread of Korean barbecue. It’s the star of a meal anchored by dishes that closely track the harvest times in California. Squares of fermented cucumber and melon sting with heat and offer a satisfying crunch. Green beans are laden with a savory, nutty sesame sauce. Collard greens prove a suitable match for an onslaught of gochugaru, the heat accompanied by the welcome flood of fish sauce, ginger and garlic used to make the kimchi. Two banchan are a snack. Three are a meal. Then there’s the avocado and mentaiko rice, with ripe avocado dressed in a creamy mentaiko sauce with salty pops of roe. The doenjang-smeared cod is soft as butter, served over rice with a sampling of the day’s banchan. I love the way the miniature squeeze bottle of hot mustard sauce that accompanies the gimbap makes my nose tingle. The yolks of the smoked eggs are a reliable cross between a decadent custard and a jelly. I show no restraint at the counter. My overzealous ordering is rewarded with a week’s worth of leftovers.
