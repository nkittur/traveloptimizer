                - text: Sara Kramer and Sarah Hymanson excel at the sort of vegetable-forward cooking that prompts people to move west, start a love affair with our farmers markets and boast about the spoils of year-round produce. The cabbage steak is a prime example, served as a huge wedge on its side, like a giant wheel of cruciferous. The leaves come away in big petals, their edges frizzled and caramelized. The middle is tender enough to split with your fork. Tucked into each layer are pieces of grilled Jimmy Nardello peppers. You can mark the end of summer by the appearance and frequency of these sweet peppers on Los Angeles menus. The cabbage sits in a pool of red pepper sauce spiked with allspice, star anise and the tang of preserved lemon. But the duo never take themselves too seriously, reeling you in with playful dishes intended for maximum pleasure. Earlier this year, there was a
