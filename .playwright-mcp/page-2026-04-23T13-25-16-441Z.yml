              - generic [ref=e3985]:
                - generic [ref=e3986]: This slender restaurant is home to my favorite bowl of noodles and my least favorite parking lot in Thai Town. Find solace from the honking and jostling at a counter seat with a cold, cloudy green tea and as many bowls of noodles as you can squeeze into the space before you. Former massage therapist Malai Data’s boat noodles drew crowds when she started popping up in front of Silom Supermarket a few years ago. In late 2023, she found a permanent home in the shopping center at the corner of Hollywood Boulevard and Western Avenue. Here, you can nibble on Isaan and Northern-style sausages while you wait for your bowls of noodles. And there will be many, with portions and prices designed to allow diners to toggle between boat, tom yum and wonton to their heart’s content. Data’s boat noodles are the gold standard, with your choice of beef or pork, each protein marinated and stewed. The meat bobs in the ruddy broth alongside bits of pork cracklings, meatballs, green onion and bean sprouts. The flavors ricochet between sour and sweet, spicy and bitter. I like to get at least one bowl dry; the absence of broth accentuates the chew of the rice noodles and the sweetness of the dark soy sauce. You may be tempted to ask for your noodles “Thai spicy,” but you have not seen real tears until you’ve watched them stream down the red, puffy face of someone foolish enough to request it. Go for the medium and treat yourself to cooling bowls of steamed pandan and coconut custard for dessert. It will all cost less than what you paid last night for valet parking.
