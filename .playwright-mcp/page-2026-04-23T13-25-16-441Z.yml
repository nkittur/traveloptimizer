            - generic [ref=e2105]:
              - generic [ref=e2106]: The sounds of live jazz music float through the dining room from the four-piece band. The clank of ice sloshing around a shaker is audible from the bar. The party at a booth in the back erupts in a chorus of laughter. An evening at Somerville feels like a big, collective sigh, with lighting that looks like an IRL filter and the immaculate vibes of a private music club. South Los Angeles natives Yonnie Hagos and Ajay Relan opened the restaurant in late 2024 in the same View Park-Windsor Hills retail complex as the original Hilltop Coffee + Kitchen they founded. It’s named for Hotel Somerville, which later became the Dunbar Hotel, a refuge for Black artists who frequented and performed in Central Avenue’s storied bars and clubs. These musicians helped the area flourish in the early to mid-20th century, at a time when Black artists were not welcome in the city’s white-owned nightlife venues. Somerville cocktails like the Dolemite and Trouble Man are homages to icons of Black culture. Your dinner spread will likely be an eclectic mix of fried chicken sliders lavished with Petrossian caviar crème fraîche; lasagna layered with braised collard greens and béchamel; and a crisp-skinned salmon in a coconut and lemongrass curry. Every evening is dinner and a show, and everyone is welcome.
