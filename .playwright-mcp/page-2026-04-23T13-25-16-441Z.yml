              - generic [ref=e3045]:
                - generic [ref=e3046]: Lord Maynard Llera went from serving spirals of crackly-skinned, Filipino-style pork belly from his La Cañada Flintridge backyard during the pandemic to winning the James Beard Foundation award for best chef in California in about three years. The praise for his interpretation of modern Filipino cuisine was swift and enthusiastic, and the effect he had on the genre in Los Angeles, and beyond, indelibly impactful. He garnered loyal fans with his crispy pork, in the form of twice-fried lechon kawali and “lucenachon,” the name he coined for those spirals of crispy pork belly made in a similar fashion to Italian porchetta. But I find myself returning to his Melrose Hill restaurant most for the hiramasa collars. Back in his hometown of Lucena City, about 80 miles south of Manila, Llera prepared his daing, or dried fish marinade, with a combination of soy, garlic and calamansi, then let the fish sun-dry for a week. At the restaurant, he uses the same umami-rich marinade, but allows the hiramasa collars to air-dry for just four hours before cooking them on the grill. Despite the shortened marination, the fish falls effortlessly from the collar, perfumed with almond wood, buttery and concentrated with citrus and soy. He serves the fish with a side of chile oil, a sandy paste full of chiles, fried garlic and fermented anchovies. There are jars of the stuff for sale near the register. Don’t leave without one.
