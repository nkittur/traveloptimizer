            - generic [ref=e2293]:
              - generic [ref=e2294]: Most weekends on an industrial block of Cudahy, in view of the 710 Freeway following the course of the Los Angeles River, David Delfín sets up a simple stand among other street vendors. (Check the weekly schedule on Facebook or Instagram.) His whole roasted suckling pig tacos, a style regionally specific to Nayarit, are like nothing else I know in Southern California. A taquero will chop one of two combinations — a mix of yielding cuts of meat and crackling skin, or pure pork belly — and pile it on two small corn tortillas with sliced cabbage and a duo of thin salsas, one spicier than the other and both twanging with mustard. Try one of each, and be sure to give them a bracing squeeze of lime. At first the salsa flavors slice like Bertman Original on a ballpark hot dog, but soon they mellow and meld with the pork. (My Southern roots compel me to mention the chance similarity between Delfín’s masterpiece and South Carolina whole-hog barbecue, also traditionally served with mustard-based sauce.) He doesn’t make any other kind of taco. He doesn’t need to.
