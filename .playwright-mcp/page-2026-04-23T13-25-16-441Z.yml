            - generic [ref=e2904]:
              - generic [ref=e2905]: It doesn’t matter what you pile into the middle of a sandwich. It can be pastrami, sprouts or last night’s dinner. If the bread is good, you’re more than halfway to greatness. You could close your eyes and jab a finger at any sandwich on the Lorenzo California menu and be elated at the selection. They’re all served on puffy, rectangular rolls baked each morning. The bread has the flavor of good extra-virgin olive oil, but it’s thinner and lighter than your average focaccia, with a crust that cracks and collapses into a soft and airy middle. Longtime restaurant manager Renato Araujo and his wife, Cynthia Raslan, took the money they were saving for a house and opened a small sandwich shop in Beverly Hills instead. To make the namesake Lorenzo, Araujo combines a Parmigiano sauce, roasted red peppers, toasted pistachios and a heap of shaved mortadella. It’s pure, porky bliss. He’s making more than a dozen sandwiches to order, plus a short menu of pastas. There’s barely space to make a U-turn in the shop, but do your best to grab a seat and properly tuck into a bowl of the gnocchi. The dumplings are pillowy soft in a rich lamb ragu. And if the tables are full, your sandwich, and your pasta, will be equally satisfying in the car.
