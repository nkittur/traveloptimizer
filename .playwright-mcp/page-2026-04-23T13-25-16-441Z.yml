              - generic [ref=e3430]: Alto is one of the most ambitious restaurants to open in the San Fernando Valley in recent memory, with a menu that spans the Rio de la Plata region of South America. Co-founders and chefs Juana Castellanos and Esteban Klenzi celebrate the open-fire cooking of the Pampas, with inspiration from their combined Uruguayan and Argentine backgrounds. Most everything is cooked on the wood-fired grill, the flames providing a warm glow throughout the dining room. Pan criollo is as soft as milk bread, with layers you pull away like a good biscuit. Puffs of chipa are chewy and cheesy. There’s chimichurri butter alongside the classic Uruguayan pan marsellés. The asado banderita is the restaurant’s star meat, a dry-aged short rib full of flavor with a grassy, mineral tang. The steamed corn cakes known as humitas are reimagined as a sweet corn stew, like an ultra-luxurious creamed corn dressed with garlic chile oil and a provolone crisp as big and wide as the serving bowl. If you’re lucky, there will be a torta rogel under a glass dome for dessert. The popular Argentine birthday cake involves layers of smooth caramel between wafer-like pastry and a crown of stiff, glossy meringue. It’s as heavenly as it sounds.
