              - generic [ref=e4731]: "For the most rewarding concentration of restaurants spotlighting the culinary scope of the Arab world, head to Little Arabia, the district in West Anaheim granted an official designation by the City Council in 2022. Shops selling falafel stained spring-green with parsley and cilantro; Lebanese and Syrian destinations serving mezze spreads of cool dips and hot, lemony chicken wings; bakeries fragrant with za’atar-scented flatbread or crackling, cheesy-stretchy knafeh: That’s only a beginning. Chef Magida Shatarah and her husband Aref Shatarah distinguish Al Baraka with a repertoire of Palestinian dishes more commonly seen in home kitchens than on restaurant menus. Whatever else you may order in their calm dining room — tabbouleh that tastes as bright as it looks, molokhia (a soothing soup of pureed jute mallow), kubba laban (beef and bulgur croquettes in satiny yogurt sauce), pan-shaped beef kufta in tahini sauce with fries — be sure to scan the list of daily specials. Mondays mean maqluba, the rice dish presented upside-down and arranged with chicken and geometries of cauliflower, eggplant and potatoes. Thursdays are for sheikh el mahshi, squash meticulously stuffed with a spiced ground-beef filling and simmered in yogurt. Saturdays bring a weekend crowd favorite: msakhan, in which roast chicken is piled on flatbread with onions stained purple from sumac."
