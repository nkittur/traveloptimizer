              - generic [ref=e3004]: Among the cuisines that light up the San Gabriel Valley’s constellation of restaurants, Bugra Arkin’s two lodestars in Alhambra and Rowland Heights, with a third location in Irvine, illuminate a culture specific to the autonomous Xinjiang territory in northwest China. The cooking of the Uyghurs, the region’s Turkic-speaking Muslims, culls centuries of spice trade influences, including from modern-day India, Tibet, Afghanistan and Iran. Kick off with the signature “big plate chicken” heaped with potatoes, chopped red and green peppers, slivers of garlic and dried chiles. Wide hand-pulled noodles peek out underneath. Currents of Sichuan peppercorns and star anise jolt the broth. It’s terrific, as are manta (plump pleated dumplings) filled with earthy diced pumpkin and minced onion, and laghman, long noodles nearly as thick as taffy, buried under stir-fried vegetables and tender beef strips. For fun, throw in the “tower kebab,” with marinated lamb visibly speckled with spices draped over a tabletop metal contraption. With murals of Uyghur life and details at the Alhambra flagship like globe-shaped glass lamps patterned in starbursts and other geometries, Arkin evokes his culture as much in the dining room’s aesthetics as in the food he serves.
