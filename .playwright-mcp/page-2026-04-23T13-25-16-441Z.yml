            - generic [ref=e2020]:
              - generic [ref=e2021]: "At face value, the two locations of Petit Trois — the first off Melrose and Highland, with mostly covered-outdoor seating, and its roomier Sherman Oaks sibling — have become pleasant destinations for bistro classics: onion soup under its molten cap of Gruyère and Emmentaler, salade Lyonnaise riddled with bacon, proper plates of trout almondine and filet au poivre, silken chocolate mousse offset with toasted hazelnuts. These days it’s a little harder, but not impossible, to detect the subversive streak that propelled chef-owner Ludovic Lefebvre’s career. Blurring classical technique with avant-garde imagination, his cooking this last decade, first via pop-ups and then his gone-too-soon tasting-menu boîte Trois Mec, stretched the city’s culinary boundaries into outsized new forms. When the original Petit Trois debuted in 2014 as a tiny bar, Lefebvre revealed a Frenchman’s affection and rebellion toward his mother cuisine in equal parts, while also poking fun at American excess. His cheekiness is enshrined in the cumulus omelet filled smirkingly with Boursin and the double cheeseburger swept downstream in Bordelaise sauce, and flickers anew in a recently conceived veal chop stuffed Cordon Bleu-style with ham, prosciutto and gushing Fontal. Lately he’s leaned into the limitless potato variations in the French canon: pommes paille (needle-thin straws) under tuna tartare; pommes paillasson (crisped, hashed pancake) that match the comforts of roast chicken; extra-savory pommes Sarladaise (sliced and sautéed in duck fat) to reinforce duck leg confit. Zero in on the menu’s seditious-traditionalist extremes, and Lefebvre’s greatest talents remain unmistakable."
