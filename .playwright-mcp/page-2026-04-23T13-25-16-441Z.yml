            - generic [ref=e1523]: By Jenn Harris
            - generic [ref=e1525]:
              - generic [ref=e1526]: Imagine a perfectly seasoned steak with a deep mahogany crust and a ruby center. The kind of steak you spring for on a special occasion. A centerpiece at the best steakhouse in town. That’s the steak Mario Llamas is using for his paper-wrapped sandwiches, sliced and piled onto a crusty roll dripping with chimichurri. Llamas, who used to be the chef at an Argentine steakhouse, runs Mario’s Butcher Shop in Newport Beach. He recently remodeled the space to include an expanded area for merchandise, a longer butcher case and more room for waiting customers. And there are many, with weekend crowds dressed in college sweatshirts, surfer gear and soccer uniforms. Llamas is a master at stuff between bread, smoking his own pastrami and curing a variety of deli meats. His smashburgers aren’t squashed into oblivion, the patties retaining prized meat juices despite their crispy halos. The sandwich that always leaves me a little breathless is the smoked bologna, heaped onto a soft roll slathered with yellow mustard. The last time I ordered it, the person at the register said, “It really tastes like a hot dog today.” It did. Like the best hot dog in the universe.
