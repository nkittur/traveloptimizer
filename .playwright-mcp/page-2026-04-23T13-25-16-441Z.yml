            - generic [ref=e1579]:
              - generic [ref=e1580]: Nathan McCall and Karen Yoo opened Backbone restaurant in north Glendale in late 2024, just south of Montrose. It’s an area that feels like an actual small town, nestled into the foothills of the San Gabriel Mountains. The location alone makes Backbone somewhat of a hidden gem, along with an ambitious menu that traverses the globe. The national dish of Monaco makes an appearance as a trio of barbajuan, the deep-fried pockets of pastry stuffed with velvety potato, Comté and leeks. Uni tongues are draped over a short stack of waffles dressed with nori honey butter and a sharp yuzu whipped cream. McCall and Yoo previously ran butcher shop McCall’s Meat & Fish Co., which they sold in 2021. At Backbone, McCall is demonstrating a similarly flawless command of proteins from both land and sea, including steaks that achieve the perfect synergy of salt, fat and heat. Yoo is making desserts you’ll want to leave room for, like her sphere of Key lime custard encased in a speculoos cookie crust. Backbone is very much a neighborhood restaurant, with McCall and Yoo emerging from the kitchen to offer warm greetings to diners throughout the evening. And when each table gets an order of Yoo’s hot, perfect madeleines to finish the meal? Everyone feels like a regular.
