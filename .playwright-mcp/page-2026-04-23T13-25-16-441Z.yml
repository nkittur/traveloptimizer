              - generic [ref=e2533]: "Pull open the door to Hiroki Chiya’s 6-year-old izakaya, unassuming onamong a stretch of Westwood lined with Iranian restaurants and groceries, and step into a clamor that’s impressive given the restaurant’s tiny size. Rather than a Japanese California interpretation of izakaya, Chiya hews more closely to the modern concept of the genre in Japan: casual and amiably rowdy, a place to gather after work for eating and drinking in groups. That said, reserving a table here by phone, even a day or two ahead, is imperative. The pub’s name refers to the Hakata central district in Fukuoka, the sixth-largest city in Japan, built on the northern shore of Kyushu island. Its repertoire includes tonkotsu ramen. Chiya often fashions an extra-intense, and sometimes spicy, version made from pork head and knee simmered over 24 hours, which appears frequently on his handwritten list of specials. Much of the lineup flows with the micro-seasons of Japanese seafood. Tempura will encase small fish such as kibinago (a silvery swimmer in the herring family) that runs in the springtime; ayu (sweetfish) shows up in the fall, grilled and needing nothing more than a squeeze of lemon. Ask one of the composed, fast-moving servers about seasonal sake selections, though plenty of revelers stick to pitchers of Sapporo on draft."
