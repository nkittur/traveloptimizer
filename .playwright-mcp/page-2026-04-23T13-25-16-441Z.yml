              - generic [ref=e4786]: All eyes are on the mussels tart as it makes its way from the open kitchen to the dining room at Vin Folk. It’s both precious and picturesque, the love child of mussels in escabeche and pot pie. Mussels are painstakingly arranged in rows over a smoked fennel cream in the center of a diamond of puff pastry built to resemble an open steel tin. The shards of flaky pastry sink into the cream and mussels. The effect is at once rich and acidic. The tart, like everything else on the menu, was inspired by chef-owner Kevin de los Santos’ and chef-partner Katya Shastova’s backgrounds and travels, each dish attached to specific memories. The headcheese toast is a fun, loose interpretation of the patty melt from Langer’s Deli. Beef tongue is an homage to Shastova’s childhood in rural southern Russia. An evening will likely weave from Taiwanese popcorn chicken to breakfast cereal in the Philippines. Partner and beverage director Christina Montoya and sommelier-in-training Idean Hashemian will find the perfect wine to complement it all. It’s the most ambitious restaurant to open in the South Bay in recent memory, and a shining example of destination neighborhood dining.
