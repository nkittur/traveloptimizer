              - generic [ref=e3745]: "The curving counter emulating auditorium seating. The ballet of 20-plus small courses, beginning and ending with trompe l’oeil “one-bites” resembling almonds, feathers, sprinkle doughnuts and berries. The blur of dishes, geometric and sculptural, that evoke the flavors of Spain, or the pluralism of California, or pure realms of imagination. It took Aitor Zabala nearly five years to relaunch Somni from its hidden location in the back of José Andrés’ Bazaar in the SLS Beverly Hills to a freestanding space on a quiet street in West Hollywood. Somni is as much performance as it is dinner. Evenings begin with opening rounds of fanciful canapés in a calm courtyard, and then move inside where the team of chefs and captains glide through the room, placing and presenting dishes in synchronized motions and adding occasional sides. Says Zabala when his most famous dish, a slice of “pizza” with meringue crust, arrives: “It’s gluten-free. Perfect for Los Angeles.” The theater comes at a staggering price: A minimum, with mandatory beverage pairings that begin with a nonalcoholic option, of $745 per person before tax and tip. Somni 2.0 received three Michelin stars mere months into its existence. It’s a place for the super-wealthy to use their black-card concierge services to help score reservations. Otherwise, expect bookings to be nearly impossible for the foreseeable future."
