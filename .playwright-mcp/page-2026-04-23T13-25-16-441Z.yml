            - generic [ref=e1058]:
              - generic [ref=e1059]: Founders Andrew Cherng and his father, chef Ming-Tsai Cherng, may have made the greatest contributions to Chinese American cuisine in the last century. The two opened the original Panda Inn in Pasadena in 1973. Andrew and his wife Peggy would later introduce the first Panda Express at the Glendale Galleria food court a decade later. The restaurants are widely credited with the invention of orange chicken, and dishes like beef and broccoli and General Tso’s chicken became a part of the greater American culinary vernacular in the woks of the Panda restaurants. The original Panda Inn reopened in late 2024 after two years and a complete overhaul, with new dishes introduced by executive chef Aiguo Yang. The braised lion’s head meatballs are a regional specialty of the Yangzhou province, where both Yang and Ming-Tsai are from. They’re soft and supple like giant orbs of dumpling filling, submerged in a rich, brown gravy. Yang also tweaked the recipes for some of the restaurant’s most recognizable dishes, including bumping up the citrus in the orange chicken. The nuggets of fried chicken are crisp under the familiar glaze, with a sun-ripened citrus flavor. It’s the same Panda Inn that earned legions of loyal fans, with a much swankier dining room, a few new regional specialties and orange chicken that’s better than ever.
