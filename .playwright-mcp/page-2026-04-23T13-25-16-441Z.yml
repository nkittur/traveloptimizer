              - generic [ref=e3792]: "If the algorithms did their job this summer, you saw a slice of Cafe 2001’s watermelon cake on the socials: mostly fresh fruit, encased between simple sponge cake and smooth whipped cream. A breath of menthol coolness came from an invisible dusting of Fox’s Glacier Mints, a 107-year-old English candy, grated over the top before serving. That kind of sly genius is a trademark of Giles Clark, who grew up in England. He took over the scrappy back corner space of the massive Arts District building mostly occupied by Yess, where he was previously sous chef. The vibe is coffee shop meets concrete bunker, and Clark works out his own permissive definition of daytime cafe cooking. Breakfast plates knowingly mix sweet and savory (lamb hash with applesauce, smoked trout with huckleberry jam), and the lunch staple is a pork tenderloin katsu sandwich that squishes and zings in every right way. One ever-changing lunchtime meat or seafood entree hints at the whimsy and technique Clark has in his reserves. Pastry chef Kota Kawamura makes brilliant fruit tarts, and Clark has mastered brioche doughnuts filled with vanilla custard or strawberry jam. Cafe 2001 is a peculiar little place, enticingly so. Its eccentricity feels like a welcome refuge."
