                - text: "MTN (pronounced “mountain”) closed five years ago and, with a few pivotal modifications, has now returned as RVR (yes, pronounced “river”). That’s the very condensed story behind the California izakaya run by Travis Lett. Its second life turns out to be shockingly good, thanks especially to the brilliance with vegetables that Lett refined as the founding chef of Gjusta and Gjelina. He, executive chef-partner Ian Robinson and their team can tease the Technicolor out of winter: They’ll layer, for example, near-ripe Fuyu persimmons in pinwheel patterns under rounds of lilac-purple daikon with crunchy furikake and torn shiso. In the holy season of summer, apricot replaces the usual cucumber in a take on sunomono, stung with tosazu (vinegar-based dressing smoky with katsuobushi) and aromatic accents of pickled Fresno chiles, ginger and crushed Marcona almonds. I also keep coming back for fluffy duck meatball tsukune served with head-clearing hot mustard; hand rolls brimming with kanpachi and avocado; and pan-fried pork and cabbage gyoza crowned with a crackling, lacy dumpling “skirt.” Brunch has a similar menu to dinner, though also throws in a tamagoyaki omelet rolled with Comte and mochi beignets."
                - text: However broadly the idea of an izakaya may be translated, the drinking component is crucial. RVR provides with fresh-fruit shochu highballs, plum-accented negronis, sakes in several styles and wine director Maggie Glasheen’s bottle list that’s strong on off-dry Rieslings and rich, slightly oxidized whites. Even the selection of hot and iced Japanese teas feels closely considered.
