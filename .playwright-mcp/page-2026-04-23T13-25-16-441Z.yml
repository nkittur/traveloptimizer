            - generic [ref=e1477]:
              - generic [ref=e1478]: "Adham Kamal, raised in As-Suwayda (sometimes also spelled Sweida) in southwestern Syria, brings to Los Angeles the finely shaved, deep-down-marinated shawarma he learned to make as a teenager. He operates locations in Sherman Oaks, Pasadena, Anaheim and the first local stand he ran near the corner of Hollywood Boulevard and Vine Street, then called Hollywood Shawarma. Choices at each storefront come down to two menu options: spiced lamb and beef, referred to as lahme (meat) in Arabic, or lemony chicken, called djej. Each has a traditional sauce: tahini-based tarator for lahme, toum (whipped garlic paste) for djej. The hardest decisions concern size and form. Do you want a one-handed classic stuffed pita, or a 12-inch version, made using extra-thin flour tortillas, that comes as a plate with fries? Think smaller is my suggestion, and ask for the wrap to be rolled using only one round side of a pita, a common request among regulars. It’s about proportions. A shawarma wrap is not a burrito. It is meant to be compact and intense. The winning touch: Kamal and his staff finish the packet on the griddle, searing until every angle is browned and crackling."
