            - generic [ref=e1731]:
              - generic [ref=e1732]: Indio viejo is a hearty stew with strands of beef nestled in a masa-thickened, velvety gravy that will cling to your spoon and most likely your ribs. “It’s so good, right?” My server beams with pride as he watches me scrape the edges of the bowl. “This dish is very special to me.” That pride radiates from every wall mural and flag in the dining room and from the small marketplace at the rear that advertises snacks and clothing in the official blue and white colors of Nicaragua. The restaurant offers an expansive menu of dishes specific to the Central American country. The nacatamal is custard-like in the center, every bite a surprise of bone-in pork ribs, tomato, rice and potato tinged with sour orange. The carne asada platter is enough for two, with a handsome cut of marinated beef, a triangle of fried cheese, gallo pinto and crispy or soft plantains. Quesillos are served in plastic bags that barely contain the thick corn tortillas, crema and caramelized onion. Even if you experience a fullness not previously imaginable, find room for the buñuelos de yuca y queso. The pucks of cassava and cheese are fried until crisp and served in a cinnamon-and-clove syrup that tastes like the holidays.
