                - generic [ref=e4175]: "If a slice of beautifully made pie gives your soul ease, as it does mine, beeline to Fat + Flour. No matter how many videos I watch of chef-owner Nicole Rucker tucking and pleating dough in a pie pan, or the number of brilliantly nonchalant flavoring tips (lavender sugar paired with blueberry!) I glean from her recently published book, “Fat + Flour: The Art of a Simple Bake,” my efforts are never the same: The beauties that Rucker and her longtime right-hand baker Krystle Shelton craft will always be superior. Crusts flake and shatter and promptly melt into a memory of butter. Flavors change with the calendar and in fits of imagination. Summer’s “stone fruit party pie,” intensified by bourbon and vanilla bean paste, segues to autumn’s buttermilk chess with a silky-dense layer of apple butter, or pecan flickering with hot honey. At the Culver City flagship, precede dessert with an herbed omelet sandwich or curried chicken salad, scented with Persian lime, on plush milk bread from Jyan Isaac. Those of us on the other side of town can swing by the Fat + Flour stand inside Grand Central Market for a butterscotch chocolate chip cookie and a slice of Rucker’s famously not-too-sweet Key lime pie."
