              - generic [ref=e2855]: “Set menu with barley rice,” reads the humble description for the kaleidoscopic meals served at 4-year-old Borit Gogae, one of Koreatown’s frontrunner restaurants of the decade. For $35 per person, the staff delivers a flood of dishes to the table. Soups, mild pumpkin porridge, salad with bouncy cubes of acorn jelly and a few crunchy mung bean pancakes precede a spread of banchan-style seasoned vegetables (among them, tea leaf, wild greens, eggplant, various mushrooms and a crucial, evolving selection of kimchi) arrayed on a woven basket. Bowls of barley rice also arrive, in which you assemble your lunch or dinner from the many elements to your taste, similarly to bibimbap, finishing with drizzles of sesame oil and staining flicks of gochujang. The family-style setup is informal and communal. Everyone winds up with the nourishing meal they want. For omnivorous gilding, you can order extra group-sized options such as deeply savory grilled short rib patties or bowls filled with raw marinated crab. Artwork by one of the six sibling owners lines the walls, and there’s a table of stacked kitchen wares for sale in one corner. The vibe is upliftingly chaotic, like a busy household — a fitting scenario for the homey style of cooking.
