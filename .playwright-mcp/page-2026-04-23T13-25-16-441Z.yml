                - generic [ref=e1960]: "Harry Posner and Natalie Dial swapped careers in medicine and public health, respectively, to devote themselves to an all-day restaurant with a dining room, event space and rooftop terrace in Westchester, where Dial’s family has roots going back four generations. Posner’s ambitious menus catalyze his heritages (including Iranian, most essentially conveyed through crusty-plush barbari bread served with roasted tomato butter); his experiences baking in Italy and cooking on the line in Tokyo; and the very Californian lens through which he marries produce from a nearby garden with a global pantry of seasonings. There’s a lot going on, but one key fact unlocks the secret to the most pleasure-filled meals at Tomat: Posner grew up in England. Follow the lead to a starter of Welsh rarebit, which for the unindoctrinated is smooth, cheddary cheese sauce spread across toast. Tempura broccoli or other seasonal vegetables replace potatoes in a brainy riff on fish and chips. Follow lamb, properly accompanied by mint jelly, with the pure succor of sticky toffee pudding. For a year I’ve been thinking about the stargazy pie, his spin on a savory Cornish seafood pastry, full of smoked trout and with decorative prawn tails poking out from the puffy crust. May it return as a special this winter. If you’re just coming off a daytime flight, swing by for a Scotch egg, its jammy yolk hidden by a crust of black sausage. I know. I’m recommending British fare five minutes from LAX. Welcome, once again, to the delicious enigmas of Los Angeles."
