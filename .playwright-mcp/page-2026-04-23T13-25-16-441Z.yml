              - generic [ref=e2949]:
                - generic [ref=e2950]: Leek toast should unseat avocado toast as the official stuff-on-toast dish of Los Angeles. Have one meal at Stir Crazy, Macklin Casntoff, Mackenzie Hoffman and Harley Wertheimer’s teeny-tiny Melrose Avenue restaurant, and I’m confident you’ll see things my way. The leek toast is built on a brick of Bub and Grandma’s bread. It’s spread with Blakesville Creamery chèvre, a little tangy and very buttery. Soft leeks are arranged over the top in an overlapping pattern of pale green. It’s finished with a generous drizzle of kombu oil that saturates the toast in a concentrated, deep marine umami. Within the confines of the 500-square-foot room, chef Caroline Leff makes waves that resonate throughout the city. I fully expect to see leek toast at a cafe near you. I can say the same for her celery salad, dressed with squares of aged Gouda, walnuts and raisins. The wine program, led by Hoffman, is just as impactful. She or your server will be quick to appear with a few wines to try, but look out for the restaurant’s first house wine, a Stir Crazy Estate Pinot Noir from an organic vineyard in Carmel. It’s a Burgundian expression of the grape that sips well with everything on the menu.
