              - generic [ref=e3664]: "A tiny single-story, 1890s-era Victorian house in Alpine Courtyard — the same Victor Heights complex, developed by architect Jingbo Lou, where Perilla LA resides — is the new home of Miles Thompson, a chef of provocative talents who had a memorable run last decade shaking up Michael’s, the California cuisine progenitor in Santa Monica, with a rush of modernist energy. His menu at Baby Bistro conveys disarming ambiguity: six primary dishes, most of them in flux with the seasons, designed to be ordered in their entirety and shared as a family-style prix fixe. “Spaghetti squash, passionfruit,” read one sparse description in October. What arrived was a layered landscape of the imagination. Chopped dates hid among the lacy squash. Also in the mix: caramelized milk powder, fried rosemary leaves, passion fruit seeds for crunch and a final mantle of goat’s milk Gouda shaved into bouncy curls. Its collisions of sweet and savory tasted like a Thanksgiving casserole passed down the table via a parallel universe. Thompson culls many influences in his cuisine; ultimately, it’s most reflective of his own borderless intellect. He has just the right partner in co-owner Andy Schwartz, who steers a concise, complementary program of natural wines, including a list with often cheeky tasting notes. Baby Bistro is definitely for the experimentally inclined. But in an era when corporate blandness takes up too much real estate in Los Angeles, this restaurant is an alternative and an antidote."
