              - generic [ref=e5152]: An evening at Kaneyoshi begins long before you’re seated for dinner. Find the restaurant deep in the basement of an office building in the heart of Little Tokyo. Give the host your name and make your way through a hallway to a back room where a long, L-shaped sushi counter is lighted like a stage. Then allow yourself to be fully immersed in Yoshiyuki Inoue’s wood-paneled world. Before the cavalcade of Edomae-inspired nigiri, Inoue and his skilled retinue begin with a series of small starters. A grouper tempura is cloaked in shavings of salted egg. A Japanese sardine roll packed with ginger and cucumber resembles a pane of stained glass. While slices of prepared ankimo can be found at just about any sushi bar in the city, Inoue makes his own. His monkfish liver has the uneven texture of nduja and an umami-rich sweetness enhanced by slivers of cooked apple splayed over the top. An air of anticipation builds as Inoue methodically forms his nigiri. I’m mesmerized by the way the charcoal-seared toro melts like butter. And at the soft slackness and vinegar tang of the weeklong-marinated kohada. I grasp the fried greeneye fish mere seconds after it’s folded into a taut sheet of seaweed, its tempura shell hot and jagged against the rice. At the end of the evening, there’s delight and contentment, mixed with a nagging sense of longing. Can we please rewind and do it all over again?
