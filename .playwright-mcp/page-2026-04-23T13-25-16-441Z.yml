            - generic [ref=e5788]:
              - generic [ref=e5789]: Our restaurant critic is an enthusiast of Iranian cuisine, a venerable authority on the subject in Los Angeles and beyond. So when he sang the praises of Cody Ma and Misha Sesar’s pop-up-turned-restaurant Azizam, I took notice. The name translates to “my dear,” a term of endearment in Farsi. The pair forgo the more ubiquitous kebabs in favor of a menu that bridges the gap between homestyle Persian cuisine and stalwarts you’re likely to find at your neighborhood Iranian restaurant. It’s hard not to fall for the kofteh Tabrizi, a gargantuan meatball of beef and rice crowded with fresh herbs and crowned with barberries. Ensconced like hidden jewels in the center are morsels of sweet dried fruit and walnuts. A thick slab of kuku sabzi, the labor-intensive frittata made from a garden’s worth of chopped herbs and greens, is nestled between two slices of seed-flecked barbari bread. It’s cuisine meant to be shared and lingered over, with a mazeh plate acting as a flawless overture to an afternoon spent on the sunlit patio. A seasonal vegetable yogurt is hot pink with beets. The shirazi salad is a medley of crunchy cucumbers, tomato and onion. The mazeh I return to most on the table is the zeytoon parvardeh, a wonderfully tangy jumble of smashed green olives, pomegranate molasses, walnut and mint oil you can eat with a spoon.
