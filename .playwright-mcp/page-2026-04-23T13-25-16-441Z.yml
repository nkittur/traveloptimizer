            - generic [ref=e2432]:
              - generic [ref=e2433]: "Two-year-old Budonoki is where club meets pub, a bumping, welcoming scene that never loses sight of its essence as a Virgil Village neighborhood restaurant. The vibe: paper lanterns across the ceiling, fluorescent purple and reddish-pink lighting that recalls the curated glow of “Blade Runner 2049,” a playlist that spans the evolutions of R&B and hip-hop through the last 40 years. Founders Eric Bedroussian, Josh Hartley and chef Dan Rabilwongse model menus loosely around izakaya, with Thai and Vietnamese flavors informing Japanese-inspired drinking foods. A few sips into a citrusy martini variation using sake and shochu, and I’m ready to tear into the restaurant’s take on curry pan, flaking apart to reveal a lining of stretchy mozzarella and ground Wagyu beef simmered in sweet Japanese curry. Swipes through smooth aji verde bring cooling herbal contrast. Servers will give instructions on building naem (Thai pork sausage with crisped rice balls and slaw) into one-bite wonders. Be attentive to the slip of paper that lists the night’s specials. The best of them tend to graduate to the main menu. This includes the kitchen’s great underdog, sweet potato cooked in embers, slathered with miso butter and showered with chives. Might a recent run of yellowtail ribs, encased in curried batter as suave fish sticks, be next?"
