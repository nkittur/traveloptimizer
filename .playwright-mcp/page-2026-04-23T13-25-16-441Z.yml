            - generic [ref=e1428]: By Jenn Harris
            - generic [ref=e1430]:
              - generic [ref=e1431]: The stellar breakfast burritos at siblings Ana and Jonathan Perez’s restaurant inside Milpa Kitchen in Boyle Heights start in a single pan on the stove. It’s a medium-sized skillet similar to the one I favor at home, its handle and sides just as weathered. I watch as the cook uses the spatula to fold the eggs over low heat, the pillow-like texture visible from across the room. There’s a flurry of cheese, then the eggs are whisked from the heat at the exact moment the two fuse into a single, perfect cloud. The eggs are tumbled onto a fresh tortilla along with chile-dusted tater tots and your choice of meat. I’m partial to the way the strands of birria intertwine with the cheesy eggs, creating a series of cohesive bites infused with fruity guajillos, garlic and bay leaf. The tortillas are stuffed until nearly bursting, the egg, potato and meat bulging and visible through the surface of the burrito. For lunch, there are a handful of tacos built on blue corn tortillas, reminiscent of the masterful creations Jonathan first presented years ago while operating a roaming taqueria. Mushrooms are marinated in al pastor-style spices and kissed with smoke on the grill. A smear of choribeans supplies a soft landing for ropes of brisket and a salsa de aguacate that pulses with brilliant acidity. These are tacos — and burritos — as art. The kind you can consider, admire, then consume in 90 seconds.
