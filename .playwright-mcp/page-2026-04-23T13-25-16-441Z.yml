            - generic [ref=e4473]:
              - generic [ref=e4474]: Under the tutelage of Courtney Kaplan and Charles Namba, this Echo Park izakaya, and sister bar Ototo, are two of the best places to drink sake in the city. Kaplan’s grasp on the spirit is unmatched, with seasonal offerings and a talent for steering even the geekiest enthusiasts toward something fresh and exciting. While Namba established a steady fanbase with his ability to harness the best local produce with Japanese flavors and technique, it’s chef de cuisine Klementine Song helming the kitchen. Her kyabetsu miso-kushiyaki is the most notable cabbage glow-up in town. The leaves are cut into precise squares, packed tightly onto skewers and grilled on the hottest part of the hibachi for maximum char. Some parts are thick and crunchy, while others are wilted and nearly creamy, the edges black, frizzled and tasting faintly of smoke. Seasonal crudo is consistently flawless. Whatever the market tempura, order it. Recently, there were long strands of dragon tongue beans sheathed in a light, delicate batter. Served like a mountain of gargantuan French fries, they were just the sort of thing you want to be eating with a glass of something cold and bracing. The staff has plenty of recommendations.
