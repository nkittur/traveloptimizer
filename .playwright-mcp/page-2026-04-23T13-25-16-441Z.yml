                - text: "in their family-run Dominican restaurant in Anchorage; in summer 2023 they reunited to serve their mother’s and grandmother’s recipes from a 16-seat storefront in a North Hollywood strip mall. Deany often can be seen through the kitchen window tending pots of various meats infused with lime juice, onions, garlic, oregano and other spices. The first one to try: Santana’s chicken, Jonathan’s renaming of the classic Dominican pollo guisado. The bird, richly browned, simmers with thinly sliced peppers in liquid that becomes a brothy, intense gravy. El Bacano unlocks its doors at noon, but a quintessential Dominican breakfast plate awaits any time of day: mangú (mashed plantains) with los tres golpes, or “the three hits” — two fried eggs, slabs of griddled salami and thin rectangles of queso frito. A staffer will ask if you prefer the plantains green or ripe, and my answer is the one the Santanas recommend: a smooth yet textured mixture of the two. As a side order, the queso frito also makes a munchy, salty midday snack. So does a hot empanada, its half-moon shape shattering to unloose a magma flow of stretchy yellow cheese and diced salami."
