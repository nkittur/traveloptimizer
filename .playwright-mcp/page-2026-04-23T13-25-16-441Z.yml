              - generic [ref=e1193]: "When friends ask to go on a dumpling crawl, I build an itinerary that involves an array of styles. Hui Tou Xiang for the blintz-shaped pockets of juicy pork and beef. Shanghai Dumpling House for the salted egg xiao long bao so heavy with soup they seem to droop. I always end the crawl at Kang Kang Food Court. The sheng jian bao, listed as small pan-fried bao on the menu, are always everyone’s favorite. Each has a crispy bottom, a soft, fluffy yeasted bun in the middle, a thin, chewy top and a juicy pork filling. This textural paradox creates the sensation of three dumplings in one. For more than two decades, the sheng jian bao at Kang Kang Food Court have been the gold standard, served with sweet vinegar for dipping. It may be tempting to take a big bite as soon as they hit the table, but it’s a mistake you make only once. Co-owner John Chin Yu Yeh created a poem to keep diners from sending hot filling across the table: Take a small bite, “blow up” on the dumpling, then slowly sip the juicy filling from the small hole. It’s posted on the wall in case you forget."
