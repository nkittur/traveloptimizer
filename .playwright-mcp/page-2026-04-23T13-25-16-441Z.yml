            - generic [ref=e2769]:
              - generic [ref=e2770]: The first time I tried the pollo Francese at Chris Bianco’s Arts District pizzeria, our party greedily finished the plate of chicken cutlets, then promptly ordered another. It was an off-menu special, and for weeks (really months) afterward, I dreamed of the chicken. The breasts were pounded thin, coated in panko breadcrumbs, cooked to a golden brown and served in a light lemon sauce that hummed with citrus. Now on the permanent menu, it’s a shining example of what Bianco does best, whether we’re talking about his pizza or hyper-seasonal antipasto plates. He once told me that after sourcing the best ingredients, “you just need to not screw it up.” His pies tend to be minimal, selecting a handful of flavors that deliver maximum effect. The Rosa is a favorite, scantily clad in shaved red onion, a sprinkling of Parmigiano-Reggiano, rosemary and Santa Barbara pistachios. I used to fly to Phoenix to eat Bianco’s pizza (and to visit a dear friend who lived there) at the pizzeria he opened out of a grocery store in 1988. It was the only crust I ever wanted to eat plain, the dough crisp and airy rather than bready, and with a slight but addictive tang. To have Bianco’s pizza in my hometown still feels like such a win. And I still never leave the crust behind.
