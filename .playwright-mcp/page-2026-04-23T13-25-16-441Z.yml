                - text: The line at Holbox during the midweek lunch hour has become a cultural sensation, a queue of locals and visitors trailing past the automatic doors and around the parking lot like devotees angling for the latest iPhone series or limited-release sneakers. Believe the lauds, including ours when we named Holbox as
                - link "The Times’ 2023 Restaurant of the Year" [ref=e6475] [cursor=pointer]:
                  - /url: https://www.latimes.com/food/story/2023-06-13/gilberto-cetina-holbox-los-angeles-times-2023-restaurant-of-the-year
                - text: . Gilberto Cetina’s command of mariscos is unmatched in Southern California – his ceviches, aguachiles and tostadas revolutionary in their freshness and jigsaw-intricate flavors. The smoked kanpachi taco alone — clinched with queso Chihuahua and finished with salsa cruda, avocado and drizzles of peanut salsa macha — is one of the most sophisticated things to eat in Los Angeles.
                - text: Holbox could be considered for the top ranking on its own strength. But in a year when disasters tore at our city, honoring the power of community feels more urgent than ever. Cetina’s seafood counter doesn’t thrive in a vacuum. Holbox resides inside the Mercado La Paloma in South L.A. The mercado is the economic-development arm of the Esperanza Community Housing Corp., a nonprofit organization founded in 1989 that counts affordable housing and equitable healthcare among its core missions. When the mercado was in the incubation stage, Esperanza’s executive director Nancy Ibrahim interviewed would-be restaurateurs about their challenges and hopes in starting a business. Among the candidates was Cetina’s father, Gilberto Sr., who proposed a stall serving his family’s regionally specific dishes from the Yucatán. Their venture, Chichén Itzá, was among the eight startups when the mercado opened in a former garment factory nearly 25 years ago, in February 2001.
                - text: Step into the 35,000-square-foot market today, and the smell of corn warms the senses. Fátima Juárez chose masa as her medium when she began working with Cetina at Holbox in 2017. Komal, the venue she opened last year with her husband, Conrado Rivera, is the only molino in L.A. grinding and nixtamalizing heirloom corn varieties daily. Among her deceptively spare menu of mostly quesadillas and tacos, start with the extraordinary quesadilla de flor de calabaza, a creased blue corn tortilla, bound by melted quesillo, arrayed with squash blossoms radiating like sunbeams.
                - text: Wander farther, past the communal sea of tiled tables between Holbox and Komal, to find jewels that first-timers or even regular visitors might overlook.
                - text: Taqueria Vista Hermosa, run by Raul Morales and his family, is the other remaining original tenant. Order an al pastor taco, or Morales’ specialty of Michoacan-style fish empapelado smothered in vegetables and wrapped in banana leaf. The lush, orange-scented cochinita pibil is the obvious choice next door at still-flourishing Chichén Itzá, but don’t overlook crackling kibi and the brunchy huevos motuleños over ham and black bean puree. The weekends-only tacos de barbacoa de chivo are our favorites at the stand called Oaxacalifornia, though we swing through any time for the piloncillo-sweetened café de olla and a scoop of smoked milk ice cream from its sibling juice and snack bar in the market’s center. Looking for the comfort of noodles? Try the pad see ew at Thai Corner Food Express in the far back.
                - text: The everyday and the exquisite; the fast and the formal (just try to score a reservation for Holbox’s twice-a-week tasting menu); a food hall and sanctuary for us all. Mercado La Paloma embodies the Los Angeles we love.
