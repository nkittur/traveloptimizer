            - generic [ref=e3893]:
              - generic [ref=e3894]: The restaurant feels like the nucleus of downtown Alhambra’s Main Street, with families on the patio entertaining young children, parties in the evening sharing bottles of wine and a boisterous brunch service. The cornmeal mochi pancakes with their lacy edges are reason enough to visit the restaurant that chef and co-owner Chris Yang opened in the summer of 2019. But I was recently reminded of the prowess of the kitchen under Yang and chef de cuisine Elaine Chang at dinner as I marveled at a bowl of tofu caprese. A mass of tofu as soft and plush as a blob of burrata rested in a bracing brown rice vinaigrette with charred Jimmy Nardello peppers and torn shiso. “Secret” Weiser Farms potatoes were pure magic, smashed, fried and dressed in a chile cumin butter crowned with plenty of Yang’s signature chilie crisp. Dry-aged sea bass was grilled and splayed over a bed of chicken fat rice like Hainan chicken. The restaurant spoons black sesame crunch butter onto swirls of soft serve and makes a black sesame cake that resembles the best sticky toffee pudding. If I had the time, and the budget, you’d find me at Yang’s Kitchen twice a week.
