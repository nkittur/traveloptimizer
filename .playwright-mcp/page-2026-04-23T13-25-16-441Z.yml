            - generic [ref=e1870]:
              - generic [ref=e1871]: "Researching a recent guide to the best Thai restaurants across Los Angeles led me to a first meal at Lum-Ka-Naad, a treasure that operates locations (with some slight variations in the name’s spelling) in Encino and Woodland Hills. Only its 21-year-old Northridge flagship, though, consistently has matriarch Ratri Sonbalee and her signature dish, kuah gling krah dook moo. A dryish curry, somewhere between a paste and a sauce, clings to meaty pork spare rib nubs. The flavors stack like harmonies: citrusy high notes from makrut lime leaves, bass tones from earthen turmeric root. Sonbalee grew up in Krabi, a beach town on the western coast of southern Thailand, but she married into a family with roots in the north and the strongest sections of the menu — the ones detailing northern and southern specialties — reflect the union. From the south, look for kanom jeen tai pla, a deliciously potent and herbal soup highlighting smoked and fermented fish. We asked our server to suggest a northern-style noodle dish. He pointed out kang ho, a pan-fried assembly of vermicelli and vegetables, seasoned with Thai-Burmese curry powder, that was originally conceived as a way to use leftovers. Everything tasted impeccably fresh in this version, and popped even more with the addition of shrimp."
