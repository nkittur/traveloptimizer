            - generic [ref=e2811]:
              - generic [ref=e2812]: Patience is a virtue when you’re sitting under the tarp of Delmy’s Pupusas at the Silver Lake farmers market, waiting for your food to reach a temperature that won’t burn your tongue. The walls of the pupusa look like they’re ready to collapse, with bits of cheese and loroco already seeping out the seams. One bite and the pupusa gushes with a molten, gooey mess of cheese and the bitter flower buds native to Central America. You tear away big pieces of the masa, like soft corn cake with crispy brown bits strewn across the surface. With a scoop of curtido and a drizzle of red salsa, it’s pure pupusa nirvana. Ruth Sandoval’s pupusas can be found at numerous weekly farmers markets around Los Angeles, including Atwater Village and Echo Park to name a few. When she started popping up at farmers markets in 2007, Los Angeles was already a city rich with El Salvador’s national dish. Sandoval’s stand apart from the rest, filled with ingredients she often plucks from a surrounding market. And though often brimming with vegetables, chicharron or whatever else is on offer, the ratio never overwhelms the delicate flavor and texture of the masa.
