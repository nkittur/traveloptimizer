              - generic [ref=e5202]: The Mélisse kitchen acts as a proscenium stage, with every table in the dining room facing forward. It’s hidden in a corner of Josiah Citrin and chef-partner Ken Takayama’s restaurant Citrin, accessible through a door that looks like it might lead to an underground rave. Throughout the course of the evening, you’ll likely hear the entirety of a Rolling Stones album. Citrin and Takayama let the seasons guide them through the menu, but almost never take themselves too seriously. The most emblematic dish may be the two-part dirty quail, a take on the dirty chicken Citrin introduced next door and later spun off into a fast-casual restaurant called Augie’s on Main. First is a breast rubbed in tamarind and miso, coated in a crunchy panko crust with Meyer lemon and sweet roasted garlic. It sits in both an orange curry and a black olive caramel. A years-long study may not reveal how the chefs were able to coax that much depth and sweetness from a black olive. The second part involves a perfect tempura-battered quail leg. Even after 26 years (in restaurant years that’s more like 52), Mélisse continues to be whimsical, downright delicious and worthy of any special occasion.
