            - generic [ref=e1289]:
              - generic [ref=e1290]: There are likely hundreds of restaurants offering soondubu jjigae in Koreatown, but I don’t know that you’ll find a version more satisfying than the mini cauldrons served in the modest dining room of Surawon Tofu House. The soup is roiling when it hits the table, a raging inferno of exploding bubbles. The broth tastes long-simmered, kissed with heat and tinged red with gochugaru. Each bowl is crowded with boulders of trembling tofu made by owner Sun Los Lee. She prepares yellow soy bean and black soy bean tofu daily. Both are silky, soft and supple as custard, though the black soy beans contribute an earthy richness with nutty, sesame-like undertones. Her bowl of soondubu jjigae is a one-pot meal you can lose yourself in. The temperature of the soup requires that you take your time consuming, or risk scalding the inside of your mouth. Perhaps order a leek and vegetable pancake, or a plate of glass noodles to enjoy while you wait for the soup to cool down. Never one for patience, the slight burn is more than worth it.
