              - generic [ref=e3588]: In Venice, Panamanian chef José Olmedo Carles Rojas pulls off the rare-for-L.A. feat of reimagined Central American flavors in a finer-dining setting. What does that look like exactly? Translucent snapper carpaccio, splayed over a terra-cotta plate to resemble a jagged continent as seen from space. Warm salt cod fritters with dots of red pepper aioli speckling its pale landscape. Surf clam ceviche arrives in the mollusk’s shell, doused in leche de tigre green with extra-citrusy culantro and lined with ruler-straight plantain chips. Steamed kanpachi filet nestles in a banana leaf, adding deeper herbal qualities to the paste of makrut lime leaf, Thai basil and culantro smeared over the fish’s custardy surface. In dish after dish, flavors register as potent and elegant. Same with drinks. High on my list of L.A. cocktails is the Ninth Parallel, a blood-red Zombie variation involving Oaxacan, Haitian and Nicaraguan rums, absinthe, cherry, lime, passion fruit and espresso from Menotti’s. (The last ingredient is a nod to Si! Mon partners Louie and Netty Ryan, who also own the nearby coffee shop.) Given how the concoction can be guzzled with dangerous ease, the restaurant specifies a maximum of two per person. Prudent, and all the more reason to return soon.
