              - generic [ref=e3187]: "Zach Pollack recently closed his two East-Central L.A. restaurants — experimental, pasta-leaning Alimento in Silver Lake and pizzeria Cosa Buona in Echo Park — decamping to the opposite side of the city to try his hand with a different crowd. So far, so good in Santa Monica: Cosetta’s small, peachy-colored dining room and sprawling heated patio has appealed equally to families, raucous groups of friends and couples in their date-night bubbles. Credit the persuasive powers of pizza, the menu’s nucleus. The kitchen crew bakes pies formed with thick, bready rims. They excel at transforming chain staples like the Hawaiian or supreme pizza into sophisticated pleasures using higher-brow toppings. Longtime Pollack fans will recognize some greatest hits. Cosa Buona’s exceptional smoked mozzarella sticks reappear, as stretchy and crunchy as ever. I note his Caesar incorporating chicory lettuces, as is the fashion, and then remember he served them that way at Alimento for a decade. One new favorite from the raw bar: sliced scallops, each dotted with a Marcona almond that resembles a cyclops’ unblinking eye. Among the small selection of mains, look for sand dabs fried Milanese-style over a generous splotch of caper-olive tartar sauce. For Pollack, Cosetta has turned out to be a wise, reenergizing move."
