                - generic [ref=e6230]: "My most enduring recommendation for a once-in-a-lifetime indulgence in Los Angeles? The seven-seat sanctuary in Row DTLA where, for seven customers five nights a week, Brandon Hayato Go and his tiny crew choreograph three-hour meals. Modernizing two traditional forms of Japanese dining, kaiseki and kappo, Go stands at the counter’s center, wielding knives and chopsticks to assemble small dishes of seafood, much of it direct from Japan’s waters, in practiced, poetic flow. Go, who began working at his father’s sushi restaurant in Seal Beach when he was 15, carries himself with disarming charm. Diners’ shoulders relax in front of him. He stays on course, pausing to describe clusters of corn tempura, or simmered abalone, or cloudless soup showcasing an orb of crab meat, but he’s also happy to veer off. He’ll riff on L.A.’s dining scene, his most recent travels through Japan, his obsessions with rare sake and Champagne (which translate into a mind-expanding beverage list). Go is at once superhuman master chef and the guy with good hair you chat with while in line for coffee. To experience his wondrous paradoxes, there are costs: The expense of perfect ingredients has driven the price of dinner per person up to $450, and reservations are nearly impossible. And still I say: Add your name to the monthly waitlist on Tock. Persevere. Jump when your chance arrives. It’s all worth it."
