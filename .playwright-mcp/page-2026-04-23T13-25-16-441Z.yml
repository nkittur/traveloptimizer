            - generic [ref=e6179]:
              - generic [ref=e6180]: Michael Cimarusti, along with partners Cristina Echiverri and Donato Poto, were crucial in establishing Los Angeles as a world-renowned dining destination when the three opened their Melrose Avenue restaurant in 2005. A recipient this year of three Michelin stars and a spot on the first-ever North American World’s 50 Best, Cimarusti is quick to credit his stellar staff, which includes longtime chef de cuisine Tristan Aitchison, bar director Kim Stodel and wine director David Osenbach. You could say he’s spent the past 20 years leading a team of restaurant avengers, with Poto as the beating heart of the operation. Often the first and last face you see at Providence, Poto succeeds in orchestrating a level of hospitality unrivaled elsewhere in the city. He remembers where you like to sit, the name of your favorite football team and he won’t hesitate to invite a budding gourmand into the kitchen to meet the chefs. The city’s fine-dining scene has come a long way in the last two decades, but Providence is still a beacon of excellence. Cimarusti continues his devotion to sourcing sustainable seafood, preparing it in ways that both celebrate and accentuate whatever is on the plate. Recently, I was taken with a dry-aged Japanese kinki grilled over charcoal until the fish’s flesh was resplendent with its own juice and fat, hidden under a tile of crispy skin. Underneath were creamy cranberry and Romano beans drizzled with fig leaf oil made from trees just outside the restaurant. Despite all the accolades, the staff continues to push itself with a bean-to-bar chocolate program and the production of honey from a bee yard on the rooftop. “We don’t make money,” says Poto during a recent dinner, referencing the time and care it takes to manage the bees. “But it makes a difference, and we love it.”
