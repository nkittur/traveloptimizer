            - generic [ref=e1380]:
              - generic [ref=e1381]: "The strip malls of Artesia along Pioneer Boulevard, particularly between 183rd Street and Park Avenue, are home to our richest density of regionally specific Indian restaurants. Where to plunge in first? Consider the place where decisions are easiest. Traffic crawls along maddeningly through these blocks, but Rajdhani sits on the second floor of a parking structure where a few spots can be found even on the most crowded weekends. The restaurant serves only a Gujarati-style vegetarian thali in two formats: a single serving, or all you can eat. Choose the latter, and servers place a silver tray in front of you and begin calmly swarming. They deliver mixed vegetable pakoras with chutneys and dhokla (a savory-sweet, canary-yellow cake made with chickpea flour) as opening snacks, followed by griddled roti, puffed puri, kadhi (warmed spiced yogurt), rice if you ask and, finally, a variation on dal and two sabzi (cooked vegetable dishes) that change daily. A Wednesday might bring turiya patra — an earthy combination of juicy-crisp ridge gourd and soft rolled taro leaves with a rustling texture, often served at weddings in Gujarat — and the next day will be undhiyu, a mix of winter vegetables sparked with green chiles and dusted with grated coconut. The meal includes dessert: I suggest silky, warm carrot halva, or shrikhand, thickened yogurt perfumed with saffron and cardamom."
