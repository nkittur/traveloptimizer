            - generic [ref=e4232]:
              - generic [ref=e4233]: Splicing Mexican flavors into central Texas’ beefy traditions, Andrew and Michelle Muñoz lead the school of thought around modern Los Angeles barbecue. Andrew’s brisket, perfumed by smoldering California white oak and slowly rendered to an ideal trembling texture, sets the local standard. Michelle’s sausages, particularly the one speckled green from roasted poblanos and oozing queso Oaxaca, follow closely. Street-corn-style esquites and mac and cheese are each creamy and punchy. Four years have flown by since the couple opened Moo’s in Lincoln Heights, and I come as often to share a tray of meats and sides with a group as I do for a solo meal at the bar, choosing perhaps a triple IPA among over a dozen styles of beer on draft. Alone, I’m fixating on the burger, a blend of smoked brisket, short rib and other cuts ground and formed into thick patties crusted with crushed black pepper. The classic version sports a crunching slice of white onion and melting American cheese; the “Rampart” arrives with cumin-scented chili and diced onions sliding down its deliciously wobbly circumference. Either one requires fries.
