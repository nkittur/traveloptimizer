                - generic [ref=e5841]: The dining room at n/naka offers a profound sense of intimacy absent from even the smallest chef counters in town. And it has little to do with its size. Chefs and co-owners Niki and Carole Iida-Nakayama manage to create the feeling of being invited into their home, with dinner presented as a uniquely personal snapshot of dining in Los Angeles at this exact moment in time. The two still grow what they can for the restaurant in their front yard. Their zensai course, one of the highlights of the kaiseki experience, involves small, hyper-seasonal dishes prepared to honor the individual ingredients. Recently, watermelon mochi was presented as a giant raindrop. Tomatoes from the chefs’ garden were taut and sweet. That evening’s mushimono, or steamed course, took the form of a soft, luscious dumpling in a tomato dashi with Dungeness crab and basil. Diners can commit to a full beverage pairing, though servers are adept at making smart recommendations for single glasses of sake or wine. Both the food and beverage offerings change regularly, but the spaghetti tangled in creamy mentaiko sauce with abalone is one dish you can always count on. “Or people would protest,” says our server. I would be one of them.
