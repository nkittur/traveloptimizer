            - generic [ref=e4886]:
              - generic [ref=e4887]: On a recent Friday evening, the dining room at Abdoulaye Balde and Marcus Yaw Johnson’s Inglewood restaurant is gripped in communal exuberance. Diners are dressed for the occasion and the newly renovated space feels like a party I very much want to be at. Late in 2024, Two Hommés reopened after a remodel by cookbook author, designer and pop-up chef Kiano Moju, who transformed the dining room into a romantic, elegant space with light fixtures imported from Ghana and West African art on the walls. Balde and Johnson are still channeling West Africa through a Southern California lens, with plates like the eight-hour braised short ribs or fried catfish filets draped over mounds of jollof rice. The za’atar zucchini on a bed of cream spiked with shito, the Ghanaian hot pepper sauce, is just as revelatory the fifth time I eat it. And with the new digs came an expanded crop of dishes to crave. A salad of crab meat cascades over a plate of panko-crusted fried plantains, the crab’s cool temperature and marine sweetness contrasting beautifully with the warm, boorish starch of the fruit. Crumbles of spiced lamb sit atop a velvety white bean hummus punctuated with swirls of shito and yassa, a sweet, tangy onion sauce that’s a staple in West African cuisine. The accompanying flatbread is puffy and striped with smoky tracks from the grill. But the menu additions I’m most excited about arrive at the end of the meal. A sweet potato churro curls into itself over a bed of candied sweet potato. And a sticky toffee cake is reimagined with plantains, a heavy drizzle of bourbon sauce and a smattering of plantain chips. I told you it felt like a party.
