            - generic [ref=e1331]:
              - generic [ref=e1332]: "Lamb shank, lamb ribs, lamb skewers, lamb bone soup, rice glossy from rich lamb stock: That’s basically the menu at M Joy in San Gabriel, the second U.S. location (after first opening in Anaheim) of a fast-casual chain based in Hangzhou, China. Even if lamb is not your jam, this could be the place that flips your opinion. The restaurant imports lean, grass-fed lamb from New Zealand, and the shank in particular, served over rice flecked with soft bits of carrot, is the mildest, most lulling possible presentation of the meat. Condiments — burgundy-red chile oil, pickled onion spears, shredded carrot salad for crisp contrast — introduce vivid dimensions. Fundamentally, the dish is a deconstructed riff on lamb pilaf traditions closely associated with the Uyghur people of China’s Xinjiang province, once the easternmost terminus on the ancient trade routes that stretched to what became Istanbul and Italy. For more direct spice, order the grilled ribs crusted with cumin and chile flakes, quelling the heat with sips of salted milk tea and yogurt studded with raisins for dessert."
