              - generic [ref=e1913]: Earlier this year, David and Maria Ramos closed the original, 15-year-old location of their Oaxacan restaurant to focus on the new, much larger Casa Gish Bac in Pico Union. Set in a former banquet hall with a full liquor license, the space has a rainbow ceiling covered in papel picado. The menu should be familiar to longtime fans of the Ramos’ Valles Centrales cuisine. Tlayudas blanketed in refried beans, quesillo and cabbage. Chicken buried under mole negro. Enchiladas filled and folded into triangles and doused in a red mole with a deep, almost bitter roasted chile flavor. Go with a group and order generously. And plan to visit on a weekend if you want a taste of the barbacoa blanca; pit-roasted with avocado leaves, it’s tender and succulent, with subtle notes of garlic, cumin and anise. Maria, a third-generation barbacoa specialist, offers her barbacoa roja daily, redolent of tomato and dried chiles. The new Casa Gish Bac is just as charming as the original, only now you can order a cold beer to sip while you demolish that tlayuda.
