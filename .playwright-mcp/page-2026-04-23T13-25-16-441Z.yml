            - generic [ref=e2340]:
              - generic [ref=e2341]: In the evenings, the downtown branch of Vivian Ku’s Taiwanese restaurant has a line running out to the sidewalk and a dining room buzzing with diners passing popcorn chicken, pan-fried pork buns and fiery mapo tofu across the tables. Breakfast at the restaurant can feel more like a sacred affair. Ku’s congee is warm and comforting, with a texture that celebrates each grain of koshihikari rice. Crowned with bits of soft yam and a slab of pork belly, the humble bowl of porridge is transformed into something extravagant. It’s served as a set alongside a pan-fried omelet with salted turnips; a handful of peanuts tossed with tiny, salty anchovies; crunchy cucumber salad; and fermented tofu that has the funk and creaminess of your favorite aged cheese. Ku’s thousand-layer pancake has become my favorite version of a breakfast wrap, with the flaky pastry folded around soft eggs, melted cheese, Thai basil and a mild chile sauce. Her savory soy milk is like a bowl of warm tofu custard, studded with bits of pork floss, crispy youtiao and preserved greens. With a warm cup of black sesame soy milk, breakfast at Pine & Crane is easily the most important meal of the day.
