            - generic [ref=e2485]:
              - generic [ref=e2486]: I want to live in Takoría, Josef Centeno’s self-described “bizarro” take on a taqueria. It’s a land where the Slayer is a massive calzone bursting with four cheeses and Italian duck sausage. Where golden queso cascades down a tower of fresh tortilla chips during Super Nacho Hour. The birria is a chile-laced vegetable stew crowded with mushrooms, chickpeas and baby turnips. A seasonal salad consists of caramelized figs tangled with bits of fried panela cheese, torn potato croquetas and salsa macha. The Negroni is made with mezcal. And where Dos Caras are two-faced tacos with a cheese-encrusted shell on one side and a perfect, mottled flour tortilla on the other. The tacos share a name with Dos Caras, a decorated luchador popular in the 1970s and ‘80s. Was this intentional? I hope so. Earlier this year, Centeno reimagined the restaurant, keeping with the San Antonio-inspired Tex-Mex throughline but side stepping to something a little off kilter, and undeniably delicious. You can still ask for his signature puffy taco, the airy fried shell filled with a variety of toppings. Only now, you can order a giant fried tortilla pocket stuffed with duck guisados smothered in queso called the quesorritto, too.
