              - generic [ref=e3235]: "Jill Bernheimer, who opened vital wine shop Domaine L.A. in 2009, and hospitality ace Julian Kurland have created a Melrose Hill haven that cleanly splices the definitions of “wine bar” and “restaurant” for Angelenos. Looking to swing by somewhere informal but sleek for a drink or two? Behold the silvery zinc bar that dominates the room, with seating for 22 around its mod oval contours. The by-the-glass list leans French and Italian, with a couple of nonalcoholic wine and beer options among them. Kurland is the coolest, most approachable guide through the bottle list: Engage him and he will invest to find something in your price and taste to make you happy. Chef Travis Hayden understands the assignment: His cooking mirrors the prominently featured wine regions (European, with a smattering of California) and is varied, substantial and accomplished enough to make Bar Etoile a true dinner destination. Given the innate affinity between wine and cheese, a sly dairy theme runs through the menu. A custardy dense cheese tart made with nutty Pleasant Ridge Reserve and dusted with chive powder is the can’t-miss dish. Match it with buttermilk-poached trout rillettes scooped using handsomely rumpled house-made chips and a seasonal salad like peaches and tomatoes covered in curls of Prairie Breeze cheddar. An entree of rotisserie chicken pairs equally with a geeky oxidized Jura or a juicy Pinot Noir from Oregon."
