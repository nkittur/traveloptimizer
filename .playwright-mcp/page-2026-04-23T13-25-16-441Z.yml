              - generic [ref=e3285]: Part of David Chang’s Momofuku group of restaurants, Majordomo has been a destination near the edge of Chinatown since it opened in a sprawling warehouse in early 2018. And it’s ascending to new heights under the leadership of executive chef James Bailey. Longtime favorites like the pot of mushroom crispy rice, whole plate short ribs and the boiled chicken are flawless. A tomato salad is a tomato salad, until you’ve tried the one at Majordomo. Only available when in season, your bowl may be filled with tiny sweet orange or cherry tomatoes interspersed with wedges of big, juicy heirlooms. They lounge in a sherry vinaigrette that’s both sweet and tangy, rounded out by warm sesame oil and a little soy. My most recent bowl featured peak-season stone fruit and plenty of minty shiso. The platter of boiled chicken has become my go-to comfort food, served in two parts during the meal. The first is a plate of chicken rice bolder and punchier than what you might find elsewhere, with both fiery domojang (chile garlic condiment) and a ginger scallion sauce spooned over the top. The second is a soul-nourishing bowl of soup made from the bones. It will likely provide leftovers for a week.
