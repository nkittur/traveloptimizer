            - generic [ref=e3334]:
              - generic [ref=e3335]: The dining room at Henry’s is dominated by large circular tables. The kind of seating you want when the meal is a family affair, with platters of tiger prawns over glass noodles, whole lobster under a mound of crispy garlic and Vietnamese-style cubed filet mignon being passed across and rotated around the lazy Susan. Rather than focusing on a specific region of China, founders Henry Tu and Henry Chau embrace a swath of culinary traditions from throughout Asia. Sichuan fried chicken is buried under a deluge of dried chiles. Vietnamese-style black pepper fried fish is shellacked in a light, sweet glaze hot with black pepper. The steamed pork and salted fish patty reminds my Cantonese mother of the one her grandmother learned to make in Guangzhou. The variety is more comforting than overwhelming. And despite the sizable menu, the same dishes seem to find their way onto every table. Honey garlic pork chops are speckled in bits of fried garlic as sweet as candy. Deep-fried salted pigs feet are cloaked in tiles of crispy skin that shatter like glass. There may be an order of pigs feet on each table, but unless you want to fight like family, I’ll be ordering two.
