            - generic [ref=e2582]:
              - generic [ref=e2583]: Nearing its 20th anniversary in 2027, Osteria Mozza is comfortably ensconced as the city’s gran dama of Italian restaurants. When Nancy Silverton embarked on its opening, in tandem with Pizzeria Mozza next door, she entered the third act of an extraordinary career as chef and restaurateur, building her brand as a global culinary ambassador while continually overseeing new projects in Los Angeles — most recently among them the Larchmont diner Max and Helen’s in partnership with Phil Rosenthal. The heart of the osteria has always been the mozzarella bar, where variations from the trembliest burrata to smoked bulbs made from buffalo milk seem to defy nature’s laws in their suspension between cream and cheese. Mixed and matched with, say, mild dried cruschi peppers and garlic toast, or set over braised leeks punched with mustard vinaigrette and breadcrumbs, they remain the meal’s highlight. Mozza’s cultivated sense of timelessness — ricotta raviolo bleeding its heart of runny yolk, the rosemary olive oil cakes and lemony torta della nonna for dessert, the Italian wine list of biblical proportions — has long kept it germane in L.A.’s overdrive dining culture.
