            - generic [ref=e5739]:
              - generic [ref=e5740]: Dinner at Dave Beran’s year-old fine dining restaurant invites diners to explore where seasonality and surrealism collide. The flavors of roasted banana and eucalyptus on a recent autumn menu, for instance, are unlikely bedfellows under a braised and charred leek as decadent as a piece of Wagyu. In the middle of dinner, you venture into the kitchen to watch the chef dip a fresh mustard green into passion fruit, then flash freeze the two. The fruit creates a delicate sheen of ice that cracks, then melts, meant to mimic the frozen dew on a forest leaf. It’s a course that envelops you in a crisp, cool fall morning. Braised short rib in a mushroom and prune ragout echoes the prized, sticky bits of charred pot roast at the bottom of a pot, accented with the peppery bite of roasted calendulas. It’s an homage to comforting moments Beran spent with his grandmother. The last bites of her roast. Her fondness of potpourri. It’s a cohesive and playful journey, with courses as crave-able as your own childhood favorites. Beverage director Matthew Brodbine’s wine and nonalcoholic pairings keep pace with the menu beautifully. I’m looking forward to experiencing all of the upcoming seasons through Beran’s point of view.
