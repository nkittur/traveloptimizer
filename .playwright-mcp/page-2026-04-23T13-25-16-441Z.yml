            - generic [ref=e1823]:
              - generic [ref=e1824]: "Food obsessives love to fight over pho, and the Little Saigon community in Orange County gives us limitless points for debate. Jenn and I agree on our top choice: Phởholic, Gordon Pham’s venture that began in 2015. He adapted the restaurant’s broth recipe from the pho shops his family ran in Vietnam, and it lands in the sweet spots: beefy yet bright, rich but not oily, and with warm, complex spices rippling through each spoonful without bulldozing over subtler flavors. Fans like to point out the rare (and sporadically available) addition of citrusy-musky ngò ôm among the usual herb garnishes. I come with someone willing to share and order two bowls: the No. 8, with two cuts of flank steak (I sometimes ask for meatballs for more texture), and the blowout No. 16 with deliciously Jurassic hunks of beef shank and oxtail. Outposts exist in Costa Mesa and Stanton, but head first to the original restaurant in Westminster, where the energy is always high and, even when crowded, the turnover is fast. Not sure who needs to hear this, but we can vouch that the Westminster location also sells several plush Labubu figures at the register."
