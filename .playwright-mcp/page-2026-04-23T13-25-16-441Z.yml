                - generic [ref=e4526]: "A South Korea-born chef achieving global praise for his perfectionistic take on Japanese-Neapolitan pizza at a minimalist 18-seat restaurant in Pico-Robertson? Pizzeria Sei is the promise of Los Angeles fulfilled. William Joo, who runs the business with his wife, Jennifer So, brings an ever-questioning obsessiveness to his style of crust. Baked in an oven smoldering with almond wood, his puffed, starburst-shaped pies have always achieved smoky char, but after nearly four years in business the texture is airier, and more satisfyingly chewy with slight crispness. This base can support ingredients as simple as fior di latte perfumed with preserved lemon and basil, or as complex as lamb sausage blitzed with crème fraîche, smoked provolone, bell peppers, shallots, cherry tomatoes popped from heat and a lashing of spice that includes tingling Sichuan peppercorn. There’s a clear winner, though: the Margherita Special painted with acidic-sweet tomato sauce and dotted with imported buffalo mozzarella, a masterwork of simplicity. Its supremacy alone is likely why the Italy-based Top 50 Pizza organization ranks Sei as the No. 2 pizzeria in the United States and No. 9 in the world. We think the place is pretty great too. That said: reservations are hell, and walk-in space is very limited."
