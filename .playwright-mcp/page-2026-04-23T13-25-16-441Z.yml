            - generic [ref=e4585]:
              - generic [ref=e4586]: What do we really mean when we talk about fine dining? At Yassmin Sarmadi and Tony Esnault’s Costa Mesa restaurant, it’s a state of mind ingrained in every facet of the experience, from the elegant dining room to the way the components on each plate resemble the finest edible art. Precise, tiny squares of Weiser melon swim in a Champagne foam. Generous hunks of succulent lobster are surrounded by dollops of a sauce made from Brentwood corn, its sweetness all-encompassing, then fleeting. One glance into the open kitchen and the space is as immaculate as the plates before me, a serene calm enveloping the chefs as they work. Knife Pleat can be experienced as a longer or abbreviated tasting menu for dinner, a three-course prix fixe or tasting menu for lunch, as Saturday afternoon tea service or an à la carte menu at the bar. It’s celebratory at any hour, with a variety of caviar on offer and a beverage program updated nearly as often as the menu. Available for both lunch and dinner, Esnault’s Sistine Chapel is his legumes de saison, an elaborate presentation of seasonal vegetables, their varying colors and shapes all huddled together in the center of a stark white plate. The baby corn, squash, asparagus, radish, tomato and half a dozen other vegetables are all prepared to accentuate their individual flavors. Summer is encapsulated in the sweetness of a tomato. The snap of the green bean boasting the vitality of the vegetable at this precise moment. It is maximum pleasure on a plate, at a restaurant that epitomizes whatever your definition may be of fine dining.
