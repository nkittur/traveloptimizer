            - generic [ref=e1778]:
              - generic [ref=e1779]: "Terrific Ethiopian restaurants thrive throughout Los Angeles: Aunt Yvette’s Kitchen in Eagle Rock and Queen of Sheba in Inglewood are two neighborhood favorites. But the block of buildings on Fairfax Avenue between Olympic Boulevard and Whitworth Drive, designated Little Ethiopia by the City Council in 2002, is our treasure trove for the cuisine. Tenagne Belachew worked in several of the area’s restaurants before opening her own place with her seven children in 2015. For overall consistency, with a menu available for lunch or dinner that’s broader than most of its counterparts, Lalibela stands apart. Build any meal around the 11-dish “veggie utopia,” elegant in its chromatic wheel of salads, simmered vegetables and profoundly spiced lentil purees spread over injera. On the opposite end of the food chain, I’m especially keen on beef in traditional, barely cooked forms. “Special kitfo” is beef tartare glossed in butter infused with mitmita (a rounded, cardamom-forward spice blend) and matched with fluffy curds of fresh cheese and pureed collards. Roughly chopped onion and jalapeño give crunch to a Somali version of kitfo. Gored gored, not often seen on local menus, varnishes cubed beef with mitmita and a second, intensely chile-forward spice paste called awaze. To drink? Tej (honey wine) or a bracing cup of Ethiopian coffee, sugar optional."
