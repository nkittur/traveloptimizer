              - generic [ref=e6085]: "What makes Antico Nuovo the finest Italian restaurant in Los Angeles? Chef and owner Chad Colby puts in the research to master lesser-seen dishes, and he adapts more standard ideas in ways that renew their essence. In a summertime salad, marsala and basil exaggerate the honeyed qualities of ripe plums and nectarines. A crackling balloon of focaccia, airier and bouncier than any other in town, is a vehicle for swiping through squiggles of whipped ricotta speckled with pistachio pesto, anchovies set over a stinging green sauce and piped Normandy butter buried under shaved bottarga. The focus is wider than any one region of Italy, but chef de cuisine Arturo Rojas and his team oversee a unifying sort of farm cooking where every cut of animal shows recognized value. That’s especially true of the centerpiece pastas: foglie d’ulivo (a shape that resembles olive-tree leaves, dyed appropriately with the juice of greens) with smoky flecks of roasted squab and halved olives; a ragù Bolognese of silky beef cheeks and veal tongue that entangles pappardelle in meaty depths; tiny, ridged plin dell’ Alta Langa sauced in meat drippings and spectacular with the optional addition of crisped sweetbreads. Let me not forget the ice creams: unusually silky and so complex they hit the palate like sophisticated sundaes. Antico also serves a cannoli that rivals the ones I crunched through in Sicily."
