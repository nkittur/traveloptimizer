              - generic [ref=e6035]: “Is this Koreatown upstart the future of fine dining in L.A.?” read the headline for a review I wrote in 2023 of Kinn, a tiny tasting-menu restaurant where Kiyong “Ki” Kim presented his California produce-driven vision of modern Korean cooking in five assured courses. Kinn closed suddenly later that year and Kim regrouped. In January, he introduced 10-seat Restaurant Ki in a Little Tokyo office building, hidden in the same subterranean warren as Sushi Kaneyoshi. At Ki, the future has indeed arrived. With a longer, more meticulous menu glinting with luxury ingredients, Kim bridges the traditional and casual Korean cooking that has defined the cuisine in Los Angeles for decades with the higher-end modern movement booming in places like Seoul and New York. In a dozen or so courses, Kim and his team prepare dinner for guests seated at a long counter. The tone zigzags between hypnotic pleasers and easy-to-love experimentalism. A warming bowl of noodles in seafood broth, laced with eel and Dungeness crab meat, might be followed by grilled lobster tail served in beurre blanc deepened with doenjang (fermented soybean paste) and dusted, playfully and winningly, with dried raspberry powder. Kim’s love of wine shows through in the tightly harmonized beverage pairing. The soundtrack of 1980s-era soft R&B hits strikes a wonderfully dissonant nostalgia in this Gen-Xer, and emphasizes the unstuffy mood to the whole experience. Ki is the year’s highest-ranking debut, a heartening reemergence of one of our freshest culinary voices.
