              - generic [ref=e5305]: Angelenos often talk of the synergy between Mexico City and Los Angeles. A shared vibrancy and appreciation for our people and cultures. That connection is ever palpable in the dining room at Damian, the sprawling downtown restaurant opened by Mexico City’s acclaimed Pujol chef Enrique Olvera. During a recent dinner, my server explained that the carrot aguachile is an homage to the fruit cups sold by street vendors all over both cities. Gossamer ribbons of carrot, pickled pineapple and jicama are layered to create a mountain of sweet fruit on the plate. Hidden like buried treasure are pieces of shrimp and scallop sourced from Sinaloa, dressed in a mandarin kosho with splotches of habanero oil. There’s a wallop of acid and a rumble of heat, each spoonful balanced with the sweetness of the fruit. The street-food reference clicks and I’m reminded of the countless cups doused with fresh lime and Tajín purchased over the years. There seems to be an “ah-ha” moment with many of chef de cuisine Jesus “Chuy” Cervantes’ dishes, the yin-yang of flavors and textures sparking memories of thick, oblong huaraches in an outdoor market in Mexico City alongside visions of the ones I love best in South Gate. Damian is the best of both worlds, in a converted warehouse in the Arts District with valet parking.
