            - generic [ref=e5656]:
              - generic [ref=e5657]: "Jordan Kahn opened his daytime Culver City restaurant nearly a decade ago, serving intricately layered breakfast and lunch dishes as pleasurable to eat as they are astonishingly beautiful. The arrival of Kahn’s nearby tasting-menu opus Vespertine in 2017 overtook the conversation around him, though it isn’t as if Destroyer fell into secrecy: It’s always busy, a mainstay of the Hayden Tract community and the tech companies that fill its Eric Owen Moss-designed buildings. You can swing by to pick up a pain au chocolat or a handsome mini sesame-carrot bundt cake (Kahn began his career as a pastry chef and his chops are on fine display here) with a sparkling espresso or sweet potato latte. The composed plates are a window into Kahn’s virtuosity for a fraction of the cost of Vespertine. A sweet potato waffle slips into new dimensions with orbiting garnishes of smoked prosciutto, pepper jelly, goat cheese and other savory-sweet elements. Smoked fish arrives in a ceramic bowl, obscured under whipped yogurt, pickled celery root, dill and savory onion granola. It sounds wild and weird until your brain signals “everything bagel with lox,” but with more entertainment for the teeth. There’s nothing else like it in California. Maybe anywhere."
