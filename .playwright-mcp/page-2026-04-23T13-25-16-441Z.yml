              - generic [ref=e2246]:
                - text: Last Word Hospitality is behind some of the most sought-after restaurants in Los Angeles, with venues that feel like instant, indispensable neighborhood staples. Found Oyster, Ari Kolender’s cozy seafood restaurant, is the group’s shining star, a catalyst for what is now a bustling block of Fountain Avenue in East Hollywood. Since opening in 2019, it’s been a destination for anyone in search of the freshest raw bar selection and a concise menu of seafood classics. There’s New England-style chowder, a wedge salad with smoky bacon, and a fried cod sandwich. The sliced raw
                - link "scallops over a crunchy tostada" [ref=e2247] [cursor=pointer]:
                  - /url: https://www.latimes.com/recipe/found-oysters-scallop-tostadas-with-yuzu-apple-vinaigrette
                - text: with yuzu kosho, apple and fragrant basil may be the most compelling example of Kolender’s consistently flawless execution of anything culled from the sea. The atmosphere often feels like a boisterous, tiny house party, with patrons elbow to elbow at the counter, slurping oysters, peeling Old Bay-coated prawns and sipping Champagne. Look to the chalkboard menus found both outside and above the counter for daily specials. Depending on the season, there may be a hot, soft-shell crab sando with fennel slaw. If you spy razor clams, cooked on the plancha in smoky Espelette butter, order them.
