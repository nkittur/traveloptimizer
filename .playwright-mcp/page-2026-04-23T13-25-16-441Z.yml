            - generic [ref=e3843]:
              - generic [ref=e3844]: No matter what time of year you might be reading this, set a reminder on your calendar app to make a reservation for Rustic Canyon in late August or early September. Year-round, the restaurant’s menu changes almost daily, fluctuating with the moment’s bounty from the twice-weekly Santa Monica Farmers Market a mile away. In high summer, though, the cooking — guided by chef-owner Jeremy Fox and chef de cuisine Elijah DeLeon — particularly exhilarates, when the given greatness of the raw product inspires quick-witted flavor combinations. This year DeLeon filled halved greengage plums from Andy’s Orchard with a cherry paste that cleverly pays homage to Mexican chamoy candy. Charcoal-grilled Jimmy Nardello peppers were paired with hunks of ripe white peach and dusted with fennel pollen, a garnish that can seem precious but here added the right licorice nip. White cheddar blanketed earthy-sweet corn kernels and snipped shishito peppers, a feel-good riff that fell somewhere between Midwestern creamed corn and Korean corn cheese. Two weeks later those dishes were gone, and scanning the newest menu online I wished I could plunge into just-arrived Mirabelle plums scented with basil and vanilla bean, followed by a pork chop surrounded by figs and purslane.
