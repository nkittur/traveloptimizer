              - generic [ref=e5100]: Since 2013, the 4th Street flank of the Farmers and Merchants Bank Building in downtown Los Angeles has housed a 35-seat restaurant so calm inside that diners with reservations sometimes miss the entrance. All the way back, in full view of the handsomely minimalist dining room, Josef Centeno quietly commands the open kitchen. Without ever sidestepping the premise of Orsa & Winston, which aims to weave together the cuisines of Japan and Italy, Centeno uses the structure as a flexible framework for his global-minded imagination. Lately the menu is five courses, shaped around seafood and vegetables for $150 per person, including several small extras (a cup of chawanmushi typically kicks off the meal) and an optional add-on, the citrusy rice porridge steeped in Parmesan cream and lately gilded with grilled prawns, uni and caviar. Your meal won’t look like mine, but through plates of sharply seasoned crudo, small bowls of rich pasta and elaborately sauced fishes, you’ll catch the same creative throughlines that have kept Centeno — and those of us lucky enough to know his cooking — engaged for the last dozen years. Count on longtime server and sommelier Romain Racary to share in-the-know stories about the wines he’s pouring in his melodic Parisian accent.
