            - generic [ref=e3940]:
              - generic [ref=e3941]: Mini Kabob is the little shop that could, a tiny storefront surrounded by auto repair shops in Glendale where people travel from all over the world for a pair of beef cutlets. The Martirosyan family has been serving the city’s most sought-after grilled meats for nearly 40 years. It’s quite the feat when referring to an area that’s home to the largest diaspora of Armenian people in the country, where restaurants pushing kebabs occupy nearly every corner. The decades are a testament to the dedication and skill of proprietors Ovakim, Alvard and their son Armen. Under their watchful eyes, lamb chops are imbued with spice and plucked from the grill at the exact moment the fat caramelizes and the meat reaches optimal tenderness. The marinade and cook time are so precise, cutlery and condiments are rendered irrelevant. Earlier this year, Armen sent Los Angeles food obsessives into a frenzy when he introduced a grilled chicken thigh “Cesar” wrap (that’s not a typo) teeming with chicken, falafel croutons and Caesar dressing all wrapped up in a griddled Mejorado tortilla. It’s available in limited quantities during the week for pre-order. Ask for an extra cup of the Aleppo pepper toum for dipping. It’s a garlicky wonder condiment, the color of a tropical sunset, that will inject life into anything in your fridge.
