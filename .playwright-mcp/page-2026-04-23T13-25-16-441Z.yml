            - generic [ref=e4282]:
              - generic [ref=e4283]: "Nancy Silverton’s Osteria Mozza and Pizzeria Mozza rule the southwestern corner of Highland and Melrose, but I recommend Chi Spacca, her third restaurant there, most often. At 12 years old, the tiny place still bounces with a mutability that’s less predictable than its older siblings. Silverton’s pastry-god stature also strongly manifests here in savory contexts. I will always follow a predictably gorgeous salad with focaccia di Recco, a crackery, stretchy-cheesy flatbread with Ligurian origins that she obsessed over for years to perfect. Savory pies — chicken pot pie, lamb shepherd’s pie and a hearty marrow-laced variation featuring beef cheek and mushrooms — dip into British traditions, most of them flaunting bronzed, flaky dream crusts. Meat cookery, until recently overseen by Armen Ayvazyan and now under executive chef Alisa Vannah, remains the menu’s nucleus. At my most recent dinner, the menu highlighted a whole oxtail: tapered, riddled with meat, smeared with coarse chermoula and served with pickled shallots to slice through all the unctuousness. It was magnificent, as was a custardy slice of blueberry-brown-butter tart for dessert."
