              - generic [ref=e6385]: "The most exceptional fine-dining restaurant in Los Angeles, Kato excels in every aspect thanks to a Justice League assembly of talent. Jon Yao leads the team, transforming the Taiwanese dishes he grew up loving in the San Gabriel Valley into dishes of ultra-fresh seafood, spice-braised meats and intricate salads that are equally soulful and technically rigorous. Ryan Bailey, who co-owns the restaurant with Yao, has amassed a wine list of nearly 3,000 bottles; trust him, while popping a cork or describing a pairing, to impart his joy in the subject free of pretense. Bar director Austin Hennelly is a scholarly genius. His nonalcoholic program alone is moving the needle on zero-proof cocktails and dealcoholized wines on a national stage. Managing partner Nikki Reginaldo leads an ever-more-erudite staff. Collectively, they are unrelenting in their pursuit of excellence. For eating and for drinking, the experience grows more tremendous each year. The cost for the tasting menu is $325 per person, with an abbreviated version available at the bar, where a couple of seats a night are also available to sip Hennelly’s masterworks. In the works for Kato: a planned redesign in 2026 to make the restaurant’s space in Row DTLA both more intimate and interactive for guests. I can’t wait to see — and taste — what else comes next."
