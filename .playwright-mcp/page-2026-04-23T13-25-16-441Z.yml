              - generic [ref=e5426]: "In mid-August, a small fire in the ventilation duct system closed Evan Funke’s eponymous Beverly Hills Italian restaurant for six weeks. Its shuttering, however mercifully short and temporary, was a stark reminder of its significance. The chef is attached to two other local restaurants — Felix Trattoria in Venice and Mother Wolf in Hollywood — but Funke is where he spends most of his time. He darts in and out of the semi-open kitchen, greeting guests in the posh main room where overhead globe lighting, doubled in the reflection of the restaurant’s glassed-in pasta “laboratory,” appears to rain down Champagne bubbles in defiance of gravity. The menu culls his obsessions, beginning with sfincione, his ballooned version of Sicilian pizza painted in tomato and onion sauce and showered with a firm cow’s-milk cheese called Ragusano. Don’t fill up too fast: Delicate arancini, tiny minted artichokes and seasonal salads await. Pastas are extraordinary. Maybe $50 for a bowl of tagliatelle sounds obscene, but the labor is palpable: The feathery texture of the strands sauced in just enough ragù Bolognese is like nothing else in Southern California. Shannon Swindle, among the region’s finest pastry chefs, brings an evening home with ethereal Neapolitan-style sugar doughnuts and gorgeous, ever-changing fruit crostatas."
