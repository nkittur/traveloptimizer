            - generic [ref=e4936]:
              - generic [ref=e4937]: I’ve watched the daytime operation at Saffy’s blossom from a few of Genevieve Gergis’ pastries to a full-on breakfast and lunch destination. Gergis and her husband, chef Ori Menashe, have created a sidewalk oasis on their corner of Fountain Avenue in East Hollywood. The patio swells with diners dressed in scrubs from the nearby hospital, students on laptops and men in suits. Before them are spreads of housemade yogurt swirled with honey and freckled with pine nuts, and slabs of challah French toast basking in a pool of maple syrup and butter. Hot, puffy pitas are split and stuffed with beef and lamb brisket, chicken shashlik or vibrant green falafel. Gergis’ pastries disappear quickly from the display case. A recent apple fritter reminded me of pull-apart monkey bread, cocooned in icing and glutted with apple. In the evenings, Saffy’s is still the place to be for impeccable beef, lamb, chicken and pork kebabs, layered onto shining skewers as long as swords. The shawarma rotates on a spit in the open kitchen, glistening and basting in its own juices. It’s difficult to train my attention on anything else. But the restaurant thrives in the sunlight, an intimate respite from the rest of the city, with doughnuts, coffee and a lunch that will leave your co-workers green with envy.
