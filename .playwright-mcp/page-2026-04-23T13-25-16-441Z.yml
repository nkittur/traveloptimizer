            - generic [ref=e1632]: By Jenn Harris
            - generic [ref=e1634]:
              - generic [ref=e1635]: Is there such a thing as a necessary indulgence? I contemplate this question as I near the end of each meal at Perle. Owners Dean Yasharian and Pauline Zee opened Perle in Old Pasadena in the summer of 2020, naming the restaurant after their eldest daughter. Yasharian cooked for more than a decade at Restaurant Daniel in New York City, and the menu at Perle leans classic French. The pâté campagne will transport you to a chic charcuterie in Montmartre, with its rustic texture and robust porky flavors. The Dover sole meunière is supple and tender, bathed in a heavenly brown butter sauce. And most of Yasharian’s traditional bistro fare, including the escargots, salade lyonnaise and caviar blini, have a vegetarian counterpart on the menu. Even as I finish the last dredges of every dish on the table, Yasharian’s variation on a tarte tatin beckons. The apples soften in the oven, their juices running into an amber caramel beneath. A layer of puff pastry bakes over the top, the buttery dough fusing to the apples and caramel before he flips the tart out of the pan. Each spoonful offers a satisfying crack of lacquered pastry and tender fruit. It’s better than the eight versions I recently ate in Paris, and the definition of a necessary indulgence.
