              - generic [ref=e3099]: The main attraction in San Juan Capistrano is no longer the 249-year-old mission in the heart of the city. It’s a walk-up window serving Texas-style barbecue that draws hours-long crowds every weekend. Pitmaster Daniel Castillo, his wife Brenda and executive chef Nicholas Echaore have created a loyal following with their brisket, the deep, mahogany bark heavily crusted and tinged with smoke. The meat beneath is marbled with enough fat and juice to render it wobbly. The barbecue holds the spirit of Texas, but with the borderless soul of Southern California. Slabs of pork belly are brushed with a char siu glaze. Tender, mottled Sonoran flour tortillas hold pulled pork and Santa Maria tri-tip. Build a tray of smoked meats but pay close attention to the specials listed on the chalkboard menu on the sidewalk. This is where you’ll find a list of sandwiches, burritos and limited sides depending on the day. Keep a close eye out for the Birria Capo Dip. The sandwich is built on a bed of melted Oaxacan cheese, with shredded brisket birria, chopped white onion, cilantro, salsa verde and crema. The mess of meat and cheese gets folded and nestled into a soft hoagie roll, a skirt of cheese spilling from the seams and a handful of escabeche onions like a lightning bolt of acid down the middle. The sandwich alone is a triumph, but it comes with a cup of consommé for dipping. A cross between a birria queso taco and a torta, it may be the most L.A. sandwich in California.
