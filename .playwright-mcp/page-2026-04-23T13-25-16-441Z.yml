              - generic [ref=e5513]: "Lamb barbacoa — when cooked traditionally for hours to buttery-ropy tenderness — is such a painstaking art that most of Southern California’s true practitioners sell it on weekends only. In the Los Angeles area, conversations around sublime lamb barbacoa should start at the stand that Gonzalo Ramirez sets up on Saturday and Sunday mornings near the Arleta DMV. You’ll see him and his family wearing red T-shirts that say “Atotonilco El Grande Hidalgo” to honor their hometown in central-eastern Mexico. Ramirez tends and butchers lambs in the Central Valley. The meat slow-roasts in a pit overnight and, cradled in plush made-to-order tortillas, the tacos come in three forms: smoky, molten-textured barbacoa barely hinting of garlic; a pancita variation stained with chiles that goes fast; and incredible moronga, a nubbly, herbaceous sausage made with lamb’s blood. Plenty of customers pick up food to go. There’s a wonderful communion, though, to finding seats at the long table set up under a blue tarp and downing a few tacos dotted with red or green salsa while sipping a cup of lamb consommé bobbing with chickpeas."
