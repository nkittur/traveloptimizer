            - generic [ref=e5562]:
              - generic [ref=e5563]: As dependable as your oldest friend, Bavel, Genevieve Gergis and Ori Menashe’s Levant-leaning Arts District restaurant, never ceases to deliver for out-of-town friends, celebrations or any Thursday-night dinner. You can count on the pita to be blistered and puffy, a flawless vessel for silky hummus or smokey baba ghanoush. The oyster mushroom kebabs are as meaty as steak, zapped with Meyer lemon and sumac. The slow-roasted lamb neck shawarma is still the platter on nearly every table, the meat slipping from the bone like a fine silk dress, the laffa underneath saturated with juice and spice. The bite-size wraps you make from the torn pieces of bread, lamb, pickled vegetables and ajika might be the finest you’ve ever had. Though my order rarely changes, I found myself adding the grilled kohlrabi during a recent visit. The brassica is sliced impossibly thin, cooked until nearly translucent. Each piece of the kohlrabi absorbs the smoke from the grill, like a dozen tiles of sweet and smoky candy punctuated with brown butter and burnt harissa powder. Now I can’t imagine dinner at Bavel without it.
