                - generic [ref=e3528]: Husband-and-wife team Alex “Pobre Diablo” Garcia and Elvia “La Bruja” Huerta moved their black-metal-inspired pop-up into a permanent space in El Sereno late last year. Their love of this extreme subgenre of music is evident in the restaurant’s black walls, black skulls and black angel fountain that cries red tears. It’s also palpable in their rebellious, maximalist menu of tacos, burritos and tortas. Huerta’s recado negro is the dark heart of the menu, dubbing the Yucatan-inspired marinade his “black magic.” He burns chiles secos, cacao, tortillas, onion and a handful of spices. The charred pile of ingredients is ground into an ink-black paste that’s smoky and sweet with a murmur of heat. To make his octopus al pastor, he rubs the marinade onto the whole mollusk, then layers the octopus onto the trompo. The visual effect is striking, with torch flames licking the dark sea creatures as they hungrily consume the spit. Called the Poseidon, Huerta piles the chopped octopus onto a fresh corn tortilla with guacamole, pineapple and purple onions pickled Yucatan-style with citrus. It’s the metal music equivalent of a taco, the volume dialed all the way up, with the jolt of the recado negro mimicking a frenetic tempo and shrieking vocals.
