              - generic [ref=e2634]: "“Bangladeshi, Indian and Pakistani Foods” reads the sign above the entrance to Enam Karim’s cramped location in a Koreatown strip mall. He opened his restaurant in 2014, devising a huge menu meant to connect the common cuisines of those three subcontinent nations. Plenty of the standard dishes — saucy chicken tikka masala, dark-green saag paneer, samosas grabbed from the hot box near the counter — are good enough. But what registers as outstanding? His Hyderabadi-style lamb biryani, and the specials that hew most closely to the cooking of Pakistan, Karim’s home country. The biryani is torrid with spice, the shank meat pulled effortlessly from the bone and the grains fluffy yet sticky from a masala of ginger, garlic, cardamom and a dozen other seasonings. Karim is mum on the recipe, but there’s a floral pheromone in there that must be kewra, a South Asian ingredient used similarly to rose water. His version of haleem, the fragrant beef and lentil porridge, is so fused in texture and flavor it translates as savory custard. For something brighter, try hariyali chicken immersed in a sauce of mint, cilantro, yogurt and ground cashews. Such specials tend to be advertised on paper taped to the wall, but Karim is an ebullient host: Just ask him what he’s made off-menu any given day."
