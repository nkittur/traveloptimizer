              - generic [ref=e6283]: "Brian Dunsmoor grew up in Georgia, and the ever-unfolding menu at his Glassell Park restaurant grafts his past and present. His cooking rolls with California’s growing calendar, yet the flavors he conveys are palpably Southern. In his dishes, you don’t just taste the seasons. You feel them. Summertime salads of peaches with farmers cheese and basil or silvers of smoked duck ham paired with aptly named Honeyloupe melon elicit picnic-outing joy. The subtle sharpness that cider, rosemary and black pepper bring to roasted quail with apple sauce mirror the shifting moods of fall. I can count on Dunsmoor’s slippery dumplings with pulled chicken to lift me from the lethargy of winter’s short days. Several comforts are evergreens: pork and green chile stew with supple tortillas; the restaurant’s famous chile-cheddar cornbread, baked in cast-iron skillets and literally dripping in butter, based on a recipe by chef and cookbook author Edna Lewis; and, for dessert, a yielding block of sticky date pudding. The dining room’s faded brick, ambered lighting and central burning hearth (from which most dishes emerge) reinforce the Southern charms. Wine director Sam Graves oversees an expanding, increasingly spectacular bottle list full of older French vintages. For last-minute Dunsmoor hankerings, swing by the adjoining wine bar for oysters and a hanger steak glossed with green peppercorn jus."
