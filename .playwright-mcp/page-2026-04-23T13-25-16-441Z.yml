              - generic [ref=e6130]: Omakase restaurants in Los Angeles have never been more prominent, nor greater in number or price. Morihiro Onodera’s 5-year-old sushi-ya reigns among them. Beginning in 2000, with the 11-year run of his debut restaurant, Mori Sushi in West L.A., Onodera helped codify the L.A. style of omakase in which small dishes — some of which reflect technique-focused kaiseki traditions (a zensai plate of tiny, seasonal bites) and some of which reflect his wit (big-eye tuna tartare balled into a chunky, unruly orb and heaped with caviar) — precede a parade of nigiri. A table at Morihiro is a good option, but if you can, indulge by booking a place at the sushi bar in front of the master himself. For the last five years, that meant a six-seat pale cedar counter in a small Atwater Village storefront. In October, the restaurant relocated to a larger space in the Elysian building in Echo Park. Onodera has been famously peripatetic during his long career. His new chapter for Morihiro centers a standalone cocktail bar that is the new domain of Han Suk Cho, fresh from her star-making turn crafting some of the city’s most poetic drinks (including nonalcoholic revelations) at Kato.
