            - generic [ref=e4041]:
              - generic [ref=e4042]: Keith Corbin’s California Soul is a personal style of cooking that meanders into the South, mines the Levant and Japan, then swerves back to Los Angeles. Beets and labneh are sprinkled with a hazelnut dukkah, the coarse nut, seed and spice condiment accentuating the beets’ earthy contours. His smoked, slow-cooked Wagyu is fortified with brown butter and soy sauce. He uses miso in the braising liquid to supercharge his oxtails with umami. Then there are the Southern classics, a genre in which Corbin reigns supreme. The fried chicken, on its own or alongside a buttermilk waffle, is encased in the lightest, crunchiest coating. Collard greens are bolstered with smoked oil, vinegar and chile. Rich gumbo is crowded with smoked chicken and sausage. And Corbin prepares my favorite cornmeal pancakes in the city, big, fluffy rounds with lacy edges that hang over the plate. The brown butter maple caramel sauce pooling from the middle makes brunch here the most important meal of the day.
