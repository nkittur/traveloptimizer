                - generic [ref=e5038]: "The single food item I consume most frequently in Los Angeles? Sonoratown’s Burrito 2.0, a sum fashioned from the greatest parts. As with most everything served at Teodoro Díaz Rodriguez Jr. and Jennifer Feltham’s outstanding taquerias in downtown, Mid-City and Long Beach, the excellence begins with the flour tortillas. Master tortillera Julia Guerrero oversees production of gold-standard exemplars, made using Sonoran wheat and pork lard for maximum flakiness and pliability. I jump between four meat options: costilla (a mix of boneless short rib and chuck) or chicken grilled over billowing mesquite, chile-stained chorizo from the Chori-Man in San Pedro and occasionally tender-ropy cabeza braised with cloves and other spices. Melting pintos, slicks of Monterey Jack, roasted poblano (optional but wonderful) and flickers of guac and smooth chiltepin salsa complete the smoky, mingled bundle. If I’m feeling extra-hungry, or greedy, I’ll throw in a chivichanga, mini packages of chicken or beef guisados, laced with cheese, that in bulk are perfect party food. For lingering, head to the Mid-City location: it’s the only Sonoratown outpost with a bar for limey, spicy micheladas and Modelo on tap."
