            - generic [ref=e4683]:
              - generic [ref=e4684]: Vespertine isn’t a restaurant. And dinner, experienced throughout multiple levels of the Eric Owen Moss building known as the Waffle, isn’t a meal. What transpires over a dozen or so courses in nearly three hours becomes a journey through a dream realm Jordan Kahn and his team have painstakingly created, a restaurant as a means of expression. Here, the ideas of luxury and sustenance are contorted and challenged, each diner left to interpret Kahn’s world however they choose. An early course involves the interior of a vessel resembling a dinosaur egg, painted in a rainbow of flowers from the restaurant garden. Imagine the immense beauty, vitality and urgency of the entire summer season focused in a single bowl. A dish titled Deep Ocean consists of sweet prawns lounging in a pink nectarine vinaigrette studded with red currants and perfect squares of chile gelée. The prawns are caught off the coast of Kauai by a father-and-son duo, who fish at a depth of at least 2,500 feet. They are unlike any prawns I’ve tasted, with a marine sweetness that permeates the flesh, heightened to a sublime level by the stone fruit. The courses can feel like modernist cuisine pushed to the extreme, but always grounded in something recognizably pleasurable. Dinner finishes with Kahn’s interpretation of an entremet, deep lavender circles of butterfly pea flower-dusted meringue with frozen sheep’s milk and black raspberry. It’s presented in circles with shrinking circumferences that descend to the bottom of the bowl, giving the illusion of staring into a black hole. Strip away the abstract plating, and it’s a raspberry layer cake from the finest patisserie. Allow yourself to fully succumb to Kahn’s vision, and dinner at Vespertine can be whatever you want it to be.
