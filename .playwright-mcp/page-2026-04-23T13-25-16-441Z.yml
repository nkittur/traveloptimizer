            - generic [ref=e3376]:
              - generic [ref=e3377]: Dulan’s on Crenshaw is a name synonymous with Los Angeles, a destination for anyone looking for a taste of soul food. Owner Greg Dulan takes immense pride in not only the food he serves, but in the restaurant as a third space for community gatherings. He likes to believe that his grandmother Zady, featured in a picture surrounded by chickens on the family farm, was on her way to fry some chickens. “This is a way to showcase African American history in this country through the lens of a single family,” he says during a recent visit. That history is also told in the classic soul food dishes he and his brother, Terry Dulan (who runs Dulan’s Soul Food Kitchen), have been serving for decades. I don’t know that you’ll find a better macaroni and cheese anywhere, the noodles tender, the cheese sauce abundant and the edges crusty. The fried chicken is prepared the same way Dulan’s grandmother, and father, the late Adolf Dulan, made it, dredged in a mix of flour and spices shaken in a brown paper bag. A meal at Dulan’s comes with a little piece of history, and a lot of heart.
