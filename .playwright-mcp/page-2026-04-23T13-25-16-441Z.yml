            - generic [ref=e2384]:
              - generic [ref=e2385]: Tacos Los Cholos is a place for carne asada lovers. For the people who require nothing more than salt and a hot grill. It’s a temple of meat of the highest order, where the intoxicating perfume of the mesquite grill and a cloud of smoke greet you as you enter. What began as an Anaheim pop-up in 2019 has grown to encompass a handful of locations across Southern California, including this two-story restaurant in downtown Huntington Park. The Santa Maria-style grill is directly opposite the door, hissing and crowded with beautifully marbled slabs of meat over hot, glowing coals. The menu boasts more than a dozen fillings for tacos, burritos and even baked potatoes. There’s a lot to consider, but direct your attention to the “prime” section of the menu. The rib-eye taco plops what could be half of a steak onto a pair of corn tortillas. It’s enough filling that when you attempt to fold it, half the contents spill from the back. The asada has not been hacked with a cleaver into oblivion, and it’s cooked exactly to your desired doneness. The mesquite smoke clings to the meat, permeating the bite-sized pieces and the bits of char that cling to the edges. A bite of taco. A bite of chile güero. This taco may be why humans discovered fire.
