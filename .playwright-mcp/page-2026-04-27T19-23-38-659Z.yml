        - heading "MILAN AND THE DOLOMITES" [level=3] [ref=e573]
        - paragraph [ref=e574]: "Milan, the capital of Lombardy, along with Cortina d’Ampezzo, a chic mountain town and ski resort in the Dolomites, will host both the Olympic Winter Games, which run February 6–22, and the Paralympic Winter Games, which take place March 6–15. There will be plenty of storylines to watch, but one addition to the 2026 competition is already generating a ton of excitement: Ski mountaineering, or skimo, will appear in the Games for the first time. This physically demanding discipline involves athletes climbing mountains with their skis on (and off) before descending, all while trying to notch the quickest time on the course. While many of the Olympic events will take place in the mountains, Milan will be the base for several popular sports, including figure skating, ice hockey, and speed skating."
        - paragraph [ref=e575]: Outside of the competition, there’s plenty more happening, particularly on the hotel front. Rosa Alpina, a beloved, family-owned chalet in the village of San Cassiano, was recently transformed into an Aman property, with a palatial, two-story spa. Hotel Tofana Cortina, which opened in December 2024, is adjacent to the Tofane Alpine Skiing Centre, which will host the women’s downhill races. Meanwhile, Ancora Cortina, which dates back to 1826, is also fresh off a renovation, which added, among other things, a scene-y, no-phones-allowed nightclub.
        - paragraph [ref=e576]:
          - text: "Looking beyond the winter season, the Dolomites promise to be an in-demand destination in the year ahead. In summer 2026, Abercrombie & Kent is launching an itinerary that includes hiking the iconic rock formation Cinque Torri, or Five Towers, while Backroads has unveiled a hut-to-hut trek, aimed specifically at travelers in their 30s and 40s, that crosses glacial valleys in Fanes-Sennes-Braies and Puez-Odle nature parks. For hardcore cyclists, Duvine will operate an epic “Dolomites Challenge” that might feel like something out of the Olympics: The six-day, 273-mile ride will test the mettle of travelers—and reward them with stays in cozy, high-altitude"
          - emphasis [ref=e577]: refugios
          - text: .—
          - link "Elizabeth Cantrell" [ref=e578] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/elizabeth-cantrell-5442316
            - emphasis [ref=e579]: Elizabeth Cantrell
        - 'figure "Grazing horses in Mongolia. Photo: Maria Ligaya/Travel + Leisure" [ref=e580]':
          - img "A person in traditional attire and horses grazing in a vast mountainous landscape of Mongolia" [ref=e583]
          - generic [ref=e584]:
            - text: Grazing horses in Mongolia.
            - generic [ref=e585]:
              - text: "Photo:"
              - paragraph [ref=e586]: Maria Ligaya/Travel + Leisure
        - heading "MONGOLIA" [level=3] [ref=e587]
        - paragraph [ref=e588]:
          - text: For a high-octane adventure, Mongolia delivers—and it’s now within easier reach. In May 2025, United Airlines became the first U.S. airline to fly to the capital, Ulaanbaatar, with a route connecting Tokyo’s Narita International Airport to Chinggis Khaan International Airport. Once there, visitors can experience one of the last nomadic cultures, as well as the world’s largest intact temperate grassland in Mongolia’s Eastern Steppes, which was nominated to become a
          - link "UNESCO World Heritage site" [ref=e589] [cursor=pointer]:
            - /url: https://whc.unesco.org/en/tentativelists/5946/
          - text: . Several outfitters have also designed trips that offer the best of the country.
          - link "Abercrombie & Kent’s 2026 itinerary" [ref=e590] [cursor=pointer]:
            - /url: https://www.abercrombiekent.com/journeys/small-group-journeys/mongolia-naadam-festival-and-gobi-desert-adventure
          - text: takes visitors across the Gobi to witness a centuries-old festival; Intrepid’s
          - link "Trans-Mongolian Railway Adventure" [ref=e591] [cursor=pointer]:
            - /url: https://www.intrepidtravel.com/us/mongolia/trans-mongolian-railway-adventure-167177
          - text: ", which launched in 2024, takes passengers on an 11-day journey from Beijing to Ulaanbaatar; and"
          - link "Nomadic Expeditions" [ref=e592] [cursor=pointer]:
            - /url: https://www.nomadicexpeditions.com/
          - text: CEO and founder, Jalsa Urubshurow, co-created the annual
          - link "Golden Eagle Festival" [ref=e593] [cursor=pointer]:
            - /url: https://www.nomadicexpeditions.com/golden-eagle-festival/
          - text: ", which gives Kazakh hunters from around central Asia a chance to showcase the skills of their eagles. “For me, Mongolia is not only a place of ancestral connection but a rare example of how a country can embrace tourism without compromising its identity,” Urubshurow says. “Its special character lies in its vast, untouched landscapes and the enduring nomadic traditions of hospitality, resilience, and harmony with nature—an authenticity travelers seek but rarely find.”"
          - emphasis [ref=e594]:
            - text: —
            - link "Mae Hamilton" [ref=e595] [cursor=pointer]:
              - /url: https://www.travelandleisure.com/mae-hamilton-8758152
        - 'figure "A hiking trail in the Andes Mountains. Photo: Chris Marinaccio/Travel + Leisure" [ref=e596]':
          - img "Horses grazing in a lush mountain valley below snowcovered peaks" [ref=e599]
          - generic [ref=e600]:
            - text: A hiking trail in the Andes Mountains.
            - generic [ref=e601]:
              - text: "Photo:"
              - paragraph [ref=e602]: Chris Marinaccio/Travel + Leisure
        - heading "SOUTHERN PERU" [level=3] [ref=e603]
        - paragraph [ref=e604]:
          - text: The legendary mountain citadel of Machu Picchu may be the most famous tourist attraction in all of South America. But for Ignacio Masias, the founder of tour company
          - link "Andean" [ref=e605] [cursor=pointer]:
            - /url: https://andean.travel/
          - text: ", it’s simply the gateway to everything else his home country of Peru has to offer. “We’ve seen people want to spend more time in the southern, remote parts of the country,” Masias tells T+L. “High-end travelers want to get away from the crowds.” Since starting his company, Masias and his team have developed a network of lodges and guides in places such as the Colca Canyon and Lake Titicaca, where they have both the cultural fluency and on-the-ground connections to make magic happen without sacrificing on stylish accommodations. The newest outpost in Andean’s growing constellation lies in the Tinajani Canyon, where a luxury tented camp affords access to hiking trails and remarkable landscapes; another recent addition to the portfolio, Puqio, was inspired by the look and feel of a century-old"
          - emphasis [ref=e606]: National Geographic
          - text: magazine article about Peru.
          - emphasis [ref=e607]:
            - text: —
            - link "Paul Brady" [ref=e608] [cursor=pointer]:
              - /url: https://www.travelandleisure.com/author/paul-brady
        - 'figure "The view from Mirissa, Sri Lanka. Photo: Alexandre Sattler/G Adventures" [ref=e609]':
          - img "Tropical shoreline with palm trees and a sailboat on the water" [ref=e612]
          - generic [ref=e613]:
            - text: The view from Mirissa, Sri Lanka.
            - generic [ref=e614]:
              - text: "Photo:"
              - paragraph [ref=e615]: Alexandre Sattler/G Adventures
        - heading "SRI LANKA" [level=3] [ref=e616]
        - paragraph [ref=e617]:
          - text: “If you’re an adventurous traveler, you want to start in the north, in Jaffna,” says
          - link "Rumit Mehta" [ref=e618] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/rumit-mehta-11839784
          - text: ", a T+L A-List advisor and founder of"
          - link "Immersion Journeys" [ref=e619] [cursor=pointer]:
            - /url: https://immersionjourneys.com/
          - text: ", a company specializing in luxury trips in India and Sri Lanka. “There’s great hiking up in the highlands, in the Horton Plains, up in the tea estates.” Along the southern coast, water adventures are on offer, whether sailing trips with"
          - link "G Adventures" [ref=e620] [cursor=pointer]:
            - /url: https://www.gadventures.com/trips/sailing-sri-lanka/ASVM/
          - text: ", which cruise to and from Mirissa, exploring remote beaches and the fishing village of Kudawella, or"
          - link "biking" [ref=e621] [cursor=pointer]:
            - /url: https://www.butterfield.com/trip/small-group/sri-lanka-biking
          - text: and
          - link "walking" [ref=e622] [cursor=pointer]:
            - /url: https://www.butterfield.com/trip/small-group/sri-lanka-walking
          - text: tours with Butterfield & Robinson.
          - link "Insight Vacations" [ref=e623] [cursor=pointer]:
            - /url: https://www.insightvacations.com/en-us/tours/wonders-of-sri-lanka
          - text: is adding a new 13-day Sri Lanka itinerary that hits nine cities and kicks off with a tuk-tuk tour of Colombo.
          - link "Trafalgar" [ref=e624] [cursor=pointer]:
            - /url: https://www.trafalgar.com/en-us
          - text: is heading to the country for the first time in 2026, allowing travelers to traverse tea fields by train and spot leopards at Yala National Park. Safari-goers can also stay at the new
          - link "Kotiyagala Luxury Villas" [ref=e625] [cursor=pointer]:
            - /url: https://www.kotiyagala.com/
          - text: —12 villas, each with a private pool, surrounded by 44 mammal and 215 bird species. Mehta says Sri Lanka has become a “stand-alone destination,” not only because of its eight UNESCO World Heritage sites but also because of the rich culture stemming from Portuguese, Dutch, and Burgher influences and the post–civil war recovery.
          - emphasis [ref=e626]:
            - text: —
            - link "Nina Ruggiero" [ref=e627] [cursor=pointer]:
              - /url: https://www.travelandleisure.com/author/nina-ruggiero
        - 'figure "A rhino and warthog, together in Zimbabwe. Photo: Maria Ligaya/Travel + Leisure" [ref=e628]':
          - img "A rhinoceros and a warthog grazing together in a dry natural landscape" [ref=e631]
          - generic [ref=e632]:
            - text: A rhino and warthog, together in Zimbabwe.
            - generic [ref=e633]:
              - text: "Photo:"
