        - heading "ZIMBABWE" [level=3] [ref=e635]
        - paragraph [ref=e636]:
          - text: Often overshadowed by its neighbors Botswana and South Africa, Zimbabwe may finally be getting the recognition it deserves thanks, in part, to a number of noteworthy openings.
          - link "Mana Sands" [ref=e637] [cursor=pointer]:
            - /url: https://www.manasands.com/
          - text: is a six-suite camp that debuted in July in Mana Pools National Park, on the lower Zambezi River, where it’s possible to canoe and fish—and spot elephants, lions, leopards, buffalo, hippos, and wild dogs. For a more rustic experience, there’s also the nearby Little Mana Sands, which has six zipper-entry tents. Another worthwhile new stay is
          - link "Muddy Teak" [ref=e638] [cursor=pointer]:
            - /url: https://www.wild-expeditions.africa/our-camps/muddy-teak
          - text: ", an exclusive-use, four-room camp in Hwange National Park that opened in May."
          - link "Mpala Jena" [ref=e639] [cursor=pointer]:
            - /url: https://greatplainsconservation.com/mpala-jena-victoria-falls-luxury-accommodation/
          - text: ", a stunning Victoria Falls property operated by Great Plains Conservation, recently added a pair of three-bedroom private villas, about three miles upstream from the main camp. Beyond all the new places to stay, Zimbabwe is attracting attention because it’s particularly suited to active travelers: Mountain biking, rafting, and even houseboat rentals on Lake Kariba are options for those seeking thrills. Then there’s the quality of the experience travelers can have, according to"
          - link "Ian Proctor" [ref=e640] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/ian-proctor-11886858
          - text: ", a specialist on T+L’s A-List who has been operating in Zimbabwe since the mid 1990s. “Being with a Zimbabwean guide is like having the Mick Jagger of guides out with you,” Proctor says. “These are the rock stars.”—"
          - link "Elizabeth Cantrell" [ref=e641] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/elizabeth-cantrell-5442316
            - emphasis [ref=e642]: Elizabeth Cantrell
        - heading "DESTINATIONS FOR" [level=3] [ref=e644]
        - heading "BEACH VIBES" [level=2] [ref=e645]
        - 'figure "Snorkeling near Cap Juluca, a Belmond Hotel, Anguilla. Photo: Belmond" [ref=e646]':
          - img "Two people snorkeling underwater near a coral reef wearing snorkel gear and fins" [ref=e649]
