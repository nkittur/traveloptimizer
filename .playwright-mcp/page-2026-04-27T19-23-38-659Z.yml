        - heading "ANDERMATT, SWITZERLAND" [level=3] [ref=e524]
        - paragraph [ref=e525]:
          - text: Once a cloistered military outpost, Andermatt is today one of the most design-forward destinations in the Swiss Alps. This winter, skiers can expect bigger, faster
          - link "chairlifts" [ref=e526] [cursor=pointer]:
            - /url: https://www.andermatt-sedrun-disentis.ch/en/stories/neue-bahnen-winter-2025
          - text: ", which will ease access to some of Switzerland’s most dramatic terrain, as well as expanded snowmaking and wider slopes. “Thanks to Andermatt’s recent partnership with the"
          - link "Epic Pass" [ref=e527] [cursor=pointer]:
            - /url: https://www.epicpass.com/regions/europe/switzerland/andermatt-sedrun-disentis.aspx
          - text: and direct train access from Zurich, it’s never been easier to tap into this hidden gem,” says
          - link "Alli Widman" [ref=e528] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/alli-widman-11886877
          - text: ", an T+L A-List member who specializes in skiing. Vacation homeowners are also drawn to the sleek alpine architecture—including"
          - link "Maya" [ref=e529] [cursor=pointer]:
            - /url: https://www.andermatt-maya.ch/
          - text: ", a collection of 17 residences designed by Patricia Urquiola, and the"
          - link "Post Hotel & Residences by Elie Saab" [ref=e530] [cursor=pointer]:
            - /url: https://postbyeliesaab.com/
          - text: . Meanwhile, a
          - link "world-class concert hall," [ref=e531] [cursor=pointer]:
            - /url: https://kahle.be/en/ref/andermattConcertHall.html
          - link "three restaurants with Michelin stars" [ref=e532] [cursor=pointer]:
            - /url: https://guide.michelin.com/us/en/uri/andermatt/restaurants?sort=distance
          - text: ", and a"
          - link "new outdoor hip-hop festival" [ref=e533] [cursor=pointer]:
            - /url: https://www.pleasuremag.com/feed/high-peak-festival-andermatt-2025
          - text: —not to mention refreshingly cool summers—have turned this once-quiet garrison town into a four-season playground.—
          - link "Denny Lee" [ref=e534] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/denny-lee-7963123
            - emphasis [ref=e535]: Denny Lee
        - 'figure "A Backroads cyclist in Cyprus. Photo: Cat McNally/BACKROADS" [ref=e536]':
