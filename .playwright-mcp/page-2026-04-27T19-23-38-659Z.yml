        - heading "BENTONVILLE, ARKANSAS" [level=3] [ref=e398]
        - paragraph [ref=e399]:
          - text: Bentonville, Arkansas, once best known as the headquarters of Walmart, has evolved into a dynamic art and culture destination. The
          - link "Crystal Bridges Museum of American Art" [ref=e400] [cursor=pointer]:
            - /url: https://crystalbridges.org/
          - text: ", founded in 2011 by Walmart heiress Alice Walton, is debuting a 114,000-square-foot expansion in June, with new galleries and educational spaces. \"This expansion is a new chapter. Its impact will touch and elevate everything we do, from the way we hang the galleries to the way we address our audiences,\" said Olivia Walton, chairperson of the board at Crystal Bridges, during a recent press conference attended by T+L. Bentonville’s great outdoors are drawing attention, too. The nearby"
          - link "Oz Trails Bike Park" [ref=e401] [cursor=pointer]:
            - /url: https://www.oztrails.com/oz-trails-bike-park/
          - text: in Bella Vista will soon open 20 miles of rider-designed trails, solidifying Northwest Arkansas’s reputation as the self-declared Mountain Biking Capital of the World. Closer to downtown, the new
          - link "8th Street Gateway Park" [ref=e402] [cursor=pointer]:
            - /url: https://www.8gatewaypark.com/
          - text: will transform underused land into wetlands, boardwalks, and scenic trails. With the debut of The
          - link "Compton" [ref=e403] [cursor=pointer]:
            - /url: https://www.thecompton.com/
          - text: ", which will feature 142 rooms, plus a calendar of events that include the"
          - link "Bentonville Film Festival" [ref=e404] [cursor=pointer]:
            - /url: https://bentonvillefilm.org/
          - text: and the
          - link "Big Sugar Classic" [ref=e405] [cursor=pointer]:
            - /url: https://www.bigsugarclassic.com/
          - text: gravel bike race, Bentonville shows no signs of slowing down.
          - emphasis [ref=e406]:
