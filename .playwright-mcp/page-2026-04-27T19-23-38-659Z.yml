        - heading "NAPLES, FLORIDA" [level=3] [ref=e721]
        - paragraph [ref=e722]:
          - text: Naples, on Florida’s Gulf Coast, has long been known for its sugar-sand stretches, including 10-mile Naples Beach, but there’s plenty to do inland, too, thanks to the city's growing arts and culture scene.
          - link "Artis–Naples" [ref=e723] [cursor=pointer]:
            - /url: https://artisnaples.org/
          - text: is the town’s creative heartbeat, home to the Naples Philharmonic and the Baker Museum, which is celebrating its 25th anniversary during the 2025–2026 season with exhibitions of works by Ansel Adams, Tamara de Lempicka, and more. The
          - link "Naples Beach Club, a Four Seasons Resort" [ref=e724] [cursor=pointer]:
            - /url: https://www.fourseasons.com/naplesbeachclub/
          - text: ", is set to open in late 2025, with 220 rooms and suites, a two-level spa, and five food and beverage outlets. The hotel’s redesigned Tom Fazio golf course will open in 2026. “Every detail of this expansive property has been carefully curated, and it will provide a one-of-a-kind elevated experience truly unmatched in the destination. We are not just launching a new resort, but a new era in Naples,”"
          - link "Diego Angarita" [ref=e725] [cursor=pointer]:
            - /url: https://press.fourseasons.com/naplesbeachclub/hotel-news/2025/introducing-general-manager-diego-angarita/
          - text: ", the resort’s general manager, tells T+L."
          - link "The Carnelian Hotel" [ref=e726] [cursor=pointer]:
            - /url: https://carnelianhotel.com/
          - text: will debut in early 2027 with 70 all-suite accommodations and
          - link "Sterling’s" [ref=e727] [cursor=pointer]:
            - /url: https://sterlingsclub.com/
          - text: ", a luxe private club that will house a speakeasy and cigar lounge."
          - emphasis [ref=e728]:
            - text: —
            - link "Elizabeth Rhodes" [ref=e729] [cursor=pointer]:
              - /url: https://www.travelandleisure.com/author/elizabeth-rhodes
        - 'figure "The Rosewood Miyakojima in Okinawa, Japan. Photo: Jonathan Leijonhufvud/Rosewood Hotels & Resorts" [ref=e730]':
          - img "A beachfront resort with lounge chairs and umbrellas view of water and surrounding greenery in Okinawa Japan" [ref=e733]
          - generic [ref=e734]:
            - text: The Rosewood Miyakojima in Okinawa, Japan.
            - generic [ref=e735]:
              - text: "Photo:"
              - paragraph [ref=e736]: Jonathan Leijonhufvud/Rosewood Hotels & Resorts
        - heading "OKINAWA, JAPAN" [level=3] [ref=e737]
        - paragraph [ref=e738]:
          - text: Japan’s southernmost prefecture—and one of the world’s famed Blue Zones—Okinawa is a chain of subtropical islands known for its pristine beaches, excellent scuba diving, and easy access to nature, earning it the nickname “Japan’s Hawaii.” But there’s more drawing travelers to the archipelago these days than just sun and sand. In March 2025, Rosewood opened its first property in the country,
          - link "Rosewood Miyakojima" [ref=e739] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/rosewood-miyakojima-japan-hotel-review-first-in-11714824
          - text: ", with 55 oceanside villas, a serene spa, locally sourced seafood, and a pottery studio. A few months later,"
          - link "Junglia" [ref=e740] [cursor=pointer]:
            - /url: https://junglia.jp/en
          - text: ", an immersive amusement park, opened in Yambaru forest, with more than 20 attractions, including hot-air balloons, zip lines, and a “Dinosaur Safari.” And by fall 2026, travelers will have another reason to visit: Restoration of the 13th-century Shuri Castle, a UNESCO World Heritage site in Naha that was damaged by a 2019 fire, will be fully complete, offering a window into the island’s Ryukyuan heritage."
          - emphasis [ref=e741]:
            - text: —
            - link "Maddie Hiatt" [ref=e742] [cursor=pointer]:
              - /url: https://www.travelandleisure.com/maddie-hiatt-11679763
        - 'figure "Aerial view of the beach and Tom Fazio golf course at Siari Riviera Nayarit, a Ritz-Carlton Reserve. Photo: Siari Riviera Nayarit, a Ritz-Carlton Reserve" [ref=e743]':
          - img "Beach and golf course at Siari Riviera Nayarit" [ref=e746]
          - generic [ref=e747]:
            - text: Aerial view of the beach and Tom Fazio golf course at Siari Riviera Nayarit, a Ritz-Carlton Reserve.
            - generic [ref=e748]:
              - text: "Photo:"
              - paragraph [ref=e749]: Siari Riviera Nayarit, a Ritz-Carlton Reserve
        - heading "RIVIERA NAYARIT, MEXICO" [level=3] [ref=e750]
        - paragraph [ref=e751]:
          - text: "This 200-mile swoop along Mexico’s Pacific coast is a highlight reel of attractions: golden beaches, culturally rich small towns, and a growing number of luxurious resorts from which to explore. One of the biggest new developments is Nauka, a 900-plus-acre community that will debut at the end of 2025. It’s home to Siari Riviera Nayarit, a Ritz-Carlton Reserve, which will have 91 rooms, 34 residences, the region’s largest swimmable beach, a Tom Fazio golf course, and both dining and wellness programs rooted in Indigenous Huichol traditions. Nearby Punta Mita, meanwhile, will welcome a new private beachfront residential community, Litibú Bay Club, at the end of 2026, joining the existing Four Seasons Resort, One&Only Mandarina, the St. Regis Resort, and"
          - link "Rosewood Mandarina" [ref=e752] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/rosewood-mandarina-mexico-hotel-review-first-look-11740094
          - text: ", which lies roughly an hour away. And that’s not all: Both Montage and Pendry are slated to open resorts in the region in 2027. For all the options, a big knock on Nayarit has long been that it’s difficult to reach—but that’s also changing. In July 2025, Volaris launched nonstop flights from Los Angeles International to Tepic International Airport, the regional hub, which was recently revamped with a new terminal and extended runways; Air Canada and United will follow in December 2025 with nonstops from Vancouver and Houston, respectively.—"
          - link "Alisha Prakash" [ref=e753] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/author/alisha-prakash
            - emphasis [ref=e754]: Alisha Prakash
        - heading "DESTINATIONS FOR" [level=3] [ref=e756]
        - heading "NATURE LOVERS" [level=2] [ref=e757]
        - 'figure "An elk grazes near Jasper, Alberta. Photo: Taylor Roades/Travel + Leisure" [ref=e758]':
          - img "An elk grazing in a scenic hilly area with trees and sunlight in the background" [ref=e761]
          - generic [ref=e762]:
            - text: An elk grazes near Jasper, Alberta.
            - generic [ref=e763]:
              - text: "Photo:"
              - paragraph [ref=e764]: Taylor Roades/Travel + Leisure
        - heading "ALBERTA" [level=3] [ref=e765]
        - paragraph [ref=e766]:
          - text: "The epic peaks of the Canadian Rockies, the hallucinatory blue of Moraine Lake in Banff National Park, and amazing wildlife, including bison, grizzlies, and elk: Alberta has long been a place full of majestic natural beauty. But some exciting developments are making this western province a particularly noteworthy destination in 2026. “The"
          - link "Rimrock Resort Hotel" [ref=e767] [cursor=pointer]:
            - /url: https://www.rimrockresort.com/
          - text: in Banff is undergoing a full transformation and will reopen in 2026,” says T+L
          - link "A-List advisor Mark Telio" [ref=e768] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/marc-telio-11887326
          - text: ", who specializes in trips to Canada and notes that the refresh is “a welcome evolution in mountain hospitality.” At the"
          - link "Fairmont Chateau Lake Louise" [ref=e769] [cursor=pointer]:
            - /url: https://www.fairmont.com/en/hotels/lake-louise/fairmont-chateau-lake-louise.html
          - text: ", a new thermal wellness facility,"
          - link "Basin Glacial Waters" [ref=e770] [cursor=pointer]:
            - /url: https://www.chateau-lake-louise.com/wellness/basin-glacial-waters/
          - text: ", will introduce cutting-edge practices at the historic property. Calgary’s Glenbow Museum, which spotlights Western Canadian and Indigenous art and history, is also slated to reopen in 2026 after a $120 million renovation. Jasper, which suffered"
          - link "devastating, deadly wildfires in July 2024" [ref=e771] [cursor=pointer]:
            - /url: https://en.wikipedia.org/wiki/2024_Jasper_wildfire
          - text: ", is bouncing back, according to tourism insiders who spoke with T+L; the Fairmont Jasper Park Lodge is unveiling a major renovation in 2026. For all the change, some of Alberta’s classic draws remain as compelling as ever. “The fly fishing is world-class, and the mountain-bike scene has come leaps and bounds,” says"
          - link "Kevin Jackson" [ref=e772] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/kevin-jackson-11886495
          - text: ", an A-List advisor who specializes in trips to national parks. “I also love heli-hiking to get away from the crowds.”—"
          - link "Asa Canty" [ref=e773] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/asa-canty-11850048
            - emphasis [ref=e774]: Asa Canty
        - 'figure "The River Arts District in Asheville, North Carolina. Photo: Stephan Pruitt/Visit Asheville" [ref=e775]':
          - img "People lined up outside a colorful building in the River Arts District in Asheville NC participating in a community event" [ref=e778]
          - generic [ref=e779]:
            - text: The River Arts District in Asheville, North Carolina.
            - generic [ref=e780]:
              - text: "Photo:"
              - paragraph [ref=e781]: Stephan Pruitt/Visit Asheville
        - heading "ASHEVILLE, NORTH CAROLINA" [level=3] [ref=e782]
        - paragraph [ref=e783]:
          - text: "“My biggest concern post-hurricane was: Will people give up?” says Meherwan Irani, the owner of"
          - link "Chai Pani" [ref=e784] [cursor=pointer]:
            - /url: https://chaipani.com/
          - text: ", an Asheville restaurant that served as a base for World Central Kitchen during Hurricane Helene in September 2024. The Category 4 storm decimated large swaths of Asheville’s River Arts District and Biltmore Village. “What I’ve seen over the last year was people not throwing in the towel, but choosing to rebuild, sometimes against financial odds.” Among the rebuilt businesses eager to welcome back travelers is"
          - link "Marquee Asheville" [ref=e785] [cursor=pointer]:
            - /url: https://marqueeasheville.com/
          - text: ", a market of about 350 independent artists and makers that was “wiped off the map during the storms,” Irani says. The YMI Cultural Center, a hub for Black creatives, just completed a $6 million refresh with updated programming, including exhibitions from Affrilachian and Black Highlander artists in residence and live performances. For the touch-grass travel set,"
          - link "French Broad Adventures" [ref=e786] [cursor=pointer]:
            - /url: https://www.frenchbroadrafting.com/
          - text: ", though its headquarters flooded during Hurricane Helene, is still operating whitewater rafting, repelling, and e-biking trips just a short drive from downtown. As hikers navigate a post-Helene Asheville, they can find trail recommendations through the"
          - link "Southern Appalachian Highlands Conservancy" [ref=e787] [cursor=pointer]:
            - /url: https://appalachian.org/home/
          - text: ", an organization that has been instrumental in clearing obstructed trails. Of the restaurants that sustained damage,"
          - link "Corner Kitchen" [ref=e788] [cursor=pointer]:
            - /url: https://thecornerkitchen.com/
          - text: has reopened in Biltmore Village, and the teams behind Cucina 24 and Vivian, which were both destroyed, have joined forces to open a new American restaurant,
          - link "Crusco" [ref=e789] [cursor=pointer]:
            - /url: https://www.restaurantcrusco.com/
          - text: ". Travelers keen to support the revival of western North Carolina can stay at reopened hotels that were hit hard by flooding:"
          - link "Wrong Way River Lodge & Cabins" [ref=e790] [cursor=pointer]:
            - /url: https://www.wrongwaycampground.com/
          - text: ", just outside the River Arts District, is back with well-equipped A-frame cabins, and"
          - link "Grand Bohemian Lodge" [ref=e791] [cursor=pointer]:
            - /url: https://www.kesslercollection.com/bohemian-asheville/
          - text: ", an Autograph Collection hotel in Biltmore Village, has restored hunting-lodge-inspired interiors."
          - emphasis [ref=e792]:
            - text: —
            - link "Maya Kachroo-Levine" [ref=e793] [cursor=pointer]:
              - /url: https://www.travelandleisure.com/author/maya-kachroo-levine
        - 'figure "Picos de Europa National Park in Asturias, Spain. Photo: James Rajotte/Travel + Leisure" [ref=e794]':
          - img "Two people walking on a stone path through a scenic outdoor area with mountains and mist in the background a wooden bench and fence nearby" [ref=e797]
          - generic [ref=e798]:
            - text: Picos de Europa National Park in Asturias, Spain.
            - generic [ref=e799]:
              - text: "Photo:"
              - paragraph [ref=e800]: James Rajotte/Travel + Leisure
        - heading "ASTURIAS, SPAIN" [level=3] [ref=e801]
        - paragraph [ref=e802]:
          - text: This small, autonomous region is part of what is often referred to as “Green Spain,” thanks to the spectacular landscapes of the northern coast. It’s also, at a time when Barcelona and Madrid are clocking tens of millions of visitors every year, a corner of Spain that offers tranquility and quiet. It is filled with pilgrimage routes, thermal spas, and mountain retreats, and it’s also home to the country’s first national park, which spans the Picos de Europa range. “What I love about Asturias is the sense that I’m enjoying a spectacular part of the world, steeped in history, with incredible local traditions," says
          - link "Nigel Hack" [ref=e803] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/nigel-hack-11886854
          - text: ", the founder and CEO of Madrid & Beyond and a member of the T+L A-List. “And there’s always the pervading feeling that I’m one of the very few in the know.” That under-the-radar vibe is sure to begin shifting in 2026, when the region plays host to the first annual Climate Biennial, with exhibitions throughout the town of Avilés, and welcomes astrotourists seeking a bucolic place from which to see the total eclipse on August 12. Whatever the motivation for visiting, one thing is certain: The food in Asturias is world-class, with 11 Michelin-star restaurants and long traditions of cheese- and cider-making. But what else would you expect from the birthplace of José Andrés?—"
          - link "Peter Terzian" [ref=e804] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/author/peter-terzian
            - emphasis [ref=e805]: Peter Terzian
        - 'figure "Lake Atitlán, in Guatemala. Photo: Joaquin Trujillo/Travel + Leisure" [ref=e806]':
          - img "Wooden docks extending into a scenic lake with boats surrounded by mountains on a clear day" [ref=e809]
          - generic [ref=e810]:
            - text: Lake Atitlán, in Guatemala.
            - generic [ref=e811]:
              - text: "Photo:"
              - paragraph [ref=e812]: Joaquin Trujillo/Travel + Leisure
        - heading "GUATEMALA" [level=3] [ref=e813]
        - paragraph [ref=e814]:
          - text: "Awe-inspiring Guatemala is filled with natural wonders: impenetrable jungles, mangrove forests, daunting volcanoes like Pacaya, and towering waterfalls like the Salto de Chilascó. It’s also been, historically, difficult to navigate, owing to creaky domestic infrastructure and limited international flights. But as the country has embarked on a"
          - link "significant update of its rural highways" [ref=e815] [cursor=pointer]:
            - /url: https://www.worldbank.org/en/news/press-release/2025/06/26/banco-mundial-respalda-mejoras-viales-conectividad-rural-guatemala
          - text: ", the tide may be turning on accessing the natural and cultural riches of the country. Another boost comes in the form of more flights: Avianca plans to increase its service to the country, by way of a new nonstop flight from Miami to Guatemala City; both Frontier and United Airlines are increasing"
          - link "service from Houston" [ref=e816] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/frontier-adds-20-new-routes-across-usa-mexico-central-america-11797867
          - text: ; JetBlue started a nonstop from Fort Lauderdale in April 2025. Key destinations such as Antigua and Lake Atitlán remain as in-demand as ever, says A-List advisor
          - link "Patricia Johnson" [ref=e817] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/patricia-johnson-11887294
          - text: . She notes that a new boutique hotel,
          - link "Guatemala Dreams" [ref=e818] [cursor=pointer]:
            - /url: https://www.guatemaladreams.com/?fbclid=IwY2xjawNCUBBleHRuA2FlbQIxMABicmlkETFjT0p5ckFaQ0pWaWFpejRWAR45iNx6ZmvNpPZ_W-wUjH57-B7bgcR9327RXuByvM9PtGkX5YjFTKFlTo_h4Q_aem_IpZDATlKbXXJoXRadZXWAA
          - text: ", will open in the town of San Lucas Tomalin. “It will have a pool overlooking the lake and volcanoes, a large whirlpool, a sauna, and a private dock.”—"
          - link "Asa Canty" [ref=e819] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/asa-canty-11850048
            - emphasis [ref=e820]: Asa Canty
        - 'figure "The Oberoi Vindhyavilas Wildlife Resort, in Madhya Pradesh. Photo: The Oberoi Vindhyavilas Wildlife Resort, Bandhavgarh, Madhya Pradesh" [ref=e821]':
          - img "Luxury bedroom interior with a centered bed decorative cushions symmetrical lamps and artwork on the walls" [ref=e824]
          - generic [ref=e825]:
            - text: The Oberoi Vindhyavilas Wildlife Resort, in Madhya Pradesh.
            - generic [ref=e826]:
              - text: "Photo:"
              - paragraph [ref=e827]: The Oberoi Vindhyavilas Wildlife Resort, Bandhavgarh, Madhya Pradesh
        - heading "MADHYA PRADESH, INDIA" [level=3] [ref=e828]
        - paragraph [ref=e829]:
          - text: India’s population of tigers is booming, and the best place to spot these animals is this central state. “There’s no better place to find tigers than the lush forests of Madhya Pradesh,” says Jennifer Morris, a product manager at Abercrombie & Kent who specializes in India travel. Wildlife watchers will be pleased by the arrival of some noteworthy places to stay, and Oberoi is behind two of them. Vindhyavilas has 19 roomy, air-conditioned tents (and two villas) located 20 minutes by car from Bandhavgarh National Park, where 150 Bengal tigers now reside. Rajgarh Palace, meanwhile, is a spectacular hilltop palace built in the 1600s that not only offers access to Panna National Park’s 90-plus tigers but is also a short drive from the 1,000-year-old, UNESCO World Heritage–recognized temples of Khajuraho. In 2026, these two properties will be joined by a new Evolve Back hotel in the ancient fort city of Mandu. Increased domestic flight service to the regional hubs of Jabalpur and Khajuraho ensure that this once remote, overlooked region is ready for its turn in the spotlight.—
          - link "Flora Stubbs" [ref=e830] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/author/flora-stubbs
            - emphasis [ref=e831]: Flora Stubbs
        - 'figure "Sunset over the Masai Mara. Photo: Nick Ballón/Travel + Leisure" [ref=e832]':
          - img "A cheetah rests on a mound in a grassy savanna landscape with trees and hills in the background" [ref=e835]
          - generic [ref=e836]:
            - text: Sunset over the Masai Mara.
            - generic [ref=e837]:
              - text: "Photo:"
              - paragraph [ref=e838]: Nick Ballón/Travel + Leisure
        - heading "MASAI MARA, KENYA" [level=3] [ref=e839]
        - paragraph [ref=e840]:
          - text: Known for breathtaking Great Migration herds of wildebeest and zebra, southwestern Kenya’s Masai Mara is a dream destination for many. What makes the region especially compelling now is the opening of Wilderness Mara, a 12-suite tented camp along the Mara River that has all the trappings you’d expect from this luxury outfitter, with freestanding tubs, outdoor showers, and elevated private decks. Wilderness Mara Villas, a two-villa camp available for exclusive-use, will open nearby in 2026. Also in the region is
          - link "andBeyond Bateleur Camp" [ref=e841] [cursor=pointer]:
            - /url: https://www.andbeyond.com/lodge-editorial/bateleur-camp/
          - text: ", a 19-suite resort that T+L readers recently named"
          - link "the No. 1 hotel in the world" [ref=e842] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/andbeyond-bateleur-camp-masai-mara-hotel-review-11767495
          - text: . Those planning a trip should keep an eye out for properties in the Mara’s private conservancy, which has restrictions on the number of visitors and vehicles, and allows for bush walks and night drives, says T+L A-List specialist
          - link "Elizabeth Gordon" [ref=e843] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/elizabeth-gordon-8711332
          - text: of Extraordinary Journeys. She also advises clients that, when it comes to safaris, the magic lies not only in the big moments but also the smaller ones, whether that’s spotting a vibrant Superb Starling or observing newborn animals with their mothers. “The migration is not on a schedule,” Gordon notes. “If you see it, it’s icing on the cake.”—
          - link "Elizabeth Cantrell" [ref=e844] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/elizabeth-cantrell-5442316
            - emphasis [ref=e845]: Elizabeth Cantrell
        - 'figure "Part of a public sculpture trail, as seen from Transmission Gully, New Zealand. Photo: The Morgans/Visit New Zealand" [ref=e846]':
          - img "Large bench in a hilly landscape a person sitting below it" [ref=e849]
          - generic [ref=e850]:
            - text: Part of a public sculpture trail, as seen from Transmission Gully, New Zealand.
            - generic [ref=e851]:
              - text: "Photo:"
              - paragraph [ref=e852]: The Morgans/Visit New Zealand
        - heading "NEW ZEALAND" [level=3] [ref=e853]
        - paragraph [ref=e854]:
          - text: "“It’s an exciting time to visit New Zealand because the country is thriving and our travel infrastructure has never been better,” says Alesha Stefanissin, an executive at Great Journeys New Zealand, an outfitter that arranges rail journeys across the country. Those seeking adventure will be able to cycle or hike the new 20-mile Kawarau Gorge Trail, which is slated to open in early 2026 and will link Queenstown to Lake Dunstan. Art lovers can discover a sculpture trail that opened to the public near Pāuatahanui in spring 2025. And sky-watchers should head for New Zealand’s just-announced Dark Sky community, Naseby, the country’s first. New hotels are also on the way: On Waiheke Island, the Estate at Allpress Olive Groves is slated to open in 2026 with front-row views of the Hauraki Gulf. In Queenstown, the QT brand is transforming the Rydges Lakeside Queenstown into a 221-room lakefront property; it follows the 15-suite ROKI Collection, which debuted in the town in September 2025. Other newcomers include the Pullman Hamilton in Auckland and the Distinction Invercargill Hotel near the bottom of the South Island. It’s also getting more comfortable to fly there, thanks to the Skynest, the world’s first lie-flat sleep pods in economy, which Air New Zealand will debut in 2026 on New York–to–Auckland routes, joining existing nonstop options from major U.S. cities on American Airlines, Delta Air Lines, Qantas, and United Airlines.—"
          - link "Alisha Prakash" [ref=e855] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/author/alisha-prakash
            - emphasis [ref=e856]: Alisha Prakash
        - 'figure "The Baobab Treehouse at Xigera Safari Lodge, in Botswana. Photo: Xigera Safari Lodge" [ref=e857]':
          - img "Illuminated treehouse designed to resemble a baobab in a natural landscape at dusk" [ref=e860]
          - generic [ref=e861]:
            - text: The Baobab Treehouse at Xigera Safari Lodge, in Botswana.
            - generic [ref=e862]:
              - text: "Photo:"
              - paragraph [ref=e863]: Xigera Safari Lodge
        - heading "OKAVANGO DELTA, BOTSWANA" [level=3] [ref=e864]
        - paragraph [ref=e865]:
          - text: "This labyrinthine maze of islands, swamps, and waterways has long been one of the world’s foremost safari destinations, where you can spot endangered African wild dogs on the prowl and Pel’s fishing owls soaring in the sky, all in relative isolation. For years, the lodges there leaned spartan in their décor: a byproduct of the remote location, and, perhaps, a lack of imagination on the part of operators. Now that’s changing, particularly in the Moremi Game Reserve, an area in the eastern part of the delta that spans nearly 2,000 square miles. “The top lodges there now rival the top lodges anywhere in Africa,” says"
          - link "Mark Lakin" [ref=e866] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/author/mark-lakin
          - text: ", a member of the T+L Travel Advisory Board and a safari specialist. Xigera Safari Lodge, for example, is a bold, colorful property that was on the forefront of the shift when it opened in 2020: The lodge showcases one of Africa’s largest private art collections and is also home to a stunning Baobab Treehouse suite, with a sky-bed open to the stars. Adjacent to the Moremi is"
          - link "Baines' Lodge, an A&K Sanctuary" [ref=e867] [cursor=pointer]:
            - /url: https://www.abercrombiekent.com/stays/safari-lodges/baines-lodge-botswana
          - text: ", which reopened in August 2025, with its six re-imagined suites. And other ambitious properties are arriving across the delta: In March 2026, andBeyond will open two properties, each with just three tents, known as Nxabega Under Canvas and Sandibe Under Canvas. Singita plans to open Elela, a collection of eight private “camps,” which will range from one- to four-bedrooms, in December 2026. And Wilderness Mombo has added a new wellness “Sanctuary” that delivers pampering after game drives with meditation cocoons, a sauna, an ice bath, and a remedy bar featuring medicinal herbs for a healthful spin on the traditional sundowner. The forthcoming lodge from"
          - link "Elo" [ref=e868] [cursor=pointer]:
            - /url: https://www.instagram.com/elobotswana/?hl=en
          - text: is also one to watch, according to T+L A-List advisor
          - link "Nicola Shepherd" [ref=e869] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/nicola-shepherd-11887373
          - text: ", who says the new property will be “the first of its kind,” with villas staffed by private guides and chefs.—"
          - link "Jacqui Gifford" [ref=e870] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/author/jacqueline-gifford
            - emphasis [ref=e871]: Jacqui Gifford
        - 'figure "Taking the plunge in Oulu, Finland. Photo: Oulu2026" [ref=e872]':
          - img "Children playing in the water near a dock one jumping into the lake with buildings visible in the background" [ref=e875]
          - generic [ref=e876]:
            - text: Taking the plunge in Oulu, Finland.
            - generic [ref=e877]:
              - text: "Photo:"
              - paragraph [ref=e878]: Oulu2026
        - heading "OULU, FINLAND" [level=3] [ref=e879]
        - paragraph [ref=e880]:
          - text: "Mention Finland, and the first thing that springs to mind may be the snowy wilds of Lapland. But in 2026, the spotlight will shift to a new cultural destination: Oulu. Situated on the Gulf of Bothnia, Oulu has been named the"
          - link "European Capital of Culture for 2026" [ref=e881] [cursor=pointer]:
            - /url: https://oulu2026.eu/en/
          - text: —a designation that promises a year packed with more than 500 events spanning contemporary art, live music, Indigenous heritage, and sustainability. Visitors can expect regional flavors at
          - link "Arctic Food Lab" [ref=e882] [cursor=pointer]:
            - /url: https://oulu2026.eu/en/programme/culture-programme/arctic-food-lab/
          - text: ; the
          - link "Climate Clock" [ref=e883] [cursor=pointer]:
            - /url: https://oulu2026.eu/en/programme/culture-programme/climate-clock/
          - text: ", a citywide public art trail highlighting environmental themes; and the"
          - link "Solstice Festival" [ref=e884] [cursor=pointer]:
            - /url: https://solsticefestival.fi/
          - text: come June. The quirky
          - link "Air Guitar World Championships" [ref=e885] [cursor=pointer]:
            - /url: https://airguitarworldchampionships.com/en/home/
          - text: ", an Oulu tradition since 1996, is on the lineup as well. Oulu was also featured on Intrepid Travel’s 2026"
          - link "Not Hot List" [ref=e886] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/intrepid-not-hot-underrated-destination-list-2026-11803423
          - text: ", a curated selection of under-the-radar destinations poised for discovery. And with good reason:"
          - link "According to the Finnish Meteorological Institute" [ref=e887] [cursor=pointer]:
            - /url: https://en.ilmatieteenlaitos.fi/auroras-in-finland
          - text: ", the northern lights are visible there nearly 25 percent of the year, offering travelers a chance to witness the aurora without the heavy crowds of better-known northern locales. And getting there has never been easier. In addition to train and air connections via Helsinki, two new international routes are opening doors: Discover Airlines launched direct seasonal service from Frankfurt in summer 2025, while AirBaltic will connect Oulu to Riga, Latvia, from March through October."
          - emphasis [ref=e888]:
            - text: —
            - link "Susmita Baral" [ref=e889] [cursor=pointer]:
              - /url: https://www.travelandleisure.com/susmita-baral-7105069
        - 'figure "The Hallgrímskirkja in Reykjavík, Iceland. Photo: Getty Images" [ref=e890]':
          - img "Hallgrmskirkja church in Reykjavik Iceland with the northern lights in the sky" [ref=e893]
          - generic [ref=e894]:
            - text: The Hallgrímskirkja in Reykjavík, Iceland.
            - generic [ref=e895]:
              - text: "Photo:"
              - paragraph [ref=e896]: Getty Images
        - heading "REYKJAVÍK, ICELAND" [level=3] [ref=e897]
        - paragraph [ref=e898]:
          - text: What’s happening over Iceland in 2026 may be as exciting as what’s happening on the ground. The August 12 solar eclipse will be fully visible from the country’s westernmost points, including its capital city of Reykjavík. Meanwhile, increased solar activity has resulted in some of the most frequent and powerful northern lights in recent memory. “You can see the lights in Reykjavík fairly well if you find a secluded spot, such as at the Grotta Lighthouse,” says Dagný Stefánsdóttir, the CEO and co-owner of luxury travel company
          - link "Hidden Iceland" [ref=e899] [cursor=pointer]:
            - /url: https://hiddeniceland.is/
          - text: . Not that celestial shows are the only reason to linger in this friendly, walkable city. “There is so much to see and do,” Stefánsdóttir says. “The number of Michelin-starred and Michelin-recommended restaurants has increased substantially with Dill, OTO, OX, and Tides all opening over the past few years.” Also fresh on the scene are some worthwhile new hotels, including the Hotel Reykjavík Saga; the Iceland Parliament Hotel, Curio Collection by Hilton; and the Reykjavík Edition.—
