        - heading "SANTA FE" [level=3] [ref=e261]
        - paragraph [ref=e262]:
          - text: If you’ve been waiting for a sign to visit Santa Fe, 2026 is it. Voted
          - link "T+L readers’ favorite U.S. city of 2025" [ref=e263] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/worlds-best-awards-2025-cities-us-11740107
          - text: ", the high-desert destination nestled in the Sangre de Cristo foothills is celebrating a banner year packed with exciting milestones. The 100th anniversary of Route 66 brings festive programming citywide, while the 10th birthday of the"
          - link "Santa Fe Margarita Trail" [ref=e264] [cursor=pointer]:
            - /url: https://www.santafe.org/visiting-santa-fe/self-guided-tours/santa-fe-margarita-trail/
          - text: invites visitors to toast the city’s staple cocktail. A new artisan food hall,
          - link "Heritage Market" [ref=e265] [cursor=pointer]:
            - /url: https://www.heritagerec.com/properties/heritage-market
          - text: ", is also coming, adding to Santa Fe’s vibrant culinary scene. October 2025 saw the debut of a new nonstop American Airlines flight that connects the city to Los Angeles International Airport. In winter 2026, brand-new"
          - link "Hotel Flora" [ref=e266] [cursor=pointer]:
            - /url: https://www.hotelflorasantafe.com/
          - text: will bring boutique, design-forward charm to the city’s hospitality offerings, already anchored by
          - link "Bishop’s Lodge, Auberge Collection" [ref=e267] [cursor=pointer]:
            - /url: https://auberge.com/bishops-lodge/
          - text: ", a"
          - link "T+L reader favorite" [ref=e268] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/worlds-best-awards-2025-resorts-western-us-11736030
          - text: with “curated outdoor adventures, luxury accommodations, and experiences that let visitors fully immerse themselves in the spirit and beauty of Santa Fe,” according to the property’s general manager, Andrea Gates. The Washington Inn, an all-suite hotel just a few blocks from Santa Fe Plaza, will also welcome guests in early 2026. Come spring,
          - link "The Inn of the Five Graces" [ref=e269] [cursor=pointer]:
            - /url: https://fivegraces.com/
          - text: will unveil four new suites, each with a fireplace and adobe walls. With more than 300 days of sunshine, lively art galleries and markets, and a jam-packed calendar of events, now is the time to go.
          - emphasis [ref=e270]:
            - text: —
            - link "Maddie Hiatt" [ref=e271] [cursor=pointer]:
              - /url: https://www.travelandleisure.com/maddie-hiatt-11679763
