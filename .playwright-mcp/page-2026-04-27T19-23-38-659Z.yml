    - article [ref=e62]:
      - generic [ref=e64]:
        - heading "THE 50 BEST PLACES TO TRAVEL IN 2026" [level=1] [ref=e65]
        - generic [ref=e68]:
          - generic [ref=e69]:
            - text: By
            - link "Travel + Leisure Editors" [ref=e71] [cursor=pointer]:
              - /url: https://www.travelandleisure.com/author/travel-leisure-editors
            - text: "|"
          - generic [ref=e72]: Published on November 18, 2025
      - generic [ref=e75]:
        - figure [ref=e76]:
          - img "Where to Go 2026 badge" [ref=e79]
        - paragraph [ref=e80]:
          - emphasis [ref=e81]: Where should I go next?
          - text: If there’s one question we hear more than any other at
          - emphasis [ref=e82]: Travel + Leisure
          - text: ", it’s this enduring ask. Thankfully, our staff is constantly on the move, exploring the world on assignment and on personal adventures, so we have more than a few opinions on the best places to travel now. That first-person expertise informs many of the picks on T+L’s annual list of the best places to travel. For this edition, our staff vetted more than 100 nominees, with an eye to what makes a place worth visiting in the year ahead. Many of our 50 winners are places that were once difficult to reach but are becoming more accessible thanks to ambitious new infrastructure projects or increased service from airlines. We also tapped the expertise of travel-world insiders and many members of the"
          - link "T+L A-List" [ref=e83] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/a-list/a-list-travel-advisors
          - text: to find out which big cities are the most resonant right now—and which underrated spots are serving up culinary experiences you won’t find anywhere else. Of course major cultural events including the 2026 FIFA World Cup, the Winter Olympics, and
          - link "America250" [ref=e84] [cursor=pointer]:
            - /url: https://america250.org/
          - text: also factor into our picks. Whatever the motivation for your trips in the year ahead—an adrenaline rush, some blissed-out beach vibes, or full-on cultural immersion—we trust our latest list will help with more than a few answers to that perennial travel question. So, where will the new year take you?
          - emphasis [ref=e85]:
            - text: —Edited by
            - link "Paul Brady" [ref=e86] [cursor=pointer]:
              - /url: https://www.travelandleisure.com/author/paul-brady
            - text: and
            - link "Alisha Prakash" [ref=e87] [cursor=pointer]:
              - /url: https://www.travelandleisure.com/author/alisha-prakash
        - heading "DESTINATIONS FOR" [level=2] [ref=e92]
        - heading "DESTINATIONS FOR" [level=3] [ref=e94]
        - heading "FOOD AND DRINKS" [level=2] [ref=e95]
        - 'figure "Little Victory Wine Bar in Carlsbad, California. Photo: Kimberly Motos/Visit Carlsbad" [ref=e96]':
          - img "Interior of a restaurant with tables chairs wine shelves and natural light from windows" [ref=e99]
          - generic [ref=e100]:
            - text: Little Victory Wine Bar in Carlsbad, California.
            - generic [ref=e101]:
              - text: "Photo:"
              - paragraph [ref=e102]: Kimberly Motos/Visit Carlsbad
        - heading "CARLSBAD, CALIFORNIA" [level=3] [ref=e103]
        - paragraph [ref=e104]:
          - text: “The culinary scene in Carlsbad has really changed,” says Emily Brubaker, winner of NBC’s
          - link "Yes! Chef" [ref=e105] [cursor=pointer]:
            - /url: https://www.omnihotels.com/media-center/recent-news/2025/07/08/19/34/omni-la-costa-resort-and-spa-celebrates-executive-chef-emily-brubakers-win-on-nbcs-yes
            - emphasis [ref=e106]: Yes! Chef
          - text: and executive chef at
          - link "Omni La Costa Resort & Spa" [ref=e107] [cursor=pointer]:
            - /url: https://www.omnihotels.com/hotels/san-diego-la-costa
          - text: ", a property previously known more for golf and tennis than food. She now hosts a thriving “"
          - link "Chefs and Friends" [ref=e108] [cursor=pointer]:
            - /url: https://www.omnihotels.com/hotels/san-diego-la-costa/dining/chef-and-friends
          - text: ” dinner series and oversees eight dining outlets with ingredients sourced from on-property herb gardens and beehives. “When I grew up here, it was fish tacos, burritos, sandwich shops, but there was no 'dining,'" Brubaker notes. Now she’s able to rattle off the names of Michelin-star destinations in her own backyard. Many of those stars are linked to restaurateur John Resnick and Eric Bost, executive chef at
          - link "Jeune et Jolie" [ref=e109] [cursor=pointer]:
            - /url: https://www.jeune-jolie.com/
          - text: ", a modern French bistro, which has maintained its Michelin star since 2021, and the intimate indoor-outdoor chef’s table experience at"
          - link "Lilo" [ref=e110] [cursor=pointer]:
            - /url: https://www.restaurantlilo.com/
          - text: ", which was awarded a star just 10 weeks after opening in April. Equally noteworthy are the rustic live-fire restaurant"
          - link "Campfire" [ref=e111] [cursor=pointer]:
            - /url: https://www.thisiscampfire.com/
          - text: and the buzzing all-day café and bar
          - link "Wildland" [ref=e112] [cursor=pointer]:
            - /url: https://www.wildlandallday.com/
          - text: ". Each venue has its own personality, but Bost says they have one thing in common: “They’re all California restaurants: outdoor dining, local farms, vibrant food.” To make fine dining work in a casual SoCal beach city, Bost adds, it has to be approachable and it has to be local, making the most of the area’s Mediterranean microclimate, abundant farmland, and proximity to the sea. California wines are also easily explored in the area, particularly at"
          - link "Little Victory Wine Bar" [ref=e113] [cursor=pointer]:
            - /url: https://www.littlevictorywine.com/
          - text: ", which Jeremy Simpson of L.A.’s Bestia opened earlier this year with a focus on natural wines. Autograph Collection’s"
          - link "Hotel Solea" [ref=e114] [cursor=pointer]:
            - /url: https://www.thehotelsolea.com/
          - text: is slated to open its doors in spring 2026, adding a new alfresco Italian restaurant, Verise, to the mix.
          - emphasis [ref=e115]:
            - text: —
            - link "Nina Ruggiero" [ref=e116] [cursor=pointer]:
              - /url: https://www.travelandleisure.com/author/nina-ruggiero
        - 'figure "Nasi lemak, a traditional Malaysian dish featuring coconut rice. Photo: Jordan Lye/Getty Images" [ref=e121]':
          - img "Traditional Malaysian dish nasi lemak served with rice egg anchovies peanuts cucumber slices sambal and curry chicken on a decorative plate" [ref=e124]
          - generic [ref=e125]:
            - text: Nasi lemak, a traditional Malaysian dish featuring coconut rice.
            - generic [ref=e126]:
              - text: "Photo:"
              - paragraph [ref=e127]: Jordan Lye/Getty Images
        - heading "MALAYSIA" [level=3] [ref=e128]
        - paragraph [ref=e129]:
          - text: Breakfast in Malaysia is more than just a meal—it’s a shared ritual that binds the country together. If that sounds like hyperbole, consider that UNESCO recently recognized the country’s morning spread as an
          - link "Intangible Cultural Heritage of Humanity" [ref=e130] [cursor=pointer]:
            - /url: https://ich.unesco.org/en/RL/breakfast-culture-in-malaysia-dining-experience-in-a-multi-ethnic-society-02113
          - text: . Made up of such dishes and beverages as
          - emphasis [ref=e131]: nasi lemak, roti canai,
          - text: and
          - emphasis [ref=e132]: teh tarik,
          - text: it is “a distinctive element of culture and identity that connects diverse ethnic groups within Malaysia,” according to UNESCO. The country’s food scene is getting elevated in other ways, too. The world’s second-tallest skyscraper, Merdeka 118 in Kuala Lumpur, is home to a
          - link "Park Hyatt," [ref=e133] [cursor=pointer]:
            - /url: https://www.hyatt.com/park-hyatt/en-US/kulph-park-hyatt-kuala-lumpur'
          - text: which has
          - link "a 75th-floor restaurant doing wood-fired cuisine" [ref=e134] [cursor=pointer]:
            - /url: https://www.hyatt.com/park-hyatt/en-US/kulph-park-hyatt-kuala-lumpur%27
          - text: . The building is also slated to add both an
          - link "al fresco" [ref=e135] [cursor=pointer]:
            - /url: https://hype.my/5-fun-facts-about-kls-upcoming-118-mall/
          - text: “Eat Street” and a
          - link "Malaysian Artisan District" [ref=e136] [cursor=pointer]:
            - /url: https://www.instagram.com/p/DB0X77mT_eF/'
          - text: that will spotlight the nation’s culinary heritage. Other soon-to-open hotels, from the likes of
          - link "Conrad" [ref=e137] [cursor=pointer]:
            - /url: https://www.hilton.com/en/hotels/kulskci-conrad-kuala-lumpur/
          - text: and
          - link "Waldorf Astoria" [ref=e138] [cursor=pointer]:
            - /url: https://stories.hilton.com/releases/waldorf-astoria-hotels-resorts-enters-a-new-era-of-luxury
          - text: ", will lend high-end dining options to the city’s scene. Meanwhile, Malaysia as a whole has become a go-to destination, thanks to the return of"
          - link "Belmond’s Eastern & Oriental Express," [ref=e139] [cursor=pointer]:
            - /url: https://www.lvmh.com/en/news-lvmh/belmond-announces-return-of-eastern-oriental-express-and-new-journeys-to-the-heart-of-malaysia
          - text: which knits the country together and enables visitors to savor it slowly.—
          - link "Denny Lee" [ref=e140] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/denny-lee-7963123
            - emphasis [ref=e141]: Denny Lee
        - 'figure "Mawn, in Philadelphia. Photo: Hannah Boothman/Mawn" [ref=e146]':
          - img "Various dishes arranged on a table including grilled fish soup with greens and meat clams and oysters with garnishes" [ref=e149]
          - generic [ref=e150]:
            - text: Mawn, in Philadelphia.
            - generic [ref=e151]:
              - text: "Photo:"
              - paragraph [ref=e152]: Hannah Boothman/Mawn
        - heading "PHILADELPHIA" [level=3] [ref=e153]
        - paragraph [ref=e154]:
          - text: The rich history is still there, but Philly these days is all about the innovative, award-winning chefs from around the globe who are making the city a must-experience food destination. “There’s a constant stream of things to be excited about,” says Amanda Shulman, co-founder of Libbie Loup Hospitality and executive chef of Her Place Supper Club in the Rittenhouse Square neighborhood. “There are more and more spots bringing different flavors and vibes—a lot of people are just going for it and trying new models and new styles and seeing what happens.” Among the hottest venues in town are Mawn, a Southeast Asia–inspired noodle joint helmed by
          - link "2025 Food & Wine Best New Chef Phila Lorn" [ref=e155] [cursor=pointer]:
            - /url: https://www.foodandwine.com/2025-best-new-chefs-phila-lorn-11776932
            - text: "2025"
            - emphasis [ref=e156]: Food & Wine
            - text: Best New Chef Phila Lorn
          - text: "; La Jefa, an all-day Mexican cafe serving elevated cocktails and inside-out chilaquiles; and Vetri Cucina, which does “a gorgeous pasta tasting menu in an old-school townhouse,” Shulman says. (She also likes Emei, Osteria, and Ocean Harbor.) Global tastemakers are certainly taking note: Philadelphia just got its own section in the new “Michelin Guide Northeast Cities,” recognition that will shine a spotlight on more top tables. As electric as the food scene may be, there are plenty of other draws in the year ahead, including America250 celebrations. Then there’s the soccer: Six FIFA World Cup matches will take place at Lincoln Financial Field in June and July.—"
          - link "Jess Feldman" [ref=e157] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/jess-feldman-8581644
            - emphasis [ref=e158]: Jess Feldman
        - 'figure "Les Hauts de Sancerre. Photo: Pierre Vachaude/Les Hauts de Sancerre" [ref=e159]':
          - img "People seated at a table in the garden area of a grand castlelike building with a scenic view and sculptures nearby" [ref=e162]
          - generic [ref=e163]:
            - text: Les Hauts de Sancerre.
            - generic [ref=e164]:
              - text: "Photo:"
              - paragraph [ref=e165]: Pierre Vachaude/Les Hauts de Sancerre
        - heading "SANCERRE, FRANCE" [level=3] [ref=e166]
        - paragraph [ref=e167]:
          - text: Don't sleep on the sleepy wine towns of the Loire Valley. Sancerre, the famed wine appellation on the eastern side of the Loire River, is just waking up. The town's 14th-century limestone tower—a symbol of the region gracing the labels of many Sancerre wine bottles—has been closed to the public for most of the past century. Last year, the surrounding 12-acre park, which comprises the tower and the brand-new Les Hauts de Sancerre hotel, began welcoming visitors. “We received 35,000 people last year,” says David Chicard, owner of
          - link "Les Hauts de Sancerre" [ref=e168] [cursor=pointer]:
            - /url: https://hautsdesancerre.com/fr/
          - text: ", and a native"
          - emphasis [ref=e169]: Sancerrois
          - text: spearheading the tower’s restoration, which will be completed in 2026. “Our goal is to open the park to the public twice a year with new art exhibitions.” Currently, Belgian artist Emma Terweduwe has brightly colored textile works on display; in the spring of 2026, a local ceramist will take over. At Les Hauts de Sancerre, which opened with eight rooms in July 2025, the restaurant is also a big draw, helmed by
          - emphasis [ref=e170]: Top Chef France
          - text: finalist Arnaud Munster. Munster, who is in his early 20s, is one of many young creatives breathing new life and flavor into this corner of the Centre-Val de Loire. The Breton couple behind
          - link "La Pomme d’Or" [ref=e171] [cursor=pointer]:
            - /url: https://lapommedorsancerre.fr/
          - text: are cut from the same cloth; the restaurant just pulled in its first Michelin star. And in the center of town, a recently opened gourmet sandwich shop,
          - link "Fólklore" [ref=e172] [cursor=pointer]:
            - /url: https://www.folklore-sancerre.fr/en
          - text: ", now has four guest rooms. Wineries in the area are selling more to American travelers and some are attracting a younger set of tourists with clever pivots, whether making skin-contact"
          - emphasis [ref=e173]: vin d’orange
          - text: Sancerre at
          - link "Domaine Reverdy Ducroux" [ref=e174] [cursor=pointer]:
            - /url: https://www.sancerre-reverdy-ducroux.com/en/
          - text: or offering electric-scooter tours of the vineyards at
          - link "Domaine Durand" [ref=e175] [cursor=pointer]:
            - /url: https://m.domaine-durand.fr/en/
          - text: ’s offshoot tour company,
          - link "Vinorizon" [ref=e176] [cursor=pointer]:
            - /url: https://vinorizon.fr/
          - text: .
          - emphasis [ref=e177]:
            - text: —
            - link "Maya Kachroo-Levine" [ref=e178] [cursor=pointer]:
              - /url: https://www.travelandleisure.com/author/maya-kachroo-levine
        - 'figure "Taipei''s Raohe Street Night Market. Photo: Getty Images" [ref=e183]':
          - img "A food vendor grilling skewers at a night market stall labeled signs describe the food items on wooden boards above the grill" [ref=e186]
          - generic [ref=e187]:
            - text: Taipei's Raohe Street Night Market.
            - generic [ref=e188]:
              - text: "Photo:"
              - paragraph [ref=e189]: Getty Images
        - heading "TAIPEI" [level=3] [ref=e190]
        - paragraph [ref=e191]:
          - text: Taipei is a city for anyone who wants to eat well. The Taiwanese capital hums with more than 30 night markets, including
          - link "Raohe" [ref=e192] [cursor=pointer]:
            - /url: https://www.travel.taipei/zh-tw/attraction/details/1538
          - text: —home to five Michelin-recommended stalls, from Mochi Baby (sugar-dusted rice cakes) to Fuzhou Black Pepper Bun (pork buns). Beyond its street eats, though, are 53 Michelin-star restaurants, like
          - link "Taïrroir" [ref=e193] [cursor=pointer]:
            - /url: https://tairroir.com/?locale=en
          - text: ", which focuses on classic Taiwanese cuisine made with local ingredients, and the French-Asian fusion restaurant"
          - link "A by Alain Huang" [ref=e194] [cursor=pointer]:
            - /url: https://guide.michelin.com/us/en/taipei-region/taipei/restaurant/a
          - text: . In April 2025, the city welcomed
          - link "Capella Taipei" [ref=e195] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/capella-taipei-first-in-hotel-review-11711179
          - text: ", a design-forward luxury hotel that’s home to The Glasshouse, a three-story destination bar stocked with rare whiskies, fine champagne, and Japanese vinyl. “Taipei is this eclectic urban jungle surrounded by literal jungle. You can be in a night market one moment and hiking up a trail the next,” says Clarissa Wei, author of the cookbook “Made in Taiwan.” “The city is compact, so everything overlaps—street stalls next to fine dining, old bazaars beside natural wine bars.” And those wanting a taste of it all will have an easier time visiting, since Starlux Airlines is set to add a nonstop Phoenix-to-Taipei route in January and a brand-new Terminal 3 is coming to Taoyuan International Airport."
          - emphasis [ref=e196]:
            - text: —
            - link "Mae Hamilton" [ref=e197] [cursor=pointer]:
              - /url: https://www.travelandleisure.com/mae-hamilton-8758152
        - 'figure "From left: Artù, a truffle hunting dog in Umbria, Italy; white truffles. Photo: Federico Ciamei/Travel + Leisure" [ref=e198]':
          - img "A person with a trufflehunting dog in a forest holding two small truffles in their hand" [ref=e201]
          - generic [ref=e202]:
            - text: "From left: Artù, a truffle hunting dog in Umbria, Italy; white truffles."
            - generic [ref=e203]:
              - text: "Photo:"
              - paragraph [ref=e204]: Federico Ciamei/Travel + Leisure
        - heading "UMBRIA, ITALY" [level=3] [ref=e205]
        - paragraph [ref=e206]:
          - text: A landlocked region in central Italy that’s home to rolling hills, medieval towns, and long stretches of vineyards, Umbria is quietly asserting itself as a food destination, with truffles taking center stage. “Truffle tourism is leading the way,” says
          - link "Matteo Della Grazia" [ref=e207] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/matteo-della-grazia-daniela-mencarelli-11887433
          - text: ", the founder of Fuoritinerario–Discover Your Italy and a member of the T+L A-List. “Guided hunts, seasonal festivals, gourmet tastings at restaurants and wineries, and culinary workshops have made truffle tourism a highly attractive and immersive experience.” Among the best ways to get a taste are two world-class events, the White Truffle Fair, in Città di Castello, which celebrates the white variety, and the Nero Norcia, in Norcia, which highlights the black. As interest in the region grows, several noteworthy hotel openings are slated for the year ahead. Among them is the Relais San Clemente, Emblems Collection, which is set inside a thousand-year-old Benedictine convent; the newly renovated, 51-room hotel is now part of Accor. Then there’s the"
          - link "Six Senses Antognolla" [ref=e208] [cursor=pointer]:
            - /url: https://www.antognolla.com/
          - text: ", also set within a centuries-old building, with its 71 rooms, 17 villas, and a nearly 3,000-square-foot wellness center. (Its GEO-certified, 18-hole golf course is already open to the public.) The"
          - link "Rosetta Hotel Perugia, Tapestry Collection by Hilton" [ref=e209] [cursor=pointer]:
            - /url: https://www.hilton.com/en/hotels/pegonup-rosetta-hotel-perugia/
          - text: is just emerging from a renovation that, Della Grazia says, will return the “storied hotel” to its rightful place as one of the city’s best. In the meantime,
          - link "Borgo dei Conti Resort" [ref=e210] [cursor=pointer]:
            - /url: https://www.borgodeicontiresort.com/
          - text: ", which opened in 2024, has recently added an additional 19 rooms and suites—and has plans to debut a Bioenergetic Park in April 2026, with walking paths through the forest that visit various outdoor wellness stations. Consider it the perfect compliment to all those truffle hunts and culinary tours.—"
          - link "Asia London Palomba" [ref=e211] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/asia-london-palomba-8621549
            - emphasis [ref=e212]: Asia London Palomba
        - heading "DESTINATIONS FOR" [level=3] [ref=e214]
        - heading "BIG-CITY THRILLS" [level=2] [ref=e215]
        - 'figure "The 2025 Australian Grand Prix in Melbourne. Photo: Alessio Morgese/NurPhoto/Getty Images" [ref=e216]':
          - img "A Formula 1 car races on a track near a grandstand filled with spectators with a city skyline visible in the background" [ref=e219]
          - generic [ref=e220]:
            - text: The 2025 Australian Grand Prix in Melbourne.
            - generic [ref=e221]:
              - text: "Photo:"
              - paragraph [ref=e222]: Alessio Morgese/NurPhoto/Getty Images
        - heading "MELBOURNE" [level=3] [ref=e223]
        - paragraph [ref=e224]:
          - text: Melbourne has long proclaimed itself as the “sporting capital of the world”—and now the world is paying attention. Australia’s second-most-populous city will, as usual, play host to the Australian Open and Formula 1’s season-opening Australian Grand Prix in the year ahead, but added to the sports calendar is the first regular-season NFL game to be held Down Under, when the Los Angeles Rams take on an opponent to be named. “There’s a reason world-class events choose to come here,” says Kristen Malaby Neer of Visit Victoria. “All of our major stadiums, from the Melbourne Cricket Ground to the Marvel Stadium and the Rod Laver Arena, are within walking distance of vibrant laneways filled with restaurants, bars, and shops. It creates an unmatched atmosphere.” Even so, the city has embarked on an ambitious, multiyear transformation of the Arts Precinct, a district that’s already home to around 3,000 performances and exhibitions annually. Among the first notable openings in the district will be the December 2025 arrival of the Australian Museum of Performing Arts, which celebrates the history of theater with displays of rare objects and costumes. As for where to stay? The recently opened, waterfront 1 Hotel Melbourne is the first from the brand in Australia—and the perfect place to decompress after watching some thrilling performances.—
          - link "Jess Feldman" [ref=e225] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/jess-feldman-8581644
