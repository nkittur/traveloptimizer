        - heading "SINGAPORE" [level=3] [ref=e298]
        - paragraph [ref=e299]:
          - text: With tons of new places to play, Singapore is on the cusp of its latest re-invention. Mandai’s Rainforest Wild Asia opened an
          - link "adventure-driven zoological park" [ref=e300] [cursor=pointer]:
            - /url: https://www.mandai.com/en/rainforest-wild-asia.html
          - text: ", while the new"
          - link "IMBA Theater" [ref=e301] [cursor=pointer]:
            - /url: https://www.timeout.com/singapore/news/a-new-arts-venue-focusing-on-immersive-experiences-will-open-at-gardens-by-the-bay-this-2025-031925
          - text: promises immersive, multi-sensory art at Gardens by the Bay. On the resort island of Sentosa, the
          - link "Oceanarium returned this year at triple its former size" [ref=e302] [cursor=pointer]:
            - /url: https://www.travelweekly-asia.com/Travel-News/Attractions/What-s-the-big-deal-with-the-new-Singapore-Oceanarium-
          - text: ", reframing its mission as a guardian of the ocean. Over on Orchard Road, a"
          - link "3,000-seat music hall" [ref=e303] [cursor=pointer]:
            - /url: https://greatnewplaces.com/art-culture/music-hall-in-orchard-road/
          - text: "will add to the city’s cultural pulse. And the city will also make waves with some new cruise ships: Ritz-Carlton’s"
          - link "Luminara superyacht" [ref=e304] [cursor=pointer]:
            - /url: https://www.ritzcarltonyachtcollection.com/luxury-asia-cruises/singapore-to-hongkong-13251230
            - emphasis [ref=e305]: Luminara
            - text: superyacht
          - text: will spend a season using Singapore as a home port, offering trips throughout Southeast Asia, beginning in December 2025. Meanwhile
          - link "Disney’s first Asia-based" [ref=e306] [cursor=pointer]:
            - /url: https://disneycruise.disney.go.com/ships/adventure/
          - text: vessel,
          - emphasis [ref=e307]: Disney Adventure,
          - text: will come complete with a Marvel roller coaster when it arrives in 2026. Whatever the reason for your visit, it will soon be even easier to arrive in the city-state, thanks to passport-free, biometric scanners rolling out across
          - link "Changi Airport" [ref=e308] [cursor=pointer]:
            - /url: https://www.thesun.co.uk/travel/31380733/worlds-best-airport-new-tech-passport-security-biometrics/?utm_source=chatgpt.com
          - text: ", which has been named the"
          - link "No. 1 airport" [ref=e309] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/singapore-changi-airport-best-in-the-world-2025-11722610
          - text: in the world by T+L readers.—
          - link "Denny Lee" [ref=e310] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/denny-lee-7963123
            - emphasis [ref=e311]: Denny Lee
        - 'figure "The National Gallery of Art in Washington, D.C. Photo: Heather Durham/Travel + Leisure" [ref=e312]':
