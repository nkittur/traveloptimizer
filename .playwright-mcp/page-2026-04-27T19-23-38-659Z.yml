        - heading "CYPRUS" [level=3] [ref=e543]
        - paragraph [ref=e544]:
          - text: This Mediterranean island nation gets more than 300 days of sun every year, a fact that has made it a popular spot for northern European vacationers for generations. These days, it’s fast becoming a go-to for people from all over the world, thanks to its gorgeous beaches,
          - link "some of the cleanest water on earth" [ref=e545] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/cyprus-cleanest-swimming-waters-in-world-european-environment-agency-11767384
          - text: ", and a large network of well-maintained hiking trails, particularly in the Troodos Mountains. Travel company Backroads has taken notice and put together a six-day itinerary that will debut in 2026: The cycling-focused tour takes in a huge sweep of the island the outfitter calls “the next Mallorca,” owing to the similarities between Cyprus and the Spanish island’s dramatic rocky scenery and varied terrain. (The trip also includes stays at fascinating properties such as"
          - link "Casale Panayiotis" [ref=e546] [cursor=pointer]:
            - /url: https://www.casalepanayiotis.com/
          - text: ", which is an"
          - emphasis [ref=e547]: albergo diffuso
          - text: "that’s part of Small Luxury Hotels of the World.) Travelers in search of rugged adventures should take note: Cyprus has been hard at work creating artificial reefs to boost marine biodiversity, which will appeal to snorkelers and scuba divers. It’s also one of the few places in Europe where one can easily ski—on Mount Olympus, no less—and swim in the Mediterranean in the same day.—"
          - link "Kathy Roberson" [ref=e548] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/author/kathy-roberson
            - emphasis [ref=e549]: Kathy Roberson
        - 'figure "The African Renaissance Monument in Dakar, Senegal. Photo: Ricci Shryock/Travel + Leisure" [ref=e550]':
          - img "Statue of the African Renaissance Monument in Dakar with people walking up the stairs" [ref=e553]
          - generic [ref=e554]:
            - text: The African Renaissance Monument in Dakar, Senegal.
            - generic [ref=e555]:
              - text: "Photo:"
              - paragraph [ref=e556]: Ricci Shryock/Travel + Leisure
        - heading "DAKAR, SENEGAL" [level=3] [ref=e557]
        - paragraph [ref=e558]:
          - text: Since United Airlines’ new direct flight took off from Washington, D.C., in May 2025, Dakar, Senegal, has been more accessible than ever. Perched on the westernmost tip of Africa, Senegal’s capital is the first African city set to host the
          - link "Youth Olympic Games" [ref=e559] [cursor=pointer]:
            - /url: https://www.olympics.com/en/olympic-games/dakar-2026
          - text: in 2026 and is fast becoming a cultural capital, where contemporary art, music, and history converge. At the heart of its creative energy is Dak’Art, Africa’s longest-running international art biennial, which gets some 250,000 visitors. Travelers can also explore powerful historic sites like the island of Gorée, which was a center of the Atlantic slave trade, visit Lake Retba, the striking “Pink Lake,” or lounge on golden beaches. The city’s hospitality scene is rising to meet demand, with hotel openings including
          - link "Marriott’s Four Points by Sheraton" [ref=e560] [cursor=pointer]:
            - /url: https://www.marriott.com/en-us/hotels/dssfp-four-points-dakar-diamniadio/overview/
          - text: and
          - link "Accor’s Ibis Styles" [ref=e561] [cursor=pointer]:
            - /url: https://all.accor.com/hotel/6777/index.en.shtml
          - text: . IHG’s Holiday Inn is on the horizon for 2027. “Dakar is an up-and-coming destination,”
          - link "Nina Patel" [ref=e562] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/nina-patel-8772935
          - text: ", a T+L A-list travel advisor and founder of"
          - link "Vacations That Matter" [ref=e563] [cursor=pointer]:
            - /url: https://www.vacationsthatmatter.com/
          - text: ", says. “It’s the heart of the contemporary arts scene, with some of the best museums and galleries in Africa. It’s a must-see destination.”"
          - emphasis [ref=e564]:
            - text: —
            - link "Susmita Baral" [ref=e565] [cursor=pointer]:
              - /url: https://www.travelandleisure.com/susmita-baral-7105069
        - 'figure "The Dolomites. Photo: Ambika Verma/Travel + Leisure" [ref=e566]':
          - img "A scenic view of a mountainous landscape surrounded by mist and a grassy meadow" [ref=e569]
