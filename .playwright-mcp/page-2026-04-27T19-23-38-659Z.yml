        - heading "SANTA BARBARA, CALIFORNIA" [level=3] [ref=e246]
        - paragraph [ref=e247]:
          - text: There’s never a bad time to visit the American Riviera, thanks to its year-round Mediterranean climate. But several exciting hospitality developments are making a strong case for Santa Barbara in 2026.
          - link "Four Seasons Resort The Biltmore Santa Barbara" [ref=e248] [cursor=pointer]:
            - /url: https://www.fourseasons.com/santabarbara/
          - text: ", a favorite among Hollywood stars from Joan Crawford to Julia Roberts, will reopen after an extensive renovation with a new Nobu and a Thomas Keller–helmed Bouchon Bakery. Just a few minutes away,"
          - link "Montecito Inn" [ref=e249] [cursor=pointer]:
            - /url: https://www.montecitoinn.com/
          - text: "is also undergoing a makeover and will debut new rooms at the end of 2025. The city’s food scene is also exploding: Already home to 15 Michelin-recognized restaurants, the area is welcoming new spots, including the Korean barbecue counter"
          - link "Seoulmate Kitchen" [ref=e250] [cursor=pointer]:
            - /url: https://www.seoulmatekitchen.com/
          - text: and the posh
          - link "Marisella" [ref=e251] [cursor=pointer]:
            - /url: https://www.marisellarestaurant.com/
          - text: ", located within the Ritz-Carlton Bacara, Santa Barbara. “Santa Barbara gets its mystique from a convergence of elements rooted in nature and beauty,” says Karna Hughes, director of public relations at Visit Santa Barbara. “You can hike in the morning, swim or sail in the afternoon, and taste the terroir on your plate and in your glass at dinner.”"
          - emphasis [ref=e252]:
            - text: —
            - link "Mae Hamilton" [ref=e253] [cursor=pointer]:
              - /url: https://www.travelandleisure.com/mae-hamilton-8758152
