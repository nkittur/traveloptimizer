          - emphasis [ref=e382]: Seven Seas Prestige
          - text: ", would be something of an occasion simply on its own. But there’s more to this launch than meets the eye: As the first ship in a new “Prestige class” for Regent, the vessel will further elevate the onboard experience for its 822 passengers “with touches such as handblown glass and ceramic pearls and light fixtures fashioned to resemble jewelry among the intricate interior details,”"
