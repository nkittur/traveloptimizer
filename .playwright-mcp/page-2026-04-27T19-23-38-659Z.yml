        - heading "BRISBANE, AUSTRALIA" [level=3] [ref=e437]
        - paragraph [ref=e438]:
          - text: In the lead-up to the 2032 Summer Olympics,
          - link "Brisbane" [ref=e439] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/brisbane-australia-guide-11834635
          - text: is primed for its turn in the spotlight. “The same kind of bold energy Sydney harnessed in the run-up to its own Olympic moment is happening here,” says Brisbane-born
          - link "David Prior" [ref=e440] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/david-prior-11887444
          - text: ", who sits on T+L’s"
          - emphasis [ref=e441]
          - text: "Travel Advisory Board. “It is a city of increasing urban sophistication, surrounded by subtropical nature and a shimmering sea, that in its simplicity can’t help making you smile.” Little wonder, then, that creative types are increasingly putting down roots in the city, which is simultaneously getting a $2.2 billion infrastructure investment from the federal government ahead of the Games. Brisbane is also getting easier to reach from the U.S.: Delta, Qantas, and United have launched nonstop service from California in recent years, and American Airlines will launch a seasonal nonstop from Los Angeles in December 2025. Meanwhile, a now-revamped entertainment precinct, the Queen's Wharf Brisbane, will welcome two new hotels: Australia’s first Rosewood and the Dorsett Brisbane will both open in 2026, joining the Star Grand and the InterContinental, which led the way in the district.—"
          - link "Jess Feldman" [ref=e442] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/jess-feldman-8581644
            - emphasis [ref=e443]: Jess Feldman
        - link "Explore Brisbane Travel Guide Read More" [ref=e446] [cursor=pointer]:
