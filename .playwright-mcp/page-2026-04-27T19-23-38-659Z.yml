        - heading "WASHINGTON, D.C." [level=3] [ref=e319]
        - paragraph [ref=e320]:
          - text: The year ahead promises to be monumental for the nation’s capital—and not just because of all the festivities on tap for America250. Several world-class institutions will debut major overhauls and improvements, starting with the National Air and Space Museum, which will complete a renovation that began in 2018 by unveiling 20 new galleries. In the summer, the National Geographic Museum of Exploration will make its debut with cutting-edge technology and interactive exhibits. And the National Archives Museum will wrap its $40 million renovation, with new displays of documents considered essential to American history, including George Washington’s original copy of the Constitution. Other upgrades across the District include enhancements at the Tidal Basin, which has hundreds of new cherry trees to complement its existing landscape, and a new, ADA-accessible art park at the Hirshhorn Museum and Sculpture Garden. New hotels on the horizon include Marriott’s new CitizenM Georgetown, a 228-room hotel along the Potomac River waterfront, while the
          - link "Hyatt Regency Washington on Capitol Hill" [ref=e321] [cursor=pointer]:
            - /url: https://www.hyatt.com/hyatt-regency/en-US/wasrw-hyatt-regency-washington-on-capitol-hill/renovations
          - text: "will celebrate 50 years by wrapping a top-to-bottom, full-scale renovation in 2026. Even Dulles International Airport is getting spruced up for the year ahead: A new"
          - link "Concourse E" [ref=e322] [cursor=pointer]:
            - /url: https://www.flydulles.com/Next
          - text: ", with 14 gates and a new United Club, is slated to open in the second half of 2026. All told, says Elliott L. Ferguson, the president and CEO of Destination D.C., “our city is the only place visitors will find the complete package for America250.”—"
          - link "Jessica Vadillo" [ref=e323] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/jessica-vadillo-7559857
            - emphasis [ref=e324]: Jessica Vadillo
        - heading "DESTINATIONS FOR" [level=3] [ref=e326]
        - heading "MOMENTS ON THE WATER" [level=2] [ref=e327]
        - 'figure "A rendering of the Emilie. Photo: Uniworld Boutique River Cruises" [ref=e328]':
          - img "A grand lobby with a large decorative Klimtstyle artwork and symmetrical staircases" [ref=e331]
          - generic [ref=e332]:
