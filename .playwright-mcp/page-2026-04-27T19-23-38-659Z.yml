        - heading "COLONIAL WILLIAMSBURG" [level=3] [ref=e461]
        - paragraph [ref=e462]:
          - text: The world’s largest living museum, Colonial Williamsburg consists of 89 original and hundreds more reconstructed buildings from the 18th century—and it may be the best place anywhere to celebrate America250. On the Fourth of July, the Historic Area and Art Museums will offer free admission, along with interactive experiences like readings of the Declaration of Independence, plus a concert and fireworks finale on the Palace Green. In the run-up to the day, the maritime festival
          - link "Sail250 America" [ref=e463] [cursor=pointer]:
            - /url: https://va250.org/sail250/
          - text: will stop in Yorktown, a short drive from Williamsburg. The event will showcase a fleet of tall ships and military vessels from around the globe, says Edward Harris, CEO of Visit Williamsburg. “It’s a rare chance to see these historic ships up close and personal.” The celebratory mood is sure to boost the whole region, which is home to other worthwhile attractions, such as the American Revolution Museum at Yorktown, the Jamestown Settlement museum, and Busch Gardens Williamsburg. There’s no shortage of charming hotel options, but catching the eye of T+L editors for 2026 is the newly renovated
          - link "Rochambeau Roadside Inn" [ref=e464] [cursor=pointer]:
            - /url: https://www.stayrochambeau.com/
          - text: ", a boutique hotel with 22 vintage-inspired rooms and suites, including some with cute bunk beds.—"
          - link "Jessica Vadillo" [ref=e465] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/jessica-vadillo-7559857
            - emphasis [ref=e466]: Jessica Vadillo
        - 'figure "Dallas. Photo: Nidia Coy/Travel + Leisure" [ref=e467]':
          - img "Downtown Dallas skyline featuring modern skyscrapers and a park in the foreground" [ref=e470]
          - generic [ref=e471]:
            - text: Dallas.
            - generic [ref=e472]:
              - text: "Photo:"
              - paragraph [ref=e473]: Nidia Coy/Travel + Leisure
        - heading "DALLAS-FORT WORTH" [level=3] [ref=e474]
        - paragraph [ref=e475]:
          - text: "Texas is having a moment—and Dallas-Fort Worth is leading the way. The metroplex is gearing up for the 2026 FIFA World Cup, with AT&T Stadium in Arlington hosting nine games, including a semifinal. Also adding excitement to the region’s growing sports calendar: the first-ever Indycar Grand Prix of Arlington in the DFW suburb. Beyond sports, culture and history are thriving. The much-anticipated"
          - link "National Juneteenth Museum" [ref=e476] [cursor=pointer]:
            - /url: https://nationaljuneteenthmuseum.org/
          - text: will open in 2026, celebrating freedom and resilience through powerful storytelling, while the
          - link "National Cowgirl Museum & Hall of Fame" [ref=e477] [cursor=pointer]:
            - /url: https://www.cowgirl.net/
          - text: is undergoing a $19 million expansion. Pop-culture fans will want to check out the first
          - link "Netflix House" [ref=e478] [cursor=pointer]:
            - /url: https://www.netflix.com/house/locations/dallas
          - text: ", which opens in Dallas in December 2025; it will bring popular TV shows to life through immersive experiences. Foodies have reason to celebrate as well: Texas’ first Michelin Guide has arrived, with Tatsu Dallas and Mamani both earning one star. There are new hotels—like"
          - link "The Knox, Auberge Collection" [ref=e479] [cursor=pointer]:
            - /url: https://auberge.com/the-knox/
          - text: (coming in 2026), and
          - link "Fort Worth’s Nobleman" [ref=e480] [cursor=pointer]:
            - /url: https://thenoblemanhotel.com/
          - text: ", which opened inside a historic firehouse—and expanded domestic and international flights that connect Dallas Fort Worth International Airport to destinations such as Venice, Sydney, Taipei, New York City, and Washington, D.C."
          - emphasis [ref=e481]:
            - text: —
            - link "Taylor McIntyre" [ref=e482] [cursor=pointer]:
              - /url: https://www.travelandleisure.com/taylor-mcintyre-7665962
