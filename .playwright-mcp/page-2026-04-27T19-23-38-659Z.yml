        - heading "BRAZIL" [level=3] [ref=e415]
        - paragraph [ref=e416]:
          - text: “Brazil is making a comeback,” says
          - link "Emmanuel Burgio" [ref=e417] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/emmanuel-burgio-11815704
          - text: ", a South America travel expert on T+L’s A-List. That’s exactly why it’s"
          - link "T+L’s 2026 Destination of the Year" [ref=e418] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/brazil-destination-of-the-year-2026-11824614
          - text: . “We’ve seen a surge of requests,” Burgio says. T+L’s Destination of the Year coverage points travelers toward
          - link "Inhotim" [ref=e419] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/inhotim-museum-brazil-11819535
          - text: ", the museum and sculpture park in the Brazilian state of Minas Gerais, which now has a new hotel,"
          - link "Clara Arte Resort" [ref=e420] [cursor=pointer]:
            - /url: https://clararesorts.com.br/clara-arte
          - text: ". Also calling: the food scene in Belém, which ramped up 10 years ago when"
          - link "Iacitata" [ref=e421] [cursor=pointer]:
            - /url: https://www.instagram.com/iacitata_/?hl=en
          - text: ", a restaurant exalting Amazonian ingredients, opened and noteworthy chefs started moving to the area, including Thiago Castanho, who took the helm at his family’s restaurant,"
          - link "Remanso do Peixe" [ref=e422] [cursor=pointer]:
            - /url: https://www.instagram.com/remansodopeixe/?hl=en
          - text: . In the state of Bahia, new hotel Uxua Maré draws travelers to the coastline south of Trancoso, a boho-chic beach town.
          - link "Paraty" [ref=e423] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/paraty-brazil-11819557
          - text: has an array of cultural offerings, including Flip, an annual literary festival that has drawn authors like Jonathan Franzen. “
          - link "Fernando de Noronha" [ref=e424] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/fernando-de-noronha-brazil-island-11824571
          - text: has some of the best marine wildlife in the world,” Burgio adds, endorsing the 21-island UNESCO World Heritage site, which has a monthly limit of 11,000 visitors. “And, you know, this is the No. 1 country to visit for
          - link "Carnival" [ref=e425] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/carnival-brazil-11819569
          - text: .” (The capital of Carnival, a barrage of parades, parties, and music before Lent, is
          - link "Rio de Janeiro" [ref=e426] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/rio-de-janeiro-brazil-guide-11824564
          - text: ".) Lastly, the São Paulo hotel scene continues to boom: W São Paulo opened in the posh Vila Olímpia neighborhood; the new Pulso Hotel São Paulo features a suspended, glassed-in cube with a gym and a pool; and members-only"
          - link "Soho House São Paulo" [ref=e427] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/soho-house-sao-paulo-hotel-review-11823021
          - text: is the rising star of the Bela Vista neighborhood, housed within the same complex as the Rosewood, which debuted in 2022. High rollers flying into São Paulo will be glad to know a 26,000-square-foot private terminal, BTG Pactual Terminal, has landed at Guarulhos International Airport, the first of its kind in Latin America.
          - emphasis [ref=e428]:
            - text: —
