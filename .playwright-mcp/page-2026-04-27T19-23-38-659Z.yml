        - heading "MIAMI AND MIAMI BEACH" [level=3] [ref=e702]
        - paragraph [ref=e703]:
          - text: In Miami, already a hot spot for its beach resorts, the hospitality scene is heating up some more. A Virgin Hotel in Brickell and
          - link "Edition Residences" [ref=e704] [cursor=pointer]:
            - /url: https://editionedgewaterresidence.com/
          - text: in Edgewater are set to welcome guests in 2026, while the
          - link "Aman Miami Beach" [ref=e705] [cursor=pointer]:
            - /url: https://www.aman.com/hotels/aman-miami-beach
          - text: will follow in 2027. These new openings are complemented by renovation projects in Miami Beach at the
          - link "Delano" [ref=e706] [cursor=pointer]:
            - /url: https://delanohotels.com/miami-beach/
          - text: ","
          - link "SLS South Beach" [ref=e707] [cursor=pointer]:
            - /url: https://slshotels.com/south-beach/
          - text: ", and The Raleigh, and on the barrier island of Key Biscayne, where"
          - link "The Ritz-Carlton Key Biscayne, Miami" [ref=e708] [cursor=pointer]:
            - /url: https://www.ritzcarlton.com/en/hotels/miakb-the-ritz-carlton-key-biscayne-miami/overview/
          - text: is set to reopen in December 2025. “Miami is international with its boom of new hotels and restaurants transplanting from all over the world,” Nikole Powers, a leading consultant for the city’s luxury hospitality scene and private membership clubs, tells T+L
          - emphasis [ref=e709]: .
          - text: Visitors can also expect a revamp of the iconic Lincoln Road, an eight-block pedestrian plaza in South Beach with trendy shops and restaurants, thanks to a $60 million redevelopment scheduled to roll out in phases starting in 2026.
        - paragraph [ref=e710]: Come springtime, sports fans should consider a trip to catch one of the city’s annual athletic events, including the Miami Open and the Formula 1 Miami Grand Prix. The city is even set to host seven matches for the 2026 FIFA World Cup. “Today’s travelers are seeking immersion, whether through niche travel for a once-in-a-lifetime concert or a major game, cultural culinary discovery, or the blend of business and leisure,” David Whitaker, president and CEO of the Greater Miami Convention and Visitors Bureau, tells T+L. “Miami stands at the crossroads of these trends.”
        - paragraph [ref=e711]:
          - text: New and increased flights will also make it easier for beach lovers to take advantage of this moment Miami is having, including a new direct route from Austin on Delta and twice-daily service from London on British Airways in summer 2026.
          - emphasis [ref=e712]:
            - text: —
            - link "Annie Archer" [ref=e713] [cursor=pointer]:
              - /url: https://www.travelandleisure.com/annie-archer-6755254
        - 'figure "The Gulf Coast of Naples, Florida. Photo: Kristjan Veski/Travel + Leisure" [ref=e714]':
          - img "A luxury beachfront property with palm trees a pool and an adjacent sandy beach" [ref=e717]
          - generic [ref=e718]:
            - text: The Gulf Coast of Naples, Florida.
            - generic [ref=e719]:
              - text: "Photo:"
