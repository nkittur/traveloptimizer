        - heading "MEXICO CITY" [level=3] [ref=e234]
        - paragraph [ref=e235]:
          - text: Mexico City’s 2025 calendar was packed with big-ticket sporting events, but 2026 promises an even hotter lineup. The Formula 1 Mexico City Grand Prix returns Oct. 29–Nov. 1, and will be all the more exciting now that Guadalajara-born Sergio “Checo” Pérez will be racing for the new Cadillac Formula 1 team. LIV Golf will return to Mexico City’s Club de Golf Chapultepec for the second year in April. But perhaps most exciting, Mexico City will serve as one of several host cities for the 2026 FIFA World Cup in June and July. Even if you’re not a sports fanatic, it’s a great time to visit Mexico’s buzzy capital,
          - link "a T+L reader favorite" [ref=e236] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/worlds-best-awards-2025-cities-world-11742764
          - text: . In the past year, airlines have expanded service to Mexico City, adding routes from Denver, Chicago, and Philadelphia. In 2026, Pendry Mexico City is set to open a 114-room, 20-residence property in the Roma Norte district, and Park Hyatt Mexico City will debut 155 rooms and 23 residences in Polanco. And the luxury hotel expansion will continue in 2027 with the Rosewood Mexico City.
          - emphasis [ref=e237]:
            - text: —
            - link "Elizabeth Rhodes" [ref=e238] [cursor=pointer]:
              - /url: https://www.travelandleisure.com/author/elizabeth-rhodes
        - 'figure "The Ritz-Carlton Bacara, Santa Barbara. Photo: Marriott" [ref=e239]':
          - img "Oceanfront pool area with lounge chairs and striped umbrellas overlooking the beach and surrounded by trees" [ref=e242]
