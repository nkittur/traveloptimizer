        - heading "ANGUILLA" [level=3] [ref=e653]
        - paragraph [ref=e654]:
          - text: The top Caribbean island in T+L’s
          - link "2025 World’s Best Awards" [ref=e655] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/worlds-best-awards-2025-islands-world-11749514
          - text: "may not be big—in fact, it’s just 35 square miles in size—but it sure delivers the goods: dozens of world-class beaches; plenty of top-tier hotels and cultural institutions; and a phenomenal culinary scene that runs from casual seafood joints to gourmet tasting menus. “My favorite things to do are snorkeling at Shoal Bay, sampling delicious roadside barbecue, and taking catamaran tours to the Cays, the smaller islets off shore,” says"
          - link "Margie Hand" [ref=e656] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/margie-hand-8762265
          - text: ", a T+L A-List advisor who specializes in trips to Anguilla. “Renting a vintage Moke and driving around the island to explore is another fun idea.” Luxury hotels such as Cap Juluca, a Belmond Hotel, and the Four Seasons Resort and Residences remain as enchanting as ever, and, in 2026, getting to them will be easier: BermudAir will launch nonstop service from Baltimore, Boston, and Newark, New Jersey, to Anguilla in December 2025.—"
          - link "Asa Canty" [ref=e657] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/asa-canty-11850048
            - emphasis [ref=e658]: Asa Canty
        - 'figure "The Bvlgari Resort Bodrum. Photo: Bvlgari Hotels & Resorts" [ref=e659]':
          - img "Interior of a stylish living room with large windows overlooking an outdoor patio and a distant view of the sea" [ref=e662]
          - generic [ref=e663]:
            - text: The Bvlgari Resort Bodrum.
            - generic [ref=e664]:
              - text: "Photo:"
              - paragraph [ref=e665]: Bvlgari Hotels & Resorts
        - heading "BODRUM, TURKEY" [level=3] [ref=e666]
        - paragraph [ref=e667]:
          - text: Once a small fishing village, Bodrum has since transformed into what many call the “St.-Tropez of Turkey.” According to
          - link "Skyscanner’s latest trends report" [ref=e668] [cursor=pointer]:
            - /url: https://www.skyscanner.com/travel-trends
          - text: ", interest in the seaside town grew by 85 percent, year over year. “Today, Bodrum combines its rich history with glamorous beaches, luxury hotels, lively nightclubs, and a vibrant cosmopolitan life that attracts the rich and famous from around the globe,” says"
          - link "Engin Kadaster" [ref=e669] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/engin-kadaster-11886507
          - text: ", vice president at Turkey at Its Best and a T+L A-List advisor. While Bodrum enjoys a Mediterranean climate year-round, most of the region’s most iconic hotels operate seasonally, typically from April through October, when the coast is at its liveliest. In 2024, Bodrum welcomed the"
          - link "Maxx Royal Bodrum Resort" [ref=e670] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/maxx-royal-bodrum-resort-hotel-review-11760072
          - text: ", along with the"
          - link "first Scorpios location outside of Greece" [ref=e671] [cursor=pointer]:
            - /url: https://scorpios.com/bodrum-accommodation
          - text: ". And the momentum continues: Bvlgari is set to open a luxury resort in early 2027. Getting there is also becoming easier. Ryanair added a new route from London Stansted as part of its summer 2025 schedule, and in summer 2026, SunExpress will launch a direct service from Manchester Airport to Bodrum."
          - emphasis [ref=e672]:
            - text: —
            - link "Susmita Baral" [ref=e673] [cursor=pointer]:
              - /url: https://www.travelandleisure.com/susmita-baral-7105069
        - 'figure "Rasa, a restaurant at the Hotel Indigo Grand Cayman. Photo: IHG" [ref=e674]':
          - img "Restaurant interior with dining tables chairs and modern framed artwork on the walls" [ref=e677]
          - generic [ref=e678]:
            - text: Rasa, a restaurant at the Hotel Indigo Grand Cayman.
            - generic [ref=e679]:
              - text: "Photo:"
