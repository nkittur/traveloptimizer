          - text: ", one of Salt Lake City’s coolest micro-neighborhoods, which is packed with indie shops and women-owned businesses—and decorated with photogenic murals. Some of the best new dining in the city can be found nearby, in the buzzy 9th & 9th, including"
          - link "Cosmica" [ref=e914] [cursor=pointer]:
            - /url: https://www.nytimes.com/interactive/2025/dining/best-restaurants-america.html#cosmica
          - text: ", an Italian diner that’s been lauded as one of the best in America. Then there’s the Granary District, which is “redefining itself as a playground for young adults,”"
