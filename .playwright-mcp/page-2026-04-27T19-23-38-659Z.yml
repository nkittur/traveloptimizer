        - heading "EMILIE" [level=3] [ref=e335]
        - paragraph [ref=e336]:
          - text: "It’s not just you: All your friends and neighbors really are going on river cruises. Since 2020, the number of staterooms and suites on European rivers has surged, as brands including AmaWaterways, Emerald, Tauck, and Viking have kept building more ships to serve the millions of travelers keen to explore the Danube, Rhine, and Seine. But one of the most exciting new builds coming in the year ahead is from"
          - link "T+L reader-loved" [ref=e337] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/worlds-best-awards-2025-river-cruise-lines-11742302
          - text: Uniworld Boutique River Cruises. “We see river cruising continue to rise in popularity,” says CEO Ellen Bettridge. “And
          - emphasis [ref=e338]: Emilie
          - text: marks the beginning of several new builds and an exciting era of growth.” The new vessel, which is slated to arrive in March, will have 77 staterooms and suites, with a design inspired by Gustav Klimt and his partner, Emilie Louise Flöge. (That’s her in the replica portrait that decorates the staircase at the heart of the ship.)
          - link "Emilie" [ref=e339] [cursor=pointer]:
            - /url: https://www.uniworld.com/us/ships/ss-emilie
            - emphasis [ref=e340]: Emilie
          - text: will spend the summer and fall in Klimt’s backyard, with itineraries up and down the Danube stopping in Vienna and Budapest, among other fascinating, art-filled cities. But before that, the ship will debut in Belgium and the Netherlands, with trips between Amsterdam and Antwerp that allow for plenty of time to take in iconic art at places like the Rijksmuseum—and simply admire the beautiful scenery from the water.
          - emphasis [ref=e341]:
            - text: —
            - link "Paul Brady" [ref=e342] [cursor=pointer]:
              - /url: https://www.travelandleisure.com/author/paul-brady
