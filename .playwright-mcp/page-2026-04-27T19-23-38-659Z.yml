        - heading "MAGDALENA RIVER, COLOMBIA" [level=3] [ref=e365]
        - paragraph [ref=e366]:
          - text: After seven years of preparation—and significant investment from the Colombian government—AmaWaterways has become the first major river cruise line to set sail on this 950-mile river that’s the country’s longest. The company’s two new ships, the 30-stateroom
          - emphasis [ref=e367]: AmaMagdalena
          - text: and 32-stateroom
          - emphasis [ref=e368]: AmaMelodia
          - text: ", are doing weeklong journeys between Cartagena and Barranquilla, taking passengers to places that few Americans will have sailed: centuries-old towns like Mompox and Palenque, the wildlife-rich Boca de Tacaloa, and small fishing villages where it’s possible to get a closer look at countryside life. “A number of these stops had hardly received tourists before guests on the"
          - emphasis [ref=e369]: AmaMagdalena
          - text: stepped ashore,” says Catherine Powell, the CEO of AmaWaterways, who notes that the itineraries were developed with input from communities, including Indigenous ones, along the river. “These trips offer a unique way to experience Colombia, one that fosters meaningful connections while supporting and celebrating these places.”—
          - link "Alisha Prakash" [ref=e370] [cursor=pointer]:
            - /url: https://www.travelandleisure.com/author/alisha-prakash
            - emphasis [ref=e371]: Alisha Prakash
