        - heading "FOUR SEASONS I" [level=3] [ref=e350]
        - paragraph [ref=e351]:
          - text: It might be the most-anticipated Four Seasons news this side of
          - emphasis [ref=e352]: The White Lotus
          - text: ": The legendary hotel brand, whose properties have played a background role in all three seasons of the TV series, is making another cinematic splash this spring with the premiere of Four Seasons Yachts. The first ship in the fleet,"
          - link "Four Seasons I" [ref=e353] [cursor=pointer]:
            - /url: https://www.fourseasonsyachts.com/vessels/four-seasons-1
            - emphasis [ref=e354]: Four Seasons I
          - text: ", is slated to debut in March, with the aim of bringing luxury hotel vibes to the ocean by way of 95 suites that start at an impressive 473 square feet. The new vessel will also have an eye-popping 11 restaurants and lounges, as well as a 66-foot pool deck and a marina complex where guests can dive directly into the sea while the ship is at anchor."
          - emphasis [ref=e355]: Four Seasons I
          - text: will spend the spring, summer, and fall crisscrossing the Mediterranean, popping into small yet evocative ports that many larger cruise ships can’t access—places like Folegandros, Greece; Gozo, Malta; Ischia, Italy; and Vis, Croatia. Along the way, the crew, which is led by Captain Kate McCue, will arrange Four Seasons-caliber experiences ashore, like a round of golf at one of Ibiza’s top courses. These trips won’t come cheap—some start at $3,000 per person per day—but several departures are already “waitlist only,” according to the company.
          - emphasis [ref=e356]:
            - text: —
            - link "Paul Brady" [ref=e357] [cursor=pointer]:
              - /url: https://www.travelandleisure.com/author/paul-brady
