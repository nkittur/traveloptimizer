                  - paragraph [ref=e890]: In an antique bar space with over 100 years of history, on a coveted corner in one of the trendiest parts of the Eixample, Soma opened in 2021 to instant accolades from the gourmands of Barcelona. Cozy decor and a Parisian-style terrace set the stage for a menu of Catalan tapas with a strong Italian character and hints of France. Look for veal liver with onion and red pepper jam, socarrat de risotto (a risotto cooked until compact and crispy like the bottom of a classic paella) with kale and honey, octopus with bacon and paprika potato purée, and ragu-stuffed rigatoni.
                  - paragraph [ref=e891]:
                    - strong [ref=e892]: "Best for:"
                    - text: Soma is known as a vibey spot for lunch or dinner, but weekday breakfasts on their tiny outdoor terrace with coffee, pastries, and sandwiches make a perfect, slow morning.
