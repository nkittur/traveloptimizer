                - paragraph [ref=e1492]: This beachside restaurant has had five different names since it opened in 1942, but has always stayed within the same family. In 2023, it was born once again as Casa Costa, a modern concept with playful branding, refined food, and natural wines that still gives timeless Mediterranean flavors and aesthetics — few places capture the true essence of Barcelona as well as Casa Costa. Start your meal with a spicy bomba croquette of potato and slow-cooked beef, clams in green sauce, or tomato salad with rosemary gelee, to be followed by star dishes like the whole roasted seabass for two with Mediterranean vinaigrette, and the pig trotter roulade with red prawns. There are always seasonal specials too, from tuna tartare with pickled summer cherries and confit spring artichokes with pancetta, to fire-charred calçots — the iconic Catalan winter onions.
                - paragraph [ref=e1493]:
                  - strong [ref=e1494]: "Know before you go:"
                  - text: The outdoor terrace is always bustling, but the best sea views are to be had from the second-floor dining room with panoramic windows and cozy banquets.
