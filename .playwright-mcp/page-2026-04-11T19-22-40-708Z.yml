                  - strong [ref=e1639]: "Price range:"
                  - text: $$$
                - paragraph [ref=e1640]: There are plenty of places to try paella in Barcelona, but Martínez is the move. Perched on the side of Montjuïc with a panoramic view of the city and port, the restaurant is far removed from the hubbub of the beach district. To justify your journey to the table, dig into the famous rice dishes like the señorito paella — garnished with peeled and shelled seafood, which keeps fingers clean — and the decadent lobster rice, as well as classic tapas and the inviting oyster bar.
                - paragraph [ref=e1641]:
                  - strong [ref=e1642]: "Best for:"
                  - text: The view from Martinez is stunning in the golden hour before sunset; try to schedule some time to take in the full splendor of the port and cityscape and then enjoy your dinner.
