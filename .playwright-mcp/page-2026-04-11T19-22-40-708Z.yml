                - paragraph [ref=e466]: Don’t be misled by the old-school appearance and simple menu at Ultramarinos Marín. Seats at chef Borja García’s open kitchen are among the most sought-after in the city, and for good reason. This humble-looking asador (grill-centric restaurant), only open for breakfast and lunch, is a temple of product-driven Catalan cooking, dedicated to holding classic recipes to the highest standard. Through his training at the iconic Etxebarri and Noma, García works magic with minimal ingredients, a hot plancha, and a smoldering wood-fire oven. The myriad preparations include grilled langoustines, braised pork shanks, mackerel in escabeche, stewed snails, massive steaks, smoked beef tongue, funky garum, and briny sea urchin toast. Don’t miss the fish charcuterie or the simple yet extraordinary grilled smashed potatoes with garlic alioli.
