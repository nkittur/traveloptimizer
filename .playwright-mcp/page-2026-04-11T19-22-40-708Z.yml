                - paragraph [ref=e538]: Berbena is a leading reference in the blossoming world of chef-driven, modern Catalan cuisine in Barcelona. Take a seat at one of the handful of tables, and begin your meal with hearty chunks of sourdough smeared with rich, smoked butter. Then dive into the assortment of seasonal small plates featuring whatever is fresh that day, from monkfish cheeks with cod tripe pil-pil and beef tongue with bustard, to guinea fowl with parsnips in a Catalan vi ranci sauce and artichokes with truffle; vibrant vegetables often play a starring role in the nightly specials. The cheese selection is impressive, as is their list of the over 600 wines, with more than 30 of them served by the glass. Linger over dessert as you enjoy excellent coffee from nearby SlowMov specialty roasters and espresso from the gleaming La Marzocco machine.
                - paragraph [ref=e539]:
