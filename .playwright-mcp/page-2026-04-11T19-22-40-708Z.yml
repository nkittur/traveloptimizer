                  - paragraph [ref=e1034]: An homage to the beloved tortilla (Spanish omelet), Los Tortillez gives off nostalgic 1980s airs — with red banquettes, popcorn stucco walls, retro crockery, and a tile-clad bar straight out of one of Pedro Almodóvar’s cult classics — but it’s actually a relatively recent addition to the beautified, newly pedestrianized Consell de Cent. First opened in late 2022, the restaurant has quickly become a point of reference in the city for some of the best al momento Spanish omelets. The menu includes 16 different, personal-sized tortilla variations; classic ingredients like chorizo and manchego rub shoulders with truffles, pesto, Thai curry, cilantro, bacon, and jalapenos.
                  - paragraph [ref=e1035]:
                    - strong [ref=e1036]: "Must-try dishes:"
                    - text: Come for the tortillas but stay for tapas-sized portions of Catalan specialties, like the habitas (baby broad beans) with mint, pork ribs braised in vermouth, veal and cuttlefish meatballs, and the bunyols de bacallà (cod fritters with honey and lime).
