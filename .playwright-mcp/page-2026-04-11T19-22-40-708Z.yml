                - paragraph [ref=e1350]: One of the oldest restaurants in the beachside neighborhood of La Barceloneta, this is the birthplace of the famous “bomba de la Barceloneta,” a mouthwatering fried potato croquette stuffed with savory ground beef and topped with aioli and hot sauce, which now appears on menus all over the city. In addition to the bombas, try the calamars a la planxa (grilled squid), and in summer get the grilled sardines. If you have a taste for offal, add a plate of cap i pota, an old-school Catalan stew of tripe, veal trotters, and veal head in tomato.
                - paragraph [ref=e1351]:
                  - strong [ref=e1352]: "Know before you go:"
                  - text: You’ll likely see a line of people waiting outside, but don’t get behind the last person. Go straight to the door instead of queuing up and ask to be put on the waiting list. They will call out names in order, no need to wait in an orderly line, just linger nearby.
