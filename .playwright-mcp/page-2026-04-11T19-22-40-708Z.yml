                - paragraph [ref=e1208]: With a wave of modern kebab shops hitting Barcelona over the last year, sometimes it feels good to go back to an all-time favorite. Carrer de Joaquin Costa is always buzzing with activity, as is its most famous kebab shop, Bismillah Kebabish, a halal mainstay in the Pakistani community of Barcelona since 2003. Crowds pack into the minimalist dining room, often sharing tables with strangers, just for a taste of the famous and affordable chicken shawarma — fresh naan that is pulled by hook from a tandoor oven and loaded with fragrant, bright-red shavings of spiced chicken thigh, carved from the spinning skewer that the team prepares daily (it’s much better than the beef version). Mixed with roasted peppers and onions and topped with your choice of fresh vegetables, chile sauce, and garlic sauce, this is the go-to meal from many regular customers. However, dishes such as the lamb curry, beef shish kebab, and the tandoori chicken skewers are also quite popular; you can even mix and match multiple dishes together on the combo plates with rice and salad.
