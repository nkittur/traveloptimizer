                - paragraph [ref=e762]: The Palace hotel, which first opened as the original Ritz Barcelona in 1919, still dazzles with opulent, old-world decor, making it a perfect stage for chef Rafa Zafra’s homage to classic fine dining. Zafra, former head chef at El Bulli, has come to be known for his elegant and simple approach to seafood at his lauded restaurant Estimar, but at Amar the preparations and presentations are decidedly more ornate; there is even a section of dishes inspired by the original Ritz hotel restaurant. The menu also has a section of dishes that pay homage to chef Albert Adrià, as well as top-quality seafood, seven dishes highlighting caviar, a handful of modern Catalan mains, whole grilled fish and steaks, vegetable sides, and Mediterranean tapas.
                - paragraph [ref=e763]:
                  - strong [ref=e764]: "Must-try menu:"
                  - text: There is currently a special menu celebrating the 175th birthday of César Ritz himself, in addition to the standard 12-course tasting menu.
