                  - paragraph [ref=e1319]: Plump pork meatballs braised in tomato sauce, creamy stracciatella cheese, grilled zucchini, and a dusting of grated ricotta salata come together in one of the newest sandwiches on the menu at Compà, a panini shop dedicated to the flavors of Calabria. In addition to the original location a few streets over from the Barceloneta beach, owner Vittorio Cicero has recently expanded with a new shop in the uptown neighborhood of Gràcia, with panini like mortadella with burrata and pistachio pesto or Calabrese lardo with spicy ‘nduja spread, smoked provolone, and roasted potatoes. Choose from nearly a dozen sandwiches including rotating specials, all served on 48-hour slow-fermented focaccia, pressed and piping hot.
                  - paragraph [ref=e1320]:
                    - strong [ref=e1321]: "Know before you go:"
                    - text: There are a few tables, but the sandwiches are meant as street food, so get yours to-go and head to the beach or the nearest plaza. Just don’t forget the napkins, and a tiramisu for dessert.
