              - paragraph [ref=e245]:
                - text: From Barcelona’s towering churches and bustling avenues to the sun-drenched beaches and idyllic plazas, it’s obvious why this city captures visitors’ hearts. You can also eat incredibly well here, and often for not very much money — though Barcelona
                - link "loves a tasting menu" [ref=e246] [cursor=pointer]:
                  - /url: /e/22387702
                - text: and the World’s 50 Best Restaurant list
                - link "awarded Disfrutar" [ref=e247] [cursor=pointer]:
                  - /url: /22710694/worlds-50-best-restaurants-number-ones
                - text: "the No. 1 spot last year. Despite Barcelona’s famed cuisine, it’s also easy to have a downright disappointing meal if you settle for any old paella-slinging bar along Les Rambles (known in Spanish as La Rambla) or La Barceloneta. (Tip: If a restaurant has to pay someone to stand outside and hassle pedestrians, the food isn’t worth it.)"
              - paragraph [ref=e249]:
                - text: Start with some classic tapas and paella (both great but neither entirely Catalan) and be sure to seek out local gems like bittersweet vermouth, seasonal seafood, and homestyle
                - link "Catalan cuisine" [ref=e250] [cursor=pointer]:
                  - /url: /24431730/girona-spain-where-to-eat-guide
                - text: . But after writing and revising this list for nearly a decade, I have to insist you don’t overlook the city’s burgeoning global cuisines; save room for Calabrese paninis, Northeast Asian sharing plates with natural wines, towering fried chicken sandwiches, South Indian fish stews, and nose-to-tail yakitori.
              - paragraph [ref=e252]:
                - text: We update this list quarterly to make sure it reflects the ever-changing Barcelona dining scene. Our write-ups include insider tips from our experienced writers and editors, as well as a rough range of pricing for each destination — ranging from
                - strong [ref=e253]: $
                - text: for quick, inexpensive meals with dishes largely under $10 (or the equivalent in euros), to
                - strong [ref=e254]: $$$$
                - text: for places where entrees exceed $30.
              - paragraph [ref=e256]:
                - strong [ref=e257]: "New to the map in November 2025:"
                - text: Bemba, a smash burger spot with a small menu but perfect execution and top-quality ingredients; Shoronpo, a busy ramen bar known for creamy tan tan men and plump soup dumplings; and Margarit, an elegant homage to the nostalgic flavors of Greece and the Mediterranean at large.
