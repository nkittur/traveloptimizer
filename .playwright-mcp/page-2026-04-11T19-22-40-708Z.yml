                  - paragraph [ref=e1241]: La Mudana is celebrating its 10th anniversary in 2025, and over the last decade it has become an anchor of the local culinary scene of Sants, a neighborhood known for its tight-knit community and support for local businesses. La Mudana is equally suited as a spot for friends to catch up over a few tapas and a beer as it is for a refined multicourse dinner. The food draws influence as much from Mediterranean and Catalan cuisine as it does from the flavors of France and Asia, with a little Latin American influence as well. Pick from dishes like the kimchi juice and comté cheese oyster, meaty cap i pota rice with teriyaki eel, ox tail-stuffed brioche with smoked sabayon, and the Iberian pork katsu sando with mole and ají amarillo, or opt for a fixed-price two-person tasting menu of six all-star dishes, plus dessert, that includes vermouth to start and cava to finish.
                  - paragraph [ref=e1242]:
                    - strong [ref=e1243]: "Must-try dish:"
                    - text: No table at La Mundana is complete without the picturesque patatas bravas — two perfectly-sculpted rectangles of potato, fried crisp and topped with classic spicy brava sauce as well as the funky black garlic alioli.
