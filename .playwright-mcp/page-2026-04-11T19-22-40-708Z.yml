                  - paragraph [ref=e427]: The team at pizzeria Sartoria Panatieri focuses on seasonality, artisan production, and ingredient provenance, taking the pies to a whole other level and making this one of the hottest spots in the city; in fact, they were awarded the title of 2nd Best Pizza in the World in 2024 as part of the the Best Chef Awards. This self-described “farm to pizza” restaurant meticulously selects every ingredient that graces their creative pizzas. Tender crust from local, organic flour is the base for toppings like sobrasada with Mahón cheese, wild fennel, honey, and mozzarella; adobo pork jowl with celeriac puree, smoked mozzarella, and Brazil nuts; or apple compote with bleu cheese, celery, freeze-dried apple, and caramelized almonds. Make sure you try their house-made salumi as well, especially the papada and the Gascón pork tartare.
                  - paragraph [ref=e428]:
                    - strong [ref=e429]: Know before you go
                    - text: ": The location on Carrer de Provença is the flagship location with the most creative and seasonal pizzas, while the location in Gràcia on Carrer de l’Encarnació serves popular classic pies."
