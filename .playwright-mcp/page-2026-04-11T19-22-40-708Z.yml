                - paragraph [ref=e925]: Besta’s two chefs, Carles Ramon and Manu Núñez, focus on offering exceptional products from their home regions of Catalunya and Galicia, respectively. They precisely plate vibrant dishes with a focus on seafood, like skate wing with bone marrow and mustard, and scallop with bright orange roe emulsion and smoked paprika. The menus — either 9 or 12 courses — are always a surprise, but make sure you try the oyster- and seaweed-infused gin tonics.
