                  - paragraph [ref=e503]: Chef Rafa Panatieri, of the Panatieri-Sastre chef duo, loves to say that of all the carefully imagined and artfully presented dishes at Brabo, everyone remembers the bread. Grilled in a pan over glowing coals and served with smoked butter, this unforgettable starter is even better when enjoyed with the salumi that Panatieri and fellow co-owner Jorge Sastre have perfected at their award-winning Sartoria Panatieri pizzería. Most dishes — grilled quail with young garlic, chuletón steak of thickly-marbled Friesian, spring peas with white sobrasada sausage, whole-roasted fish of the day — pass over the grill in Brabo’s kitchen, which is open to the intimate and dimly-lit dining room.
                  - paragraph [ref=e504]:
