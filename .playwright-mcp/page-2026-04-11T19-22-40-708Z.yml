                - paragraph [ref=e1069]: With no signage or any identifying information visible from the street, the small Suru Bar makes meals in its intimate space feel like serendipity. A row of counter seating gives diners a view into the open kitchen, where chefs prepare star dishes like grilled chicken skin skewers with chilled shrimp tartare, vibrant spring peas with smoked chorizo and cured egg yolks, and a brochette of crunchy pig ear with charred chicken gizzard and tender squid. The cuisine is seasonal, thanks to the prime location just across the street from the famous Ninot market, and the dishes range from yakitori on a traditional Japanese grill to explorations of all things offal, with an extensive wine list to round out the meal.
                - paragraph [ref=e1070]:
