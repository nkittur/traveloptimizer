                  - paragraph [ref=e962]: "Created by Priscilla Alfaro, a Mexican American woman who grew up in Los Angeles, with her partner Gaston Gabrielli and chef Nick Hosea, this is an excellent, modern American diner where the draw is simple: truly delicious food and bottomless filter coffee from specialty roaster Three Marks Coffee. The pancakes are fluffy, the bacon is crispy, the breakfast burrito is hearty, and the Nashville hot chicken sandwich is tongue-numbingly good. Too many brunch spots in Barcelona rely on Instagram-worthy visuals to compensate for mediocre flavors and cookery, but Gringa All Day is the real deal. Expect a line on the weekends, but the wait is worth it. No reservations."
