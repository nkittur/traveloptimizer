                - paragraph [ref=e318]: Barcelona is in the throes of a natural wine renaissance, and Masa Vins is opening some of the most interesting bottles in the city. The cuisine of co-owner chef Antonella Tignanelli is rooted in the Mediterranean but globally inspired. Delicate dishes like seabass crudo with mandarin oil and sumac share space on the menu with bar snacks like the kimchi grilled cheese “bikini.” Brimming with youthful energy, Masa Vins was created by Tignanelli and co-owner Dani Bajc to be a place to hang with friends, drink unique wines, listen to music, and eat excellent food. Of the 250 natural wines on the list, there’s an emphasis on Eastern European labels, and the food menu changes every three months with the seasons.
                - paragraph [ref=e319]:
                  - strong [ref=e320]: Know before you go
                  - text: ": The place is nearly always busy and there aren’t many tables, so get there early or expect to wait. Groups bigger than five people can book a table between 6 p.m. and 9 p.m., exclusively through Instagram direct message."
