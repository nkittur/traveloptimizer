                - paragraph [ref=e1276]: This small corner bar just one block from the old port of Barcelona has been serving the same four dishes since 1945. Though the salted anchovies, fried sausage, and tomato salad are all delicious, pescaditos (fresh, floured, and fried whole anchovies) are the true star. Now run by the grandson of the original founder, Bar La Plata sells over 85 pounds of the little fishes per week.
                - paragraph [ref=e1277]:
                  - strong [ref=e1278]: "Know before you go:"
                  - text: The place is nearly always busy and only has a few tables, so either show up right when they open, or do as the local crowd does and eat standing up at the bar or even in the street if no seats are available. Drinking alcohol outside isn’t allowed but you can get the pescaditos to-go in a paper cone.
