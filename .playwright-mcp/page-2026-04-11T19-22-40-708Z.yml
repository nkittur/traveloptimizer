                - paragraph [ref=e1568]: Tiberi Bar was born from the Tiberi Club, a popular organizer for creative events and pop-ups that fuse eating and art. Tucked away on a quiet street in Poble Sec, the minimalist, airy interior, with high ceilings and plenty of windows, is the perfect scene for a rotating roster of colorful sharing plates inspired by Catalan traditions and the flavors of the Mediterranean, paired with natural wines from small local producers. Duck terrine with pistachios, crunchy polenta with sage, smoked sardine with sour cream and whole grain mustard, and a pork confit sandwich with red cabbage play upon well-worn local staples with surprising flavors.
                - paragraph [ref=e1569]:
                  - strong [ref=e1570]: Know before you go
                  - text: ": Tiberi Bar organizes a periodic Sunday morning special menu, dubbed Granja Tiberi, with novel takes on brunch such as croissant with ricotta, sobrassada, and honey, and fried eggs with peas, artichokes, mint, and ham. Check the Tiberi Bar Instagram for scheduling and booking info."
