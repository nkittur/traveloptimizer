                    - text: Dinner, with lunch and brunch over the weekend
                  - paragraph [ref=e1603]:
                    - strong [ref=e1604]: "Price:"
                    - text: $$$
                  - paragraph [ref=e1605]: At Margarit, on a narrow tree-lined street on the slope of Montjüic, Greek chef Stefanos Balis paints with broad Mediterranean brushstrokes while paying homage to his Hellenic homeland. There’s a standout list of both traditional and natural wines, with some especially interesting and potent Greek reds, which pair nicely with refined dishes dispatched from a sleek open kitchen. Favorites include the salty taramas fish roe spread with cured bonito tuna, the grilled eggplant with pistachios and honey harissa, the mini chicken souvlaki on fresh sourdough pita, and the braised lamb neck with yogurt sauce and tender root vegetables — dishes built on tradition and memory.
                  - paragraph [ref=e1606]:
                    - strong [ref=e1607]: "Know before you go:"
                    - text: Weekends are a bit different at Margarit, with a rotating daytime menu that captures the flavor and energy of a slow Sunday meal around the Mediterranean.
