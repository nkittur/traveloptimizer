                  - paragraph [ref=e651]: Founded in 1898, this family-run colmado has long been one of the most iconic gourmet shops in the city. With an impressive stock of over 200 cheeses and a huge selection of wines, conservas, and cured meats, the famed dry goods store was renovated in 2022 to accommodate an array of high bistro tables, as well as a more formal dining room tucked away behind storeroom doors. The kitchen, led by chef Jordi Vilà of Michelin-starred Alkimia, offers a take on Catalan cuisine that is both elegant and nostalgic, with dishes like wild sea bass tartare with sour cream and caviar, stewed mushrooms with poached egg and zucchini panna cotta, and lamb shoulder braised with Chartreuse.
                  - paragraph [ref=e652]:
                    - strong [ref=e653]: "Know before you go:"
                    - text: "There are two dining areas, each with its own booking system: the less-formal Colmado Múrria shop space with high tables, and the backroom Rerebotiga with low tables and tablecloths."
