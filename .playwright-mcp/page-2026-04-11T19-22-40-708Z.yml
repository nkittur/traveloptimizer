                  - paragraph [ref=e355]: From restaurateurs Majid and Mani Alam along with Bilal Khan, Achaar Bar is part of the growing roster of restaurants under the Alam Brothers umbrella. Their latest is an Indian canteen and natural wine bar named for the ubiquitous South Asian pickled vegetable condiment (which they make in-house). The menu spans the breadth of India, as well as adding in some Pakistani favorites like the Lahori samosa, a nod to the Alam brothers’ Punjabi roots. The 150 natural wines on offer have been curated by sommelier Irene Cavalli to pair excellently with the bold seasoning, heat, and aromas of dishes like Kima Mutter Pav (spicy ground beef with peas and brioche bread), spicy coconut prawns, Madrasi vegetables, and Goan fish curry. This kitchen has breathed new life to a space that was once a warehouse, embracing the stripped-down post-industrial aesthetic in Poblenou, a district akin to the Brooklyn of Barcelona. Order as much as you can; the menu isn’t huge, so with a handful of friends you might be able to try it all, and you’ll be happy you did.
                  - paragraph [ref=e356]:
                    - strong [ref=e357]: Must-try dish
                    - text: ": If you’re a meat eater, don’t miss the tandoor-roasted lamb chops, the unassuming star of the menu."
