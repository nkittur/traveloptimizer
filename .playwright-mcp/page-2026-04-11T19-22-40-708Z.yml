                  - paragraph [ref=e1387]: Chef Jordi Artal and his team fill the seasonal tasting menus at two-Michelin-starred Cinc Sentits (Five Senses) with modern interpretations of Catalan cuisine. Spring might bring artichoke or venison presented with bits of molecular flair (a spherification here, a powder there). But while Artal’s dishes are undoubtedly intricate and delicately composed — he proudly declares that no principal ingredient is repeated over the course of their lengthy tasting menu — they also aren’t wanting for bold flavor or heartiness. A restaurant at this level shouldn’t leave you hungry; this one doesn’t.
                  - paragraph [ref=e1388]:
                    - strong [ref=e1389]: "Know before you go:"
                    - text: Make a special booking request for their private dining room with a huge window that looks directly into the kitchen full of chefs working with laser focus.
