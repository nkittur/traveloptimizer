                - paragraph [ref=e614]: Seyma Ozkaya Erpul is originally from Turkey but has called Barcelona home for over a decade. She left her previous career as an engineer and marketing professional to pursue her passion for great food and design, opening the first Funky Bakers in the heart of El Born. While that original location remains a popular takeaway coffee shop, the full Funky Bakers experience can be had at the Eatery and Deli location in Eixample. One side is a highly curated gourmet grocery, gift, and coffee shop, while the other is a bistrot serving colorful and creative dishes from around Northern Europe and the Mediterranean, all paired with natural wines.
                - paragraph [ref=e615]:
                  - strong [ref=e616]: "Know before you go:"
                  - text: If you find yourself in the neighborhood of Poble Sec, check out the new Funky location inside the chic Hotel Brumell, with a beautiful interior courtyard tucked away from the busy city center.
