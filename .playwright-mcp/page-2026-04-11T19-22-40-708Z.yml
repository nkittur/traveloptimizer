                - paragraph [ref=e686]: Mikan comes up again and again when locals in the know are asked about their favorite spots in the city. Serving what the team calls Northeast Asian cuisine, the project, created together with partners Woody Wang and Arthur Holland Michel, is an evolution of various businesses — private dinners, a lunchbox delivery service, homemade chili crisp — that chef Dan Jin (who goes by Tan) developed at the start of the pandemic. Chef Tan has a particular passion for the dishes of her native region of Northern China, but she also loves the flavors of Japan and Korea. Mikan is a bargain for lunch, when a fixed-price menu includes a variety of dishes, soup, and dessert (including vegan and vegetarian options). In the evenings, the exciting a la carte menu is perfect for sharing. Dishes like grilled koji-cured mackerel with green onion oil, daikon, and shiso, spicy beef salad with cilantro and chile, or Iberian pork loin katsu are paired expertly with an eclectic selection of natural wines, all from small European producers.
                - paragraph [ref=e687]:
                  - strong [ref=e688]: Know before you go
                  - text: ": One Saturday per month, the bar features rotating local DJs starting at 11 p.m., and there are often collaboration nights with unique, thematic wine pairings by visiting sommeliers, so keep an eye on their Instagram."
