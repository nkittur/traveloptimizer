                  - paragraph [ref=e287]: "Simplicity in concept but perfect execution is what pushes Bemba to the top of the smash burger heap. The menu is brief, with just three burger options: regular cheese, double bacon, and the house special Bemba Burger, which comes with chimichurri and a smashed patty of chorizo criollo sausage in addition to the standard beef patty. Bemba has cultivated a flock of loyal regulars with the conscious selection of quality ingredients, fast service, and careful caramelization of each smashed patty. There’s also a beet and quinoa smash burger, great fries, cold draught beer, and homemade pickles — what more is there to ask for?"
                  - paragraph [ref=e288]:
                    - strong [ref=e289]: "Know before you go:"
                    - text: It’s small so get there early, or order your burgers for takeaway and eat them in the beautiful Plaça de la Virreina just a few blocks away.
