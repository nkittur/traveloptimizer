                  - paragraph [ref=e1102]: Crowds flock to Taktika Berri to down copious amounts of ice-cold beer and funky, sour cider while perusing the platters of pintxos that adorn the well-polished bar. Highly traditional without being kitsch, this popular Basque bar, founded in 1995, feels like it’s been transported straight from the industrial port city of Bilbao, complete with old photos and jai lai baskets. The bar area at the entrance can get packed with an after-work crowd, who graze classic pintxos like fried chistorra sausage, anchovies with piquillo peppers, and tortilla de bacalao (salt cod omelette). But don’t be deceived; the pintxos on display are just a small fraction of what the menu has to offer. Take a look at the carta and order from a selection of Basque mainstays like almejas con refrito (sauteed clams with garlic, cayenne, and cider vinegar), the two-person serving of cogote de merluza (a large center-cut piece of whole hake, roasted and served with garlic and parsley), fried monkfish loin, or a well-marbled txultetón steak.
                  - paragraph [ref=e1103]:
                    - strong [ref=e1104]: Know before you go
                    - text: ": In addition to the cold or room-temperature pintxos on the bar, there is also a menu of hot pintxos that can be made-to-order (try the morcilla black sausage). To drink, choose a caña (small draught beer), Basque hard cider, or Txakoli (a famous, lightly-sparkling, kind of saline, low-alcohol wine from the Basque region)."
