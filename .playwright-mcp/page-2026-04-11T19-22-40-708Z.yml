                  - paragraph [ref=e1457]: "The creation of chef Victor Ródenas and brothers Ignasi and Marc García, this youthful take on a simple Catalan casa de menjars (house of food) combines the best parts of a traditional vermouth bar with the refined, seasonal Catalan cooking of a fine dining veteran. The lively yet casual atmosphere is the perfect place to enjoy the varied dishes: confit artichokes with spring peas, sunchoke puree, and romesco; escabeche oyster shooters with chicken jus; beef tendon stew with fried hake and pickled chile peppers; and mini paella with shrimp tartare and pig trotter carpaccio. This is a gathering place for neighborhood regulars first and foremost."
