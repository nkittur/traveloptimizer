                  - paragraph [ref=e727]: Named for a tiny island nearly 800 miles off the coast of India in the Bay of Bengal, the cuisine of Little Andaman is light and vibrant, with coconuts, fresh herbs, seafood, and vegetables playing the starring roles in many plates. The restaurant space is chic and inviting, equally suited for a lunch with friends as it is for an intimate date night. While many dishes are inspired by the flavors of Little Andaman, the menu also features an ample array of small plates from coastal regions all across India, like mustard and five spice-seasoned shrimp skewers, tamarind fish stew, and Goa-style spiced lamb sorpotel with poi bread. The menu is extremely veggie/vegan friendly, with plenty of gluten-free options as well.
                  - paragraph [ref=e728]:
                    - strong [ref=e729]: Best for
                    - text: ": There is a weekday prix fixe lunch menu and three different tasting menus in the evenings (short and long tapas menus, and a vegetarian menu with vegan options), allowing diners to sample the widest variety of dishes."
