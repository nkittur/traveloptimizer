                - paragraph [ref=e1422]: Suculent isn’t defined by one genre of cuisine, but packs its tasting and a la carte menus with as many delicious dishes as possible. It’s a favorite among chefs for nose-to-tail cooking and fine dining makeovers of grandma’s Catalan comfort food (with influences from Asia and Latin America). Dishes change with the seasons, but don’t miss mainstays such as the beets with beurre blanc and smoked eel, the royal custard of porcini mushrooms with sea urchin, and the braised hare canelon with foie gras and Codium seaweed.
