                  - paragraph [ref=e579]: "Rooq makes everything in-house, from the herb breading, tangy marinade, fermented pickles, and pillowy brioche buns for their fried chicken sandwiches, to their side dishes and brownies. The menu is minimal: chicken nuggets, salads, and sandwiches. All the chicken sandwiches (fried, spicy fried, grilled, or the new Sichuan-style hotpot flavor) are made with juicy, corn-fed Catalan chicken breasts, and . vegetarians can choose from jackfruit or tofu in either nuggets or sandwiches. Pick your main course and round out the meal with twice-cooked fries tossed in the house spice blend and a side of coleslaw (vinegar- or mayonnaise-based). There’s also a wide selection of craft beers and seven house-made dipping sauces."
