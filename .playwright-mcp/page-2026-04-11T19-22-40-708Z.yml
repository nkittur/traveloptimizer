                - paragraph [ref=e997]: It’s rare in Barcelona to see a classic trompo slowly, perfectly charring pork, but Xuba Tacos takes tacos al pastor very seriously. The restaurant lovingly layers spiced pork on the spit, shaves it into thin slices, and serves it on supple, handmade blue corn tortillas. Alongside classics like al pastor and carne asada, there are also modern creations, like black beer-batter sea bass tacos with crispy leeks and sauteed lobster tail tacos with cilantro emulsion. Keep an eye out for seasonal specials, like wild mushroom and roasted chestnut tacos, and don’t miss the micheladas.
                - paragraph [ref=e998]:
                  - strong [ref=e999]: Best for
                  - text: ": For a great deal, opt for their weekday fixed-price lunch menu that includes a starter of guacamole, three tacos of your choice, and a drink (water, soda, or beer)."
