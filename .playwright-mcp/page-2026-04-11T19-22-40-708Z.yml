                  - paragraph [ref=e1180]: Since 1946, Gelida has been an important social hub for the neighborhood, be it old friends meeting for a weekend lunch or workers loading up on calories before sunrise. The menu is full of classic Catalan dishes, but the breakfast-forward spot is best known for esmorzars de forquilla, or “fork breakfasts.” In modern Barcelona, many people opt for a light breakfast (think croissant and coffee), but the tradition of beginning your day with a hearty plate of stewed veal, tripe, snails, pig trotter, chickpeas, or pork cheeks is still alive at institutions like Gelida. You’ll see heaps of fried potatoes topped with a runny fried egg and spicy chorizo on tables as life-long regulars drink cafe con leche and mini draught beers simultaneously.
                  - paragraph [ref=e1181]:
                    - strong [ref=e1182]: "Must-try dish:"
                    - text: Cap i pota, a gelatin-rich stew of veal head and hoof (though Gelida uses veal necks, which are meatier). The sauce is meant to be sopped up with pieces of crusty baguette and washed down with a house Gandesa, a golden, long-macerated white wine from the region of Terra Alta.
