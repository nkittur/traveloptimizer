                - paragraph [ref=e1137]: The location of Flax & Kale just off the Pasaje de las Manufacturas is by far the brand’s best. It’s open all day, great for a weekend brunch, and the menu is distinct from the other locations, boasting the company’s astonishingly good wood-fired vegan pizzas (that also happen to be gluten-free). Chef Teresa Carles has been pioneering “flexitarian” food in Barcelona since 2014, and other highlights of her menu include miso-glazed eggplant with pulled jackfruit, red cabbage sauerkraut, and chili jam plant-based smash burgers; and parmesan kale lemon salad with sautéed portobello mushrooms and anchovy dressing. There are also some fish-centric dishes, like oven-roasted seabass with mojo picón sauce, wild salmon with quinoa and pistachios, and yellowfin tuna bibimbap.
                - paragraph [ref=e1138]:
                  - strong [ref=e1139]: "Must-try drink:"
                  - text: Stop by and grab one of their many flavors of kombucha (the spicy margarita kombucha with lime, cilantro and jalapeño is my favorite) or cold-pressed juices from the take-away refrigerators at the front of the restaurant.
