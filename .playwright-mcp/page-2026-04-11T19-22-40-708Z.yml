                - paragraph [ref=e390]: Shoronpo is one of the most popular ramen spots in the city, and it’s equally famous for the eponymous soup dumplings, which are the Japanese version of xiaolongbao. Fillings range from classic minced pork to foie gras, and there is even a dessert shoronpo with chocolate, olive oil, and sea salt. The ramen comes in 10 varieties including three vegetarian options, but the star is the rich and creamy tantanmen with sesame-laced chicken broth, ground pork, and springy noodles that chef Keita Tanaka may have introduced to Barcelona. Booking can be done online and is a must, and keep an eye out for a new location outside the Estació Sants train station soon.
                - paragraph [ref=e391]:
                  - strong [ref=e392]: Must-try dish
                  - text: ": The karaage (fried chicken) and the yude ebi wantan (boiled shrimp dumplings in sichuan chili sauce) should not be missed."
