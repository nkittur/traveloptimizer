                - paragraph [ref=e853]: Chef Rafa Peña’s passion for food is as great as his disregard for formality and fine dining accolades. A favorite among the city’s chefs, Gresca is a must-visit for lovers of nose-to-tail cooking who want to experience the best of seasonal Catalan cuisine without the stuffy service and delicate portions of some Michelin-starred restaurants. The menu can change from day to day, but there are some mainstays that every first-timer at Gresca should experience, such as the roasted chicken with fines herbes, the calf’s brain with butter and lemon, the pan-roasted sweetbreads, and the grilled quail.
                - paragraph [ref=e854]:
                  - strong [ref=e855]: "Know before you go:"
                  - text: The best seats in the house are at the open kitchen pass, where diners get a front row view of the action. It’s worth calling the restaurant to reserve your spot, since they don’t provide this option when booking online.
