              - generic [ref=e300]: 3:30 p.m. Check out coastal crafts
              - generic [ref=e301]:
                - text: The maker scene is alive and well in Vancouver. The cozy shop
                - link "Gatley" [ref=e302] [cursor=pointer]:
                  - /url: https://gatley.ca/
                - text: features crafts from local producers including higher-end pottery and clothing, as well as butter-soft leather wallets from Erin Templeton (75 dollars) and Brand & Iron candles (42 dollars). Across the street, the children’s store
                - link "Dilly Dally" [ref=e303] [cursor=pointer]:
                  - /url: https://dillydallykids.ca/
                - text: draws grown-up kids, too, especially for its handmade toys, like tiny canoes from Quebec (27.99 dollars). Up the street, painted canvases leaning on a red brick wall mark the entrance to
                - link "Arts off Main" [ref=e304] [cursor=pointer]:
                  - /url: https://www.artsoffmain.ca/
                - text: ", a cooperative gallery owned by nine local artists who display their works there. Inside, Jan Rankin’s impressionistic paintings evoke Pacific Northwest scenes in vibrant acrylics, while Tom Antil paints dreamlike Vancouver cityscapes of towers, bridges and bays."
            - generic [ref=e305]:
              - generic [ref=e306]: 5:30 p.m. Sip Main Street
              - generic [ref=e307]:
                - text: As recently as a decade ago, the Main Street area was a blue-collar holdout of traditional Chinese restaurants and autobody shops, but a booming local tech scene and proximity to downtown have lately transformed the area. Craft breweries like
                - link "Brassneck" [ref=e308] [cursor=pointer]:
                  - /url: https://brassneck.ca/
                - text: have proliferated, but a welcome variation is the urban winery
                - link "Fabrique St-George" [ref=e309] [cursor=pointer]:
                  - /url: https://www.fabriquestgeorge.com/
                - text: ", which ferments local Okanagan grapes on-site in giant amphora vessels. Try their flagship wine, Amber (14 dollars a glass), paired with local charcuterie."
            - generic:
              - figure "scoop-picture"
            - generic [ref=e310]:
              - generic [ref=e311]: 7 p.m. Eat like a local
              - generic [ref=e312]:
                - text: Main Street is home to several of Vancouver’s newly Michelin-starred eateries. The “it” restaurant du jour is
                - link "Published on Main" [ref=e313] [cursor=pointer]:
                  - /url: https://publishedonmain.com/
                - text: — a minimalist space with stark white-tile floors and midcentury-modern furnishings — where the real artistry is on the plate. Small dishes like side-stripe prawns (23 dollars), bison tartare (30 dollars) and smoked steelhead (46 dollars) — all prepared and plated with near-obsessive precision — show off the best of local produce. Reservations highly recommended. A few doors down, the modern Peruvian bistro
                - link "Suyo" [ref=e314] [cursor=pointer]:
                  - /url: https://suyo.ca/
                - text: makes a more than adequate back-up.
            - generic [ref=e315]:
              - generic [ref=e316]: 9 p.m. Leave room for ice cream
              - generic [ref=e317]:
                - link "Earnest Ice Cream" [ref=e318] [cursor=pointer]:
                  - /url: https://earnesticecream.com/
                - text: started out only selling its popular flavors like whisky hazelnut and salted caramel (5.25 dollars, single scoop) from a roving tricycle. Now, the Vancouver business has four locations, including one on Quebec Street that is walkable from dinner. Grab a waffle cone in the restored century-old textile mill on the edge of Olympic Village, a neighborhood of waterfront mid-rises built for Vancouver’s 2010 Winter Olympics. Be prepared to line up.
