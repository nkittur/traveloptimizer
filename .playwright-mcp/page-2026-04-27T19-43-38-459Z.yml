              - generic [ref=e334]: 9 a.m. Have a North Shore adventure
              - generic [ref=e335]:
                - text: Just a 15-minute
                - link "Seabus" [ref=e336] [cursor=pointer]:
                  - /url: https://www.translink.ca/schedules-and-maps/seabus
                - text: ride (3.10 dollars one-way) across the Burrard Inlet, a shallow Pacific Ocean fjord, lies the North Shore — Vancouver’s wild backyard. Rows of homes in the suburbs rise steeply on mountain slopes before giving way to a seemingly endless expanse of forest and rocky peaks. For a quick glimpse of old-growth forest remnants and rugged canyons, take an Uber or taxi just past the tourist magnet
                - link "Capilano Suspension Bridge" [ref=e337] [cursor=pointer]:
                  - /url: https://www.capbridge.com/
                - text: to the much quieter
                - link "Capilano River Regional Park" [ref=e338] [cursor=pointer]:
                  - /url: http://www.metrovancouver.org/services/parks/parks-greenways-reserves/capilano-river-regional-park
                - text: . The well-marked Coho Loop threads less than a mile along the jade green Capilano River (where jumping salmon can often be seen in summer and fall), and winds beneath towering firs draped with moss. The trail climbs to a footbridge for vertigo-inducing views of the swirling river far below, before circling back along the opposite shore.
