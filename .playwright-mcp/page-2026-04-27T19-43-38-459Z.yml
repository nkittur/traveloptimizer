              - generic [ref=e213]: 2 p.m. Cruise the seawall
              - generic [ref=e214]:
                - text: A visit to downtown’s waterfront
                - link "Stanley Park" [ref=e215] [cursor=pointer]:
                  - /url: https://vancouver.ca/parks-recreation-culture/stanley-park.aspx
                - text: ", which is larger than New York’s Central Park, offers an unforgettable, if de rigueur, introduction to the city. Biking the 6.6-mile seawall is a great way to enjoy the park’s rainforest, beaches and gardens. Hop on a"
                - link "Mobi bike share" [ref=e216] [cursor=pointer]:
                  - /url: https://www.mobibikes.ca/
                - text: (1 dollar to unlock, then 25 cents per minute) near the aquarium and pedal along the edge of Coal Harbour, with its gleaming glass towers, then under the imposing steel frame of the Lions Gate Bridge, watching for seals in Burrard Inlet. Farther on, cold Pacific water beckons hardy swimmers and paddleboarders at
                - link "Third Beach" [ref=e217] [cursor=pointer]:
                  - /url: https://vancouver.ca/parks-recreation-culture/third-beach.aspx
                - text: ", while bald eagles perch in towering cedars and Douglas firs. Prop your bike against one of the weathered logs and watch the container ships in English Bay stream into the harbor."
            - generic [ref=e218]:
              - generic [ref=e219]: 3:30 p.m. Enjoy a brew with a view
              - generic [ref=e220]:
                - text: Located inside the park,
                - link "Stanley Park Brewpub & Restaurant" [ref=e221] [cursor=pointer]:
                  - /url: https://www.stanleyparkbrewing.com/brewpub/
                - text: is in a restored 1930 heritage building whose tall windows look out on grassy lawns rolling down to the water. Inside, drinkers at long tables quaff creative beers brewed on premises (7.75 dollars a pint). For a more refined atmosphere, check out the lounge at the nearby ivy-clad
                - link "Sylvia Hotel" [ref=e222] [cursor=pointer]:
                  - /url: https://sylviahotel.com/restaurant-lounge/
                - text: ", built in 1912, with great views of English Bay. The story goes that the Sylvia Martini (19 dollars) — now made with the locally distilled Long Table gin — has been a favorite since Errol Flynn ordered one in 1959."
            - figure "scoop-picture" [ref=e224]:
              - generic [ref=e228]: Vinyl Records
            - generic [ref=e229]:
              - generic [ref=e230]: 4:30 p.m. Wander Vancouver’s first neighborhood
              - generic [ref=e231]:
                - text: Often the first stop for disembarking cruise ship passengers, downtown’s historic
                - link "Gastown neighborhood" [ref=e232] [cursor=pointer]:
                  - /url: https://gastown.org/
                - text: "is in turns charming and schmaltzy: handsome 19th-century brick buildings house gift shops selling maple-leaf-printed P.J.s and moose keychains. For an antidote to the typical tchotchkes, stop in"
                - link "Vinyl Records" [ref=e233] [cursor=pointer]:
                  - /url: https://vinylrecords.ca/
                - text: ", an emporium of new and used LPs, including albums from Canadian icons like Leonard Cohen, the Tragically Hip and even Justin Bieber, that are conveniently clustered near the door. Just down the street, the Vancouver-based"
                - link "Native Shoes" [ref=e234] [cursor=pointer]:
                  - /url: https://www.nativeshoes.com/
                - text: ’ flagship store features a vibrant rainbow of slip-on shoes made of washable, recyclable and vegan foam (think Crocs, but trendier), from about 60 dollars a pair.
            - generic [ref=e235]:
              - generic [ref=e236]: 7 p.m. Say “oui” to a French Canadian dinner
              - generic [ref=e237]:
                - text: Gastown’s eastern fringe, where trendy shops give way to social housing services, is part of an area in transition where
                - link "homelessness" [ref=e238] [cursor=pointer]:
                  - /url: https://vancouver.ca/people-programs/homeless-count.aspx
                - text: ", drug use and gentrification remain a thorny challenge. Against this fast-evolving backdrop,"
                - link "St. Lawrence" [ref=e239] [cursor=pointer]:
                  - /url: https://www.stlawrencerestaurant.com/
                - text: ", one of Vancouver’s new Michelin-starred restaurants, has been drawing in-the-know diners since 2017 with its haute take on traditional Québécois cuisine. Guests are greeted with a “bonsoir,” and velvet curtains part to reveal a small, low-lit room with a tiny open kitchen in back. The prix-fixe menu (125 dollars per person) consists of seven eclectic dishes, which rotate monthly but have a distinctly Canadian flair, like a split-pea soup with maple-cured sablefish. Reserve ahead."
            - figure "scoop-picture" [ref=e241]:
              - generic [ref=e245]: Guilt and Company
            - generic [ref=e246]:
              - generic [ref=e247]: 9 p.m. Follow the noise underground
              - generic [ref=e248]:
                - text: Gastown comes alive after dark, with drinking options for different tastes, including
                - link "Cuchillo" [ref=e249] [cursor=pointer]:
                  - /url: https://www.cuchillo.ca/
                - text: ", a luchador-themed cocktail bar, and"
                - link "Juice Bar" [ref=e250] [cursor=pointer]:
                  - /url: https://www.juicebaryvr.com/
                - text: ", a pop-up serving natural wines after hours in a cafe setting. But Gastown’s best live music is underground. Stone steps descend to"
                - link "Guilt & Co." [ref=e251] [cursor=pointer]:
                  - /url: https://www.guiltandcompany.com/
                - text: ", where music lovers line up to see local and touring rock, jazz and indie acts (ticket price per set, 6 dollars). Low lights, boozy cocktails and dungeon-like stone walls lend a conspiratorial air to the venue, which draws a diverse and welcoming crowd that boogies down until well after midnight."
          - figure "scoop-picture" [ref=e252]:
            - generic [ref=e256]: A booming local tech scene and proximity to downtown have lately transformed the Main Street area, bringing newcomers like the urban winery Fabrique St-George.
          - generic [ref=e257]: Advertisement
          - generic [ref=e258]:
            - paragraph [ref=e259]: Saturday
            - figure "scoop-picture" [ref=e261]:
              - generic [ref=e265]: Kitsilano Beach
            - generic [ref=e266]:
              - generic [ref=e267]: 9:30 a.m. Wake up and sweat
              - generic [ref=e268]:
                - text: Vancouver’s seaside Kitsilano neighborhood, once a counterculture outpost, is now one of the city’s most affluent areas, where stores selling expensive yoga pants and smoothies abound. Early risers can start the day with a drop-in class of heart-pumping cardio set to dance music at
                - link "TurF" [ref=e269] [cursor=pointer]:
                  - /url: https://www.ourturf.com/
                - text: (28 dollars), a small (and extremely popular) studio-slash-cafe wedged onto trendy West 4th Avenue. Palo santo — a fragrant wood — is often burned before classes, and the audio system soars to club-like volumes. If that sounds like too much work, the nearby
                - link "Kitsilano Beach" [ref=e270] [cursor=pointer]:
                  - /url: https://vancouver.ca/parks-recreation-culture/kitsilano-beach.aspx
                - text: affords a calmer start to the morning. Packed with students and young grads working on tans later in the day, Kits Beach at this hour provides a quiet spot for sunning or cooling off in the ocean.
            - generic:
              - figure "scoop-picture"
            - generic [ref=e271]:
              - generic [ref=e272]: 11 a.m. Try dim sum with a beer on the side
              - generic [ref=e273]:
                - text: Cantonese-style dim sum is a Vancouver institution, part of a legacy of exceptional Chinese cuisine in a city where about
                - link "15 per cent of the population" [ref=e274] [cursor=pointer]:
                  - /url: https://www12.statcan.gc.ca/census-recensement/2016/dp-pd/prof/details/page.cfm?Lang=E&Geo1=CSD&Code1=5915022&Geo2=PR&Code2=01&Data=Count&SearchText=5915022&SearchType=Begins&SearchPR=01&B1=All&Custom=&TABID=3
                - text: speaks a Chinese language most often at home. At Kitsilano’s unassuming
                - link "Little Bird" [ref=e275] [cursor=pointer]:
                  - /url: https://littlebirddimsum.com/
                - text: ", set along a strip-mall-like stretch, diners pack into a narrow space on weekend mornings for modern dim sum paired with local craft beer. There are plenty of vegan and gluten-free options available, with some favorites, including shu mai with Beyond Meat (9.50 dollars) and green-tea sesame balls with matcha chocolate filling (8 dollars)."
            - figure "scoop-picture" [ref=e277]:
              - generic [ref=e281]: Fluevog Shoes
            - generic [ref=e282]:
              - generic [ref=e283]: 12:30 p.m. Dress like a Vancouverite
              - generic [ref=e284]:
                - text: Kitsilano's West 4th Avenue boasts a who’s who of iconic Canadian West Coast brands. For all things Gore-Tex, check out the newly opened 4,500-square-foot flagship store of Arc’teryx, the high-end outdoor clothing brand founded by local mountain climbers. Across the street, a just opened branch of
                - link "Fluevog Shoes" [ref=e285] [cursor=pointer]:
                  - /url: https://www.fluevog.com/stores/vancouver-kitsilano/
                - text: showcases the outlandish footwear designs of John Fluevog, a local maker of “unique soles for unique souls,” whose trademark clunky shoes have been worn by artists like Madonna and Jack White.
            - generic [ref=e286]:
              - generic [ref=e287]: 2 p.m. Get a cold brew on the Drive
              - generic [ref=e288]:
                - text: For a completely different side of Vancouver, head east to
                - link "Commercial Drive" [ref=e289] [cursor=pointer]:
                  - /url: https://thedrive.ca/
                - text: . The city’s traditional Little Italy neighborhood, the Drive is gentrifying fast but retains an eclectic, rough-edged vibe. Aside from its many worthy Neapolitan pizza spots (
                - link "Via Tevere" [ref=e290] [cursor=pointer]:
                  - /url: https://viateverepizzeria.com/
                - text: claiming pride of place), the Drive is also an epicenter of Vancouver coffee culture. The Italian bakery and restaurant
                - link "Livia" [ref=e291] [cursor=pointer]:
                  - /url: http://www.liviasweets.com/
                - text: has divinely foamy cappuccinos (4.25 dollars) and fresh breads, as well as full meals including a popular ragù made with Alberta bison (20 dollars). Just down the street at
                - link "Mum’s The Word" [ref=e292] [cursor=pointer]:
                  - /url: https://www.instagram.com/mums_van/?hl=en
                - text: — equal parts cafe and cocktail bar — locals slip into retro easy chairs for drinks like Mum’s Cold Brew Manhattan (14.75 dollars), a potent mix of cold brew, whisky and kahlua.
