              - generic [ref=e346]: 11 a.m. Absorb local histories, then eat
              - generic [ref=e347]:
                - text: Once an industrial hub, North Vancouver’s waterfront Shipyards district has been reborn over the last five years as a vibrant home for restaurants, condos, retail and museums. Inside the
                - link "Museum of North Vancouver" [ref=e348] [cursor=pointer]:
                  - /url: https://monova.ca/
                - text: (entry, 14 dollars), interactive exhibits explore local history, including the legacy of British Columbia’s First Nations peoples. Hear audio tracks of words pronounced in the Squamish language, while getting up close with a traditional berry-picking canoe. Afterward, walk a block to
                - link "Catch 122" [ref=e349] [cursor=pointer]:
