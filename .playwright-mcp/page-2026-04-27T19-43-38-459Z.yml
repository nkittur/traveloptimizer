            - paragraph [ref=e87]:
              - text: Late last year, the Michelin Man finally came to Vancouver, the coastal British Columbian city. The visit from France’s Michelin Guide was arguably long overdue, and left the city with
              - link "eight single Michelin-starred restaurants" [ref=e88] [cursor=pointer]:
                - /url: https://guide.michelin.com/us/en/article/michelin-star-revelation/2022-vancouver-michelin-stars
              - text: . Of course, there’s more than just food. Vancouver boasts pristine ocean, rugged mountains, glimmering skylines and a truly cosmopolitan culture with influences from China, India and beyond. Visitors are also greeted by a city in transition. As property values have skyrocketed, the gravity of cultural life has shifted eastward — from downtown’s seaside neighborhoods to onetime working-class strongholds like Commercial Drive, areas that are now filling with trendy shops and restaurants. Against this backdrop, with its challenges of gentrification, Vancouver clings to a character all its own.
