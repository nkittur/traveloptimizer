ime having a drink or some food and chatting.\n\nOn this last visit on a random Saturday afternoon, I fiest tried their Anniversary Dopplebock, which was a strong and intense, but altogether enjoyable beer. I then tried the Central Business District, one of the last entries in their 5 year project for nearly 100 different beers named for and dedicated to different Pittsburgh neighborhoods, which is a really cool endeavor. The beer itself had a unique herbal quality to it, and was a fun and different pilsner. My wife tried their hard lemonade, which unsurprisingly blows something like \"Mike's\" out of the water, and she really enjoyed it.\n\nAdd in an always pleasant staff and nice outdoor area that can be enjoyed by kids and furry friends, and you have a great local establishment that is worth a stop if in the area and craving a good beer and/or some hearty pizza.","rating":5,"time":"9 months ago"},{"text":"East End Brewing has always been a pleasant spot to get together for drinks and pizza. The staff is kind, the ambiance is warm, and service is smooth. The bartender Keri is really helpful, personable and knowledgeable; she knows what's good lol. She recommended the Roots Mule, and it is the best alcoholic beverage I've ever had on tap - if you like ginger, definitely come to East End Brewing and try it!","rating":5,"time":"3 months ago"}],"photos":[{"ref":"places/ChIJERC0-YztNIgRaQpuyHiszD8/photos/AU_ZVEGkHtNhfPyJwZ7TvtTK2uu1qV-zChSQTk8ABBgRFkJE-bhNadWk3aXFVLw9AN6evYv23cAYBTVm_v3uWF4IM-XROEs3zJvqU3gnMIEdsxCN0swW9prAPkUg_A_C9qUJnDAsBnl2BFnnRTJqqw9Jsdmbl67pNVzWOvgH60dtcH-Bqi-Dlg6kjJFEOFWWhaaSX12bDFTsQHLmm6BeD8U3rkdtekhF1P64c5AnE6blarf_VVQPuArf7kkdfdjkJDm3qelICs8F-LRj7Zq9VTeTXbk49cjAON2MEs5QPLmOGfwQPw","width":2048,"height":1365,"_relevance":1.1},{"ref":"places/ChIJERC0-YztNIgRaQpuyHiszD8/photos/AU_ZVEGbAnrkUgKAuXcKQrAimkiQA2v9G92s4ZpQLUL083VhlnabZ814ztVcNQt66uT1IkxpSRMbqtzvv5vOHtWLrsaUn-W_uT_IFrmNLyJFem5p5kK0yBUsTIdPBr4208xzbG6w7u5I7-syQrjcRBf7SjoooiUukU_SDwQW1ief ighly rated (4.8)","Open until 10:00 PM"],"_cons":["8 min away"],"_narrative":"Huge outdoor space with fire pits and pickleball at 8 minutes — Robbie would be all over that on a Saturday afternoon. Strong IPA reputation covers both Robbie and Jess. The catch: the permanent food truck is reportedly a grilled cheese operation, which is a non-starter for Carissa. She'd need to eat beforehand or confirm they've changed the truck. If the food works for everyone, this is the best hangout setup on the list — Jess can chill by a fire pit while Robbie plays pickleball.","_intentResults":[{"keywords":["outdoor","patio","outside","terrace","garden"],"intent":"outdoor","label":"Outdoor seating","field":"outdoor_seating","hit":true,"miss":false,"unknown":false},{"keywords":["beer","brew","tap","draft","ale","ipa"],"intent":"beer","label":"Beer","field":"serves_beer","hit":true,"miss":false,"unknown":false}]},{"name":"Hitchhiker Brewing - Brewery & Tap Room","address":"1500 S Canal St #2541, Sharpsburg","full_address":"1500 S Canal St #2541, Sharpsburg, PA 15215, USA","rating":4.8,"review_count":443,"price_level":null,"type":"Brewery","description":null,"open_now":true,"today_hours":"Saturday: 12:00 – 10:00 PM","outdoor_seating":true,"serves_beer":true,"serves_wine":null,"serves_cocktails":null,"serves_coffee":null,"dine_in":null,"live_music":null,"good_for_groups":null,"allows_dogs":null,"google_maps_url":"https://maps.google.com/?cid=12530839343072947897&g_mp=Cidnb29nbGUubWFwcy5wbGFjZXMudjEuUGxhY2VzLlNlYXJjaFRleHQQAhgEIAA","website":"http://www.hitchhiker.beer/","location":{"lat":40.496225900000006,"lng":-79.9262723},"reviews":[{"text":"Hitchhiker Brewing is an awesome brewery to grab a quick drink with friends or hang out for a while. They have plenty of beers on tap including very creative and flavorful sours. You can also eat something from the many food trucks that park out front!","rating":5,"time":"6 months ago"},{"text":"As someone who only drinks sours, Hitchhiker kills the sour/sour smoothie game. They always have super interesting combinations that even my non-sour friends enjoy. Plus the vibe of the brewery is awesome. It’s my fav one in the city!","rating":5,"time":"6 months ago"},{"text":"Just stopped for a few beers, glass that we did. Cool place, helpful staff. Lots of outdoor seating (but not much shade).\n\nMy wife and I enjoyed our IPA centric flight. Neighboring table even but us an orange forward beer when they learned we were from out of town. We love Pittsburgh!\n\nI will visit again when back in town for work.","rating":5,"time":"3 years ago"},{"text":"First off, DO NOT PARK IN THE EMPTY LOT NEXT DOOR. You can park literally any where else BUT there. There are signs everywhere posted up by the brewery to try and give you all the warnings\n\nNext, it’s so good to see that this old abandoned brewery is given new life as a new brewery. The menu is IPA heavy, but they had a few other options. I very much enjoyed all of their smoothies, and you can get any three drinks as a flight. Staff were helpful, friendly and funny\n\nThey have some bar snacks but to get a fuller meal, they have rotating food trucks on site.\n\nWith a chill patio and all around good vibes, it’s a great neighborhood hang. Keep doing good work!","rating":5,"time":"3 years ago"},{"text":"Rustic, spacious space. Not too warm despite no AC on a very hot August day. The beer list is huge (perhaps too big for a craft brewery) but everything we tried was fine. Beer ice cream is unique and surprisingly delicious.","rating":5,"time":"7 months ago"}],"photos":[{"ref":"places/ChIJtzmuxZjyNIgRuS5axf175q0/photos/AU_ZVEEVSjj2BSHgTYYgd5DFuxuX_QVWmKt6IUszDrYggMCNJQ3dCxIj98P1LLQ7nKb1uzRJ01gWIZEBDDpG9ErUN0zGEst6ZQsjkdhF70GMnSFASdfsdPmfNjvqYNruyyVE3nCD4dxBP1KkqonmuBabbfi3rjc6OUNlnUUA0WqmooSE_YM_4YLXeMCK1Tp4phOF2k-_W07Y2708r8VfQ0Gg_u5XW75EkZy0iV2uW9PmKYIoocY8xCz0mei5SAbcQEO4yqyN4bGnvLi7MVcyG2Haiaf2dRdlUDD24R_x_pEV5YR7rg","width":2048,"height":1468,"_relevance":1.1},{"re beer","label":"Beer","field":"serves_beer","hit":true,"miss":false,"unknown":false}]},{"name":"Two Frays Brewery","address":"5113 Penn Ave, Pittsburgh","full_address":"5113 Penn Ave, Pittsburgh, PA 15224, USA","rating":4.8,"review_count":185,"price_level":null,"type":"Brewery","description":null,"open_now":true,"today_hours":"Saturday: 1:00 – 10:00 PM","outdoor_seating":true,"serves_beer":true,"serves_wine":null,"serves_cocktails":null,"serves_coffee":null,"dine_in":null,"live_music":null,"good_for_groups":null,"allows_dogs":null,"google_maps_url":"https://maps.google.com/?cid=3153679065706062405&g_mp=Cidnb29nbGUubWFwcy5wbGFjZXMudjEuUGxhY2VzLlNlYXJjaFRleHQQAhgEIAA","website":"https://www.twofraysbrewery.com/","location":{"lat":40.465086199999995,"lng":-79.9422204},"reviews":[{"text":"Cute neighborhood craft brewery that fits perfectly in the Garfield neighborhood of Pittsburgh.\n\nThey had 11 beers on tap when we visited, as well as ciders, wines and other alcoholic and non-alcoholic beverages.  We tried the Better Together Kolsch Style Ale and the Everybody Should Be Nice to Everyone a pale malt and wheat then conditioned on watermelon and kiwi.  They have 2-3 sizes depending upon the beer's ABV.\n\nNo, they dont have food, but you are welcome to bring in food. I swear everyone had a pizza or snack from a nearby restaurant.\n\nThere is seating inside or on a really cool patio area.  Visit their website to view a ton of information about the beers, space, specials and philosophy.  Two Frays has created an inclusive space where good people can enjoy good beer and fellowship together.","rating":4,"time":"9 months ago"},{"text":"Great little neighborhood brewery with a friendly staff. Nice indoor space with an awesome outdoor patio. The variety of beers on this trip was super on point. They had something for everyone. Even if you're not a beer fan, they had something for you: wine, non alcoholic, and a mixed drink (even dog treats for your pup!). No food on location, but you can bring your own, and there's lots of good food around the area.","rating":5,"time":"3 years ago"},{"text":"I had one of their Kolsh beers and it was tasty! Very cool place and extremely inclusive as well. They have a decent size outdoor area where about half is covered with some heat lamps. They said they enclose the outdoor area with plastic to keep the heat in. So it seems they have some extra space for winter as well.","rating":5,"time":"5 months ago"},{"text":"Truly had the time of my life, the staff and even the head Brewer or respectful caring and passionate about what they do.\n\nTruly enjoyed the tour of the brewery.\n\nA really fun space to chill and be great outdoors as well.\n\nDid I mention they allow you to bring in your own food from the local restaurants.\n\nSpak Brothers Pizza is a few doors down and paired nicely with the beer menu here\n\nAmazing place would give 10 Stars if possible wouldn't change a thing.","rating":5,"time":"4 years ago"},{"text":"Two Frays is easily one of Pittsburgh’s standout breweries. The beer is top-notch—thoughtfully brewed with a variety of styles to explore. The atmosphere is relaxed and welcoming, making it a great spot to hang out with friends or wind down after a long day. The staff is friendly and knowledgeable about the beer they serve. If you're looking for a great local brewery experience in Pittsburgh, Two Frays should be on your list.","rating":5,"time":"9 months ago"}],"photos":[{"ref":"places/ChIJDcry0gzzNIgRReL-vmYexCs/photos/AU_ZVEHLCT2dHw6OqmBQUtMnWal5KoAs8jHd4KuFqNgR1WJidawlZjchF2NtLCP539qySQDUvOED1dZbYs-17kPiv8SeoqWiaYOkQfXsNf5QKw8GjgF_DJMXZMz0YlFIFuVfCnqoQhxtbzw2WmwUrGgCjPsRk9j-BiIlaZMiTCtPCyuhgkOkhh0cTDcORa-C2ubkaPNSJhG-nJUWOCJ8ULZOGSjBYvlFu4eX64EUnFythfIVsThN7sMR12foxo-GBkhOfTDfr8w0Uk38cw93yAN2LV13KanXKZcTyoNI1nQX4GFPDoqmWbbiJL5HvcWB6KjniReVROBfysipdJum2vtEuzdQoQXVbmOs7wnn3aNJXv2Fm8SJ5QeT-hhiSdcmo_tcoXWFY_F-xL1g33qIWdTKwJkVEPW9g3xBEEmmPyy1xFs8ag","width":4032,"height":3024,"_relevance":1},{" t 2 filled me up and took the 3rd to the hotel for a late night snack. Then pineapple coleslaw was a nice surprise. The tacos needed some spice so I asked for some Choulua hot sauce and it was complete! Loved this place!","rating":5,"time":"5 months ago"},{"text":"This is definitely your spot for game day adventures. Didn’t get to try any of the food but it was a standard bar menu. The beer options were expansive and they had drinks for everyone. Heated patio for winter games and open patio for summer time! This is a great place to stop for Steelers Sunday","rating":4,"time":"3 months ago"},{"text":"Stopped by today for the first time and sat at the bar.  Our bar tender, Nick was very attentive and provided us with some samples before we ordered our beer.  We ordered the smoky wings as an appetizer and they were the best wings I’ve had in years, better than any wings in Pennsylvania. The chicken meat was smoked to perfection and the BBQ sauce was on point.  Nick recommended the cheese steak sandwich which was amazing.  The meat was flavorful along with the cheese sauce and the bread had an amazing char flavor to it along with grill marks.  It was a decadent food experience which was made thanks to the suggestions made by our bar tender Nick.  The ambiance was great and we will definitely be back.","rating":5,"time":"5 months ago"},{"text":"Food was good. Interesting crowd…. Came on a Sunday and the Steelers have a home game on Monday… the $5 bites is confusing because we were told it wasn’t valid today….. it’s Sunday and there’s not a home game today…. And they were out of chips and chili.. overall would not come back…. Also 3 of the servers are sitting on their phones at a table behind us while our drinks are empty","rating":1,"time":"2 months ago"},{"text":"I was a first time guest. We were a little late for our reservation due to gps issues. We were greeted by a very friendly girl who took us to our seat. They were very busy so I would suggest a reservation. Our he Blue Sparrow Bus.","rating":5,"time":"6 months ago"},{"text":"Visited here to beat the frigid cold. Had a great afternoon drinking, playing games, and enjoying the food. Would highly recommend this place to anyone in the Pittsburgh area.","rating":5,"time":"2 months ago"},{"text":"This review is long overdue.\n\nThe atmosphere is super inviting.  Clean, plenty of space. Nice outdoor space too. The keep everything well maintained and the space is very thoughtful. Great merch.  They make it easily to bring food or utilize their food trucks.  Love that they have a little propagation station.  I do wish the acoustics were slightly better as it does very quickly get a bit too loud especially when the doors are down. I also wish there was slightly more seating and also a few extra tables that are a bit more accessibility/mobility friendly.\n\nI disagree with some of the other reviews on here and recommend giving it a shot vs going based on the reviews.\n\nI value my dog the most over everything and would it be nice to pop in quickly after a long walk, sure, but I’d never fault them for not being dog friendly. I’ve been at breweries where people bring unfriendly dogs, where dogs have knocked things over etc.  Dancing Gnome is also right by a busy street - not the most ideal place to bring a dog.  Their policy has always been clear - posted on their website and on signage out front.\n\nI’ve gone to Dancing Gnome many times with babies or toddlers.  I’ve never had a bad experience. They have a family bathroom with a changing table and staff has always been engaging with the kids. We have always respected that while they allow kids it is still a brewery and the focus is on adults so we make sure to bring something to entertain the kids and make sure they aren’t too loud to bother others. They make their policy about kids clear on their website as well.\n\nI’ve always had really good experiences with staff. They are open to explaining, giving recommendations, etc.  have always been greeted, quickly, and with a smile.\n\nI’ve never had a bad beer there though some might not be for me/my favorite. They are very IPA inspired.\n\nDancing Gnome is always very thoughtful with their charitable donations. They do A LOT in the community, often a lot that most people don’t know about as they aren’t over the top with communicating about it.  Just really strong community partners. Andrew is kind, not pretentious and cares about putting out great products.","rating":5,"time":"8 months ago"},{"text":"Comfortable ambience and music on a gorgeous fall afternoon.  We stopped in for the Fest/Märzen season beers and thoroughly enjoyed both! Our bartender was really friendly and struck up a conversation with us while we sipped our beers at the bar.  Grab a bite from Blue Sparrow while you session. Great experience all around!","rating":5,"time":"5 months ago"},{"text":"Every beer I tried was very well done. I do wish they had a little more variety on tap though. The service was excellent! I like the openness and size of the inside. I like the logo and brick exterior of the original building better though.","rating":4,"time":"a year ago"}],"photos":[{"ref":"places/ChIJTZexL5fyNIgR6UQC--ndyYw/photos/AU_ZVEHw01MNcWI2uL4i6oByRj0_myoKxYLmvTCf9EgUwxl8gM4ygwU9Cf2wCffzKmPtQPYngjsjVvQ8o0Oyymu_oiFLfeaVsgDvd-rWCvbe9K1TW14M__vvudhpOBgQAKDJ6IdcvxqKEjQIdWxfPsxyH4mS_qvgLTrtGqeWUzCimnB7CSZXJf8nJN1Trq5oFyzz0bfphhBzljlG7gBekQDHPdyx2B80q6gtBg2dsT5sUu28V5uDGrNEkd-n-PcVqupnhJALE7UYOUw_MtSvw2LwxEi2yEbbSVYRB1J2NICphTW0l-muyhpHxHjizvHuBH-Sbn9VaADpB3Ogq-Y1SXb8gdArcb4qkrwmugOHwpXVCqwpjijlKbXVqiv6wiX0za7sLAJ2eDsW0pD0WhYKn6zlLtus2hk1GQAHPdNrJLcpvtg","width":4032,"height":3024,"_relevance":1},{"ref":"places/ChIJTZexL5fyNIgR6UQC--ndyYw/photos/AU_ZVEHhRUDq9XEl2azU8RCv7RcAINZtqD8WMKM_eyGZtT3QGNyfkECJBFa7KQaqEs4-EegI7kIAgRT_5P1cU0jebiiPwD3o61ehqBvnh532UXaccDprYOV7SkvaQ4m8t43pKqekOr_gyCKtCGvI03qogBNBrZWzXT1XEMUyMW4q_Wfe49gdKmU-9lOgo9dn9JGIwGIS1GiC6gGz0xZ1MTRUvJekmIJpDPQYVhV2Y7u-9j-Q-h_A4 ","full_address":"3711 Charlotte St, Pittsburgh, PA 15201, USA","rating":4.6,"review_count":335,"price_level":null,"type":"Brewery","description":null,"open_now":true,"today_hours":"Saturday: 12:00 – 11:00 PM","outdoor_seating":true,"serves_beer":true,"serves_wine":null,"serves_cocktails":null,"serves_coffee":null,"dine_in":null,"live_music":null,"good_for_groups":null,"allows_dogs":null,"google_maps_url":"https://maps.google.com/?cid=7952894461633877623&g_mp=Cidnb29nbGUubWFwcy5wbGFjZXMudjEuUGxhY2VzLlNlYXJjaFRleHQQAhgEIAA","website":"http://www.11thhourbrews.com/","location":{"lat":40.467034999999996,"lng":-79.9654264},"reviews":[{"text":"Eleventh Hour is a hidden gem off the main drag of Lawrencville. They offer a nice selection of beers and a chill atmosphere. I first came here for one of their popular trivia nights and had a great time with friends. They always putting together fun activities!\n\nI researched dozens of places in Pittsburgh to host an event and decided to go with Eleventh Hour from my prior experiences. They have a nice large room off the main bar that has dozens of barrels and hanging lights. We brought in minimal decor and had an incredible atmosphere. Brian answered all the questions I had over several weeks and worked with me on some special requests to make the day perfect. A great place to grab or beer or host an event in Pittsburgh!","rating":5,"time":"9 months ago"},{"text":"Awesome spot not far from the strip district, yet far more quiet and featuring quite vast amount of space both indoors and outside.\n\nBrewery often has a food truck, but is walking distance from other food options if you want something from a different menu.\n\nBeers are great, and I would say rival and best some across the river from Dancing Gnome. I am a fan of a NEIPA and their options feature a greatly hazy and full of flavor profile.\n\nThis brewery also mails the classics such as their malty Maibock and refreshing Kölsch!\n\nI recommend the trip, great stuff!","rating":5,"time":"8 months ago"},{"text":"Halloween was my first time here and it was awesome. Loved everything, will definitely be returning!","rating":5,"time":"5 months ago"},{"text":"Nice outdoor area. Has a good bar vibe. We sat inside at the open window bar.  Hubby got their Kolsch.  We both liked its smooth taste.","rating":4,"time":"7 months ago"},{"text":"Excellent beer! Plenty of options, three tasters to try different styles. The rice lager was great and my aunt really enjoyed the west coast style IPA despite not normally liking hoppy beer. Cute outside patio, very shady.","rating":5,"time":"5 months ago"}],"photos":[{"ref":"places/ChIJpwwDZ7PzNIgRd9bbaWBbXm4/photos/AU_ZVEHGxVSx_rEteUlx8Xw536BW8DiGfe4b4pLmYEcJxMZgRPtfdCX_bewMlzOz4RLuC5hgeKADTkq4PNWLu_A1VrGnkWjVyjxxenKc1nUuyFTj6GFLWWib3PohmFqlpgYYbT3dArFAjqgb7zL1OaHoxZBDCX5t1L-x7Vj7vebqIyskka2LLFiklUMk5XHroiVVsZ_-WyVVzIY6ifJVXlMyJk4fljd9jcYsLoyH_K4qAYdd3fSj2y1ff-Ci4-vjutcLX4bFHzHPfaexDG_fTtXPSd-HZ9G6gLanFJFCh_KfUgRDX13Alv8vCJ6P6OpI_BQgdqA2ZrwFxsVXCOPyIYCxm_fXmX8KitK_iV0oteDumNLtXf2imX5g-nAwIp6dZNdW6Q1IJq5H5ue7rSBJH9nKVh_ij4sNM5TjuuU0ZDlTym_fkQ","width":4032,"height":3024,"_relevance":0.8},{"ref":"places/ChIJpwwDZ7PzNIgRd9bbaWBbXm4/photos/AU_ZVEGfNCsdwkGdAMGpmVpv_HldjIYR3Y-tjTCI8Y36gILSFQDWhTEjLXvF0MHFlas2NvYhAwF0BLkKlxlegXqsXuD2EvLU6VCWmBuTy_9oKtwjSBktlyjtEENJxhpmbPKkAbcdG3bWKM77HH_nUc8vrWuOkUrt9MFydW0o4t2EP_tG9efHeF0a1UU8CKulqGPMhP6rjHpRzArCAbSRu0c7pKxFOhECXtEAvyUKXQ77UL82Bs1NDBykUJpreBFPKuAu8WsSK6NrYgIaqf4YRJ4MzFyorO2ExnSkfpaIkHQLbXeV-M3otH-rrZof7Vw3V1p6tMALjk9ZpLvZqOjjZwpCcIPBNL29UrhRwl5kxbrG_ctbOgSQvkSsjQy6ttU6S2mNSgccV7RpyDpNEKiWYs-WNXf4PokOjxKg-zBYbIrdlARxMD--","width":4032,"height":3024,"_relevance":0.7},{"ref":"places/ChIJpwwDZ7PzNIgRd9bbaWBbXm4/photos/AU_ZVEEFkg3_U_AwKdCUu6-EklQhSngtm5rZ0osn2pCa2tnhgK8L4hY1QmWArfisoE14Fu9w3E82qZKz_SpdJTtOkLpmL_dgmIfgtsv06ndvtRcv1Kot2gNdSg3hL1cahqQhwy6lNhbVfRz-xLZ-aRJ4oa8ZD_y59_933PhUQ_rteJXoTB2-qETFFv-JsP9GwNCpVEHu6ah1_yr4lFdd1yU_7WSI41J-VU_BdYf2uI_Q8OjUmsC5_AXaew :"food","keyword":"eat","source":"review","review_rating":5},{"text":"A great place to grab or beer or host an event in Pittsburgh","category":"food","keyword":"eat","source":"review","review_rating":5},{"text":"Awesome spot not far from the strip district, yet far more quiet and featuring quite vast amount of space both indoors and outside","category":"outdoor","keyword":"outside","source":"review","review_rating":5}],"web_research":"Front patio with rotating food trucks. Full Moon IPA series.","_distKm":4,"_driveMin":6,"_overall":0.8484827879779727,"_matchType":"perfect","_matchLabel":"Exactly what you want","_pros":["6 min drive","Outdoor seating","Beer","Highly rated (4.6)","Open until 11:00 PM"],"_cons":[],"_narrative":"Six minutes with a front patio and rotating food trucks — the Full Moon IPA series is right up Robbie and Jess's alley. 'Rotating' means you should check their Instagram today to confirm a truck is actually parked. If there's one, this jumps to top-three territory: close, outdoor seating, food, and a chill vibe Jess would love. Beer-only though, so no whiskey for Robbie.","_intentResults":[{"keywords":["outdoor","patio","outside","terrace","garden"],"intent":"outdoor","label":"Outdoor seating","field":"outdoor_seating","hit":true,"miss":false,"unknown":false},{"keywords":["beer","brew","tap","draft","ale","ipa"],"intent":"beer","label":"Beer","field":"serves_beer","hit":true,"miss":false,"unknown":false}]},{"name":"BG Brewing (Brew Gentlemen)","address":"512 Braddock Ave, Braddock","full_address":"512 Braddock Ave, Braddock, PA 15104, USA","rating":4.7,"review_count":345,"price_level":null,"type":"Brewery","description":null,"open_now":false,"today_hours":"Saturday: 1:00 – 9:00 PM","outdoor_seating":true,"serves_beer":true,"serves_wine":null,"serves_cocktails":null,"serves_coffee":null,"dine_in":null,"live_music":null,"good_for_groups":null,"allows_dogs":null,"google_maps_url":"https://maps.google.com/?cid=10886228782670558869&g_mp=Cidnb29nbGUubWFwcy5wbGFjZXMudjEuUGxhY2VzLlNlYXJjaFRleHQQAhgEIAA","website":"http://www.brewgentlemen.com/","location":{"lat":40.404029699999995,"lng":-79.8701045},"reviews":[{"text":"Brew Gentleman has always been a solid spot. We hadn't made our way out there for a bit but decided to check it out again. We were pleasantly surprised to see they changed it around a bit from the previous layout, and they added some nice touches. They always have a nice line up of styles, and their flagship beer is on tap. There is a beer garden around the back of the building that is not connected that provides additional space when the weather is nice. Four packs available on site to go. No food on site, but there is a food truck sometimes.","rating":4,"time":"2 years ago"},{"text":"Brew Gentlemen. No flights, but you can do half pours of your choice or small samples. I selected the Monongaltor Doppelbock, which was excellent! Also had a taste of the Mr. Automatic Robust Porter, which was also quite good.","rating":5,"time":"a year ago"},{"text":"Tried a few beers and mostly they were unique in a good way. The guys were friendly and chatted briefly about the beers they have.\nCan recommend the mammoth double IPA, oatmeal stout and the wheat beer with chai spice.\nI personally was not a fan of the Imperial stout 9","rating":4,"time":"2 years ago"},{"text":"Here’s the thing- I want to rate this much higher because there is good beer, but the taproom itself just seems cramped and the space seems not well utilized. We ended up getting there are just a right time and sat at a 4 top with Two people- others were soon invited to sit with us, however there were people leaning against the wall. They open your tab at the front so you can close on your way out but it actually seems to make the experience with the bartenders less personable.","rating":3,"time":"4 years ago"},{"text":"Brew Gentlemen is like a home away from home. It's a smaller, more intimate brewery featuring a green and brown color scheme with brick, panelled walls, and green plants. It's kid and dog friendly, too, and they even have board games to enjoy while you sip on some brew.\n\nSpeaking of the beer, it is top- notch in quality and among all of the breweries I visited when I was in Pittsburgh supporting my beer blog, Great Beer Now, I rated the beer here the highest of all. General Braddock's IPA was my favorite with Atomic Goat Double IPA ranking a close second. Everything was very tasty and I can say with certainty that if I lived in the area, I would become a regular fixture here.\n\nBrew Gentlemen is a comfortable place for beer and a great place to kick back and chat with friends or even total strangers. It's one of Pittsburgh's finest, and a place every beer lover should visit.","rating":5,"time":"7 years ago"}],"photos":[{"ref":"places/ChIJcdfUP_fuNIgRlTa2bmanE5c/photos/AU_ZVEHrUuBFYw3WmRKdnFqAnaPLXORKHxrR4erjLb2NE-ttRl_02_0wG6FMW_TmDswQZb4y2CdQcN-dpS4FxYLLXtkINOMdEIlb9EnjhZLsxI4X7S6shlKoczX44iE_dA2sa6bL_wXEeDLCdEXcn5Xf1kijiVbpO1eL5rdlRX2o9Pvsm2epUiYC3VZNMaJC51JpJYqAeN7h6tgpgTmnvK9x91J4sjg8rzrd1VfQmrfVfxWA_W1N5yIaaHBmGCfRzK3uuU7zmWSGQQ2ZOFvsC4xUAtnhOAjXIOb46FgrVH1Ffu5qvg","width":3035,"height":1036,"_relevance":1.4000000000000001},{"ref":"places/ChIJcdfUP_fuNIgRlTa2bmanE5c/photos/AU_ZVEEloTshdCHT6lui6ZRXlCTn5REhfiMBcTpibv2HDzokf_r-BZFNPMTcnzc4k-zsRkDA8KJzOQkpjEfhNTPQLy6JiKNXMdJHdeIz3EWzZkDCOZWNWAeaFZF1poEhkv9th72kFuSMf-Zh-l6NPNDj1e1hv6mwmmEEy5Qmme_LW6FyQKCHzYJQcUytGbDjQgkt0P2rNSjGgWqO37pbiOqCowEPTO9ethZTcR5dNqLUF1UsCBQA23znjyDD7g7-kT6N-uD0MmLttyJYSBkVy5s-_ho9wcnOoX_KLbYY9iXJse4nsilnlyyx2Gp5-hMVDI2pAWcBODRrEXXzvm_SwC6ACSaQU5xqJbC5miGzKRQdxQcMI2gDmpJiAiCo-cRnc27hH_-xyxBQWnXuMy6vNSSkK1gMJJK9VCc1tPPoXc8cI7rVSCwq","width":4000,"height":3000,"_relevance":1},{"ref":"places/ChIJcdfUP_fuNIgRlTa2bmanE5c/photos/AU_ZVEG0vmzuhIFUnKz7R4uSMqkpNB3uRyNC3a-y_J0WMFQRPqFFcLIpJz7dyoi9Vvutx2u6H1P3tMytyZcF8_W2ChPjIwztBPfxFnPMsUpx8lhSJJjCuoVhJsEwrlcaJ7zEhH_WjAL_D1C0PtEsC1Fwelm1GpR4G0h5X9XcOg8D3EfcsRA44sP60l7qTYzW  additional space when the weather is nice","category":"outdoor","keyword":"beer garden","source":"review","review_rating":4},{"text":"No food on site, but there is a food truck sometimes","category":"food","keyword":"food","source":"review","review_rating":4},{"text":"Can recommend the mammoth double IPA, oatmeal stout and the wheat beer with chai spice","category":"food","keyword":"eat","source":"review","review_rating":4}],"_distKm":6.7,"_driveMin":10,"_overall":0.8409431849837742,"_matchType":"perfect","_matchLabel":"Exactly what you want","_pros":["Outdoor seating","Beer","Highly rated (4.7)"],"_cons":["10 min away","Currently closed"],"_narrative":"Braddock at 10 minutes with a 4.7 and cult-following status among Pittsburgh beer nerds — Robbie would respect the pilgrimage. Opens at 1 PM so timing works for a Saturday afternoon. No confirmed food details though, which is the recurring problem. The Braddock setting has a gritty-cool factor, but without food sorted out it's hard to recommend over closer spots that check more boxes today.","_intentResults":[{"keywords":["outdoor","patio","outside","terrace","garden"],"intent":"outdoor","label":"Outdoor seating","field":"outdoor_seating","hit":true,"miss":false,"unknown":false},{"keywords":["beer","brew","tap","draft","ale","ipa"],"intent":"beer","label":"Beer","field":"serves_beer","hit":true,"miss":false,"unknown":false}]},{"name":"Independent Brewing Company","address":"1704 Shady Ave, Pittsburgh","full_address":"1704 Shady Ave, Pittsburgh, PA 15217, USA","rating":4.5,"review_count":399,"price_level":"PRICE_LEVEL_MODERATE","type":"Bar","description":"Beers brewed in Western Pennsylvania & upscale American grub featured in a relaxed tavern.","open_now":true,"today_hours":"Saturday: 4:00 PM – 12:00 AM","outdoor_seating":true,"serves_beer":true,"serves_wine":true,"serves_cocktails":true,"serves_coffee":null,"dine_in":true,"live_music":false,"good_for_groups":true,"allows_dogs":null,"google_maps_url":"https://maps.google.com/?cid=1246206534552016495&g_mp=Cidnb29nbGUubWFwcy5wbGFjZXMudjEuUGxhY2VzLlNlYXJjaFRleHQQAhgEIAA","website":"http://www.independentpgh.com/","location":{"lat":40.4377098,"lng":-79.91950990000001},"reviews":[{"text":"It’s a cute little intimate bar. They have a good collection of beer from around the globe and also some cocktails. I particularly liked their cider and beer with raspberry in it. I forgot what the name was. The food was okay, but not particularly impressive. What stood for me was definitely the ambience, which was the perfect mix of cozy yet lively. The vibes were really good, and I really enjoyed my time. I can see myself coming back here.","rating":5,"time":"a year ago"},{"text":"Eclectic bar themed around \"gonzo journalism.\" Primarily beer and wine, with a few mixed drinks (which were quite good), but said beer and wine selections were interesting and far outside what you might normally find at a bar in this area, e.g. lambic beers and orange wine.","rating":4,"time":"a month ago"},{"text":"Underwhelmed and disappointing. We finally got to visit and really liked the vibe. It's a cute bar and small seating area. Ambiance is fun with lots of fun things on the wall. Once we sat down, the menu was overpriced and disappointing. We got the smash burger and po boy. Burger was good but really small for $15. Po boy was big but bread was not fresh and a bit stale at the ends. Salad with po boy was just sad. Not worth $16. Drink menu is online QRCode and was just not our taste. Wine list was not good. Cocktails are way over priced. Im sure they only use the best ingredients but not for me. The reason for 2 stars.. they include 20% gratitudity. If you are in Squirrel Hill and are going to charge such high prices.. your clientele will tip. We normally over tip but having it added was disappointing and we won't be going back. This place has such potential and wish this place the best.","rating":2,"time":"2 years ago"},{"text":"Great space and aesthetic bar, good beer & attentive service","rating":5,"time":"2 months ago"},{"text":"Take the required 20% tip off.  A required tip isn’t a tip - it’s the price.\n\nIn general - has an urban upper middle class feel w upscaled bar-leaning American food.  It’s nice quality.   The larger vibe is cozy and close and kinda works.\n\nThe servers and waitstaff were also kind, truly helpful, and accommodating.\n\nHowever, don’t force charge me 20% extra - and even further - only tell me when I get the bill\n\nThis company has a history of morally grey stuff like this.  Hidden Harbor next door - same company, same kitchen - used to give you a bill w auto 20% included, hiding that it’s added to the bill under three pieces of paper. You saw a bill w one total number, w no mention of tip. It still had an audacious line to ‘add your tip’!   More!   Server of course not mentioning anything.  I will never forget it.\n\nYou want to add a required cost?  Add it to the price, be honest about it.\n\nAt the end, I feel mixed, it’s a fine establishment on the surface level stuff, but at the end, I find myself avoiding places like this","rating":3,"time":"7 months ago"}],"photos":[{"ref":"places/ChIJu0zpBwDyNIgRb1a-kD1qSxE/photos/AU_ZVEHRNR4XMkb5TbYRJKXw-zYnN40lwCPpLRIgv0VzEgVwt3F4gOBuP03UUvbDfsZil6-sArjVkV_3VBlf92AAYQck8UtV66yxH3vkybVT8GxrB6hI09C41hGO29lsNfpZeNXICV_bh9c7-ijH677UJ7LVwJvm37DgNARQd5lL5YJAdRd-fTaRyP7nRTgiBhl8UqJq-iMjJxQeSXLNVpd1W0lLQQSLlZ_7rEyHbOWvlGnaKTGZTtc79qiaUWQQd4ldsPTxALa-RoxgLHz9TxxF5xBPGSIgltvzovOQLMZsNSaNO-d_aGRoybDhcTLn47hkfAwFvPayl8-86QvEaphXNMH-oxdpXTftMOL7Yg8WzBU56-sbPyd4UTgjwXT3ajlA3z-E8hC5Sr55zlTVOqqSeH0hp47gtWn4qa3YAPs7ImF-oBv4","width":3539,"height":2268,"_relevance":1},{"ref":"places/ChIJu0zpBwDyNIgRb1a-kD1qSxE/photos/AU_ZVEE8wQqq_Ht62O62pOXgzfnGM4CRy9q9It9nBH9cuk8LM7HvmqqlBvayiPbpgUWFFRvpOjGTulgqKdR_43CHOXxeNq_h7n9hYxGwx-r6KNZxXIbqapb8KRwyaYRkHqUVSD3k5uMiuCm8Jg2WkRgplpMaIhihghuSATygzlLggH39bYLTp5Y0LQcUKVS4Xewf7CUixKL_A025NO1tGquy0gJOmjClljardds29kCPKLy4QAwcNNcyMs r St, Pittsburgh","full_address":"5601 Butler St, Pittsburgh, PA 15201, USA","rating":4.6,"review_count":293,"price_level":null,"type":"Brewery","description":null,"open_now":true,"today_hours":"Saturday: 12:00 – 11:00 PM","outdoor_seating":true,"serves_beer":true,"serves_wine":null,"serves_cocktails":null,"serves_coffee":null,"dine_in":null,"live_music":null,"good_for_groups":null,"allows_dogs":null,"google_maps_url":"https://maps.google.com/?cid=15008126899042861328&g_mp=Cidnb29nbGUubWFwcy5wbGFjZXMudjEuUGxhY2VzLlNlYXJjaFRleHQQAhgEIAA","website":"http://hopfarmbrewingco.com/","location":{"lat":40.4845124,"lng":-79.9480268},"reviews":[{"text":"Beautiful area. absolutely love the lights and the live edge tables.\nthe 4 stars is because I really wanted to play darts but they have the old school dart boards. I cant drink some brews AND do math!\nThe pool tables were beautiful too. gorgeous old wood.\nThis place is a nice quiet vibe on a Thursday!","rating":4,"time":"4 weeks ago"},{"text":"Let me say that this brewery has a lot of IPAs: that is a positive for me. They let us taste around 5 different beers before we made a decision. We got a few beers and started with nachos. The nachos were good, a bit pricey, but good. We didn’t love the beer cheese so I wouldn’t start with this again. Their menu has a lot so no concerns.\n\nWe decided to get their Yinser Cheesesteak and I would get it again. It was big, the cheesesteak was very good (slightly on the sweet side). The only way to improve this meal is grill the bun but that is preference.\n\nWe got here and no one was here but by the time we left there was 20 or more. The bartender was great: super friendly and he was a great guide. The place was slightly loud in the main room but they have a lot of space to spread out; there are other areas you can go to for large groups or groups that want a quieter environment.\n\nThe key…I WILL BE HERE AGAIN.","rating":4,"time":"a month ago"},{"text":"Hop Farm is a great place to grab a beer. The tap list has enough variety for everyone to like something. They have many different places inside where you can sit and drink. I like the social hall on the right side of the building. It’s open, has TVs, lots of seating, and pool tables.","rating":5,"time":"5 months ago"},{"text":"Great service. The bartender was very friendly. The food was amazing. The buffalo mac and cheese was out of this world. The beer was amazing. We will definitely be back.","rating":5,"time":"10 months ago"},{"text":"Hop Farm has been one of my Favorite breweries for years, however I’ve never posted a review! Great service, beer and yummy burgers ! Plus the space is spacious with beautiful wood details!","rating":4,"time":"11 months ago"}],"photos":[{"ref":"places/ChIJo5vWsfbyNIgREEFv8eWTR9A/photos/AU_ZVEE7HgWCpcWhUgKxdTPDYHn_k-n2eTIXhlASvkrG40Tt_z51-3e-th4LujI8__aTKrwFzZjOVgBBJ7ruGjqHNbeYSc6A3PchMLy3_6JPZedFReQVKJk21L4dzxMNz6lJCwmdHXFnhEc81vZuUGF1wUJ8qByk9Tk8eFjhzKrwZAklZwjw0yIK0H9E5PW2pK5-YPtae6yijBjsL8Cl_bjQ9MNsVbI3mAK4-6RLVF_8TUHNZD81Ocnop9e_2hhjRznlw-4qZah9fs6rjP_XQ-hV8JOJ91YLTUIhs6qI6oDyYFlOTw","width":800,"height":800,"_relevance":0.9000000000000001},{"ref":"places/ChIJo5vWsfbyNIgREEFv8eWTR9A/photos/AU_ZVEE3ogjcvuwDgoWAPIr3J3eUNBHnCoDpOPWXQAuohSwhsjWlqYR3VdvW-2nnKOcOJ1a58U8grilDEIJQUASHga7yHdn-sWlqEPYfTsuSZ3Yc6rNQOW-dvIFTowLIAB0OJOFWL4NCKx3rfs44lXViQjersy1Pfa2fHHIPdZ7of5yPZ66WM1HnC4EjgmPl1kSXK_KWuv7lUlZmLsB0bmc5GQr4pq8pqo1Wug7QVJBWcjwszuawBuKtRAphsk-0UPlN0_DazfnswjbBrE3bwhxKpkOktaKa5p0sQofHJYzGtWmSRQ","width":800,"height":800,"_relevance":0.7},{"ref":"places/ChIJo5vWsfbyNIgREEFv8eWTR9A/photos/AU_ZVEFvEHo0pbSG593zoxdXCJbpQJmjs3IZ9TN3twS1fp7kA7GDSSP_m7lFv4k3gU_CFgbiDckuLXB36TJLmsLSfQauuQl87nbR88j8FG2KtAfwuJa5nCJcADonkAtffUjA1Gkizz0IEn3tcH6v1Sykub-cKU_ukLie4n2hOFeRpMuaqN5cLIDeTFkdETVUw2t6EIrKpXwqonhSLAjd2vTNCYNdceWYESgOqW2WYOI8e6VSW_3OFitYWUOc6yCuk7CPw_4dh90C9-dCDSv1HcncqLDMsk4mwOQuV0fRJ3t-zMwkpQ","width":800,"height":800,"_relevance":0.6000000000000001},{"ref":"places/Ch 013246,"_matchType":"perfect","_matchLabel":"Exactly what you want","_pros":["7 min drive","Outdoor seating","Beer","Highly rated (4.6)","Open until 11:00 PM"],"_cons":[],"_narrative":"Huge outdoor space in Lawrenceville at 7 minutes — they host food trucks, which gives Carissa flexibility to find cheese-free options from nearby spots. Jess would appreciate the relaxed outdoor hangout vibe. The food situation takes a little coordination since it's more bring-your-own from the neighborhood, but Lawrenceville is walkable enough that nobody goes hungry. Solid if the group doesn't mind a short walk for food.","_intentResults":[{"keywords":["outdoor","patio","outside","terrace","garden"],"intent":"outdoor","label":"Outdoor seating","field":"outdoor_seating","hit":true,"miss":false,"unknown":false},{"keywords":["beer","brew","tap","draft","ale","ipa"],"intent":"beer","label":"Beer","field":"serves_beer","hit":true,"miss":false,"unknown":false}]},{"name":"Trace Brewing","address":"4312 Main St, Pittsburgh","full_address":"4312 Main St, Pittsburgh, PA 15224, USA","rating":4.5,"review_count":395,"price_level":null,"type":"Brewery","description":null,"open_now":true,"today_hours":"Saturday: 8:00 AM – 11:00 PM","outdoor_seating":true,"serves_beer":true,"serves_wine":null,"serves_cocktails":null,"serves_coffee":null,"dine_in":null,"live_music":null,"good_for_groups":null,"allows_dogs":null,"google_maps_url":"https://maps.google.com/?cid=8719725429755085074&g_mp=Cidnb29nbGUubWFwcy5wbGFjZXMudjEuUGxhY2VzLlNlYXJjaFRleHQQAhgEIAA","website":"http://www.tracebloomfield.com/","location":{"lat":40.464085,"lng":-79.953357},"reviews":[{"text":"This is genuinely some of the best beer I've EVER had. Staff was amazing, atmosphere is incredible and the vibes are just right. Perfect place to hang out with friends, especially outside on the patio. I love how inclusive they are & the emphasis they put on their community :)","rating":5,"time":"3 months ago"},{"text":"I dig this place. There was a Kellerbier on tap, and although not my go-to style, this beer was excellent! I also enjoyed the sour and the Bourbon barrel aged imperial stout with vanilla. This weekend I was supporting queer, women and black owned breweries. Cheers! 🍻","rating":4,"time":"a year ago"},{"text":"Trace is a brewery that not only offers a fantastic product, but always a warm and welcoming experience. My husband and I live right outside of Philadelphia and ALWAYS make it a point to stop at Trace when we're back in the area visiting family. Em is an absolute gem who provided us with a 10/10 experience. Very knowledgeable & welcoming. We always look forward to our next trip back to Pitt to be able to bring some of Trace back home to share!","rating":5,"time":"a year ago"},{"text":"2nd year catering a Holiday Party here.  When I came in to clean up this morning, I was offered a cup of coffee, which I gladly accepted.   He asked what kind of coffee I liked, he asked a few questions about my preference and I went about finishing my cleanup. On in my way out we chatted a little bit about the different kinds of beers offered and he handed me a cup of the most delicious cup of mocha coffee I ever tasted in my life.  Thank you made Em, you truley made my day with that perfectly crafted cup of love.","rating":5,"time":"3 months ago"},{"text":"3.5/5\nService 3/5 tried to talk with staff felt like i was a burden and there was only one other patron there.\nDrinks 3.75/5 pretty good offerings above average.\nAtmosphere 4.5/5 cool building nice patio intimate fireplace. Warm and cozy feeling.\nWe parked on the street but might be tough if they get busy dunno if there's much available locally?\nOverall I'd go here again and recommend it if someone was in the area and looking to try something new. Don't know that I'll be going out of my way to return.","rating":3,"time":"3 years ago"}],"photos":[{"ref":"places/ChIJP8urYiDzNIgREgF-SxSwAnk/photos/AU_ZVEEI8wexduYUov6-JjVyYNFphRUXxZkg1kYArA5V3CyA_0i89Rtan 0674137480750155&g_mp=Cidnb29nbGUubWFwcy5wbGFjZXMudjEuUGxhY2VzLlNlYXJjaFRleHQQAhgEIAA","website":"http://velumfermentation.com/","location":{"lat":40.4265323,"lng":-79.9757429},"reviews":[{"text":"One of my favorite spots in the South Side! I've been to Velum as an event host, an event attendee, and a regular customer, and Velum has been awesome every time. The owners are so friendly and clearly care about being a space for community on top of making great drinks. It's spacious with tons of things to do, and their partner food truck, Cold Friends Kitchen, has some amazing grub. Definitely a Pittsburgh staple in my book!","rating":5,"time":"a month ago"},{"text":"We came for the mac mural and stayed for the vibes. It was so cool being able to walk through the property and view the equipment with a beer in hand. The beer was delicious and the arcade games were a riot. The mac art is most dope.","rating":5,"time":"6 months ago"},{"text":"This place is cool but every beer I've had has been lackluster and the pinball is set to tokens rather than quarters, so you end up with a bunch a useless tokens if you don't use them all after changing up a $20 bill.\n\nWill return to try more beers, but something is just off. Tough to describe.","rating":3,"time":"a month ago"},{"text":"Cool brewery down in Southside. We popped in here after brunch and were surprised about how big the space is inside. There is a small taproom area, an arcade, and two pickleball courts. I tried the Salty Tomato Club, which was their collab with 412 Food Rescue and it was 10/10. Even took a 4-pack home! Will definitely be back.","rating":4,"time":"6 months ago"},{"text":"Very cool and unique brewery located in a giant warehouse.  Beers are fantastic, but the atmosphere makes it so cool.  Has around 50 pinball machines that are well taken care of, some arcade games, a ping pong table, and several pickle ball courts!","rating":5,"time":"a year ago"}],"photos":[{"ref":"places/ChIJj5Oj5p_xNIgRS-ROL_A74jQ/p  on the side. I like the beer they have it was all crisp and refreshing. You can also get something to eat from the rotating food trucks that park out front.","rating":5,"time":"6 months ago"},{"text":"A wonderful brewery with some excellent selections.  They are very chill about bringing your own food so we love to grab takeout and come over here.  They definitely have the best outdoor seating in the area as well.  Dog friendly.","rating":5,"time":"2 months ago"},{"text":"Updated review: They now have a nice outdoor space, and the beer has continued to be solid. This is becoming a regular stop for us. Added a star and some more photos. Make sure to check this place out.\n\nOriginal review: I am happy to finally see CoStar in a brick and mortar place after having seen their beers in local establishments around the Burgh. The space is small but nice. It truly has that microbrewery feel since you're drinking next to the brewing equipment. They have some plans to make an outside space. This was a soft opening so not a lot of beers available but that cream ale is super solid. Looking forward to visiting again.","rating":5,"time":"a year ago"},{"text":"We hosted an adult's birthday party here and it couldn't have been better. I worked with Dominic on the party details and he was super accommodating and flexible. Very great experience! The taproom is super cool and a fun space. Our children were entertained by the games and outdoor space which made the day even better.\n\nI think the prices are very reasonable too.\n\nAll in all I highly highly recommend Costar for events or just hanging out and having a beer.","rating":5,"time":"4 months ago"}],"photos":[{"ref":"places/ChIJRRtbTGjzNIgRdyP81UAsXIc/photos/AU_ZVEHc2l4q6vv_TRQoXOkAQh80srvuCObw2boWWHJ_sWliFujHc1_hkh5Qpw6jzmTA9GrxsKPskkVkf5hZj5FY45heNdhJMnwy8jelQahKMIVWcU-1kzkNpIvWh5ORiL1MKSQqm1pRAVemyE-cm_h5BhzWIWZbmS89kyItB5hX3nrjIGNpx0mDngE1hYXpAjRgkbpoE9EsiskxeLNgJ7OoWYwI8vc4hElYu_H_z23uEGAH_ogwx_CwHYRNrMrXaAjn-th_XNdR5zov   wrap.addEventListener('touchstart', function(e) { startX = e.touches[0].clientX; });
  wrap.addEventListener('touchend', function(e) {
    var dx = e.changedTouches[0].clientX - startX;
    if (Math.abs(dx) > 50) lbNav(dx < 0 ? 1 : -1);
  });
  // Close on escape
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') lbNav(-1);
    if (e.key === 'ArrowRight') lbNav(1);
  });
})();

// === HELPERS ===
function esc(s) { if (!s) return ''; var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function scoreColor(s) { return 'hsl(' + (s * 120) + ',75%,42%)'; }
function haversine(a, b) {
  if (!a || !b) return Infinity;
  var R = 6371, dLat = (b.lat - a.lat) * Math.PI / 180, dLng = (b.lng - a.lng) * Math.PI / 180;
  var x = Math.pow(Math.sin(dLat/2),2) + Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.pow(Math.sin(dLng/2),2);
  return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
}

var selectedIndex = 0;
var map = null;
var markers = [];

// === RENDER CARDS ===
function render() {
  var content = document.getElementById('content');
  content.innerHTML = '';

  // Group by match type
  var groups = { perfect: [], likely: [], partial: [], alternative: [] };
  DATA.scored.forEach(function(p, i) { (groups[p._matchType] || groups.alternative).push({ p: p, i: i }); });

  var labels = {
    perfect: 'Exactly what you asked for',
    likely: 'Probably a good fit',
    partial: 'Partial match',
    alternative: 'Different vibe but interesting'
  };

  var order = ['perfect', 'likely', 'partial', 'alternative'];
  var globalRank = 0;

  order.forEach(function(type) {
    var items = groups[type];
    if (!items.length) return;

    var label = document.createElement('div');
    label.className = 'section-label';
    label.innerHTML = labels[type] + ' <span class="count">(' + items.length + ')</span>';
    content.appendChild(label);

    items.forEach(function(item) {
      globalRank++;
      var p = item.p;
      var i = item.i;
      var card = document.createElement('div');
      card.className = 'card' + (selectedIndex === i ? ' selected' : '');
      card.id = 'place-' + i;
      card.onclick = function() { selectPlace(i); };

      var distStr = '';
      if (p._distKm != null) {
        distStr = p._distKm < 1 ? Math.round(p._distKm * 1000) + 'm' : p._distKm + 'km';
      }

      var mapsUrl = p.google_maps_url || ('https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(p.name + ' ' + (p.address || '')));

      card.innerHTML =
        '<div class="card-top">' +
          '<div>' +
            '<div class="card-name">' + globalRank + '. ' + esc(p.name) + '</div>' +
            '<div class="card-meta">' +
              (p.rating ? '<span style="font-weight:600">\u2605 ' + p.rating + '</span><span class="dot">\u00b7</span>' : '') +
              (p.review_count ? '<span>' + p.review_count.toLocaleString() + '</span><span class="dot">\u00b7</span>' : '') +
              (distStr ? '<span>' + distStr + '</span><span class="dot">\u00b7</span>' : '') +
              (p.type ? '<span>' + esc(p.type) + '</span>' : '') +
              (p.open_now === true ? '<span class="dot">\u00b7</span><span class="open">Open</span>' : '') +
              (p.open_now === false ? '<span class="dot">\u00b7</span><span class="closed">Closed</span>' : '') +
            '</div>' +
          '</div>' +
          '<div class="card-score" style="background:' + scoreColor(p._overall) + '">' + Math.round(p._overall * 100) + '</div>' +
        '</div>' +
        '<div class="card-narrative">' + esc(p._narrative) + '</div>';

      // Photo strip
      if (p.photos && p.photos.length && DATA.apiKey) {
        var photoUrls = p.photos.map(function(ph) {
          return 'https://places.googleapis.com/v1/' + ph.ref + '/media?maxHeightPx=800&maxWidthPx=1200&key=' + DATA.apiKey;
        });
        var thumbs = photoUrls.slice(0, 4).map(function(url, pi) {
          return '<img src="' + url.replace('800','300').replace('1200','400') + '" loading="lazy" alt="" onclick="event.stopPropagation();openLightbox(' + JSON.stringify(photoUrls).replace(/"/g,'&quot;') + ',' + pi + ')">';
        }).join('');
        card.innerHTML += '<div class="photo-strip">' + thumbs + '</div>';
      }

      // Evidence excerpts from reviews
      if (p.evidence && p.evidence.length) {
        var evHtml = p.evidence.map(function(ev) {
          return '<div class="evidence-quote">"' + esc(ev.text) + '" <span class="ev-tag">' + ev.category + '</span></div>';
        }).join('');
        card.innerHTML += '<div class="evidence">' + evHtml + '</div>';
      }

      // Action links (website, social, food-specific)
      var links = [];
      if (p.website) links.push('<a class="action-link" href="' + esc(p.website) + '" target="_blank" onclick="event.stopPropagation()">Website \u2197</a>');
      if (p.social_links && p.social_links.instagram) links.push('<a class="action-link" href="' + esc(p.social_links.instagram) + '" target="_blank" onclick="event.stopPropagation()">Instagram \u2197</a>');
      if (p.social_links && p.social_links.facebook) links.push('<a class="action-link" href="' + esc(p.social_links.facebook) + '" target="_blank" onclick="event.stopPropagation()">Facebook \u2197</a>');
      links.push('<a class="action-link" href="' + esc(mapsUrl) + '" target="_blank" onclick="event.stopPropagation()">Maps \u2197</a>');

      card.innerHTML += '<div class="action-links">' + links.join('') + '</div>';
      card.innerHTML += '<div class="card-addr"><span>' + esc(p.address || '') + '</span></div>';

      content.appendChild(card);
    });
  });
}

function selectPlace(i) {
  selectedIndex = i;
  var p = DATA.scored[i];
  if (map && p.location) {
    map.panTo({ lat: p.location.lat, lng: p.location.lng });
    map.setZoom(15);
  }
  updateMarkers();
  render();
  var el = document.getElementById('place-' + i);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// === MAP ===
function initMap() {
  if (!DATA.apiKey || !DATA.locationBias) return;
  map = new google.maps.Map(document.getElementById('map'), {
    center: { lat: DATA.locationBias.lat, lng: DATA.locationBias.lng },
    zoom: 13, disableDefaultUI: true, zoomControl: true, gestureHandling: 'greedy'
  });
  var bounds = new google.maps.LatLngBounds();
  DATA.scored.forEach(function(p, i) {
    if (!p.location) return;
    var pos = { lat: p.location.lat, lng: p.location.lng };
    bounds.extend(pos);
    var marker = new google.maps.Marker({
      position: pos, map: map, title: p.name,
      icon: { path: google.maps.SymbolPath.CIRCLE, fillColor: scoreColor(p._overall), fillOpacity: 1, strokeColor: '#fff', strokeWeight: 2, scale: 10 },
      label: { text: String(i + 1), color: '#fff', fontSize: '11px', fontWeight: '700' },
      zIndex: Math.round(p._overall * 100)
    });
    marker.addListener('click', function() { selectPlace(i); });
    markers[i] = marker;
  });
  if (DATA.scored.length > 1) map.fitBounds(bounds, 40);
}

function updateMarkers() {
  markers.forEach(function(marker, i) {
    if (!marker) return;
    var p = DATA.scored[i];
    marker.setIcon({
      path: google.maps.SymbolPath.CIRCLE,
      fillColor: scoreColor(p._overall), fillOpacity: 1,
      strokeColor: selectedIndex === i ? '#1a3a5c' : '#fff',
      strokeWeight: selectedIndex === i ? 3 : 2,
      scale: selectedIndex === i ? 14 : 10
    });
    marker.setZIndex(selectedIndex === i ? 999 : Math.round(p._overall * 100));
  });
}

// === GO ===
try { render(); } catch(e) {
  document.getElementById('content').innerHTML = '<div style="padding:20px;color:red">' + e.message + '<br><pre>' + e.stack + '</pre></div>';
}
</script>
<script>
function onMapsLoaded() { try { initMap(); updateMarkers(); } catch(e) { console.error(e); } }
</script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDf_FPBjN8MJUFpKZyWx_c84foxR8Zl2KE&callback=onMapsLoaded" async defer></script>
</body>
