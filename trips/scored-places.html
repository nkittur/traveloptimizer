ging delicious beers.  Great place to stop for a relaxing and attentive time.","rating":5,"time":"2 months ago"},{"text":"Best brewery in the city of Pittsburgh best sours, and everything great atmosphere the fire Pitts and everything outside!\nI come here every weekend right now they have my favorite beer in Stock!!","rating":5,"time":"3 months ago"}],"photos":[{"ref":"places/ChIJxVy9G6nzNIgRLFFQap_SmqM/photos/AU_ZVEFTnPt0IWSSA33IL5_Qpr8N2PG2svTL6wkBIZKbCF2cK3n5TIZXjpFtH9mBGOKN7T7_MRrRQNM3DhjgLZQ0Wk64PBRpplTwzrt_ldgWKl8Dn-2a2OGgH-djLgt73T75CUYsNPmtm4gvx53p2EgYpeP46gTN4tWK2W0CzFrnaoCMxbigorAZiz6yh8P1RKYZSVd-iWSREQ9Qogr0bubmcYsbsrc01lOJ_zcnoSbimhbjcyL8G2doby57J7EQPzTy5gdoP0BMVnBGvmcrpvY9BvDVurLKM0aHdw7cjSx_TwQbyg","width":4159,"height":2773,"_relevance":2.3,"_visionScore":8},{"ref":"places/ChIJxVy9G6nzNIgRLFFQap_SmqM/photos/AU_ZVEE7Pd2bqvnHongPtPC6tdcRRQ69JeR0CFOjssx2AWI6GUdN0bEyRcd3XwC5z5KpKPGB2lgcbnQAuK5EXiK-NYXorcDnTBgW-u_u4rSeIzyNmfJpo3kRWDPEntbGB9WXKbaCB6RCIFmgrH8GnV8aIxb70KgcGmdF2gliKWNLcigs_PoZ4qKxIQ5uzrZ_QTkfBdT61nriOp-rNHzwLD_AaPbHShXftbrbzmFS35KW0qPwwKWbT0hPWr8MfmcCT94JmrXXrg8WS2yJNxhhUXlhs3GEpV9mlr0wZOT4omUSqstuft6WOoWmdin8C3Ihl8qkzUC_pp4De-LpS1pA7xKSm-h3978UzaiRNDbC9btecHxqVayoDwivRy8n4jEx5jZ2mXG0Xq5vx-egrbf-0P289wgKEvp37cUwzvcYRkEK5U9YibY","width":4032,"height":3024,"_relevance":2.2,"_visionScore":8},{"ref":"places/ChIJxVy9G6nzNIgRLFFQap_SmqM/photos/AU_ZVEHIKs3AKH5vgl_UsthS7COMRkdx8zB2k0DR07rattGnimx9mcvLJzTMFiyEqh95qACSOELDiLfMGVjvDOvuc-5-qVuDhxYmFtKmv0iefOsbY_ZMo9iWgN7gsgVgKJVYgdFIXQdSFbyWtwtFpRhTYzZ7DtAGcTB7ZPddh4u6F_9hEIX96r0G0Br-9z5Aww9NTbILOJYdk2Ovy_pGUiglw58hIInk6kRd4wStVs58QR4D5svGCEXN5h9btGprTqfBwXll7urOJlv-0FE_wi1gBq0QXziiry6APfrooo4gDFNADB7favfba0Db0aaxVyxC1SREeGGcTa7diy8VgNDJMgjgonhhyqJfjkCZxQvcQr7J4G0FsG8TQ7ZVn5yYEEfUUNIoIuwbvGylf3ORIR4LxReKBvZ0D1xzHY2O91SFZ5SsSyJr","width":4032,"height":3024,"_relevance":1.7,"_visionScore":6},{"ref":"places/ChIJxVy9G6nzNIgRLFFQap_SmqM/photos/AU_ZVEFf9olKdBOZCe0yTC5VnK5dUDqn934XVHnr0Hv0xPOmvZma-jNUi-7qb0iSGq _research":"Huge outdoor space with fire pits, live music, pickleball. Permanent on-site food truck.","_distKm":5.3,"_driveMin":8,"_overall":0.8994469477734073,"_matchType":"perfect","_matchLabel":"Exactly what you want","_pros":["Outdoor seating","Beer","Highly rated (4.8)","Open until 10:00 PM"],"_cons":["8 min away"],"_narrative":"Huge outdoor space with fire pits and pickleball at 8 minutes — Robbie would be all over that on a Saturday afternoon. Strong IPA reputation covers both Robbie and Jess. The catch: the permanent food truck is reportedly a grilled cheese operation, which is a non-starter for Carissa. If they've rotated the truck or added options, this becomes the best hangout setup on the list — Jess can chill by a fire pit while Robbie plays pickleball. Confirm the food situation before driving over.","_intentResults":[{"keywords":["outdoor","patio","outside","terrace","garden"],"intent":"outdoor","label":"Outdoor seating","field":"outdoor_seating","hit":true,"miss":false,"unknown":false},{"keywords":["beer","brew","tap","draft","ale","ipa"],"intent":"beer","label":"Beer","field":"serves_beer","hit":true,"miss":false,"unknown":false}]},{"name":"Two Frays Brewery","address":"5113 Penn Ave, Pittsburgh","full_address":"5113 Penn Ave, Pittsburgh, PA 15224, USA","rating":4.8,"review_count":185,"price_level":null,"type":"Brewery","description":null,"open_now":true,"today_hours":"Saturday: 1:00 – 10:00 PM","outdoor_seating":true,"serves_beer":true,"serves_wine":null,"serves_cocktails":null,"serves_coffee":null,"dine_in":null,"live_music":null,"good_for_groups":null,"allows_dogs":null,"google_maps_url":"https://maps.google.com/?cid=3153679065706062405&g_mp=Cidnb29nbGUubWFwcy5wbGFjZXMudjEuUGxhY2VzLlNlYXJjaFRleHQQAhgEIAA","website":"https://www.twofraysbrewery.com/","location":{"lat":40.465086199999995,"lng":-79.9422204},"reviews":[{"text":"Cute neighborhood craft brewery that fits perfectly in the Garfield neighborhood of Pittsburgh.\n\nThey had 11 beers on tap when we visited, as well as ciders, wines and other alcoholic and non-alcoholic beverages.  We tried the Better Together Kolsch Style Ale and the Everybody Should Be Nice to Everyone a pale malt and wheat then conditioned on watermelon and kiwi.  They have 2-3 sizes depending upon the beer's ABV.\n\nNo, they dont have food, but you are welcome to bring in food. I swear everyone had a pizza or snack from a nearby restaurant.\n\nThere is seating inside or on a really cool patio area.  Visit their website to view a ton of information about the beers, space, specials and philosophy.  Two Frays has created an inclusive space where good people can enjoy good beer and fellowship together.","rating":4,"time":"9 months ago"},{"text":"Great little neighborhood brewery with a friendly staff. Nice indoor space with an awesome outdoor patio. The variety of beers on this trip was super on point. They had something for everyone. Even if you're not a beer fan, they had something for you: wine, non alcoholic, and a mixed drink (even dog treats for your pup!). No food on location, but you can bring your own, and there's lots of good food around the area.","rating":5,"time":"3 years ago"},{"text":"I had one of their Kolsh beers and it was tasty! Very cool place and extremely inclusive as well. They have a decent size outdoor area where about half is covered with some heat lamps. They said they enclose the outdoor area with plastic to keep the heat in. So it seems they have some extra space for winter as well.","rating":5,"time":"5 months ago"},{"text":"Truly had the time of my life, the staff and even the head Brewer or respectful caring and passionate about what they do.\n\nTruly enjoyed the tour of the brewery.\n\nA really fun space to chill and be great outdoors as well.\n\nDid I mention they allow you to bring in your own food from the local restaurants.\n\nSpak Brothers Pizza is a few doors down and paired nicely with the beer menu here\n\nAmazing place would give 10 Stars if possible wouldn't change a thing.","rating":5,"time":"4 years ago"},{"text":"Two Frays is easily one of Pittsburgh’s standout breweries. The beer is top-notch—thoughtfully brewed with a variety of styles to explore. The atmosphere is relaxed and welcoming, making it a great spot to hang out with friends or wind down after a long day. The staff is friendly and knowledgeable about the beer they serve. If you're looking for a great local brewery experience in Pittsburgh, Two Frays should be on your list.","rating":5,"time":"9 months ago"}],"photos":[{"ref":"places/ChIJDcry0gzzNIgRReL-vmYexCs/photos/AU_ZVEFdd8hqAnpA6GHGAe6-FMLK0XTk1DP6tJJV3wA0siDbtyKIH0mu-cNwF3RQzbv_TgFtTwwW7uGckKZ_1vq95aV_YHLd7eW1D7b_chUGY2Qz183osSztGzZoxyzc_D7unxPKUiuXDpd2TJS1L4WOzgefDNf35q5VAN-zeB_JffjX5lqDfd60EULzzDRmjnxxs3t8KnCas_FxlKmK9cyTsKBFM-2IZ1ykP37KinMTBchOYnQjFaOrPyP-HGjhVVCi7LUj4QsLRNyEs1MvYkuKsckblHcdFLkXG6ubq3D27H6ZxUiDAtIRZAsLpAdpZJHonO4XCJwVg5nH_azGiyQ0cAlFoaacJYIJJ9N_aAUxyS47JSDtgXx4HNkJnMb8ENz4rhpO70kQG_iZcn8q_cWgGDlXtTh8XO7T9TuRAK42GkekbA","width":4032,"height":3024,"_relevance":1.9,"_visionScore":6},{"ref":"places/ChIJDcry0gzzNIgRReL-vmYexCs/photos/AU_ZVEHo9YY0wCJ3wAsO5KzbJvsOS4XAu_2xqyGLl7AsRKPC2xV6xUlXluacqywR9xZEMauLxg0cN2l3j1q3tc9bSU2IGaF0K7R6_gAVHETRAw4SxmpoEGwG02_TcrklTPmrbqt5XvsvFQLF8-WNW3UvEjBWIWRAJY7RSJnqDprhZuOFCyX2rECXSXCfpIAp81RXm0TgF55eIArwOR7MFIBVpL1WFuEb_voXqhKsE-PWsataj63ibW7GCy0LBm9WMB4p_M9-Ub-jCaONSZuiNaPxrzocHt_T89qX6ZUpl_Pbm30n8adZMppTsypaWuvOTIN-hoibMY0gZsgT0-qizRAhMBDLHapLU5hF8O47aQOLL_xcb4tXtJs4CJwL4TkoWyyWjBftGMkYtELm8gd_8WNsUKk4Gj3Z2H1L9km45ApKb2fGl9-y","width":600,"height":749,"_relevance":1.9,"_visionScore":8},{"ref":"places/ChIJDcry0gzzNIgRReL-vmYexCs/photos/AU_ZVEGcdPPMx2fhteN-GIkMya6Ds2kEmsvBFp1d5eMtC-7fP-eUG13fQdVrf_U_7DgUBgq1-LmsNEDI2Pzhp0cgB2Cathtz4dwESKcFoE4r_WNVC7v_u3BSCqed4ce9T4VyN-LddXvmYOa-WQtHxkCvMZ99vMeOHYxCRZzRCbetxHnwCbPmug7vdyjtuew4xFOv4LNTx8mPqqopKmUJF4Tk45oeEM7qTzE3tuJE31cPQ8bOG9_BoI4-E0m-faeXuHFukgp8bh9jTXc-midMB2CayM6L8f_Q9Zd3L_I6dFslvL1j door areas. Indoors you can find ample seating on two floors, a collection of board games, and a painting station to keep the kids occupied. Outdoors they have a fire pit and a complementary hot chocolate station on colder nights. This place is very dog friendly as well - they have dog treats available at the bar. In addition to their wonderful beers, they also have cocktails and cider on tap. Great place to hang out with friends or grab a drink before heading to dinner.","rating":5,"time":"a year ago"},{"text":"The best family owned brewery around. Great drinks and great people. Overall, just a happy and fun place to be. Kid and dog friendly. Always have the best food trucks and live music. Truly a very special community spot.","rating":5,"time":"5 months ago"}],"photos":[{"ref":"places/ChIJgyAXfvrzNIgRdZCMqq9sKFs/photos/AU_ZVEFBnJHXEo06bihAygQPTz0EfANiX6CYeMTkjlrQmSFJjmkmx5XNsqOOp9vUtsDgLd1oEN-2W_lw9MVdBofTYBKVmaWVXKE6HTCDdgYkhNfiYu1I7-Tkg4CCtrFEgxQSxHA7bS95N9SPySEQtpi59k-ax2CDkSjQ-fXfFVCLa7Jx0AK3rzhKBxOgsjT9m4omwT4pMjuCXtm9tR2rkIWZYjqQ2FtPnyzEMipdyCwacOjZC4hjTUudkiDHj5TL2O6dxy5CKP9tHNl8D8JhGz3z0UPToczooRYBBL6jBMDzJpWdgJLaCmEqmq8xeVKYDqF1WBZmKwuLX8pMkit6Sx6zI9rhTSyJxQwd0hShjgPNFi57Q0l8YxScUap1NmdLFPBuHO-eKrnMIAo3wHKPlUZsG9EvK68UGz0be09u_hBJnip0pIR1","width":4032,"height":2268,"_relevance":2.4,"_visionScore":8},{"ref":"places/ChIJgyAXfvrzNIgRdZCMqq9sKFs/photos/AU_ZVEHBMQ5braRfKLs7LF6BGxpcxOvHWMHAYjEnTNcZKlhPg8ktvVIYkfBuKvmi1pR6Q7jQaZ7BIxdFufQuCiZUeWQAgehd2aU7qRPRd2qNVLceAUeUhdQyVQEF7TcpfrcwEOv7u3oeuUWKVUDH5R2ionwDpbz9iMV7ZPlkbhH-ru71Hf65LQJE1Tex7nEdfuysopAaIZmaaCUlMKCK9j9iUXBtMn9wPKcEcleNAPOy1dMCzHULPck9_KTxkRb2GBcfU2bTPgFUppVHHHG0q1lfPMas6_IqeeQrbu4CUwmEox_qdg","width":1440,"height":1440,"_relevance":2.1,"_visionScore":8},{"ref":"places/ChIJgyAXfvrzNIgRdZCMqq9sKFs/photos/AU_ZVEGTtgIBA7NmiRZ3DTC__I33RiO7xGdqO5Ct9j9yRuVyItK_qXQZyHW2llI0pNxyVGO47-3z66MViCrvxh0IgRWSE7Fo-1A5Uv7Q3KpDqh_EqskBXeC0ZXVvHS7XjjIO7-KYeZapWNUpvxwSRnlVTfrOl4ZAJGyLK7IhRRNimAxhBAkWyEunKqDVAudDhEs6 ue,"today_hours":"Saturday: 12:00 PM – 12:00 AM","outdoor_seating":true,"serves_beer":true,"serves_wine":null,"serves_cocktails":null,"serves_coffee":null,"dine_in":null,"live_music":null,"good_for_groups":null,"allows_dogs":null,"google_maps_url":"https://maps.google.com/?cid=5905976098313518062&g_mp=Cidnb29nbGUubWFwcy5wbGFjZXMudjEuUGxhY2VzLlNlYXJjaFRleHQQAhgEIAA","website":"http://jackworth.co/","location":{"lat":40.45786100000001,"lng":-79.910142},"reviews":[{"text":"Jackworth Ginger Beer, PA’s only ginger beer brewery, crafts crisp, sharp, and boldly flavored ginger beer. We got a few mixed drinks including the classic Moscow mule. The inside is really cool and staff are great. Jackworth has a cozy atmosphere so you can hang out here and have drinks for hours.","rating":5,"time":"4 months ago"},{"text":"Come for the spicy ginger beer, or grab a beer and a fernet. The alcoholic ginger beer has a bit of a strange aftertaste, and the cocktails are just okay. The crew, though, is solid — friendly and down-to-earth.","rating":4,"time":"6 months ago"},{"text":"Jackworth Ginger Beer is a singular experience. This is not the flat, flavorless soda water others peddle as ginger beer. Jackworth Ginger Beer is spicy, tasty, and refreshing. It's a cut above, and deserves all the praise it gets. At the bar, they'll mix it up in cocktails (all good) or you can take it to-go in cans to impress your friends at your next cocktail party.","rating":5,"time":"5 months ago"},{"text":"Amazing. Simply amazing. I was a fan of ginger and a fan of alcohol. But this is not a mere mix of the two. The product is unique and peerless.\n\nThis establishment could easily be mistaken for a super chic, pretentious high artisan sign of gentrification, but no. There is an old-fashioned appeal, authentic yet forward-thinking and modern. Tyler, who was tending bar, explained that they use classical techniques in their process, maintaining an authentic approach. All done in house.\n\nThe drinks are exceptional. Nothing is as crisp and refreshing as that OG JGB. The ginger flavor is strong but perfectly balanced with the mild sweetness of the beverage. The 0 proof original seems markedly sweeter than the OG JGB, offering a distinct flavor profile. The spicy 0 proof is bomb, delivering a satisfying kick. I only wish I could enjoy a hot summer day with a spicy alcoholic JGB, but it doesn’t exist… yet.\n\nThe bar itself has an inviting vibe. It’s been the greatest bar/tavern/pub I’ve patronized in recent memory. The atmosphere is relaxed, with a genuine charm that sets it apart from other places.\n\nIf you couldn’t tell, I’m super impressed and generally am critical to a point of fault. However, I don’t have a bad thing to say at all. I will be back.","rating":5,"time":"a year ago"},{"text":"Jackworth is a great spot for the whole crew due it's selection of both alcoholic and NA options. Most offerings feature their ginger beer (which is amazing), but you can get some other really great drinks as well! It's a laid back spot with really cool, and very nice people working the bar!\n\nMy favorite is the spicy ginger beer, but drinker beware, it is in fact very spicy! It packs the most ginger spice that I've ever had and I love it!","rating":5,"time":"9 months ago"}],"photos":[{"ref":"places/ChIJoY7cUAbtNIgR7rvsX_g99lE/photos/AU_ZVEHAxy7AuAin0P82ypmUxn4J6aWMWRrZT0dOy-NcAocx5V9G3uJUYbcnXmqgthZMcolt_RhGAPF_9RYjvIrZHFUUiHkMtMZMvYNFHKvbCtsiZL9l_a2hRapxHd7qOAlPxoGDhKpsq5vw44p-lmFPaqnS9Uv_yELnoGPa8sOaz8q03EZKc4_SE9YOIkPCofgaVj_2jx7jN96jj5d3l2J4yZlSAY5uImxF2BgZb14wO-rC9j4q2nKdJMQOCoi_jsU1ensDQ2V_H651hr1qgCQpFW3rz0JZgPlO23VjTpNxmV-GkEWXhlZyzZ1PCephNvFI2eDpmxIICMd0OXQVsRTnA3rUVlbi-RrjTr4-b4dZ65DtmwsfeUdL6HvhozpfbNBKJ947GzDQE7TLDrzjvLaa_vKcu61Aivcp2vpbb7zwPUmofvs","width":2992,"height":2992,"_relevance":2.25,"_visionScore":9},{"ref":"places/ChIJoY7cUAbtNIgR7rvsX_g99lE/photos/AU_ZVEEG0n2g-6RunCKLPoTSHxLnMLCx8Ge3GgGoiIa4S9oQu0CiumX2ITzn2U1YJ9QkPo6NCqDGXzd4nXaKs9aUemVQnsz5YiY7YGu4nv3 r trivia nights and had a great time with friends","category":"food","keyword":"eat","source":"review","review_rating":5},{"text":"A great place to grab or beer or host an event in Pittsburgh","category":"food","keyword":"eat","source":"review","review_rating":5},{"text":"Awesome spot not far from the strip district, yet far more quiet and featuring quite vast amount of space both indoors and outside","category":"outdoor","keyword":"outside","source":"review","review_rating":5}],"web_research":"Front patio with rotating food trucks. Full Moon IPA series.","_distKm":4,"_driveMin":6,"_overall":0.8286905639465738,"_matchType":"perfect","_matchLabel":"Exactly what you want","_pros":["6 min drive","Outdoor seating","Beer","Highly rated (4.6)","Open until 11:00 PM"],"_cons":[],"_narrative":"Six minutes with a front patio and rotating food trucks — the Full Moon IPA series is right up Robbie and Jess's alley. 'Rotating' means you should check their Instagram today to confirm a truck is actually parked. If there's one with Carissa-friendly options, this jumps to top-three territory: close, outdoor seating, food, and a chill vibe Jess would love. Beer-only though, so no whiskey for Robbie.","_intentResults":[{"keywords":["outdoor","patio","outside","terrace","garden"],"intent":"outdoor","label":"Outdoor seating","field":"outdoor_seating","hit":true,"miss":false,"unknown":false},{"keywords":["beer","brew","tap","draft","ale","ipa"],"intent":"beer","label":"Beer","field":"serves_beer","hit":true,"miss":false,"unknown":false}]},{"name":"Southern Tier Brewery Pittsburgh","address":"316 North Shore Drive, Pittsburgh","full_address":"316 North Shore Drive, Pittsburgh, PA 15212, USA","rating":4.6,"review_count":2636,"price_level":"PRICE_LEVEL_MODERATE","type":"Restaurant","description":null,"open_now":true,"today_hours":"Saturday: 11:00 AM – 12:00 AM","outdoor_seating":true,"serves_beer":true,"serves_wine":true,"serves_cocktails":true,"serves_coffee":true,"dine_in":true,"live_music":true,"good_for_groups":true,"allows_dogs":null,"google_maps_url":"https://maps.google.com/?cid=7994939358014206331&g_mp=Cidnb29nbGUubWFwcy5wbGFjZXMudjEuUGxhY2VzLlNlYXJjaFRleHQQAhgEIAA","website":"https://pittsburgh.stbcbeer.com/","location":{"lat":40.4462007,"lng":-80.01032219999999},"reviews":[{"text":"Great craft beer bar/brewery in a nice busy area with lots to do in the Northshore area of Pittsburgh. Beers were excellent and it was such a nice clean establishment. Bartenders were excellent and were happy to give out samples. Strawberry letter was a surprise! Sour and sweet. Order the Island fish tacos! Also excellent 2 filled me up and took the 3rd to the hotel for a late night snack. Then pineapple coleslaw was a nice surprise. The tacos needed some spice so I asked for some Choulua hot sauce and it was complete! Loved this place!","rating":5,"time":"5 months ago"},{"text":"This is definitely your spot for game day adventures. Didn’t get to try any of the food but it was a standard bar menu. The beer options were expansive and they had drinks for everyone. Heated patio for winter games and open patio for summer time! This is a great place to stop for Steelers Sunday","rating":4,"time":"3 months ago"},{"text":"Stopped by today for the first time and sat at the bar.  Our bar tender, Nick was very attentive and provided us with some samples before we ordered our beer.  We ordered the smoky wings as an appetizer and they were the best wings I’ve had in years, better than any wings in Pennsylvania. The chicken meat was smoked to perfection and the BBQ sauce was on point.  Nick recommended the cheese steak sandwich which was amazing.  The meat was flavorful along with the cheese sauce and the bread had an amazing char flavor to it along with grill marks.  It was a decadent food experience which was made thanks to the suggestions made by our bar tender Nick.  The ambiance was great and we will definitely be back.","rating":5,"time":"5 months ago"},{"text":"Food was 5856153&g_mp=Cidnb29nbGUubWFwcy5wbGFjZXMudjEuUGxhY2VzLlNlYXJjaFRleHQQAhgEIAA","website":"http://www.hofbrauhauspittsburgh.com/","location":{"lat":40.4288248,"lng":-79.9647919},"reviews":[{"text":"We went there on Saturday afternoon for the crispy pork knuckles( I don’t remember what’s called but they’re going so fast) and Hefe Weizen Mango flavor. We also had pretzel as an appetizer and everything was good 😊","rating":5,"time":"a month ago"},{"text":"Fun atmosphere and place to have drinks and have food with friends and family. They had live music when which was cool! The potato pancakes were very very deep fried were not the best but the pierogies were pretty good. The fried onions were different not bad but probably would ask for them without the onions. Also the service was good.","rating":4,"time":"a month ago"},{"text":"Southworks side neighborhood is great area to stay when in Pittsburgh. We went in Hofbrauhaus for drinks, place was quite and performer playing for diners. We dined on the patio , enjoyed bier, wine, and small bites. By the time we made our way out, place was packed and great vibes with live music and songs. Great flavors of bier and wines were good too. View of the Monongahela river was icing on the top!! Place has all the fun vibes, come and enjoy regardless of group size. They even have a separate area for special events.","rating":5,"time":"5 months ago"},{"text":"I have been here before for regular dinner service and the food is always really tasty. Most recently I was here for an event, the food was supposed to be appetizers but it was more than plenty and tons of variety, plus dessert. I had a cocktail recommended by one of the servers and it was delicious. I know they have a great selection of beer too but I don't drink beer too often. The service is always great.","rating":5,"time":"4 months ago"},{"text":"A nice German-style tavern. Lot's of room even for larger parties. The beer was good, but the food could have been better. The quali le costumed-servers-German-theme thing is more novelty than hidden gem. Carissa could find cheese-free options in the meat-heavy menu. Robbie gets whiskey, Jess gets wine. It works logistically but lacks the chill local-brewery character Jess and Robbie would prefer.","_intentResults":[{"keywords":["outdoor","patio","outside","terrace","garden"],"intent":"outdoor","label":"Outdoor seating","field":"outdoor_seating","hit":true,"miss":false,"unknown":false},{"keywords":["beer","brew","tap","draft","ale","ipa"],"intent":"beer","label":"Beer","field":"serves_beer","hit":true,"miss":false,"unknown":false}]},{"name":"Independent Brewing Company","address":"1704 Shady Ave, Pittsburgh","full_address":"1704 Shady Ave, Pittsburgh, PA 15217, USA","rating":4.5,"review_count":399,"price_level":"PRICE_LEVEL_MODERATE","type":"Bar","description":"Beers brewed in Western Pennsylvania & upscale American grub featured in a relaxed tavern.","open_now":true,"today_hours":"Saturday: 4:00 PM – 12:00 AM","outdoor_seating":true,"serves_beer":true,"serves_wine":true,"serves_cocktails":true,"serves_coffee":null,"dine_in":true,"live_music":false,"good_for_groups":true,"allows_dogs":null,"google_maps_url":"https://maps.google.com/?cid=1246206534552016495&g_mp=Cidnb29nbGUubWFwcy5wbGFjZXMudjEuUGxhY2VzLlNlYXJjaFRleHQQAhgEIAA","website":"http://www.independentpgh.com/","location":{"lat":40.4377098,"lng":-79.91950990000001},"reviews":[{"text":"It’s a cute little intimate bar. They have a good collection of beer from around the globe and also some cocktails. I particularly liked their cider and beer with raspberry in it. I forgot what the name was. The food was okay, but not particularly impressive. What stood for me was definitely the ambience, which was the perfect mix of cozy yet lively. The vibes were really good, and I really enjoyed my time. I can see myself coming back here.","rating":5,"time":"a year ago"},{"text":"Eclectic bar themed around \"gonzo journalism.\" Primarily beer and wine, with a few mixed drinks (which were quite good), but said beer and wine selections were interesting and far outside what you might normally find at a bar in this area, e.g. lambic beers and orange wine.","rating":4,"time":"a month ago"},{"text":"Underwhelmed and disappointing. We finally got to visit and really liked the vibe. It's a cute bar and small seating area. Ambiance is fun with lots of fun things on the wall. Once we sat down, the menu was overpriced and disappointing. We got the smash burger and po boy. Burger was good but really small for $15. Po boy was big but bread was not fresh and a bit stale at the ends. Salad with po boy was just sad. Not worth $16. Drink menu is online QRCode and was just not our taste. Wine list was not good. Cocktails are way over priced. Im sure they only use the best ingredients but not for me. The reason for 2 stars.. they include 20% gratitudity. If you are in Squirrel Hill and are going to charge such high prices.. your clientele will tip. We normally over tip but having it added was disappointing and we won't be going back. This place has such potential and wish this place the best.","rating":2,"time":"2 years ago"},{"text":"Great space and aesthetic bar, good beer & attentive service","rating":5,"time":"2 months ago"},{"text":"Take the required 20% tip off.  A required tip isn’t a tip - it’s the price.\n\nIn general - has an urban upper middle class feel w upscaled bar-leaning American food.  It’s nice quality.   The larger vibe is cozy and close and kinda works.\n\nThe servers and waitstaff were also kind, truly helpful, and accommodating.\n\nHowever, don’t force charge me 20% extra - and even further - only tell me when I get the bill\n\nThis company has a history of morally grey stuff like this.  Hidden Harbor next door - same company, same kitchen - used to give you a bill w auto 20% included, hiding that it’s added to the bill under three pieces of paper. You saw a bill w one total number, w no mention of tip. It still had an audacious line to ‘add your tip’!   More!   Server of course not mentioning anything.  I will never forget it.\n\nYou want to add a required cost?  Add it to the price, be honest about it.\n\nAt the end, I feel mixed, it’s a fine establishment on the surface level stuff, but at the end, I find myself avoiding places like this","rating":3,"time":"7 months ago"}],"photos":[{"ref":"places/ChIJu0zpBwDyNIgRb1a-kD1qSxE/photos/AU_ZVEENY_pFCmoODOxn5KSAl4SqXiISRyk8504QBUoGl-cN-96yvzqnDEUusiP6PtSaSVM2fNdbf0A7rYgIbUmvuzTHBOC3cIQ91Z0Ry70rseVF8GVm4PirfzJgTbIA8J5WU4BrzAQ8xfPpS94L4ioiYVrz1YaTXMVAUGRmXBKZ2Jzec5FP4Fa7yMHFPVSVQVVoibf0rUCKHj5kVhWD8YzHfDer367-XSjDn66cRowQ58MZBJbyGVrJbakTJxHTyY1CmWZ2DJIbBePrMzJD2oih4rYmrGX3rcFsQpxAwlQbU-jXkmE56znjp5flmMm4IxQ2iMQaxdU9fZtL4DipbCQpPpPqAEFIsZMujEZaIMVALcPEWkzs8t2Vr-CGfwZ8H0YmdT3BPKf05m9MD6gUJm-P4VaNU_0jTiIBJUXy5fPbBEbbtA","width":3272,"height":1742,"_relevance":1.95,"_visionScore":7},{"ref":"places/ChIJu0zpBwDyNIgRb1a-kD1qSxE/photos/AU_ZVEGUsaVEqyRUYz4GkX-G4RTw3nPT_BKQppvY3jiYrvT_HLukLblsIgJvwlHgeurRAsADPbdG9-Z3mKoTA9OaEYqCtUnFJ4XiznFd_k99IQFxMRDrPUsH-kEKfBMHfmtmpxOoBs5plmfWh74unBN401e48aZVVZ14Kih4-kQPixsZbS9rl-PqVF_f_8KYLw4i618APLbOHtvZLd4RryxcUwlB2KC3MYPf_nCgvBVsFpA0ZKCyHtC_PGjpxRgLsO278x2ZhlIFYsYXk1kLK1yFyHrP00jW7Zqtbi82Arpdj44qss-wujUx2i4jN7ZUQuBUPSyPzjrrMrCxF28xQVuqhprG_O-BV67NOZ08at5GbLbTP0SNHQ1l4un975qIozD-ejtfy9jvE4sBsRtLZJyr7CbyH3vRFYPyCDPKmentSdN8HjQt","width":3539,"height":2268,"_relevance":1.9,"_visionScore":6},{"ref":"places/ChIJu0zpBwDyNIgRb1a-kD1qSxE/photos/AU_ZVEGdQaT8mhoQikS02b1sdZGuE7XpZYyh-nKntQiAFZo7MdjKg3WJfadTdXR5iSDnS83pBe1FKMYrXECmwV_Kclsy2YRgCtLwpTVNvjGnZ-6lRhuMikT3yOmndtJvQZe9DKC5FLjwEpHjCgUcZSs38XlXqE-6b4nmrVWGdxArORhY-fKPSEXUs44oZG5yXDADPBHcpZXLbWNtB6WDvAOE81_CqqzrOHew86Hf7Jslw-c8ZSp1O4w9Y_pWYPYxASU9X_CrN8R-Ug1zszWpPH7vT5ys688gkbJ1JykqzhonWBE5agpt_r7vLpJ9WU3M8ddD3awuQiUxYWsgiAasmHuFBJ99h8g0_1EeoJJy0POH8UZLN0prjf3ZlwJKkrJuVDEDj5PwdusSbITvW8w7NFdKiCh3ElBiBUsBA7IhzImoTLjNJWgaaD9kCjJK1-3JCsEm","width":3024,"hei bes are just right. Perfect place to hang out with friends, especially outside on the patio. I love how inclusive they are & the emphasis they put on their community :)","rating":5,"time":"3 months ago"},{"text":"I dig this place. There was a Kellerbier on tap, and although not my go-to style, this beer was excellent! I also enjoyed the sour and the Bourbon barrel aged imperial stout with vanilla. This weekend I was supporting queer, women and black owned breweries. Cheers! 🍻","rating":4,"time":"a year ago"},{"text":"Trace is a brewery that not only offers a fantastic product, but always a warm and welcoming experience. My husband and I live right outside of Philadelphia and ALWAYS make it a point to stop at Trace when we're back in the area visiting family. Em is an absolute gem who provided us with a 10/10 experience. Very knowledgeable & welcoming. We always look forward to our next trip back to Pitt to be able to bring some of Trace back home to share!","rating":5,"time":"a year ago"},{"text":"2nd year catering a Holiday Party here.  When I came in to clean up this morning, I was offered a cup of coffee, which I gladly accepted.   He asked what kind of coffee I liked, he asked a few questions about my preference and I went about finishing my cleanup. On in my way out we chatted a little bit about the different kinds of beers offered and he handed me a cup of the most delicious cup of mocha coffee I ever tasted in my life.  Thank you made Em, you truley made my day with that perfectly crafted cup of love.","rating":5,"time":"3 months ago"},{"text":"3.5/5\nService 3/5 tried to talk with staff felt like i was a burden and there was only one other patron there.\nDrinks 3.75/5 pretty good offerings above average.\nAtmosphere 4.5/5 cool building nice patio intimate fireplace. Warm and cozy feeling.\nWe parked on the street but might be tough if they get busy dunno if there's much available locally?\nOverall I'd go here again and recommend it if someone was in the area and looking to try something new. Don't know that I'll be going out of my way to return.","rating":3,"time":"3 years ago"}],"photos":[{"ref":"places/ChIJP8urYiDzNIgREgF-SxSwAnk/photos/AU_ZVEG1tYiylDVmSzlqGSGF2yVqHgLPwKEaxc0mqfY2jlaajBI5HzeZD6KegimSdg2_Nre0-VA_jkXajkS8q_P2CD7QNAyXgNAG3O41GMwj_fnJPvmtzjBztPIzTWfreqMBuzXmIi46OaU5H8bW26OgDCao-0EWEGpbw0a99fpXf_-G9aVK8MQSDhL0wHS1cyHUyO6cXjSp5kH9Dk3palFm85moQrCmHu2TTM0slQW-y9Rj5QdaZMW_LZtfmzHCV8UBwRwM7AQy3iUH7rzNtfRy4goKZL-ONti9yt4MAywdYXnKCg","width":2000,"height":1333,"_relevance":2,"_visionScore":6},{"ref":"places/ChIJP8urYiDzNIgREgF-SxSwAnk/photos/AU_ZVEHalwYqn-sogHSZHlZQYWKGb15hvs_YSUjmd-Ch-OdcyKoCej2UTlH4P_L4XaBYcZTNhCdakjMBqu-LYCZHYolUjDBtjjWf6nOyWViayY13ZnqgRqmm1N_I9TxFLP6Ydvz4QkomChPOSlJ-Ld2cjk9aRNW8-hKzIv4loWDmTXj0Z5kxsHQEfytNjF6zJ3P3lXAD5q5pAZaFEgAuScJMoxOf8o2on53fLfkoZBev7Kqg5450AyVUMJaQxpMZgyLFmSZv-ukvHAbdrpsPQjCMpJDMoizqavHQGF4MolmeQgXOdK-zB6jGvN1ShpBs8ytmiHDPtC-opuGG6HP5vKuzZhrXfQJ-XskWG4WLGIXNhIwdUgLx7ymjQFKzcyQij-iTVVLeJUySYcZ2q6Tfm34AGIbK8IamRStigfgY4xPU4_HxMb69","width":4032,"height":3024,"_relevance":2,"_visionScore":8},{"ref":"places/ChIJP8urYiDzNIgREgF-SxSwAnk/photos/AU_ZVEHoI_fycciVNGF-esOKpe9fZxJ-NTsoImVYUpS1_aFA5c-Z3oWZaTAfplVdaGqjdIVrEsAS3lvVV8GMMpgDnQnEUHVyDrkW2mOETGvpnVR4-ehY335VV9w7jzwB10XT2t3I1DU_BcNoyNgDGs2hp5PFJtXAPTbYTiUGiOuOXFDq0JY6f2ZY7a_fs4r_DCpsd6ES7Ox8k-pkDC4uHG4uI6OJxv8WsBdPmKqMpQv1_aLVpcSB5DT7jHDmnDgXtLF9uJM4u3QVvg0_xtOn-YTC8YQO5h9EpSXI4Xg7I2GWopPLiXTdJukWEoP70Ux5LQzrK2ADt2mUlDfplPvrmZyPwofgn_8AsAKFDc7qaQfxQVeffMPO-7MUSmKuF3EkBxGF6gczyS5BdLOVKl_B9tsGZYrQDrHulFi6HXcnmFO-TD2AxtKb","width":3769,"height":4711,"_relevance":1.7,"_visionScore":6},{"ref":"places/ChIJP8urYiDzNIgREgF-SxSwAnk/photos/AU_ZVEEGHQ2pXM5ntc8GlniAUT6fhlgDt-iMKLSyhW4R_rXP6in9K1yjMO2BwpOoF_WvmqZsvSovCxdPp3uk6azJr1lG9eLYGxxhsrmtKx3t_3hOX718cMPvqfruTtbHjzZzBpY8aM6U4ccs0VeoKD0wTM5IbfmiM0OPZgOrHa8Fk4_uIq_KwMQfxhlH4N0lFFSDrM123q8z5lMdVRB006YfwCyg0CcNU0JHGv9GYaSHKGvd4eogjbT_25cz29DXq9RGC5Y9TiKHLCjdvG7GypmCk24QAE2HkrRuZdhSPDF rrative":"Bloomfield beer garden at 5 minutes with a food truck that's reportedly always parked outside — 'always' is the key word since most places rotate and you won't get burned showing up to nothing. Low-key neighborhood-hangout feel Jess would gravitate toward. Not the flashiest pick but possibly the most reliable for guaranteed outdoor seating plus food plus chill vibes for all four of you. Strong contender for zero-guesswork Saturday plans.","_intentResults":[{"keywords":["outdoor","patio","outside","terrace","garden"],"intent":"outdoor","label":"Outdoor seating","field":"outdoor_seating","hit":true,"miss":false,"unknown":false},{"keywords":["beer","brew","tap","draft","ale","ipa"],"intent":"beer","label":"Beer","field":"serves_beer","hit":true,"miss":false,"unknown":false}]},{"name":"The Church Brew Works","address":"3525 Liberty Ave, Pittsburgh","full_address":"3525 Liberty Ave, Pittsburgh, PA 15201, USA","rating":4.3,"review_count":5602,"price_level":"PRICE_LEVEL_MODERATE","type":"Restaurant","description":"Former church is now a lofty space for house-brewed beers, plus a mix of pizza, pierogi & bratwurst.","open_now":true,"today_hours":"Saturday: 11:45 AM – 11:00 PM","outdoor_seating":true,"serves_beer":true,"serves_wine":true,"serves_cocktails":true,"serves_coffee":true,"dine_in":true,"live_music":false,"good_for_groups":true,"allows_dogs":false,"google_maps_url":"https://maps.google.com/?cid=6628096134965951551&g_mp=Cidnb29nbGUubWFwcy5wbGFjZXMudjEuUGxhY2VzLlNlYXJjaFRleHQQAhgEIAA","website":"http://www.churchbrew.com/","location":{"lat":40.4619861,"lng":-79.9640806},"reviews":[{"text":"I've been here twice now, and I'll summarize by saying great atmosphere, great food, poor service.\n\nThe atmosphere is to die for, pictures don't do it justice. The warm lighting and music choices add to it as well. The food is fantastic, everything from perogies to French onion soup are great. But both times I went, the service was as if I was a problem for showing up. Wait times were slow, and waitstaff inattentive and disinterested in my asks. If they're overworked, I get it. Otherwise, the service level is getting in the way of the otherwise amazing experience.","rating":3,"time":"3 months ago"},{"text":"Came here for dinner with the family. Everyone enjoyed their meals and the portions are large. The wings had a maple mustard sauce, different but really good. Peirogis were fantastic. I enjoyed the Kobe beef cheesesteak. It was decent, but being from Philly, I am hard judge on cheesesteaks.","rating":4,"time":"a month ago"},{"text":"Had a great experience at The Church Brew Works. The food was excellent — fresh, flavorful, and came out hot. The beer was great as well, lots of good options and everything I tried was solid.\n\nOur server Mecca was polite, kind, and very attentive the entire time, which made the experience even better. Great service, thanks Mecca!!\n\nThe interior was clean and well-kept, including the tables and dining area. Even the bathroom was spotless, which says a lot about how well the place is taken care of. This place has huge potential as a brewery and I cannot wait to stop in in the future!!\n\nDefinitely recommend stopping in if you’re in the area! Will be coming back. 🍻","rating":5,"time":"3 months ago"},{"text":"During the entire trip in Pittsburgh they had the best food. Very high level.\n\nThe chorizo meatballs were so moist and so delicious with ricotta.\n\nTheir pretzel with cheese was very good.\n\nAnd their pierogies were amazing.\n\n*** The Philly cheesesteak was not that great*** It needed a layer of mayonnaise in between the meat and the meat was way overdone.","rating":5,"time":"3 months ago"},{"text":"This was a great place to get drinks and appetizers to share. Unique atmosphere. Large drink menu with history of the building in the back. Friendly service.","rating":5,"time":"4 weeks ago"}],"photos":[{"ref":"places/ChIJKT2mUrXzNIgRP_zITVG6-1s/photos/AU_ZVEFK2F0FSgMCDzWTCISqm-59Zyp-5M09UTPUx  Carissa can navigate around cheese on the menu. The 5,600 reviews and landmark status make it more tourist attraction than hidden gem — Niki, this is the opposite of your discovery philosophy. Worth it if someone hasn't been, but your group probably already knows it.","_intentResults":[{"keywords":["outdoor","patio","outside","terrace","garden"],"intent":"outdoor","label":"Outdoor seating","field":"outdoor_seating","hit":true,"miss":false,"unknown":false},{"keywords":["beer","brew","tap","draft","ale","ipa"],"intent":"beer","label":"Beer","field":"serves_beer","hit":true,"miss":false,"unknown":false}]},{"name":"Hop Farm Brewing Company","address":"5601 Butler St, Pittsburgh","full_address":"5601 Butler St, Pittsburgh, PA 15201, USA","rating":4.6,"review_count":293,"price_level":null,"type":"Brewery","description":null,"open_now":true,"today_hours":"Saturday: 12:00 – 11:00 PM","outdoor_seating":true,"serves_beer":true,"serves_wine":null,"serves_cocktails":null,"serves_coffee":null,"dine_in":null,"live_music":null,"good_for_groups":null,"allows_dogs":null,"google_maps_url":"https://maps.google.com/?cid=15008126899042861328&g_mp=Cidnb29nbGUubWFwcy5wbGFjZXMudjEuUGxhY2VzLlNlYXJjaFRleHQQAhgEIAA","website":"http://hopfarmbrewingco.com/","location":{"lat":40.4845124,"lng":-79.9480268},"reviews":[{"text":"Beautiful area. absolutely love the lights and the live edge tables.\nthe 4 stars is because I really wanted to play darts but they have the old school dart boards. I cant drink some brews AND do math!\nThe pool tables were beautiful too. gorgeous old wood.\nThis place is a nice quiet vibe on a Thursday!","rating":4,"time":"4 weeks ago"},{"text":"Let me say that this brewery has a lot of IPAs: that is a positive for me. They let us taste around 5 different beers before we made a decision. We got a few beers and started with nachos. The nachos were good, a bit pricey, but good. We didn’t love the beer cheese so I wouldn’t start with this again. Their menu has a lot so no concerns.\n\nWe decided to get their Yinser Cheesesteak and I would get it again. It was big, the cheesesteak was very good (slightly on the sweet side). The only way to improve this meal is grill the bun but that is preference.\n\nWe got here and no one was here but by the time we left there was 20 or more. The bartender was great: super friendly and he was a great guide. The place was slightly loud in the main room but they have a lot of space to spread out; there are other areas you can go to for large groups or groups that want a quieter environment.\n\nThe key…I WILL BE HERE AGAIN.","rating":4,"time":"a month ago"},{"text":"Hop Farm is a great place to grab a beer. The tap list has enough variety for everyone to like something. They have many different places inside where you can sit and drink. I like the social hall on the right side of the building. It’s open, has TVs, lots of seating, and pool tables.","rating":5,"time":"5 months ago"},{"text":"Great service. The bartender was very friendly. The food was amazing. The buffalo mac and cheese was out of this world. The beer was amazing. We will definitely be back.","rating":5,"time":"10 months ago"},{"text":"Hop Farm has been one of my Favorite breweries for years, however I’ve never posted a review! Great service, beer and yummy burgers ! Plus the space is spacious with beautiful wood details!","rating":4,"time":"11 months ago"}],"photos":[{"ref":"places/ChIJo5vWsfbyNIgREEFv8eWTR9A/photos/AU_ZVEE9BJDbkha7Al751PexUCyUEXo95sfddkpGzAGW9aR4fUbNi92s1O14W3fCk7dobHdqCnufsph3Ls4-4jobbpPU7qKYrgDjwnYNI6suovx6sA6f3-YAH1CH3CORU6iQ3wrCT6Cuy4tUZh8g2JSO8fRqvWCGWvIpa5AiFXOSXBqVZoDbK1Z2nUKVtKb5rSbj7UhaQAKUW82aZaAIaMXWw_8kczfyRgxo4r1rc99KLzib19WjJnTcrWzdvRrX3EyIfWm1stnN5BNccbFi00dtGqnaHg3I-gmV7MPxlnAuHP5KHoIQ6-qUf2iyB2kp7l2eIup052vLddORGcjDg6_xu-oQclwq-ozR6kW3_BZWS3AZLiTBpM6HXXMbnQ4D7gSrlDBeFg_IjLvcLU9K0UK9KNBF2fGKksF6pZ6El20Tcj5wnSYXJKzeIB8n4m9qNWsm","width":4000,"height":3000,"_relevance":1.7999999999999998,"_visionScore":8},{" rm vibe.","open_now":true,"today_hours":"Saturday: 11:00 AM – 12:00 AM","outdoor_seating":true,"serves_beer":true,"serves_wine":true,"serves_cocktails":true,"serves_coffee":null,"dine_in":true,"live_music":false,"good_for_groups":true,"allows_dogs":null,"google_maps_url":"https://maps.google.com/?cid=6499084990302328537&g_mp=Cidnb29nbGUubWFwcy5wbGFjZXMudjEuUGxhY2VzLlNlYXJjaFRleHQQAhgEIAA","website":"https://www.cinderlands.com/locations/long-story-short","location":{"lat":40.46650410000001,"lng":-79.9647863},"reviews":[{"text":"Burger was banging! Perhaps one of the best I had for real. Lame it’s only chips. And crappy chips at that. But hey. Burger was delicious! The citrus IPA was great and the Amber was also super tasty! Hard to find amber’s sometimes. Bartender dude real kind. Good vibes. Beautiful historic looking. Hooding inside. Really well lit. Enjoyed the warm ambiance. Was in a hurry to see show at thunderbird. Got my burger whipped out faster than a pittsburgher hitting an on camp with a hockey game to catch lol","rating":5,"time":"3 months ago"},{"text":"Was in from out of town. Smash burger was probably one of the best burgers I’ve ever had no joke. Had a great couple beers on tap. If you’re not giving this place 5 stars check your head.","rating":5,"time":"2 months ago"},{"text":"Stopped in for a beer and a game of pool, but stayed for the hospitality. Jesse and Brandon took care of us and were very friendly. Great place and easily a top 5 burger in Pittsburgh. Definitely stop by if you’re in Lawrenceville.","rating":5,"time":"2 months ago"},{"text":"Nice restaurant.  Has laid back vibe, bar games like pool table, darts and small video game area.  Food definitely not your chain restaurant fair.  Had the mushroom burger which was very good.  The capri sun cocktail was not overly tasty but did come in a cute drink pouch","rating":4,"time":"a year ago"},{"text":"Cool place. We went in at noon on a Saturday and it was totally empty which was odd but we did t the bar or your own table\nWould have loved more low profile and comfortable seating options to encourage staying longer","rating":4,"time":"a year ago"},{"text":"This is a nice spot to stop at in the strip for a beer. It has a large bar inside with plenty of seating, and there is also a large outside patio with a smaller bar that will just serve you drinks. Mixed drinks are also available on site and 4 packs to go. It doesn't appear they have food anymore, as their site says, so be prepared. There are some places around the area you can order from, and they allowed us to bring in outside food.","rating":4,"time":"2 years ago"},{"text":"Ribs were tough, not falling off the bone tender. The strawberry salad was not nearly as good as the strawberry salad at Mod's pizza, Mac and cheese was just ok. The waiter was super nice. The food just didn't live up to the menu description. My husband didn't enjoy his skewered shrimp either. It was so expensive for such disappointing food. Nice atmosphere. Drinks were good.","rating":2,"time":"3 years ago"},{"text":"This was an awesome stop during our Pittsburgh weekend trip. A large outdoor area is available, but we stayed inside and relaxed between the bar and wine tasting zone.\n\nBBQ is available, and the beers were great, with friendly staff and quick service. Would definitely return next time I'm in the area.","rating":5,"time":"3 years ago"}],"photos":[{"ref":"places/ChIJAS82ZknzNIgRwpAOZRJjAzk/photos/AU_ZVEEMo6tCUGfFW1zNSjLZM2lV-RH02YN_BD1DRCd_I_tOiJUpLMUgBZnE7j7bzC2Xq2onM887DvMMIcM5A_SQwWRKiE9FEFScYXFtXFGoV20I16EcS20bByZ8UPsSBc4ZkWdwFYEptAYYbEU90BLjLp0BAcHAWpCuiwc-nBc2sBandOUuP-xk0u0Jt_E8A01psjSpGX4HChTnVEhlVfCOP3zoqUlKYGofkyH-Z6kdpODyB4_0Boicw-VkP5ko-kIBHbWJNRNc6Fe5HXgb9ZfYpsfg59-GDfxQ4D2iGyyBkCeC3IZqn8avbbaqIdc7N_cK62mlk-kbZmkzrxU31O4t0AuDnmqewYT8bowIdoIU3Rq-DCx3xDG2Z0gSXE5YUTO1X3F9JYPLavB_Kc7eAwDlaHNwekbNll5WaF1eFLhDNwynQUV6","width":4800,"height":3600,"_relevance":2.1,"_visionScore":8},{"ref":"places/ChIJAS82ZknzNIgR rating":4.3,"review_count":561,"price_level":"PRICE_LEVEL_MODERATE","type":"Brewpub","description":"Elevated bar bites & house beers are served in a rustic-meets-industrial setting with a warm vibe.","open_now":true,"today_hours":"Saturday: 11:30 AM – 11:00 PM","outdoor_seating":true,"serves_beer":true,"serves_wine":true,"serves_cocktails":true,"serves_coffee":null,"dine_in":true,"live_music":null,"good_for_groups":null,"allows_dogs":null,"google_maps_url":"https://maps.google.com/?cid=399346881054018224&g_mp=Cidnb29nbGUubWFwcy5wbGFjZXMudjEuUGxhY2VzLlNlYXJjaFRleHQQAhgEIAA","website":"https://www.cinderlands.com/","location":{"lat":40.4559512,"lng":-79.9792792},"reviews":[{"text":"My absolute favorite place to visit for a beer when I’m in the Strip District. Their buffalo chicken dip is also one of the best I’ve had. I’ve also attended plenty of events here that they put on and it’s always enjoyable. Always a great atmosphere! I highly recommend checking out Cinderlands!","rating":5,"time":"2 months ago"},{"text":"Great selection of beer and food was good, wing special on Thursday. Got a 4 pack of the Fuerig Smoked Schwarzbier, a collaboration with Noble Creature Wild Ales & Lagers. Delicious","rating":5,"time":"6 months ago"},{"text":"Glad to know Pittsburgh is doing a few things right. This brewery being one of them. It's in 'The Strip,' and don't worry, they won't have Las Vegas Strip style pricing here. There's street parking and a giant parking lot right next door. Lots of construction going on in this area. So, The Strip is up and coming? There's plenty of indoor/outdoor seating, including bar stools. Had a couple beers and read a book at the bar. Social anxiety mixed with love of craft beer. If that's you, too, expect some overhead comments like, 'I thought this was a bar,' from the sassy, heartless bartender. Discomfort!\n\nBeer time: Tracks Again is a fine traditional pilsner. Squish Ice is a modern hop-forward West Coast pilsner. Don't see too many of those, and it's a good one. Get it while you can. Strawberry Yinzerade is a nice sour, and was the visit's taste highlight. Bombs in Pop Space, another fruited sour, had lots of terrific blended fruit flavors, softened with some lactose for that milkshake taste. The Coffee & Orange Nitro Milk Stout was gross. Not recommended. The piña colada inspired Rooftop Colada wheat beer was an unexpected treat.","rating":4,"time":"7 months ago"},{"text":"My husband wanted to try the IPA's. I'm not a beer drinker and usually find breweries to have limited other options. This place has a full bar and their margarita is very good. We also loved the Red pizza and the Smoked Brisket Wrap. Both 10/10! The downstairs is bar service, just order from the table and they bring it out, there's cornhole and a few other tabletop games set up. Upstairs is table service with a section of open air seating!","rating":5,"time":"10 months ago"},{"text":"Where to even start? I visited Cinderlands Warehouse and it was amazing! Truly a gem—gorgeous space, really good beer and cocktails, and the food? Absolutely delicious.\nThe place has two floors and a deck for outdoor seating, which is perfect when the weather’s nice. Since this is where they brew their beer, I had to try something local. I went with the Lil Cinder Mango—a classic American light lager made with real mango purée and flavor. It’s the perfect summer sipper!\nAlso tried Cindi’s Hard Mountain Tea, and as a fan of all things iced tea, this was a dream. It’s a hard iced tea, steam brewed and fizz-free, served over ice—super refreshing.\nFrom the bites menu, we had:\nCheese curds: perfectly crispy, served with marinara.\nBrussels sprouts: sunflower pesto, cherry tomatoes, couscous, aged provolone, and pistachios. This flavor combo was out of this world—truly a standout dish.\nWe happened to go on a Thursday, which meant Wing Night—tip: mark your calendar! Wings are just $1 each, available in 6 or 12-piece orders. The dry rub flavor was delicious.\nWe also tried a variety of mains:\nRed Pizza: a classic—marinara with a blend of cheddar, fontina, and parmesan. Simple and so good.\nCrunch Wrap: shredded beef, Fritos, beer cheese, enchilada sauce, and Aleppo sour cream. Absolutely delicious.\nSmashed Wagyu Burger: two wagyu patties with grilled onions, dijonnaise, American cheese, bread & butter pickles, all on a Mediterra challah bun. Super fresh and tasty. All sandwiches come with chips too!\nCinderlands has a few locations around the city, and they also sell their beer in bars and through local distributors. But the Warehouse location? Highly recommend checking it out!","rating":5,"time":"11 months ago"}],"photos":[{"ref":"places/ChIJM5JDtenzNIgRsIpiW9_DigU/photos/AU_ZVEEKxJFORpnIC3sf0-OmFeigf55EkRillneMXU3tnqPLn-kWr50k6wctaoHGy0_eBbHo170z32tLyXjQISRzFfyNVxYLIGfW6JBHE1IW6naGfEGpSlcvoxdAWpaadzn7h9FykX0nwpM8Pt4txQeyY8PvT9oI4VKRCgXwNJgCyuaT_Z52OX05ohhRiQPq4X5C7rsyFa6p0TF3iwSI0HEg6JsDuPXMweaDtdht0a_Qdjt3F8SH3nqFbd2fG8HkGRM8yl5fzyxbcDVf3pm-8qtZKVYxpjvqgkVKT-xuI-4BrscICg","width":4800,"height":3200,"_relevance":2.3,"_visionScore":8},{"ref":"places/ChIJM5JDtenzNIgRsIpiW9_DigU/photos/AU_ZVEHa7fhuI19LqYhJXCq3EPTyKKORHJhL7uq05PT_NJzn1rDYhymfKE-dbixiFcbHBYNzZXCvHDRWHUUsib610-yQPq1IriA3m6hAQ3cFKCgtVTRPO4UG8yAKd8yiJwchrDOZ8XG5tL93hFwz_-MiKDAEv4JT7SCesZ_UxCeFXBVu3NuCVScOnssGROvheyKPqugHE30it2p3kWNESAn_eOMzofB2kJCgrU4gBUM5hLBGPEWdB9nBTF-nHQou4NcCeEMTT_XSWA7ZuImIDCjG1YqkrbdtRNQYGZitZ8Jsxb_8dWTkax8xKROyfbVPHxPOYfBKbxIxfg0dZc3os6Fj-IrkxZHioqLQIYwKwSqaNbzLt0rUxyioxG_jCHdNKwb3KenwqxWvOL5oqvA8uv-7EyFtXpkIZnm7Mt4w2-z0pag","width":4032,"height":3024,"_relevance":1.9,"_visionScore":6},{"ref":"places/ChIJM5JDtenzNIgRsIpiW9_DigU/photos/AU_ZVEG_-n-78mmkVZuARmDgmKXlurz8b-v6hm6ynDbubZYrWLy1ANHlh21XqxmB9WnGez8TS97LnexexKJmUJru9Ix98ICj6PzPmmmd1_A5lZCrl703kLHv5sSprXMXJwf7G2oULD9yaaLXGfQCyFIJBKpLOOLec8BpSRtKF7wrNSQMmQAaYuZxiT6cVCwNzIrSuXzh_cbkC8nzABvTuFJcxItGg1Cvzi9SzsIZtC0N1viH8Ruoc-7vrHIA_R-ovV3NZ2LOMC_EebxgqjHxt42CvfubHjaWleuGI6v_RC5S A","website":"http://www.lincolnavenuebrewery.com/","location":{"lat":40.4962984,"lng":-80.0567071},"reviews":[{"text":"I will give it one star for service and drinks. Drinks were tasty and at a good price. Even for bar food, the food was horrendous. Potato skins were bland and had zero taste. We ordered the brisket burger and were given some kind of bacon cheeseburger instead. Didn’t realize it until halfway through. The meat was burnt to a char and dry (see picture)\nAlso ordered the sliders, which were okay  but the meat was still overcooked and dry. If I ever come here again, I will be sure to only order the drinks.","rating":2,"time":"9 months ago"},{"text":"Had a get together for my dad's birthday.   there was plenty of seating when we arrived.  we got our drink orders promptly.  We had some time to look over the food menu, which was amazing!  Good selection of food; from burgers and wraps to mac'n'cheese and pizza.  Portion size was amazing too!  I had enough food to take home and have leftovers.  Some of us even stayed trivia night later on.  Would definitely come back!","rating":5,"time":"3 months ago"},{"text":"We enjoyed the flights, and every beer we tried was really good. Unfortunately, they had karaoke that night, and the volume was so loud that conversation was nearly impossible. The space is just too small for that level of sound, which really took away from the experience. We were honestly relieved when it was time to leave.\n\nAside from that, everything else was great. The smash burger was excellent, though the Reuben didn’t quite hit the mark. I’d recommend going when there isn’t live music.","rating":5,"time":"a month ago"},{"text":"Went for a meetup for friend. Had the Rye IPA which was delish. Bands played mostly fun interpretations of classic rock.\n\nGOOD family place. Goodly amount of kids.\n\nI've eaten food here before and liked it but don't remember specifics.","rating":5,"time":"2 months ago"},{"text":"This is my favorite brewery in Pittsburgh. The beer is solid the food is great. The owners are the loveliest people. Don’t expect a quick visit, everything in the kitchen is homemade and made to order so it might be a minute but it is totally worth it. They have specials every week which keeps the menu fresh all while keeping their all stars (PICKLE DIP!!). I love this place so much, it’s just the perfect friendly brewpub vibe.","rating":5,"time":"6 months ago"}],"photos":[{"ref":"places/ChIJcUhssQP1NIgRCkrSkx7XmlI/photos/AU_ZVEFa2V0k6y5gLw5iiKL3pXQJxuXBq7biCwizvmBg_vTslaIFFz4xhMjIzCUrhDaH0pB1SN_HJAkAkrUVu2WwF7dykzdzuXFnCcxUlWVJAFoouEzCBZJENFsDQnLzxTH6Y19SrRrp1QATRQ0X5MjfWx5EEo_PL6LiOgHQ9yTNqWK-FhNKo5kvs64WQ8gAtTIoLM9eUTt5nBYJxG57d49VmUboTqISmitAiUMrOtXfMKF_ZG39XPC_pa-U8jC2UegCcpJFneOtprA3B1qwAo4P4_WdmcbefYwJgqPO8pRqyBAIt7iwciHL2dkpJqQDbXD0pfTwF9hxGbBIvy3QiFG60Fm0XoipgINozz0n4weXwDhYsIczgJqA5Pljetz59QtAM-XOpcpBdiJ9uE_mGmn8BIhGfSo9f-Jrnmyf9bmIpdGpoodo","width":3599,"height":2699,"_relevance":2.2,"_visionScore":8},{"ref":"places/ChIJcUhssQP1NIgRCkrSkx7XmlI/photos/AU_ZVEGdtKKQcqNc0IqPL_jjgFGIisihY6t-n9jgtqckuTDd3grWG16iIeLe6V0Y8-zU7F0jrt9967a-WfHOCAgK_XHiv0DkmbJlvMFQ6OEAvzeAcM2HdRkIFhNYRZl_ZjWdRJ2sBuHJgB6iZ2oHXN-LHpq_txOAIiU7YnKXCS81dMXVdWxDqp_z1sIlRKzJS_QIgBoSKiO4mdhxgThOYIAtK0rsKqssT5Rh4uy0EbKWFIw1IeBV7vrC0BnH_6fNRcdbC-gU7eLBI5tBhbjRhV95p_w2HZ--K8t8nmKAYLgkeHgHSYvwpWAzSrdTJ95rJUv0Li_XYnv3MhyeUKBkxuPDWZ1Rjj2cB2WYJXcAGIk5e75Ym5jqyg0pDPWIsBE6n6LLDLP5aOwVTYka0Ivm_V04YTs5whaQmgnVA4HmyLaP0zdjomo","width":4000,"height":3000,"_relevance":1.5999999999999999,"_visionScore":6},{"ref":"places/ChIJcUhssQP1NIgRCkrSkx7XmlI/photos/AU_ZVEEfqv9fSmMpJltoSO4UMkAU1YUD0cEfnOfcrchJViybqd_sggOLUex2AK8mE-n5SaYmKa9M2N4OF3_EkvEr9ee9kbCgKtfPtJxH0-ohmpbNmYPjXPocgP33EAxWqsEagLuh4aQxlROzO8gdbMFaUD6RzjG2Rmzl9Y6z4AqqWKeF1Uwz39hpXwELXiVcp5tul_qEKxrXjHNyatSYlllw-O-vqSamJnfji4Y8DnxosrC3PKpkfRrg_k0mkVYYrNUSoEIywJDgMuSP-vtRZdeJ2L0cDxH8Znw7uwCQsym9PaKfwg","width":2732,"height":2048,"_relevance":1.4000000000000001,"_visionScore":2},{"ref": E","type":"Brewery","description":"House brews & more flow from the many taps at this casual brewpub with comfort fare & a bottle shop.","open_now":true,"today_hours":"Saturday: 10:00 AM – 11:00 PM","outdoor_seating":true,"serves_beer":true,"serves_wine":null,"serves_cocktails":null,"serves_coffee":null,"dine_in":null,"live_music":null,"good_for_groups":null,"allows_dogs":null,"google_maps_url":"https://maps.google.com/?cid=7075312046122340446&g_mp=Cidnb29nbGUubWFwcy5wbGFjZXMudjEuUGxhY2VzLlNlYXJjaFRleHQQAhgEIAA","website":"https://chimerabrewingpgh.com/","location":{"lat":40.3642129,"lng":-80.02244499999999},"reviews":[{"text":"Stopped in for lunch and will definitely be coming back! They have 18 of their own beers on draft in addition to some guest taps. I got a flight of four 5oz tasters and liked everything I tried. Their mushroom, pepper, and swiss hoagie was absolutely delightful - the perfect comfort meal on a cold December afternoon. The service was fast and friendly - my food came out before I even finished the first 5oz taster!","rating":5,"time":"4 months ago"},{"text":"Chimera Brewing is a beautiful combination of quality, atmosphere, and value. Add the fantastic staff and you have found a home. I enjoy the beer selection and the creative menu items, but I keep coming because of the way I am treated. I love this place.","rating":5,"time":"a month ago"},{"text":"Love the food, the beer, and the friendly vibe! Trains passing by while munching on some great food. Highly recommend.","rating":5,"time":"4 weeks ago"},{"text":"I have been to this place two times since I moved to Pittsburgh and each time was not a disappointment! On this visit I tried the Cherry Crew Beer and I really liked it. The Getting Buff Pizza is to die for, oh yummy too! They have a great beer list which some they brew themselves. The food menu has some different choices that other places don’t offer , which makes them even yummier! I would definitely stop and check this place out. Also has outside seating at picnic tables during the warm season. 😋","rating":5,"time":"a month ago"},{"text":"Came here on a Wednesday night after finishing some errands in the area. Their site is where the former Mindful Brewing was located, which we never experienced so not sure how much changed with new ownership. Overall, we were satisfied with the service, beer/beverage options, and expansive food menu. Beers were average, but food was surprisingly good. Started with the pickle dip and curds - very unique and tasty. In addition, we both ordered burgers - mine was the Chimera Smash and my husband went with the Mushroom Swiss. Honestly - one of the best smash burgers I’ve had. Super juicy and loved the bun, seasonings, and toppings. They also give you an option for regular fries or sweet potato fries (usually my preference). You can sub a gluten free bun or plant-based burger for a slight up-charge. If we are ever in the area again, we would like to take advantage of the outdoor seating area with shaded tables and fire pits.","rating":4,"time":"9 months ago"}],"photos":[{"ref":"places/ChIJ7U-39OL5NIgRXhAqwNGOMGI/photos/AU_ZVEHfZUordQy9x3eYaMx5tjCS1t5HbSB-HqcRcyR3w9h0_Ks53YzlXzeEEz3SpiYNCK4whluFIRV-j1jzlxrYO2goV7C52dhugX4m-weGHhHJgj6TZLELk6j8WQmS8M3tQqP-3IXh4Dbx2r3Oksegidd-1eFIZvlBotE6YGGjPtlPpWq-ed2kft002nD6hXI0mSZE6OK5gCtNq7M12QXlRi0gccwi7a_kmB2g5-KD8xdlSw74jY0b0PYorooR5kyqJ3tl-QWbPWR1aTRn6WLr7mL8rYopyhwhBeW86qBmYVhXPQ","width":4800,"height":3600,"_relevance":2.3,"_visionScore":8},{"ref":"places/ChIJ7U-39OL5NIgRXhAqwNGOMGI/photos/AU_ZVEGXv2eZOwgWXBHX5ZvaZyYLlP0f0XAGviPToTVSilYIo6laoxQUVeJIxTsK8714SbHTijUUOKcI699GI-PC4YecTVwygJGulXCboMUvBGBUykEPbabeevV8gVHTIa37n0M4MSDdxXwLCG7hJXqAwAbwpsVDJck-yahhsVOfwlPaqFjATpLpw6PcGzoJzNnQif-k8pur2kZgN7nYXFgxoDkWH3_JKkBiWaWALZhuSk3quSlamehokdjZf3shcrQjakcnNIh6pq-Q4C0-zQkMUnI9kD143oewGNi1mKcXs3PNX45jildj8UAUgJxXxPutOHCO9WOvNzckE3Ki2q3RdJ27zqIIrBduj8sT0VguHmae-VxEmgdN7NtT0pB-lnyDr0CftnQARIO3OS733SyYrl9YTRL3bCGujSlnnUSDED8","width":4032 // === PERSON POPUP ===
function showPerson(name) {

  var html = '<h3>' + name + '</h3>';
  if (p) {

    if (p.drinks && p.drinks.length) html += '<div class="pp-detail"><span>Drinks:</span> ' + p.drinks.join(', ') + '</div>';

// === LIGHTBOX ===
var lbPhotos = [];
var lbIndex = 0;

function openLightbox(photos, index) {
  lbPhotos = photos;
  lbIndex = index || 0;
  renderLightbox();
  document.getElementById('lightbox').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('show');
  document.body.style.overflow = '';
}

function lbNav(dir) {
  lbIndex = (lbIndex + dir + lbPhotos.length) % lbPhotos.length;
  renderLightbox();
}

function renderLightbox() {
  document.getElementById('lbImgWrap').innerHTML = '<img src="' + lbPhotos[lbIndex] + '" alt="">';
  document.getElementById('lbCounter').textContent = (lbIndex + 1) + ' / ' + lbPhotos.length;
  var dots = lbPhotos.map(function(_, i) {
    return '<span' + (i === lbIndex ? ' class="active"' : '') + '></span>';
  }).join('');
  document.getElementById('lbDots').innerHTML = dots;
}

// Swipe support for lightbox
(function() {
  var wrap = document.getElementById('lbImgWrap');
  var startX = 0;
  wrap.addEventListener('touchstart', function(e) { startX = e.touches[0].clientX; });
  wrap.addEventListener('touchend', function(e) {
    var dx = e.changedTouches[0].clientX - startX;
    if (Math.abs(dx) > 50) lbNav(dx < 0 ? 1 : -1);
  });
  // Close on escape
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') lbNav(-1);
    if (e.key === 'ArrowRight') lbNav(1);
  });
})();

// === HELPERS ===
function esc(s) { if (!s) return ''; var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function scoreColor(s) { return 'hsl(' + (s * 120) + ',75%,42%)'; }
function haversine(a, b) {
  if (!a || !b) return Infinity;
  var R = 6371, dLat = (b.lat - a.lat) * Math.PI / 180, dLng = (b.lng - a.lng) * Math.PI / 180;
  var x = Math.pow(Math.sin(dLat/2),2) + Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.pow(Math.sin(dLng/2),2);
  return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
}

var selectedIndex = 0;
var map = null;
var markers = [];

// === RENDER CARDS ===
function render() {
  var content = document.getElementById('content');
  content.innerHTML = '';

  // Group by match type
  var groups = { perfect: [], likely: [], partial: [], alternative: [] };
  DATA.scored.forEach(function(p, i) { (groups[p._matchType] || groups.alternative).push({ p: p, i: i }); });

  var labels = {
    perfect: 'Exactly what you asked for',
    likely: 'Probably a good fit',
    partial: 'Partial match',
    alternative: 'Different vibe but interesting'
  };

  var order = ['perfect', 'likely', 'partial', 'alternative'];
  var globalRank = 0;

  order.forEach(function(type) {
    var items = groups[type];
    if (!items.length) return;

    var label = document.createElement('div');
    label.className = 'section-label';
    label.innerHTML = labels[type] + ' <span class="count">(' + items.length + ')</span>';
    content.appendChild(label);

    items.forEach(function(item) {
      globalRank++;
      var p = item.p;
      var i = item.i;
      var card = document.createElement('div');
      card.className = 'card' + (selectedIndex === i ? ' selected' : '');
      card.id = 'place-' + i;
      card.onclick = function() { selectPlace(i); };

      var distStr = '';
      if (p._distKm != null) {
        distStr = p._distKm < 1 ? Math.round(p._distKm * 1000) + 'm' : p._distKm + 'km';
      }

      var mapsUrl = p.google_maps_url || ('https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(p.name + ' ' + (p.address || '')));

      card.innerHTML =
        '<div class="card-top">' +
          '<div>' +
            '<div class="card-name">' + globalRank + '. ' + esc(p.name) + '</div>' +
            '<div class="card-meta">' +
              (p.rating ? '<span style="font-weight:600">\u2605 ' + p.rating + '</span><span class="dot">\u00b7</span>' : '') +
              (p.review_count ? '<span>' + p.review_count.toLocaleString() + '</span><span class="dot">\u00b7</span>' : '') +
              (distStr ? '<span>' + distStr + '</span><span class="dot">\u00b7</span>' : '') +
              (p.type ? '<span>' + esc(p.type) + '</span>' : '') +
              (p.open_now === true ? '<span class="dot">\u00b7</span><span class="open">Open</span>' : '') +
              (p.open_now === false ? '<span class="dot">\u00b7</span><span class="closed">Closed</span>' : '') +
            '</div>' +
          '</div>' +
          '<div class="card-score" style="background:' + scoreColor(p._overall) + '">' + Math.round(p._overall * 100) + '</div>' +
        '</div>' +
        '<div class="card-narrative">' + esc(p._narrative) + '</div>';

      // Photo strip
      if (p.photos && p.photos.length && DATA.apiKey) {
        var photoUrls = p.photos.map(function(ph) {
          return 'https://places.googleapis.com/v1/' + ph.ref + '/media?maxHeightPx=800&maxWidthPx=1200&key=' + DATA.apiKey;
        });
        var thumbs = photoUrls.slice(0, 4).map(function(url, pi) {
          return '<img src="' + url.replace('800','300').replace('1200','400') + '" loading="lazy" alt="" onclick="event.stopPropagation();openLightbox(' + JSON.stringify(photoUrls).replace(/"/g,'&quot;') + ',' + pi + ')">';
        }).join('');
        card.innerHTML += '<div class="photo-strip">' + thumbs + '</div>';
      }

      // Evidence excerpts from reviews
      if (p.evidence && p.evidence.length) {
        var evHtml = p.evidence.map(function(ev) {
          return '<div class="evidence-quote">"' + esc(ev.text) + '" <span class="ev-tag">' + ev.category + '</span></div>';
        }).join('');
        card.innerHTML += '<div class="evidence">' + evHtml + '</div>';
      }

      // Action links (website, social, food-specific)
      var links = [];
      if (p.website) links.push('<a class="action-link" href="' + esc(p.website) + '" target="_blank" onclick="event.stopPropagation()">Website \u2197</a>');
      if (p.social_links && p.social_links.instagram) links.push('<a class="action-link" href="' + esc(p.social_links.instagram) + '" target="_blank" onclick="event.stopPropagation()">Instagram \u2197</a>');
      if (p.social_links && p.social_links.facebook) links.push('<a class="action-link" href="' + esc(p.social_links.facebook) + '" target="_blank" onclick="event.stopPropagation()">Facebook \u2197</a>');
      links.push('<a class="action-link" href="' + esc(mapsUrl) + '" target="_blank" onclick="event.stopPropagation()">Maps \u2197</a>');

      card.innerHTML += '<div class="action-links">' + links.join('') + '</div>';
      card.innerHTML += '<div class="card-addr"><span>' + esc(p.address || '') + '</span></div>';

      content.appendChild(card);
    });
  });
}

function selectPlace(i) {
  selectedIndex = i;
  var p = DATA.scored[i];
  if (map && p.location) {
    map.panTo({ lat: p.location.lat, lng: p.location.lng });
    map.setZoom(15);
  }
  updateMarkers();
  render();
  var el = document.getElementById('place-' + i);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// === MAP ===
function initMap() {
  if (!DATA.apiKey || !DATA.locationBias) return;
  map = new google.maps.Map(document.getElementById('map'), {
    center: { lat: DATA.locationBias.lat, lng: DATA.locationBias.lng },
    zoom: 13, disableDefaultUI: true, zoomControl: true, gestureHandling: 'greedy'
  });
  var bounds = new google.maps.LatLngBounds();
  DATA.scored.forEach(function(p, i) {
    if (!p.location) return;
    var pos = { lat: p.location.lat, lng: p.location.lng };
    bounds.extend(pos);
    var marker = new google.maps.Marker({
      position: pos, map: map, title: p.name,
      icon: { path: google.maps.SymbolPath.CIRCLE, fillColor: scoreColor(p._overall), fillOpacity: 1, strokeColor: '#fff', strokeWeight: 2, scale: 10 },
      label: { text: String(i + 1), color: '#fff', fontSize: '11px', fontWeight: '700' },
      zIndex: Math.round(p._overall * 100)
    });
    marker.addListener('click', function() { selectPlace(i); });
    markers[i] = marker;
  });
  if (DATA.scored.length > 1) map.fitBounds(bounds, 40);
}

function updateMarkers() {
  markers.forEach(function(marker, i) {
    if (!marker) return;
    var p = DATA.scored[i];
    marker.setIcon({
      path: google.maps.SymbolPath.CIRCLE,
      fillColor: scoreColor(p._overall), fillOpacity: 1,
      strokeColor: selectedIndex === i ? '#1a3a5c' : '#fff',
      strokeWeight: selectedIndex === i ? 3 : 2,
      scale: selectedIndex === i ? 14 : 10
    });
    marker.setZIndex(selectedIndex === i ? 999 : Math.round(p._overall * 100));
  });
}

// === GO ===
try { render(); } catch(e) {
  document.getElementById('content').innerHTML = '<div style="padding:20px;color:red">' + e.message + '<br><pre>' + e.stack + '</pre></div>';
}
