ime having a drink or some food and chatting.\n\nOn this last visit on a random Saturday afternoon, I fiest tried their Anniversary Dopplebock, which was a strong and intense, but altogether enjoyable beer. I then tried the Central Business District, one of the last entries in their 5 year project for nearly 100 different beers named for and dedicated to different Pittsburgh neighborhoods, which is a really cool endeavor. The beer itself had a unique herbal quality to it, and was a fun and different pilsner. My wife tried their hard lemonade, which unsurprisingly blows something like \"Mike's\" out of the water, and she really enjoyed it.\n\nAdd in an always pleasant staff and nice outdoor area that can be enjoyed by kids and furry friends, and you have a great local establishment that is worth a stop if in the area and craving a good beer and/or some hearty pizza.","rating":5,"time":"9 months ago"},{"text":"East End Brewing has always been a pleasant spot to get together for drinks and pizza. The staff is kind, the ambiance is warm, and service is smooth. The bartender Keri is really helpful, personable and knowledgeable; she knows what's good lol. She recommended the Roots Mule, and it is the best alcoholic beverage I've ever had on tap - if you like ginger, definitely come to East End Brewing and try it!","rating":5,"time":"3 months ago"}],"photo_refs":["places/ChIJERC0-YztNIgRaQpuyHiszD8/photos/AU_ZVEFyRBhMMSZIiVoy8kCAhJObmhc4Mm1BSnatGd-w9zsR57ORl_IFTOq8YT2VB7TpweL9ZPthcZCGkjbZyOW8wtxlvb0cCC5R7oXj1R6FHEWR6zSOh9DnkD41zw63rH-Bfwo3-6mssS7XQDbbU9tpOWJyYPp3NVE_5j3sT1oGVIwSgtL0r-7yY7gRiupc24udlrKCTKrIuE5sIMcxh2dqexG32pIoYwMHdeYu4B0Ex762V1aCMONX84xY1gQc2mUWrGr0UVulxF371Gkg_1nxuvG2GO_yq0OvpFSbMkQfhEOSdw","places/ChIJERC0-YztNIgRaQpuyHiszD8/photos/AU_ZVEEOCw6EPf583hMRqaTmpILIkLwBkgM5GAghCzGJ9WgV1-lcDnrgBrFf73nw4psHjdr6xFEJ7XT-8VO-quzw1qR5esYmfzXgvKwt1IeVZfDQAbA4xbHDtXV3Oe53NiJ_4YGf1dltqbvqnokFHNTgKkSYJLeF8ToqhQbAvQp-V0ZggW0rbQp2X-SAoZh-OgEYKhlMF-vCC5RDQxUXsywHIhUBhAsvmX4 orks, this is the best hangout setup on the list — the space is big enough for Jess to just relax by a fire pit while Robbie plays pickleball.","_intentResults":[{"keywords":["outdoor","patio","outside","terrace","garden"],"intent":"outdoor","label":"Outdoor seating","field":"outdoor_seating","hit":true,"miss":false,"unknown":false},{"keywords":["beer","brew","tap","draft","ale","ipa"],"intent":"beer","label":"Beer","field":"serves_beer","hit":true,"miss":false,"unknown":false}]},{"name":"Two Frays Brewery","address":"5113 Penn Ave, Pittsburgh","full_address":"5113 Penn Ave, Pittsburgh, PA 15224, USA","rating":4.8,"review_count":185,"price_level":null,"type":"Brewery","description":null,"open_now":true,"today_hours":"Saturday: 1:00 – 10:00 PM","outdoor_seating":true,"serves_beer":true,"serves_wine":null,"serves_cocktails":null,"serves_coffee":null,"dine_in":null,"live_music":null,"good_for_groups":null,"allows_dogs":null,"google_maps_url":"https://maps.google.com/?cid=3153679065706062405&g_mp=Cidnb29nbGUubWFwcy5wbGFjZXMudjEuUGxhY2VzLlNlYXJjaFRleHQQAhgEIAA","website":"https://www.twofraysbrewery.com/","location":{"lat":40.465086199999995,"lng":-79.9422204},"reviews":[{"text":"Cute neighborhood craft brewery that fits perfectly in the Garfield neighborhood of Pittsburgh.\n\nThey had 11 beers on tap when we visited, as well as ciders, wines and other alcoholic and non-alcoholic beverages.  We tried the Better Together Kolsch Style Ale and the Everybody Should Be Nice to Everyone a pale malt and wheat then conditioned on watermelon and kiwi.  They have 2-3 sizes depending upon the beer's ABV.\n\nNo, they dont have food, but you are welcome to bring in food. I swear everyone had a pizza or snack from a nearby restaurant.\n\nThere is seating inside or on a really cool patio area.  Visit their website to view a ton of information about the beers, space, specials and philosophy.  Two Frays has created an inclusive space where good people can enjoy good beer and fellowship together.","rating":4,"time":"9 months ago"},{"text":"Great little neighborhood brewery with a friendly staff. Nice indoor space with an awesome outdoor patio. The variety of beers on this trip was super on point. They had something for everyone. Even if you're not a beer fan, they had something for you: wine, non alcoholic, and a mixed drink (even dog treats for your pup!). No food on location, but you can bring your own, and there's lots of good food around the area.","rating":5,"time":"3 years ago"},{"text":"I had one of their Kolsh beers and it was tasty! Very cool place and extremely inclusive as well. They have a decent size outdoor area where about half is covered with some heat lamps. They said they enclose the outdoor area with plastic to keep the heat in. So it seems they have some extra space for winter as well.","rating":5,"time":"5 months ago"},{"text":"Truly had the time of my life, the staff and even the head Brewer or respectful caring and passionate about what they do.\n\nTruly enjoyed the tour of the brewery.\n\nA really fun space to chill and be great outdoors as well.\n\nDid I mention they allow you to bring in your own food from the local restaurants.\n\nSpak Brothers Pizza is a few doors down and paired nicely with the beer menu here\n\nAmazing place would give 10 Stars if possible wouldn't change a thing.","rating":5,"time":"4 years ago"},{"text":"Two Frays is easily one of Pittsburgh’s standout breweries. The beer is top-notch—thoughtfully brewed with a variety of styles to explore. The atmosphere is relaxed and welcoming, making it a great spot to hang out with friends or wind down after a long day. The staff is friendly and knowledgeable about the beer they serve. If you're looking for a great local brewery experience in Pittsburgh, Two Frays should be on your list.","rating":5,"time":"9 months ago"}],"photo_refs":["places/ChIJDcry0gzzNIgRReL-vmYexCs/photos/AU_ZVEEwNPoc48Esvnrd9P8y432Gdezm-CkXriFME0gIrDEa_dgsXtU_ftxUNPx3uz7sg3RTcvKWJm-Xx_-5d h","full_address":"6615 Hamilton Ave, Pittsburgh, PA 15206, USA","rating":4.9,"review_count":77,"price_level":null,"type":"Brewery","description":null,"open_now":true,"today_hours":"Saturday: 12:00 PM – 12:00 AM","outdoor_seating":true,"serves_beer":true,"serves_wine":null,"serves_cocktails":null,"serves_coffee":null,"dine_in":null,"live_music":null,"good_for_groups":null,"allows_dogs":null,"google_maps_url":"https://maps.google.com/?cid=5905976098313518062&g_mp=Cidnb29nbGUubWFwcy5wbGFjZXMudjEuUGxhY2VzLlNlYXJjaFRleHQQAhgEIAA","website":"http://jackworth.co/","location":{"lat":40.45786100000001,"lng":-79.910142},"reviews":[{"text":"Jackworth Ginger Beer, PA’s only ginger beer brewery, crafts crisp, sharp, and boldly flavored ginger beer. We got a few mixed drinks including the classic Moscow mule. The inside is really cool and staff are great. Jackworth has a cozy atmosphere so you can hang out here and have drinks for hours.","rating":5,"time":"4 months ago"},{"text":"Come for the spicy ginger beer, or grab a beer and a fernet. The alcoholic ginger beer has a bit of a strange aftertaste, and the cocktails are just okay. The crew, though, is solid — friendly and down-to-earth.","rating":4,"time":"6 months ago"},{"text":"Jackworth Ginger Beer is a singular experience. This is not the flat, flavorless soda water others peddle as ginger beer. Jackworth Ginger Beer is spicy, tasty, and refreshing. It's a cut above, and deserves all the praise it gets. At the bar, they'll mix it up in cocktails (all good) or you can take it to-go in cans to impress your friends at your next cocktail party.","rating":5,"time":"5 months ago"},{"text":"Amazing. Simply amazing. I was a fan of ginger and a fan of alcohol. But this is not a mere mix of the two. The product is unique and peerless.\n\nThis establishment could easily be mistaken for a super chic, pretentious high artisan sign of gentrification, but no. There is an old-fashioned appeal, authentic yet forward-thinking and modern. Tyler, who was tending bar, explained that they use classical techniques in their process, maintaining an authentic approach. All done in house.\n\nThe drinks are exceptional. Nothing is as crisp and refreshing as that OG JGB. The ginger flavor is strong but perfectly balanced with the mild sweetness of the beverage. The 0 proof original seems markedly sweeter than the OG JGB, offering a distinct flavor profile. The spicy 0 proof is bomb, delivering a satisfying kick. I only wish I could enjoy a hot summer day with a spicy alcoholic JGB, but it doesn’t exist… yet.\n\nThe bar itself has an inviting vibe. It’s been the greatest bar/tavern/pub I’ve patronized in recent memory. The atmosphere is relaxed, with a genuine charm that sets it apart from other places.\n\nIf you couldn’t tell, I’m super impressed and generally am critical to a point of fault. However, I don’t have a bad thing to say at all. I will be back.","rating":5,"time":"a year ago"},{"text":"Jackworth is a great spot for the whole crew due it's selection of both alcoholic and NA options. Most offerings feature their ginger beer (which is amazing), but you can get some other really great drinks as well! It's a laid back spot with really cool, and very nice people working the bar!\n\nMy favorite is the spicy ginger beer, but drinker beware, it is in fact very spicy! It packs the most ginger spice that I've ever had and I love it!","rating":5,"time":"9 months ago"}],"photo_refs":["places/ChIJoY7cUAbtNIgR7rvsX_g99lE/photos/AU_ZVEFWtRqwE6PxJupSLZ3KgaeaL8qG1sycfmFLpZdUOKyRnYyE_Aq9BzI8husZDBSMgYW2sO1r-AsZhPocSJ7-3kD9Sy9ggKZ8TrAghfyIi9pLrR5jSDL-kOZ-irjJEvu9q-08aao_VmHNq8V7d30cBaxDGMkdBrWeglXrF7hziGnTlEHfZX19Nk0W9Wg8zg8BlgoHBACJRn7kdcULUiVJYiUdTmMEckhhCAW_hYYycD7iI3ZtlDr0acu2lv_bVcJJjrrHtjsW81tGYMA05A1Lx4MWAB6_G755CDK2Pj926LYxcnUUGsjalOJN1Ng5J49ZbW6F9ldNRJYjrzeEdMUT9SY9uqmhfCQT2r3ww0ODQfPJtrIjrE7rFW53cFePnySDDEZd8AHSYIVoZeJGIQO-ZvHgHc7WWHwY3UldXM0Umudr1I0","places/ChIJoY7cUAbtNIgR7rvsX_g99lE/photos/AU_ZVEFHpzNXVCF5 s I had over several weeks and worked with me on some special requests to make the day perfect. A great place to grab or beer or host an event in Pittsburgh!","rating":5,"time":"9 months ago"},{"text":"Awesome spot not far from the strip district, yet far more quiet and featuring quite vast amount of space both indoors and outside.\n\nBrewery often has a food truck, but is walking distance from other food options if you want something from a different menu.\n\nBeers are great, and I would say rival and best some across the river from Dancing Gnome. I am a fan of a NEIPA and their options feature a greatly hazy and full of flavor profile.\n\nThis brewery also mails the classics such as their malty Maibock and refreshing Kölsch!\n\nI recommend the trip, great stuff!","rating":5,"time":"8 months ago"},{"text":"Halloween was my first time here and it was awesome. Loved everything, will definitely be returning!","rating":5,"time":"5 months ago"},{"text":"Nice outdoor area. Has a good bar vibe. We sat inside at the open window bar.  Hubby got their Kolsch.  We both liked its smooth taste.","rating":4,"time":"7 months ago"},{"text":"Excellent beer! Plenty of options, three tasters to try different styles. The rice lager was great and my aunt really enjoyed the west coast style IPA despite not normally liking hoppy beer. Cute outside patio, very shady.","rating":5,"time":"5 months ago"}],"photo_refs":["places/ChIJpwwDZ7PzNIgRd9bbaWBbXm4/photos/AU_ZVEHwE71WUdDjiJO1b950NVBntQc7R05Qb6bH-FcNXBLnQef96k5L2Mk2gvy7NJDQ4kO1W8G7fyB-wsHtYXFij-kuDXFY0LkQgmtQl12daVMeMn9v0ZGgjKR0jcNThNhIICBa_lrxk5A4Zv0cNlslN_BAUYCl5o-tTTSvsjZtV72uTGXrSG6V0vSZ5KXfbpemJNiA_IEO1QtxSWSAEa3gGIpilk1i2V1Ta6avhSXs84rhCWICIeyFtrrtPomfTDwjjpMf2QoNFowyDI88scTp9LNZOgPBMbdj2mtUeQ3kai1mOUDyvR5k5u-IdA_jGqQsgEGm-Sh5PgO1KECBByY4EryXyeHP9uBBSmF_NReL8jMfNbd90sLMmvdq5O9Qdgqv_kxX77FLn1dERhhbC0BRZPlZXDbdpNcDLVYdFXMZ3vpVCh4s","places/ChIJpwwDZ7PzNIgRd9bbaWBbXm4/photos/AU_ZVEFBS-a1Te9hGDyT6eStIHgUVyVZzoBJXc5u3btCIuq8ZUp6eZyjphR sland fish tacos! Also excellent 2 filled me up and took the 3rd to the hotel for a late night snack. Then pineapple coleslaw was a nice surprise. The tacos needed some spice so I asked for some Choulua hot sauce and it was complete! Loved this place!","rating":5,"time":"5 months ago"},{"text":"This is definitely your spot for game day adventures. Didn’t get to try any of the food but it was a standard bar menu. The beer options were expansive and they had drinks for everyone. Heated patio for winter games and open patio for summer time! This is a great place to stop for Steelers Sunday","rating":4,"time":"3 months ago"},{"text":"Stopped by today for the first time and sat at the bar.  Our bar tender, Nick was very attentive and provided us with some samples before we ordered our beer.  We ordered the smoky wings as an appetizer and they were the best wings I’ve had in years, better than any wings in Pennsylvania. The chicken meat was smoked to perfection and the BBQ sauce was on point.  Nick recommended the cheese steak sandwich which was amazing.  The meat was flavorful along with the cheese sauce and the bread had an amazing char flavor to it along with grill marks.  It was a decadent food experience which was made thanks to the suggestions made by our bar tender Nick.  The ambiance was great and we will definitely be back.","rating":5,"time":"5 months ago"},{"text":"Food was good. Interesting crowd…. Came on a Sunday and the Steelers have a home game on Monday… the $5 bites is confusing because we were told it wasn’t valid today….. it’s Sunday and there’s not a home game today…. And they were out of chips and chili.. overall would not come back…. Also 3 of the servers are sitting on their phones at a table behind us while our drinks are empty","rating":1,"time":"2 months ago"},{"text":"I was a first time guest. We were a little late for our reservation due to gps issues. We were greeted by a very friendly girl who took us to our seat. They were very busy so I wo 5wbGFjZXMudjEuUGxhY2VzLlNlYXJjaFRleHQQAhgEIAA","website":"http://www.independentpgh.com/","location":{"lat":40.4377098,"lng":-79.91950990000001},"reviews":[{"text":"It’s a cute little intimate bar. They have a good collection of beer from around the globe and also some cocktails. I particularly liked their cider and beer with raspberry in it. I forgot what the name was. The food was okay, but not particularly impressive. What stood for me was definitely the ambience, which was the perfect mix of cozy yet lively. The vibes were really good, and I really enjoyed my time. I can see myself coming back here.","rating":5,"time":"a year ago"},{"text":"Eclectic bar themed around \"gonzo journalism.\" Primarily beer and wine, with a few mixed drinks (which were quite good), but said beer and wine selections were interesting and far outside what you might normally find at a bar in this area, e.g. lambic beers and orange wine.","rating":4,"time":"a month ago"},{"text":"Underwhelmed and disappointing. We finally got to visit and really liked the vibe. It's a cute bar and small seating area. Ambiance is fun with lots of fun things on the wall. Once we sat down, the menu was overpriced and disappointing. We got the smash burger and po boy. Burger was good but really small for $15. Po boy was big but bread was not fresh and a bit stale at the ends. Salad with po boy was just sad. Not worth $16. Drink menu is online QRCode and was just not our taste. Wine list was not good. Cocktails are way over priced. Im sure they only use the best ingredients but not for me. The reason for 2 stars.. they include 20% gratitudity. If you are in Squirrel Hill and are going to charge such high prices.. your clientele will tip. We normally over tip but having it added was disappointing and we won't be going back. This place has such potential and wish this place the best.","rating":2,"time":"2 years ago"},{"text":"Great space and aesthetic bar, good beer & attentive service","rating":5,"time":"2 months ago"},{"text":"Take the required 20% tip off.  A required tip isn’t a tip - it’s the price.\n\nIn general - has an urban upper middle class feel w upscaled bar-leaning American food.  It’s nice quality.   The larger vibe is cozy and close and kinda works.\n\nThe servers and waitstaff were also kind, truly helpful, and accommodating.\n\nHowever, don’t force charge me 20% extra - and even further - only tell me when I get the bill\n\nThis company has a history of morally grey stuff like this.  Hidden Harbor next door - same company, same kitchen - used to give you a bill w auto 20% included, hiding that it’s added to the bill under three pieces of paper. You saw a bill w one total number, w no mention of tip. It still had an audacious line to ‘add your tip’!   More!   Server of course not mentioning anything.  I will never forget it.\n\nYou want to add a required cost?  Add it to the price, be honest about it.\n\nAt the end, I feel mixed, it’s a fine establishment on the surface level stuff, but at the end, I find myself avoiding places like this","rating":3,"time":"7 months ago"}],"photo_refs":["places/ChIJu0zpBwDyNIgRb1a-kD1qSxE/photos/AU_ZVEFZ69tBq4sbym8MxTNlqzq26u-mrL5T46Y1CISs6aO04mGeDIYoR0ked96qpdm62Xdf_138ScQxxStaZnMAFXKu06GxnrRz2ydcuzFPVOJElAEDNdeM-SFndhUs-rpOVkLyywXAEyxUUo28qmTgxiWgpn-vfPrFn4_rTXpYzY2xamTrHDw7sHpbQ38GxCEi54xqCqsw7Z4kgMEVeVudqVr3tAAUZrCr384z6Bscy87Q7CsDjXieW4tv1H05-HXkiMwAsEaW7VSWMzoUN6oE5biOBz2Dpyliqwgj7og9EqbRyQ","places/ChIJu0zpBwDyNIgRb1a-kD1qSxE/photos/AU_ZVEEH1wRH-YAN13GjBYdNnCRAb0GC5or6WotjP8_d0E_H6BVW4-HuFxixxUDgxEDe_XdktZlqNUrvOBHUizqCWeFWMb-ZjVpMg3ypPk5Qp8EPW8QScRAbSJhUV4zPcCQhPpGiKvpklFzAy8v1J_v7a9T9sukjU7c1bdOt41puaGTYPE-2-sREqAfouCJqTv-dX4c-sLlLrUqK1YDSiEBV27ZaxRA6j1oAOn0Xnx_3pPaGMOAOCRA5hW6Z4Jf6rsl5ZG_kRxF40dX9VTUh97RQFUXnG0ZQ7L93WVQmhrofpvj21V1pPinc9WYu0imJwV6HBpLzZVcFEmkIl9_EM9UzXq9EjLeJDpIk7WDxP_UZhI_sCDBJLDXoq7PZKPaAqRMEWF2fCh59EkQ_HjKFGTvgpKnaeN95ezynS2XDE5sGLwhyPEJk","places/ChIJu0zpBwDyNIgRb1a-kD1qSxE/photos/AU_ZVEEVYw r first stop if you're heading out early afternoon. As a late-afternoon destination, this checks every single box for all four of you — food, drinks variety, outdoor seating, chill atmosphere, and almost zero drive.","_intentResults":[{"keywords":["outdoor","patio","outside","terrace","garden"],"intent":"outdoor","label":"Outdoor seating","field":"outdoor_seating","hit":true,"miss":false,"unknown":false},{"keywords":["beer","brew","tap","draft","ale","ipa"],"intent":"beer","label":"Beer","field":"serves_beer","hit":true,"miss":false,"unknown":false}]},{"name":"Trace Brewing","address":"4312 Main St, Pittsburgh","full_address":"4312 Main St, Pittsburgh, PA 15224, USA","rating":4.5,"review_count":395,"price_level":null,"type":"Brewery","description":null,"open_now":true,"today_hours":"Saturday: 8:00 AM – 11:00 PM","outdoor_seating":true,"serves_beer":true,"serves_wine":null,"serves_cocktails":null,"serves_coffee":null,"dine_in":null,"live_music":null,"good_for_groups":null,"allows_dogs":null,"google_maps_url":"https://maps.google.com/?cid=8719725429755085074&g_mp=Cidnb29nbGUubWFwcy5wbGFjZXMudjEuUGxhY2VzLlNlYXJjaFRleHQQAhgEIAA","website":"http://www.tracebloomfield.com/","location":{"lat":40.464085,"lng":-79.953357},"reviews":[{"text":"This is genuinely some of the best beer I've EVER had. Staff was amazing, atmosphere is incredible and the vibes are just right. Perfect place to hang out with friends, especially outside on the patio. I love how inclusive they are & the emphasis they put on their community :)","rating":5,"time":"3 months ago"},{"text":"I dig this place. There was a Kellerbier on tap, and although not my go-to style, this beer was excellent! I also enjoyed the sour and the Bourbon barrel aged imperial stout with vanilla. This weekend I was supporting queer, women and black owned breweries. Cheers! 🍻","rating":4,"time":"a year ago"},{"text":"Trace is a brewery that not only offers a fantastic product, but always a warm and welcoming experience. My husband and I live right outside of Philadelphia and ALWAYS make it a point to stop at Trace when we're back in the area visiting family. Em is an absolute gem who provided us with a 10/10 experience. Very knowledgeable & welcoming. We always look forward to our next trip back to Pitt to be able to bring some of Trace back home to share!","rating":5,"time":"a year ago"},{"text":"2nd year catering a Holiday Party here.  When I came in to clean up this morning, I was offered a cup of coffee, which I gladly accepted.   He asked what kind of coffee I liked, he asked a few questions about my preference and I went about finishing my cleanup. On in my way out we chatted a little bit about the different kinds of beers offered and he handed me a cup of the most delicious cup of mocha coffee I ever tasted in my life.  Thank you made Em, you truley made my day with that perfectly crafted cup of love.","rating":5,"time":"3 months ago"},{"text":"3.5/5\nService 3/5 tried to talk with staff felt like i was a burden and there was only one other patron there.\nDrinks 3.75/5 pretty good offerings above average.\nAtmosphere 4.5/5 cool building nice patio intimate fireplace. Warm and cozy feeling.\nWe parked on the street but might be tough if they get busy dunno if there's much available locally?\nOverall I'd go here again and recommend it if someone was in the area and looking to try something new. Don't know that I'll be going out of my way to return.","rating":3,"time":"3 years ago"}],"photo_refs":["places/ChIJP8urYiDzNIgREgF-SxSwAnk/photos/AU_ZVEHZoyDEXZjO08bSUmoX8eykvwdHZlfNqED3iAKSYTMVHdGcEnVjAQ1PJ5W_pJAXX2mglQwPAcPqdTLxI2bFT-qeUbEhWqIO-TkYh3FJsZFWQ3yquxeMlUoiH9hd_Pmv62Wlm0dH57Rt-6e6CWw5GVNYEiukMAnencsXcpz2kdZm8zCJ4LfXeFRl7GJgzK9aGGkYwbHTP4LWtrPKJBWQqcfhFsf3167E5uxIkbtc8GATl3pO1PYsRaA-FTJLfzkbEgbuIUnxuX196vhABpyTquobQOAGNdUqSeQ2a5zOFAhPsw","places/ChIJP8urYiDzNIgREgF-SxSwAnk/photos/AU_ZVEE4vrpS_61BwxrZz8m8waUpr8oyXAo4JYHWIRWfPrSmh0ZtXCYxDfx8LUdYYq_PaqlwbeG1_1dB_yk9BGO5aZAjiKv5YWB9_wKX0 t","_matchLabel":"Exactly what you want","_pros":["5 min drive","Outdoor seating","Beer","Open until 11:00 PM"],"_cons":[],"_narrative":"Bloomfield beer garden at 5 minutes with a food truck always parked outside — 'always' is the key word since most places rotate and you won't get burned showing up to nothing. Also serves coffee, giving it a neighborhood-hangout feel Jess would gravitate toward. Not the flashiest pick but possibly the most reliable for guaranteed outdoor seating plus food plus low-key vibes. Strong contender for the whole group, especially if you want zero guesswork.","_intentResults":[{"keywords":["outdoor","patio","outside","terrace","garden"],"intent":"outdoor","label":"Outdoor seating","field":"outdoor_seating","hit":true,"miss":false,"unknown":false},{"keywords":["beer","brew","tap","draft","ale","ipa"],"intent":"beer","label":"Beer","field":"serves_beer","hit":true,"miss":false,"unknown":false}]},{"name":"The Church Brew Works","address":"3525 Liberty Ave, Pittsburgh","full_address":"3525 Liberty Ave, Pittsburgh, PA 15201, USA","rating":4.3,"review_count":5602,"price_level":"PRICE_LEVEL_MODERATE","type":"Restaurant","description":"Former church is now a lofty space for house-brewed beers, plus a mix of pizza, pierogi & bratwurst.","open_now":true,"today_hours":"Saturday: 11:45 AM – 11:00 PM","outdoor_seating":true,"serves_beer":true,"serves_wine":true,"serves_cocktails":true,"serves_coffee":true,"dine_in":true,"live_music":false,"good_for_groups":true,"allows_dogs":false,"google_maps_url":"https://maps.google.com/?cid=6628096134965951551&g_mp=Cidnb29nbGUubWFwcy5wbGFjZXMudjEuUGxhY2VzLlNlYXJjaFRleHQQAhgEIAA","website":"http://www.churchbrew.com/","location":{"lat":40.4619861,"lng":-79.9640806},"reviews":[{"text":"I've been here twice now, and I'll summarize by saying great atmosphere, great food, poor service.\n\nThe atmosphere is to die for, pictures don't do it justice. The warm lighting and music choices add to it as well. The food is fantastic, everything from perogies to French onion soup are great. But both times I went, the service was as if I was a problem for showing up. Wait times were slow, and waitstaff inattentive and disinterested in my asks. If they're overworked, I get it. Otherwise, the service level is getting in the way of the otherwise amazing experience.","rating":3,"time":"3 months ago"},{"text":"Came here for dinner with the family. Everyone enjoyed their meals and the portions are large. The wings had a maple mustard sauce, different but really good. Peirogis were fantastic. I enjoyed the Kobe beef cheesesteak. It was decent, but being from Philly, I am hard judge on cheesesteaks.","rating":4,"time":"a month ago"},{"text":"Had a great experience at The Church Brew Works. The food was excellent — fresh, flavorful, and came out hot. The beer was great as well, lots of good options and everything I tried was solid.\n\nOur server Mecca was polite, kind, and very attentive the entire time, which made the experience even better. Great service, thanks Mecca!!\n\nThe interior was clean and well-kept, including the tables and dining area. Even the bathroom was spotless, which says a lot about how well the place is taken care of. This place has huge potential as a brewery and I cannot wait to stop in in the future!!\n\nDefinitely recommend stopping in if you’re in the area! Will be coming back. 🍻","rating":5,"time":"3 months ago"},{"text":"During the entire trip in Pittsburgh they had the best food. Very high level.\n\nThe chorizo meatballs were so moist and so delicious with ricotta.\n\nTheir pretzel with cheese was very good.\n\nAnd their pierogies were amazing.\n\n*** The Philly cheesesteak was not that great*** It needed a layer of mayonnaise in between the meat and the meat was way overdone.","rating":5,"time":"3 months ago"},{"text":"This was a great place to get drinks and appetizers to share. Unique atmosphere. Large drink menu with history of the building in the back. Friendly servi or service","category":"food","keyword":"food","source":"review","review_rating":3},{"text":"The food is fantastic, everything from perogies to French onion soup are great","category":"food","keyword":"food","source":"review","review_rating":3},{"text":"Had a great experience at The Church Brew Works","category":"food","keyword":"eat","source":"review","review_rating":5}],"_distKm":3.6,"_driveMin":5,"_overall":0.8143692635748648,"_matchType":"perfect","_matchLabel":"Exactly what you want","_pros":["5 min drive","Outdoor seating","Beer","Open until 11:00 PM"],"_cons":[],"_narrative":"The iconic converted-church setting is genuinely cool — Carissa would appreciate the atmospheric architecture with its wood and stained glass. Full food menu (pizza, pierogi, bratwurst) plus cocktails and wine means everyone's covered for drinks and Carissa can find cheese-free plates. Five minutes out. But 5,600 reviews and a 4.3 rating suggest tourist-trap territory, and at this point most Pittsburghers have already been. If someone in the group hasn't seen it, the space alone is worth one visit.","_intentResults":[{"keywords":["outdoor","patio","outside","terrace","garden"],"intent":"outdoor","label":"Outdoor seating","field":"outdoor_seating","hit":true,"miss":false,"unknown":false},{"keywords":["beer","brew","tap","draft","ale","ipa"],"intent":"beer","label":"Beer","field":"serves_beer","hit":true,"miss":false,"unknown":false}]},{"name":"Hop Farm Brewing Company","address":"5601 Butler St, Pittsburgh","full_address":"5601 Butler St, Pittsburgh, PA 15201, USA","rating":4.6,"review_count":293,"price_level":null,"type":"Brewery","description":null,"open_now":true,"today_hours":"Saturday: 12:00 – 11:00 PM","outdoor_seating":true,"serves_beer":true,"serves_wine":null,"serves_cocktails":null,"serves_coffee":null,"dine_in":null,"live_music":null,"good_for_groups":null,"allows_dogs":null,"google_maps_url":"https://maps.google.com/?cid=15008126899042861328&g_mp=Cidnb29nbGUubWFwcy5wbGFjZXMudjEuUGxhY2VzLlNlYXJjaFRleHQQAhgEIAA","website":"http://hopfarmbrewingco.com/","location":{"lat":40.4845124,"lng":-79.9480268},"reviews":[{"text":"Beautiful area. absolutely love the lights and the live edge tables.\nthe 4 stars is because I really wanted to play darts but they have the old school dart boards. I cant drink some brews AND do math!\nThe pool tables were beautiful too. gorgeous old wood.\nThis place is a nice quiet vibe on a Thursday!","rating":4,"time":"4 weeks ago"},{"text":"Let me say that this brewery has a lot of IPAs: that is a positive for me. They let us taste around 5 different beers before we made a decision. We got a few beers and started with nachos. The nachos were good, a bit pricey, but good. We didn’t love the beer cheese so I wouldn’t start with this again. Their menu has a lot so no concerns.\n\nWe decided to get their Yinser Cheesesteak and I would get it again. It was big, the cheesesteak was very good (slightly on the sweet side). The only way to improve this meal is grill the bun but that is preference.\n\nWe got here and no one was here but by the time we left there was 20 or more. The bartender was great: super friendly and he was a great guide. The place was slightly loud in the main room but they have a lot of space to spread out; there are other areas you can go to for large groups or groups that want a quieter environment.\n\nThe key…I WILL BE HERE AGAIN.","rating":4,"time":"a month ago"},{"text":"Hop Farm is a great place to grab a beer. The tap list has enough variety for everyone to like something. They have many different places inside where you can sit and drink. I like the social hall on the right side of the building. It’s open, has TVs, lots of seating, and pool tables.","rating":5,"time":"5 months ago"},{"text":"Great service. The bartender was very friendly. The food was amazing. The buffalo mac and cheese was out of this world. The beer was amazing. We will definitely be back.","rating":5,"time":"10 months ago"},{"te and welcoming. We had a private event there, and they were very hospitable, and the space was perfect. If you have been to Hough's before, the place has the same layout, but I am looking forward to seeing how it grows. The kitchen isn't open yet but also hoping they end up getting some small plates or something. Overall a good spot to go and have a beer!\n\nThey had some popcorn available for snacking and 4 packs to go. There were also some non-alcoholic beverages available.","rating":5,"time":"a year ago"},{"text":"A lovely place with a variety of craft beer that's been sorely lacking in this neighborhood! Sam graciously opened the back room for us to host a private event with our running club. The service and atmosphere was perfect. I'm excited to see what the vibe is like when the kitchen opens in 2025!","rating":5,"time":"a year ago"},{"text":"Mondays customer service and atmosphere was great. It was our first time visiting and the beer was good. As someone who just passed the BJCP I was excited to check them out and try a few things. Unfortunately because of the food service connected to them I can’t leave 5 stars. We tried to order some plain fries due to my wife being lactose intolerant and was rudely told no we don’t do that. Which if you can’t leave off the cheese whatever that’s fine but it didn’t need to be said with such a tone like we were attacking the business. Smash n fried could learn from Mondays staff. We would have stayed for more the one beer but the tone the worker had behind the counter soured our experience. I have been in the service industry my entire career and hate leaving reviews but it’s getting old seeing customer service decline.","rating":3,"time":"3 months ago"},{"text":"Mondays helped me host an event in their taproom.  It was the perfect venue, and the drinks from Mondays and food from Smashed'n Fried were amazing.  Great addition to the Greenfield neighborhood.","rating":5,"time":"4 months ago"},{"text":"Such good beer! Particula er","hit":true,"miss":false,"unknown":false}]},{"name":"Cinderlands Warehouse","address":"2601 Smallman St, Pittsburgh","full_address":"2601 Smallman St, Pittsburgh, PA 15222, USA","rating":4.3,"review_count":561,"price_level":"PRICE_LEVEL_MODERATE","type":"Brewpub","description":"Elevated bar bites & house beers are served in a rustic-meets-industrial setting with a warm vibe.","open_now":true,"today_hours":"Saturday: 11:30 AM – 11:00 PM","outdoor_seating":true,"serves_beer":true,"serves_wine":true,"serves_cocktails":true,"serves_coffee":null,"dine_in":true,"live_music":null,"good_for_groups":null,"allows_dogs":null,"google_maps_url":"https://maps.google.com/?cid=399346881054018224&g_mp=Cidnb29nbGUubWFwcy5wbGFjZXMudjEuUGxhY2VzLlNlYXJjaFRleHQQAhgEIAA","website":"https://www.cinderlands.com/","location":{"lat":40.4559512,"lng":-79.9792792},"reviews":[{"text":"My absolute favorite place to visit for a beer when I’m in the Strip District. Their buffalo chicken dip is also one of the best I’ve had. I’ve also attended plenty of events here that they put on and it’s always enjoyable. Always a great atmosphere! I highly recommend checking out Cinderlands!","rating":5,"time":"2 months ago"},{"text":"Great selection of beer and food was good, wing special on Thursday. Got a 4 pack of the Fuerig Smoked Schwarzbier, a collaboration with Noble Creature Wild Ales & Lagers. Delicious","rating":5,"time":"6 months ago"},{"text":"Glad to know Pittsburgh is doing a few things right. This brewery being one of them. It's in 'The Strip,' and don't worry, they won't have Las Vegas Strip style pricing here. There's street parking and a giant parking lot right next door. Lots of construction going on in this area. So, The Strip is up and coming? There's plenty of indoor/outdoor seating, including bar stools. Had a couple beers and read a book at the bar. Social anxiety mixed with love of craft beer. If that's you, too, expect some overhead comments like, 'I thought this was a bar,' from the sassy, heartless bartender. Discomfort!\n\nBeer time: Tracks Again is a fine traditional pilsner. Squish Ice is a modern hop-forward West Coast pilsner. Don't see too many of those, and it's a good one. Get it while you can. Strawberry Yinzerade is a nice sour, and was the visit's taste highlight. Bombs in Pop Space, another fruited sour, had lots of terrific blended fruit flavors, softened with some lactose for that milkshake taste. The Coffee & Orange Nitro Milk Stout was gross. Not recommended. The piña colada inspired Rooftop Colada wheat beer was an unexpected treat.","rating":4,"time":"7 months ago"},{"text":"My husband wanted to try the IPA's. I'm not a beer drinker and usually find breweries to have limited other options. This place has a full bar and their margarita is very good. We also loved the Red pizza and the Smoked Brisket Wrap. Both 10/10! The downstairs is bar service, just order from the table and they bring it out, there's cornhole and a few other tabletop games set up. Upstairs is table service with a section of open air seating!","rating":5,"time":"10 months ago"},{"text":"Where to even start? I visited Cinderlands Warehouse and it was amazing! Truly a gem—gorgeous space, really good beer and cocktails, and the food? Absolutely delicious.\nThe place has two floors and a deck for outdoor seating, which is perfect when the weather’s nice. Since this is where they brew their beer, I had to try something local. I went with the Lil Cinder Mango—a classic American light lager made with real mango purée and flavor. It’s the perfect summer sipper!\nAlso tried Cindi’s Hard Mountain Tea, and as a fan of all things iced tea, this was a dream. It’s a hard iced tea, steam brewed and fizz-free, served over ice—super refreshing.\nFrom the bites menu, we had:\nCheese curds: perfectly crispy, served with marinara.\nBrussels sprouts: sunflower pesto, cherry tomatoes, couscous, aged provolone, and pistachios. This flavor combo was out of this world—truly a standout dish.\nWe happened to go on a Thursday, which meant Wing Night—tip: mark your calendar! Wings are just $1 each, available in 6 or 12-piece orders. The dry rub flavor was delicious.\nWe also tried a variety of mains:\nRed Pizza: a classic—marinara with a blend of cheddar, fontina, and parmesan. Simple and so good.\nCrunch Wrap: shredded beef, Fritos, beer cheese, enchilada sauce, and Aleppo sour cream. Absolutely delicious.\nSmashed Wagyu Burger: two wagyu patties with grilled onions, dijonnaise, American cheese, bread & butter pickles, all on a Mediterra challah bun. Super fresh and tasty. All sandwiches come with chips too!\nCinderlands has a few locations around the city, and they also sell their beer in bars and through local distributors. But the Warehouse location? Highly recommend checking it out!","rating":5,"time":"11 months ago"}],"photo_refs":["places/ChIJM5JDtenzNIgRsIpiW9_DigU/photos/AU_ZVEE1sDk6kuvK066YLLeyhUSSGu2GD3DrO34m0l6A3HJSO3IM7JgrXv1SsNDlWA7w4TZndcpWrGMGRwLrqAqvw-qco1Lq5R0dAlfd03R35aZTvs4VrIr1PVvvOzNjbnljbCtAUyzwjlCH3oXampyOYAgOzQTHN6i1mWjyQCglTxtBWN3hSP7_4bRPWqQNoHwyLJkk2mgv2NyKlsHOQmJR0JR5vL3_4xAkJsTt7lYcwmsXBxDSajyK6w-uC5te9gdozwrCubwGL7UT4t_HDGNhfTaopDBIMkzOSnZ12JXacDZpIw","places/ChIJM5JDtenzNIgRsIpiW9_DigU/photos/AU_ZVEFDYi_3HsHElvgpRlWr6mO3TXikAVBqQBOxLGmkfN7iQFb55e2vvwv7u-2ObmGFyl4eQI512u2uqowuGdABcwOvvxbSnfWd1wLqWV9AcOk-Z3LwenQqbyy5laqtNfeziaPuqmFkMFEhQLkGgiyu9kHfKSwlwQSEVc6hQNDWQidQ4C7zbYsN-a8CBNqHHxr3EwldBYW_BsG7a8YI27AFqvkKNtKyw50DR2G5dMPiZRLRV_gtUWi9fewcZljXyc3FQQG2k26aIzTZ59I1ddFUw7QWJo9EygZZOKat0OOEJrDF80YGvOikSvgRt2rez2Xaf4aKY4ZYQ7n3DvGqoC01kHaq8lwNPzSOFRfffOrcUw9x8iCn2c_NR2saRR15TQ6t7tmjb54U_Z8w2qn4TWXYWGxklnGHUMs5s_Pb4Xa6RBk","places/ChIJM5JDtenzNIgRsIpiW9_DigU/photos/AU_ZVEERrlBKQXqfx-Nr-pH_gxWv-__7Nag0g7JeUbtOm1YbsB9gQScXNiLwPm795nuHkMkn23qOohi98D50w8AMiNlPHhIulrJpwpPDmbfv6eeVd2TW16VjrYfBqdu1ANG-nzPKoxywPl6Nh39dvHYOBw6UaGDfyIi3mheoRF2ho3-jF5kAYQfwf_cQBg2l_7b8I56enc4fF2RTRbDrzUVyybbgqJCc452nGfIF7OU1jnbjkhYl_fLDKFgZ3q2ZtT4 rves_wine":true,"serves_cocktails":true,"serves_coffee":null,"dine_in":true,"live_music":true,"good_for_groups":null,"allows_dogs":null,"google_maps_url":"https://maps.google.com/?cid=5952306383852554762&g_mp=Cidnb29nbGUubWFwcy5wbGFjZXMudjEuUGxhY2VzLlNlYXJjaFRleHQQAhgEIAA","website":"http://www.lincolnavenuebrewery.com/","location":{"lat":40.4962984,"lng":-80.0567071},"reviews":[{"text":"I will give it one star for service and drinks. Drinks were tasty and at a good price. Even for bar food, the food was horrendous. Potato skins were bland and had zero taste. We ordered the brisket burger and were given some kind of bacon cheeseburger instead. Didn’t realize it until halfway through. The meat was burnt to a char and dry (see picture)\nAlso ordered the sliders, which were okay  but the meat was still overcooked and dry. If I ever come here again, I will be sure to only order the drinks.","rating":2,"time":"9 months ago"},{"text":"Had a get together for my dad's birthday.   there was plenty of seating when we arrived.  we got our drink orders promptly.  We had some time to look over the food menu, which was amazing!  Good selection of food; from burgers and wraps to mac'n'cheese and pizza.  Portion size was amazing too!  I had enough food to take home and have leftovers.  Some of us even stayed trivia night later on.  Would definitely come back!","rating":5,"time":"3 months ago"},{"text":"We enjoyed the flights, and every beer we tried was really good. Unfortunately, they had karaoke that night, and the volume was so loud that conversation was nearly impossible. The space is just too small for that level of sound, which really took away from the experience. We were honestly relieved when it was time to leave.\n\nAside from that, everything else was great. The smash burger was excellent, though the Reuben didn’t quite hit the mark. I’d recommend going when there isn’t live music.","rating":5,"time":"a month ago"},{"text":"Went for a meetup for friend. Had the Rye IPA which was delish. Bands played mostly fun interpretations of classic rock.\n\nGOOD family place. Goodly amount of kids.\n\nI've eaten food here before and liked it but don't remember specifics.","rating":5,"time":"2 months ago"},{"text":"This is my favorite brewery in Pittsburgh. The beer is solid the food is great. The owners are the loveliest people. Don’t expect a quick visit, everything in the kitchen is homemade and made to order so it might be a minute but it is totally worth it. They have specials every week which keeps the menu fresh all while keeping their all stars (PICKLE DIP!!). I love this place so much, it’s just the perfect friendly brewpub vibe.","rating":5,"time":"6 months ago"}],"photo_refs":["places/ChIJcUhssQP1NIgRCkrSkx7XmlI/photos/AU_ZVEFP60dm6mrpftGdj2A5ciCgX2QlWDYNL6nSL-HVWuZakBJcX5HEXUnUw40SmglyOAcGQLgu_D8yXzlIPtjgdIM5nUCQpHTWwOli_jahCdiA_M7oTBw2owB6qZrpL4Ejl6K4jwJW26WoKMaZHBGxleFPo3-b08mlyNJbMNvAHWTZHDZEZLZYgOqs9Z1VcA1QtTs0pF-WwmZiBkZIRuajqHT06cBHjUc3PUyzW8EJnXrpkT5vlJBySCdi30as2X7bSt181TAo03OgbT46ksdlQm2m6qPY7u02IWY7RrAfGI_nWg","places/ChIJcUhssQP1NIgRCkrSkx7XmlI/photos/AU_ZVEEFHAVWx9gHnYVq2Ji9D_Af0oT8-Dj5Klr1FGF7EWX_O_s_hVRqtg8RUtueOGXdA5HIbocrhkVdpNyNBdy6vYOp0DanCptD_XXTPC5v2qC-NYRmm89OBMuEOHxcRqdbFPutrHFdrfECtnQe5kIesrOtPlZZpcGVoCaIZcXmmneoZ9U8rX_-cIXG7ZuccE2NrSvhhi1YxZhu2EMCazUNL8nx0AXKDQitpps5Uof2vq-m1UW1jdSBhwJibU7fZVxqJdcQB6cCxOzpwG6jhRzmoQ31lWmqZLtrWaD1-koETFp77YVKulzFbTvv41IknGKnE2-Q80fOXpZw8blKKS_cU8GAO2O2HxToUb1uD3GZvCxUYkxjyoGKxmCyAuIWbOwZoIVeS6YFoAZuuaP8WNBmeGvu5t5bx29_5D8qZIqzYcq0EWb-","places/ChIJcUhssQP1NIgRCkrSkx7XmlI/photos/AU_ZVEFgon0A7Zntg-RahPcDDBnjnVxuBjLERU6BcP751KKpLybbI0c6G5hm0aslQj7vPj3BCX6vZj9Qsm2giqsLSLTkbJS__WlD7MPoRxXyEo1SemP0noCnDNJzovYFKM1U6hNP0jRCu7eKUsXnx3-wh23J9uxUgx5PlLvY3bgvtcTXfWvYNYVFfXBUEdqe9BSy145hDDqQxGStdl1K_lNsDNunHHS-V8wpmPJSznrR94YA6mPhdKAXJc8aJJM7ehy9_-VEZh0QEAuCp6KNWkkMXHpcbVxFRvxPq5OpCMyjELOh8a8uGBq87U20VHY-xL6b-ZrB0M-AE-DPfYGZfWsozV6CfHtUP1JguTPJBT_N5Jivrf_2nhQhszGYkn4Nn2SHi6CkYlrGdiCm7heAZP ext":"Stopped in for lunch and will definitely be coming back! They have 18 of their own beers on draft in addition to some guest taps. I got a flight of four 5oz tasters and liked everything I tried. Their mushroom, pepper, and swiss hoagie was absolutely delightful - the perfect comfort meal on a cold December afternoon. The service was fast and friendly - my food came out before I even finished the first 5oz taster!","rating":5,"time":"4 months ago"},{"text":"Chimera Brewing is a beautiful combination of quality, atmosphere, and value. Add the fantastic staff and you have found a home. I enjoy the beer selection and the creative menu items, but I keep coming because of the way I am treated. I love this place.","rating":5,"time":"a month ago"},{"text":"Love the food, the beer, and the friendly vibe! Trains passing by while munching on some great food. Highly recommend.","rating":5,"time":"4 weeks ago"},{"text":"I have been to this place two times since I moved to Pittsburgh and each time was not a disappointment! On this visit I tried the Cherry Crew Beer and I really liked it. The Getting Buff Pizza is to die for, oh yummy too! They have a great beer list which some they brew themselves. The food menu has some different choices that other places don’t offer , which makes them even yummier! I would definitely stop and check this place out. Also has outside seating at picnic tables during the warm season. 😋","rating":5,"time":"a month ago"},{"text":"Came here on a Wednesday night after finishing some errands in the area. Their site is where the former Mindful Brewing was located, which we never experienced so not sure how much changed with new ownership. Overall, we were satisfied with the service, beer/beverage options, and expansive food menu. Beers were average, but food was surprisingly good. Started with the pickle dip and curds - very unique and tasty. In addition, we both ordered burgers - mine was the Chimera Smash and my husband went with the Mushroom Swiss. Honestly - one of the best smash burgers I’ve had. Super juicy and loved the bun, seasonings, and toppings. They also give you an option for regular fries or sweet potato fries (usually my preference). You can sub a gluten free bun or plant-based burger for a slight up-charge. If we are ever in the area again, we would like to take advantage of the outdoor seating area with shaded tables and fire pits.","rating":4,"time":"9 months ago"}],"photo_refs":["places/ChIJ7U-39OL5NIgRXhAqwNGOMGI/photos/AU_ZVEEGOEV8jqy7s683WqKUmrWsNRJLodofUSvOasmRjPHayYepnrEfuthtfgOIc-BKNAWmJWzGoD0HJ_pKJTTngvdBw8nhw_YDRN753kLTjyMEFh6SH-kDRHRzsgVzNnE0RvYuy_lxf_bV2nrSVt4fcydCOV5URkGPJpLcLKiDPNCk2cKkMS_yiKCSZvx6dZ0rsvEwbwaUHDB9ZILAdbwIMVdNXge-ta0AmmJs3hGQLE0wzRtdtIuzQjl-QITXR0HvLSfQDlX-A1CPVUeDQRBvI-pwGxzZ6HF67WguDe5d9n9how","places/ChIJ7U-39OL5NIgRXhAqwNGOMGI/photos/AU_ZVEFB7edSvWuSoL_cST20xTVr-rMMiMWjqCPHRAsAJDumEl84VinXvklM7_7bPzpuZxFy852Hq7lOdijGZEmjDQpXrfeZVW5LxXqAkI-4dZxQyT820YovJKwZ3I8NcZrQYVfNflheZ5Yv5nJbhbuUw8xFnn-x13GzBJTlMyfgTD3670HvWFggOAKbfr-CGFPtK85TB2l6GbPZcDFLFZb3yIIyT9tjYt0ldhbAwrE1waTAHCT_rACMQfhKq2XmFD95RdyrbEtpLlPU102Skl8ep_ZcSYKx0lV6nKU0mEwG_vZau9e49Yi2lI75xMhdvLh2UcfhWZtQwWO-JSy8NKiZ88zFTHGJHkp9nuCBYU7gUQPflowwHGNsdxNiC5LfKqBAJ6hgeFtjF2ZN2HAixXZVkm0EmYDpKgSsmVcxMRmkMVo","places/ChIJ7U-39OL5NIgRXhAqwNGOMGI/photos/AU_ZVEGoSVty1ZhsOohIWGK231-pUgMtxXzfclcZcQAHMPOA7FIcBXZJzYIIxUzRp3YwAk6y-SvWBZ5JSv9fotbRTRsUPVXaUnH-a82oL3Z4RhTITNSdpkz90zbKDZCud6fu5QR4n-Cfn96MTC_qU2eoi9zS3gahgbjl-AgPFzmjRaEqxkdBT0Vmhd1muNdFMIYfnFmgFIEuJ0792PDDw-phMvIN2nYuhI7zTiaNE0Vo7XH6FEvwvsAeMrAxNN5I2sTmjXfUGXuTW-soIlwCB8DFjmn-riVDI-z7lWwHdCc7y0mtioOOspWOEDARoVIA-P2XIoXFo69WtZVwjAeMrYai5d8geExcMOD7PI8grdPD9cFyxXJdZeG2xMXbQu4ASwlRQKsagUAbv-ps6C7x7i7iHzHpSL_kUr8WwmO1-eMGLJGFug","places/ChIJ7U-39OL5NIgRXhAqwNGOMGI/photos/AU_ZVEG4ylQ6NFSj0lkiFaRpo4Gc3l-0nZmxsNhnzmURx9GQYrAdA2NHwGM28_i-M0rfzEBK4j_mm1HAT_oLzUk7oJxCme9Bfn0eK4n0rQrGFfkjCcAFxkM3piaEmr_yRuwcOAnuL4Z0A4TW2mqQbE9_mdKn2tkNx4WeAsgrapNf9feTEOQitwn18YPK-YKJ // === QUERY CONTEXT ===
(function() {

  var parts = [];

// === PERSON POPUP ===
function showPerson(name) {
  var p = (DATA.memberProfiles || {})[name];
  var html = '<h3>' + name + '</h3>';
  if (p) {
    if (p.role) html += '<div class="pp-role">' + p.role + '</div>';
    if (p.notes) html += '<div class="pp-notes">' + p.notes.replace(/</g,'&lt;') + '</div>';
    if (p.drinks && p.drinks.length) html += '<div class="pp-detail"><span>Drinks:</span> ' + p.drinks.join(', ') + '</div>';
    if (p.vibe) html += '<div class="pp-detail"><span>Vibe:</span> ' + p.vibe + '</div>';
  } else {
    html += '<div class="pp-notes">No profile info available.</div>';
  }
  document.getElementById('ppContent').innerHTML = html;
  document.getElementById('ppOverlay').classList.add('show');
  document.getElementById('ppPanel').classList.add('show');
}

// === HELPERS ===
function esc(s) { if (!s) return ''; var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function scoreColor(s) { return 'hsl(' + (s * 120) + ',75%,42%)'; }
function haversine(a, b) {
  if (!a || !b) return Infinity;
  var R = 6371, dLat = (b.lat - a.lat) * Math.PI / 180, dLng = (b.lng - a.lng) * Math.PI / 180;
  var x = Math.pow(Math.sin(dLat/2),2) + Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.pow(Math.sin(dLng/2),2);
  return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
}

var selectedIndex = 0;
var map = null;
var markers = [];

// === RENDER CARDS ===
function render() {
  var content = document.getElementById('content');
  content.innerHTML = '';

  // Group by match type
  var groups = { perfect: [], likely: [], partial: [], alternative: [] };
  DATA.scored.forEach(function(p, i) { (groups[p._matchType] || groups.alternative).push({ p: p, i: i }); });

  var labels = {
    perfect: 'Exactly what you asked for',
    likely: 'Probably a good fit',
    partial: 'Partial match',
    alternative: 'Different vibe but interesting'
  };

  var order = ['perfect', 'likely', 'partial', 'alternative'];
  var globalRank = 0;

  order.forEach(function(type) {
    var items = groups[type];
    if (!items.length) return;

    var label = document.createElement('div');
    label.className = 'section-label';
    label.innerHTML = labels[type] + ' <span class="count">(' + items.length + ')</span>';
    content.appendChild(label);

    items.forEach(function(item) {
      globalRank++;
      var p = item.p;
      var i = item.i;
      var card = document.createElement('div');
      card.className = 'card' + (selectedIndex === i ? ' selected' : '');
      card.id = 'place-' + i;
      card.onclick = function() { selectPlace(i); };

      var distStr = '';
      if (p._distKm != null) {
        distStr = p._distKm < 1 ? Math.round(p._distKm * 1000) + 'm' : p._distKm + 'km';
      }

      var mapsUrl = p.google_maps_url || ('https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(p.name + ' ' + (p.address || '')));

      card.innerHTML =
        '<div class="card-top">' +
          '<div>' +
            '<div class="card-name">' + globalRank + '. ' + esc(p.name) + '</div>' +
            '<div class="card-meta">' +
              (p.rating ? '<span style="font-weight:600">\u2605 ' + p.rating + '</span><span class="dot">\u00b7</span>' : '') +
              (p.review_count ? '<span>' + p.review_count.toLocaleString() + '</span><span class="dot">\u00b7</span>' : '') +
              (distStr ? '<span>' + distStr + '</span><span class="dot">\u00b7</span>' : '') +
              (p.type ? '<span>' + esc(p.type) + '</span>' : '') +
              (p.open_now === true ? '<span class="dot">\u00b7</span><span class="open">Open</span>' : '') +
              (p.open_now === false ? '<span class="dot">\u00b7</span><span class="closed">Closed</span>' : '') +
            '</div>' +
          '</div>' +
          '<div class="card-score" style="background:' + scoreColor(p._overall) + '">' + Math.round(p._overall * 100) + '</div>' +
        '</div>' +
        '<div class="card-narrative">' + esc(p._narrative) + '</div>';

      // Photo strip
      if (p.photo_refs && p.photo_refs.length && DATA.apiKey) {
        var photos = p.photo_refs.slice(0, 3).map(function(ref) {
          return '<img src="https://places.googleapis.com/v1/' + ref + '/media?maxHeightPx=300&maxWidthPx=400&key=' + DATA.apiKey + '" loading="lazy" alt="">';
        }).join('');
        card.innerHTML += '<div class="photo-strip">' + photos + '</div>';
      }

      // Evidence excerpts from reviews
      if (p.evidence && p.evidence.length) {
        var evHtml = p.evidence.map(function(ev) {
          return '<div class="evidence-quote">"' + esc(ev.text) + '" <span class="ev-tag">' + ev.category + '</span></div>';
        }).join('');
        card.innerHTML += '<div class="evidence">' + evHtml + '</div>';
      }

      // Action links (website, social, food-specific)
      var links = [];
      if (p.website) links.push('<a class="action-link" href="' + esc(p.website) + '" target="_blank" onclick="event.stopPropagation()">Website \u2197</a>');
      if (p.social_links && p.social_links.instagram) links.push('<a class="action-link" href="' + esc(p.social_links.instagram) + '" target="_blank" onclick="event.stopPropagation()">Instagram \u2197</a>');
      if (p.social_links && p.social_links.facebook) links.push('<a class="action-link" href="' + esc(p.social_links.facebook) + '" target="_blank" onclick="event.stopPropagation()">Facebook \u2197</a>');
      links.push('<a class="action-link" href="' + esc(mapsUrl) + '" target="_blank" onclick="event.stopPropagation()">Maps \u2197</a>');

      card.innerHTML += '<div class="action-links">' + links.join('') + '</div>';
      card.innerHTML += '<div class="card-addr"><span>' + esc(p.address || '') + '</span></div>';

      content.appendChild(card);
    });
  });
}

function selectPlace(i) {
  selectedIndex = i;
  var p = DATA.scored[i];
  if (map && p.location) {
    map.panTo({ lat: p.location.lat, lng: p.location.lng });
    map.setZoom(15);
  }
  updateMarkers();
  render();
  var el = document.getElementById('place-' + i);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// === MAP ===
function initMap() {
  if (!DATA.apiKey || !DATA.locationBias) return;
  map = new google.maps.Map(document.getElementById('map'), {
    center: { lat: DATA.locationBias.lat, lng: DATA.locationBias.lng },
    zoom: 13, disableDefaultUI: true, zoomControl: true, gestureHandling: 'greedy'
  });
  var bounds = new google.maps.LatLngBounds();
  DATA.scored.forEach(function(p, i) {
    if (!p.location) return;
    var pos = { lat: p.location.lat, lng: p.location.lng };
    bounds.extend(pos);
    var marker = new google.maps.Marker({
      position: pos, map: map, title: p.name,
      icon: { path: google.maps.SymbolPath.CIRCLE, fillColor: scoreColor(p._overall), fillOpacity: 1, strokeColor: '#fff', strokeWeight: 2, scale: 10 },
      label: { text: String(i + 1), color: '#fff', fontSize: '11px', fontWeight: '700' },
      zIndex: Math.round(p._overall * 100)
    });
    marker.addListener('click', function() { selectPlace(i); });
    markers[i] = marker;
  });
  if (DATA.scored.length > 1) map.fitBounds(bounds, 40);
}

function updateMarkers() {
  markers.forEach(function(marker, i) {
    if (!marker) return;
    var p = DATA.scored[i];
    marker.setIcon({
      path: google.maps.SymbolPath.CIRCLE,
      fillColor: scoreColor(p._overall), fillOpacity: 1,
      strokeColor: selectedIndex === i ? '#1a3a5c' : '#fff',
      strokeWeight: selectedIndex === i ? 3 : 2,
      scale: selectedIndex === i ? 14 : 10
    });
    marker.setZIndex(selectedIndex === i ? 999 : Math.round(p._overall * 100));
  });
}

// === GO ===
try { render(); } catch(e) {
  document.getElementById('content').innerHTML = '<div style="padding:20px;color:red">' + e.message + '<br><pre>' + e.stack + '</pre></div>';
}
