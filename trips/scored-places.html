.place-name{font-size:15px;font-weight:700;color:#1a2332;flex:1}
.place-score{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0}

.place-meta .rating{color:#1a2332;font-weight:600}
.place-meta .dot{color:#d1d5db}
.place-desc{font-size:12px;color:#374151;margin-top:6px;font-style:italic}

/* Criteria pills */
.criteria-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.crit-pill{font-size:11px;font-weight:600;padding:3px 8px;border-radius:8px;display:inline-flex;align-items:center;gap:3px}
.crit-pill.good{background:#ecfdf5;color:#059669}
.crit-pill.mid{background:#fef9ee;color:#b45309}
.crit-pill.bad{background:#fef2f2;color:#991b1b}

.weight-panel{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:20px 20px 0 0;padding:20px 16px 32px;z-index:201;transform:translateY(100%);transition:transform 0.3s ease;max-height:70vh;overflow-y:auto}

.weight-panel .close-btn{display:block;margin:16px auto 0;background:#2a6496;color:#fff;border:none;border-radius:10px;padding:10px 32px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}

/* Handle */
.drag-handle{width:40px;height:4px;background:#d1d5db;border-radius:2px;margin:0 auto 12px}

@media(min-width:641px){

// === STATE ===
const state = {
  places: DATA.places,
  criteria: DATA.criteria,
  weights: {},
  scores: [],       // [placeIndex][criterionKey] = 0-1
  overall: [],      // [placeIndex] = 0-1
  sortedIndices: [],
  selectedIndex: -1,
  map: null,
  markers: [],
};

// Init weights from criteria defaults
for (const [k, c] of Object.entries(state.criteria)) {
  state.weights[k] = c.weight;
}

// === SCORING ENGINE ===

function haversine(a, b) {
  if (!a || !b) return Infinity;
  const R = 6371;
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLng = (b.lng - a.lng) * Math.PI / 180;
  const x = Math.sin(dLat/2)**2 + Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
}

function keywordScore(text, positive, negative, partial) {
  if (!text) return 0.5;
  const t = text.toLowerCase();
  let score = 0.5;
  for (const kw of (positive || [])) { if (t.includes(kw)) score = Math.min(1, score + 0.15); }
  for (const kw of (negative || [])) { if (t.includes(kw)) score = Math.max(0, score - 0.25); }
  for (const kw of (partial  || [])) { if (t.includes(kw)) score = Math.min(1, score + 0.05); }
  return score;
}

function computeScores() {
  const places = state.places;
  const n = places.length;

  // Precompute distances
  const distances = places.map(p => haversine(DATA.locationBias, p.location));
  const maxDist = Math.max(...distances.filter(d => d < Infinity)) || 1;

  // Precompute numeric ranges
  const ratings = places.map(p => p.rating).filter(r => r != null);
  const minRating = Math.min(...ratings) || 0;
  const maxRating = Math.max(...ratings) || 5;
  const reviews = places.map(p => p.review_count).filter(r => r != null && r > 0);
  const maxLogReviews = Math.log(Math.max(...reviews) || 1);

  state.scores = [];
  state.overall = [];

  for (let i = 0; i < n; i++) {
    const p = places[i];
    const s = {};

    for (const [key, config] of Object.entries(state.criteria)) {
      if (config.type === 'boolean') {
        s[key] = p[key] === true ? 1 : p[key] === false ? 0 : 0.5;
      } else if (config.type === 'numeric') {
        if (p[key] == null) { s[key] = 0.3; }
        else {
          const range = maxRating - minRating || 1;
          s[key] = 0.3 + 0.7 * ((p[key] - minRating) / range);
        }
      } else if (config.type === 'numeric_log') {
        if (!p.review_count || p.review_count <= 0) { s[key] = 0.1; }
        else { s[key] = maxLogReviews > 0 ? Math.log(p.review_count) / maxLogReviews : 0.5; }
      } else if (config.type === 'distance') {
        const d = distances[i];
        s[key] = d < Infinity ? Math.max(0, 1 - d / maxDist) : 0;
      } else if (config.type === 'keyword') {
        const searchText = [p.name, p.type, p.description, p.address].filter(Boolean).join(' ');
        const kc = DATA.profile[key] || config;
        s[key] = keywordScore(searchText, kc.positive, kc.negative, kc.partial);
      } else {
        s[key] = 0.5;
      }
    }

    state.scores[i] = s;

    // Weighted average
    let sumWeighted = 0, sumWeights = 0;
    for (const [key] of Object.entries(state.criteria)) {
      const w = state.weights[key] || 0;
      sumWeighted += s[key] * w;
      sumWeights += w;
    }
    state.overall[i] = sumWeights > 0 ? sumWeighted / sumWeights : 0;
  }

  // Sort
  state.sortedIndices = places.map((_, i) => i).sort((a, b) => state.overall[b] - state.overall[a]);
}

// === COLORS ===
function scoreColor(score) {
  // red(0) -> yellow(0.5) -> green(1)
  const h = score * 120;
  return 'hsl(' + h + ',75%,42%)';
}
function scoreColorLight(score) {
  const h = score * 120;
  return 'hsl(' + h + ',60%,92%)';
}

// === MAP ===
function initMap() {
  if (!DATA.apiKey || !DATA.locationBias) return;

  state.map = new google.maps.Map(document.getElementById('map'), {
    center: { lat: DATA.locationBias.lat, lng: DATA.locationBias.lng },
    zoom: 13,
    disableDefaultUI: true,
    zoomControl: true,
    mapId: 'scored_places_map',
    gestureHandling: 'greedy',
  });

  const bounds = new google.maps.LatLngBounds();

  state.places.forEach((p, i) => {
    if (!p.location) return;
    const pos = { lat: p.location.lat, lng: p.location.lng };
    bounds.extend(pos);

    const score = state.overall[i];
    const color = scoreColor(score);

    const marker = new google.maps.Marker({
      position: pos,
      map: state.map,
      title: p.name,
      icon: {
        path: google.maps.SymbolPath.CIRCLE,
        fillColor: color,
        fillOpacity: 1,
        strokeColor: '#fff',
        strokeWeight: 2,
        scale: 10,
      },
      label: {
        text: String(state.sortedIndices.indexOf(i) + 1),
        color: '#fff',
        fontSize: '11px',
        fontWeight: '700',
      },
      zIndex: Math.round(score * 100),
    });

    marker.addListener('click', () => selectPlace(i));
    state.markers[i] = marker;
  });

  if (state.places.length > 1) state.map.fitBounds(bounds, 40);
}

function updateMarkers() {
  state.markers.forEach((marker, i) => {
    if (!marker) return;
    const score = state.overall[i];
    marker.setIcon({
      path: google.maps.SymbolPath.CIRCLE,
      fillColor: scoreColor(score),
      fillOpacity: 1,
      strokeColor: state.selectedIndex === i ? '#1a3a5c' : '#fff',
      strokeWeight: state.selectedIndex === i ? 3 : 2,
      scale: state.selectedIndex === i ? 14 : 10,
    });
    marker.setLabel({
      text: String(state.sortedIndices.indexOf(i) + 1),
      color: '#fff',
      fontSize: state.selectedIndex === i ? '13px' : '11px',
      fontWeight: '700',
    });
    marker.setZIndex(state.selectedIndex === i ? 999 : Math.round(score * 100));
  });
}

// === TABLE ===
function renderTable() {
  const list = document.getElementById('placesList');
  list.innerHTML = '';

  state.sortedIndices.forEach((i, rank) => {
    const p = state.places[i];
    const score = state.overall[i];
    const scores = state.scores[i];

    const card = document.createElement('div');
    card.className = 'place-card' + (state.selectedIndex === i ? ' selected' : '');
    card.onclick = () => selectPlace(i);
    card.id = 'place-' + i;

    // Distance
    let distStr = '';
    if (DATA.locationBias && p.location) {
      const d = haversine(DATA.locationBias, p.location);
      distStr = d < 1 ? Math.round(d * 1000) + 'm' : d.toFixed(1) + 'km';
    }

    // Criteria pills
    let pills = '';
    for (const [key, config] of Object.entries(state.criteria)) {
      const s = scores[key];
      if (s === undefined) continue;
      const cls = s >= 0.7 ? 'good' : s >= 0.4 ? 'mid' : s > 0 ? 'bad' : 'na';
      // For booleans, only show if true or explicitly false
      if (config.type === 'boolean' && p[key] === null) continue;
      pills += '<span class="crit-pill ' + cls + '">' + config.icon + ' ' + config.label + '</span>';
    }

    card.innerHTML =
      '<div class="place-card-head">' +
        '<div>' +
          '<div class="place-name">' + (rank + 1) + '. ' + esc(p.name) + '</div>' +
          '<div class="place-meta">' +
            (p.rating ? '<span class="rating">★ ' + p.rating + '</span><span class="dot">·</span>' : '') +
            (p.review_count ? '<span>' + p.review_count.toLocaleString() + ' reviews</span><span class="dot">·</span>' : '') +
            (distStr ? '<span>' + distStr + '</span><span class="dot">·</span>' : '') +
            (p.type ? '<span>' + esc(p.type) + '</span>' : '') +
            (p.open_now === true ? '<span class="dot">·</span><span style="color:#059669;font-weight:600">Open</span>' : '') +
            (p.open_now === false ? '<span class="dot">·</span><span style="color:#991b1b;font-weight:600">Closed</span>' : '') +
          '</div>' +
        '</div>' +
        '<div class="place-score" style="background:' + scoreColor(score) + '">' + Math.round(score * 100) + '</div>' +
      '</div>' +
      (p.description ? '<div class="place-desc">' + esc(p.description) + '</div>' : '') +
      (p.today_hours ? '<div style="font-size:11px;color:#5a6b7d;margin-top:4px">' + esc(p.today_hours) + '</div>' : '') +
      '<div class="criteria-row">' + pills + '</div>' +
      (p.address ? '<div style="font-size:11px;color:#94a3b8;margin-top:6px">' + esc(p.address) + '</div>' : '');

    list.appendChild(card);
  });
}

function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// === SORT BAR ===
function renderSortBar() {
  const bar = document.getElementById('sortBar');
  bar.innerHTML =
    '<button class="score-btn active" onclick="openWeights()">Score</button>' +
    '<button onclick="sortBy('rating')">Rating</button>' +
    '<button onclick="sortBy('distance')">Distance</button>' +
    '<button onclick="sortBy('review_count')">Popular</button>';
}

function sortBy(field) {
  if (field === 'distance') {
    state.sortedIndices = state.places.map((_, i) => i).sort((a, b) => {
      const da = haversine(DATA.locationBias, state.places[a].location);
      const db = haversine(DATA.locationBias, state.places[b].location);
      return da - db;
    });
  } else if (field === 'rating') {
    state.sortedIndices = state.places.map((_, i) => i).sort((a, b) =>
      (state.places[b].rating || 0) - (state.places[a].rating || 0));
  } else if (field === 'review_count') {
    state.sortedIndices = state.places.map((_, i) => i).sort((a, b) =>
      (state.places[b].review_count || 0) - (state.places[a].review_count || 0));
  }
  // Update active button
  document.querySelectorAll('.sort-bar button').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderTable();
  updateMarkers();
}

// === SELECTION ===
function selectPlace(i) {
  state.selectedIndex = i;
  const p = state.places[i];
  if (state.map && p.location) {
    state.map.panTo({ lat: p.location.lat, lng: p.location.lng });
    state.map.setZoom(15);
  }
  updateMarkers();
  renderTable();
  const el = document.getElementById('place-' + i);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// === WEIGHTS PANEL ===
function openWeights() {
  const container = document.getElementById('weightSliders');
  container.innerHTML = '';
  for (const [key, config] of Object.entries(state.criteria)) {
    const w = state.weights[key];
    const row = document.createElement('div');
    row.className = 'weight-row';
    row.innerHTML =
      '<div class="weight-label">' + config.icon + ' ' + config.label + '</div>' +
      '<input type="range" class="weight-slider" min="0" max="100" value="' + Math.round(w * 100) + '" ' +
        'oninput="updateWeight(&#39;'+key+'&#39;,this.value)">' +
      '<div class="weight-val" id="wv-' + key + '">' + Math.round(w * 100) + '</div>';
    container.appendChild(row);
  }
  document.getElementById('overlay').classList.add('show');
  document.getElementById('weightPanel').classList.add('show');
}

function closeWeights() {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('weightPanel').classList.remove('show');
  // Re-sort by score
  state.sortedIndices = state.places.map((_, i) => i).sort((a, b) => state.overall[b] - state.overall[a]);
  renderTable();
  updateMarkers();
  // Mark score button active
  document.querySelectorAll('.sort-bar button').forEach(b => b.classList.remove('active'));
  document.querySelector('.score-btn').classList.add('active');
}

function updateWeight(key, val) {
  state.weights[key] = val / 100;
  document.getElementById('wv-' + key).textContent = val;
  computeScores();
  // Don't re-render table while sliding (laggy), just update scores display
}

// === INIT ===
document.getElementById('queryTitle').textContent = DATA.query || 'Scored Places';
document.getElementById('resultCount').textContent = DATA.places.length + ' places found';

computeScores();
renderSortBar();
renderTable();

// Select first place by default
if (state.sortedIndices.length > 0) {
  state.selectedIndex = state.sortedIndices[0];
}
</script>
