  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<body>
  <header class="header">
    <h1 id="header-title">San Diego Restaurants</h1>
    <div class="header-actions">
      <button class="header-sources" data-action="show-sources">5 Sources</button>
      <button class="header-add" id="add-btn">+ Add</button>
    </div>
  </header>

  <div class="map-filter-banner" id="map-filter-banner" hidden>
    <span id="map-filter-text"></span>
    <button id="clear-map-filter">&times; Clear</button>
  </div>

  <main class="content" id="content"></main>

  <div class="detail-overlay" id="detail-container"></div>
  <div id="modal-container" hidden></div>

  <div class="map-drawer" id="map-drawer">
    <button class="map-drawer-tab" id="map-drawer-tab">🗺</button>
    <div class="map-drawer-content">
      <div class="map-toolbar">
        <button class="map-btn" id="map-close">&larr; Back</button>
        <div class="map-toolbar-spacer"></div>
        <button class="map-btn map-paint-btn" id="map-paint-toggle">🖌 Paint</button>
        <button class="map-btn" id="map-reset">Reset</button>
      </div>
      <div class="map-area">
        <div id="map-container"></div>
        <canvas id="paint-canvas"></canvas>
      </div>
    </div>
  </div>

  <nav class="tab-bar">
    <button class="tab-btn active" data-view="all">
      <span class="tab-icon">🍽</span>
      All
    </button>
    <button class="tab-btn" data-view="shortlist">
      <span class="tab-icon">⭐</span>
      Shortlist
      <span class="shortlist-badge" id="shortlist-count" hidden></span>
    </button>
    <button class="tab-btn" data-view="trash">
      <span class="tab-icon">🗑</span>
      Trash
    </button>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
