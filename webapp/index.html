<html lang="en">

  <link rel="stylesheet" href="css/itinerary.css?v=1779000000">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    window.__SUPABASE_URL = 'https://iavqgmvjaawerbbrckjx.supabase.co';
    window.__SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlhdnFnbXZqYWF3ZXJiYnJja2p4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0MjkwMTQsImV4cCI6MjA5MTAwNTAxNH0.MyTMPUutH6fpyrPb3skb16CW5K6Ofq4c_oQUHjHcS6M';
  </script>
</head>
<body>
  <!-- Picker root (shown when no ?g= or ?t= token) -->
  <div id="picker-root" hidden></div>

  <!-- Trip root (shown when ?t= token is present) -->
  <div id="trip-root" hidden></div>

  <!-- Itinerary root (shown when ?i= token is present) -->
  <div id="itinerary-root" hidden></div>

  <!-- App shell (shown when ?g= token is present) -->
  <div id="app-shell" hidden>
    <header class="header">
      <div class="header-left">
        <h1 id="header-title">Restaurants</h1>
        <a class="header-sources-link" id="sources-link" data-action="show-sources"></a>
      </div>
      <button class="header-pill header-pill-accent" id="filter-btn">
        ⚙ Filters
        <span class="filter-badge" id="filter-badge" hidden></span>
      </button>
    </header>

    <div class="map-filter-banner" id="map-filter-banner" hidden>
      <span id="map-filter-text"></span>
      <button id="clear-map-filter">&times;</button>
    </div>

    <main class="content" id="content"></main>

    <!-- Floating map toggle -->
    <button class="map-fab" id="map-fab">
      <span class="map-fab-icon" id="map-fab-icon">🗺</span>
      <span class="map-fab-label" id="map-fab-label">Map</span>
    </button>

    <div class="detail-overlay" id="detail-container"></div>
    <div id="modal-container" hidden></div>
    <button id="add-btn" hidden></button>

    <div class="filter-modal-overlay" id="filter-modal" hidden>
      <div class="filter-modal">
        <div class="filter-modal-header">
          <h3>Filters</h3>
          <button class="modal-close" id="filter-modal-close">&times;</button>
        </div>
        <div class="filter-modal-body" id="filter-modal-body"></div>
      </div>
    </div>

    <div class="map-drawer" id="map-drawer">
      <div class="map-drawer-content">
        <div class="map-toolbar">
          <div class="map-toolbar-spacer"></div>
          <button class="map-btn map-paint-btn" id="map-paint-toggle">🖌 Paint</button>
          <button class="map-btn" id="map-reset">Reset</button>
        </div>
        <div class="map-area">
          <div id="map-container"></div>
          <canvas id="paint-canvas"></canvas>
          <div class="map-count-bar" id="map-paint-count" hidden></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Dispatcher: pick picker vs app vs trip based on ?g= / ?t= token
    (function() {
      var p = new URLSearchParams(location.search);
      var src;
      if (p.get('g'))      src = 'js/app.js?v=1776965114';
      else if (p.get('t')) src = 'js/trip.js?v=1777380621';
      else if (p.get('i')) src = 'js/itinerary.js?v=1779000000';
      else                 src = 'js/picker.js?v=1780000000';
      var s = document.createElement('script');
      s.type = 'module';
      s.src = src;
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
